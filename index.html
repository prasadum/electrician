<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSTI Calicut · Electrician Modules</title>
<style>:root{--bg:#eef2f7;--c:#fff;--t:#152033;--m:#5a6a82;--b:#1a56cc;--ok:#1a8a4a;--bd:#cbd5e3}@media(prefers-color-scheme:dark){:root{--bg:#101722;--c:#18212f;--t:#e8eef8;--m:#9fb0c8;--bd:#2c3a50}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,'Noto Sans',sans-serif}header{background:var(--b);color:#fff;padding:18px 16px}header h1{margin:0;font-size:22px}header p{margin:4px 0 0;opacity:.9}
main{max-width:720px;margin:0 auto;padding:14px 16px 40px}.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
input{width:100%;min-height:44px;font-size:16px;padding:0 12px;margin:6px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--t)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--b);color:#fff;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}.btn.g{background:transparent;color:var(--b);border:1px solid var(--b)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}small{color:var(--m)}h2{margin:0 0 4px;font-size:18px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}</style></head><body>
<header><h1>NSTI Calicut</h1><p>Electrician learning modules</p></header><main>
<div class="card" id="who"></div><div id="list"></div>
<div id="mat"></div><p><a href="admin.html"><small>Admin</small></a></p></main>
<script src="config.js"></script><script>
const C=window.NSTI,$=s=>document.querySelector(s);let prof=null;
try{prof=JSON.parse(localStorage.getItem('nsti_profile')||'null')}catch(e){}
function readP(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
const post=b=>fetch(C.SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)}).then(r=>r.json());
function sync(){if(!prof||!C.SCRIPT_URL)return;C.MODULES.filter(m=>m.ready).forEach(m=>{const p=readP(m.key);if(!p)return;
  post({action:'save',email:prof.email,token:prof.token,batch:prof.batch||'',module:m.id,slide:(p.slide||0)+1,xp:p.xp||0,done:Object.keys(p.quiz||{}).length,data:{[m.id]:p}}).then(j=>{const s=$('#sy');if(s)s.textContent=j.ok?'Synced':'Sign in again'}).catch(()=>{const s=$('#sy');if(s)s.textContent='Offline \u2013 will sync next time'})})}
function who(){const w=$('#who');if(prof){w.innerHTML=`<div class="row"><div style="flex:1"><b>${esc(prof.email)}</b><br><small>${prof.batch?'Batch '+esc(prof.batch)+' \u00b7 ':''}<span id="sy"></span></small></div><button class="btn g" id="out">Sign out</button></div>`;
  $('#out').onclick=()=>{localStorage.removeItem('nsti_profile');prof=null;who();draw();const m=$('#mat');if(m)m.innerHTML=''}}
 else if(!C.SCRIPT_URL){w.innerHTML='<small>Offline mode. Progress is saved on this phone only.</small>'}
 else{w.innerHTML=`<h2>Sign in</h2><small>Enter your email. We send a 6-digit code. No password.</small><input id="e" type="email" placeholder="Email" autocomplete="email"><input id="b" placeholder="Batch (optional, e.g. 2026-A)"><button class="btn" id="go">Send code</button><p id="ms"><small></small></p>`;
  const ms=t=>{$('#ms').textContent=t};
  $('#go').onclick=async()=>{const em=$('#e').value.trim().toLowerCase(),bt=$('#b').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ms('Enter a valid email');return}
   ms('Sending...');try{const j=await post({action:'send',email:em});if(!j.ok){ms(j.e==='limit'?'Too many tries. Wait one hour.':'Could not send. Try again.');return}}catch(e){ms('No internet. Try again when online.');return}
   w.innerHTML=`<h2>Enter code</h2><small>Sent to ${esc(em)}. Check Inbox or Spam.</small><input id="c" inputmode="numeric" maxlength="6" placeholder="6-digit code"><button class="btn" id="vf">Verify</button><p id="ms"><small></small></p>`;
   $('#vf').onclick=async()=>{ms('Checking...');try{const j=await post({action:'verify',email:em,code:$('#c').value});if(!j.ok){ms(j.e==='wrong'?'Wrong code':'Code expired. Go back and send again.');return}
     prof={email:em,token:j.token,batch:bt||j.batch||''};localStorage.setItem('nsti_profile',JSON.stringify(prof));
     if(j.data)Object.keys(j.data).forEach(id=>{const m=C.MODULES.find(x=>x.id===id);if(m&&!readP(m.key))localStorage.setItem(m.key,JSON.stringify(j.data[id]))});who();if(window.__L)applyLib(window.__L);draw();sync()}catch(e){ms('No internet')}}}}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function draw(){if(C.SCRIPT_URL&&!prof){$('#list').innerHTML='<div class="card"><small>Sign in with the 6-digit code sent to your email to open the modules.</small></div>';const m=$('#mat');if(m)m.innerHTML='';return}
 $('#list').innerHTML=C.MODULES.map(m=>{const p=readP(m.key),pc=p?Math.round(((p.slide||0)+1)/m.slides*100):0;
 return `<div class="card"><h2>${esc(m.title)}</h2><small>${esc(m.sub)}</small><div class="bar"><i style="width:${pc}%"></i></div><div class="row"><small style="flex:1">${p?pc+'% seen':'Not started'}</small><a class="btn" href="${m.file}">${p?'Continue':'Open'}</a></div></div>`}).join('')}
function applyLib(L){const rm=L.removed||[],hd=L.hidden||[];const ex=(L.modules||[]);C.MODULES=(C.MODULES||[]).filter(m=>!ex.find(e=>e.id===m.id)).concat(ex).filter(m=>!rm.includes(m.id)&&!hd.includes(m.id));
 const R=(L.resources||[]).filter(x=>!x.hidden);const h=$('#mat');if(h)h.innerHTML=(R.length&&(prof||!C.SCRIPT_URL))?'<h2>Study material</h2>'+R.map(x=>`<div class="card"><div class="row"><b style="flex:1">${esc(x.title)}</b><a class="btn" target="_blank" rel="noopener" href="${esc(x.url)}">${x.type==='link'?'Open link':'Download'}</a></div></div>`).join(''):''}
fetch('library.json?t='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null).then(L=>{window.__L=L;if(L)applyLib(L);who();draw();sync()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){draw();sync()}});
</script></body></html>
