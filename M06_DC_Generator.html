html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:400 16px/1.35 NL,NG,NM,ND,NK,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bar{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.bar .ttl{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{min-width:44px;min-height:44px;padding:0 12px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--def);border-color:var(--def);color:#fff}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--def);outline-offset:2px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-width:44px;min-height:44px;border:0;background:var(--card);font-weight:700;font-size:14px;padding:0 8px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--def);color:#fff}
#prog{height:6px;background:var(--line);flex:none}#prog i{display:block;height:100%;width:0;background:var(--def);transition:width .25s}
#xp{font-weight:700;font-size:14px;color:var(--frm);display:none}
body.study #xp{display:inline}
#stage{flex:1;min-height:0;overflow:auto;display:flex;touch-action:pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.slide{margin:auto;width:100%;min-height:100%;display:grid;gap:10px;padding:10px 12px 14px;
  grid-template-columns:1fr;grid-template-areas:"head" "vis" "side";align-content:start}
.s-head{grid-area:head;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;border-left:8px solid var(--k);padding-left:10px}
.s-vis{grid-area:vis;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px;position:relative;min-width:0}
.s-vis svg{width:100%;height:auto;max-height:52vh;display:block;touch-action:pan-y pinch-zoom}
.s-side{grid-area:side;display:flex;flex-direction:column;gap:10px;min-width:0}
.kind-def{--k:var(--def);--kb:var(--def-bg)}.kind-law{--k:var(--law);--kb:var(--law-bg)}
.kind-formula{--k:var(--frm);--kb:var(--frm-bg)}.kind-warn{--k:var(--warn);--kb:var(--warn-bg)}.kind-tip{--k:var(--tip);--kb:var(--tip-bg)}
.kind-def .s-vis,.kind-law .s-vis,.kind-formula .s-vis,.kind-warn .s-vis,.kind-tip .s-vis{border-color:var(--k)}
.tag{font-size:14px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--kb);color:var(--k);border:1.5px solid var(--k);white-space:nowrap}
.tag.add{background:#fff6cf;color:#6a4b00;border-color:#d9a400}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tag.add{background:#3a3010;color:#ffd84a;border-color:#a98400}}
:root[data-theme=dark] .tag.add{background:#3a3010;color:#ffd84a;border-color:#a98400}
h2.term{margin:0;font-size:clamp(22px,5.4vw,30px);line-height:1.15}
.t .en{font-weight:700}.t .hi,.t .ml{display:block;font-size:14px;font-weight:400;color:var(--mut);line-height:1.25}
.t .hi,.t .ml{display:none}
h2.term .t .hi,h2.term .t .ml{display:none}
body[data-lang=hi] .t .hi,body[data-lang=all] .t .hi,body[data-lang=ml] .t .ml,body[data-lang=all] .t .ml{display:block}
body[data-lang=hi] h2.term .t .hi,body[data-lang=all] h2.term .t .hi,body[data-lang=ml] h2.term .t .ml,body[data-lang=all] h2.term .t .ml{display:inline;font-size:.7em;font-weight:400;color:var(--mut)}
h2.term .t .hi::before,h2.term .t .ml::before{content:' / ';color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--kb,var(--card));border:1.5px solid var(--k,var(--line));border-radius:10px;padding:6px 10px;font-size:16px;min-width:0}
.chip .sym{display:block;font-size:14px;color:var(--mut);font-weight:600}
.chip .sym sup,.chip .sym sub{font-size:inherit}
.hook{display:flex;gap:8px;align-items:center;font-weight:700;font-size:18px;background:var(--kb);border-radius:10px;padding:8px 10px;border:1.5px dashed var(--k)}
.hook small{font-size:14px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.beat{font-size:14px;font-weight:700;color:var(--mut);margin:0 0 4px}
.pred{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.pred .q{font-weight:700;font-size:18px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:48px;padding:6px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px;touch-action:manipulation;flex:1 1 auto;min-width:88px}

const INL=new Set(['I','B','SUB','SUP','EM','STRONG','SMALL']);
function wrapT(en,hi,ml){const sp=document.createElement('span');sp.className='t';sp.innerHTML=`<span class="en">${en}</span><span class="hi">${hi}</span><span class="ml">${ml}</span>`;return sp}
const SYM=new Set(['Vav','Vrms','Vpp','rms','sin','cos','tan','kWh','kVA','kVAR','kW','Vm','Em','rad','mm','kHz','MHz','Hz','mA','kΩ','MΩ','VAR','RMS','AC','DC','Wb']);
function needs(t){return (t.match(/[A-Za-z]{3,}/g)||[]).filter(w=>!SYM.has(w)).length>=1}
function autoT(root){if(!root)return;
 const els=[...root.querySelectorAll('*')];
 for(const e of els){if(!e.isConnected||e.closest('.t,svg,script,style,textarea'))continue;
  const kids=[...e.childNodes];if(!kids.length)continue;
  const simple=kids.every(n=>n.nodeType===3||(n.nodeType===1&&INL.has(n.tagName)&&[...n.querySelectorAll('*')].every(c=>INL.has(c.tagName))));
  if(simple){const txt=e.textContent;if(!norm(txt))continue;const r=xl(txt);
   if(r){const en=e.innerHTML;e.innerHTML='';e.appendChild(wrapT(en,r[0],r[1]));continue}
   if(needs(txt))MISS.add(norm(txt))
  }else{
   for(const n of kids){if(n.nodeType!==3)continue;const tx=n.textContent;if(!norm(tx))continue;const r=xl(tx);
    if(r){const sp=wrapT(tx.trim(),r[0],r[1]);n.replaceWith(document.createTextNode(' '),sp)}
    else if(needs(tx))MISS.add(norm(tx))}}}}
let xq=false;function xsched(){if(xq)return;xq=true;requestAnimationFrame(()=>{xq=false;autoT(document.getElementById('stage'))})}
function autoInit(){const st=document.getElementById('stage');if(!st||st.__xo)return;st.__xo=1;new MutationObserver(xsched).observe(st,{childList:true,subtree:true,characterData:true});xsched()}

/* ---- geometry helpers for flowing dots ---- */
function mkPath(pts){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,L,tot:L[L.length-1]}}
function at(P_,s){s=((s%1)+1)%1;const d=s*P_.tot;let i=1;while(i<P_.L.length-1&&P_.L[i]<d)i++;
  const a=P_.pts[i-1],b=P_.pts[i],k=(d-P_.L[i-1])/((P_.L[i]-P_.L[i-1])||1);return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]}

  const l=h('label'),id='s'+Math.random().toString(36).slice(2,7);
  l.innerHTML=`<span>${label} <span class="val"></span></span>`;
  const i=h('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=val;i.id=id;i.setAttribute('aria-label',label.replace(/<[^>]+>/g,''));
  const v=$('.val',l);const upd=()=>{v.textContent=fmt(+i.value)};
  i.addEventListener('input',()=>{upd();cb(+i.value)});upd();l.appendChild(i);host.appendChild(l);
  return{get:()=>+i.value,set:x=>{i.value=x;upd()},input:i}}

function flowDots(pts,t,n,col,spd){let L0=[0];for(let i=1;i<pts.length;i++)L0.push(L0[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));const tot=L0[L0.length-1];let s='';
 for(let k=0;k<n;k++){let d=((t*(spd||60)+k*tot/n)%tot+tot)%tot;let i=1;while(i<pts.length-1&&L0[i]<d)i++;const f=(d-L0[i-1])/((L0[i]-L0[i-1])||1),x=pts[i-1][0]+f*(pts[i][0]-pts[i-1][0]),y=pts[i-1][1]+f*(pts[i][1]-pts[i-1][1]);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.2" fill="${col||'var(--def)'}"/>`}return s}

const coilV=(x,y,n,hgt,col,sw)=>{let d=`M${x} ${y}`;const s=hgt/n;for(let i=0;i<n;i++)d+=`a9 ${s/2} 0 0 1 0 ${s}`;return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${sw||3.2}"/>`};

 const H=k=>hl===k;const g=(dx,dy,inner)=>`<g transform="translate(${dx.toFixed(1)} ${dy.toFixed(1)})">${inner}</g>`;let s='';

 s+=g(0,dn,yokeHalf(false)+pole(false)+`<path d="M96 190h40v10h-40zM246 190h40v10h-40z" fill="${IRON}" stroke="#4a5560" stroke-width="1.5"/>`);
 s+=g(0,up,yokeHalf(true)+pole(true)+`<rect x="174" y="14" width="34" height="16" rx="2" fill="${H('tbox')?'#f2b8b3':'#9aa5b1'}" ${hlS(H('tbox'))}/>`);
 /* armature group */

 a+=[[136,82],[136,132]].map(p=>`<rect x="${p[0]}" y="${p[1]}" width="108" height="6" fill="${CU}"/>`).join('');

 const cs=Math.round(((rot%30)+30)%30/6);

 s+=a;
 /* brushes + holder (move up with top half) */
 s+=g(0,up*1.4,`<rect x="270" y="58" width="22" height="16" fill="#9aa5b1" stroke="#4a5560" stroke-width="1.4"/><path d="M276 58c-6-6 6-8 0-14M286 58c-6-6 6-8 0-14" stroke="#4a5560" stroke-width="1.6" fill="none"/><rect x="274" y="72" width="14" height="${(20-6*e).toFixed(1)}" fill="${H('brush')?'var(--no)':CARB}"/>`)
  +g(0,dn*1.4,`<rect x="270" y="146" width="22" height="16" fill="#9aa5b1" stroke="#4a5560" stroke-width="1.4"/><rect x="274" y="${(128+6*e).toFixed(1)}" width="14" height="${(20-6*e).toFixed(1)}" fill="${H('brush')?'var(--no)':CARB}"/>`);
 /* end shields + bearings */
 const shield=(x,dx)=>g(dx,0,`<path d="M${x} 40h10v140h-10z" fill="${H('shield')?'#f2b8b3':'#a7b1bb'}" ${hlS(H('shield'))}/><rect x="${x-4}" y="98" width="18" height="24" rx="3" fill="${H('bear')?'#ffd9a0':'#d0d6dc'}" ${hlS(H('bear'))}/><circle cx="${x+5}" cy="103" r="2.6" fill="#555"/><circle cx="${x+5}" cy="117" r="2.6" fill="#555"/>`);
 s+=shield(72,lx)+shield(304,rx);

/* ---- end view cross-section: 2-pole, N left, S right. o: rot (rad), cur (−1..1 armature current sign scale), ip (interpoles), cw (compensating), brushAng (deg from vertical), flux mode ---- */
function machineEnd(cx,cy,o){o=o||{};const R1=96,R0=82,ra=48;let s='';
 s+=`<circle cx="${cx}" cy="${cy}" r="${R1}" fill="${IRON}" stroke="#4a5560" stroke-width="1.5"/><circle cx="${cx}" cy="${cy}" r="${R0}" fill="var(--bg)"/>`;
 /* main poles */
 [[-1,'#d9362b','N'],[1,'#2a6fdb','S']].forEach(([sd,col,lb])=>{if(o.nofield){col='#a7b1bb';lb=''}const x0=cx+sd*R0,x1=cx+sd*(ra+8);
  s+=`<path d="M${x0} ${cy-16}L${cx+sd*(ra+22)} ${cy-16}L${cx+sd*(ra+22)} ${cy-34}L${x1} ${cy-40}Q${cx+sd*(ra+4)} ${cy} ${x1} ${cy+40}L${cx+sd*(ra+22)} ${cy+34}L${cx+sd*(ra+22)} ${cy+16}L${x0} ${cy+16}Z" fill="${col}" stroke="#333" stroke-width="1.2"/>`;
  s+=`<rect x="${Math.min(x0,cx+sd*(ra+24))+ (sd<0?2:-2)}" y="${cy-30}" width="${Math.abs(x0-(cx+sd*(ra+24)))-0}" height="12" fill="${CU}" opacity=".95"/><rect x="${Math.min(x0,cx+sd*(ra+24))+(sd<0?2:-2)}" y="${cy+18}" width="${Math.abs(x0-(cx+sd*(ra+24)))}" height="12" fill="${CU}" opacity=".95"/>`;
  s+=TXC(cx+sd*(R0-12),cy+6,lb,'#fff','17');
  if(o.cw){for(let k=-1;k<=1;k++){const yy=cy+k*20,xx=cx+sd*(ra+11);s+=cond(xx,yy,(sd<0?1:-1),5)}}});
 /* interpoles top/bottom */
 if(o.ip){[[-1,'S'],[1,'N']].forEach(([sd,lb])=>{const y0=cy+sd*R0,y1=cy+sd*(ra+8);s+=`<rect x="${cx-9}" y="${Math.min(y0,y1)}" width="18" height="${Math.abs(y0-y1)}" fill="${lb==='N'?'#e98a83':'#8db4ef'}" stroke="#333" stroke-width="1.2"/>`+TXC(cx+22,cy+sd*(ra+22)+5,lb,lb==='N'?'#d9362b':'#2a6fdb','13')})}
 /* armature */
 const th=o.rot||0;s+=`<circle cx="${cx}" cy="${cy}" r="${ra}" fill="${IRON2}" stroke="#4a5560" stroke-width="1.5"/>`;
 const n=o.nocond?0:16;for(let k=0;k<n;k++){const a=th+k*TPI/n,x=cx+(ra-9)*Math.cos(a),y=cy-(ra-9)*Math.sin(a);const sgn=o.cur?(Math.cos(a)>0?1:-1)*(Math.abs(Math.cos(a))>.2?1:0):0;
  s+=`<circle cx="${(cx+(ra-9)*Math.cos(a)).toFixed(1)}" cy="${(cy-(ra-9)*Math.sin(a)).toFixed(1)}" r="7.5" fill="var(--bg)"/>`+cond(x,y,o.cur?Math.sign(o.cur)*sgn:(o.emf?(Math.cos(a)>0?1:-1)*(Math.abs(Math.cos(a))>.2?1:0):0),5.4)}
 s+=`<circle cx="${cx}" cy="${cy}" r="9" fill="#6b7580"/>`;
 /* brushes on the neutral (vertical) shifted by brushAng */
 const ba=(o.brushAng||0);[90,270].forEach(d=>{const p=pos(cx,cy,ra+2,d-ba);s+=`<rect x="${(p[0]-7).toFixed(1)}" y="${(p[1]-7).toFixed(1)}" width="14" height="14" fill="${CARB}" transform="rotate(${-(d-ba)+90} ${p[0].toFixed(1)} ${p[1].toFixed(1)})"/>`});
 return s}

 trick:L('Field + conductor + motion = EMF.','फील्ड + कंडक्टर + गति = EMF।','ഫീൽഡ് + കണ്ടക്ടർ + ചലനം = EMF.'),
 check:{q:L('Fleming’s right-hand rule: the thumb shows the …','फ्लेमिंग का राइट-हैंड रूल: अंगूठा दिखाता है …','ഫ്ലെമിംഗ് റൈറ്റ്-ഹാൻഡ് റൂൾ: തള്ളവിരൽ കാണിക്കുന്നത് …'),o:[L('motion','गति','ചലനം'),L('EMF','EMF','EMF'),L('field','फील्ड','ഫീൽഡ്')],a:0},

function loopDemo(w,api,dc){
  w.innerHTML=S(420,215,`<g id="a"></g>`,dc?'A turning coil with a split ring commutator and the output wave':'A turning coil with slip rings and the output wave');
  const rd=mkRd(w),c=mkCtl(w);let comm=dc?1:0;
  if(dc)modeBtns(c,[L('Slip rings','स्लिप रिंग','സ്ലിപ്പ് റിംഗ്'),L('Commutator','कम्यूटेटर','കമ്മ്യൂട്ടേറ്റർ')],i=>{comm=i;api.redraw()},1);
  const st=spinCtl(c,api,45);
  return t=>{const th=st.th(t),cx=100,cy=84,r=42,e=Math.sin(th),a=90+th/D2R;let s=polesSvg(cx,cy,r);
   const p1=pos(cx,cy,r,a),p2=pos(cx,cy,r,a+180);
   s+=`<path d="M${p1[0].toFixed(1)} ${p1[1].toFixed(1)}L${p2[0].toFixed(1)} ${p2[1].toFixed(1)}" stroke="var(--conv)" stroke-width="4"/>`+cond(p1[0],p1[1],e)+cond(p2[0],p2[1],-e);
   s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--mut)" stroke-width="1" stroke-dasharray="3 4"/>`;
   /* rings / commutator at the bottom */
   const ry=170;
   if(!comm){s+=`<circle cx="${cx-14}" cy="${ry}" r="11" fill="none" stroke="#c98a2b" stroke-width="5"/><circle cx="${cx+14}" cy="${ry}" r="11" fill="none" stroke="#c98a2b" stroke-width="5"/>`+TXC(cx,ry+30,'2 rings','var(--mut)')}
   else{const ang=th/D2R;s+=`<circle cx="${cx}" cy="${ry}" r="14" fill="none" stroke="var(--wire)" stroke-width="1"/>`+[0,1].map(k=>`<path d="${arcPath(cx,ry,14,ang+k*180+8,ang+k*180+172)}" stroke="#c98a2b" stroke-width="8" fill="none"/>`).join('')+TXC(cx,ry+34,'split ring','var(--mut)')}
   s+=`<rect x="${cx-34}" y="${ry-5}" width="12" height="10" fill="#444"/><rect x="${cx+22}" y="${ry-5}" width="12" height="10" fill="#444"/>`;
   const fn=comm?(x=>Math.abs(Math.sin(x))):Math.sin;
   s+=wavePlot(210,comm?150:110,190,comm?58:48,th,fn)+TXC(300,comm?185:168,comm?'DC (pulsating)':'AC','var(--frm)');
   put($('#a',w),s);
   const pk=Math.abs(Math.cos(th))<.1;
   setRd(rd,`<span>${comm?RD('Commutator: the output never reverses. It is pulsating DC.','कम्यूटेटर: आउटपुट कभी उलटता नहीं। यह पल्सेटिंग DC है।','കമ്മ്യൂട്ടേറ്റർ: ഔട്ട്പുട്ട് ഒരിക്കലും തിരിയുന്നില്ല. ഇത് പൾസേറ്റിംഗ് DC ആണ്.'):RD('Slip rings: the output is AC. Zero EMF when the coil is across the field, peak when it cuts the field.','स्लिप रिंग: आउटपुट AC। कॉइल फील्ड के आर-पार हो तो EMF ज़ीरो, फील्ड काटते समय पीक।','സ്ലിപ്പ് റിംഗ്: ഔട്ട്പുട്ട് AC. കോയിൽ ഫീൽഡിന് കുറുകെ ആയിരിക്കുമ്പോൾ EMF പൂജ്യം, ഫീൽഡ് മുറിക്കുമ്പോൾ പീക്ക്.')} · e = ${(e*100).toFixed(0)} %</span>`)}}
CS({id:'g_loop',menu:'One loop makes AC',title:'t_loop',

 hook:L('One loop, turning in a field, gives a wave that goes up, down and below zero. That is AC, not DC.','फील्ड में घूमता एक लूप ऐसी वेव देता है जो ऊपर, नीचे और ज़ीरो से नीचे जाती है। यह AC है, DC नहीं।','ഫീൽഡിൽ കറങ്ങുന്ന ഒരു ലൂപ്പ് മുകളിലേക്കും താഴേക്കും പൂജ്യത്തിന് താഴെയും പോകുന്ന വേവ് തരും. ഇത് AC ആണ്, DC അല്ല.'),
 defn:L('<b>Coil EMF:</b> a coil turning in a magnetic field gives an alternating EMF. It is zero when the coil sides move along the field. It is maximum when they cut the field squarely. One turn is one cycle.','<b>कॉइल EMF:</b> चुंबकीय फील्ड में घूमती कॉइल alternating EMF देती है। कॉइल की भुजाएँ फील्ड के साथ चलें तो ज़ीरो। फील्ड को सीधा काटें तो मैक्सिमम। एक चक्कर एक साइकिल।','<b>കോയിൽ EMF:</b> കാന്തിക ഫീൽഡിൽ കറങ്ങുന്ന കോയിൽ ആൾട്ടർനേറ്റിംഗ് EMF തരുന്നു. കോയിലിന്റെ വശങ്ങൾ ഫീൽഡിന് സമാന്തരമായി നീങ്ങുമ്പോൾ പൂജ്യം. ഫീൽഡിനെ നേരെ മുറിക്കുമ്പോൾ പരമാവധി. ഒരു ചുറ്റൽ ഒരു സൈക്കിൾ.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="A coil connected to two slip rings with brushes">${polesSvg(150,48,26)}<path d="M135 48H165" stroke="var(--conv)" stroke-width="4"/><circle cx="136" cy="86" r="8" fill="none" stroke="#c98a2b" stroke-width="4"/><circle cx="164" cy="86" r="8" fill="none" stroke="#c98a2b" stroke-width="4"/></svg>`,
 play:L('Press Spin OFF. Drag Angle to 0°, 90°, 180°. Watch the dot and the cross.','Spin OFF दबाओ। Angle को 0°, 90°, 180° पर खिसकाओ। डॉट और क्रॉस देखो।','Spin OFF അമർത്തൂ. Angle 0°, 90°, 180° എന്നിവയിലേക്ക് നീക്കൂ. ഡോട്ടും ക്രോസും നോക്കൂ.'),
 pred:{q:L('The coil sides move along the field lines (0°). The EMF is …','कॉइल की भुजाएँ फील्ड लाइनों के साथ चलती हैं (0°)। EMF …','കോയിൽ വശങ്ങൾ ഫീൽഡ് ലൈനുകൾക്കൊപ്പം നീങ്ങുന്നു (0°). EMF …'),o:[L('zero','ज़ीरो','പൂജ്യം'),L('maximum','मैक्सिमम','പരമാവധി'),L('half','आधा','പകുതി')],a:0,why:L('They are not cutting any lines of force, so no EMF is induced.','वे कोई फ्लक्स लाइन नहीं काट रहीं, इसलिए EMF नहीं बनता।','അവ ഒരു ഫ്ലക്സ് ലൈനും മുറിക്കുന്നില്ല, അതിനാൽ EMF ഉണ്ടാകുന്നില്ല.')},
 labels:['armature','flux'],hints:['phs','cyc'],rel:{c:['Φ','N','e'],h:'e'},

CS({id:'g_comm',menu:'The commutator makes DC',title:'t_comm',
 flash:FB('One loop makes AC (this module, slide 6)','एक लूप AC बनाता है (इसी मॉड्यूल की स्लाइड 6)','ഒരു ലൂപ്പ് AC ഉണ്ടാക്കുന്നു (ഈ മൊഡ്യൂൾ, സ്ലൈഡ് 6)'),
 hook:L('The coil makes AC. The outside circuit wants DC. A split ring flips the connections at exactly the right moment.','कॉइल AC बनाती है। बाहर का सर्किट DC चाहता है। स्प्लिट रिंग ठीक सही पल पर कनेक्शन पलट देती है।','കോയിൽ AC ഉണ്ടാക്കുന്നു. പുറത്തെ സർക്യൂട്ടിന് DC വേണം. സ്പ്ലിറ്റ് റിംഗ് കൃത്യ സമയത്ത് കണക്ഷൻ മാറ്റിമറിക്കുന്നു.'),
 defn:L('<b>Commutator:</b> a ring of copper segments, insulated from each other, fixed on the shaft. Each time the coil EMF would reverse, the brushes slide to the other segment. The outside current keeps one direction.','<b>कम्यूटेटर:</b> कॉपर सेगमेंट की रिंग, एक-दूसरे से इन्सुलेटेड, शाफ्ट पर कसी। कॉइल EMF उलटने वाला हो तो ब्रश दूसरे सेगमेंट पर चले जाते हैं। बाहर करंट की दिशा एक ही रहती है।','<b>കമ്മ്യൂട്ടേറ്റർ:</b> പരസ്പരം ഇൻസുലേറ്റ് ചെയ്ത കോപ്പർ സെഗ്മെന്റുകളുടെ റിംഗ്, ഷാഫ്റ്റിൽ ഉറപ്പിച്ചത്. കോയിൽ EMF തിരിയാൻ പോകുമ്പോൾ ബ്രഷുകൾ അടുത്ത സെഗ്മെന്റിലേക്ക് മാറും. പുറത്തെ കറന്റ് ഒരേ ദിശയിൽ തുടരും.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="A commutator with copper segments and two brushes"><circle cx="150" cy="50" r="30" fill="var(--card)" stroke="var(--wire)" stroke-width="3"/>${[0,1,2,3,4,5,6,7].map(i=>`<path d="M${150+30*Math.cos(i*Math.PI/4)} ${50-30*Math.sin(i*Math.PI/4)}L${150+16*Math.cos(i*Math.PI/4)} ${50-16*Math.sin(i*Math.PI/4)}" stroke="#c98a2b" stroke-width="5"/>`).join('')}<rect x="104" y="43" width="14" height="14" fill="#444"/><rect x="182" y="43" width="14" height="14" fill="#444"/></svg>`,
 play:L('Press Slip rings, then Commutator. Compare the two waves.','Slip rings दबाओ, फिर Commutator। दोनों वेव की तुलना करो।','Slip rings അമർത്തൂ, പിന്നെ Commutator. രണ്ട് വേവും താരതമ്യം ചെയ്യൂ.'),
 pred:{q:L('With a split-ring commutator, the output wave …','स्प्लिट-रिंग कम्यूटेटर से आउटपुट वेव …','സ്പ്ലിറ്റ്-റിംഗ് കമ്മ്യൂട്ടേറ്ററിൽ ഔട്ട്പുട്ട് വേവ് …'),o:[L('never goes below zero','कभी ज़ीरो से नीचे नहीं जाती','ഒരിക്കലും പൂജ്യത്തിന് താഴെ പോകില്ല'),L('is the same AC','वही AC रहती है','അതേ AC തന്നെ'),L('is a flat straight line','सीधी सपाट रेखा है','നേരെയുള്ള പരന്ന വരയാണ്')],a:0,why:L('The commutator flips the negative half upward. The output is pulsating DC.','कम्यूटेटर नेगेटिव हाफ को ऊपर पलट देता है। आउटपुट पल्सेटिंग DC है।','കമ്മ്യൂട്ടേറ്റർ നെഗറ്റീവ് പകുതിയെ മുകളിലേക്ക് മറിക്കുന്നു. ഔട്ട്പുട്ട് പൾസേറ്റിംഗ് DC ആണ്.')},
 labels:['commt','brush'],hints:['phs','flem'],
 note:L('The EMF inside the coil is still AC. Only the outside circuit sees DC.','कॉइल के अंदर EMF अब भी AC है। सिर्फ़ बाहर का सर्किट DC देखता है।','കോയിലിനുള്ളിലെ EMF ഇപ്പോഴും AC ആണ്. പുറത്തെ സർക്യൂട്ട് മാത്രമാണ് DC കാണുന്നത്.'),
 trick:L('Split ring: flip at zero.','स्प्लिट रिंग: ज़ीरो पर पलटो।','സ്പ്ലിറ്റ് റിംഗ്: പൂജ്യത്തിൽ മാറ്റൂ.'),
 check:{q:L('The coil EMF is a sine wave. At 0° it is 0 V. At 30° with a 10 V peak it is …','कॉइल EMF साइन वेव है। 0° पर 0 V। 10 V पीक पर 30° पर …','കോയിൽ EMF സൈൻ വേവ് ആണ്. 0°-ൽ 0 V. 10 V പീക്കിൽ 30°-ൽ …'),o:['5 V','10 V','3 V'],a:0},
 build(w,api){return loopDemo(w,api,true)}});

/* ---------- 7 Many coils ---------- */
const NCO=[1,2,4,8];
CS({id:'g_many',menu:'Many coils, smooth DC',title:'t_many',
 flash:FB('The commutator makes DC (this module, slide 7)','कम्यूटेटर DC बनाता है (इसी मॉड्यूल की स्लाइड 7)','കമ്മ്യൂട്ടേറ്റർ DC ഉണ്ടാക്കുന്നു (ഈ മൊഡ്യൂൾ, സ്ലൈഡ് 7)'),
 hook:L('One coil gives DC that drops to zero twice a turn. Add more coils and the dips almost vanish.','एक कॉइल ऐसा DC देती है जो हर चक्कर में दो बार ज़ीरो तक गिरता है। और कॉइल जोड़ो तो गिरावट लगभग गायब।','ഒരു കോയിൽ ഓരോ ചുറ്റലിലും രണ്ടുതവണ പൂജ്യത്തിലേക്ക് താഴുന്ന DC തരും. കൂടുതൽ കോയിൽ ചേർത്താൽ താഴ്ച ഏതാണ്ട് ഇല്ലാതാകും.'),
 defn:L('<b>Armature winding:</b> many coils are set at different angles on the armature. The brushes always pick the coils that are near their peak, so the output is nearly steady. The small remaining variation is called ripple.','<b>आर्मेचर वाइंडिंग:</b> आर्मेचर पर कई कॉइल अलग-अलग कोण पर लगी होती हैं। ब्रश हमेशा पीक के पास वाली कॉइल चुनते हैं, इसलिए आउटपुट लगभग स्थिर। बचा छोटा उतार-चढ़ाव रिपल कहलाता है।','<b>ആർമേച്ചർ വൈൻഡിംഗ്:</b> ആർമേച്ചറിൽ ഒരുപാട് കോയിലുകൾ വ്യത്യസ്ത കോണുകളിൽ വയ്ക്കുന്നു. ബ്രഷുകൾ എപ്പോഴും പീക്കിനടുത്തുള്ള കോയിലുകൾ എടുക്കുന്നതിനാൽ ഔട്ട്പുട്ട് ഏതാണ്ട് സ്ഥിരം. ബാക്കി വരുന്ന ചെറിയ വ്യതിയാനം റിപ്പിൾ.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="An armature with many slots"><circle cx="150" cy="50" r="38" fill="var(--card)" stroke="var(--wire)" stroke-width="3"/>${Array.from({length:12},(_,i)=>`<circle cx="${150+30*Math.cos(i*Math.PI/6)}" cy="${50-30*Math.sin(i*Math.PI/6)}" r="4.5" fill="#c98a2b"/>`).join('')}<circle cx="150" cy="50" r="7" fill="var(--wire)"/></svg>`,
 play:L('Slide Coils from 1 to 8. Watch the ripple percentage fall.','Coils को 1 से 8 तक स्लाइड करो। रिपल प्रतिशत गिरता देखो।','Coils 1 മുതൽ 8 വരെ സ്ലൈഡ് ചെയ്യൂ. റിപ്പിൾ ശതമാനം കുറയുന്നത് നോക്കൂ.'),
 pred:{q:L('The number of armature coils is increased. The ripple in the output …','आर्मेचर कॉइल की संख्या बढ़ाई। आउटपुट में रिपल …','ആർമേച്ചർ കോയിലുകളുടെ എണ്ണം കൂട്ടി. ഔട്ട്പുട്ടിലെ റിപ്പിൾ …'),o:[L('falls','घटता है','കുറയുന്നു'),L('rises','बढ़ता है','കൂടുന്നു'),L('stays the same','वही रहता है','അതേ നിൽക്കുന്നു')],a:0,why:L('More coils at smaller angles fill the dips between the peaks.','छोटे कोण पर ज़्यादा कॉइल पीक के बीच की गिरावट भर देती हैं।','ചെറിയ കോണുകളിൽ കൂടുതൽ കോയിലുകൾ പീക്കുകൾക്കിടയിലെ താഴ്ച നികത്തും.')},
 labels:['armature'],hints:['phs'],
 note:L('Simple model: the output follows the coil nearest its peak. Real windings add the coil EMFs in series paths, but the smoothing is the same idea.','सरल मॉडल: आउटपुट पीक के सबसे पास वाली कॉइल को फॉलो करता है। असली वाइंडिंग सीरीज़ पाथ में कॉइल EMF जोड़ती है, पर स्मूथिंग वही विचार है।','ലളിത മോഡൽ: ഔട്ട്പുട്ട് പീക്കിനോട് ഏറ്റവും അടുത്ത കോയിലിനെ പിന്തുടരുന്നു. യഥാർത്ഥ വൈൻഡിംഗ് സീരീസ് പാതകളിൽ കോയിൽ EMF കൂട്ടും, പക്ഷേ സ്മൂത്തിംഗ് ഇതേ ആശയം.'),
 ex:L('Example: 1 coil: ripple 100 %. 2 coils: about 29 %. 4 coils: about 8 %. 8 coils: about 2 %.','उदाहरण: 1 कॉइल: रिपल 100 %। 2 कॉइल: करीब 29 %। 4 कॉइल: करीब 8 %। 8 कॉइल: करीब 2 %।','ഉദാഹരണം: 1 കോയിൽ: റിപ്പിൾ 100 %. 2 കോയിൽ: ഏകദേശം 29 %. 4 കോയിൽ: ഏകദേശം 8 %. 8 കോയിൽ: ഏകദേശം 2 %.'),
 trick:L('More coils, smoother DC.','ज़्यादा कॉइल, स्मूथ DC।','കൂടുതൽ കോയിൽ, സ്മൂത്ത് DC.'),
 check:{q:L('The EMF of one coil is 10 V at its peak (sin 90°). At 30° it is …','एक कॉइल का पीक पर EMF 10 V (sin 90°)। 30° पर …','ഒരു കോയിലിന്റെ പീക്കിലെ EMF 10 V (sin 90°). 30°-ൽ …'),o:['5 V','10 V','0 V'],a:0},
 build(w,api){
  w.innerHTML=S(420,215,`<g id="a"></g>`,'The output wave of one coil or many coils with the ripple band');
  const rd=mkRd(w),c=mkCtl(w);let ni=0;
  slider(c,L('Coils','कॉइल','കോയിൽ'),0,3,1,0,x=>NCO[x],x=>{ni=x;api.redraw()});
  return t=>{const n=NCO[ni],u=(t*.08)%1,th=TPI*u,x0=20,W=380,y0=170,A=120;let s=`<path d="M${x0} ${y0}H${x0+W}M${x0} ${y0}V${y0-A-10}" stroke="var(--mut)" stroke-width="1.2"/>`;
   const f=x=>{let m=0;for(let k=0;k<n;k++)m=Math.max(m,Math.abs(Math.sin(x-k*Math.PI/n)));return m};
   const minv=Math.cos(Math.PI/(2*n)),rip=(1-minv)*100;
   s+=`<rect x="${x0}" y="${y0-A}" width="${W}" height="${(A*(1-minv)).toFixed(1)}" fill="rgba(217,54,43,.15)"/>`;
   let d='';for(let i=0;i<=240;i++){const x=x0+W*i/240;d+=(i?'L':'M')+x.toFixed(1)+' '+(y0-A*f(TPI*2*i/240)).toFixed(1)}
   s+=`<path d="${d}" fill="none" stroke="var(--frm)" stroke-width="3.2"/>`;
   const cx=x0+W*u;s+=`<circle cx="${cx.toFixed(1)}" cy="${(y0-A*f(2*th)).toFixed(1)}" r="6" fill="var(--def)"/>`+TXC(360,24,n+' '+(n>1?'coils':'coil'),'var(--fg)','18');
   put($('#a',w),s);setRd(rd,`<span>${n} ${RD('coils','कॉइल','കോയിൽ')} → ${RD('ripple','रिपल','റിപ്പിൾ')} ≈ <b>${rip<1.5?'<2':Math.round(rip)} %</b></span>`)}}});

/* ---------- 8 EMF equation ---------- */
const GNN=[500,1000,1500,2000],GPH=[.01,.02,.03,.04];
CS({id:'g_emf',menu:'EMF equation',title:'t_emf',
 flash:FB('Faraday: faster cut, more EMF (Module 5A, slide 11)','फैराडे: तेज़ कटिंग, ज़्यादा EMF (मॉड्यूल 5A, स्लाइड 11)','ഫാരഡേ: വേഗത്തിൽ മുറിച്ചാൽ കൂടുതൽ EMF (മൊഡ്യൂൾ 5A, സ്ലൈഡ് 11)'),
 hook:L('A workshop machine has 300 conductors and 4 poles. How much voltage does it make at 1000 rpm?','एक वर्कशॉप मशीन में 300 कंडक्टर और 4 पोल हैं। 1000 rpm पर कितना वोल्टेज बनेगा?','ഒരു വർക്ക്ഷോപ്പ് മെഷീനിൽ 300 കണ്ടക്ടറും 4 പോളും. 1000 rpm-ൽ എത്ര വോൾട്ടേജ് ഉണ്ടാകും?'),
 defn:L('<b>Generated EMF (E):</b> the EMF between the brushes. It depends on the flux per pole Φ (Wb), the speed N (rpm), the total armature conductors Z, the poles P and the parallel paths A.','<b>जनरेटेड EMF (E):</b> ब्रशों के बीच का EMF। यह प्रति पोल फ्लक्स Φ (Wb), स्पीड N (rpm), कुल आर्मेचर कंडक्टर Z, पोल P और पैरेलल पाथ A पर निर्भर।','<b>ജനറേറ്റഡ് EMF (E):</b> ബ്രഷുകൾക്കിടയിലെ EMF. ഇത് ഒരു പോളിലെ ഫ്ലക്സ് Φ (Wb), സ്പീഡ് N (rpm), ആകെ ആർമേച്ചർ കണ്ടക്ടർ Z, പോൾ P, പാരലൽ പാത്ത് A എന്നിവയെ ആശ്രയിക്കുന്നു.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="A name plate showing speed in rpm and voltage"><rect x="70" y="14" width="160" height="72" rx="8" fill="var(--card)" stroke="var(--wire)" stroke-width="3"/>${TXC(150,44,'1000 rpm','var(--fg)','20')}${TXC(150,72,'DC GENERATOR','var(--mut)','14')}</svg>`,
 play:L('Slide Speed N and Flux Φ. Z = 300 and P = A = 4 are fixed. Watch E.','Speed N और Flux Φ स्लाइड करो। Z = 300 और P = A = 4 फिक्स हैं। E देखो।','Speed N, Flux Φ സ്ലൈഡ് ചെയ്യൂ. Z = 300, P = A = 4 സ്ഥിരം. E നോക്കൂ.'),
 pred:{q:L('More conductors are connected in series on the armature. The EMF …','आर्मेचर पर ज़्यादा कंडक्टर सीरीज़ में जोड़े। EMF …','ആർമേച്ചറിൽ കൂടുതൽ കണ്ടക്ടർ സീരീസിൽ ചേർത്തു. EMF …'),o:[L('increases','बढ़ता है','കൂടുന്നു'),L('decreases','घटता है','കുറയുന്നു'),L('stays the same','वही रहता है','അതേ നിൽക്കുന്നു')],a:0,why:L('Each conductor adds its small EMF, like cells in series.','हर कंडक्टर अपना छोटा EMF जोड़ता है, सीरीज़ सेल जैसे।','ഓരോ കണ്ടക്ടറും അതിന്റെ ചെറിയ EMF കൂട്ടുന്നു, സീരീസ് സെൽ പോലെ.')},
 labels:['flux','speedn','emfe'],hints:['fara'],rel:{c:['Φ','N','E'],h:'E'},
 fm:['<i>E</i> = <i>Φ Z N P</i> ÷ (60 <i>A</i>)'],
 uses:L('E in volts, Φ in weber per pole, Z total conductors, N in rpm, P poles, A parallel paths. Steady speed, DC machine.','E वोल्ट में, Φ वेबर प्रति पोल, Z कुल कंडक्टर, N rpm में, P पोल, A पैरेलल पाथ। स्थिर स्पीड, DC मशीन।','E വോൾട്ടിൽ, Φ വെബർ (ഒരു പോളിന്), Z ആകെ കണ്ടക്ടർ, N rpm-ൽ, P പോൾ, A പാരലൽ പാത്ത്. സ്ഥിര സ്പീഡ്, DC മെഷീൻ.'),
 ex:L('Example: Φ = 0.02, N = 1000, ZP ÷ 60A = 5 gives E = 0.02 × 1000 × 5 = 100 V.','उदाहरण: Φ = 0.02, N = 1000, ZP ÷ 60A = 5 से E = 0.02 × 1000 × 5 = 100 V।','ഉദാഹരണം: Φ = 0.02, N = 1000, ZP ÷ 60A = 5 ആകുമ്പോൾ E = 0.02 × 1000 × 5 = 100 V.'),
 trick:L('E follows flux and speed. Double either, double E.','E फ्लक्स और स्पीड को फॉलो करता है। कोई भी डबल, E डबल।','E ഫ്ലക്സിനെയും സ്പീഡിനെയും പിന്തുടരുന്നു. ഏതെങ്കിലും ഇരട്ടിയായാൽ E ഇരട്ടി.'),

function typeCirc(k,t,ls){const W='var(--wire)';let s='';const gx=80,gy=110;
 /* main loop: G top -> top rail -> load -> bottom rail -> G bottom */
 const tr=40,br=180,lx=360;let main=[[gx,gy-28],[gx,tr],[lx,tr],[lx,gy-16],[lx,gy+16],[lx,br],[gx,br],[gx,gy+28]];
 s+=poly([[gx,gy-28],[gx,tr],[lx,tr],[lx,gy-15]],W)+poly([[lx,gy+15],[lx,br],[gx,br],[gx,gy+28]],W)+genC(gx,gy,22)+lampAt(lx,gy,1)+TXC(lx+24,gy+36,'L','var(--mut)','14');
 const cs=(ls||1);
 if(k===0)s+=`<rect x="${gx-50}" y="${gy-16}" width="18" height="32" fill="#d9362b"/><rect x="${gx+32}" y="${gy-16}" width="18" height="32" fill="#2a6fdb"/>`+TXC(gx-41,gy+6,'N','#fff','13')+TXC(gx+41,gy+6,'S','#fff','13');
 if(k===1){s+=poly([[200,70],[260,70]],W)+poly([[200,150],[260,150]],W)+poly([[200,70],[200,98]],W)+poly([[200,122],[200,150]],W)+`<path d="M186 100h28M192 108h16M186 114h28M192 122h16" stroke="var(--fg)" stroke-width="3"/>`+poly([[260,70],[260,84]],W)+coilV(260,84,8,52,CU,2.2)+poly([[260,136],[260,150]],W)+TXC(290,114,'F1-F2','var(--mut)','13')+flowDots([[200,98],[200,70],[260,70],[260,150],[200,150],[200,122]],t,4,'var(--law)',30)}
 if(k===2||k===4){const x0=k===4?120:180;s+=`<rect x="${x0-2}" y="${tr-10}" width="${66}" height="20" fill="var(--bg)"/>`+coilH(x0,tr,4,62,CU,6)+TXC(x0+31,tr-14,'D1-D2','var(--no)','13')}
 if(k===3||k===4){const xs=k===4?230:220;s+=poly([[xs,tr],[xs,68]],W)+coilV(xs,68,12,84,CU,1.8)+poly([[xs,152],[xs,br]],W)+TXC(xs+34,114,'E1-E2','var(--law)','13')+flowDots([[xs,tr],[xs,br]],t,3,'var(--law)',30)}
 s+=flowDots(main,t,10,'var(--def)',70*cs);
 return s}

 labels:['fieldw','emfe'],hints:['vir'],rel:{c:['If','Φ','E'],h:'E'},

 build(w,api){
  w.innerHTML=S(420,215,`<g id="a"></g>`,'Magnetisation curve, field resistance line and build-up steps');
  const rd=mkRd(w),c=mkCtl(w);let ri=1,nores=false,rev=false,slow=false,t0=0;
  slider(c,'Rf',0,3,1,1,x=>GRF[x]+' Ω',x=>{ri=x;t0=-1;api.redraw()});

  tog(c,L('Low speed','कम स्पीड','കുറഞ്ഞ സ്പീഡ്'),v=>{slow=v;t0=-1;api.redraw()});

   const E=If=>k*(res+240*Math.tanh(If/0.8))*(rev?-1:1)+(rev?2*k*res:0);
   let s=axes(x0,y0,W,H)+TXC(x0+W-14,y0+16,'If','var(--mut)')+TXC(x0-6,y0-H-4,'V','var(--mut)');

   s+=`<path d="M${x0} ${y0}L${x0+W} ${(y0-H*(Rf*xm)/ym).toFixed(1)}" stroke="var(--no)" stroke-width="2.6" stroke-dasharray="6 4"/>`+TXC(x0+W-26,Math.max(24,y0-H*(Rf*xm)/ym+18),'Rf','var(--no)','15');
   let V=res,d=`M${x0} ${y0}`;const nst=Math.min(16,1+Math.floor((t-t0)*3));

 build(w,api){
  w.innerHTML=S(420,215,`<g id="a"></g>`,'OCC with a moving point and the critical resistance line');
  const rd=mkRd(w),c=mkCtl(w);let fi=3,sp=1,cr=false;
  slider(c,'If',0,5,1,3,x=>GIF[x]+' A',x=>{fi=x;api.redraw()});
  modeBtns(c,['1000 rpm','1500 rpm'],i=>{sp=i?1.5:1;api.redraw()});
  tog(c,L('Critical line','क्रिटिकल लाइन','ക്രിട്ടിക്കൽ ലൈൻ'),v=>{cr=v;api.redraw()});
  return t=>{const If=GIF[fi],x0=44,y0=190,W=350,H=166,xm=2,ym=420;
   let s=axes(x0,y0,W,H)+TXC(x0+W-14,y0+16,'If (A)','var(--mut)')+TXC(x0+16,y0-H-4,'Eg (V)','var(--mut)')+crv(x=>OCCf(x),x0,y0,W,H,xm,ym,'var(--law)',3,40)+crv(x=>OCCf(x)*1.5,x0,y0,W,H,xm,ym,sp>1?'var(--frm)':'var(--mut)',sp>1?3.2:1.4,40);
   if(cr)s+=`<path d="M${x0} ${y0}L${(x0+W*(420/(300*sp))/xm).toFixed(1)} ${y0-H}" stroke="var(--no)" stroke-width="2.4" stroke-dasharray="6 4"/>`+TXC(x0+70,y0-H+12,'Rc ≈ '+Math.round(300*sp)+' Ω','var(--no)','14');
   const E=OCCf(If)*sp;s+=`<path d="M${(x0+W*If/xm).toFixed(1)} ${y0}V${(y0-H*E/ym).toFixed(1)}H${x0}" fill="none" stroke="var(--fg)" stroke-dasharray="4 4"/><circle cx="${(x0+W*If/xm).toFixed(1)}" cy="${(y0-H*E/ym).toFixed(1)}" r="7" fill="var(--def)"/>`;
   put($('#a',w),s);setRd(rd,`<span>If = ${If} A · ${sp>1?1500:1000} rpm → Eg ≈ <b>${Math.round(E)} V</b></span>`)}}});

/* ---------- 16 ICC ---------- */
const GIA5=[0,25,50,75,100];
const iccE=Ia=>240-.0012*Ia*Ia,eccV=Ia=>iccE(Ia)-.2*Ia,eccSh=Ia=>eccV(Ia)-.0015*Ia*Ia;
function chartIa(o,x){const x0=44,y0=186,W=330,H=150,ym=260,y1=150;const Y=v=>y0-H*(v-y1)/(ym-y1);
 let s=axes(x0,y0,W,H)+TXC(x0+W-12,y0+18,'Ia (A)','var(--mut)')+TXC(x0+12,y0-H-6,'V','var(--mut)')+TXC(x0-16,Y(240)+5,'240','var(--mut)','12')+TXC(x0-16,Y(200)+5,'200','var(--mut)','12');
 const cv=(f,col,sw,dash)=>{let d='';for(let i=0;i<=50;i++){const ia=i*2.4;d+=(i?'L':'M')+(x0+W*ia/120).toFixed(1)+' '+Y(f(ia)).toFixed(1)}return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${sw}" ${dash?'stroke-dasharray="6 5"':''}/>`};
 const band=(f,g,col)=>{let d='';for(let i=0;i<=50;i++){const ia=i*2.4;d+=(i?'L':'M')+(x0+W*ia/120).toFixed(1)+' '+Y(f(ia)).toFixed(1)}for(let i=50;i>=0;i--){const ia=i*2.4;d+='L'+(x0+W*ia/120).toFixed(1)+' '+Y(g(ia)).toFixed(1)}return `<path d="${d}Z" fill="${col}"/>`};
 s+=cv(()=>240,'var(--mut)',2,1);
 if(o.ar)s+=band(()=>240,iccE,'rgba(140,80,220,.18)');
 s+=cv(iccE,'var(--law)',3.4);
 if(o.ecc){s+=band(iccE,eccV,'rgba(217,54,43,.18)')+cv(eccV,'var(--no)',3.4)}
 if(o.sh){s+=band(eccV,eccSh,'rgba(230,140,30,.22)')+cv(eccSh,'var(--frm)',3.4)}
 s+=TXC(404,Y(iccE(120))-8,'ICC','var(--law)','13');if(o.ecc)s+=TXC(404,Y(eccV(120))+(o.sh?-6:16),'ECC','var(--no)','13');if(o.sh)s+=TXC(400,Y(eccSh(120))+16,'shunt','var(--frm)','13');s+=TXC(404,Y(240)-6,'E0','var(--mut)','13');
 const f=o.sh?eccSh:o.ecc?eccV:iccE;s+=`<circle cx="${(x0+W*x/120).toFixed(1)}" cy="${Y(f(x)).toFixed(1)}" r="7" fill="var(--def)"/>`;
 return s}

 labels:['emfe','armature'],hints:['fara'],rel:{c:['Ia','Φ','Eg'],h:'Eg'},
 fm:['<i>E</i><sub>g</sub> = <i>E</i><sub>0</sub> − (AR drop)'],
 uses:L('E0 no-load EMF. AR drop grows with Ia. Separately excited machine, constant speed. Curve shape only.','E0 नो-लोड EMF। AR ड्रॉप Ia के साथ बढ़ता है। सेपरेटली एक्साइटेड मशीन, स्थिर स्पीड। सिर्फ़ कर्व शेप।','E0 നോ-ലോഡ് EMF. AR ഡ്രോപ്പ് Ia-യ്ക്കൊപ്പം കൂടുന്നു. സെപ്പറേറ്റ്‌ലി എക്സൈറ്റഡ് മെഷീൻ, സ്ഥിര സ്പീഡ്. കർവ് ആകൃതി മാത്രം.'),
 trick:L('ICC: Eg vs Ia, inside the machine.','ICC: Eg बनाम Ia, मशीन के अंदर।','ICC: Eg-യും Ia-യും, മെഷീനുള്ളിൽ.'),
 check:{q:L('E0 = 240 V. Armature reaction takes away 12 V at full load. Eg at full load is …','E0 = 240 V। फुल लोड पर आर्मेचर रिएक्शन 12 V घटाता है। फुल लोड पर Eg …','E0 = 240 V. ഫുൾ ലോഡിൽ ആർമേച്ചർ റിയാക്ഷൻ 12 V കുറയ്ക്കുന്നു. ഫുൾ ലോഡിൽ Eg …'),o:['228 V','252 V','240 V'],a:0},
 build(w,api){

 hook:L('The lamps see only the terminal voltage. It is less than Eg, and for a shunt machine even less.','लैंप सिर्फ़ टर्मिनल वोल्टेज देखते हैं। यह Eg से कम है, और शंट मशीन में और भी कम।','ലാമ്പുകൾ ടെർമിനൽ വോൾട്ടേജ് മാത്രമേ കാണൂ. ഇത് Eg-യേക്കാൾ കുറവാണ്, ഷണ്ട് മെഷീനിൽ അതിലും കുറവ്.'),

function arPic(t,mode,x,mv){const cx=150,cy=105,th=Math.atan(.45*x),dg=th/D2R;let s=machineEnd(cx,cy,{rot:-t*1.1,cur:x>0?1:0,brushAng:mv?dg:0});
 const lines=(ang,col,sw)=>{let q='';for(let k=-3;k<=3;k++){const d=k*12;const c=Math.cos(ang),sn=Math.sin(ang);const x1=cx-60*c-d*sn,y1=cy+60*sn-d*c,x2=cx+60*c-d*sn,y2=cy-60*sn-d*c;q+=arr(x1,y1,x2,y2,col,sw)}return q};
 if(mode===0)s+=lines(0,'rgba(42,111,219,.85)',2);
 if(mode===1&&x>0)s+=[-24,-8,8,24].map(d=>arr(cx+d,cy-44,cx+d,cy+44,'rgba(217,54,43,.9)',2)).join('');
 if(mode===2){s+=lines(-th,'rgba(110,60,200,.9)',2);
  const tip=(px,py,str)=>`<circle cx="${px}" cy="${py}" r="${(4+str*7).toFixed(1)}" fill="${str>.55?'rgba(230,140,30,.85)':'rgba(140,140,140,.5)'}"/>`;
  const a=.5+.45*x*.9,b=.5-.45*x*.9;s+=tip(cx-62,cy-38,a)+tip(cx-62,cy+38,b)+tip(cx+62,cy+38,a)+tip(cx+62,cy-38,b)}
 const p=(an)=>pos(cx,cy,72,an);const g1=p(90),g2=p(270),m1=p(90-dg),m2=p(270-dg);
 s+=`<path d="M${g1[0]} ${g1[1]}L${g2[0]} ${g2[1]}" stroke="var(--mut)" stroke-dasharray="4 5" stroke-width="1.6"/>`+TXC(g1[0]-22,g1[1]+2,'GNA','var(--mut)','13');
 if(x>0&&mode===2)s+=`<path d="M${m1[0].toFixed(1)} ${m1[1].toFixed(1)}L${m2[0].toFixed(1)} ${m2[1].toFixed(1)}" stroke="var(--frm)" stroke-width="3" stroke-dasharray="7 4"/>`+TXC(m1[0]+24,m1[1]+4,'MNA','var(--frm)','13');
 const off=Math.abs(dg-(mv?dg:0))>4&&x>0;if(off&&Math.floor(t*6)%2)s+=`<path d="M${cx+6} ${cy-62}l8 -10l3 7l8 -11" stroke="#ffb020" stroke-width="3" fill="none"/>`;
 s+=`<path d="M${cx-30} ${cy+92}a96 96 0 0 1 -44 -26" fill="none" stroke="var(--ok)" stroke-width="3"/>`+arr(cx-66,cy+72,cx-76,cy+64,'var(--ok)',3);
 return {s,dg,off}}
CS({id:'g_ar',menu:'Armature reaction',title:'t_ar',

 hook:L('No load: no sparks. Heavy load: sparks at the brushes.','नो लोड: चिंगारी नहीं। भारी लोड: ब्रश पर चिंगारी।','നോ ലോഡ്: തീപ്പൊരി ഇല്ല. കനത്ത ലോഡ്: ബ്രഷിൽ തീപ്പൊരി.'),

 play:L('Tap Main, Armature, Combined. Slide the load. Press Brushes to MNA.','Main, Armature, Combined दबाओ। लोड स्लाइड करो। Brushes to MNA दबाओ।','Main, Armature, Combined ടാപ്പ് ചെയ്യൂ. ലോഡ് സ്ലൈഡ് ചെയ്യൂ. Brushes to MNA അമർത്തൂ.'),
 pred:{q:L('At no load the brushes do not spark. At heavy load they spark. What changed?','नो लोड पर चिंगारी नहीं, भारी लोड पर चिंगारी। क्या बदला?','നോ ലോഡിൽ തീപ്പൊരി ഇല്ല, കനത്ത ലോഡിൽ ഉണ്ട്. എന്താണ് മാറിയത്?'),o:[L('Armature current made its own flux','आर्मेचर करंट ने अपना फ्लक्स बनाया','ആർമേച്ചർ കറന്റ് സ്വന്തം ഫ്ലക്സ് ഉണ്ടാക്കി'),L('The speed doubled','स्पीड डबल हुई','സ്പീഡ് ഇരട്ടിയായി'),L('The brushes wore out at once','ब्रश तुरंत घिस गए','ബ്രഷ് ഉടനെ തേഞ്ഞു')],a:0,why:L('Load current in the armature makes a cross flux that shifts the neutral.','आर्मेचर में लोड करंट क्रॉस फ्लक्स बनाता है जो न्यूट्रल खिसकाता है।','ആർമേച്ചറിലെ ലോഡ് കറന്റ് ന്യൂട്രൽ നീക്കുന്ന ക്രോസ് ഫ്ലക്സ് ഉണ്ടാക്കുന്നു.')},
 labels:['armature','flux','brush'],hints:['flem','fara'],
 note:L('Generator: MNA moves forward, in the direction of rotation. Flux crowds at the trailing pole tips (orange). Angle shown is illustrative.','जनरेटर: MNA घूमने की दिशा में आगे खिसकता है। फ्लक्स ट्रेलिंग पोल टिप पर भीड़ करता है (नारंगी)। दिखाया कोण उदाहरण भर।','ജനറേറ്റർ: MNA കറക്കത്തിന്റെ ദിശയിൽ മുന്നോട്ട് നീങ്ങുന്നു. ഫ്ലക്സ് ട്രെയിലിംഗ് പോൾ ടിപ്പിൽ കൂടുന്നു (ഓറഞ്ച്). കാണിച്ച കോൺ ഉദാഹരണം മാത്രം.'),

 check:{q:L('In a DC generator the magnetic neutral axis shifts …','DC जनरेटर में मैग्नेटिक न्यूट्रल एक्सिस खिसकती है …','DC ജനറേറ്ററിൽ മാഗ്നറ്റിക് ന്യൂട്രൽ ആക്സിസ് നീങ്ങുന്നത് …'),o:[L('in the direction of rotation','घूमने की दिशा में','കറക്കത്തിന്റെ ദിശയിൽ'),L('against rotation','घूमने के उलटे','കറക്കത്തിന് എതിരെ'),L('not at all','बिल्कुल नहीं','ഒട്ടുമില്ല')],a:0},

CS({id:'g_commut',menu:'Commutation',title:'t_commut',
 flash:FB('Self-induction opposes change of current (Module 5A, slide 14)','सेल्फ-इंडक्शन करंट के बदलाव का विरोध करता है (मॉड्यूल 5A, स्लाइड 14)','സെൽഫ്-ഇൻഡക്ഷൻ കറന്റ് മാറ്റത്തെ എതിർക്കുന്നു (മൊഡ്യൂൾ 5A, സ്ലൈഡ് 14)'),
 hook:L('Each coil’s current must reverse in the moment it passes under the brush.','हर कॉइल का करंट ब्रश के नीचे से गुज़रते पल में उलटना चाहिए।','ഓരോ കോയിലിന്റെയും കറന്റ് ബ്രഷിനടിയിലൂടെ കടന്നുപോകുന്ന നിമിഷം തിരിയണം.'),
 defn:L('<b>Commutation:</b> current reversal in a coil while the brush shorts its two segments. Coil inductance delays it (reactance voltage). Late reversal = spark. <b>Interpoles</b> cancel the delay.','<b>कम्यूटेशन:</b> ब्रश जब कॉइल के दो सेगमेंट शॉर्ट करे तब करंट उलटना। कॉइल इंडक्टेंस देर करता है (रिएक्टेंस वोल्टेज)। देर से उलटा = चिंगारी। <b>इंटरपोल</b> देर खत्म करते हैं।','<b>കമ്മ്യൂട്ടേഷൻ:</b> ബ്രഷ് രണ്ട് സെഗ്മെന്റ് ഷോർട്ട് ചെയ്യുമ്പോൾ കോയിലിലെ കറന്റ് തിരിയൽ. കോയിൽ ഇൻഡക്ടൻസ് വൈകിക്കുന്നു (റിയാക്ടൻസ് വോൾട്ടേജ്). വൈകിയാൽ = തീപ്പൊരി. <b>ഇന്റർപോൾ</b> വൈകൽ ഇല്ലാതാക്കുന്നു.'),
 real:`<svg viewBox="0 0 300 110" role="img" aria-label="Brush on a moving commutator">${[0,1,2,3,4,5].map(i=>`<rect x="${40+i*38}" y="64" width="34" height="22" fill="${CU}"/>`).join('')}<rect x="132" y="30" width="38" height="34" fill="#2f2f2f"/></svg>`,
 play:L('Watch the yellow coil pass under the brush. Then press Interpoles ON.','पीली कॉइल को ब्रश के नीचे से गुज़रते देखो। फिर Interpoles ON दबाओ।','മഞ്ഞ കോയിൽ ബ്രഷിനടിയിലൂടെ പോകുന്നത് നോക്കൂ. പിന്നെ Interpoles ON അമർത്തൂ.'),
 pred:{q:L('A coil has inductance. Its current is told to reverse very fast. It …','कॉइल में इंडक्टेंस है। करंट को बहुत जल्दी उलटना है। वह …','കോയിലിൽ ഇൻഡക്ടൻസ് ഉണ്ട്. കറന്റ് വളരെ വേഗം തിരിയണം. അത് …'),o:[L('reverses late','देर से उलटता है','വൈകി തിരിയുന്നു'),L('reverses early','जल्दी उलटता है','നേരത്തെ തിരിയുന്നു'),L('never flows','कभी नहीं बहता','ഒഴുകുന്നേയില്ല')],a:0,why:L('Inductance opposes any change of current.','इंडक्टेंस करंट के हर बदलाव का विरोध करता है।','ഇൻഡക്ടൻസ് കറന്റിന്റെ ഏത് മാറ്റത്തെയും എതിർക്കുന്നു.')},
 labels:['commt','brush'],hints:['self'],
 note:L('Generator interpole polarity: same as the main pole just ahead in the direction of rotation. Interpole winding is in series with the armature.','जनरेटर इंटरपोल पोलैरिटी: घूमने की दिशा में आगे वाले मुख्य पोल जैसी। इंटरपोल वाइंडिंग आर्मेचर के सीरीज़ में।','ജനറേറ്റർ ഇന്റർപോൾ പോളാരിറ്റി: കറക്കത്തിന്റെ ദിശയിൽ തൊട്ടുമുന്നിലുള്ള പ്രധാന പോളിന്റേത്. ഇന്റർപോൾ വൈൻഡിംഗ് ആർമേച്ചറിന് സീരീസിൽ.'),
 trick:L('Late reversal sparks. Interpole helps it on time.','देर से उलटे तो चिंगारी। इंटरपोल समय पर कराता है।','വൈകി തിരിഞ്ഞാൽ തീപ്പൊരി. ഇന്റർപോൾ സമയത്ത് ആക്കുന്നു.'),
 check:{q:L('A coil current reverses from +20 A to −20 A. The total change is …','कॉइल करंट +20 A से −20 A। कुल बदलाव …','കോയിൽ കറന്റ് +20 A-ൽ നിന്ന് −20 A. ആകെ മാറ്റം …'),o:['40 A','20 A','0 A'],a:0},
 build(w,api){
  w.innerHTML=S(420,215,`<g id="a"></g>`,'Commutator segments moving under a brush, the commutated coil and its current graph');
  const rd=mkRd(w),c=mkCtl(w);let ip=false;
  tog(c,L('Interpoles','इंटरपोल','ഇന്റർപോൾ'),v=>{ip=v;api.redraw()});
  return t=>{const sw=36,bx=110,bw=36,v=24,per=sw*8,x0=-((t*v)%per);let s='';
   const yS=150;
   for(let k=-1;k<10;k++){const x=x0+k*sw;if(x>-sw&&x<240)s+=`<rect x="${(x+1).toFixed(1)}" y="${yS}" width="${sw-3}" height="26" fill="${CU}"/>`}
   /* tracked coil: mica between segment 4 and 5 */
   const xm=((x0+5*sw)%per+per)%per-1;const u=clamp((bx+bw/2-xm)/bw,0,1);
   const iFn=uu=>ip?1-2*uu:1-1.4*Math.pow(uu,3);let i=xm>bx+bw/2?1:xm<bx-bw/2?-1:iFn(u);
   const a1=xm-sw/2,a2=xm+sw/2;
   if(xm>-20&&xm<240){s+=`<path d="M${a1.toFixed(1)} ${yS}V110Q${xm.toFixed(1)} 60 ${a2.toFixed(1)} 110V${yS}" fill="none" stroke="#e5b400" stroke-width="5"/>`;
    const L0=Math.abs(i);if(L0>.06)s+=arr(xm-(i>0?10:-10),76,xm+(i>0?10:-10),76,i>0?'var(--def)':'var(--no)',2+3*L0)}
   s+=`<rect x="${bx-bw/2}" y="${yS-38}" width="${bw}" height="38" fill="${CARB}"/>`+TL(bx-48,yS-20,['brush','ब्रश','ബ്രഷ്'],'var(--fg)');
   const late=!ip&&xm<bx-bw/2+4&&xm>bx-bw/2-14;if(late)s+=`<path d="M${bx-bw/2-4} ${yS-2}l-10 -12l-2 8l-10 -10" stroke="#ffb020" stroke-width="3.5" fill="none"/>`;
   s+=`<path d="M${bx-bw/2} ${yS+34}H${bx+bw/2}" stroke="var(--frm)" stroke-width="3"/>`+TL(bx,yS+52,['short-circuit time','शॉर्ट-सर्किट समय','ഷോർട്ട്-സർക്യൂട്ട് സമയം'],'var(--frm)');
   const gx=250,gy=104,gw=150,gh=60;s+=`<path d="M${gx} ${gy}H${gx+gw}M${gx} ${gy-gh-6}V${gy+gh+6}" stroke="var(--mut)" stroke-width="1.4"/>`+TXC(gx-12,gy-gh+4,'+I','var(--mut)','13')+TXC(gx-12,gy+gh+4,'−I','var(--mut)','13');
   s+=`<path d="M${gx} ${gy-gh}L${gx+gw} ${gy+gh}" stroke="var(--ok)" stroke-dasharray="5 4" stroke-width="2"/>`;
   let d='';for(let k=0;k<=40;k++){const uu=k/40;d+=(k?'L':'M')+(gx+gw*uu).toFixed(1)+' '+(gy-gh*iFn(uu)).toFixed(1)}s+=`<path d="${d}" fill="none" stroke="var(--frm)" stroke-width="3.4"/>`;
   if(!ip)s+=`<path d="M${gx+gw} ${(gy-gh*iFn(1)).toFixed(1)}V${gy+gh}" stroke="var(--no)" stroke-width="3" stroke-dasharray="3 3"/>`+TL(gx+gw-30,gy+gh-4,['jump = spark','उछाल = चिंगारी','ചാട്ടം = തീപ്പൊരി'],'var(--no)','end');
   if(xm<=bx+bw/2&&xm>=bx-bw/2)s+=`<circle cx="${(gx+gw*u).toFixed(1)}" cy="${(gy-gh*i).toFixed(1)}" r="6.5" fill="var(--def)"/>`;
   s+=TL(gx+gw/2,24,['coil current','कॉइल करंट','കോയിൽ കറന്റ്'],'var(--fg)');
   put($('#a',w),s);setRd(rd,`<span>${ip?RD('Interpoles ON: current reverses in time. No spark.','इंटरपोल ON: करंट समय पर उलटा। चिंगारी नहीं।','ഇന്റർപോൾ ON: കറന്റ് സമയത്ത് തിരിയുന്നു. തീപ്പൊരി ഇല്ല.'):RD('No interpoles: current is still reversing when the segment leaves the brush. Spark.','इंटरपोल नहीं: सेगमेंट ब्रश छोड़ता है तब भी करंट उलट रहा होता है। चिंगारी।','ഇന്റർപോൾ ഇല്ല: സെഗ്മെന്റ് ബ്രഷ് വിടുമ്പോഴും കറന്റ് തിരിയുന്നു. തീപ്പൊരി.')}</span>`)}}});

const GCU=[
 {n:['None','कुछ नहीं','ഒന്നുമില്ല'],sp:90,ds:90},
 {n:['Brush shift','ब्रश शिफ्ट','ബ്രഷ് ഷിഫ്റ്റ്'],sp:35,ds:90},
 {n:['Interpoles','इंटरपोल','ഇന്റർപോൾ'],sp:8,ds:90},
 {n:['Compensating winding','कंपेंसेटिंग वाइंडिंग','കോമ്പൻസേറ്റിംഗ് വൈൻഡിംഗ്'],sp:8,ds:10}];
const GCUt=[['Sparking and distortion at full strength.','चिंगारी और डिस्टॉर्शन पूरे।','തീപ്പൊരിയും ഡിസ്റ്റോർഷനും പൂർണ്ണം.'],['Brushes moved to the MNA. Must be reset when load changes.','ब्रश MNA पर। लोड बदले तो फिर सेट करना।','ബ്രഷ് MNA-യിലേക്ക്. ലോഡ് മാറുമ്പോൾ വീണ്ടും സെറ്റ് ചെയ്യണം.'],['Small poles on the GNA, in series with the armature. Cure sparking at all loads.','GNA पर छोटे पोल, आर्मेचर के सीरीज़ में। हर लोड पर चिंगारी ठीक।','GNA-യിൽ ചെറിയ പോൾ, ആർമേച്ചറിന് സീരീസിൽ. എല്ലാ ലോഡിലും തീപ്പൊരി മാറും.'],['Conductors in the pole faces carry current opposite to the armature. Cancels the cross flux. Large machines.','पोल फेस में कंडक्टर आर्मेचर के उलटे करंट ले जाते हैं। क्रॉस फ्लक्स खत्म। बड़ी मशीनें।','പോൾ ഫേസിലെ കണ്ടക്ടറുകൾ ആർമേച്ചറിന് എതിരായ കറന്റ് വഹിക്കുന്നു. ക്രോസ് ഫ്ലക്സ് ഇല്ലാതാക്കുന്നു. വലിയ മെഷീനുകൾ.']];
CS({id:'g_cure',menu:'Remedies: brush shift, interpoles, compensating winding',title:'t_comp',
 flash:FB('Armature reaction (slide 21), commutation (slide 22)','आर्मेचर रिएक्शन (स्लाइड 21), कम्यूटेशन (स्लाइड 22)','ആർമേച്ചർ റിയാക്ഷൻ (സ്ലൈഡ് 21), കമ്മ്യൂട്ടേഷൻ (സ്ലൈഡ് 22)'),
 hook:L('Three fixes. Each one is a visible change inside the machine.','तीन उपाय। हर एक मशीन के अंदर दिखने वाला बदलाव।','മൂന്ന് പരിഹാരം. ഓരോന്നും മെഷീനുള്ളിൽ കാണാവുന്ന മാറ്റം.'),
 defn:L('<b>Brush shift</b>, <b>interpoles</b> (for commutation) and <b>compensating winding</b> (for the cross flux itself).','<b>ब्रश शिफ्ट</b>, <b>इंटरपोल</b> (कम्यूटेशन के लिए) और <b>कंपेंसेटिंग वाइंडिंग</b> (क्रॉस फ्लक्स के लिए)।','<b>ബ്രഷ് ഷിഫ്റ്റ്</b>, <b>ഇന്റർപോൾ</b> (കമ്മ്യൂട്ടേഷന്), <b>കോമ്പൻസേറ്റിംഗ് വൈൻഡിംഗ്</b> (ക്രോസ് ഫ്ലക്സിന് തന്നെ).'),
 real:`<svg viewBox="0 0 300 110" role="img" aria-label="Main poles and small interpoles">${machineEnd(150,55,{ip:1}).replace(/var\(--bg\)/g,'var(--bg)')}</svg>`.replace('viewBox="0 0 300 110"','viewBox="40 -50 220 210"'),
 play:L('Tap each remedy. Watch the picture and the bars.','हर उपाय दबाओ। चित्र और बार देखो।','ഓരോ പരിഹാരവും ടാപ്പ് ചെയ്യൂ. ചിത്രവും ബാറും നോക്കൂ.'),
 pred:{q:L('Which fix works at every load without readjusting?','कौन सा उपाय हर लोड पर बिना फिर सेट किए काम करता है?','വീണ്ടും സെറ്റ് ചെയ്യാതെ എല്ലാ ലോഡിലും പ്രവർത്തിക്കുന്ന പരിഹാരം ഏത്?'),o:[L('Interpoles','इंटरपोल','ഇന്റർപോൾ'),L('Brush shift','ब्रश शिफ्ट','ബ്രഷ് ഷിഫ്റ്റ്'),L('Neither','कोई नहीं','ഒന്നുമല്ല')],a:0,why:L('Interpoles carry armature current, so their strength follows the load.','इंटरपोल में आर्मेचर करंट बहता है, इसलिए ताकत लोड के साथ चलती है।','ഇന്റർപോളിൽ ആർമേച്ചർ കറന്റ് ഒഴുകുന്നു, അതിനാൽ ശക്തി ലോഡിനൊപ്പം മാറും.')},
 labels:['armature','flux'],hints:['flem','self'],
 note:L('Bars are qualitative, for comparison only.','बार सिर्फ़ तुलना के लिए गुणात्मक हैं।','ബാറുകൾ താരതമ്യത്തിന് മാത്രം, ഗുണപരം.'),
 trick:L('Interpole: commutation. Compensating: distortion.','इंटरपोल: कम्यूटेशन। कंपेंसेटिंग: डिस्टॉर्शन।','ഇന്റർപോൾ: കമ്മ്യൂട്ടേഷൻ. കോമ്പൻസേറ്റിംഗ്: ഡിസ്റ്റോർഷൻ.'),
 check:{q:L('A compensating winding is connected …','कंपेंसेटिंग वाइंडिंग जुड़ी होती है …','കോമ്പൻസേറ്റിംഗ് വൈൻഡിംഗ് കണക്ട് ചെയ്യുന്നത് …'),o:[L('in series with the armature','आर्मेचर के सीरीज़ में','ആർമേച്ചറിന് സീരീസിൽ'),L('across the supply','सप्लाई के आर-पार','സപ്ലൈക്ക് കുറുകെ'),L('in parallel with the field','फील्ड के पैरेलल','ഫീൽഡിന് പാരലലിൽ')],a:0},
 build(w,api){
  w.innerHTML=S(420,215,`<g id="a"></g>`,'Machine end view with the selected remedy and comparison bars');
  const rd=mkRd(w),c=mkCtl(w);let m=0;
  modeBtns(c,GCU.map(x=>L(x.n[0],x.n[1],x.n[2])),i=>{m=i;api.redraw()});
  return t=>{const dg=Math.atan(.45)/D2R;let s=machineEnd(130,105,{rot:-t*1.1,cur:1,brushAng:m===1?dg:0,ip:m>=2,cw:m===3});
   if(m<3)s+=[-20,0,20].map(d=>arr(130+d,61,130+d,149,'rgba(217,54,43,.85)',2)).join('');
   if(m===0&&Math.floor(t*6)%2)s+=`<path d="M136 43l8 -10l3 7l8 -11" stroke="#ffb020" stroke-width="3" fill="none"/>`;
   const B=(y,lab,v,col)=>`<text x="262" y="${y-6}" class="tx s" style="fill:${col};font-size:14px">${lab}</text><rect x="262" y="${y}" width="${(v*1.5).toFixed(1)}" height="16" rx="3" fill="${col}"/><text x="${(268+v*1.5).toFixed(1)}" y="${y+13}" class="tx" style="font-size:13px">${v} %</text>`;
   s+=B(60,'Sparking',GCU[m].sp,'var(--no)')+B(120,'Distortion',GCU[m].ds,'var(--law)');
   put($('#a',w),s);setRd(rd,`<span><b>${B3(GCU[m].n)}</b>: ${B3(GCUt[m])}</span>`)}}});

CS({id:'g_loss',menu:'Losses in a DC generator',title:'t_lossT',
 flash:FB('Heating effect I²R (Module 0, slide 24)','हीटिंग इफ़ेक्ट I²R (मॉड्यूल 0, स्लाइड 24)','ഹീറ്റിംഗ് ഇഫക്ട് I²R (മൊഡ്യൂൾ 0, സ്ലൈഡ് 24)'),
 hook:L('After an hour on load, the frame is warm. Every watt of heat is a lost watt.','एक घंटे लोड के बाद फ्रेम गर्म है। हर वाट गर्मी एक खोया वाट है।','ഒരു മണിക്കൂർ ലോഡിന് ശേഷം ഫ്രെയിം ചൂടാണ്. ഓരോ വാട്ട് ചൂടും നഷ്ടപ്പെട്ട വാട്ട്.'),
 defn:L('<b>Copper:</b> Ia²Ra, shunt and series field. <b>Iron:</b> hysteresis, eddy current. <b>Mechanical:</b> friction, windage. Constant: iron + mechanical + shunt. Variable: Ia²Ra + series.','<b>कॉपर:</b> Ia²Ra, शंट और सीरीज़ फील्ड। <b>आयरन:</b> हिस्टैरिसिस, एडी करंट। <b>मैकेनिकल:</b> फ्रिक्शन, विंडेज। कॉन्स्टेंट: आयरन + मैकेनिकल + शंट। वेरिएबल: Ia²Ra + सीरीज़।','<b>കോപ്പർ:</b> Ia²Ra, ഷണ്ട്, സീരീസ് ഫീൽഡ്. <b>അയൺ:</b> ഹിസ്റ്റെറിസിസ്, എഡ്ഡി കറന്റ്. <b>മെക്കാനിക്കൽ:</b> ഫ്രിക്ഷൻ, വിൻഡേജ്. കോൺസ്റ്റന്റ്: അയൺ + മെക്കാനിക്കൽ + ഷണ്ട്. വേരിയബിൾ: Ia²Ra + സീരീസ്.'),
 real:`<svg viewBox="0 0 300 110" role="img" aria-label="A warm generator frame"><rect x="90" y="34" width="120" height="50" rx="10" fill="#9aa5b1" stroke="#4a5560" stroke-width="2"/><path d="M120 26c-6-8 6-10 0-18M150 26c-6-8 6-10 0-18M180 26c-6-8 6-10 0-18" stroke="var(--no)" stroke-width="3" fill="none"/></svg>`,
 play:L('Tap each loss. Slide the load: which loss changes?','हर लॉस दबाओ। लोड स्लाइड करो: कौन सा लॉस बदलता है?','ഓരോ നഷ്ടവും ടാപ്പ് ചെയ്യൂ. ലോഡ് സ്ലൈഡ് ചെയ്യൂ: ഏത് നഷ്ടമാണ് മാറുന്നത്?'),
 pred:{q:L('The load current doubles. The armature copper loss becomes …','लोड करंट डबल। आर्मेचर कॉपर लॉस हो जाता है …','ലോഡ് കറന്റ് ഇരട്ടി. ആർമേച്ചർ കോപ്പർ നഷ്ടം ആകും …'),o:[L('4 times','4 गुना','4 മടങ്ങ്'),L('2 times','2 गुना','2 മടങ്ങ്'),L('the same','वही','അതേ')],a:0,why:L('Copper loss = I²R. (2I)² = 4I².','कॉपर लॉस = I²R। (2I)² = 4I²।','കോപ്പർ നഷ്ടം = I²R. (2I)² = 4I².')},
 labels:['effic'],hints:['vir','pvi'],rel:{c:['I','R','P'],h:'P'},
 fm:['<i>P</i><sub>cu</sub> = <i>I</i><sub>a</sub>² <i>R</i><sub>a</sub>'],
 uses:L('Pcu armature copper loss (W), Ia (A), Ra (Ω). Laminations (thin, varnished sheets) cut eddy loss. Silicon steel cuts hysteresis loss.','Pcu आर्मेचर कॉपर लॉस (W), Ia (A), Ra (Ω)। लैमिनेशन (पतली वार्निश शीट) एडी लॉस घटाते हैं। सिलिकॉन स्टील हिस्टैरिसिस लॉस घटाता है।','Pcu ആർമേച്ചർ കോപ്പർ നഷ്ടം (W), Ia (A), Ra (Ω). ലാമിനേഷൻ (നേർത്ത വാർണിഷ് ഷീറ്റ്) എഡ്ഡി നഷ്ടം കുറയ്ക്കുന്നു. സിലിക്കൺ സ്റ്റീൽ ഹിസ്റ്റെറിസിസ് നഷ്ടം കുറയ്ക്കുന്നു.'),
 ex:L('Example: 200 A through 0.03 Ω: 200 × 200 × 0.03 = 1200 W.','उदाहरण: 0.03 Ω से 200 A: 200 × 200 × 0.03 = 1200 W।','ഉദാഹരണം: 0.03 Ω-ലൂടെ 200 A: 200 × 200 × 0.03 = 1200 W.'),
 trick:L('Copper changes with load. Iron and mechanical stay.','कॉपर लोड के साथ बदले। आयरन और मैकेनिकल टिके।','കോപ്പർ ലോഡിനൊപ്പം മാറും. അയണും മെക്കാനിക്കലും നിൽക്കും.'),
 check:{q:L('A 20 kW generator has 600 W armature copper loss at full load. At 50 % load it is …','20 kW जनरेटर में फुल लोड पर 600 W आर्मेचर कॉपर लॉस। 50 % लोड पर …','20 kW ജനറേറ്ററിൽ ഫുൾ ലോഡിൽ 600 W ആർമേച്ചർ കോപ്പർ നഷ്ടം. 50 % ലോഡിൽ …'),o:['150 W','300 W','600 W'],a:0},
 build(w,api){
  w.innerHTML=S(420,215,`<g id="a"></g>`,'Picture of the selected loss and bars of the losses with load');
  const rd=mkRd(w),c=mkCtl(w);let m=0,li=3;
  modeBtns(c,[L('Copper','कॉपर','കോപ്പർ'),L('Hysteresis','हिस्टैरिसिस','ഹിസ്റ്റെറിസിസ്'),L('Eddy current','एडी करंट','എഡ്ഡി കറന്റ്'),L('Mechanical','मैकेनिकल','മെക്കാനിക്കൽ')],i=>{m=i;api.redraw()});
  slider(c,L('Load','लोड','ലോഡ്'),0,3,1,3,x=>GLDx[x]+' %',x=>{li=x;api.redraw()});
  return t=>{const x=GLDx[li]/100;let s='';
   if(m===0){s+=`<rect x="20" y="70" width="200" height="22" rx="6" fill="${CU}"/>`+flowDots([[20,81],[220,81]],t,8,'var(--def)',30+70*x)+[0,1,2].map(i=>`<path d="M${60+i*60} 64c-6-8 6-10 0-18" stroke="rgba(217,54,43,${(.2+.8*x*x).toFixed(2)})" stroke-width="3" fill="none"/>`).join('')+TXC(120,120,'I²R','var(--no)','18')}
   if(m===1){const a=Math.min(1,(t*.4)%1.4);let d='';for(let k=0;k<=80*a;k++){const u=k/80*TPI;const H=Math.cos(u),B=Math.tanh(2.2*Math.cos(u-.6));d+=(k?'L':'M')+(120+80*H).toFixed(1)+' '+(105-70*B).toFixed(1)}
    s+=`<path d="M30 105H210M120 25V185" stroke="var(--mut)" stroke-width="1.2"/><path d="${d}" fill="rgba(140,80,220,.15)" stroke="var(--law)" stroke-width="3.2"/>`+TXC(206,122,'H','var(--mut)','14')+TXC(132,30,'B','var(--mut)','14')+TL(120,204,['loop area = loss','लूप एरिया = लॉस','ലൂപ്പ് ഏരിയ = നഷ്ടം'],'var(--law)')}
   if(m===2){s+=`<rect x="20" y="40" width="90" height="130" fill="${IRON2}" stroke="#4a5560" stroke-width="1.5"/><ellipse cx="65" cy="105" rx="${(30+4*Math.sin(t*4)).toFixed(1)}" ry="50" fill="none" stroke="var(--no)" stroke-width="3"/>`+TL(65,190,['solid','सॉलिड','സോളിഡ്'],'var(--fg)');
    for(let i=0;i<9;i++){const xx=134+i*10;s+=`<rect x="${xx}" y="40" width="8" height="130" fill="${IRON2}" stroke="#4a5560" stroke-width=".8"/><ellipse cx="${xx+4}" cy="105" rx="2.4" ry="${(44+3*Math.sin(t*4+i)).toFixed(1)}" fill="none" stroke="var(--no)" stroke-width="1.2"/>`}
    s+=TL(178,190,['laminated','लैमिनेटेड','ലാമിനേറ്റഡ്'],'var(--fg)')}
   if(m===3){s+=`<circle cx="70" cy="105" r="40" fill="#d0d6dc" stroke="#4a5560" stroke-width="2"/><circle cx="70" cy="105" r="16" fill="#6b7580"/>`+[0,1,2,3,4,5,6,7].map(i=>{const a=t*3+i*Math.PI/4;return `<circle cx="${(70+28*Math.cos(a)).toFixed(1)}" cy="${(105+28*Math.sin(a)).toFixed(1)}" r="6" fill="#555"/>`}).join('')+TL(70,170,['bearing friction','बेयरिंग फ्रिक्शन','ബെയറിംഗ് ഫ്രിക്ഷൻ'],'var(--fg)');
    s+=`<g transform="translate(170 105) rotate(${(t*200)%360})">${[0,1,2,3].map(i=>`<path d="M0 0L${(30*Math.cos(i*Math.PI/2)).toFixed(1)} ${(30*Math.sin(i*Math.PI/2)).toFixed(1)}" stroke="#55606b" stroke-width="7"/>`).join('')}</g>`+[0,1,2].map(i=>`<path d="M${200+i*6} ${80+i*20}q10 -6 20 0" stroke="var(--mut)" stroke-width="2" fill="none"/>`).join('')+TL(176,170,['windage','विंडेज','വിൻഡേജ്'],'var(--fg)')}
   const cu=600*x*x;const B=(y,lab,v,col)=>`<text x="250" y="${y-6}" class="tx s" style="fill:${col};font-size:14px">${lab}</text><rect x="250" y="${y}" width="${Math.max(2,v/900*150).toFixed(1)}" height="15" rx="3" fill="${col}"/><text x="${(256+Math.max(2,v/900*150)).toFixed(1)}" y="${y+13}" class="tx" style="font-size:13px">${Math.round(v)} W</text>`;
   s+=B(34,'Arm. Cu (variable)',cu,'var(--no)')+B(82,'Iron (constant)',400,'var(--law)')+B(130,'Mech. (constant)',300,'var(--def)')+B(178,'Shunt Cu (constant)',120,'var(--frm)');
   put($('#a',w),s);const cw=Math.round(cu);setRd(rd,`<span>${RD('20 kW machine at '+GLDx[li]+' %: armature Cu = 600 × '+x+'² = '+cw+' W. Others constant.','20 kW मशीन, '+GLDx[li]+' %: आर्मेचर Cu = 600 × '+x+'² = '+cw+' W। बाकी स्थिर।','20 kW മെഷീൻ, '+GLDx[li]+' %: ആർമേച്ചർ Cu = 600 × '+x+'² = '+cw+' W. മറ്റുള്ളവ സ്ഥിരം.')}</span>`)}}});

CS({id:'g_stage',menu:'Power stages and three efficiencies',title:'t_stage',
 flash:FB('P = V × I (Module 0, slide 24); losses (slide 24)','P = V × I (मॉड्यूल 0, स्लाइड 24); लॉस (स्लाइड 24)','P = V × I (മൊഡ്യൂൾ 0, സ്ലൈഡ് 24); നഷ്ടങ്ങൾ (സ്ലൈഡ് 24)'),
 hook:L('Follow 42.1 kW from the engine shaft to the load terminals.','इंजन शाफ्ट से लोड टर्मिनल तक 42.1 kW का सफ़र देखो।','എൻജിൻ ഷാഫ്റ്റിൽ നിന്ന് ലോഡ് ടെർമിനൽ വരെ 42.1 kW പിന്തുടരൂ.'),
 defn:L('<b>Stages:</b> mechanical input → (iron + friction) → Eg Ia → (copper) → V IL output.','<b>स्टेज:</b> मैकेनिकल इनपुट → (आयरन + फ्रिक्शन) → Eg Ia → (कॉपर) → V IL आउटपुट।','<b>സ്റ്റേജുകൾ:</b> മെക്കാനിക്കൽ ഇൻപുട്ട് → (അയൺ + ഫ്രിക്ഷൻ) → Eg Ia → (കോപ്പർ) → V IL ഔട്ട്പുട്ട്.'),
 real:`<svg viewBox="0 0 300 110" role="img" aria-label="Wide arrow narrowing in two steps"><path d="M20 20H110V30H190V40H280V70H190V80H110V90H20Z" fill="rgba(42,111,219,.3)" stroke="var(--def)" stroke-width="2"/></svg>`,

 pred:{q:L('Which is the largest?','सबसे बड़ा कौन?','ഏറ്റവും വലുത് ഏത്?'),o:[L('Mechanical input','मैकेनिकल इनपुट','മെക്കാനിക്കൽ ഇൻപുട്ട്'),L('Eg × Ia','Eg × Ia','Eg × Ia'),L('Electrical output','इलेक्ट्रिकल आउटपुट','ഇലക്ട്രിക്കൽ ഔട്ട്പുട്ട്')],a:0,why:L('Every stage loses some power. The input is always the biggest.','हर स्टेज कुछ पावर खोती है। इनपुट हमेशा सबसे बड़ा।','ഓരോ സ്റ്റേജിലും കുറച്ച് പവർ നഷ്ടപ്പെടുന്നു. ഇൻപുട്ട് എപ്പോഴും ഏറ്റവും വലുത്.')},
 labels:['effic'],hints:['pvi'],rel:{c:['Pin','EgIa','VIL'],h:'VIL'},
 fm:['<i>η</i><sub>c</sub> = <i>η</i><sub>m</sub> × <i>η</i><sub>e</sub>'],
 uses:L('Mechanical ηm = Eg Ia ÷ input. Electrical ηe = V IL ÷ Eg Ia. Commercial ηc = V IL ÷ input.','मैकेनिकल ηm = Eg Ia ÷ इनपुट। इलेक्ट्रिकल ηe = V IL ÷ Eg Ia। कमर्शियल ηc = V IL ÷ इनपुट।','മെക്കാനിക്കൽ ηm = Eg Ia ÷ ഇൻപുട്ട്. ഇലക്ട്രിക്കൽ ηe = V IL ÷ Eg Ia. കൊമേഴ്സ്യൽ ηc = V IL ÷ ഇൻപുട്ട്.'),
 ex:L('Worked: 200 V, IL 195 A, Ra 0.03 Ω, Rsh 40 Ω, stray 900 W. Ish 5 A, Ia 200 A, Eg 206 V. Eg Ia 41.2 kW, output 39 kW, input 42.1 kW.','हल: 200 V, IL 195 A, Ra 0.03 Ω, Rsh 40 Ω, स्ट्रे 900 W। Ish 5 A, Ia 200 A, Eg 206 V। Eg Ia 41.2 kW, आउटपुट 39 kW, इनपुट 42.1 kW।','ഉദാഹരണം: 200 V, IL 195 A, Ra 0.03 Ω, Rsh 40 Ω, സ്ട്രേ 900 W. Ish 5 A, Ia 200 A, Eg 206 V. Eg Ia 41.2 kW, ഔട്ട്പുട്ട് 39 kW, ഇൻപുട്ട് 42.1 kW.'),
 trick:L('Commercial = mechanical × electrical.','कमर्शियल = मैकेनिकल × इलेक्ट्रिकल।','കൊമേഴ്സ്യൽ = മെക്കാനിക്കൽ × ഇലക്ട്രിക്കൽ.'),
 check:{q:L('Output 39 kW, input 42.1 kW. The commercial efficiency is about …','आउटपुट 39 kW, इनपुट 42.1 kW। कमर्शियल एफिशिएंसी करीब …','ഔട്ട്പുട്ട് 39 kW, ഇൻപുട്ട് 42.1 kW. കൊമേഴ്സ്യൽ എഫിഷ്യൻസി ഏകദേശം …'),o:['92.6 %','97.9 %','108 %'],a:0},
 build(w,api){
  w.innerHTML=S(420,215,`<g id="a"></g>`,'Power flow diagram from mechanical input to electrical output');
  const rd=mkRd(w),c=mkCtl(w);let m=2;
  modeBtns(c,[L('Mechanical η','मैकेनिकल η','മെക്കാനിക്കൽ η'),L('Electrical η','इलेक्ट्रिकल η','ഇലക്ട്രിക്കൽ η'),L('Commercial η','कमर्शियल η','കൊമേഴ്സ്യൽ η')],i=>{m=i;api.redraw()},2);
  return t=>{const k=2.0,y=60,h1=42.1*k,h2=41.2*k,h3=39*k;let s='';
   const hl=i=>(m===0&&i<2)||(m===1&&i>0)||(m===2&&(i===0||i===2));
   const box=(x,ww,hh,i,lab,val)=>`<rect x="${x}" y="${y}" width="${ww}" height="${hh.toFixed(1)}" fill="${hl(i)?'rgba(42,111,219,.35)':'rgba(42,111,219,.14)'}" stroke="var(--def)" stroke-width="${hl(i)?3:1.5}"/>`+TXC(x+ww/2,y-8,lab,'var(--fg)','14')+TXC(x+ww/2,y+hh/2+6,val,'var(--fg)','15');
   s+=box(14,96,h1,0,'Input','42.1 kW')+box(160,96,h2,1,'Eg Ia','41.2 kW')+box(306,96,h3,2,'V IL','39 kW');
   s+=`<path d="M110 ${y}H160M110 ${y+h2}H160M256 ${y}H306M256 ${y+h3}H306" stroke="var(--def)" stroke-width="1.5"/>`;
   s+=`<path d="M118 ${y+h2+2}v${(h1-h2+16).toFixed(1)}" stroke="var(--no)" stroke-width="7"/>`+TXC(140,y+h1+30,'−0.9','var(--no)','14')+`<path d="M264 ${y+h3+2}v${(h2-h3+16).toFixed(1)}" stroke="var(--no)" stroke-width="10"/>`+TXC(284,y+h2+30,'−2.2','var(--no)','14');
   s+=TL(140,206,['iron + friction','आयरन + फ्रिक्शन','അയൺ + ഫ്രിക്ഷൻ'],'var(--no)')+TL(300,206,['copper','कॉपर','കോപ്പർ'],'var(--no)');
   s+=flowDots([[14,y+20],[402,y+20]],t,9,'var(--frm)',70)+flowDots([[14,y+60],[402,y+60]],t,9,'var(--frm)',70);
   put($('#a',w),s);const E=[['ηm = 41.2 ÷ 42.1','97.9 %'],['ηe = 39 ÷ 41.2','94.7 %'],['ηc = 39 ÷ 42.1','92.6 %']][m];
   setRd(rd,`<span>${E[0]} = <b>${E[1]}</b></span>`)}}});

 uses:L('Each machine: (its E − bus V) ÷ its Ra. Here Ra = 0.2 Ω each, load 100 A. To take a machine out, weaken its field until its ammeter reads zero.','हर मशीन: (उसका E − बस V) ÷ उसका Ra। यहाँ हर Ra = 0.2 Ω, लोड 100 A। मशीन हटाने को फील्ड कमज़ोर करो जब तक एमीटर ज़ीरो।','ഓരോ മെഷീനും: (അതിന്റെ E − ബസ് V) ÷ അതിന്റെ Ra. ഇവിടെ Ra = 0.2 Ω വീതം, ലോഡ് 100 A. മെഷീൻ മാറ്റാൻ ആമ്മീറ്റർ പൂജ്യമാകുന്നതുവരെ ഫീൽഡ് കുറയ്ക്കൂ.'),
 ex:L('Step 5: E1 = E2 = 230 V. Bus 220 V. Each (230 − 220) ÷ 0.2 = 50 A.','स्टेप 5: E1 = E2 = 230 V। बस 220 V। हर एक (230 − 220) ÷ 0.2 = 50 A।','സ്റ്റെപ്പ് 5: E1 = E2 = 230 V. ബസ് 220 V. ഓരോന്നും (230 − 220) ÷ 0.2 = 50 A.'),
 trick:L('Match, close, then share by field.','मिलाओ, जोड़ो, फिर फील्ड से बाँटो।','ഒപ്പിക്കൂ, അടയ്ക്കൂ, പിന്നെ ഫീൽഡ് കൊണ്ട് പങ്കിടൂ.'),
 check:{q:L('Two loads of 60 A and 40 A share a bus. The total is …','60 A और 40 A के दो लोड एक बस पर। कुल …','60 A, 40 A എന്നീ രണ്ട് ലോഡ് ഒരു ബസ്സിൽ. ആകെ …'),o:['100 A','20 A','2400 A'],a:0},
 build(w,api){

   const W='var(--wire)';let s=`<path d="M20 20H400" stroke="#d9362b" stroke-width="5"/><path d="M20 196H400" stroke="#2a6fdb" stroke-width="5"/>`+TXC(12,25,'+','#d9362b','16')+TXC(12,201,'−','#2a6fdb','16');

   put($('#a',w),s);setRd(rd,`<span><b>${k+1}.</b> ${B3(p.t)} · ${RD('bus','बस','ബസ്')} ${fm1(V)} V</span>`)}}});

/* ---------- 29 Compound in parallel: equalizer ---------- */
CS({id:'g_eqz',menu:'Compound generators in parallel: equalizer bar',title:'t_eqz',
 flash:FB('Over-compound: voltage rises with load (slide 19); parallel operation (slide 28)','ओवर-कंपाउंड: लोड के साथ वोल्टेज बढ़ता है (स्लाइड 19); पैरेलल ऑपरेशन (स्लाइड 28)','ഓവർ-കോമ്പൗണ്ട്: ലോഡിനൊപ്പം വോൾട്ടേജ് കൂടുന്നു (സ്ലൈഡ് 19); പാരലൽ ഓപ്പറേഷൻ (സ്ലൈഡ് 28)'),
 hook:L('Two compound generators share a load. One takes a little extra, and then it grabs everything.','दो कंपाउंड जनरेटर लोड बाँटते हैं। एक थोड़ा ज़्यादा लेता है, फिर सब कुछ ले लेता है।','രണ്ട് കോമ്പൗണ്ട് ജനറേറ്റർ ലോഡ് പങ്കിടുന്നു. ഒന്ന് അല്പം കൂടുതൽ എടുക്കുന്നു, പിന്നെ എല്ലാം പിടിച്ചെടുക്കുന്നു.'),
 defn:L('<b>Rising characteristic = unstable in parallel.</b> More load → stronger series field → more EMF → more load. <b>Equalizer bar</b> (low resistance) ties the series fields together so they share current.','<b>चढ़ता कैरेक्टरिस्टिक = पैरेलल में अस्थिर।</b> ज़्यादा लोड → मज़बूत सीरीज़ फील्ड → ज़्यादा EMF → और लोड। <b>इक्वेलाइज़र बार</b> (कम रेज़िस्टेंस) सीरीज़ फील्ड को जोड़ता है ताकि करंट बँटे।','<b>കയറുന്ന കാരക്ടറിസ്റ്റിക് = പാരലലിൽ അസ്ഥിരം.</b> കൂടുതൽ ലോഡ് → ശക്തമായ സീരീസ് ഫീൽഡ് → കൂടുതൽ EMF → കൂടുതൽ ലോഡ്. <b>ഇക്വലൈസർ ബാർ</b> (കുറഞ്ഞ റെസിസ്റ്റൻസ്) സീരീസ് ഫീൽഡുകളെ ചേർത്ത് കറന്റ് പങ്കിടുന്നു.'),
 real:`<svg viewBox="0 0 300 110" role="img" aria-label="Two generators joined by an extra bar">${genC(90,70,20)}${genC(210,70,20)}<path d="M90 40H210" stroke="var(--frm)" stroke-width="5" stroke-dasharray="8 5"/><path d="M20 14H280" stroke="#d9362b" stroke-width="4"/></svg>`,
 play:L('Press Run with Equalizer OFF, then ON.','Equalizer OFF के साथ Run दबाओ, फिर ON।','Equalizer OFF ആക്കി Run അമർത്തൂ, പിന്നെ ON.'),
 pred:{q:L('Gen 1 takes slightly more load. Its series field gets stronger. Next, Gen 1 takes …','जेन 1 थोड़ा ज़्यादा लोड लेता है। उसका सीरीज़ फील्ड मज़बूत। फिर जेन 1 लेता है …','ജെൻ 1 അല്പം കൂടുതൽ ലോഡ് എടുക്കുന്നു. അതിന്റെ സീരീസ് ഫീൽഡ് ശക്തമാകുന്നു. പിന്നെ ജെൻ 1 എടുക്കുന്നത് …'),o:[L('even more load','और ज़्यादा लोड','ഇനിയും കൂടുതൽ ലോഡ്'),L('less load','कम लोड','കുറഞ്ഞ ലോഡ്'),L('the same load','वही लोड','അതേ ലോഡ്')],a:0,why:L('Stronger field → more EMF → still more load. It runs away.','मज़बूत फील्ड → ज़्यादा EMF → और लोड। यह बेकाबू हो जाता है।','ശക്തമായ ഫീൽഡ് → കൂടുതൽ EMF → ഇനിയും ലോഡ്. നിയന്ത്രണം വിടുന്നു.')},
 labels:['fieldw'],hints:['par','ser'],
 note:L('Without the equalizer, Gen 2 can end up driven as a motor. Shunt generators (drooping) share stably without it.','इक्वेलाइज़र के बिना जेन 2 मोटर बनकर चल सकता है। शंट जनरेटर (गिरता कर्व) बिना इसके भी स्थिर बाँटते हैं।','ഇക്വലൈസർ ഇല്ലെങ്കിൽ ജെൻ 2 മോട്ടോറായി ഓടാം. ഷണ്ട് ജനറേറ്റർ (താഴുന്ന കർവ്) ഇതില്ലാതെയും സ്ഥിരമായി പങ്കിടും.'),
 trick:L('Rising curve? Fit an equalizer.','चढ़ता कर्व? इक्वेलाइज़र लगाओ।','കയറുന്ന കർവ്? ഇക്വലൈസർ ഇടൂ.'),
 check:{q:L('An equalizer bar is needed for parallel operation of …','इक्वेलाइज़र बार ज़रूरी है पैरेलल ऑपरेशन में …','പാരലൽ ഓപ്പറേഷനിൽ ഇക്വലൈസർ ബാർ വേണ്ടത് …'),o:[L('compound generators','कंपाउंड जनरेटर','കോമ്പൗണ്ട് ജനറേറ്റർ'),L('shunt generators only','सिर्फ़ शंट जनरेटर','ഷണ്ട് ജനറേറ്റർ മാത്രം'),L('separately excited only','सिर्फ़ सेपरेटली एक्साइटेड','സെപ്പറേറ്റ്‌ലി എക്സൈറ്റഡ് മാത്രം')],a:0},
 build(w,api){
  w.innerHTML=S(420,215,`<g id="a"></g>`,'Two compound generators with or without an equalizer bar and their currents');
  const rd=mkRd(w),c=mkCtl(w);let eq=false,t0=null;
  tog(c,L('Equalizer','इक्वेलाइज़र','ഇക്വലൈസർ'),v=>{eq=v;t0=null;api.redraw()});
  button(c,L('Run again','फिर चलाओ','വീണ്ടും ഓടിക്കൂ'),()=>{t0=null;api.redraw()},'');
  return t=>{if(t0===null)t0=t;const tt=t-t0;const I1=eq?50+3*Math.exp(-tt)*Math.cos(tt*3):50+70*(1-Math.exp(-tt/1.6)),I2=100-I1;
   const W='var(--wire)';let s=`<path d="M20 20H400" stroke="#d9362b" stroke-width="5"/><path d="M20 196H400" stroke="#2a6fdb" stroke-width="5"/>`;
   const g=(x,I,id)=>{let q=genC(x,140,22)+poly([[x,118],[x,100]],W)+`<rect x="${x-10}" y="56" width="20" height="44" fill="var(--bg)"/>`+coilV(x,56,4,44,CU,5)+poly([[x,56],[x,20]],W)+poly([[x,162],[x,196]],W)+`<circle cx="${x}" cy="104" r="4" fill="var(--fg)"/>`;
    const bw=Math.max(2,Math.abs(I))*.9;q+=`<rect x="${x+34}" y="${I>=0?150-bw:150}" width="16" height="${bw.toFixed(1)}" fill="${I>=0?'var(--def)':'var(--no)'}"/>`+TXC(x+42,186,'I'+id+' '+Math.round(I)+' A',I>=0?'var(--def)':'var(--no)','13');return q};
   s+=g(110,I1,1)+g(270,I2,2);
   if(eq)s+=`<path d="M110 104H270" stroke="var(--frm)" stroke-width="5" stroke-dasharray="9 5"/>`+TL(190,96,['equalizer','इक्वेलाइज़र','ഇക്വലൈസർ'],'var(--frm)');
   s+=`<rect x="352" y="84" width="40" height="56" rx="5" fill="var(--card)" stroke="${W}" stroke-width="2.5"/>`+TXC(372,118,'L','var(--fg)','16')+poly([[372,20],[372,84]],W)+poly([[372,140],[372,196]],W);
   put($('#a',w),s);setRd(rd,`<span>${eq?RD('Equalizer ON: shares stay near 50 A each.','इक्वेलाइज़र ON: हिस्से 50 A के पास।','ഇക്വലൈസർ ON: ഓരോന്നും 50 A-ന് അടുത്ത്.'):I2<0?RD('Gen 2 current reversed: it is being driven as a motor!','जेन 2 का करंट उलटा: वह मोटर बनकर चल रहा है!','ജെൻ 2 കറന്റ് തിരിഞ്ഞു: അത് മോട്ടോറായി ഓടുന്നു!'):RD('Gen 1 is grabbing the load…','जेन 1 लोड हथिया रहा है…','ജെൻ 1 ലോഡ് പിടിച്ചെടുക്കുന്നു…')}</span>`)}}});

CS({id:'g_twist',exam:true,menu:'Exam twist: Module 6',kind:'tip',title:'twm6',hk:undefined,page(w,s,api){
  w.innerHTML=S(400,150,`<g id="bs"></g>`,'Bars showing how E or the drop changes with the sliders');
  const rd=mkRd(w),c=mkCtl(w);let mode=0;const f=[2,2,2];
  const draw=()=>{const v=f.map(x=>FLC[x]);let o,txt;
   if(mode===0){const E=v[0]*v[1]*v[2];o=[['Φ',v[0],'var(--def)'],['N',v[1],'var(--law)'],['Z',v[2],'var(--tip)'],['E',E,'var(--frm)']];txt='E ∝ Φ × N × Z'}
   else{const d=v[0]*v[1];o=[['Ia',v[0],'var(--def)'],['Ra',v[1],'var(--law)'],['Ia·Ra',d,'var(--no)']];txt='Drop = Ia × Ra'}
   const mx=Math.max(4,...o.map(x=>x[1]));
   $('#bs',w).innerHTML=o.map((x,i)=>{const y=22+i*30,wd=clamp(x[1]/mx*230,3,230);return `<rect x="64" y="${y-12}" width="${wd.toFixed(0)}" height="19" rx="4" fill="${x[2]}"/><text x="8" y="${y+3}" class="tx s">${x[0]}</text><text x="${(70+wd).toFixed(0)}" y="${y+3}" class="tx" style="font-size:14px">× ${fm1(x[1])}</text>`}).join('');
   setRd(rd,`<span>${txt}</span>`)};
  modeBtns(c,[L('EMF','EMF','EMF'),L('Drop','ड्रॉप','ഡ്രോപ്പ്')],i=>{mode=i;labs();draw()});
  const sc=h('div');c.parentNode.insertBefore(sc,c.nextSibling);
  const labs=()=>{sc.innerHTML='';const nm=mode===0?['Φ','N','Z']:['Ia','Ra'];nm.forEach((n,i)=>slider(sc,n,0,4,1,f[i],x=>fmtMul(FLC[x]),x=>{f[i]=x;draw()}))};
  labs();draw();api.setReplay(()=>{draw()});
  s.appendChild(h('div','flash',`<b>↩ ${UIB('fb')}</b><span>${L('EMF (slide 9), drop (slide 17)','EMF (स्लाइड 9), ड्रॉप (स्लाइड 17)','EMF (സ്ലൈഡ് 9), ഡ്രോപ്പ് (സ്ലൈഡ് 17)')}</span>`));
  miniQuiz(s,[
   {q:L('A 4-pole, lap-wound generator has Z = 300, Φ = 0.02 Wb and runs at 1000 rpm. The EMF is …','4-पोल, लैप-वाउंड जनरेटर: Z = 300, Φ = 0.02 Wb, 1000 rpm। EMF …','4-പോൾ, ലാപ്പ്-വൗണ്ട് ജനറേറ്റർ: Z = 300, Φ = 0.02 Wb, 1000 rpm. EMF …'),o:['100 V','200 V','400 V','50 V'],a:0,why:L('A = P = 4. E = 0.02 × 300 × 1000 × 4 ÷ (60 × 4) = 100 V.','A = P = 4। E = 0.02 × 300 × 1000 × 4 ÷ (60 × 4) = 100 V।','A = P = 4. E = 0.02 × 300 × 1000 × 4 ÷ (60 × 4) = 100 V.')},
   {q:L('The same machine is wave-wound (A = 2). Z = 300, Φ = 0.02 Wb, 1000 rpm, 4 poles. The EMF is …','वही मशीन वेव-वाउंड (A = 2)। Z = 300, Φ = 0.02 Wb, 1000 rpm, 4 पोल। EMF …','അതേ മെഷീൻ വേവ്-വൗണ്ട് (A = 2). Z = 300, Φ = 0.02 Wb, 1000 rpm, 4 പോൾ. EMF …'),o:['200 V','100 V','400 V','50 V'],a:0,why:L('E = 0.02 × 300 × 1000 × 4 ÷ (60 × 2) = 200 V.','E = 0.02 × 300 × 1000 × 4 ÷ (60 × 2) = 200 V।','E = 0.02 × 300 × 1000 × 4 ÷ (60 × 2) = 200 V.')},
   {q:L('A generator has E = 230 V, Ia = 50 A and Ra = 0.2 Ω. The terminal voltage is about …','जनरेटर: E = 230 V, Ia = 50 A, Ra = 0.2 Ω। टर्मिनल वोल्टेज करीब …','ജനറേറ്റർ: E = 230 V, Ia = 50 A, Ra = 0.2 Ω. ടെർമിനൽ വോൾട്ടേജ് ഏകദേശം …'),o:['220 V','240 V','180 V','230 V'],a:0,why:L('V = 230 − 50 × 0.2 = 220 V.','V = 230 − 50 × 0.2 = 220 V।','V = 230 − 50 × 0.2 = 220 V.')},
   {q:L('A generator gives 100 V at 1000 rpm and a fixed field. At 1500 rpm it gives …','जनरेटर फिक्स्ड फील्ड पर 1000 rpm पर 100 V देता है। 1500 rpm पर …','ജനറേറ്റർ ഫിക്സഡ് ഫീൽഡിൽ 1000 rpm-ൽ 100 V തരുന്നു. 1500 rpm-ൽ …'),o:['150 V','100 V','67 V','225 V'],a:0,why:L('E ∝ N: 100 × 1500 ÷ 1000 = 150 V.','E ∝ N: 100 × 1500 ÷ 1000 = 150 V।','E ∝ N: 100 × 1500 ÷ 1000 = 150 V.')},
   {q:L('A generator gives 240 V at no load and 220 V at full load. The regulation is about …','जनरेटर नो-लोड पर 240 V और फुल-लोड पर 220 V देता है। रेगुलेशन करीब …','ജനറേറ്റർ നോ-ലോഡിൽ 240 V, ഫുൾ-ലോഡിൽ 220 V തരുന്നു. റെഗുലേഷൻ ഏകദേശം …'),o:['9.1 %','8.3 %','20 %','0.09 %'],a:0,why:L('(240 − 220) ÷ 220 × 100 = 9.1 %.','(240 − 220) ÷ 220 × 100 = 9.1 %।','(240 − 220) ÷ 220 × 100 = 9.1 %.')},

CS({id:'g_mist',menu:'Common mistakes',kind:'warn',title:'mist6',wide:true,hk:undefined,page(w){

   [L('Ia = IL for every generator','हर जनरेटर में Ia = IL','എല്ലാ ജനറേറ്ററിലും Ia = IL'),L('Shunt: Ia = IL + If. Only the series generator has Ia = IL.','शंट: Ia = IL + If। सिर्फ़ सीरीज़ जनरेटर में Ia = IL।','ഷണ്ട്: Ia = IL + If. സീരീസ് ജനറേറ്ററിൽ മാത്രം Ia = IL.')],

 {sp:['After a repair the field leads were reconnected. The generator had a small voltage, but it falls to almost zero when the field is connected.','मरम्मत के बाद फील्ड लीड फिर जोड़ी गईं। जनरेटर में थोड़ा वोल्टेज था, पर फील्ड जोड़ते ही लगभग ज़ीरो।','റിപ്പയറിന് ശേഷം ഫീൽഡ് ലീഡ് വീണ്ടും കണക്ട് ചെയ്തു. ജനറേറ്ററിൽ ചെറിയ വോൾട്ടേജ് ഉണ്ടായിരുന്നു, പക്ഷേ ഫീൽഡ് കണക്ട് ചെയ്യുമ്പോൾ ഏതാണ്ട് പൂജ്യമാകുന്നു.'],

  tests:[[['Brush length and spring','ब्रश लंबाई और स्प्रिंग','ബ്രഷ് നീളവും സ്പ്രിംഗും'],['Worn short, spring weak','घिसा छोटा, स्प्रिंग कमज़ोर','തേഞ്ഞ് ചെറുതായി, സ്പ്രിംഗ് ദുർബലം']],[['Mica between segments','सेगमेंट के बीच माइका','സെഗ്മെന്റുകൾക്കിടയിലെ മൈക്ക'],['Standing above the copper','कॉपर से ऊपर उठा है','കോപ്പറിന് മുകളിൽ ഉയർന്നു നിൽക്കുന്നു']],[['Commutator surface','कम्यूटेटर सतह','കമ്മ്യൂട്ടേറ്റർ പ്രതലം'],['Rough, burnt marks','खुरदरी, जले निशान','പരുക്കൻ, കരിഞ്ഞ പാടുകൾ']]],
  o:[['The supply voltage is too low','सप्लाई वोल्टेज बहुत कम है','സപ്ലൈ വോൾട്ടേജ് വളരെ കുറവാണ്'],['The field coil is open','फील्ड कॉइल ओपन है','ഫീൽഡ് കോയിൽ ഓപ്പൺ ആണ്'],['Worn brushes and high mica. Replace brushes, undercut the mica and polish the commutator.','घिसे ब्रश और ऊँचा माइका। ब्रश बदलो, माइका अंडरकट करो और कम्यूटेटर पॉलिश करो।','തേഞ്ഞ ബ്രഷും ഉയർന്ന മൈക്കും. ബ്രഷ് മാറ്റൂ, മൈക്ക് അണ്ടർകട്ട് ചെയ്യൂ, കമ്മ്യൂട്ടേറ്റർ പോളിഷ് ചെയ്യൂ.']],a:2,
  why:['Poor contact and a rough surface make the brush bounce and break contact, so it sparks. Fix the brushes, the mica and the surface. Also check the brushes sit on the neutral.','खराब कांटेक्ट और खुरदरी सतह से ब्रश उछलता है और कांटेक्ट टूटता है, इसलिए चिंगारी। ब्रश, माइका और सतह ठीक करो। यह भी देखो कि ब्रश न्यूट्रल पर हों।','മോശം കോൺടാക്ടും പരുക്കൻ പ്രതലവും ബ്രഷ് തുള്ളിച്ച് കോൺടാക്ട് മുറിക്കുന്നു, അതിനാൽ തീപ്പൊരി. ബ്രഷ്, മൈക്ക്, പ്രതലം എന്നിവ ശരിയാക്കൂ. ബ്രഷ് ന്യൂട്രലിൽ ആണോ എന്നും നോക്കൂ.']},
 {sp:['A shunt generator gives 230 V with no load. With the load on, the lamps dim and the voltage is 180 V. The field and brushes are fine.','शंट जनरेटर नो लोड पर 230 V देता है। लोड लगाने पर लैंप मंद और वोल्टेज 180 V। फील्ड और ब्रश ठीक हैं।','ഷണ്ട് ജനറേറ്റർ നോ-ലോഡിൽ 230 V തരുന്നു. ലോഡ് ഇടുമ്പോൾ ലാമ്പ് മങ്ങി, വോൾട്ടേജ് 180 V. ഫീൽഡും ബ്രഷും ശരിയാണ്.'],
  pic:(p,sv)=>fpic([{x:22,y:22,w:110,h:70,t:['Prime mover','प्राइम मूवर','പ്രൈം മൂവർ']},{x:150,y:22,w:110,h:70,t:['Field circuit','फील्ड सर्किट','ഫീൽഡ് സർക്യൂട്ട്']},{x:278,y:22,w:110,h:70,t:['Load','लोड','ലോഡ്']}],p===1?0:p===2?1:p===3?2:-1,sv),
  tests:[[['Speed on load','लोड पर स्पीड','ലോഡിൽ സ്പീഡ്'],['1000 rpm falls to 780 rpm','1000 rpm से 780 rpm','1000 rpm-ൽ നിന്ന് 780 rpm'],],[['Field current','फील्ड करंट','ഫീൽഡ് കറന്റ്'],['Normal','सामान्य','സാധാരണ']],[['Load current','लोड करंट','ലോഡ് കറന്റ്'],['Within rating','रेटिंग के अंदर','റേറ്റിംഗിനുള്ളിൽ']]],

  why:['E is proportional to speed. The speed drops from 1000 to 780 rpm, so the EMF drops about 22 %. Fix the engine governor, fuel or belt slip so the speed holds.','E स्पीड के समानुपाती है। स्पीड 1000 से 780 rpm, इसलिए EMF करीब 22 % गिरा। इंजन गवर्नर, फ्यूल या बेल्ट स्लिप ठीक करो ताकि स्पीड टिके।','E സ്പീഡിന് ആനുപാതികം. സ്പീഡ് 1000-ൽ നിന്ന് 780 rpm ആയതിനാൽ EMF ഏകദേശം 22 % കുറഞ്ഞു. സ്പീഡ് നിലനിർത്താൻ എൻജിൻ ഗവർണർ, ഫ്യൂവൽ, ബെൽറ്റ് സ്ലിപ്പ് എന്നിവ ശരിയാക്കൂ.']},
 {sp:['A 10 kW, 220 V generator supplies a workshop. The frame is very hot and the smell of varnish is strong.','10 kW, 220 V जनरेटर वर्कशॉप को सप्लाई देता है। फ्रेम बहुत गर्म है और वार्निश की गंध तेज़ है।','10 kW, 220 V ജനറേറ്റർ ഒരു വർക്ക്ഷോപ്പിന് സപ്ലൈ നൽകുന്നു. ഫ്രെയിം വളരെ ചൂടാണ്, വാർണിഷിന്റെ ഗന്ധം രൂക്ഷം.'],
  pic:(p,sv)=>fpic([{x:22,y:22,w:110,h:70,t:['Load current','लोड करंट','ലോഡ് കറന്റ്']},{x:150,y:22,w:110,h:70,t:['Ventilation','वेंटिलेशन','വെന്റിലേഷൻ']},{x:278,y:22,w:110,h:70,t:['Field current','फील्ड करंट','ഫീൽഡ് കറന്റ്']}],p===1?0:p===2?1:p===3?2:-1,sv),
  tests:[[['Load current (rating about 45 A)','लोड करंट (रेटिंग करीब 45 A)','ലോഡ് കറന്റ് (റേറ്റിംഗ് ഏകദേശം 45 A)'],'62 A'],[['Cooling fan and air path','कूलिंग फैन और एयर पाथ','കൂളിംഗ് ഫാനും എയർ പാത്തും'],['Clear','साफ़','വൃത്തിയുള്ളത്']],[['Field current','फील्ड करंट','ഫീൽഡ് കറന്റ്'],['Normal','सामान्य','സാധാരണ']]],
  o:[['The field has too little current','फील्ड में करंट बहुत कम है','ഫീൽഡിൽ കറന്റ് വളരെ കുറവാണ്'],['The generator is overloaded. Reduce the load to the rating.','जनरेटर ओवरलोड है। लोड रेटिंग तक घटाओ।','ജനറേറ്റർ ഓവർലോഡ് ആണ്. ലോഡ് റേറ്റിംഗിലേക്ക് കുറയ്ക്കൂ.'],['The fan is blocked','फैन ब्लॉक है','ഫാൻ ബ്ലോക്ക് ആണ്']],a:1,
  why:['10 kW at 220 V is about 45 A. The load takes 62 A. Copper loss grows with the square of the current, so the machine overheats. Cut the load and check the insulation for damage.','220 V पर 10 kW करीब 45 A है। लोड 62 A ले रहा है। कॉपर लॉस करंट के वर्ग से बढ़ता है, इसलिए मशीन गर्म। लोड घटाओ और इन्सुलेशन की जाँच करो।','220 V-ൽ 10 kW ഏകദേശം 45 A ആണ്. ലോഡ് 62 A എടുക്കുന്നു. കോപ്പർ നഷ്ടം കറന്റിന്റെ വർഗത്തിനൊപ്പം കൂടും, അതിനാൽ മെഷീൻ ചൂടാകുന്നു. ലോഡ് കുറച്ച് ഇൻസുലേഷൻ കേടുണ്ടോ എന്ന് പരിശോധിക്കൂ.']}

SL.push({id:'g_fault',syl:'M6',menu:'Fault Finder: 5 missions',kind:'tip',title:'fault',free:true,noctl:true,
 trick:L('Measure first. Then decide.','पहले मापो। फिर फैसला करो।','ആദ്യം അളക്കൂ. പിന്നെ തീരുമാനിക്കൂ.'),
 check:{q:L('A load takes 20 A through a cable of 0.5 Ω. The voltage lost in the cable is …','लोड 0.5 Ω के केबल से 20 A लेता है। केबल में वोल्टेज लॉस …','ലോഡ് 0.5 Ω കേബിളിലൂടെ 20 A എടുക്കുന്നു. കേബിളിൽ നഷ്ടപ്പെടുന്ന വോൾട്ടേജ് …'),o:['10 V','40 V','0.025 V'],a:0},
 page(w,s,api){
  const FA=FA6;const sv=P.faultG||(P.faultG={});let mi=0,probe=-1;
  const pic=h('div');w.appendChild(pic);const rd=h('div','rd');w.appendChild(rd);
  const draw=()=>{const m=FA[mi];pic.innerHTML=S(400,125,m.pic(probe,!!sv[mi]),'Fault picture');svgLang();watchFit()};
  const sideTop=h('div');s.appendChild(sideTop);const fin=h('div');fin.hidden=true;s.appendChild(fin);
  const show=()=>{const m=FA[mi];probe=-1;rd.innerHTML='';draw();sideTop.innerHTML='';
   sideTop.appendChild(h('div','beat',RD('Mission '+(mi+1)+' of 5','मिशन '+(mi+1)+' / 5','മിഷൻ '+(mi+1)+' / 5')));
   sideTop.appendChild(h('div','hook',`<small>${term('sp')}</small><span>${B3(m.sp)}</span>`));
   sideTop.appendChild(h('div','beat',RD('Tests: tap one at a time','टेस्ट: एक-एक दबाओ','ടെസ്റ്റ്: ഓരോന്നായി ടാപ്പ് ചെയ്യൂ')));
   const tb=h('div','chips');sideTop.appendChild(tb);
   m.tests.forEach((t,k)=>{const b=h('button','btn',B3(t[0]));b.type='button';b.onclick=()=>{probe=k+1;const r=t[1];setRd(rd,`<span>${B3(t[0])} → <b>${Array.isArray(r)?B3(r):r}</b></span>`);draw();dg.hidden=false};tb.appendChild(b)});
   const dg=h('div');dg.hidden=!sv[mi];sideTop.appendChild(dg);
   dg.appendChild(h('div','beat',RD('Your diagnosis','आपका डायग्नोसिस','നിങ്ങളുടെ ഡയഗ്നോസിസ്')));
   const os=h('div','opts');dg.appendChild(os);const fb=h('div','fb');fb.setAttribute('aria-live','polite');dg.appendChild(fb);const nx=h('div');dg.appendChild(nx);
   const done=()=>{fb.className='fb ok';fb.innerHTML=ICO.ok+' '+UIB('ok')+' '+B3(m.why);$$('.opt',os).forEach((x,k)=>{x.disabled=true;if(k===m.a)x.classList.add('right')});draw();
    nx.innerHTML='';const bt=h('button','btn big on');bt.type='button';bt.innerHTML=(mi<4?RD('Next mission','नेक्स्ट मिशन','നെക്സ്റ്റ് മിഷൻ'):RD('Finish','फिनिश','ഫിനിഷ്'))+' →';bt.onclick=()=>{if(mi<4){mi++;show()}else{finish()}};nx.appendChild(bt)};
   m.o.forEach((o,k)=>{const b=h('button','opt',B3(o));b.type='button';b.onclick=()=>{if(k===m.a){sv[mi]=1;save();award(10,'fc'+mi,P.chk);done()}else{b.classList.add('wrong');b.disabled=true;fb.className='fb no';fb.innerHTML=ICO.no+' '+UIB('again')}};os.appendChild(b)});
   if(sv[mi])done();
   api.redraw()};
  const finish=()=>{sideTop.innerHTML='';rd.innerHTML='';pic.innerHTML='';fin.hidden=false;fin.innerHTML='';
   fin.appendChild(h('div','beat',RD('All 5 missions done','सभी 5 मिशन पूरे','5 മിഷനും പൂർത്തിയായി')));
   fin.appendChild(h('div','trick',`<small>${term('rem')}</small>${B3(['Measure first. Then decide.','पहले मापो। फिर फैसला करो।','ആദ്യം അളക്കൂ. പിന്നെ തീരുമാനിക്കൂ.'])}`));
   fin.appendChild(checkBlock(SL.find(x=>x.id==='g_fault')));
   const nb=h('button','btn big on');nb.type='button';nb.innerHTML=UIB('nx')+' →';nb.onclick=()=>go(cur+1);fin.appendChild(nb)};
  const firstOpen=[0,1,2,3,4].findIndex(i=>!sv[i]);mi=firstOpen<0?4:firstOpen;
  if(firstOpen<0&&Object.keys(sv).length>=5){show();finish()}else show();
  api.setReplay(()=>{})}});
