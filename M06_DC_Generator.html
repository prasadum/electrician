    C(['What is a DC generator?','DC जनरेटर क्या है?','DC ജനറേറ്റർ എന്താണ്?'],['A machine that turns mechanical energy into DC electrical energy.','मैकेनिकल एनर्जी को DC इलेक्ट्रिकल एनर्जी में बदलने वाली मशीन।','മെക്കാനിക്കൽ എനർജിയെ DC ഇലക്ട്രിക്കൽ എനർജിയാക്കുന്ന മെഷീൻ.']),
    C(['Write the EMF equation.','EMF इक्वेशन लिखो।','EMF ഇക്വേഷൻ എഴുതൂ.'],['E = Φ Z N P ÷ (60 A). Φ in weber, N in rpm.','E = Φ Z N P ÷ (60 A)। Φ वेबर में, N rpm में।','E = Φ Z N P ÷ (60 A). Φ വെബറിൽ, N rpm-ൽ.']),
    C(['What is the job of the commutator?','कम्यूटेटर का काम क्या है?','കമ്മ്യൂട്ടേറ്ററിന്റെ ജോലി എന്ത്?'],['It changes the AC in the armature coils into DC for the outside circuit.','यह आर्मेचर कॉइल के AC को बाहर के सर्किट के लिए DC में बदलता है।','ആർമേച്ചർ കോയിലിലെ AC-യെ പുറത്തെ സർക്യൂട്ടിന് DC ആക്കുന്നു.']),
    C(['What is A for lap and wave windings?','लैप और वेव वाइंडिंग में A क्या है?','ലാപ്പ്, വേവ് വൈൻഡിംഗിൽ A എത്ര?'],['Lap: A = P. Wave: A = 2.','लैप: A = P। वेव: A = 2।','ലാപ്പ്: A = P. വേവ്: A = 2.']),
    C(['What is armature reaction?','आर्मेचर रिएक्शन क्या है?','ആർമേച്ചർ റിയാക്ഷൻ എന്താണ്?'],['The effect of the armature’s magnetic field on the main field.','आर्मेचर के मैग्नेटिक फील्ड का मुख्य फील्ड पर असर।','ആർമേച്ചറിന്റെ കാന്തിക ഫീൽഡ് പ്രധാന ഫീൽഡിൽ ചെലുത്തുന്ന ഫലം.'])]},
   {name:L('L2 Why / How','L2 क्यों / कैसे','L2 എന്തുകൊണ്ട് / എങ്ങനെ'),cards:[
    C(['Why do we use many coils in the armature?','आर्मेचर में कई कॉइल क्यों लगाते हैं?','ആർമേച്ചറിൽ ഒരുപാട് കോയിൽ ഉപയോഗിക്കുന്നത് എന്തുകൊണ്ട്?'],['Many coils at different angles fill the dips, so the output is nearly steady DC with little ripple.','अलग-अलग कोण पर कई कॉइल गिरावट भर देती हैं, इसलिए आउटपुट लगभग स्थिर DC, रिपल कम।','വ്യത്യസ്ത കോണുകളിലെ ഒരുപാട് കോയിൽ താഴ്ച നികത്തും, അതിനാൽ ഔട്ട്പുട്ട് ഏതാണ്ട് സ്ഥിര DC, റിപ്പിൾ കുറവ്.']),
    C(['Why does the terminal voltage of a shunt generator fall on load?','लोड पर शंट जनरेटर का टर्मिनल वोल्टेज क्यों गिरता है?','ലോഡിൽ ഷണ്ട് ജനറേറ്ററിന്റെ ടെർമിനൽ വോൾട്ടേജ് കുറയുന്നത് എന്തുകൊണ്ട്?'],['Ia × Ra drop grows, armature reaction weakens the flux, and the lower voltage reduces the field current.','Ia × Ra ड्रॉप बढ़ता है, आर्मेचर रिएक्शन फ्लक्स घटाता है, और कम वोल्टेज फील्ड करंट घटाता है।','Ia × Ra ഡ്രോപ്പ് കൂടും, ആർമേച്ചർ റിയാക്ഷൻ ഫ്ലക്സ് കുറയ്ക്കും, കുറഞ്ഞ വോൾട്ടേജ് ഫീൽഡ് കറന്റും കുറയ്ക്കും.']),
    C(['Why are interpoles fitted?','इंटरपोल क्यों लगाते हैं?','ഇന്റർപോൾ ഘടിപ്പിക്കുന്നത് എന്തുകൊണ്ട്?'],['They cancel the reactance voltage and the cross-flux at the brushes, so commutation is spark-free at every load.','वे ब्रश पर रिएक्टेंस वोल्टेज और क्रॉस-फ्लक्स को कैंसल करते हैं, इसलिए हर लोड पर कम्यूटेशन बिना चिंगारी का।','അവ ബ്രഷിലെ റിയാക്ടൻസ് വോൾട്ടേജും ക്രോസ്-ഫ്ലക്സും ഇല്ലാതാക്കുന്നു, അതിനാൽ എല്ലാ ലോഡിലും തീപ്പൊരി ഇല്ലാത്ത കമ്മ്യൂട്ടേഷൻ.']),
    C(['Why does a shunt generator fail to build up?','शंट जनरेटर बिल्ड-अप क्यों नहीं करता?','ഷണ്ട് ജനറേറ്റർ ബിൽഡ്-അപ്പ് ആകാത്തത് എന്തുകൊണ്ട്?'],['No residual magnetism, field connections reversed, or field resistance above the critical value.','रेज़िड्यूअल मैग्नेटिज़्म नहीं, फील्ड कनेक्शन उलटे, या फील्ड रेज़िस्टेंस क्रिटिकल से ज़्यादा।','റെസിഡ്യുവൽ മാഗ്നറ്റിസം ഇല്ല, ഫീൽഡ് കണക്ഷൻ തിരിഞ്ഞത്, അല്ലെങ്കിൽ ഫീൽഡ് റെസിസ്റ്റൻസ് ക്രിട്ടിക്കലിന് മുകളിൽ.']),
    C(['Why is maximum efficiency at variable loss = constant loss?','वेरिएबल लॉस = कॉन्स्टेंट लॉस पर मैक्सिमम एफिशिएंसी क्यों?','വേരിയബിൾ നഷ്ടം = കോൺസ്റ്റന്റ് നഷ്ടം ആകുമ്പോൾ പരമാവധി എഫിഷ്യൻസി എന്തുകൊണ്ട്?'],['Losses per kW of output are lowest there. Less load wastes constant loss. More load raises I²R faster.','वहाँ प्रति kW आउटपुट लॉस सबसे कम है। कम लोड पर कॉन्स्टेंट लॉस बेकार। ज़्यादा लोड पर I²R तेज़ी से बढ़ता है।','അവിടെ ഓരോ kW ഔട്ട്പുട്ടിനും നഷ്ടം ഏറ്റവും കുറവാണ്. കുറഞ്ഞ ലോഡിൽ കോൺസ്റ്റന്റ് നഷ്ടം പാഴാകുന്നു. കൂടിയ ലോഡിൽ I²R വേഗത്തിൽ കൂടുന്നു.'])]},
   {name:L('L3 Workshop','L3 वर्कशॉप','L3 വർക്ക്ഷോപ്പ്'),cards:[
    C(['A shunt generator gives no voltage. What do you check?','शंट जनरेटर वोल्टेज नहीं देता। क्या जाँचोगे?','ഷണ്ട് ജനറേറ്റർ വോൾട്ടേജ് തരുന്നില്ല. എന്ത് പരിശോധിക്കും?'],['Speed, residual voltage, field connections and polarity, and field resistance. If the residual is lost, flash the field from a DC source.','स्पीड, रेज़िड्यूअल वोल्टेज, फील्ड कनेक्शन और पोलैरिटी, फील्ड रेज़िस्टेंस। रेज़िड्यूअल खत्म हो तो DC सोर्स से फील्ड फ्लैश करो।','സ്പീഡ്, റെസിഡ്യുവൽ വോൾട്ടേജ്, ഫീൽഡ് കണക്ഷനും പോളാരിറ്റിയും, ഫീൽഡ് റെസിസ്റ്റൻസ്. റെസിഡ്യുവൽ പോയെങ്കിൽ DC സോഴ്സിൽ നിന്ന് ഫീൽഡ് ഫ്ലാഷ് ചെയ്യൂ.']),
    C(['The brushes spark heavily. What do you do?','ब्रश पर भारी चिंगारी है। क्या करोगे?','ബ്രഷിൽ കനത്ത തീപ്പൊരി. എന്ത് ചെയ്യും?'],['Switch off. Check brush length, spring pressure, the commutator surface and the mica. Replace, undercut and polish. Check the brush position and the load.','बंद करो। ब्रश लंबाई, स्प्रिंग प्रेशर, कम्यूटेटर सतह और माइका जाँचो। बदलो, अंडरकट और पॉलिश करो। ब्रश पोज़िशन और लोड देखो।','സ്വിച്ച് ഓഫ് ചെയ്യൂ. ബ്രഷ് നീളം, സ്പ്രിംഗ് പ്രഷർ, കമ്മ്യൂട്ടേറ്റർ പ്രതലം, മൈക്ക് എന്നിവ പരിശോധിക്കൂ. മാറ്റി, അണ്ടർകട്ട് ചെയ്ത് പോളിഷ് ചെയ്യൂ. ബ്രഷ് സ്ഥാനവും ലോഡും നോക്കൂ.']),
    C(['Voltage falls badly when the load is switched on. First check?','लोड चालू करते ही वोल्टेज बहुत गिरता है। पहले क्या जाँचोगे?','ലോഡ് ഓൺ ചെയ്യുമ്പോൾ വോൾട്ടേജ് വല്ലാതെ കുറയുന്നു. ആദ്യം എന്ത് പരിശോധിക്കും?'],['The speed on load. A slowing prime mover lowers E. Then check the load against the rating and the brush contact.','लोड पर स्पीड। धीमा होता प्राइम मूवर E घटाता है। फिर लोड को रेटिंग से और ब्रश कांटेक्ट को देखो।','ലോഡിലെ സ്പീഡ്. വേഗത കുറയുന്ന പ്രൈം മൂവർ E കുറയ്ക്കും. പിന്നെ ലോഡ് റേറ്റിംഗുമായും ബ്രഷ് കോൺടാക്ടും നോക്കൂ.'])]}
  ],'m6viva')}});

CS({id:'g_intv',menu:'Interview cards',kind:'law',title:'interview',wide:true,hk:undefined,page(w,s,api){
  const C=(q,a)=>[L(q[0],q[1],q[2]),L(a[0],a[1],a[2])];
  flipDeck(w,api,[
   {name:L('Interview','इंटरव्यू','ഇന്റർവ്യൂ'),cards:[
    C(['Explain how a DC generator works in one minute.','एक मिनट में DC जनरेटर कैसे काम करता है समझाओ।','ഒരു മിനിറ്റിൽ DC ജനറേറ്റർ എങ്ങനെ പ്രവർത്തിക്കുന്നു എന്ന് വിശദീകരിക്കൂ.'],['A prime mover turns the armature in the field of the poles. The conductors cut the flux and an EMF is induced. The commutator and brushes give DC. The EMF is E = Φ Z N P ÷ 60A.','प्राइम मूवर आर्मेचर को पोलों के फील्ड में घुमाता है। कंडक्टर फ्लक्स काटते हैं और EMF बनता है। कम्यूटेटर और ब्रश DC देते हैं। EMF E = Φ Z N P ÷ 60A।','പ്രൈം മൂവർ ആർമേച്ചറിനെ പോളുകളുടെ ഫീൽഡിൽ കറക്കുന്നു. കണ്ടക്ടർ ഫ്ലക്സ് മുറിച്ച് EMF ഉണ്ടാകുന്നു. കമ്മ്യൂട്ടേറ്ററും ബ്രഷും DC തരുന്നു. EMF E = Φ Z N P ÷ 60A.']),
    C(['Lap or wave winding: which would you choose for a high-voltage machine?','हाई-वोल्टेज मशीन के लिए लैप या वेव: कौन चुनोगे?','ഉയർന്ന വോൾട്ടേജ് മെഷീന് ലാപ്പോ വേവോ: ഏത് തിരഞ്ഞെടുക്കും?'],['Wave. It has only two parallel paths, so more conductors are in series per path and the EMF is higher. Lap is for high current.','वेव। इसमें सिर्फ़ दो पैरेलल पाथ, इसलिए हर पाथ में ज़्यादा कंडक्टर सीरीज़ में और EMF ज़्यादा। लैप हाई करंट के लिए।','വേവ്. ഇതിന് രണ്ട് പാരലൽ പാത്ത് മാത്രം, അതിനാൽ ഓരോ പാത്തിലും കൂടുതൽ കണ്ടക്ടർ സീരീസിൽ, EMF കൂടുതൽ. ലാപ്പ് ഉയർന്ന കറന്റിന്.']),
    C(['Why does a compound generator hold its voltage steadier?','कंपाउंड जनरेटर वोल्टेज ज़्यादा स्टेडी क्यों रखता है?','കോമ്പൗണ്ട് ജനറേറ്റർ വോൾട്ടേജ് കൂടുതൽ സ്ഥിരമായി നിലനിർത്തുന്നത് എന്തുകൊണ്ട്?'],['Its series turns add flux as the load rises. That raises the EMF and offsets the Ia × Ra drop.','इसके सीरीज़ टर्न लोड बढ़ने पर फ्लक्स जोड़ते हैं। इससे EMF बढ़ता है और Ia × Ra ड्रॉप की भरपाई होती है।','ലോഡ് കൂടുമ്പോൾ അതിന്റെ സീരീസ് ടേണുകൾ ഫ്ലക്സ് കൂട്ടുന്നു. ഇത് EMF കൂട്ടി Ia × Ra ഡ്രോപ്പ് നികത്തുന്നു.'])]}
  ],'m6intv')}});


/* MCQ */
CS({id:'g_mcq',menu:'MCQ quiz',kind:'tip',title:'quiz',wide:true,hk:undefined,page(w,s,api){
  const Q=[
   [L('Which part changes the AC induced in the armature coils into DC?','आर्मेचर कॉइल में इंड्यूस्ड AC को DC कौन सा हिस्सा बनाता है?','ആർമേച്ചർ കോയിലിൽ ഇൻഡ്യൂസ് ആകുന്ന AC-യെ DC ആക്കുന്ന ഭാഗം ഏത്?'),[L('Commutator','कम्यूटेटर','കമ്മ്യൂട്ടേറ്റർ'),L('Yoke','योक','യോക്ക്'),L('Field coil','फील्ड कॉइल','ഫീൽഡ് കോയിൽ'),L('Pole shoe','पोल शू','പോൾ ഷൂ')],0,L('The commutator flips the connections at the right moment.','कम्यूटेटर सही पल पर कनेक्शन पलटता है।','കമ്മ്യൂട്ടേറ്റർ ശരിയായ സമയത്ത് കണക്ഷൻ മാറ്റിമറിക്കുന്നു.')],
   [L('A shunt generator supplies 18 A to the load. The field current is 2 A. The armature current is …','शंट जनरेटर लोड को 18 A देता है। फील्ड करंट 2 A। आर्मेचर करंट …','ഷണ്ട് ജനറേറ്റർ ലോഡിന് 18 A നൽകുന്നു. ഫീൽഡ് കറന്റ് 2 A. ആർമേച്ചർ കറന്റ് …'),['20 A','16 A','18 A','36 A'],0,L('Ia = IL + If = 18 + 2 = 20 A.','Ia = IL + If = 18 + 2 = 20 A।','Ia = IL + If = 18 + 2 = 20 A.')],
   [L('A generator has E = 240 V, Ia = 40 A and Ra = 0.25 Ω. The terminal voltage is …','जनरेटर: E = 240 V, Ia = 40 A, Ra = 0.25 Ω। टर्मिनल वोल्टेज …','ജനറേറ്റർ: E = 240 V, Ia = 40 A, Ra = 0.25 Ω. ടെർമിനൽ വോൾട്ടേജ് …'),['230 V','250 V','200 V','239.9 V'],0,L('Drop = 40 × 0.25 = 10 V. V = 240 − 10 = 230 V.','ड्रॉप = 40 × 0.25 = 10 V। V = 240 − 10 = 230 V।','ഡ്രോപ്പ് = 40 × 0.25 = 10 V. V = 240 − 10 = 230 V.')],
