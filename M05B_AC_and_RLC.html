html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:400 16px/1.35 NL,NG,NM,ND,NK,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bar{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.bar .ttl{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{min-width:44px;min-height:44px;padding:0 12px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--def);border-color:var(--def);color:#fff}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--def);outline-offset:2px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-width:44px;min-height:44px;border:0;background:var(--card);font-weight:700;font-size:14px;padding:0 8px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--def);color:#fff}
#prog{height:6px;background:var(--line);flex:none}#prog i{display:block;height:100%;width:0;background:var(--def);transition:width .25s}
#xp{font-weight:700;font-size:14px;color:var(--frm);display:none}
body.study #xp{display:inline}
#stage{flex:1;min-height:0;overflow:auto;display:flex;touch-action:pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.slide{margin:auto;width:100%;min-height:100%;display:grid;gap:10px;padding:10px 12px 14px;
  grid-template-columns:1fr;grid-template-areas:"head" "vis" "side";align-content:start}
.s-head{grid-area:head;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;border-left:8px solid var(--k);padding-left:10px}
.s-vis{grid-area:vis;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px;position:relative;min-width:0}
.s-vis svg{width:100%;height:auto;max-height:52vh;display:block;touch-action:pan-y pinch-zoom}
.s-side{grid-area:side;display:flex;flex-direction:column;gap:10px;min-width:0}
.kind-def{--k:var(--def);--kb:var(--def-bg)}.kind-law{--k:var(--law);--kb:var(--law-bg)}
.kind-formula{--k:var(--frm);--kb:var(--frm-bg)}.kind-warn{--k:var(--warn);--kb:var(--warn-bg)}.kind-tip{--k:var(--tip);--kb:var(--tip-bg)}
.kind-def .s-vis,.kind-law .s-vis,.kind-formula .s-vis,.kind-warn .s-vis,.kind-tip .s-vis{border-color:var(--k)}
.tag{font-size:14px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--kb);color:var(--k);border:1.5px solid var(--k);white-space:nowrap}
.tag.add{background:#fff6cf;color:#6a4b00;border-color:#d9a400}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tag.add{background:#3a3010;color:#ffd84a;border-color:#a98400}}
:root[data-theme=dark] .tag.add{background:#3a3010;color:#ffd84a;border-color:#a98400}
h2.term{margin:0;font-size:clamp(22px,5.4vw,30px);line-height:1.15}
.t .en{font-weight:700}.t .hi,.t .ml{display:block;font-size:14px;font-weight:400;color:var(--mut);line-height:1.25}
.t .hi,.t .ml{display:none}
h2.term .t .hi,h2.term .t .ml{display:none}
body[data-lang=hi] .t .hi,body[data-lang=all] .t .hi,body[data-lang=ml] .t .ml,body[data-lang=all] .t .ml{display:block}
body[data-lang=hi] h2.term .t .hi,body[data-lang=all] h2.term .t .hi,body[data-lang=ml] h2.term .t .ml,body[data-lang=all] h2.term .t .ml{display:inline;font-size:.7em;font-weight:400;color:var(--mut)}
h2.term .t .hi::before,h2.term .t .ml::before{content:' / ';color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--kb,var(--card));border:1.5px solid var(--k,var(--line));border-radius:10px;padding:6px 10px;font-size:16px;min-width:0}
.chip .sym{display:block;font-size:14px;color:var(--mut);font-weight:600}
.chip .sym sup,.chip .sym sub{font-size:inherit}
.hook{display:flex;gap:8px;align-items:center;font-weight:700;font-size:18px;background:var(--kb);border-radius:10px;padding:8px 10px;border:1.5px dashed var(--k)}
.hook small{font-size:14px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.beat{font-size:14px;font-weight:700;color:var(--mut);margin:0 0 4px}
.pred{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.pred .q{font-weight:700;font-size:18px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:48px;padding:6px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px;touch-action:manipulation;flex:1 1 auto;min-width:88px}

const INL=new Set(['I','B','SUB','SUP','EM','STRONG','SMALL']);
function wrapT(en,hi,ml){const sp=document.createElement('span');sp.className='t';sp.innerHTML=`<span class="en">${en}</span><span class="hi">${hi}</span><span class="ml">${ml}</span>`;return sp}
const SYM=new Set(['Vav','Vrms','Vpp','rms','sin','cos','tan','kWh','kVA','kVAR','kW','Vm','Em','rad','mm','kHz','MHz','Hz','mA','kΩ','MΩ','VAR','RMS','AC','DC','Wb']);
function needs(t){return (t.match(/[A-Za-z]{3,}/g)||[]).filter(w=>!SYM.has(w)).length>=1}
function autoT(root){if(!root)return;
 const els=[...root.querySelectorAll('*')];
 for(const e of els){if(!e.isConnected||e.closest('.t,svg,script,style,textarea'))continue;
  const kids=[...e.childNodes];if(!kids.length)continue;
  const simple=kids.every(n=>n.nodeType===3||(n.nodeType===1&&INL.has(n.tagName)&&[...n.querySelectorAll('*')].every(c=>INL.has(c.tagName))));
  if(simple){const txt=e.textContent;if(!norm(txt))continue;const r=xl(txt);
   if(r){const en=e.innerHTML;e.innerHTML='';e.appendChild(wrapT(en,r[0],r[1]));continue}
   if(needs(txt))MISS.add(norm(txt))
  }else{
   for(const n of kids){if(n.nodeType!==3)continue;const tx=n.textContent;if(!norm(tx))continue;const r=xl(tx);
    if(r){const sp=wrapT(tx.trim(),r[0],r[1]);n.replaceWith(document.createTextNode(' '),sp)}
    else if(needs(tx))MISS.add(norm(tx))}}}}
let xq=false;function xsched(){if(xq)return;xq=true;requestAnimationFrame(()=>{xq=false;autoT(document.getElementById('stage'))})}
function autoInit(){const st=document.getElementById('stage');if(!st||st.__xo)return;st.__xo=1;new MutationObserver(xsched).observe(st,{childList:true,subtree:true,characterData:true});xsched()}

/* ---- geometry helpers for flowing dots ---- */
function mkPath(pts){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,L,tot:L[L.length-1]}}
function at(P_,s){s=((s%1)+1)%1;const d=s*P_.tot;let i=1;while(i<P_.L.length-1&&P_.L[i]<d)i++;
  const a=P_.pts[i-1],b=P_.pts[i],k=(d-P_.L[i-1])/((P_.L[i]-P_.L[i-1])||1);return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]}

  const i=h('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=val;i.id=id;i.setAttribute('aria-label',label.replace(/<[^>]+>/g,''));
  const v=$('.val',l);const upd=()=>{v.textContent=fmt(+i.value)};
  i.addEventListener('input',()=>{upd();cb(+i.value)});upd();l.appendChild(i);host.appendChild(l);
  return{get:()=>+i.value,set:x=>{i.value=x;upd()},input:i}}

const arr=(x1,y1,x2,y2,c,sw)=>{const a=Math.atan2(y2-y1,x2-x1),l=9;c=c||'var(--fg)';sw=sw||3;
 return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${c}" stroke-width="${sw}" fill="none" stroke-linecap="round"/><path d="M${x2.toFixed(1)} ${y2.toFixed(1)}l${(-l*Math.cos(a-.5)).toFixed(1)} ${(-l*Math.sin(a-.5)).toFixed(1)}M${x2.toFixed(1)} ${y2.toFixed(1)}l${(-l*Math.cos(a+.5)).toFixed(1)} ${(-l*Math.sin(a+.5)).toFixed(1)}" stroke="${c}" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`};

   const txt=res?RD('Resistor: V and I rise and fall together. In phase.','रेसिस्टर: V और I साथ-साथ चढ़ते-उतरते हैं। इन-फेज़।','റെസിസ്റ്റർ: V, I ഒരുമിച്ച് കൂടുകയും കുറയുകയും ചെയ്യുന്നു. ഇൻ-ഫേസ്.'):kind==='L'?RD('Inductor: V peaks first. I peaks a quarter cycle later. I lags V by 90°.','इंडक्टर: V पहले पीक करता है। I चौथाई साइकिल बाद। I, V से 90° लैग।','ഇൻഡക്ടർ: V ആദ്യം പീക്ക്. I കാൽ സൈക്കിൾ വൈകി. I, V-യെക്കാൾ 90° ലാഗ്.'):RD('Capacitor: I peaks first. V peaks a quarter cycle later. I leads V by 90°.','कैपेसिटर: I पहले पीक करता है। V चौथाई साइकिल बाद। I, V से 90° लीड।','കപ്പാസിറ്റർ: I ആദ്യം പീക്ക്. V കാൽ സൈക്കിൾ വൈകി. I, V-യെക്കാൾ 90° ലീഡ്.');
   setRd(rd,`<span>${txt}</span>`)}}

/* ---------- 3 Inductor in AC ---------- */
CS({id:'b_ind',menu:'Inductor in AC',title:'t_ind',
 flash:FB('Self-induction (Module 5A, slide 14); lag (Module 0, slide 29)','सेल्फ-इंडक्शन (मॉड्यूल 5A, स्लाइड 14); लैग (मॉड्यूल 0, स्लाइड 29)','സെൽഫ്-ഇൻഡക്ഷൻ (മൊഡ്യൂൾ 5A, സ്ലൈഡ് 14); ലാഗ് (മൊഡ്യൂൾ 0, സ്ലൈഡ് 29)'),
 hook:L('AC keeps changing, and a coil fights every change. So the current is always a step late.','AC लगातार बदलता है और कॉइल हर बदलाव से लड़ती है। इसलिए करंट हमेशा एक कदम पीछे।','AC എപ്പോഴും മാറുന്നു, കോയിൽ ഓരോ മാറ്റത്തെയും എതിർക്കുന്നു. അതിനാൽ കറന്റ് എപ്പോഴും ഒരു ചുവട് പിന്നിൽ.'),
 defn:L('<b>Pure inductor in AC:</b> the current <b>lags</b> the voltage by 90°. The current is zero when the voltage is at its peak. It stores energy in its magnetic field.','<b>AC में प्योर इंडक्टर:</b> करंट वोल्टेज से 90° <b>लैग</b> करता है। वोल्टेज पीक पर हो तो करंट ज़ीरो। एनर्जी मैग्नेटिक फील्ड में रखता है।','<b>AC-യിൽ പ്യുവർ ഇൻഡക്ടർ:</b> കറന്റ് വോൾട്ടേജിനേക്കാൾ 90° <b>ലാഗ്</b> ചെയ്യുന്നു. വോൾട്ടേജ് പീക്കിലായിരിക്കുമ്പോൾ കറന്റ് പൂജ്യം. എനർജി മാഗ്നറ്റിക് ഫീൽഡിൽ സൂക്ഷിക്കുന്നു.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="An AC source feeding a coil"><circle cx="50" cy="50" r="22" class="sf"/><path d="M38 50q6 -12 12 0t12 0" class="w"/><path class="w" d="M72 50H110M190 50H230V86H50V72"/>${coilH(110,50,80,30,5,3.5)}</svg>`,
 play:L('Press Inductor, then Resistor (reference). Watch which wave peaks first.','Inductor दबाओ, फिर Resistor (reference)। देखो कौन-सी वेव पहले पीक करती है।','Inductor അമർത്തൂ, പിന്നെ Resistor (reference). ഏത് വേവ് ആദ്യം പീക്ക് ചെയ്യുന്നു എന്ന് നോക്കൂ.'),
 pred:{q:L('In a pure inductor, which wave peaks first?','प्योर इंडक्टर में कौन-सी वेव पहले पीक करती है?','പ്യുവർ ഇൻഡക്ടറിൽ ഏത് വേവ് ആദ്യം പീക്ക് ചെയ്യും?'),o:[L('Voltage','वोल्टेज','വോൾട്ടേജ്'),L('Current','करंट','കറന്റ്'),L('Both together','दोनों साथ','രണ്ടും ഒരുമിച്ച്')],a:0,why:L('The coil resists the rise of current, so current arrives later. I lags V.','कॉइल करंट के बढ़ने का विरोध करती है, इसलिए करंट देर से आता है। I, V से लैग।','കോയിൽ കറന്റ് കൂടുന്നതിനെ എതിർക്കുന്നു, അതിനാൽ കറന്റ് വൈകും. I, V-യെക്കാൾ ലാഗ്.')},
 labels:['coilt','pole'],hints:['phs','selfi'],
 note:L('Real coils also have wire resistance, so the lag is a little less than 90°. We use the pure inductor first.','असली कॉइल में वायर रेसिस्टेंस भी होता है, इसलिए लैग 90° से थोड़ा कम। पहले प्योर इंडक्टर लेते हैं।','യഥാർത്ഥ കോയിലിന് വയർ റെസിസ്റ്റൻസും ഉണ്ട്, അതിനാൽ ലാഗ് 90°-യെക്കാൾ അല്പം കുറവ്. ആദ്യം പ്യുവർ ഇൻഡക്ടർ എടുക്കുന്നു.'),
 trick:L('ELI: in L, current I lags voltage E.','ELI: L में करंट I, वोल्टेज E से लैग।','ELI: L-ൽ കറന്റ് I, വോൾട്ടേജ് E-യെക്കാൾ ലാഗ്.'),
 check:{q:L('At 50 Hz, T = 20 ms. A 90° lag is a quarter cycle, so I is late by …','50 Hz पर T = 20 ms। 90° लैग यानी चौथाई साइकिल, तो I देर से है …','50 Hz-ൽ T = 20 ms. 90° ലാഗ് കാൽ സൈക്കിൾ, അതിനാൽ I വൈകുന്നത് …'),o:['5 ms','10 ms','20 ms'],a:0},
 build(w,api){return acDemo(w,api,'L')}});

/* ---------- 4 Inductive reactance ---------- */
const XFa=[25,50,100,200],XLa=[.1,.2,.4];
CS({id:'b_xl',menu:'Inductive reactance',title:'t_xl',
 flash:FB('f and T (Module 0, slide 24); coil is a wire in DC (Module 5A, slide 22)','f और T (मॉड्यूल 0, स्लाइड 24); DC में कॉइल तार है (मॉड्यूल 5A, स्लाइड 22)','f, T (മൊഡ്യൂൾ 0, സ്ലൈഡ് 24); DC-യിൽ കോയിൽ വയർ ആണ് (മൊഡ്യൂൾ 5A, സ്ലൈഡ് 22)'),
 hook:L('The same coil passes lots of DC but little AC. Faster AC, even less.','वही कॉइल DC बहुत देती है पर AC कम। AC जितना तेज़, उतना कम।','അതേ കോയിൽ DC ധാരാളം കടത്തിവിടും, AC കുറച്ചേ. AC വേഗം കൂടിയാൽ ഇനിയും കുറയും.'),
 defn:L('<b>Inductive reactance XL</b> is the opposition of a coil to AC. Unit: ohm (Ω). It rises with frequency and with inductance. In DC (f = 0) it is zero.','<b>इंडक्टिव रिएक्टेंस XL</b> AC के प्रति कॉइल का विरोध है। यूनिट: ओम (Ω)। फ्रीक्वेंसी और इंडक्टेंस के साथ बढ़ता है। DC (f = 0) में शून्य।','<b>ഇൻഡക്ടീവ് റിയാക്ടൻസ് XL</b> AC-യോടുള്ള കോയിലിന്റെ എതിർപ്പാണ്. യൂണിറ്റ്: ഓം (Ω). ഫ്രീക്വൻസിയും ഇൻഡക്ടൻസും കൂടുമ്പോൾ കൂടും. DC-യിൽ (f = 0) പൂജ്യം.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="A coil with slow and fast AC arrows">${coilH(100,50,100,36,6,3.5)}${arr(30,50,90,50,'var(--def)',3)}${TT(150,92,'Faster AC: more opposition','तेज़ AC: ज़्यादा विरोध','വേഗമുള്ള AC: കൂടുതൽ എതിർപ്പ്','m')}</svg>`,
 play:L('Slide f and L. Press DC (f = 0). Watch the XL bar.','f और L स्लाइड करो। DC (f = 0) दबाओ। XL बार देखो।','f, L സ്ലൈഡ് ചെയ്യൂ. DC (f = 0) അമർത്തൂ. XL ബാർ നോക്കൂ.'),
 pred:{q:L('The frequency is doubled. The reactance XL becomes …','फ्रीक्वेंसी डबल। रिएक्टेंस XL हो जाता है …','ഫ്രീക്വൻസി ഇരട്ടി. റിയാക്ടൻസ് XL ആകും …'),o:[L('double','डबल','ഇരട്ടി'),L('half','आधा','പകുതി'),L('the same','वही','അതേ')],a:0,why:L('XL = 2π × f × L. It is in direct proportion to f.','XL = 2π × f × L। यह f के सीधे अनुपात में है।','XL = 2π × f × L. ഇത് f-ന് നേർ അനുപാതത്തിലാണ്.')},
 labels:['react','henry'],hints:['cyc','dcw'],rel:{c:['f','L','X<sub>L</sub>'],h:'X<sub>L</sub>'},
 fm:['<i>X<sub>L</sub></i> = 2<i>π</i> × <i>f</i> × <i>L</i>'],
 uses:L('XL in ohm, f in hertz, L in henry, 2π ≈ 6.28. AC, sine wave only. Used in: chokes, motor windings, ballasts.','XL ओम में, f हर्ट्ज़ में, L हेनरी में, 2π ≈ 6.28। सिर्फ़ AC साइन वेव। इस्तेमाल: चोक, मोटर वाइंडिंग, बैलास्ट।','XL ഓമിൽ, f ഹെർട്സിൽ, L ഹെൻറിയിൽ, 2π ≈ 6.28. AC സൈൻ വേവ് മാത്രം. ഉപയോഗം: ചോക്ക്, മോട്ടോർ വൈൻഡിംഗ്, ബാലസ്റ്റ്.'),
 ex:L('Mental sum: L = 0.1 H at 50 Hz gives XL ≈ 31 Ω. At 100 Hz it is ≈ 63 Ω. At 25 Hz it is ≈ 16 Ω.','मेंटल सम: L = 0.1 H, 50 Hz पर XL ≈ 31 Ω। 100 Hz पर ≈ 63 Ω। 25 Hz पर ≈ 16 Ω।','മെന്റൽ സം: L = 0.1 H, 50 Hz-ൽ XL ≈ 31 Ω. 100 Hz-ൽ ≈ 63 Ω. 25 Hz-ൽ ≈ 16 Ω.'),
 trick:L('Bigger f or bigger L: bigger XL.','बड़ा f या बड़ा L: बड़ा XL।','വലിയ f അല്ലെങ്കിൽ വലിയ L: വലിയ XL.'),
 check:{q:L('A coil is on steady DC (f = 0). Its XL is … so it acts like a …','कॉइल स्थिर DC पर है (f = 0)। उसका XL … तो वह … जैसी है','കോയിൽ സ്ഥിര DC-യിൽ (f = 0). അതിന്റെ XL … അതിനാൽ അത് … പോലെ'),o:[L('0, plain wire','0, सादा तार','0, സാധാരണ വയർ'),L('very large, open gap','बहुत बड़ा, ओपन गैप','വളരെ വലുത്, ഓപ്പൺ ഗ്യാപ്')],a:0},
 build(w,api){
  w.innerHTML=S(420,215,`<g id="a"></g>`,'Bars for inductive reactance and the current at 230 volts');
  const rd=mkRd(w),c=mkCtl(w);let fi=1,li=0,dc=false;
  slider(c,'f',0,3,1,1,x=>XFa[x]+' Hz',x=>{fi=x;dc=false;api.redraw()});

  button(c,L('DC (f = 0)','DC (f = 0)','DC (f = 0)'),()=>{dc=true;api.redraw()});
  return t=>{const f=dc?0:XFa[fi],Lh=XLa[li],X=TPI*f*Lh,I=X>0?230/X:0;
   let s=`<text x="10" y="40" class="tx">X<tspan font-size="12" dy="4">L</tspan></text><rect x="60" y="22" width="${clamp(Math.sqrt(X/520)*320,2,320).toFixed(0)}" height="26" rx="5" fill="var(--law)"/><text x="${(66+clamp(Math.sqrt(X/520)*320,2,320)).toFixed(0)}" y="42" class="tx" style="font-size:16px">${dc?'0 Ω':fm1(X)+' Ω'}</text>`;
   s+=`<text x="10" y="106" class="tx">I</text><rect x="60" y="88" width="${dc?320:clamp(I/15*320,2,320).toFixed(0)}" height="26" rx="5" fill="var(--frm)"/><text x="${dc?60:(66+clamp(I/15*320,2,320)).toFixed(0)}" y="${dc?136:108}" class="tx" style="font-size:16px">${dc?'':fm1(I)+' A'}</text>`;
   if(dc)s+=TT(66,106,'only the wire R limits it','सिर्फ़ वायर R रोकता है','വയർ R മാത്രം തടയുന്നു','s');
   s+=TT(10,176,'230 V AC supply','230 V AC सप्लाई','230 V AC സപ്ലൈ','s');
   put($('#a',w),s);
   setRd(rd,`<span>X<sub>L</sub> = 2π × ${f} × ${Lh} = <b>${dc?0:fm1(X)} Ω</b></span><span>${dc?RD('DC: coil = plain wire','DC: कॉइल = सादा तार','DC: കോയിൽ = സാധാരണ വയർ'):'I = 230 ÷ X<sub>L</sub> = <b>'+fm1(I)+' A</b>'}</span>`)}}});

CS({id:'b_cap',menu:'Capacitor in AC',title:'t_cap',
 flash:FB('Capacitor charge and discharge (Module 5A, slide 18); lead (Module 0, slide 29)','कैपेसिटर चार्ज और डिस्चार्ज (मॉड्यूल 5A, स्लाइड 18); लीड (मॉड्यूल 0, स्लाइड 29)','കപ്പാസിറ്റർ ചാർജ്, ഡിസ്ചാർജ് (മൊഡ്യൂൾ 5A, സ്ലൈഡ് 18); ലീഡ് (മൊഡ്യൂൾ 0, സ്ലൈഡ് 29)'),

 play:L('Press Capacitor, then Resistor (reference). Watch which wave peaks first.','Capacitor दबाओ, फिर Resistor (reference)। देखो कौन-सी वेव पहले पीक करती है।','Capacitor അമർത്തൂ, പിന്നെ Resistor (reference). ഏത് വേവ് ആദ്യം പീക്ക് ചെയ്യുന്നു എന്ന് നോക്കൂ.'),
 pred:{q:L('In a pure capacitor, which wave peaks first?','प्योर कैपेसिटर में कौन-सी वेव पहले पीक करती है?','പ്യുവർ കപ്പാസിറ്ററിൽ ഏത് വേവ് ആദ്യം പീക്ക് ചെയ്യും?'),o:[L('Current','करंट','കറന്റ്'),L('Voltage','वोल्टेज','വോൾട്ടേജ്'),L('Both together','दोनों साथ','രണ്ടും ഒരുമിച്ച്')],a:0,why:L('Charge has to flow in before the voltage can build. I leads V.','वोल्टेज बनने से पहले चार्ज बहना पड़ता है। I, V से लीड।','വോൾട്ടേജ് കൂടുന്നതിന് മുമ്പ് ചാർജ് ഒഴുകണം. I, V-യെക്കാൾ ലീഡ്.')},

 defn:L('<b>Impedance Z</b> is the total opposition to AC. The resistive drop is in phase with the current. The reactive drop is 90° away. So R and X add like the two sides of a right triangle: <b>Z² = R² + X²</b>.','<b>इम्पीडेंस Z</b> AC का टोटल विरोध है। रेसिस्टिव ड्रॉप करंट के साथ इन-फेज़। रिएक्टिव ड्रॉप 90° दूर। इसलिए R और X समकोण त्रिभुज की दो भुजाओं की तरह जुड़ते हैं: <b>Z² = R² + X²</b>।','<b>ഇം‌പീഡൻസ് Z</b> AC-യോടുള്ള ആകെ എതിർപ്പാണ്. റെസിസ്റ്റീവ് ഡ്രോപ്പ് കറന്റിനോട് ഇൻ-ഫേസ്. റിയാക്ടീവ് ഡ്രോപ്പ് 90° അകലെ. അതിനാൽ R, X ഒരു മട്ടത്രികോണത്തിന്റെ രണ്ട് വശങ്ങൾ പോലെ കൂടും: <b>Z² = R² + X²</b>.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="A right triangle with sides R, X and Z"><path d="M60 80H200V20Z" fill="var(--frm-bg)" stroke="var(--frm)" stroke-width="3"/>${TT(130,96,'R','R','R','m')}${TT(214,54,'X','X','X','m')}${TT(110,44,'Z','Z','Z','m')}</svg>`,
 play:L('Slide R and X. Tap the 3-4, 6-8, 5-12 buttons. Compare Z with R + X.','R और X स्लाइड करो। 3-4, 6-8, 5-12 बटन दबाओ। Z की R + X से तुलना करो।','R, X സ്ലൈഡ് ചെയ്യൂ. 3-4, 6-8, 5-12 ബട്ടണുകൾ അമർത്തൂ. Z-നെ R + X-മായി താരതമ്യം ചെയ്യൂ.'),
 pred:{q:L('R = 6 Ω and X = 8 Ω in series. Z = ?','R = 6 Ω और X = 8 Ω सीरीज़ में। Z = ?','R = 6 Ω, X = 8 Ω സീരീസിൽ. Z = ?'),o:['10 Ω','14 Ω','48 Ω'],a:0,why:L('36 + 64 = 100. The square root is 10. Never 6 + 8.','36 + 64 = 100। वर्गमूल 10। कभी 6 + 8 नहीं।','36 + 64 = 100. വർഗ്ഗമൂലം 10. ഒരിക്കലും 6 + 8 അല്ല.')},
 labels:['imped','react'],hints:['pyth','tri'],rel:{c:['R','X','Z','φ'],h:'Z'},
 fm:['<i>Z</i> = √(<i>R</i>² + <i>X</i>²)','tan <i>φ</i> = <i>X</i> ÷ <i>R</i>'],
 uses:L('Z, R, X in ohm. φ is the angle between voltage and current. Series circuit, AC sine wave only. Same triangle as Module 0, slide 33.','Z, R, X ओम में। φ वोल्टेज और करंट के बीच का कोण। सीरीज़ सर्किट, सिर्फ़ AC साइन वेव। मॉड्यूल 0, स्लाइड 33 वाला ही त्रिभुज।','Z, R, X ഓമിൽ. φ വോൾട്ടേജിനും കറന്റിനും ഇടയിലെ കോൺ. സീരീസ് സർക്യൂട്ട്, AC സൈൻ വേവ് മാത്രം. മൊഡ്യൂൾ 0, സ്ലൈഡ് 33-ലെ അതേ ത്രികോണം.'),
 ex:L('Mental sums: 3, 4 gives 5. 6, 8 gives 10. 5, 12 gives 13.','मेंटल सम: 3, 4 से 5। 6, 8 से 10। 5, 12 से 13।','മെന്റൽ സം: 3, 4 → 5. 6, 8 → 10. 5, 12 → 13.'),
 trick:L('R along, X up, Z slants. Never add straight.','R सीधा, X ऊपर, Z तिरछा। कभी सीधा नहीं जोड़ते।','R നേരെ, X മുകളിലേക്ക്, Z ചരിഞ്ഞ്. ഒരിക്കലും നേരെ കൂട്ടരുത്.'),
 check:{q:L('R = 6 Ω and Z = 10 Ω. Using cos φ = base ÷ hypotenuse, cos φ = ?','R = 6 Ω और Z = 10 Ω। cos φ = आधार ÷ कर्ण से, cos φ = ?','R = 6 Ω, Z = 10 Ω. cos φ = ആധാരം ÷ കർണ്ണം ഉപയോഗിച്ച്, cos φ = ?'),o:['0.6','0.8','1.67'],a:0},
 build(w,api){
  w.innerHTML=S(420,215,`<g id="a"></g>`,'A right triangle with R along the base, X upwards and Z slanting; bars compare Z with R plus X');
  const rd=mkRd(w),c=mkCtl(w);let R=3,X=4;
  const sR=slider(c,'R',1,12,1,3,x=>x+' Ω',x=>{R=x;api.redraw()}),sX=slider(c,'X',1,12,1,4,x=>x+' Ω',x=>{X=x;api.redraw()});
  [[3,4],[6,8],[5,12]].forEach(p=>button(c,p[0]+'-'+p[1],()=>{R=p[0];X=p[1];sR.set(R);sX.set(X);api.redraw()}));
  return t=>{const Z=Math.hypot(R,X),phi=Math.atan2(X,R)*180/Math.PI,k=Math.min(26,150/Math.max(R,X)),ox=24,oy=165;
   let s=`<path d="M${ox} ${oy}H${ox+R*k}V${oy-X*k}Z" fill="var(--frm-bg)" stroke="var(--frm)" stroke-width="3"/>`;
   s+=`<path d="M${ox+R*k} ${oy}v-8h-8" fill="none" stroke="var(--fg)" stroke-width="1.5"/>`;
   s+=`<text x="${ox+R*k/2}" y="${oy+18}" text-anchor="middle" class="tx">R = ${R}</text><text x="${ox+R*k+8}" y="${oy-X*k/2}" class="tx">X = ${X}</text><text x="${ox+R*k/2-34}" y="${oy-X*k/2-6}" class="tx s">Z = ${fm1(Z)}</text>`;
   s+=`<text x="${ox+34}" y="${oy-6}" class="tx s">φ ${Math.round(phi)}°</text>`;
   const bx=250,bw=140,mx=24;
   s+=`<text x="${bx}" y="30" class="tx s" data-en="Not R + X" data-hi="R + X नहीं" data-ml="R + X അല്ല">Not R + X</text><rect x="${bx}" y="36" width="${((R+X)/mx*bw).toFixed(0)}" height="20" rx="4" fill="var(--no)"/><text x="${bx+4}" y="52" class="tx" style="font-size:14px;fill:#fff">${R+X}</text>`;
   s+=`<text x="${bx}" y="86" class="tx s" data-en="True Z" data-hi="सही Z" data-ml="ശരിയായ Z">True Z</text><rect x="${bx}" y="92" width="${(Z/mx*bw).toFixed(0)}" height="20" rx="4" fill="var(--ok)"/><text x="${bx+4}" y="108" class="tx" style="font-size:14px;fill:#fff">${fm1(Z)}</text>`;
   put($('#a',w),s);
   setRd(rd,`<span>Z = √(${R}² + ${X}²) = <b>${fm1(Z)} Ω</b></span><span>cos φ = ${R} ÷ ${fm1(Z)} = <b>${(R/Z).toFixed(2)}</b></span>`)}}});

/* ---------- 9 Series RL and RC ---------- */
CS({id:'b_rlrc',menu:'Series RL and RC',title:'t_rlrc',
 flash:FB('R and X add at 90° (slide 8); I lags in L, leads in C (slides 3, 5)','R और X 90° पर जुड़ते हैं (स्लाइड 8); L में I लैग, C में लीड (स्लाइड 3, 5)','R, X 90°-യിൽ കൂടും (സ്ലൈഡ് 8); L-ൽ I ലാഗ്, C-യിൽ ലീഡ് (സ്ലൈഡ് 3, 5)'),
 hook:L('The drops across R and across the coil are 60 V and 80 V. The supply is only 100 V!','R और कॉइल पर ड्रॉप 60 V और 80 V हैं। सप्लाई सिर्फ़ 100 V!','R-ലും കോയിലിലും ഡ്രോപ്പ് 60 V, 80 V ആണ്. സപ്ലൈ വെറും 100 V!'),
 defn:L('In a series RL or RC circuit the same current flows in all parts. The voltage drops VR and VX are 90° apart, so they add like a right triangle too. The current lags (RL) or leads (RC) the supply by angle φ.','सीरीज़ RL या RC में सब पार्ट में वही करंट। वोल्टेज ड्रॉप VR और VX 90° दूर हैं, इसलिए वे भी समकोण त्रिभुज की तरह जुड़ते हैं। करंट सप्लाई से कोण φ पर लैग (RL) या लीड (RC) करता है।','സീരീസ് RL അല്ലെങ്കിൽ RC-യിൽ എല്ലാ പാർട്ടിലും ഒരേ കറന്റ്. VR, VX വോൾട്ടേജ് ഡ്രോപ്പുകൾ 90° അകലെയാണ്, അതിനാൽ അവയും മട്ടത്രികോണം പോലെ കൂടും. കറന്റ് സപ്ലൈയേക്കാൾ φ കോണിൽ ലാഗ് (RL) അല്ലെങ്കിൽ ലീഡ് (RC) ചെയ്യും.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="A resistor and a coil in series with an AC source"><circle cx="40" cy="50" r="20" class="sf"/><path d="M30 50q5 -10 10 0t10 0" class="w"/><path class="w" d="M60 50H80M170 50H230V86H40V70"/>${symRes(120,50,0)}${coilH(180,50,50,26,4,3)}</svg>`,
 play:L('Press RL or RC. Slide R and X. Watch the triangle and the lag.','RL या RC दबाओ। R और X स्लाइड करो। त्रिभुज और लैग देखो।','RL അല്ലെങ്കിൽ RC അമർത്തൂ. R, X സ്ലൈഡ് ചെയ്യൂ. ത്രികോണവും ലാഗും നോക്കൂ.'),
 pred:{q:L('In a series RL circuit, VR = 60 V and VL = 80 V. The supply voltage is …','सीरीज़ RL सर्किट में VR = 60 V और VL = 80 V। सप्लाई वोल्टेज …','സീരീസ് RL സർക്യൂട്ടിൽ VR = 60 V, VL = 80 V. സപ്ലൈ വോൾട്ടേജ് …'),o:['100 V','140 V','20 V'],a:0,why:L('Voltage drops are 90° apart: √(60² + 80²) = 100 V.','वोल्टेज ड्रॉप 90° दूर: √(60² + 80²) = 100 V।','വോൾട്ടേജ് ഡ്രോപ്പുകൾ 90° അകലെ: √(60² + 80²) = 100 V.')},
 labels:['imped','react'],hints:['pyth','phs'],rel:{c:['R','X','Z','I','V','φ'],h:'φ'},
 fm:['<i>V</i> = √(<i>V<sub>R</sub></i>² + <i>V<sub>X</sub></i>²)'],
 uses:L('Here V = 100 V. I = V ÷ Z. VR = I × R. VX = I × X. Series, AC sine wave only.','यहाँ V = 100 V। I = V ÷ Z। VR = I × R। VX = I × X। सीरीज़, सिर्फ़ AC साइन वेव।','ഇവിടെ V = 100 V. I = V ÷ Z. VR = I × R. VX = I × X. സീരീസ്, AC സൈൻ വേവ് മാത്രം.'),
 ex:L('Mental sum: R = 3 Ω, X = 4 Ω, Z = 5 Ω. I = 100 ÷ 5 = 20 A. VR = 60 V, VX = 80 V. Check: 60² + 80² = 100².','मेंटल सम: R = 3 Ω, X = 4 Ω, Z = 5 Ω। I = 100 ÷ 5 = 20 A। VR = 60 V, VX = 80 V। चेक: 60² + 80² = 100²।','മെന്റൽ സം: R = 3 Ω, X = 4 Ω, Z = 5 Ω. I = 100 ÷ 5 = 20 A. VR = 60 V, VX = 80 V. ചെക്ക്: 60² + 80² = 100².'),
 trick:L('Drops add at 90°, never straight.','ड्रॉप 90° पर जुड़ते हैं, सीधे नहीं।','ഡ്രോപ്പുകൾ 90°-യിൽ കൂടും, നേരെ അല്ല.'),
 check:{q:L('VR = 30 V and VC = 40 V in a series RC circuit. By the right-triangle rule (Module 0), the supply is …','सीरीज़ RC में VR = 30 V और VC = 40 V। समकोण त्रिभुज नियम (मॉड्यूल 0) से सप्लाई …','സീരീസ് RC-യിൽ VR = 30 V, VC = 40 V. മട്ടത്രികോണ നിയമം (മൊഡ്യൂൾ 0) പ്രകാരം സപ്ലൈ …'),o:['50 V','70 V','10 V'],a:0},
 build(w,api){
  w.innerHTML=S(420,215,`<g id="a"></g>`,'A voltage triangle on the left and the voltage and current waves on the right');
  const rd=mkRd(w),c=mkCtl(w);let rc=false,R=3,X=4;
  const b1=button(c,'RL',()=>{rc=false;b1.classList.add('on');b2.classList.remove('on');api.redraw()},'on'),b2=button(c,'RC',()=>{rc=true;b2.classList.add('on');b1.classList.remove('on');api.redraw()});
  slider(c,'R',1,12,1,3,x=>x+' Ω',x=>{R=x;api.redraw()});slider(c,'X',1,12,1,4,x=>x+' Ω',x=>{X=x;api.redraw()});
  return t=>{const Z=Math.hypot(R,X),I=100/Z,VR=I*R,VX=I*X,phi=Math.atan2(X,R),k=.85,ox=30,oy=rc?60:160;
   const sg=rc?1:-1;let s=`<path d="M${ox} ${oy}h${(VR*k).toFixed(1)}v${(sg*VX*k).toFixed(1)}Z" fill="var(--frm-bg)" stroke="var(--frm)" stroke-width="3"/>`;
   s+=`<text x="${ox+VR*k/2}" y="${oy+(rc?-8:18)}" text-anchor="middle" class="tx s">V<tspan font-size="11" dy="3">R</tspan><tspan dy="-3"> ${fm1(VR)}</tspan></text><text x="${ox+VR*k+6}" y="${oy+sg*VX*k/2}" class="tx s">V<tspan font-size="11" dy="3">${rc?'C':'L'}</tspan><tspan dy="-3"> ${fm1(VX)}</tspan></text><text x="${ox-6}" y="${oy+sg*VX*k/2}" text-anchor="end" class="tx" style="font-size:15px">V 100</text>`;
   const wx=190,wy=110,A=34,ph=rc?-phi:phi,u=(t*.1)%1,cyc=2,W=210;
   s+=`<path d="M${wx} ${wy}H${wx+W}" stroke="var(--mut)" stroke-width="1"/><path d="${wavePath(wx,wy,W,A,cyc,0)}" fill="none" stroke="var(--def)" stroke-width="3"/><path d="${wavePath(wx,wy,W,A,cyc,ph)}" fill="none" stroke="var(--frm)" stroke-width="3"/>`;
   const cx=wx+W*u;s+=`<path d="M${cx.toFixed(1)} ${wy-A-4}V${wy+A+4}" stroke="var(--fg)" stroke-dasharray="4 4"/>`;
   s+=`<text x="${wx}" y="${wy-A-8}" class="tx s" style="fill:var(--def)">V</text><text x="${wx+20}" y="${wy-A-8}" class="tx s" style="fill:var(--frm)">I</text>`;
   s+=`<text x="${wx+W/2}" y="${wy+A+22}" text-anchor="middle" class="tx s">${rc?'I leads':'I lags'} ${Math.round(phi*180/Math.PI)}°</text>`;
   put($('#a',w),s);
   setRd(rd,`<span>Z = <b>${fm1(Z)} Ω</b></span><span>I = 100 ÷ ${fm1(Z)} = <b>${fm1(I)} A</b></span><span>V<sub>R</sub> + V<sub>X</sub> = ${fm1(VR+VX)} V, ${RD('but supply','पर सप्लाई','പക്ഷേ സപ്ലൈ')} <b>100 V</b></span>`)}}});

/* ---------- 10 Series RLC ---------- */
CS({id:'b_rlc',menu:'Series RLC',title:'t_rlc',
 flash:FB('X<sub>L</sub> (slide 4) and X<sub>C</sub> (slide 6) pull opposite ways','X<sub>L</sub> (स्लाइड 4) और X<sub>C</sub> (स्लाइड 6) उल्टी दिशा में खींचते हैं','X<sub>L</sub> (സ്ലൈഡ് 4), X<sub>C</sub> (സ്ലൈഡ് 6) വിപരീത ദിശയിൽ വലിക്കുന്നു'),
 hook:L('Put a coil and a capacitor in series. They help each other cancel!','कॉइल और कैपेसिटर सीरीज़ में लगाओ। वे एक-दूसरे को कैंसल करते हैं!','കോയിലും കപ്പാസിറ്ററും സീരീസിൽ ഇടൂ. അവ പരസ്പരം ക്യാൻസൽ ചെയ്യും!'),
 defn:L('In series RLC, XL points up and XC points down (opposite). The <b>net reactance</b> is X = XL − XC. Then Z = √(R² + X²).','सीरीज़ RLC में XL ऊपर और XC नीचे (उल्टे)। <b>नेट रिएक्टेंस</b> X = XL − XC। फिर Z = √(R² + X²)।','സീരീസ് RLC-യിൽ XL മുകളിലേക്കും XC താഴേക്കും (വിപരീതം). <b>നെറ്റ് റിയാക്ടൻസ്</b> X = XL − XC. പിന്നെ Z = √(R² + X²).'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="Arrows for X L up and X C down"><path d="M150 50V10" stroke="var(--law)" stroke-width="5"/><path d="M150 50V90" stroke="var(--def)" stroke-width="5"/>${TT(190,22,'X_L up','X_L ऊपर','X_L മുകളിലേക്ക്','m')}${TT(190,86,'X_C down','X_C नीचे','X_C താഴേക്ക്','m')}</svg>`,
 play:L('Slide XL and XC. Watch the net X and Z.','XL और XC स्लाइड करो। नेट X और Z देखो।','XL, XC സ്ലൈഡ് ചെയ്യൂ. നെറ്റ് X, Z നോക്കൂ.'),
 pred:{q:L('XL = 10 Ω and XC = 6 Ω in series. The net reactance X = …','XL = 10 Ω और XC = 6 Ω सीरीज़ में। नेट रिएक्टेंस X = …','XL = 10 Ω, XC = 6 Ω സീരീസിൽ. നെറ്റ് റിയാക്ടൻസ് X = …'),o:[L('4 Ω inductive','4 Ω इंडक्टिव','4 Ω ഇൻഡക്ടീവ്'),'16 Ω',L('4 Ω capacitive','4 Ω कैपेसिटिव','4 Ω കപ്പാസിറ്റീവ്')],a:0,why:L('They oppose: 10 − 6 = 4 Ω. The bigger one, L, wins, so the circuit is inductive.','वे उल्टे हैं: 10 − 6 = 4 Ω। बड़ा L जीतता है, इसलिए सर्किट इंडक्टिव।','അവ വിപരീതം: 10 − 6 = 4 Ω. വലിയ L ജയിക്കും, അതിനാൽ സർക്യൂട്ട് ഇൻഡക്ടീവ്.')},
 labels:['react','imped'],hints:['tri','phs'],rel:{c:['X<sub>L</sub>','X<sub>C</sub>','X','Z','φ'],h:'X'},
 fm:['<i>X</i> = <i>X<sub>L</sub></i> − <i>X<sub>C</sub></i>','<i>Z</i> = √(<i>R</i>² + <i>X</i>²)'],
 uses:L('Here R = 3 Ω and V = 100 V. If XL > XC the current lags. If XC > XL it leads. If equal, X = 0: resonance.','यहाँ R = 3 Ω और V = 100 V। XL > XC तो करंट लैग। XC > XL तो लीड। बराबर हों तो X = 0: रेज़ोनेंस।','ഇവിടെ R = 3 Ω, V = 100 V. XL > XC ആണെങ്കിൽ കറന്റ് ലാഗ്. XC > XL ആണെങ്കിൽ ലീഡ്. തുല്യമെങ്കിൽ X = 0: റെസൊണൻസ്.'),

/* ---------- series resonance data ---------- */
const RL_L=.1,RL_C=1e-4;const F0=1/(TPI*Math.sqrt(RL_L*RL_C));
const serI=(f,R,V)=>{const XL=TPI*f*RL_L,XC=1/(TPI*f*RL_C);return V/Math.hypot(R,XL-XC)};
const curve=(fn,x0,y0,W,H,fmin,fmax,ymax)=>{let d='';for(let i=0;i<=120;i++){const f=fmin+(fmax-fmin)*i/120,y=Math.min(ymax,fn(f));d+=(i?'L':'M')+(x0+W*i/120).toFixed(1)+' '+(y0-H*y/ymax).toFixed(1)}return d};

CS({id:'b_par',menu:'Parallel RLC',title:'t_par',
 flash:FB('Parallel: same voltage, currents add (Module 2, slide 6); right triangle (Module 0, slide 31)','पैरेलल: वही वोल्टेज, करंट जुड़ते हैं (मॉड्यूल 2, स्लाइड 6); समकोण त्रिभुज (मॉड्यूल 0, स्लाइड 31)','പാരലൽ: ഒരേ വോൾട്ടേജ്, കറന്റുകൾ കൂടും (മൊഡ്യൂൾ 2, സ്ലൈഡ് 6); മട്ടത്രികോണം (മൊഡ്യൂൾ 0, സ്ലൈഡ് 31)'),
 hook:L('Now the branches share the voltage. The currents have different phases and add at 90° too.','अब ब्रांच वोल्टेज शेयर करती हैं। करंट की फेज़ अलग है और वे भी 90° पर जुड़ते हैं।','ഇനി ബ്രാഞ്ചുകൾ വോൾട്ടേജ് പങ്കിടുന്നു. കറന്റുകളുടെ ഫേസ് വ്യത്യസ്തമാണ്, അവയും 90°-യിൽ കൂടും.'),
 defn:L('In a parallel circuit take the voltage as the reference. <b>IR</b> is in phase with V. <b>IL</b> lags by 90°. <b>IC</b> leads by 90°. IL and IC oppose each other. Line current I = √(IR² + (IC − IL)²).','पैरेलल सर्किट में वोल्टेज रेफरेंस लो। <b>IR</b> V के साथ इन-फेज़। <b>IL</b> 90° लैग। <b>IC</b> 90° लीड। IL और IC उल्टे हैं। लाइन करंट I = √(IR² + (IC − IL)²)।','പാരലൽ സർക്യൂട്ടിൽ വോൾട്ടേജ് റഫറൻസ് ആക്കൂ. <b>IR</b> V-യുമായി ഇൻ-ഫേസ്. <b>IL</b> 90° ലാഗ്. <b>IC</b> 90° ലീഡ്. IL, IC പരസ്പരം വിപരീതം. ലൈൻ കറന്റ് I = √(IR² + (IC − IL)²).'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="Three parallel branches R L C"><path class="w" d="M30 20H270M30 80H270M60 20V80M150 20V80M240 20V80"/>${symRes(60,50,90)}${coilH(150,50,36,20,3,0)}${symCap(240,50,90)}</svg>`,
 play:L('Slide R, XL, XC. Or press Net 3 A. Watch the branch arrows.','R, XL, XC स्लाइड करो। या Net 3 A दबाओ। ब्रांच एरो देखो।','R, XL, XC സ്ലൈഡ് ചെയ്യൂ. അല്ലെങ്കിൽ Net 3 A അമർത്തൂ. ബ്രാഞ്ച് ആരോകൾ നോക്കൂ.'),
 pred:{q:L('IR = 4 A and the net reactive current (IL − IC) = 3 A. Line current = ?','IR = 4 A और नेट रिएक्टिव करंट (IL − IC) = 3 A। लाइन करंट = ?','IR = 4 A, നെറ്റ് റിയാക്ടീവ് കറന്റ് (IL − IC) = 3 A. ലൈൻ കറന്റ് = ?'),o:['5 A','7 A','1 A'],a:0,why:L('They are 90° apart: √(4² + 3²) = 5 A.','वे 90° दूर हैं: √(4² + 3²) = 5 A।','അവ 90° അകലെ: √(4² + 3²) = 5 A.')},
 labels:['imped','react'],hints:['par','pyth'],rel:{c:['V','I<sub>R</sub>','I<sub>L</sub>','I<sub>C</sub>','I'],h:'I'},
 fm:['<i>I</i> = √(<i>I<sub>R</sub></i>² + (<i>I<sub>C</sub></i> − <i>I<sub>L</sub></i>)²)'],
 uses:L('Here V = 100 V. IR = V ÷ R, IL = V ÷ XL, IC = V ÷ XC. A capacitor can cancel a coil’s lagging current. This is how PF is corrected (Module 8).','यहाँ V = 100 V। IR = V ÷ R, IL = V ÷ XL, IC = V ÷ XC। कैपेसिटर कॉइल के लैगिंग करंट को कैंसल कर सकता है। PF ऐसे ही सुधारा जाता है (मॉड्यूल 8)।','ഇവിടെ V = 100 V. IR = V ÷ R, IL = V ÷ XL, IC = V ÷ XC. കപ്പാസിറ്ററിന് കോയിലിന്റെ ലാഗിംഗ് കറന്റ് ക്യാൻസൽ ചെയ്യാം. ഇങ്ങനെയാണ് PF ശരിയാക്കുന്നത് (മൊഡ്യൂൾ 8).'),
 ex:L('Mental sum: R = 25 Ω gives 4 A. XL = 20 Ω gives 5 A. XC = 50 Ω gives 2 A. Net 3 A. Line = 5 A.','मेंटल सम: R = 25 Ω से 4 A। XL = 20 Ω से 5 A। XC = 50 Ω से 2 A। नेट 3 A। लाइन = 5 A।','മെന്റൽ സം: R = 25 Ω → 4 A. XL = 20 Ω → 5 A. XC = 50 Ω → 2 A. നെറ്റ് 3 A. ലൈൻ = 5 A.'),
 trick:L('Series: add the drops. Parallel: add the currents. Both at 90°.','सीरीज़: ड्रॉप जोड़ो। पैरेलल: करंट जोड़ो। दोनों 90° पर।','സീരീസ്: ഡ്രോപ്പ് കൂട്ടൂ. പാരലൽ: കറന്റ് കൂട്ടൂ. രണ്ടും 90°-യിൽ.'),
 check:{q:L('Branch currents 6 A and 8 A at 90° to each other. The line current is …','ब्रांच करंट 6 A और 8 A, आपस में 90° पर। लाइन करंट …','ബ്രാഞ്ച് കറന്റുകൾ 6 A, 8 A, പരസ്പരം 90°-യിൽ. ലൈൻ കറന്റ് …'),o:['10 A','14 A','2 A'],a:0},
 build(w,api){
  w.innerHTML=S(420,215,`<g id="a"></g>`,'Current arrows: I R to the right, I C up, I L down and the line current');
  const rd=mkRd(w),c=mkCtl(w);let ri=2,li=3,ci=2;const V=100;
  const sR=slider(c,'R',0,4,1,2,x=>PRa[x]+' Ω',x=>{ri=x;api.redraw()}),sL=slider(c,'X<sub>L</sub>',0,4,1,3,x=>PRa[x]+' Ω',x=>{li=x;api.redraw()}),sC=slider(c,'X<sub>C</sub>',0,4,1,2,x=>PRa[x]+' Ω',x=>{ci=x;api.redraw()});
  button(c,L('Net 3 A','नेट 3 A','നെറ്റ് 3 A'),()=>{ri=2;li=1;ci=3;sR.set(2);sL.set(1);sC.set(3);api.redraw()});
  return t=>{const IR=V/PRa[ri],IL=V/PRa[li],IC=V/PRa[ci],I=Math.hypot(IR,IC-IL),k=Math.min(24,100/Math.max(IR,IC,IL,.5)),ox=60,oy=112;
   let s=`<path d="M${ox} ${oy}H${ox+250}" stroke="var(--mut)" stroke-width="1"/>`+arr(ox,oy,ox+IR*k,oy,'var(--def)',4)+arr(ox,oy,ox,oy-IC*k,'var(--law)',4)+arr(ox,oy,ox,oy+IL*k,'var(--frm)',4);
   s+=arr(ox,oy,ox+IR*k,oy-(IC-IL)*k,'var(--ok)',4);
   s+=`<path d="M${ox+IR*k} ${oy}V${oy-(IC-IL)*k}" stroke="var(--ok)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
   s+=`<text x="${ox+IR*k/2}" y="${oy+18}" text-anchor="middle" class="tx s">IR ${fm1(IR)}</text><text x="${ox+8}" y="${oy-IC*k-4}" class="tx s" style="fill:var(--law)">IC ${fm1(IC)}</text><text x="${ox+8}" y="${oy+IL*k+14}" class="tx s" style="fill:var(--frm)">IL ${fm1(IL)}</text>`;
   s+=`<text x="${ox+IR*k+10}" y="${oy-(IC-IL)*k*.25}" class="tx s" style="fill:var(--ok)">I ${fm1(I)}</text>`;
   put($('#a',w),s);
   setRd(rd,`<span>I<sub>R</sub> ${fm1(IR)} · I<sub>L</sub> ${fm1(IL)} · I<sub>C</sub> ${fm1(IC)} A</span><span>${RD('Line','लाइन','ലൈൻ')} I = <b>${fm1(I)} A</b></span><span>${IL>IC?RD('Lagging','लैगिंग','ലാഗിംഗ്'):IC>IL?RD('Leading','लीडिंग','ലീഡിംഗ്'):RD('In phase','इन-फेज़','ഇൻ-ഫേസ്')}</span>`)}}});

/* ---------- 14 Parallel resonance ---------- */
const parI=(f,V)=>{const XL=TPI*f*RL_L,XC=1/(TPI*f*RL_C);return Math.hypot(V/100,V/XC-V/XL)};
CS({id:'b_pres',menu:'Parallel resonance',title:'t_pres',
 flash:FB('Series resonance had maximum current (slide 11); parallel branches (slide 13)','सीरीज़ रेज़ोनेंस में करंट मैक्सिमम था (स्लाइड 11); पैरेलल ब्रांच (स्लाइड 13)','സീരീസ് റെസൊണൻസിൽ കറന്റ് മാക്സിമം ആയിരുന്നു (സ്ലൈഡ് 11); പാരലൽ ബ്രാഞ്ച് (സ്ലൈഡ് 13)'),
 hook:L('Coil and capacitor side by side. At f₀ the line current almost vanishes, yet a big current circulates inside.','कॉइल और कैपेसिटर साथ-साथ। f₀ पर लाइन करंट लगभग गायब, फिर भी अंदर बड़ा करंट घूमता है।','കോയിലും കപ്പാസിറ്ററും അടുത്തടുത്ത്. f₀-ൽ ലൈൻ കറന്റ് ഏതാണ്ട് ഇല്ലാതാകും, എന്നിട്ടും ഉള്ളിൽ വലിയ കറന്റ് ചുറ്റുന്നു.'),
 defn:L('<b>Parallel resonance:</b> at f₀, IL = IC and they cancel in the line. The line current is <b>minimum</b>, the impedance is <b>maximum</b>. The two big currents just circulate between L and C (a tank circuit).','<b>पैरेलल रेज़ोनेंस:</b> f₀ पर IL = IC और लाइन में कैंसल। लाइन करंट <b>मिनिमम</b>, इम्पीडेंस <b>मैक्सिमम</b>। दोनों बड़े करंट L और C के बीच घूमते रहते हैं (टैंक सर्किट)।','<b>പാരലൽ റെസൊണൻസ്:</b> f₀-ൽ IL = IC, ലൈനിൽ ക്യാൻസൽ ആകും. ലൈൻ കറന്റ് <b>മിനിമം</b>, ഇം‌പീഡൻസ് <b>മാക്സിമം</b>. രണ്ട് വലിയ കറന്റുകൾ L-നും C-ക്കും ഇടയിൽ ചുറ്റിക്കൊണ്ടിരിക്കും (ടാങ്ക് സർക്യൂട്ട്).'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="A dip in line current at the resonant frequency"><path d="M30 20C100 20,120 20,140 80C160 20,190 20,270 20" fill="none" stroke="var(--frm)" stroke-width="4"/>${TT(150,98,'f₀','f₀','f₀','m')}</svg>`,
 play:L('Slide f from 20 to 100 Hz. Watch the dip, then read the branch currents.','f को 20 से 100 Hz तक स्लाइड करो। डिप देखो, फिर ब्रांच करंट पढ़ो।','f 20 മുതൽ 100 Hz വരെ സ്ലൈഡ് ചെയ്യൂ. ഡിപ്പ് നോക്കൂ, പിന്നെ ബ്രാഞ്ച് കറന്റുകൾ വായിക്കൂ.'),
 pred:{q:L('At parallel resonance, the line current is …','पैरेलल रेज़ोनेंस पर लाइन करंट …','പാരലൽ റെസൊണൻസിൽ ലൈൻ കറന്റ് …'),o:[L('minimum','मिनिमम','മിനിമം'),L('maximum','मैक्सिमम','മാക്സിമം'),L('zero for ever','हमेशा ज़ीरो','എപ്പോഴും പൂജ്യം')],a:0,why:L('IL and IC cancel. Only a small loss current is left. In series resonance it was the opposite: current maximum.','IL और IC कैंसल। सिर्फ़ छोटा लॉस करंट बचता है। सीरीज़ रेज़ोनेंस में उल्टा था: करंट मैक्सिमम।','IL, IC ക്യാൻസൽ ആകും. ചെറിയ ലോസ് കറന്റ് മാത്രം ബാക്കി. സീരീസ് റെസൊണൻസിൽ നേരെ തിരിച്ചായിരുന്നു: കറന്റ് മാക്സിമം.')},
 labels:['reson'],hints:['par','cyc'],rel:{c:['L','C','f₀','I<sub>line</sub>'],h:'I<sub>line</sub>'},
 fm:['<i>f₀</i> = 1 ÷ (2<i>π</i>√(<i>LC</i>))'],
 uses:L('The same f₀ formula holds for an ideal tank. Here a 100 Ω loss in parallel, V = 100 V, L = 100 mH, C = 100 µF. Used in: radio tuners, wave traps, oscillators.','आइडियल टैंक के लिए वही f₀ फॉर्मूला। यहाँ 100 Ω लॉस पैरेलल में, V = 100 V, L = 100 mH, C = 100 µF। इस्तेमाल: रेडियो ट्यूनर, वेव ट्रैप, ऑसिलेटर।','ഐഡിയൽ ടാങ്കിന് അതേ f₀ ഫോർമുല. ഇവിടെ 100 Ω ലോസ് പാരലലിൽ, V = 100 V, L = 100 mH, C = 100 µF. ഉപയോഗം: റേഡിയോ ട്യൂണർ, വേവ് ട്രാപ്പ്, ഓസിലേറ്റർ.'),
 trick:L('Series: Z minimum. Parallel: Z maximum.','सीरीज़: Z मिनिमम। पैरेलल: Z मैक्सिमम।','സീരീസ്: Z മിനിമം. പാരലൽ: Z മാക്സിമം.'),
 check:{q:L('At series resonance the current is at its … At parallel resonance the line current is at its …','सीरीज़ रेज़ोनेंस पर करंट … पर होता है। पैरेलल रेज़ोनेंस पर लाइन करंट … पर।','സീരീസ് റെസൊണൻസിൽ കറന്റ് … ആയിരിക്കും. പാരലൽ റെസൊണൻസിൽ ലൈൻ കറന്റ് …'),o:[L('maximum, minimum','मैक्सिमम, मिनिमम','മാക്സിമം, മിനിമം'),L('minimum, maximum','मिनिमम, मैक्सिमम','മിനിമം, മാക്സിമം')],a:0},
 build(w,api){
  w.innerHTML=S(420,225,`<g id="a"></g>`,'A curve of line current against frequency for a parallel tuned circuit with a dip at resonance');
  const rd=mkRd(w),c=mkCtl(w);let f=50;const V=100;
  slider(c,'f',20,100,5,50,x=>x+' Hz',x=>{f=x;api.redraw()});
  return t=>{const x0=34,y0=185,W=370,H=130,ymax=9;
   let s=`<path d="M${x0} ${y0}H${x0+W}M${x0} ${y0}V${y0-H-6}" stroke="var(--mut)" stroke-width="1.5" fill="none"/><path d="${curve(ff=>parI(ff,V),x0,y0,W,H,20,100,ymax)}" fill="none" stroke="var(--frm)" stroke-width="3.5"/>`;
   const x0f=x0+W*(F0-20)/80,xf=x0+W*(f-20)/80;s+=`<path d="M${x0f.toFixed(1)} ${y0}V${y0-H}" stroke="var(--ok)" stroke-width="1.6" stroke-dasharray="5 5"/><text x="${x0f.toFixed(1)}" y="${y0+16}" text-anchor="middle" class="tx s">f₀ ≈ ${Math.round(F0)}</text>`;
   const I=parI(f,V);s+=`<circle cx="${xf.toFixed(1)}" cy="${(y0-H*Math.min(ymax,I)/ymax).toFixed(1)}" r="7" fill="var(--def)"/><text x="${x0+4}" y="${y0-H-8}" class="tx s">I<tspan font-size="11" dy="3">line</tspan><tspan dy="-3"> (A)</tspan></text>`;
   put($('#a',w),s);
   const XL=TPI*f*RL_L,XC=1/(TPI*f*RL_C);
   setRd(rd,`<span>I<sub>L</sub> <b>${fm1(V/XL)}</b> · I<sub>C</sub> <b>${fm1(V/XC)}</b> A</span><span>${RD('Line','लाइन','ലൈൻ')} <b>${fm1(I)} A</b></span>`)}}});

CS({id:'b_pf',menu:'Power factor preview',title:'t_pf',
 flash:FB('sin, cos and the same triangle (Module 0, slides 32–33); cos φ = R ÷ Z (slide 8)','sin, cos और वही त्रिभुज (मॉड्यूल 0, स्लाइड 32–33); cos φ = R ÷ Z (स्लाइड 8)','sin, cos, അതേ ത്രികോണം (മൊഡ്യൂൾ 0, സ്ലൈഡ് 32–33); cos φ = R ÷ Z (സ്ലൈഡ് 8)'),
 hook:L('A coil draws 100 VA from the line, yet only part of it does real work. Which part?','कॉइल लाइन से 100 VA खींचती है, पर असली काम सिर्फ़ एक हिस्सा करता है। कौन-सा?','കോയിൽ ലൈനിൽ നിന്ന് 100 VA വലിക്കുന്നു, പക്ഷേ ഒരു ഭാഗം മാത്രമേ യഥാർത്ഥ ജോലി ചെയ്യൂ. ഏത് ഭാഗം?'),
 defn:L('The angle φ between V and I sets the <b>power factor cos φ</b>. Real power P = S × cos φ (watt). Reactive power Q = S × sin φ (VAR). S is the apparent power (VA). Full treatment in Module 8.','V और I के बीच का कोण φ <b>पावर फैक्टर cos φ</b> तय करता है। रियल पावर P = S × cos φ (वाट)। रिएक्टिव पावर Q = S × sin φ (VAR)। S एपेरेंट पावर (VA) है। पूरा विषय मॉड्यूल 8 में।','V-ക്കും I-ക്കും ഇടയിലെ കോൺ φ <b>പവർ ഫാക്ടർ cos φ</b> നിശ്ചയിക്കുന്നു. റിയൽ പവർ P = S × cos φ (വാട്ട്). റിയാക്ടീവ് പവർ Q = S × sin φ (VAR). S അപ്പാരന്റ് പവർ (VA). പൂർണ്ണ വിവരണം മൊഡ്യൂൾ 8-ൽ.'),

   {q:L('Series circuit: R = 6 Ω, XL = 15 Ω, XC = 7 Ω. Z = ?','सीरीज़ सर्किट: R = 6 Ω, XL = 15 Ω, XC = 7 Ω। Z = ?','സീരീസ് സർക്യൂട്ട്: R = 6 Ω, XL = 15 Ω, XC = 7 Ω. Z = ?'),o:['10 Ω','28 Ω','14 Ω','8 Ω'],a:0,why:L('X = 15 − 7 = 8 Ω. Z = √(36 + 64) = 10 Ω.','X = 15 − 7 = 8 Ω। Z = √(36 + 64) = 10 Ω।','X = 15 − 7 = 8 Ω. Z = √(36 + 64) = 10 Ω.')},

 {sp:['A single-phase motor with a PF capacitor now draws 9 A instead of 6 A. The PF meter reads 0.6.','PF कैपेसिटर वाली सिंगल-फेज़ मोटर अब 6 A की जगह 9 A लेती है। PF मीटर 0.6 पढ़ता है।','PF കപ്പാസിറ്റർ ഉള്ള സിംഗിൾ-ഫേസ് മോട്ടോർ ഇപ്പോൾ 6 A-ന് പകരം 9 A എടുക്കുന്നു. PF മീറ്റർ 0.6 കാണിക്കുന്നു.'],

 {sp:['A series filter of 100 mH and a “100 µF” capacitor should resonate at 50 Hz. It resonates at 71 Hz.','100 mH और “100 µF” कैपेसिटर का सीरीज़ फिल्टर 50 Hz पर रेज़ोनेट होना चाहिए। वह 71 Hz पर रेज़ोनेट करता है।','100 mH-ഉം “100 µF” കപ്പാസിറ്ററും ഉള്ള സീരീസ് ഫിൽട്ടർ 50 Hz-ൽ റെസൊണേറ്റ് ചെയ്യണം. അത് 71 Hz-ൽ ചെയ്യുന്നു.'],

  o:[['The capacitor has aged: it is only 50 µF','कैपेसिटर पुराना हो गया: सिर्फ़ 50 µF','കപ്പാസിറ്റർ പഴകി: 50 µF മാത്രം'],['The coil is shorted','कॉइल शॉर्ट है','കോയിൽ ഷോർട്ട് ആണ്'],['The meter is wrong','मीटर गलत है','മീറ്റർ തെറ്റാണ്']],a:0,
  why:['f₀ = 1 ÷ (2π√LC). Half the capacitance means f₀ is 1.41 times higher: 50 × 1.41 = 71 Hz. Replace the capacitor.','f₀ = 1 ÷ (2π√LC)। आधा कैपेसिटेंस मतलब f₀ 1.41 गुना: 50 × 1.41 = 71 Hz। कैपेसिटर बदलो।','f₀ = 1 ÷ (2π√LC). കപ്പാസിറ്റൻസ് പകുതി എന്നാൽ f₀ 1.41 ഇരട്ടി: 50 × 1.41 = 71 Hz. കപ്പാസിറ്റർ മാറ്റൂ.']},
 {sp:['A 230 V AC choke is connected to a 230 V DC supply. It burns out in seconds.','230 V AC चोक 230 V DC सप्लाई से जोड़ा गया। सेकंडों में जल गया।','230 V AC ചോക്ക് 230 V DC സപ്ലൈയിൽ ഘടിപ്പിച്ചു. സെക്കൻഡുകൾക്കുള്ളിൽ കത്തി.'],

  why:['On AC the reactance limits the current. On DC the reactance is zero: I = 230 ÷ 20 = 11.5 A, far above the rating. Heat = I² × R burns it. Use the right supply type.','AC पर रिएक्टेंस करंट रोकता है। DC पर रिएक्टेंस शून्य: I = 230 ÷ 20 = 11.5 A, रेटिंग से बहुत ज़्यादा। हीट = I² × R जला देती है। सही सप्लाई टाइप लगाओ।','AC-യിൽ റിയാക്ടൻസ് കറന്റ് തടയും. DC-യിൽ റിയാക്ടൻസ് പൂജ്യം: I = 230 ÷ 20 = 11.5 A, റേറ്റിംഗിനേക്കാൾ വളരെ കൂടുതൽ. ഹീറ്റ് = I² × R കത്തിക്കും. ശരിയായ സപ്ലൈ ടൈപ്പ് ഉപയോഗിക്കൂ.']},
 {sp:['A 230 V lamp is fed through a series capacitor dropper and glows very dim.','230 V लैंप सीरीज़ कैपेसिटर ड्रॉपर से जुड़ा है और बहुत धीमा जलता है।','230 V ലാമ്പ് സീരീസ് കപ്പാസിറ്റർ ഡ്രോപ്പർ വഴി നൽകി, വളരെ മങ്ങിയാണ് തെളിയുന്നത്.'],
  pic:(p,sv)=>fpic([{x:30,y:22,w:100,h:70,t:['230 V AC','230 V AC','230 V AC']},{x:150,y:22,w:100,h:70,t:['Capacitor','कैपेसिटर','കപ്പാസിറ്റർ']},{x:270,y:22,w:100,h:70,t:['Lamp','लैंप','ലാമ്പ്']}],p===1?1:p===2?1:p===3?2:-1,sv),
  tests:[[['Capacitor marking','कैपेसिटर मार्किंग','കപ്പാസിറ്റർ മാർക്കിംഗ്'],'2 µF'],[['X<sub>C</sub> at 50 Hz','50 Hz पर X<sub>C</sub>','50 Hz-ൽ X<sub>C</sub>'],'1592 Ω'],[['Current in the lamp','लैंप में करंट','ലാമ്പിലെ കറന്റ്'],'0.14 A']],
  o:[['The capacitor is too small: X<sub>C</sub> is too large','कैपेसिटर बहुत छोटा है: X<sub>C</sub> बहुत बड़ा','കപ്പാസിറ്റർ വളരെ ചെറുത്: X<sub>C</sub> വളരെ വലുത്'],['The lamp is open','लैंप ओपन है','ലാമ്പ് ഓപ്പൺ ആണ്'],['The supply is DC','सप्लाई DC है','സപ്ലൈ DC ആണ്']],a:0,
  why:['X<sub>C</sub> = 1 ÷ (2π × 50 × 0.000002) = 1592 Ω. I = 230 ÷ 1592 = 0.14 A. A larger capacitor, such as 20 µF (X<sub>C</sub> = 159 Ω), would pass ten times more current.','X<sub>C</sub> = 1 ÷ (2π × 50 × 0.000002) = 1592 Ω। I = 230 ÷ 1592 = 0.14 A। बड़ा कैपेसिटर, जैसे 20 µF (X<sub>C</sub> = 159 Ω), दस गुना ज़्यादा करंट देगा।','X<sub>C</sub> = 1 ÷ (2π × 50 × 0.000002) = 1592 Ω. I = 230 ÷ 1592 = 0.14 A. 20 µF പോലെ വലിയ കപ്പാസിറ്റർ (X<sub>C</sub> = 159 Ω) പത്തിരട്ടി കറന്റ് കടത്തിവിടും.']},
 {sp:['A 250 V capacitor in a series RLC filter on a 100 V, 50 Hz supply bursts.','100 V, 50 Hz सप्लाई पर सीरीज़ RLC फिल्टर में 250 V का कैपेसिटर फट गया।','100 V, 50 Hz സപ്ലൈയിലെ സീരീസ് RLC ഫിൽട്ടറിൽ 250 V കപ്പാസിറ്റർ പൊട്ടിത്തെറിച്ചു.'],
  pic:(p,sv)=>fpic([{x:30,y:22,w:100,h:70,t:['100 V, 50 Hz','100 V, 50 Hz','100 V, 50 Hz']},{x:150,y:22,w:100,h:70,t:['Capacitor','कैपेसिटर','കപ്പാസിറ്റർ']},{x:270,y:22,w:100,h:70,t:['R 10 Ω','R 10 Ω','R 10 Ω']}],p===1?0:p===2?1:p===3?1:-1,sv),
  tests:[[['Supply voltage','सप्लाई वोल्टेज','സപ്ലൈ വോൾട്ടേജ്'],'100 V'],[['f₀ of the circuit','सर्किट का f₀','സർക്യൂട്ടിന്റെ f₀'],['≈ 50 Hz, same as the supply','≈ 50 Hz, सप्लाई जितना','≈ 50 Hz, സപ്ലൈയ്ക്ക് തുല്യം']],[['Voltage across the capacitor','कैपेसिटर पर वोल्टेज','കപ്പാസിറ്ററിന് കുറുകെ വോൾട്ടേജ്'],'318 V']],
  o:[['Resonance: the voltage across C is far above the supply','रेज़ोनेंस: C पर वोल्टेज सप्लाई से बहुत ऊपर','റെസൊണൻസ്: C-യിലെ വോൾട്ടേജ് സപ്ലൈയേക്കാൾ വളരെ കൂടുതൽ'],['The supply voltage is too high','सप्लाई वोल्टेज बहुत ज़्यादा है','സപ്ലൈ വോൾട്ടേജ് വളരെ കൂടുതലാണ്'],['The capacitor is reversed','कैपेसिटर उल्टा लगा है','കപ്പാസിറ്റർ തിരിഞ്ഞു ഘടിപ്പിച്ചു']],a:0,
  why:['At resonance I = 100 ÷ 10 = 10 A. X<sub>C</sub> = 32 Ω, so V<sub>C</sub> = 10 × 32 = 318 V, above the 250 V rating. Choose a capacitor with a rating well above this, or avoid resonance.','रेज़ोनेंस पर I = 100 ÷ 10 = 10 A। X<sub>C</sub> = 32 Ω, तो V<sub>C</sub> = 10 × 32 = 318 V, 250 V रेटिंग से ऊपर। इससे काफी ऊँची रेटिंग का कैपेसिटर लो, या रेज़ोनेंस से बचो।','റെസൊണൻസിൽ I = 100 ÷ 10 = 10 A. X<sub>C</sub> = 32 Ω, അതിനാൽ V<sub>C</sub> = 10 × 32 = 318 V, 250 V റേറ്റിംഗിനേക്കാൾ കൂടുതൽ. ഇതിനേക്കാൾ വളരെ ഉയർന്ന റേറ്റിംഗ് ഉള്ള കപ്പാസിറ്റർ എടുക്കൂ, അല്ലെങ്കിൽ റെസൊണൻസ് ഒഴിവാക്കൂ.']}];

 page(w,s,api){

   const dg=h('div');dg.hidden=!sv[mi];sideTop.appendChild(dg);
   dg.appendChild(h('div','beat',RD('Your diagnosis','आपका डायग्नोसिस','നിങ്ങളുടെ ഡയഗ്നോസിസ്')));
   const os=h('div','opts');dg.appendChild(os);const fb=h('div','fb');fb.setAttribute('aria-live','polite');dg.appendChild(fb);const nx=h('div');dg.appendChild(nx);

/* ---------- 21 Viva and interview ---------- */
CS({id:'b_viva',menu:'Viva and interview cards',kind:'def',title:'viva',wide:true,hk:undefined,page(w,s,api){
  const C=(q,a)=>[L(q[0],q[1],q[2]),L(a[0],a[1],a[2])];
  flipDeck(w,api,[
   {name:L('L1 Fact','L1 फैक्ट','L1 ഫാക്ട്'),cards:[
    C(['What is reactance? What is its unit?','रिएक्टेंस क्या है? इसकी यूनिट?','റിയാക്ടൻസ് എന്താണ്? അതിന്റെ യൂണിറ്റ്?'],['The opposition of a coil or capacitor to AC. Unit: ohm (Ω).','AC के प्रति कॉइल या कैपेसिटर का विरोध। यूनिट: ओम (Ω)।','AC-യോടുള്ള കോയിലിന്റെയോ കപ്പാസിറ്ററിന്റെയോ എതിർപ്പ്. യൂണിറ്റ്: ഓം (Ω).']),
    C(['Write the formulas for XL and XC.','XL और XC के फॉर्मूले लिखो।','XL, XC ഫോർമുലകൾ എഴുതൂ.'],['XL = 2πfL and XC = 1 ÷ (2πfC).','XL = 2πfL और XC = 1 ÷ (2πfC)।','XL = 2πfL, XC = 1 ÷ (2πfC).']),
    C(['In which part does the current lag, and in which does it lead?','किस पार्ट में करंट लैग और किसमें लीड करता है?','ഏത് പാർട്ടിൽ കറന്റ് ലാഗ്, ഏതിൽ ലീഡ് ചെയ്യും?'],['Lags in a pure inductor. Leads in a pure capacitor. Both by 90°.','प्योर इंडक्टर में लैग। प्योर कैपेसिटर में लीड। दोनों 90°।','പ്യുവർ ഇൻഡക്ടറിൽ ലാഗ്. പ്യുവർ കപ്പാസിറ്ററിൽ ലീഡ്. രണ്ടും 90°.']),
    C(['Write the formula for impedance.','इम्पीडेंस का फॉर्मूला लिखो।','ഇം‌പീഡൻസ് ഫോർമുല എഴുതൂ.'],['Z = √(R² + X²) in ohm.','Z = √(R² + X²), ओम में।','Z = √(R² + X²), ഓമിൽ.']),
    C(['What is the resonant frequency formula?','रेज़ोनेंट फ्रीक्वेंसी का फॉर्मूला?','റെസൊണന്റ് ഫ്രീക്വൻസി ഫോർമുല?'],['f₀ = 1 ÷ (2π√(LC)).','f₀ = 1 ÷ (2π√(LC))।','f₀ = 1 ÷ (2π√(LC)).'])]},
   {name:L('L2 Why / How','L2 क्यों / कैसे','L2 എന്തുകൊണ്ട് / എങ്ങനെ'),cards:[
    C(['Why do R and X not add straight?','R और X सीधे क्यों नहीं जुड़ते?','R, X നേരെ കൂടാത്തത് എന്തുകൊണ്ട്?'],['The resistive drop is in phase with the current. The reactive drop is 90° away. They add like the sides of a right triangle.','रेसिस्टिव ड्रॉप करंट के साथ इन-फेज़ है। रिएक्टिव ड्रॉप 90° दूर है। वे समकोण त्रिभुज की भुजाओं की तरह जुड़ते हैं।','റെസിസ്റ്റീവ് ഡ്രോപ്പ് കറന്റുമായി ഇൻ-ഫേസ്. റിയാക്ടീവ് ഡ്രോപ്പ് 90° അകലെ. അവ മട്ടത്രികോണത്തിന്റെ വശങ്ങൾ പോലെ കൂടും.']),
    C(['Why does XL rise with frequency?','f के साथ XL क्यों बढ़ता है?','f-നൊപ്പം XL കൂടുന്നത് എന്തുകൊണ്ട്?'],['Faster AC changes the current faster, and the coil fights the change harder (self-induction).','तेज़ AC करंट को जल्दी बदलता है और कॉइल बदलाव से ज़्यादा लड़ती है (सेल्फ-इंडक्शन)।','വേഗമുള്ള AC കറന്റിനെ വേഗത്തിൽ മാറ്റും, കോയിൽ മാറ്റത്തെ കൂടുതൽ എതിർക്കും (സെൽഫ്-ഇൻഡക്ഷൻ).']),
    C(['Why does XC fall with frequency?','f के साथ XC क्यों घटता है?','f-നൊപ്പം XC കുറയുന്നത് എന്തുകൊണ്ട്?'],['At higher f the capacitor has less time to charge each cycle, so it never builds a big opposing voltage. More current passes.','ऊँचे f पर हर साइकिल में चार्ज होने का समय कम, इसलिए बड़ा विरोधी वोल्टेज नहीं बनता। ज़्यादा करंट निकलता है।','ഉയർന്ന f-ൽ ഓരോ സൈക്കിളിലും ചാർജ് ആകാൻ സമയം കുറവ്, അതിനാൽ വലിയ എതിർ വോൾട്ടേജ് ഉണ്ടാകില്ല. കൂടുതൽ കറന്റ് കടക്കും.']),
    C(['Why is the current maximum at series resonance?','सीरीज़ रेज़ोनेंस पर करंट मैक्सिमम क्यों?','സീരീസ് റെസൊണൻസിൽ കറന്റ് മാക്സിമം ആകുന്നത് എന്തുകൊണ്ട്?'],['XL and XC cancel, so Z = R, the smallest value.','XL और XC कैंसल, इसलिए Z = R, सबसे छोटी वैल्यू।','XL, XC ക്യാൻസൽ ആകും, അതിനാൽ Z = R, ഏറ്റവും ചെറിയ വില.']),
    C(['Why can a capacitor correct a lagging power factor?','कैपेसिटर लैगिंग पावर फैक्टर कैसे ठीक करता है?','കപ്പാസിറ്ററിന് ലാഗിംഗ് പവർ ഫാക്ടർ ശരിയാക്കാൻ കഴിയുന്നത് എങ്ങനെ?'],['Its current leads and the coil’s current lags, so the two cancel in the line.','इसका करंट लीड करता है और कॉइल का लैग, इसलिए लाइन में दोनों कैंसल होते हैं।','ഇതിന്റെ കറന്റ് ലീഡ് ചെയ്യുന്നു, കോയിലിന്റേത് ലാഗ്, അതിനാൽ ലൈനിൽ രണ്ടും ക്യാൻസൽ ആകും.'])]},
   {name:L('L3 Workshop','L3 वर्कशॉप','L3 വർക്ക്ഷോപ്പ്'),cards:[
    C(['A coil rated for 230 V AC is put on 230 V DC. What happens and why?','230 V AC की कॉइल 230 V DC पर लगाई। क्या होगा और क्यों?','230 V AC കോയിൽ 230 V DC-യിൽ ഘടിപ്പിച്ചു. എന്ത് സംഭവിക്കും, എന്തുകൊണ്ട്?'],['It overheats and burns. On DC the reactance is zero, so only the small wire resistance limits the current.','यह गर्म होकर जल जाती है। DC पर रिएक्टेंस शून्य, इसलिए सिर्फ़ छोटा वायर रेसिस्टेंस करंट रोकता है।','ഇത് ചൂടായി കത്തും. DC-യിൽ റിയാക്ടൻസ് പൂജ്യം, അതിനാൽ ചെറിയ വയർ റെസിസ്റ്റൻസ് മാത്രം കറന്റ് തടയുന്നു.']),
    C(['A fan is slow. The capacitor shows no needle kick. What next?','पंखा धीमा है। कैपेसिटर में सुई का झटका नहीं। आगे क्या?','ഫാൻ പതുക്കെ. കപ്പാസിറ്ററിൽ സൂചി ചാടുന്നില്ല. അടുത്തത് എന്ത്?'],['It is open. Discharge, then replace it with the same µF and voltage rating.','यह ओपन है। डिस्चार्ज करो, फिर उतना ही µF और वोल्टेज रेटिंग वाला लगाओ।','ഇത് ഓപ്പൺ ആണ്. ഡിസ്ചാർജ് ചെയ്ത്, അതേ µF-ഉം വോൾട്ടേജ് റേറ്റിംഗും ഉള്ളത് ഇടൂ.']),
    C(['How do you avoid damage from resonance in a filter?','फिल्टर में रेज़ोनेंस से नुकसान कैसे बचाते हो?','ഫിൽട്ടറിൽ റെസൊണൻസ് മൂലമുള്ള കേട് എങ്ങനെ ഒഴിവാക്കും?'],['Check VC and VL at f₀. Use parts rated well above them, or add resistance, or keep f₀ away from the supply frequency.','f₀ पर VC और VL चेक करो। उनसे काफी ऊँची रेटिंग के पार्ट लो, या रेसिस्टेंस जोड़ो, या f₀ को सप्लाई फ्रीक्वेंसी से दूर रखो।','f₀-ൽ VC, VL പരിശോധിക്കൂ. അവയേക്കാൾ വളരെ ഉയർന്ന റേറ്റിംഗ് ഉള്ള പാർട്ടുകൾ എടുക്കൂ, അല്ലെങ്കിൽ റെസിസ്റ്റൻസ് ചേർക്കൂ, അല്ലെങ്കിൽ f₀ സപ്ലൈ ഫ്രീക്വൻസിയിൽ നിന്ന് അകറ്റൂ.'])]}],'m5bviva')}});

/* ---------- 22 Interview ---------- */
CS({id:'b_intv',menu:'Interview cards',kind:'law',title:'interview',wide:true,hk:undefined,page(w,s,api){
  const C=(q,a)=>[L(q[0],q[1],q[2]),L(a[0],a[1],a[2])];
  flipDeck(w,api,[
   {name:L('Interview','इंटरव्यू','ഇന്റർവ്യൂ'),cards:[
    C(['Explain impedance in one minute.','एक मिनट में इम्पीडेंस समझाओ।','ഒരു മിനിറ്റിൽ ഇം‌പീഡൻസ് വിശദീകരിക്കൂ.'],['Impedance is the total opposition to AC. It combines resistance and reactance at 90° to each other: Z = √(R² + X²). It sets the current I = V ÷ Z and the phase angle φ.','इम्पीडेंस AC का टोटल विरोध है। यह रेसिस्टेंस और रिएक्टेंस को 90° पर जोड़ता है: Z = √(R² + X²)। यह करंट I = V ÷ Z और फेज़ कोण φ तय करता है।','ഇം‌പീഡൻസ് AC-യോടുള്ള ആകെ എതിർപ്പാണ്. ഇത് റെസിസ്റ്റൻസും റിയാക്ടൻസും 90°-യിൽ കൂട്ടുന്നു: Z = √(R² + X²). ഇത് കറന്റ് I = V ÷ Z-ഉം ഫേസ് കോൺ φ-ഉം നിശ്ചയിക്കുന്നു.']),
    C(['Where is resonance useful and where is it dangerous?','रेज़ोनेंस कहाँ काम का और कहाँ खतरनाक?','റെസൊണൻസ് എവിടെ ഉപയോഗപ്രദം, എവിടെ അപകടം?'],['Useful in radio tuning and filters. Dangerous in power circuits, where the voltage across a coil or capacitor can exceed the rating.','रेडियो ट्यूनिंग और फिल्टर में काम का। पावर सर्किट में खतरनाक, जहाँ कॉइल या कैपेसिटर पर वोल्टेज रेटिंग से ऊपर जा सकता है।','റേഡിയോ ട്യൂണിംഗ്, ഫിൽട്ടർ എന്നിവയിൽ ഉപയോഗപ്രദം. പവർ സർക്യൂട്ടിൽ അപകടം: കോയിലിലോ കപ്പാസിറ്ററിലോ വോൾട്ടേജ് റേറ്റിംഗ് കടക്കാം.']),
    C(['Why is a low power factor bad for the supplier?','कम पावर फैक्टर सप्लायर के लिए बुरा क्यों?','കുറഞ്ഞ പവർ ഫാക്ടർ സപ്ലൈ നൽകുന്നവർക്ക് മോശമായത് എന്തുകൊണ്ട്?'],['The same real power needs more current, which means more I² × R loss and bigger cables.','उतनी ही रियल पावर के लिए ज़्यादा करंट चाहिए, यानी ज़्यादा I² × R लॉस और मोटी केबल।','അതേ റിയൽ പവറിന് കൂടുതൽ കറന്റ് വേണം, അതായത് കൂടുതൽ I² × R നഷ്ടവും വലിയ കേബിളും.'])]}],'m5bintv')}});

/* ---------- 29 MCQ ---------- */
CS({id:'b_mcq',menu:'MCQ quiz',kind:'tip',title:'quiz',wide:true,hk:undefined,page(w,s,api){
  const Q=[
   [L('In a pure inductor the current …','प्योर इंडक्टर में करंट …','പ്യുവർ ഇൻഡക്ടറിൽ കറന്റ് …'),[L('lags the voltage by 90°','वोल्टेज से 90° लैग','വോൾട്ടേജിനേക്കാൾ 90° ലാഗ്'),L('leads the voltage by 90°','वोल्टेज से 90° लीड','വോൾട്ടേജിനേക്കാൾ 90° ലീഡ്'),L('is in phase','इन-फेज़','ഇൻ-ഫേസ്'),L('is zero always','हमेशा ज़ीरो','എപ്പോഴും പൂജ്യം')],0,L('ELI: current lags in an inductor.','ELI: इंडक्टर में करंट लैग।','ELI: ഇൻഡക്ടറിൽ കറന്റ് ലാഗ്.')],
   [L('A 0.1 H coil is on a 100 Hz supply. XL ≈ ?','0.1 H कॉइल 100 Hz सप्लाई पर। XL ≈ ?','0.1 H കോയിൽ 100 Hz സപ്ലൈയിൽ. XL ≈ ?'),['63 Ω','31 Ω','10 Ω','628 Ω'],0,L('2π × 100 × 0.1 = 62.8 Ω.','2π × 100 × 0.1 = 62.8 Ω।','2π × 100 × 0.1 = 62.8 Ω.')],
