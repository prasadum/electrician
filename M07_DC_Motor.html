html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:400 16px/1.35 NL,NG,NM,ND,NK,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bar{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.bar .ttl{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{min-width:44px;min-height:44px;padding:0 12px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--def);border-color:var(--def);color:#fff}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--def);outline-offset:2px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-width:44px;min-height:44px;border:0;background:var(--card);font-weight:700;font-size:14px;padding:0 8px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--def);color:#fff}
#prog{height:6px;background:var(--line);flex:none}#prog i{display:block;height:100%;width:0;background:var(--def);transition:width .25s}
#xp{font-weight:700;font-size:14px;color:var(--frm);display:none}
body.study #xp{display:inline}
#stage{flex:1;min-height:0;overflow:auto;display:flex;touch-action:pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.slide{margin:auto;width:100%;min-height:100%;display:grid;gap:10px;padding:10px 12px 14px;
  grid-template-columns:1fr;grid-template-areas:"head" "vis" "side";align-content:start}
.s-head{grid-area:head;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;border-left:8px solid var(--k);padding-left:10px}
.s-vis{grid-area:vis;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px;position:relative;min-width:0}
.s-vis svg{width:100%;height:auto;max-height:52vh;display:block;touch-action:pan-y pinch-zoom}
.s-side{grid-area:side;display:flex;flex-direction:column;gap:10px;min-width:0}
.kind-def{--k:var(--def);--kb:var(--def-bg)}.kind-law{--k:var(--law);--kb:var(--law-bg)}
.kind-formula{--k:var(--frm);--kb:var(--frm-bg)}.kind-warn{--k:var(--warn);--kb:var(--warn-bg)}.kind-tip{--k:var(--tip);--kb:var(--tip-bg)}
.kind-def .s-vis,.kind-law .s-vis,.kind-formula .s-vis,.kind-warn .s-vis,.kind-tip .s-vis{border-color:var(--k)}
.tag{font-size:14px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--kb);color:var(--k);border:1.5px solid var(--k);white-space:nowrap}
.tag.add{background:#fff6cf;color:#6a4b00;border-color:#d9a400}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tag.add{background:#3a3010;color:#ffd84a;border-color:#a98400}}
:root[data-theme=dark] .tag.add{background:#3a3010;color:#ffd84a;border-color:#a98400}
h2.term{margin:0;font-size:clamp(22px,5.4vw,30px);line-height:1.15}
.t .en{font-weight:700}.t .hi,.t .ml{display:block;font-size:14px;font-weight:400;color:var(--mut);line-height:1.25}
.t .hi,.t .ml{display:none}
h2.term .t .hi,h2.term .t .ml{display:none}
body[data-lang=hi] .t .hi,body[data-lang=all] .t .hi,body[data-lang=ml] .t .ml,body[data-lang=all] .t .ml{display:block}
body[data-lang=hi] h2.term .t .hi,body[data-lang=all] h2.term .t .hi,body[data-lang=ml] h2.term .t .ml,body[data-lang=all] h2.term .t .ml{display:inline;font-size:.7em;font-weight:400;color:var(--mut)}
h2.term .t .hi::before,h2.term .t .ml::before{content:' / ';color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--kb,var(--card));border:1.5px solid var(--k,var(--line));border-radius:10px;padding:6px 10px;font-size:16px;min-width:0}
.chip .sym{display:block;font-size:14px;color:var(--mut);font-weight:600}
.chip .sym sup,.chip .sym sub{font-size:inherit}
.hook{display:flex;gap:8px;align-items:center;font-weight:700;font-size:18px;background:var(--kb);border-radius:10px;padding:8px 10px;border:1.5px dashed var(--k)}
.hook small{font-size:14px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.beat{font-size:14px;font-weight:700;color:var(--mut);margin:0 0 4px}
.pred{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.pred .q{font-weight:700;font-size:18px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:48px;padding:6px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px;touch-action:manipulation;flex:1 1 auto;min-width:88px}

const INL=new Set(['I','B','SUB','SUP','EM','STRONG','SMALL']);
function wrapT(en,hi,ml){const sp=document.createElement('span');sp.className='t';sp.innerHTML=`<span class="en">${en}</span><span class="hi">${hi}</span><span class="ml">${ml}</span>`;return sp}
const SYM=new Set(['Vav','Vrms','Vpp','rms','sin','cos','tan','kWh','kVA','kVAR','kW','Vm','Em','rad','mm','kHz','MHz','Hz','mA','kΩ','MΩ','VAR','RMS','AC','DC','Wb']);
function needs(t){return (t.match(/[A-Za-z]{3,}/g)||[]).filter(w=>!SYM.has(w)).length>=1}
function autoT(root){if(!root)return;
 const els=[...root.querySelectorAll('*')];
 for(const e of els){if(!e.isConnected||e.closest('.t,svg,script,style,textarea'))continue;
  const kids=[...e.childNodes];if(!kids.length)continue;
  const simple=kids.every(n=>n.nodeType===3||(n.nodeType===1&&INL.has(n.tagName)&&[...n.querySelectorAll('*')].every(c=>INL.has(c.tagName))));
  if(simple){const txt=e.textContent;if(!norm(txt))continue;const r=xl(txt);
   if(r){const en=e.innerHTML;e.innerHTML='';e.appendChild(wrapT(en,r[0],r[1]));continue}
   if(needs(txt))MISS.add(norm(txt))
  }else{
   for(const n of kids){if(n.nodeType!==3)continue;const tx=n.textContent;if(!norm(tx))continue;const r=xl(tx);
    if(r){const sp=wrapT(tx.trim(),r[0],r[1]);n.replaceWith(document.createTextNode(' '),sp)}
    else if(needs(tx))MISS.add(norm(tx))}}}}
let xq=false;function xsched(){if(xq)return;xq=true;requestAnimationFrame(()=>{xq=false;autoT(document.getElementById('stage'))})}
function autoInit(){const st=document.getElementById('stage');if(!st||st.__xo)return;st.__xo=1;new MutationObserver(xsched).observe(st,{childList:true,subtree:true,characterData:true});xsched()}

/* ---- geometry helpers for flowing dots ---- */
function mkPath(pts){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,L,tot:L[L.length-1]}}
function at(P_,s){s=((s%1)+1)%1;const d=s*P_.tot;let i=1;while(i<P_.L.length-1&&P_.L[i]<d)i++;
  const a=P_.pts[i-1],b=P_.pts[i],k=(d-P_.L[i-1])/((P_.L[i]-P_.L[i-1])||1);return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]}

  const l=h('label'),id='s'+Math.random().toString(36).slice(2,7);
  l.innerHTML=`<span>${label} <span class="val"></span></span>`;
  const i=h('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=val;i.id=id;i.setAttribute('aria-label',label.replace(/<[^>]+>/g,''));
  const v=$('.val',l);const upd=()=>{v.textContent=fmt(+i.value)};
  i.addEventListener('input',()=>{upd();cb(+i.value)});upd();l.appendChild(i);host.appendChild(l);
  return{get:()=>+i.value,set:x=>{i.value=x;upd()},input:i}}

 const pole=(top)=>{const y0=top?48:144;const core=top?`M156 48H226V68H236V78H146V68H156Z`:`M156 172H226V152H236V142H146V152H156Z`;

 s+=g(0,dn,yokeHalf(false)+pole(false)+`<path d="M96 190h40v10h-40zM246 190h40v10h-40z" fill="${IRON}" stroke="#4a5560" stroke-width="1.5"/>`);
 s+=g(0,up,yokeHalf(true)+pole(true)+`<rect x="174" y="14" width="34" height="16" rx="2" fill="${H('tbox')?'#f2b8b3':'#9aa5b1'}" ${hlS(H('tbox'))}/>`);

 const cs=Math.round(((rot%30)+30)%30/6);

 s+=a;
 /* brushes + holder (move up with top half) */
 s+=g(0,up*1.4,`<rect x="270" y="58" width="22" height="16" fill="#9aa5b1" stroke="#4a5560" stroke-width="1.4"/><path d="M276 58c-6-6 6-8 0-14M286 58c-6-6 6-8 0-14" stroke="#4a5560" stroke-width="1.6" fill="none"/><rect x="274" y="72" width="14" height="${(20-6*e).toFixed(1)}" fill="${H('brush')?'var(--no)':CARB}"/>`)
  +g(0,dn*1.4,`<rect x="270" y="146" width="22" height="16" fill="#9aa5b1" stroke="#4a5560" stroke-width="1.4"/><rect x="274" y="${(128+6*e).toFixed(1)}" width="14" height="${(20-6*e).toFixed(1)}" fill="${H('brush')?'var(--no)':CARB}"/>`);

/* ---- end view cross-section: 2-pole, N left, S right. o: rot (rad), cur (−1..1 armature current sign scale), ip (interpoles), cw (compensating), brushAng (deg from vertical), flux mode ---- */
function machineEnd(cx,cy,o){o=o||{};const R1=96,R0=82,ra=48;let s='';
 s+=`<circle cx="${cx}" cy="${cy}" r="${R1}" fill="${IRON}" stroke="#4a5560" stroke-width="1.5"/><circle cx="${cx}" cy="${cy}" r="${R0}" fill="var(--bg)"/>`;
 /* main poles */
 [[-1,'#d9362b','N'],[1,'#2a6fdb','S']].forEach(([sd,col,lb])=>{if(o.nofield){col='#a7b1bb';lb=''}const x0=cx+sd*R0,x1=cx+sd*(ra+8);
  s+=`<path d="M${x0} ${cy-16}L${cx+sd*(ra+22)} ${cy-16}L${cx+sd*(ra+22)} ${cy-34}L${x1} ${cy-40}Q${cx+sd*(ra+4)} ${cy} ${x1} ${cy+40}L${cx+sd*(ra+22)} ${cy+34}L${cx+sd*(ra+22)} ${cy+16}L${x0} ${cy+16}Z" fill="${col}" stroke="#333" stroke-width="1.2"/>`;
  s+=`<rect x="${Math.min(x0,cx+sd*(ra+24))+ (sd<0?2:-2)}" y="${cy-30}" width="${Math.abs(x0-(cx+sd*(ra+24)))-0}" height="12" fill="${CU}" opacity=".95"/><rect x="${Math.min(x0,cx+sd*(ra+24))+(sd<0?2:-2)}" y="${cy+18}" width="${Math.abs(x0-(cx+sd*(ra+24)))}" height="12" fill="${CU}" opacity=".95"/>`;
  s+=TXC(cx+sd*(R0-12),cy+6,lb,'#fff','17');
  if(o.cw){for(let k=-1;k<=1;k++){const yy=cy+k*20,xx=cx+sd*(ra+11);s+=cond(xx,yy,(sd<0?1:-1),5)}}});
 /* interpoles top/bottom */
 if(o.ip){[[-1,'S'],[1,'N']].forEach(([sd,lb])=>{const y0=cy+sd*R0,y1=cy+sd*(ra+8);s+=`<rect x="${cx-9}" y="${Math.min(y0,y1)}" width="18" height="${Math.abs(y0-y1)}" fill="${lb==='N'?'#e98a83':'#8db4ef'}" stroke="#333" stroke-width="1.2"/>`+TXC(cx+22,cy+sd*(ra+22)+5,lb,lb==='N'?'#d9362b':'#2a6fdb','13')})}
 /* armature */
 const th=o.rot||0;s+=`<circle cx="${cx}" cy="${cy}" r="${ra}" fill="${IRON2}" stroke="#4a5560" stroke-width="1.5"/>`;
 const n=o.nocond?0:16;for(let k=0;k<n;k++){const a=th+k*TPI/n,x=cx+(ra-9)*Math.cos(a),y=cy-(ra-9)*Math.sin(a);const sgn=o.cur?(Math.cos(a)>0?1:-1)*(Math.abs(Math.cos(a))>.2?1:0):0;
  s+=`<circle cx="${(cx+(ra-9)*Math.cos(a)).toFixed(1)}" cy="${(cy-(ra-9)*Math.sin(a)).toFixed(1)}" r="7.5" fill="var(--bg)"/>`+cond(x,y,o.cur?Math.sign(o.cur)*sgn:(o.emf?(Math.cos(a)>0?1:-1)*(Math.abs(Math.cos(a))>.2?1:0):0),5.4)}
 s+=`<circle cx="${cx}" cy="${cy}" r="9" fill="#6b7580"/>`;
 /* brushes on the neutral (vertical) shifted by brushAng */
 const ba=(o.brushAng||0);[90,270].forEach(d=>{const p=pos(cx,cy,ra+2,d-ba);s+=`<rect x="${(p[0]-7).toFixed(1)}" y="${(p[1]-7).toFixed(1)}" width="14" height="14" fill="${CARB}" transform="rotate(${-(d-ba)+90} ${p[0].toFixed(1)} ${p[1].toFixed(1)})"/>`});
 return s}

 play:L('Slide the starting resistance. Compare the starting current with the safe limit.','स्टार्टिंग रेज़िस्टेंस स्लाइड करो। स्टार्टिंग करंट को सुरक्षित सीमा से मिलाओ।','സ്റ്റാർട്ടിംഗ് റെസിസ്റ്റൻസ് സ്ലൈഡ് ചെയ്യൂ. സ്റ്റാർട്ടിംഗ് കറന്റ് സുരക്ഷിത പരിധിയുമായി താരതമ്യം ചെയ്യൂ.'),
 pred:{q:L('Adding resistance in series with the armature at start …','शुरू में आर्मेचर के सीरीज़ में रेज़िस्टेंस जोड़ने से …','തുടക്കത്തിൽ ആർമേച്ചറിന് സീരീസിൽ റെസിസ്റ്റൻസ് ചേർത്താൽ …'),o:[L('limits the starting current','स्टार्टिंग करंट सीमित होता है','സ്റ്റാർട്ടിംഗ് കറന്റ് പരിമിതമാകും'),L('raises the starting current','स्टार्टिंग करंट बढ़ता है','സ്റ്റാർട്ടിംഗ് കറന്റ് കൂടും'),L('changes nothing','कुछ नहीं बदलता','ഒന്നും മാറ്റില്ല')],a:0,why:L('Ohm’s law: more R, less I.','ओम का नियम: ज़्यादा R, कम I।','ഓം നിയമം: കൂടുതൽ R, കുറഞ്ഞ I.')},
 labels:['starter','armature'],hints:['vir','vt6'],rel:{c:['V','R','Ia'],h:'Ia'},
 fm:['<i>I</i><sub>st</sub> = <i>V</i> ÷ (<i>R</i><sub>a</sub> + <i>R</i>)'],
 uses:L('At standstill Eb = 0. Ist starting current (A), R starter resistance (Ω). Usually limited to about 1.5 to 2 times full-load current.','रुकी अवस्था में Eb = 0। Ist स्टार्टिंग करंट (A), R स्टार्टर रेज़िस्टेंस (Ω)। आमतौर पर फुल-लोड करंट का करीब 1.5 से 2 गुना।','നിശ്ചലാവസ്ഥയിൽ Eb = 0. Ist സ്റ്റാർട്ടിംഗ് കറന്റ് (A), R സ്റ്റാർട്ടർ റെസിസ്റ്റൻസ് (Ω). സാധാരണ ഫുൾ-ലോഡ് കറന്റിന്റെ ഏകദേശം 1.5 മുതൽ 2 മടങ്ങ്.'),
 ex:L('Example: 220 ÷ 0.5 = 440 A without starter. With 4.5 Ω more: 220 ÷ 5 = 44 A.','उदाहरण: स्टार्टर बिना 220 ÷ 0.5 = 440 A। 4.5 Ω जोड़कर: 220 ÷ 5 = 44 A।','ഉദാഹരണം: സ്റ്റാർട്ടർ ഇല്ലാതെ 220 ÷ 0.5 = 440 A. 4.5 Ω കൂടി ചേർത്താൽ: 220 ÷ 5 = 44 A.'),
 trick:L('No Eb at start, so add R at start.','शुरू में Eb नहीं, इसलिए शुरू में R जोड़ो।','തുടക്കത്തിൽ Eb ഇല്ല, അതിനാൽ തുടക്കത്തിൽ R ചേർക്കൂ.'),
 check:{q:L('V = 220 V, Ra = 1 Ω, starter 10 Ω. Starting current is …','V = 220 V, Ra = 1 Ω, स्टार्टर 10 Ω। स्टार्टिंग करंट …','V = 220 V, Ra = 1 Ω, സ്റ്റാർട്ടർ 10 Ω. സ്റ്റാർട്ടിംഗ് കറന്റ് …'),o:['20 A','220 A','22 A'],a:0},
 build(w,api){
  w.innerHTML=S(420,215,`<g id="a"></g>`,'Motor with a starting resistance and starting-current bar');
  const rd=mkRd(w),c=mkCtl(w);let ri=0;

  return t=>{const R=MRS[ri],I=220/(.5+R),bad=I>40.5;const W='var(--wire)';
   let s=`<path d="M30 40v26M40 46v14" stroke="var(--fg)" stroke-width="3"/>`+TXC(20,36,'+','var(--fg)','14')+TXC(20,100,'220 V','var(--fg)','13')+poly([[35,40],[35,20],[200,20]],W)+poly([[35,66],[35,190],[200,190]],W);
   s+=`<rect x="100" y="12" width="70" height="16" rx="3" fill="${R?'#e7d2a6':'var(--card)'}" stroke="${W}" stroke-width="2"/>`+TXC(135,10,'R = '+R+' Ω','var(--frm)','13');
   s+=machineEnd(220,105,{rot:-t*(bad?0.2:1),cur:-1}).replace(/<circle cx="220" cy="105" r="96"/,'<circle cx="220" cy="105" r="96"')+poly([[200,20],[220,20],[220,57]],W)+poly([[220,153],[220,190],[200,190]],W);
   if(bad&&Math.floor(t*8)%2)s+=`<path d="M226 52l10 -14l3 9l10 -14M214 156l-10 14l-3 -9l-10 14" stroke="#ffb020" stroke-width="3" fill="none"/>`;
   const bx=330,bh=150,top=30,sc=v=>Math.min(1,v/440)*bh;s+=`<rect x="${bx}" y="${top}" width="34" height="${bh}" fill="none" stroke="${W}" stroke-width="2"/><rect x="${bx}" y="${(top+bh-sc(I)).toFixed(1)}" width="34" height="${sc(I).toFixed(1)}" fill="${bad?'var(--no)':'var(--ok)'}"/><path d="M${bx-6} ${(top+bh-sc(40)).toFixed(1)}H${bx+42}" stroke="var(--ok)" stroke-width="2.5" stroke-dasharray="4 3"/>`+TXC(bx+17,top+bh+20,'Ist','var(--fg)','14')+TXC(bx+62,top+bh-sc(40)+5,'2× FL','var(--ok)','12');
   put($('#a',w),s);setRd(rd,`<span>Ist = 220 ÷ (0.5 + ${R}) = <b>${Math.round(I)} A</b> · ${RD('full load 20 A','फुल लोड 20 A','ഫുൾ ലോഡ് 20 A')} · ${bad?RD('too high','बहुत ज़्यादा','വളരെ കൂടുതൽ'):RD('safe','सुरक्षित','സുരക്ഷിതം')}</span>`)}}});

CS({id:'m_speed',menu:'Speed equation',title:'t_speed',

 hook:L('Weaken the field of a running shunt motor. Surprise: it speeds up.','चलती शंट मोटर का फील्ड कमज़ोर करो। हैरानी: वह तेज़ हो जाती है।','ഓടുന്ന ഷണ്ട് മോട്ടോറിന്റെ ഫീൽഡ് കുറയ്ക്കൂ. അത്ഭുതം: വേഗം കൂടുന്നു.'),
 defn:L('<b>Speed:</b> N ∝ Eb ÷ Φ. Raise V → faster. Weaken Φ → faster. If the field opens, the speed can rise dangerously.','<b>स्पीड:</b> N ∝ Eb ÷ Φ। V बढ़ाओ → तेज़। Φ घटाओ → तेज़। फील्ड खुल जाए तो स्पीड खतरनाक बढ़ सकती है।','<b>സ്പീഡ്:</b> N ∝ Eb ÷ Φ. V കൂട്ടിയാൽ → വേഗം. Φ കുറച്ചാൽ → വേഗം. ഫീൽഡ് തുറന്നാൽ സ്പീഡ് അപകടകരമായി കൂടാം.'),
 real:`<svg viewBox="0 0 300 110" role="img" aria-label="Speedometer dial"><path d="M80 90a70 70 0 0 1 140 0" fill="none" stroke="var(--wire)" stroke-width="4"/><path d="M150 90L200 46" stroke="var(--no)" stroke-width="4"/></svg>`,

 pred:{q:L('The field flux of a shunt motor is reduced. The speed …','शंट मोटर का फील्ड फ्लक्स घटाया। स्पीड …','ഷണ്ട് മോട്ടോറിന്റെ ഫീൽഡ് ഫ്ലക്സ് കുറച്ചു. സ്പീഡ് …'),o:[L('rises','बढ़ती है','കൂടുന്നു'),L('falls','घटती है','കുറയുന്നു'),L('stays','वही','അതേ')],a:0,why:L('To make the same Eb with less flux, the armature must spin faster.','कम फ्लक्स से वही Eb बनाने को आर्मेचर को तेज़ घूमना पड़ता है।','കുറഞ്ഞ ഫ്ലക്സിൽ അതേ Eb ഉണ്ടാക്കാൻ ആർമേച്ചർ വേഗത്തിൽ കറങ്ങണം.')},
 labels:['speedn','flux','backe'],hints:['emf6','vt6'],rel:{c:['V','Eb','Φ','N'],h:'N'},
 fm:['<i>N</i> ∝ (<i>V</i> − <i>I</i><sub>a</sub><i>R</i><sub>a</sub>) ÷ <i>Φ</i>'],
 uses:L('N speed (rpm), Φ flux per pole (Wb). From Eb = ΦZNP ÷ 60A. Same Ia assumed. Two speeds: N2 ÷ N1 = (Eb2 ÷ Eb1) × (Φ1 ÷ Φ2).','N स्पीड (rpm), Φ प्रति पोल फ्लक्स (Wb)। Eb = ΦZNP ÷ 60A से। वही Ia माना। दो स्पीड: N2 ÷ N1 = (Eb2 ÷ Eb1) × (Φ1 ÷ Φ2)।','N സ്പീഡ് (rpm), Φ ഒരു പോളിലെ ഫ്ലക്സ് (Wb). Eb = ΦZNP ÷ 60A-ൽ നിന്ന്. അതേ Ia എന്ന് അനുമാനം. രണ്ട് സ്പീഡ്: N2 ÷ N1 = (Eb2 ÷ Eb1) × (Φ1 ÷ Φ2).'),
 ex:L('Example: 1000 rpm at full flux. Flux to 80 %, same Eb: 1000 ÷ 0.8 = 1250 rpm.','उदाहरण: पूरे फ्लक्स पर 1000 rpm। फ्लक्स 80 %, वही Eb: 1000 ÷ 0.8 = 1250 rpm।','ഉദാഹരണം: പൂർണ്ണ ഫ്ലക്സിൽ 1000 rpm. ഫ്ലക്സ് 80 %, അതേ Eb: 1000 ÷ 0.8 = 1250 rpm.'),
 trick:L('Less flux, more speed. Never open a shunt field on a running motor.','कम फ्लक्स, ज़्यादा स्पीड। चलती मोटर का शंट फील्ड कभी मत खोलो।','കുറഞ്ഞ ഫ്ലക്സ്, കൂടുതൽ സ്പീഡ്. ഓടുന്ന മോട്ടോറിന്റെ ഷണ്ട് ഫീൽഡ് ഒരിക്കലും തുറക്കരുത്.'),
 check:{q:L('Same Eb, flux halved. 600 rpm becomes …','वही Eb, फ्लक्स आधा। 600 rpm हो जाता है …','അതേ Eb, ഫ്ലക്സ് പകുതി. 600 rpm ആകുന്നത് …'),o:['1200 rpm','300 rpm','600 rpm'],a:0},
 build(w,api){

  slider(c,'V',0,2,1,2,x=>MSV[x]+' V',x=>{vi=x;api.redraw()});slider(c,'Φ',0,2,1,2,x=>MSF[x]+' %',x=>{fi=x;api.redraw()});
  tog(c,L('Field open','फील्ड खुला','ഫീൽഡ് തുറന്നു'),v=>{op=v;api.redraw()});
  return t=>{const V=MSV[vi],F=op?5:MSF[fi],N=1000*((V-10)/210)/(F/100),Nd=Math.min(N,3000);
   let s=`<path d="${arcPath(296,140,78,0,180)}" fill="none" stroke="var(--wire)" stroke-width="4"/><path d="${arcPath(296,140,78,0,40)}" fill="none" stroke="var(--no)" stroke-width="8"/>`;
   [0,1500,3000].forEach(v=>{const p=pos(296,140,92,180-v/3000*180);s+=TXC(p[0],p[1]+5,v,'var(--mut)','12')});
   const an=180-Nd/3000*180+(op?Math.sin(t*20)*3:0),p=pos(296,140,68,an);s+=`<path d="M296 140L${p[0].toFixed(1)} ${p[1].toFixed(1)}" stroke="var(--no)" stroke-width="5"/><circle cx="296" cy="140" r="7" fill="var(--fg)"/>`+TXC(296,180,(op?'> 3000':Math.round(N))+' rpm',op?'var(--no)':'var(--fg)','20');

   put($('#a',w),s);setRd(rd,`<span>${op?RD('Field open: only residual flux. Speed runs away. Danger!','फील्ड खुला: सिर्फ़ रेज़िड्यूअल फ्लक्स। स्पीड बेकाबू। खतरा!','ഫീൽഡ് തുറന്നു: റെസിഡ്യുവൽ ഫ്ലക്സ് മാത്രം. സ്പീഡ് നിയന്ത്രണം വിടും. അപകടം!'):'N = 1000 × '+fm1((V-10)/210)+' ÷ '+fm1(F/100)+' = <b>'+Math.round(N)+' rpm</b>'}</span>`)}}});

function motCirc(k,t){const W='var(--wire)',mx=90,my=110,tr=40,br=180,bx=360;let s='';
 s+=poly([[mx,my-28],[mx,tr],[bx,tr],[bx,my-12]],W)+poly([[bx,my+16],[bx,br],[mx,br],[mx,my+28]],W)+motC(mx,my,22)+battV(bx,my);
 if(k===0)s+=`<rect x="${mx-50}" y="${my-16}" width="18" height="32" fill="#d9362b"/><rect x="${mx+32}" y="${my-16}" width="18" height="32" fill="#2a6fdb"/>`;
 if(k===2||k===3){const x0=k===3?130:180;s+=`<rect x="${x0-2}" y="${tr-12}" width="66" height="24" fill="var(--bg)"/>`+coilH(x0,tr,4,62,CU,6)+TXC(x0+31,tr-16,'D1-D2','var(--no)','13')}
 if(k===1||k===3){const xs=k===3?240:220;s+=poly([[xs,tr],[xs,68]],W)+coilV(xs,68,12,84,CU,1.8)+poly([[xs,152],[xs,br]],W)+TXC(xs+36,114,'E1-E2','var(--law)','13')+`<circle cx="${xs}" cy="${tr}" r="4" fill="var(--fg)"/><circle cx="${xs}" cy="${br}" r="4" fill="var(--fg)"/>`+flowDots([[xs,tr],[xs,br]],t,3,'var(--law)',30)}
 /* conventional current: from + (top of battery) along top rail into motor */
 s+=flowDots([[bx,my-12],[bx,tr],[mx,tr],[mx,my-28],[mx,my+28],[mx,br],[bx,br],[bx,my+16]],t,10,'var(--def)',60);
 return s}

function charPlot(fT,fN,tab,x,xm,ym,yT,col,warn){const x0=44,y0=186,W=330,H=160;let s=axes(x0,y0,W,H);
 const lab=tab===0?['Ia','T']:tab===1?['Ia','N']:['T','N'];s+=TXC(x0+W-8,y0+18,lab[0],'var(--mut)','14')+TXC(x0+10,y0-H-4,lab[1],'var(--mut)','14');
 const pts=[];for(let i=0;i<=60;i++){const ia=xm*(.06+.94*i/60),T=fT(ia),N=fN(ia);pts.push(tab===0?[ia/xm,T/yT]:tab===1?[ia/xm,N/ym]:[T/yT,N/ym])}
 s+=`<path d="M${pts.map(p=>(x0+W*Math.min(p[0],1.05)).toFixed(1)+' '+(y0-H*Math.min(p[1],1.08)).toFixed(1)).join('L')}" fill="none" stroke="${col}" stroke-width="3.6"/>`;
 const T=fT(x),N=fN(x),p=tab===0?[x/xm,T/yT]:tab===1?[x/xm,N/ym]:[T/yT,N/ym];s+=`<circle cx="${(x0+W*Math.min(p[0],1.05)).toFixed(1)}" cy="${(y0-H*Math.min(p[1],1.08)).toFixed(1)}" r="7" fill="var(--def)"/>`;
 if(warn)s+=`<rect x="${x0+40}" y="${y0-H+4}" width="230" height="30" rx="6" fill="rgba(217,54,43,.15)" stroke="var(--no)"/>`+TL(x0+155,y0-H+25,['DANGER: runaway speed','खतरा: बेकाबू स्पीड','അപകടം: നിയന്ത്രണമില്ലാത്ത സ്പീഡ്'],'var(--no)');
 return s}

 hook:L('The workshop shunt motor has a box with a handle. Move it slowly from OFF to ON; it stays there by itself.','वर्कशॉप की शंट मोटर के पास हैंडल वाला बॉक्स। OFF से ON तक धीरे घुमाओ; वह खुद वहीं टिकता है।','വർക്ക്ഷോപ്പിലെ ഷണ്ട് മോട്ടോറിന് ഹാൻഡിലുള്ള ഒരു ബോക്സ്. OFF-ൽ നിന്ന് ON വരെ പതുക്കെ നീക്കൂ; അത് സ്വയം അവിടെ നിൽക്കും.'),

 real:`<svg viewBox="0 0 300 110" role="img" aria-label="A starter box with a handle and studs"><rect x="60" y="10" width="180" height="92" rx="8" fill="#3a3f48"/><path d="M90 86A70 70 0 0 1 210 86" fill="none" stroke="${CU}" stroke-width="6" stroke-dasharray="6 10"/><path d="M150 92L118 40" stroke="#ddd" stroke-width="6"/></svg>`,

 pred:{q:L('The supply fails while the motor runs. With an NVR, the handle …','मोटर चलते समय सप्लाई चली गई। NVR के साथ हैंडल …','മോട്ടോർ ഓടുമ്പോൾ സപ്ലൈ പോയി. NVR ഉള്ളപ്പോൾ ഹാൻഡിൽ …'),o:[L('springs back to OFF','स्प्रिंग से OFF पर लौटता है','സ്പ്രിംഗ് കൊണ്ട് OFF-ലേക്ക് തിരികെ'),L('stays at ON','ON पर रहता है','ON-ൽ നിൽക്കും'),L('moves halfway','आधे पर रुकता है','പകുതിയിൽ നിൽക്കും')],a:0,why:L('NVR loses its magnetism, so the spring pulls the handle back. On return of supply, the motor cannot restart without its starter resistance.','NVR का मैग्नेटिज़्म खत्म, स्प्रिंग हैंडल वापस खींचती है। सप्लाई लौटे तो मोटर बिना स्टार्टर रेज़िस्टेंस के चालू नहीं होती।','NVR-ന്റെ കാന്തശക്തി പോകും, സ്പ്രിംഗ് ഹാൻഡിൽ തിരികെ വലിക്കും. സപ്ലൈ തിരികെ വരുമ്പോൾ സ്റ്റാർട്ടർ റെസിസ്റ്റൻസ് ഇല്ലാതെ മോട്ടോർ സ്റ്റാർട്ട് ആകില്ല.')},
 labels:['starter'],hints:['vir'],

 check:{q:L('NVR in a starter stands for …','स्टार्टर में NVR का मतलब …','സ്റ്റാർട്ടറിൽ NVR എന്നത് …'),o:[L('no-volt release','नो-वोल्ट रिलीज़','നോ-വോൾട്ട് റിലീസ്'),L('normal voltage regulator','नॉर्मल वोल्टेज रेगुलेटर','നോർമൽ വോൾട്ടേജ് റെഗുലേറ്റർ'),L('neutral voltage relay','न्यूट्रल वोल्टेज रिले','ന്യൂട്രൽ വോൾട്ടേജ് റിലേ')],a:0},

   {q:L('A 220 V DC motor has Ra = 0.5 Ω and takes Ia = 20 A. The back EMF is …','220 V DC मोटर, Ra = 0.5 Ω, Ia = 20 A। बैक EMF …','220 V DC മോട്ടോർ, Ra = 0.5 Ω, Ia = 20 A. ബാക്ക് EMF …'),o:['210 V','230 V','200 V','220 V'],a:0,why:L('Eb = 220 − 20 × 0.5 = 210 V.','Eb = 220 − 20 × 0.5 = 210 V।','Eb = 220 − 20 × 0.5 = 210 V.')},
   {q:L('A 220 V motor with Ra = 0.5 Ω is switched on without a starter. The starting current is …','220 V, Ra = 0.5 Ω मोटर बिना स्टार्टर चालू। स्टार्टिंग करंट …','220 V, Ra = 0.5 Ω മോട്ടോർ സ്റ്റാർട്ടർ ഇല്ലാതെ ഓൺ ചെയ്തു. സ്റ്റാർട്ടിംഗ് കറന്റ് …'),o:['440 A','110 A','220 A','44 A'],a:0,why:L('Eb = 0 at start: 220 ÷ 0.5 = 440 A.','शुरू में Eb = 0: 220 ÷ 0.5 = 440 A।','തുടക്കത്തിൽ Eb = 0: 220 ÷ 0.5 = 440 A.')},
   {q:L('A shunt motor runs at 1000 rpm. Its flux is reduced to 80 %, Eb nearly the same. New speed is about …','शंट मोटर 1000 rpm पर। फ्लक्स 80 %, Eb लगभग वही। नई स्पीड करीब …','ഷണ്ട് മോട്ടോർ 1000 rpm-ൽ. ഫ്ലക്സ് 80 %, Eb ഏതാണ്ട് അതേ. പുതിയ സ്പീഡ് ഏകദേശം …'),o:['1250 rpm','800 rpm','1000 rpm','1500 rpm'],a:0,why:L('N ∝ 1 ÷ Φ: 1000 ÷ 0.8 = 1250 rpm.','N ∝ 1 ÷ Φ: 1000 ÷ 0.8 = 1250 rpm।','N ∝ 1 ÷ Φ: 1000 ÷ 0.8 = 1250 rpm.')},
   {q:L('A series motor current rises from 10 A to 20 A, below saturation. The torque becomes …','सीरीज़ मोटर करंट 10 A से 20 A, सैचुरेशन से पहले। टॉर्क …','സീരീസ് മോട്ടോർ കറന്റ് 10 A-ൽ നിന്ന് 20 A, സാച്ചുറേഷന് മുമ്പ്. ടോർക്ക് …'),o:['4 times','2 times','same','half'],a:0,why:L('T ∝ Ia²: 2² = 4.','T ∝ Ia²: 2² = 4।','T ∝ Ia²: 2² = 4.')},
   {q:L('Eb = 200 V, Ia = 50 A, N = 955 rpm. The armature torque is about …','Eb = 200 V, Ia = 50 A, N = 955 rpm। आर्मेचर टॉर्क करीब …','Eb = 200 V, Ia = 50 A, N = 955 rpm. ആർമേച്ചർ ടോർക്ക് ഏകദേശം …'),o:['100 N·m','10 N·m','1000 N·m','50 N·m'],a:0,why:L('T = 9.55 × 200 × 50 ÷ 955 = 100 N·m.','T = 9.55 × 200 × 50 ÷ 955 = 100 N·m।','T = 9.55 × 200 × 50 ÷ 955 = 100 N·m.')},
   {q:L('A 220 V shunt motor takes 22 A from the line. Field resistance is 110 Ω. Ia is …','220 V शंट मोटर लाइन से 22 A लेती है। फील्ड रेज़िस्टेंस 110 Ω। Ia …','220 V ഷണ്ട് മോട്ടോർ ലൈനിൽ നിന്ന് 22 A. ഫീൽഡ് റെസിസ്റ്റൻസ് 110 Ω. Ia …'),o:['20 A','24 A','22 A','2 A'],a:0,why:L('Ish = 220 ÷ 110 = 2 A. Ia = 22 − 2 = 20 A.','Ish = 220 ÷ 110 = 2 A। Ia = 22 − 2 = 20 A।','Ish = 220 ÷ 110 = 2 A. Ia = 22 − 2 = 20 A.')}
  ],'m7tw')}});

 trick:L('Measure first. Then decide.','पहले मापो। फिर फैसला करो।','ആദ്യം അളക്കൂ. പിന്നെ തീരുമാനിക്കൂ.'),
 check:{q:L('V = 220 V, Ra = 0.5 Ω, Eb = 210 V. Ia is …','V = 220 V, Ra = 0.5 Ω, Eb = 210 V। Ia …','V = 220 V, Ra = 0.5 Ω, Eb = 210 V. Ia …'),o:['20 A','440 A','10 A'],a:0},
 page(w,s,api){
  const FA=FA7;const sv=P.faultM||(P.faultM={});let mi=0,probe=-1;
  const pic=h('div');w.appendChild(pic);const rd=h('div','rd');w.appendChild(rd);
  const draw=()=>{const m=FA[mi];pic.innerHTML=S(400,125,m.pic(probe,!!sv[mi]),'Fault picture');svgLang();watchFit()};
  const sideTop=h('div');s.appendChild(sideTop);const fin=h('div');fin.hidden=true;s.appendChild(fin);
  const show=()=>{const m=FA[mi];probe=-1;rd.innerHTML='';draw();sideTop.innerHTML='';
   sideTop.appendChild(h('div','beat',RD('Mission '+(mi+1)+' of 5','मिशन '+(mi+1)+' / 5','മിഷൻ '+(mi+1)+' / 5')));
   sideTop.appendChild(h('div','hook',`<small>${term('sp')}</small><span>${B3(m.sp)}</span>`));
   sideTop.appendChild(h('div','beat',RD('Tests: tap one at a time','टेस्ट: एक-एक दबाओ','ടെസ്റ്റ്: ഓരോന്നായി ടാപ്പ് ചെയ്യൂ')));
   const tb=h('div','chips');sideTop.appendChild(tb);
   m.tests.forEach((t,k)=>{const b=h('button','btn',B3(t[0]));b.type='button';b.onclick=()=>{probe=k+1;const r=t[1];setRd(rd,`<span>${B3(t[0])} → <b>${Array.isArray(r)?B3(r):r}</b></span>`);draw();dg.hidden=false};tb.appendChild(b)});
   const dg=h('div');dg.hidden=!sv[mi];sideTop.appendChild(dg);
   dg.appendChild(h('div','beat',RD('Your diagnosis','आपका डायग्नोसिस','നിങ്ങളുടെ ഡയഗ്നോസിസ്')));
   const os=h('div','opts');dg.appendChild(os);const fb=h('div','fb');fb.setAttribute('aria-live','polite');dg.appendChild(fb);const nx=h('div');dg.appendChild(nx);
   const done=()=>{fb.className='fb ok';fb.innerHTML=ICO.ok+' '+UIB('ok')+' '+B3(m.why);$$('.opt',os).forEach((x,k)=>{x.disabled=true;if(k===m.a)x.classList.add('right')});draw();
    nx.innerHTML='';const bt=h('button','btn big on');bt.type='button';bt.innerHTML=(mi<4?RD('Next mission','नेक्स्ट मिशन','നെക്സ്റ്റ് മിഷൻ'):RD('Finish','फिनिश','ഫിനിഷ്'))+' →';bt.onclick=()=>{if(mi<4){mi++;show()}else{finish()}};nx.appendChild(bt)};
   m.o.forEach((o,k)=>{const b=h('button','opt',B3(o));b.type='button';b.onclick=()=>{if(k===m.a){sv[mi]=1;save();award(10,'fc'+mi,P.chk);done()}else{b.classList.add('wrong');b.disabled=true;fb.className='fb no';fb.innerHTML=ICO.no+' '+UIB('again')}};os.appendChild(b)});
   if(sv[mi])done();
   api.redraw()};
  const finish=()=>{sideTop.innerHTML='';rd.innerHTML='';pic.innerHTML='';fin.hidden=false;fin.innerHTML='';
   fin.appendChild(h('div','beat',RD('All 5 missions done','सभी 5 मिशन पूरे','5 മിഷനും പൂർത്തിയായി')));
   fin.appendChild(h('div','trick',`<small>${term('rem')}</small>${B3(['Measure first. Then decide.','पहले मापो। फिर फैसला करो।','ആദ്യം അളക്കൂ. പിന്നെ തീരുമാനിക്കൂ.'])}`));
   fin.appendChild(checkBlock(SL.find(x=>x.id==='m_fault')));
   const nb=h('button','btn big on');nb.type='button';nb.innerHTML=UIB('nx')+' →';nb.onclick=()=>go(cur+1);fin.appendChild(nb)};
  const firstOpen=[0,1,2,3,4].findIndex(i=>!sv[i]);mi=firstOpen<0?4:firstOpen;
  if(firstOpen<0&&Object.keys(sv).length>=5){show();finish()}else show();
  api.setReplay(()=>{})}});

   <div class="beat" style="margin:12px 2px 6px">${term('connect')}</div><div class="mapw">${M.map((m,i)=>`${i?'<i>→</i>':''}<button type="button" class="mapn ${m[1]==='a'?'m2a':'m2'}" data-t="${m[1]}" data-k="${m[2]}"><b>${m[0]}</b><span>${m[1]==='m6'?'M6 · '+m[2]:'M7 · '+noI(m[2])}</span></button>`).join('')}</div>`;
  $$('.tile',w).forEach(b=>b.addEventListener('click',()=>go(noI(b.dataset.g)-1)));

/* ---------- 27 Viva ---------- */
CS({id:'m_viva',menu:'Viva cards',kind:'def',title:'viva',wide:true,hk:undefined,page(w,s,api){
  const C=(q,a)=>[L(q[0],q[1],q[2]),L(a[0],a[1],a[2])];
  flipDeck(w,api,[
   {name:L('L1 Fact','L1 फैक्ट','L1 ഫാക്ട്'),cards:[
    C(['What is the principle of a DC motor?','DC मोटर का सिद्धांत क्या है?','DC മോട്ടോറിന്റെ തത്വം എന്ത്?'],['A current-carrying conductor in a magnetic field experiences a force.','मैग्नेटिक फील्ड में करंट वाले कंडक्टर पर फ़ोर्स लगता है।','കാന്തിക ഫീൽഡിലെ കറന്റ് ഉള്ള കണ്ടക്ടറിൽ ഫോഴ്സ് വരുന്നു.']),
    C(['Which rule gives the direction of rotation of a motor?','मोटर के घूमने की दिशा कौन सा रूल बताता है?','മോട്ടോറിന്റെ കറക്ക ദിശ ഏത് റൂൾ പറയുന്നു?'],['Fleming’s left-hand rule.','फ्लेमिंग का लेफ्ट-हैंड रूल।','ഫ്ലെമിംഗ് ലെഫ്റ്റ്-ഹാൻഡ് റൂൾ.']),
    C(['Write the voltage equation of a motor.','मोटर का वोल्टेज इक्वेशन लिखो।','മോട്ടോറിന്റെ വോൾട്ടേജ് ഇക്വേഷൻ എഴുതൂ.'],['V = Eb + Ia Ra.','V = Eb + Ia Ra।','V = Eb + Ia Ra.']),
    C(['What are the terminals of a 3-point starter?','3-पॉइंट स्टार्टर के टर्मिनल क्या हैं?','3-പോയിന്റ് സ്റ്റാർട്ടറിന്റെ ടെർമിനലുകൾ എന്തെല്ലാം?'],['L (line), F (field), A (armature).','L (लाइन), F (फील्ड), A (आर्मेचर)।','L (ലൈൻ), F (ഫീൽഡ്), A (ആർമേച്ചർ).']),
    C(['Which motor has the highest starting torque?','सबसे ज़्यादा स्टार्टिंग टॉर्क किस मोटर में?','ഏറ്റവും ഉയർന്ന സ്റ്റാർട്ടിംഗ് ടോർക്ക് ഏത് മോട്ടോറിന്?'],['The series motor (T ∝ Ia² below saturation).','सीरीज़ मोटर (सैचुरेशन से पहले T ∝ Ia²)।','സീരീസ് മോട്ടോർ (സാച്ചുറേഷന് മുമ്പ് T ∝ Ia²).'])]},
   {name:L('L2 Why / How','L2 क्यों / कैसे','L2 എന്തുകൊണ്ട് / എങ്ങനെ'),cards:[
    C(['Why does a DC motor need a starter?','DC मोटर को स्टार्टर क्यों चाहिए?','DC മോട്ടോറിന് സ്റ്റാർട്ടർ എന്തിന്?'],['At standstill Eb = 0, so only the small Ra limits the current. The starter adds resistance until Eb builds up.','रुकी हालत में Eb = 0, सिर्फ़ छोटा Ra करंट रोकता है। Eb बनने तक स्टार्टर रेज़िस्टेंस जोड़ता है।','നിശ്ചലാവസ്ഥയിൽ Eb = 0, ചെറിയ Ra മാത്രം കറന്റ് പരിമിതപ്പെടുത്തുന്നു. Eb ഉയരുന്നതുവരെ സ്റ്റാർട്ടർ റെസിസ്റ്റൻസ് ചേർക്കുന്നു.']),
    C(['Why does a series motor race at no load?','सीरीज़ मोटर नो लोड पर क्यों भागती है?','സീരീസ് മോട്ടോർ നോ ലോഡിൽ ഓടിപ്പോകുന്നത് എന്തുകൊണ്ട്?'],['Small load, small current, weak field. N ∝ 1 ÷ Φ, so speed rises dangerously.','कम लोड, कम करंट, कमज़ोर फील्ड। N ∝ 1 ÷ Φ, स्पीड खतरनाक बढ़ती है।','കുറഞ്ഞ ലോഡ്, കുറഞ്ഞ കറന്റ്, ദുർബല ഫീൽഡ്. N ∝ 1 ÷ Φ, സ്പീഡ് അപകടകരമായി കൂടും.']),
    C(['How does back EMF make a shunt motor self-regulating?','बैक EMF शंट मोटर को सेल्फ-रेगुलेटिंग कैसे बनाता है?','ബാക്ക് EMF ഷണ്ട് മോട്ടോറിനെ സെൽഫ്-റെഗുലേറ്റിംഗ് ആക്കുന്നത് എങ്ങനെ?'],['More load slows it slightly, Eb falls, Ia rises, torque rises to meet the load.','ज़्यादा लोड से थोड़ी धीमी, Eb घटता, Ia बढ़ता, टॉर्क लोड के बराबर।','കൂടുതൽ ലോഡ് അല്പം പതുക്കെയാക്കും, Eb കുറയും, Ia കൂടും, ടോർക്ക് ലോഡിനൊപ്പമെത്തും.']),
    C(['Why is a 4-point starter preferred with field control?','फील्ड कंट्रोल के साथ 4-पॉइंट स्टार्टर क्यों?','ഫീൽഡ് കൺട്രോളിനൊപ്പം 4-പോയിന്റ് സ്റ്റാർട്ടർ എന്തിന്?'],['Its NVR is across the supply, so adding field resistance does not release the handle.','इसका NVR सप्लाई के आर-पार है, फील्ड रेज़िस्टेंस बढ़ाने से हैंडल नहीं छूटता।','അതിന്റെ NVR സപ്ലൈക്ക് കുറുകെയാണ്, ഫീൽഡ് റെസിസ്റ്റൻസ് കൂട്ടിയാലും ഹാൻഡിൽ വിടില്ല.']),
    C(['How do you reverse a DC motor?','DC मोटर की दिशा कैसे उलटते हैं?','DC മോട്ടോറിന്റെ ദിശ എങ്ങനെ തിരിക്കും?'],['Reverse either the armature or the field connections, not both.','आर्मेचर या फील्ड कनेक्शन में से एक उलटो, दोनों नहीं।','ആർമേച്ചർ അല്ലെങ്കിൽ ഫീൽഡ് കണക്ഷൻ ഒന്ന് മാത്രം തിരിക്കൂ, രണ്ടും അല്ല.'])]},
   {name:L('L3 Workshop','L3 वर्कशॉप','L3 വർക്ക്ഷോപ്പ്'),cards:[
    C(['A shunt motor suddenly races. What do you do first?','शंट मोटर अचानक भागती है। पहले क्या करोगे?','ഷണ്ട് മോട്ടോർ പെട്ടെന്ന് ഓടിപ്പോകുന്നു. ആദ്യം എന്ത് ചെയ്യും?'],['Switch off at once. Then check the field circuit for an open or loose connection.','तुरंत बंद करो। फिर फील्ड सर्किट में खुला या ढीला कनेक्शन देखो।','ഉടനെ ഓഫ് ചെയ്യൂ. പിന്നെ ഫീൽഡ് സർക്യൂട്ടിൽ തുറന്നതോ അയഞ്ഞതോ ആയ കണക്ഷൻ നോക്കൂ.']),
    C(['The starter handle does not stay at ON. Check?','स्टार्टर हैंडल ON पर नहीं टिकता। क्या जाँचोगे?','സ്റ്റാർട്ടർ ഹാൻഡിൽ ON-ൽ നിൽക്കുന്നില്ല. എന്ത് പരിശോധിക്കും?'],['NVR coil continuity, the field circuit (3-point) and the supply voltage.','NVR कॉइल कंटिन्यूटी, फील्ड सर्किट (3-पॉइंट) और सप्लाई वोल्टेज।','NVR കോയിൽ കണ്ടിന്യൂവിറ്റി, ഫീൽഡ് സർക്യൂട്ട് (3-പോയിന്റ്), സപ്ലൈ വോൾട്ടേജ്.']),
    C(['How do you start a DC shunt motor safely?','DC शंट मोटर सुरक्षित कैसे चालू करें?','DC ഷണ്ട് മോട്ടോർ സുരക്ഷിതമായി എങ്ങനെ സ്റ്റാർട്ട് ചെയ്യും?'],['Field rheostat at minimum (full field), then move the starter handle slowly stud by stud to ON.','फील्ड रिओस्टेट न्यूनतम (पूरा फील्ड), फिर स्टार्टर हैंडल धीरे-धीरे स्टड-दर-स्टड ON तक।','ഫീൽഡ് റിയോസ്റ്റാറ്റ് കുറഞ്ഞ നിലയിൽ (പൂർണ്ണ ഫീൽഡ്), പിന്നെ സ്റ്റാർട്ടർ ഹാൻഡിൽ സ്റ്റഡ് തോറും പതുക്കെ ON വരെ.'])]}
  ],'m7viva')}});

/* ---------- 28 Interview ---------- */
CS({id:'m_intv',menu:'Interview cards',kind:'law',title:'interview',wide:true,hk:undefined,page(w,s,api){
  const C=(q,a)=>[L(q[0],q[1],q[2]),L(a[0],a[1],a[2])];
  flipDeck(w,api,[
   {name:L('Interview','इंटरव्यू','ഇന്റർവ്യൂ'),cards:[
