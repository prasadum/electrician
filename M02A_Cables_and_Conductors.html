html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:400 16px/1.35 NL,NG,NM,ND,NK,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bar{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.bar .ttl{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{min-width:44px;min-height:44px;padding:0 12px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--def);border-color:var(--def);color:#fff}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--def);outline-offset:2px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-width:44px;min-height:44px;border:0;background:var(--card);font-weight:700;font-size:14px;padding:0 8px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--def);color:#fff}
#prog{height:6px;background:var(--line);flex:none}#prog i{display:block;height:100%;width:0;background:var(--def);transition:width .25s}
#xp{font-weight:700;font-size:14px;color:var(--frm);display:none}
body.study #xp{display:inline}
#stage{flex:1;min-height:0;overflow:auto;display:flex;touch-action:pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.slide{margin:auto;width:100%;min-height:100%;display:grid;gap:10px;padding:10px 12px 14px;
  grid-template-columns:1fr;grid-template-areas:"head" "vis" "side";align-content:start}
.s-head{grid-area:head;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;border-left:8px solid var(--k);padding-left:10px}
.s-vis{grid-area:vis;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px;position:relative;min-width:0}
.s-vis svg{width:100%;height:auto;max-height:52vh;display:block;touch-action:pan-y pinch-zoom}
.s-side{grid-area:side;display:flex;flex-direction:column;gap:10px;min-width:0}
.kind-def{--k:var(--def);--kb:var(--def-bg)}.kind-law{--k:var(--law);--kb:var(--law-bg)}
.kind-formula{--k:var(--frm);--kb:var(--frm-bg)}.kind-warn{--k:var(--warn);--kb:var(--warn-bg)}.kind-tip{--k:var(--tip);--kb:var(--tip-bg)}
.kind-def .s-vis,.kind-law .s-vis,.kind-formula .s-vis,.kind-warn .s-vis,.kind-tip .s-vis{border-color:var(--k)}
.tag{font-size:14px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--kb);color:var(--k);border:1.5px solid var(--k);white-space:nowrap}
.tag.add{background:#fff6cf;color:#6a4b00;border-color:#d9a400}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tag.add{background:#3a3010;color:#ffd84a;border-color:#a98400}}
:root[data-theme=dark] .tag.add{background:#3a3010;color:#ffd84a;border-color:#a98400}
h2.term{margin:0;font-size:clamp(22px,5.4vw,30px);line-height:1.15}
.t .en{font-weight:700}.t .hi,.t .ml{display:block;font-size:14px;font-weight:400;color:var(--mut);line-height:1.25}
.t .hi,.t .ml{display:none}
h2.term .t .hi,h2.term .t .ml{display:none}
body[data-lang=hi] .t .hi,body[data-lang=all] .t .hi,body[data-lang=ml] .t .ml,body[data-lang=all] .t .ml{display:block}
body[data-lang=hi] h2.term .t .hi,body[data-lang=all] h2.term .t .hi,body[data-lang=ml] h2.term .t .ml,body[data-lang=all] h2.term .t .ml{display:inline;font-size:.7em;font-weight:400;color:var(--mut)}
h2.term .t .hi::before,h2.term .t .ml::before{content:' / ';color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--kb,var(--card));border:1.5px solid var(--k,var(--line));border-radius:10px;padding:6px 10px;font-size:16px;min-width:0}
.chip .sym{display:block;font-size:14px;color:var(--mut);font-weight:600}
.chip .sym sup,.chip .sym sub{font-size:inherit}
.hook{display:flex;gap:8px;align-items:center;font-weight:700;font-size:18px;background:var(--kb);border-radius:10px;padding:8px 10px;border:1.5px dashed var(--k)}
.hook small{font-size:14px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.beat{font-size:14px;font-weight:700;color:var(--mut);margin:0 0 4px}
.pred{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.pred .q{font-weight:700;font-size:18px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:48px;padding:6px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px;touch-action:manipulation;flex:1 1 auto;min-width:88px}

function wrapT(en,hi,ml){const sp=document.createElement('span');sp.className='t';sp.innerHTML=`<span class="en">${en}</span><span class="hi">${hi}</span><span class="ml">${ml}</span>`;return sp}
const SYM=new Set(['Vav','Vrms','Vpp','rms','sin','cos','tan','kWh','kVA','kVAR','kW','Vm','Em','rad','mm','kHz','MHz','Hz','mA','kΩ','MΩ','VAR','RMS','AC','DC','Wb']);
function needs(t){return (t.match(/[A-Za-z]{3,}/g)||[]).filter(w=>!SYM.has(w)).length>=1}
function autoT(root){if(!root)return;
 const els=[...root.querySelectorAll('*')];
 for(const e of els){if(!e.isConnected||e.closest('.t,svg,script,style,textarea'))continue;
  const kids=[...e.childNodes];if(!kids.length)continue;
  const simple=kids.every(n=>n.nodeType===3||(n.nodeType===1&&INL.has(n.tagName)&&[...n.querySelectorAll('*')].every(c=>INL.has(c.tagName))));
  if(simple){const txt=e.textContent;if(!norm(txt))continue;const r=xl(txt);
   if(r){const en=e.innerHTML;e.innerHTML='';e.appendChild(wrapT(en,r[0],r[1]));continue}
   if(needs(txt))MISS.add(norm(txt))
  }else{
   for(const n of kids){if(n.nodeType!==3)continue;const tx=n.textContent;if(!norm(tx))continue;const r=xl(tx);
    if(r){const sp=wrapT(tx.trim(),r[0],r[1]);n.replaceWith(document.createTextNode(' '),sp)}
    else if(needs(tx))MISS.add(norm(tx))}}}}
let xq=false;function xsched(){if(xq)return;xq=true;requestAnimationFrame(()=>{xq=false;autoT(document.getElementById('stage'))})}
function autoInit(){const st=document.getElementById('stage');if(!st||st.__xo)return;st.__xo=1;new MutationObserver(xsched).observe(st,{childList:true,subtree:true,characterData:true});xsched()}

/* ---- geometry helpers for flowing dots ---- */
function mkPath(pts){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,L,tot:L[L.length-1]}}
function at(P_,s){s=((s%1)+1)%1;const d=s*P_.tot;let i=1;while(i<P_.L.length-1&&P_.L[i]<d)i++;
  const a=P_.pts[i-1],b=P_.pts[i],k=(d-P_.L[i-1])/((P_.L[i]-P_.L[i-1])||1);return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]}

function slider(host,label,min,max,step,val,fmt,cb){
  const l=h('label'),id='s'+Math.random().toString(36).slice(2,7);
  l.innerHTML=`<span>${label} <span class="val"></span></span>`;
  const i=h('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=val;i.id=id;i.setAttribute('aria-label',label.replace(/<[^>]+>/g,''));
  const v=$('.val',l);const upd=()=>{v.textContent=fmt(+i.value)};
  i.addEventListener('input',()=>{upd();cb(+i.value)});upd();l.appendChild(i);host.appendChild(l);
  return{get:()=>+i.value,set:x=>{i.value=x;upd()},input:i}}

/* ---- constants and calculations (checked separately) ---- */
const RHO={cu:.0172,al:.0283,ag:.0159,fe:.1};          /* Ω·mm²/m at 20 °C */
const ALPHA=.0039;
const rhoAt=(r,t)=>r*(1+ALPHA*(t-20));
const SIZES=[1.5,2.5,4,6,10,16,25,35];
/* base current ratings, copper, PVC, 3 loaded conductors, ambient 30 °C (IEC 60364-5-52 style values) */
const BASE_AIR=[17.5,24,32,41,57,76,96,119];          /* clipped direct, method C */
const BASE_CON=[15.5,21,28,36,50,68,89,110];          /* in conduit on a wall, method B1 */
const GRP={1:1,2:.8,3:.7,4:.65,6:.57};
const TMAX={pvc:70,xlpe:90};
const fAmb=(ins,ta)=>Math.sqrt(Math.max(0,(TMAX[ins]-ta))/(TMAX[ins]-30));
const fIns=ins=>ins==='xlpe'?Math.sqrt(60/40):1;
const fMat=m=>m==='al'?Math.sqrt(RHO.cu/RHO.al):1;
function Iz(si,{ins='pvc',mat='cu',ta=30,g=1,lay='air'}={}){const b=(lay==='air'?BASE_AIR:BASE_CON)[si];return b*fIns(ins)*fMat(mat)*fAmb(ins,ta)*(GRP[g]||1)}
const RHOHOT=rhoAt(RHO.cu,70);
function vdrop(I,L,A,ph,rho){rho=rho||RHOHOT;return ph===3?Math.sqrt(3)*I*rho*L/A:I*2*rho*L/A}
const strandN=[1,7,19];
const STR={1:[1.38,1.78,2.26,2.76,3.57],7:[.53,.67,.85,1.04,1.35],19:[.32,.41,.52,.63,.82]};
const STA=[1.5,2.5,4,6,10];

const circ=(x,y,r,f,s,sw,extra)=>`<circle cx="${(+x).toFixed(1)}" cy="${(+y).toFixed(1)}" r="${(+r).toFixed(1)}" fill="${f}" stroke="${s||'none'}" stroke-width="${sw||0}" ${extra||''}/>`;
const hexPts=(r,n)=>{const P=[[0,0]];if(n>=7)for(let i=0;i<6;i++)P.push([2*r*Math.cos(i*Math.PI/3),2*r*Math.sin(i*Math.PI/3)]);
 if(n>=19)for(let i=0;i<6;i++){P.push([4*r*Math.cos(i*Math.PI/3),4*r*Math.sin(i*Math.PI/3)]);P.push([2*Math.sqrt(3)*r*Math.cos(i*Math.PI/3+Math.PI/6),2*Math.sqrt(3)*r*Math.sin(i*Math.PI/3+Math.PI/6)])}return P};
const strandsSVG=(cx,cy,R,n,f,s)=>{if(n===1)return circ(cx,cy,R,f||CL.cu,s||CL.cud,1.6);const r=n===7?R/3:R/5;
 return hexPts(r,n).map(p=>circ(cx+p[0],cy+p[1],r*.97,f||CL.cu,s||CL.cud,1.1)).join('')};

/* 3-core armoured cable cross-section, centre cx,cy, outer radius 108*s. layers: visibility object {sh,ar,be,in,co} (opacity 0..1) */
function cable3(cx,cy,s,v,o){v=Object.assign({sh:1,ar:1,be:1,ins:1,co:1},v||{});o=o||{};const g=[];
 const d=43.9*s,ro=38.05*s,rc=26*s,cols=[CL.red,CL.yel,CL.blu],ang=[-90,30,150];
 g.push(`<g id="L_be" opacity="${v.be}">${circ(cx,cy,88*s,CL.bed,'#6a6e52',1.4)}</g>`);
 g.push(`<g id="L_in" opacity="${v.ins}">${ang.map((a,i)=>circ(cx+d*Math.cos(a*Math.PI/180),cy+d*Math.sin(a*Math.PI/180),ro,cols[i],'#00000055',1.2)).join('')}</g>`);
 g.push(`<g id="L_co" opacity="${v.co}">${ang.map(a=>{const x=cx+d*Math.cos(a*Math.PI/180),y=cy+d*Math.sin(a*Math.PI/180);return circ(x,y,rc,CL.cud,'none',0)+strandsSVG(x,y,rc-1.2*s,7)}).join('')}</g>`);
 let aw='';for(let i=0;i<40;i++){const a=i/40*2*Math.PI;aw+=circ(cx+93.5*s*Math.cos(a),cy+93.5*s*Math.sin(a),5.6*s,CL.gi,CL.gid,1)}
 g.push(`<g id="L_ar" opacity="${v.ar}">${aw}</g>`);
 g.push(`<g id="L_sh" opacity="${v.sh}"><circle cx="${cx}" cy="${cy}" r="${103.5*s}" fill="none" stroke="${CL.blk}" stroke-width="${9*s}"/></g>`);
 return g.join('')}
/* generic round core in a cross-section: conductor strands + insulation ring */
const coreXS=(x,y,rc,ti,n,mat,insf)=>circ(x,y,rc+ti,insf||CL.pvc,'#00000055',1.2)+circ(x,y,rc,mat==='al'?CL.al:CL.cud,'none',0)+strandsSVG(x,y,rc*.95,n||7,mat==='al'?CL.al:CL.cu,mat==='al'?CL.ald:CL.cud);

 defn:L('<b>Armour</b> is a layer of steel wires or strips over the bedding. It protects against crushing and digging. The <b>outer sheath</b> keeps out water.','<b>आर्मर</b> बेडिंग के ऊपर स्टील वायर या स्ट्रिप की लेयर है। कुचलने और खुदाई से बचाता है। <b>आउटर शीथ</b> पानी रोकता है।','<b>ആർമർ</b> ബെഡ്ഡിംഗിന് മുകളിലെ സ്റ്റീൽ വയർ അല്ലെങ്കിൽ സ്ട്രിപ്പ് ലെയർ ആണ്. ഞെരുങ്ങലിൽ നിന്നും കുഴിക്കുമ്പോഴും സംരക്ഷിക്കുന്നു. <b>ഔട്ടർ ഷീത്ത്</b> വെള്ളം തടയുന്നു.'),
 real:`<svg viewBox="0 0 420 150" role="img" aria-label="Armoured cable end with the layers stripped back step by step" style="font-family:inherit">
  <rect x="20" y="52" width="76" height="46" fill="#2b2f36"/><rect x="96" y="56" width="60" height="38" fill="${CL.gi}" stroke="${CL.gid}" stroke-width="2"/><path d="M104 56V94M114 56V94M124 56V94M134 56V94M144 56V94" stroke="${CL.gid}" stroke-width="2"/><rect x="156" y="60" width="50" height="30" fill="${CL.bed}"/><rect x="206" y="64" width="50" height="9" fill="${CL.red}"/><rect x="206" y="76" width="50" height="9" fill="${CL.yel}"/><rect x="256" y="64" width="22" height="9" fill="${CL.cu}"/><rect x="256" y="76" width="22" height="9" fill="${CL.cu}"/><rect x="206" y="88" width="50" height="6" fill="${CL.blu}"/><rect x="256" y="89" width="22" height="4" fill="${CL.cu}"/>

 labels:['armour','bedding','sheath','core'],hints:['sp','jt'],
 note:L('Single-core AC cables use aluminium armour, not steel, to avoid extra heating.','सिंगल-कोर AC केबल में स्टील नहीं, एल्यूमिनियम आर्मर होता है, एक्स्ट्रा हीटिंग से बचने के लिए।','സിംഗിൾ-കോർ AC കേബിളിൽ സ്റ്റീൽ അല്ല, അലുമിനിയം ആർമർ ആണ്, എക്സ്ട്രാ ഹീറ്റിംഗ് ഒഴിവാക്കാൻ.'),
 ex:L('Armour is earthed through the gland. It also gives a path for earth-fault current.','आर्मर ग्लैंड से अर्थ होता है। अर्थ-फॉल्ट करंट को पाथ भी देता है।','ആർമർ ഗ്ലാൻഡ് വഴി എർത്ത് ചെയ്യുന്നു. എർത്ത്-ഫോൾട്ട് കറന്റിന് പാത്തും നൽകുന്നു.'),
 trick:L('In: conductor. Out: sheath. Armour sits under the sheath.','अंदर: कंडक्टर। बाहर: शीथ। आर्मर शीथ के नीचे।','ഉള്ളിൽ: കണ്ടക്ടർ. പുറത്ത്: ഷീത്ത്. ആർമർ ഷീത്തിന് താഴെ.'),
 check:{q:L('Insulation limit for PVC is 70 °C. A cable with PVC insulation carries too much current. First it …','PVC इंसुलेशन की लिमिट 70 °C है। PVC केबल पर ज़्यादा करंट आया। सबसे पहले …','PVC ഇൻസുലേഷൻ ലിമിറ്റ് 70 °C ആണ്. PVC കേബിളിൽ കൂടുതൽ കറന്റ് വന്നു. ആദ്യം …'),o:[L('Gets hot (I² × R)','गर्म होती है (I² × R)','ചൂടാകും (I² × R)'),L('Gets thicker','मोटी हो जाती है','കട്ടി കൂടും')],a:0},

   let g='';

   put($('#hz',w),g);

SL.push({id:'a_vd',syl:'M2A',menu:'Voltage drop in cables',kind:'formula',title:'vdrop',hk:'sp',

 hook:L('The pump is 90 m from the board. It hums and will not start. The supply is fine.','पंप बोर्ड से 90 m दूर है। गुनगुनाता है, स्टार्ट नहीं होता। सप्लाई ठीक है।','പമ്പ് ബോർഡിൽ നിന്ന് 90 m അകലെ. മൂളുന്നു, സ്റ്റാർട്ട് ആകുന്നില്ല. സപ്ലൈ ശരിയാണ്.'),

 pred:{q:L('Cable length doubles, same size and current. Voltage drop …','केबल की लंबाई डबल, साइज़ और करंट वही। वोल्टेज ड्रॉप …','കേബിൾ ലെങ്ത് ഇരട്ടി, സൈസും കറന്റും അതേ. വോൾട്ടേജ് ഡ്രോപ്പ് …'),o:[L('Doubles','डबल होता है','ഇരട്ടിയാകും'),L('Halves','आधा होता है','പകുതിയാകും'),L('Stays the same','वही रहता है','മാറുന്നില്ല')],a:0,why:L('R is proportional to length, so the drop doubles.','R लंबाई के अनुपात में है, इसलिए ड्रॉप डबल।','R ലെങ്ത്തിന് ആനുപാതികം, അതിനാൽ ഡ്രോപ്പ് ഇരട്ടി.')},
 labels:['vdrop','csize'],hints:['vir','rrho'],rel:{c:['I','R','ρ','L','A','V<sub>drop</sub>'],h:'V<sub>drop</sub>'},
 fm:['1-ph: <i>V<sub>d</sub></i> = <i>I</i> × 2<i>ρL</i> ÷ <i>A</i>','3-ph: <i>V<sub>d</sub></i> = √3 × <i>I</i> × <i>ρL</i> ÷ <i>A</i>'],
 uses:L('V = I × R (slide 2), R = ρL ÷ A (slide 4). Resistance only, at 70 °C: ρ ≈ 0.0206 Ω·mm²/m. Reactance is ignored, so use this for small cables. The 3 % limit is a common design figure. Verify the limit in IS 732 and the rules of the supply authority.','V = I × R (स्लाइड 2), R = ρL ÷ A (स्लाइड 4)। सिर्फ रेसिस्टेंस, 70 °C पर: ρ ≈ 0.0206 Ω·mm²/m। रिएक्टेंस नहीं गिना, इसलिए छोटी केबल के लिए इस्तेमाल करो। 3 % लिमिट आम डिज़ाइन वैल्यू है। IS 732 और सप्लाई अथॉरिटी के रूल से वेरिफाई करो।','V = I × R (സ്ലൈഡ് 2), R = ρL ÷ A (സ്ലൈഡ് 4). റെസിസ്റ്റൻസ് മാത്രം, 70 °C-ൽ: ρ ≈ 0.0206 Ω·mm²/m. റിയാക്ടൻസ് ഒഴിവാക്കി, അതിനാൽ ചെറിയ കേബിളിന് ഉപയോഗിക്കൂ. 3 % ലിമിറ്റ് സാധാരണ ഡിസൈൻ വിലയാണ്. IS 732, സപ്ലൈ അതോറിറ്റി റൂൾ എന്നിവയിൽ വെരിഫൈ ചെയ്യൂ.'),
 ex:L('1-ph, 20 A, 40 m, 4 mm²: V<sub>d</sub> = 20 × 2 × 0.0206 × 40 ÷ 4 = 8.2 V = 3.6 % of 230 V. Too high. Use 6 mm².','1-फेज़, 20 A, 40 m, 4 mm²: V<sub>d</sub> = 20 × 2 × 0.0206 × 40 ÷ 4 = 8.2 V = 230 V का 3.6 %। ज़्यादा है। 6 mm² लो।','1-ഫേസ്, 20 A, 40 m, 4 mm²: V<sub>d</sub> = 20 × 2 × 0.0206 × 40 ÷ 4 = 8.2 V = 230 V-ന്റെ 3.6 %. കൂടുതലാണ്. 6 mm² എടുക്കൂ.'),

 hook:L('A new aluminium cable is on the busbar. A week later the lug is black and hot.','बसबार पर नई एल्यूमिनियम केबल। एक हफ्ते बाद लग काला और गर्म।','ബസ്ബാറിൽ പുതിയ അലുമിനിയം കേബിൾ. ഒരാഴ്ച കഴിഞ്ഞ് ലഗ് കറുത്ത് ചൂടായി.'),
 defn:L('<b>Termination</b> joins a cable end to a device with a lug. A <b>joint</b> joins two cables. Both must have very low contact resistance.','<b>टर्मिनेशन</b> लग से केबल एंड को डिवाइस से जोड़ता है। <b>जॉइंट</b> दो केबल जोड़ता है। दोनों में कॉन्टैक्ट रेसिस्टेंस बहुत कम होना चाहिए।','<b>ടെർമിനേഷൻ</b> ലഗ് ഉപയോഗിച്ച് കേബിൾ എൻഡ് ഡിവൈസിൽ ചേർക്കുന്നു. <b>ജോയിന്റ്</b> രണ്ട് കേബിളുകൾ ചേർക്കുന്നു. രണ്ടിനും കോൺടാക്റ്റ് റെസിസ്റ്റൻസ് വളരെ കുറവായിരിക്കണം.'),

  ${lead(125,26,125,52)}${TT(125,20,'Cu lug','Cu लग','Cu ലഗ്','m','style="font-size:20px"')}${lead(333,26,333,52)}${TT(333,20,'Al side','Al साइड','Al വശം','m','style="font-size:20px"')}${lead(378,126,378,96)}${TT(378,144,'Cu palm','Cu पाम','Cu പാം','m','style="font-size:20px"')}${TT(280,120,'Bimetallic lug','बाइमेटैलिक लग','ബൈമെറ്റാലിക് ലഗ്','m','style="font-size:19px"')}</svg>`,
 play:L('Pick Cu or Al. Tap the steps in the right order.','Cu या Al चुनो। स्टेप सही क्रम में टैप करो।','Cu അല്ലെങ്കിൽ Al തിരഞ്ഞെടുക്കൂ. സ്റ്റെപ്പുകൾ ശരിയായ ക്രമത്തിൽ ടാപ്പ് ചെയ്യൂ.'),
 pred:{q:L('Why does aluminium need a bimetallic lug on a copper busbar?','कॉपर बसबार पर एल्यूमिनियम को बाइमेटैलिक लग क्यों चाहिए?','കോപ്പർ ബസ്ബാറിൽ അലുമിനിയത്തിന് ബൈമെറ്റാലിക് ലഗ് എന്തിന്?'),o:[L('Al and Cu in contact corrode in moisture','Al और Cu का कॉन्टैक्ट नमी में कोरोड होता है','Al, Cu നേരിട്ട് തൊട്ടാൽ ഈർപ്പത്തിൽ കോറോഡ് ചെയ്യും'),L('It looks neat','अच्छा दिखता है','ഭംഗിക്ക്')],a:0,why:L('Two different metals corrode where they touch. The bimetallic lug is Al on one side, Cu on the other.','दो अलग मेटल जहाँ छूते हैं वहाँ कोरोड होते हैं। बाइमेटैलिक लग एक तरफ Al, दूसरी तरफ Cu होता है।','രണ്ട് വ്യത്യസ്ത മെറ്റൽ തൊടുന്നിടത്ത് കോറോഡ് ചെയ്യും. ബൈമെറ്റാലിക് ലഗ്ഗിൽ ഒരു വശം Al, മറുവശം Cu.')},
 labels:['lug','bimetal','inhib'],hints:['vir','jt'],
 note:L('Joints in armoured cable need a proper joint kit. Never twist and tape. Terminate in a gland that also earths the armour.','आर्मर्ड केबल के जॉइंट के लिए सही जॉइंट किट चाहिए। कभी ट्विस्ट करके टेप मत करो। ग्लैंड में टर्मिनेट करो जो आर्मर को अर्थ भी करे।','ആർമേഡ് കേബിൾ ജോയിന്റിന് ശരിയായ ജോയിന്റ് കിറ്റ് വേണം. ഒരിക്കലും പിരിച്ച് ടേപ്പ് ചുറ്റരുത്. ആർമർ എർത്ത് ചെയ്യുന്ന ഗ്ലാൻഡിൽ ടെർമിനേറ്റ് ചെയ്യൂ.'),
 ex:L('Joint 5 mΩ at 40 A: V = I × R = 0.2 V and P = I² × R = 8 W. A bad joint of 50 mΩ gives 80 W: it burns.','जॉइंट 5 mΩ, 40 A पर: V = I × R = 0.2 V और P = I² × R = 8 W। खराब जॉइंट 50 mΩ: 80 W, जल जाता है।','ജോയിന്റ് 5 mΩ, 40 A-ൽ: V = I × R = 0.2 V, P = I² × R = 8 W. മോശം ജോയിന്റ് 50 mΩ: 80 W, കത്തും.'),
 trick:L('Strip, clean, compound, crimp, tug, torque.','स्ट्रिप, क्लीन, कंपाउंड, क्रिम्प, टग, टॉर्क।','സ്ട്രിപ്പ്, ക്ലീൻ, കമ്പൗണ്ട്, ക്രിമ്പ്, ടഗ്, ടോർക്ക്.'),
 check:{q:L('A joint has 20 mΩ and carries 30 A. Heat in the joint, P = I² × R = ?','जॉइंट 20 mΩ है और 30 A ले जाता है। जॉइंट में हीट, P = I² × R = ?','ജോയിന്റ് 20 mΩ, 30 A കൊണ്ടുപോകുന്നു. ജോയിന്റിലെ ഹീറ്റ്, P = I² × R = ?'),o:['18 W','0.6 W','600 W'],a:0},
 build(w,api){
  w.innerHTML=S(420,150,`<g id="pic"></g>`,'Lug and cable end being prepared step by step');
  const rd=h('div','rd');w.appendChild(rd);const c=h('div','ctl');w.appendChild(c);let al=0,n=0,msg='';
  const mb=h('div','chips');c.appendChild(mb);const mbs=['Cu','Al'].map((x,k)=>button(mb,x+' cable',()=>{al=k;n=0;msg='';mbs.forEach((b,j)=>b.classList.toggle('on',j===k));mk();api.redraw()},k?'':'on'));
  const sb=h('div','chips');c.appendChild(sb);let bs=[];
  const mk=()=>{sb.innerHTML='';const idx=[0,5,3,2,1,4];idx.forEach(i=>{const b=button(sb,L(JSH[i][0],JSH[i][1],JSH[i][2]),()=>{const ord=JORD[al];if(ord[n]===i){n++;msg='';award(4,'js'+al+i,P.chk);b.disabled=true;b.classList.add('on')}else{msg=ord.includes(i)?'order':'skip';msg+=i}api.redraw()});bs.push(b)})};mk();
  api.setReplay(()=>{n=0;msg='';mk();api.redraw()});
  return()=>{const ord=JORD[al],done=n>=ord.length;
   const bar=Math.min(n,ord.length)/ord.length;
   const al_=al?CL.al:CL.cu,ald=al?CL.ald:CL.cud;
   put($('#pic',w),`<g transform="translate(0,-34)"><rect x="20" y="84" width="${n>=1?80:130}" height="32" rx="4" fill="#2b2f36"/><rect x="${n>=1?100:150}" y="88" width="${n>=1?100:0}" height="24" fill="${al_}" stroke="${ald}" stroke-width="1.5"/>`+(n>=2&&al?`<rect x="104" y="86" width="96" height="28" rx="6" fill="#d8d4c2" opacity=".85"/>`:'')+(n>=3?`<rect x="150" y="72" width="94" height="56" rx="8" fill="${al?'url(#bm)':CL.cu}" stroke="${CL.cud}" stroke-width="2.5"/><circle cx="276" cy="100" r="9" fill="var(--bg)" stroke="${CL.cud}" stroke-width="2.5"/>`:'')+(n>=4?`<path d="M168 72V128M190 72V128M212 72V128" stroke="var(--no)" stroke-width="5"/>`:'')+(n>=5?`<path d="M300 100H400M392 90l10 10l-10 10" stroke="var(--ok)" stroke-width="5" fill="none"/>${TT(350,84,'Tug','टग','ടഗ്','m')}`:'')+`</g><defs><linearGradient id="bm" x1="0" x2="1"><stop offset=".5" stop-color="${CL.al}"/><stop offset=".5" stop-color="${CL.cu}"/></linearGradient></defs>`+`<rect x="20" y="136" width="380" height="10" rx="5" fill="var(--line)"/><rect x="20" y="136" width="${(380*bar).toFixed(0)}" height="10" rx="5" fill="var(--ok)"/>`);
   let m;if(msg.startsWith('skip'))m=`<span style="color:var(--no)">${ICO.no} ${RD('Not for this cable. Hint:','इस केबल के लिए नहीं। हिंट:','ഈ കേബിളിന് വേണ്ട. സൂചന:')} ${BI(JST[ord[n]].h[0],JST[ord[n]].h[1],JST[ord[n]].h[2])}</span>`;
   else if(msg.startsWith('order'))m=`<span style="color:var(--no)">${ICO.no} ${RD('Wrong order. Hint:','क्रम गलत। हिंट:','ക്രമം തെറ്റി. സൂചന:')} ${BI(JST[ord[n]].h[0],JST[ord[n]].h[1],JST[ord[n]].h[2])}</span>`;
   else if(done)m=`<span style="color:var(--ok)">${ICO.ok} ${RD('Termination done.','टर्मिनेशन पूरा।','ടെർമിനേഷൻ പൂർത്തിയായി.')}${al?' '+RD('Al: compound and bimetallic lug used.','Al: कंपाउंड और बाइमेटैलिक लग इस्तेमाल हुए।','Al: കമ്പൗണ്ടും ബൈമെറ്റാലിക് ലഗ്ഗും ഉപയോഗിച്ചു.'):''}</span>`;
   else m=`<span>${RD('Steps','स्टेप','സ്റ്റെപ്പ്')} <b>${n} / ${ord.length}</b></span>`+(al?`<span class="note" style="margin:0">${RD('Al needs compound and a bimetallic lug.','Al को कंपाउंड और बाइमेटैलिक लग चाहिए।','Al-ന് കമ്പൗണ്ടും ബൈമെറ്റാലിക് ലഗ്ഗും വേണം.')}</span>`:'');
   setRd(rd,m)}}});

const JTS=[
 {n:['Good joint','अच्छा जॉइंट','നല്ല ജോയിന്റ്'],mo:.004,ir:800,dr:.08,why:['Low contact resistance, high insulation resistance. The joint is good.','कॉन्टैक्ट रेसिस्टेंस कम, इंसुलेशन रेसिस्टेंस ज़्यादा। जॉइंट अच्छा है।','കോൺടാക്റ്റ് റെസിസ്റ്റൻസ് കുറവ്, ഇൻസുലേഷൻ റെസിസ്റ്റൻസ് കൂടുതൽ. ജോയിന്റ് നല്ലത്.']},
 {n:['Loose crimp','ढीला क्रिम्प','ലൂസ് ക്രിമ്പ്'],mo:.06,ir:800,dr:1.2,why:['The drop at 20 A is large. High contact resistance: remake the crimp.','20 A पर ड्रॉप ज़्यादा। कॉन्टैक्ट रेसिस्टेंस ज़्यादा: क्रिम्प दोबारा करो।','20 A-ൽ ഡ്രോപ്പ് വലുത്. കോൺടാക്റ്റ് റെസിസ്റ്റൻസ് കൂടുതൽ: ക്രിമ്പ് വീണ്ടും ചെയ്യൂ.']},
 {n:['Al–Cu corroded','Al–Cu कोरोडेड','Al–Cu കോറോഡ് ആയത്'],mo:.03,ir:600,dr:.6,why:['Resistance has grown over time from corrosion. Cut back, clean, use compound and a bimetallic lug.','कोरोज़न से रेसिस्टेंस समय के साथ बढ़ा। काटकर साफ करो, कंपाउंड और बाइमेटैलिक लग लगाओ।','കോറോഷൻ കൊണ്ട് റെസിസ്റ്റൻസ് കാലക്രമേണ കൂടി. മുറിച്ച് വൃത്തിയാക്കി കമ്പൗണ്ടും ബൈമെറ്റാലിക് ലഗ്ഗും ഉപയോഗിക്കൂ.']},
 {n:['Wet insulation','गीला इंसुलेशन','ഈർപ്പമുള്ള ഇൻസുലേഷൻ'],mo:.004,ir:.4,dr:.08,why:['Continuity is fine, but the megger reads very low. Moisture is in the insulation: dry or replace.','कंटिन्यूइटी ठीक है, पर मेगर बहुत कम पढ़ता है। इंसुलेशन में नमी है: सुखाओ या बदलो।','കണ്ടിന്യൂവിറ്റി ശരിയാണ്, പക്ഷേ മെഗർ വളരെ കുറവ് കാണിക്കുന്നു. ഇൻസുലേഷനിൽ ഈർപ്പം: ഉണക്കുകയോ മാറ്റുകയോ ചെയ്യൂ.']}];
SL.push({id:'a_test',syl:'M2A',menu:'Testing cables and joints',kind:'tip',title:'jtest',hk:'sp',
 flash:L('Megger and insulation (slide 7)','मेगर और इंसुलेशन (स्लाइड 7)','മെഗറും ഇൻസുലേഷനും (സ്ലൈഡ് 7)'),
 hook:L('Four cable joints look the same. Only tests tell which one is bad.','चार केबल जॉइंट एक जैसे दिखते हैं। सिर्फ टेस्ट बताते हैं कि कौन खराब है।','നാല് കേബിൾ ജോയിന്റ് ഒരുപോലെ തോന്നും. ടെസ്റ്റ് മാത്രമേ ഏതാണ് മോശം എന്ന് പറയൂ.'),
 defn:L('<b>Testing</b> a cable: continuity (is the path whole?), voltage drop across the joint at load, and insulation resistance with a megger.','<b>टेस्टिंग</b>: कंटिन्यूइटी (रास्ता पूरा है?), लोड पर जॉइंट के आर-पार वोल्टेज ड्रॉप, और मेगर से इंसुलेशन रेसिस्टेंस।','<b>ടെസ്റ്റിംഗ്</b>: കണ്ടിന്യൂവിറ്റി (വഴി പൂർണ്ണമാണോ?), ലോഡിൽ ജോയിന്റിന് കുറുകെ വോൾട്ടേജ് ഡ്രോപ്പ്, മെഗർ ഉപയോഗിച്ച് ഇൻസുലേഷൻ റെസിസ്റ്റൻസ്.'),
 real:`<svg viewBox="0 0 420 150" role="img" aria-label="A megger connected between a cable conductor and its armour" style="font-family:inherit">

 play:L('Pick a joint. Run three tests.','जॉइंट चुनो। तीन टेस्ट चलाओ।','ജോയിന്റ് തിരഞ്ഞെടുക്കൂ. മൂന്ന് ടെസ്റ്റ് ചെയ്യൂ.'),

   {q:L('A 25 mm² copper cable has R = 0.8 Ω. The same length in 50 mm² copper has R = ?','25 mm² कॉपर केबल का R = 0.8 Ω। उतनी ही लंबाई 50 mm² कॉपर में R = ?','25 mm² കോപ്പർ കേബിളിന്റെ R = 0.8 Ω. അതേ ലെങ്ത് 50 mm² കോപ്പറിൽ R = ?'),o:['0.4 Ω','1.6 Ω','0.8 Ω','0.2 Ω'],a:0,why:L('R is inversely proportional to area. Double area, half R.','R एरिया के उल्टे अनुपात में है। एरिया डबल, R आधा।','R ഏരിയയ്ക്ക് വിപരീതാനുപാതത്തിൽ. ഏരിയ ഇരട്ടി, R പകുതി.')},

  tests:[[['Look at the lug','लग देखो','ലഗ് നോക്കൂ'],['White powder, black stain','सफेद पाउडर, काला दाग','വെളുത്ത പൊടി, കറുത്ത പാട്'] ],[['Voltage across the lug at 40 A','40 A पर लग पर वोल्टेज','40 A-ൽ ലഗ്ഗിൽ വോൾട്ടേജ്'],'1.5 V'],[['Check the lug type','लग टाइप चेक करो','ലഗ് ടൈപ്പ് ചെക്ക് ചെയ്യൂ'],['Plain Cu lug on an Al conductor','Al कंडक्टर पर सादा Cu लग','Al കണ്ടക്ടറിൽ സാധാരണ Cu ലഗ്']]],
  o:[['Al–Cu corrosion: use a bimetallic lug and compound','Al–Cu कोरोज़न: बाइमेटैलिक लग और कंपाउंड लगाओ','Al–Cu കോറോഷൻ: ബൈമെറ്റാലിക് ലഗും കമ്പൗണ്ടും ഉപയോഗിക്കൂ'],['The cable is too long','केबल बहुत लंबी है','കേബിൾ വളരെ നീളമുള്ളതാണ്'],['The insulation is wet','इंसुलेशन गीला है','ഇൻസുലേഷൻ നനഞ്ഞതാണ്']],a:0,

   const os=h('div','opts');dg.appendChild(os);const fb=h('div','fb');fb.setAttribute('aria-live','polite');dg.appendChild(fb);const nx=h('div');dg.appendChild(nx);

   fin.appendChild(h('div','trick',`<small>${term('rem')}</small>${B3(['Measure first. Then decide.','पहले मापो। फिर फैसला करो।','ആദ്യം അളക്കൂ. പിന്നെ തീരുമാനിക്കൂ.'])}`));
   fin.appendChild(checkBlock(SL.find(x=>x.id==='a_fault')));

SL.push({id:'a_viva',menu:'Viva flip-cards',kind:'def',title:'viva',wide:true,page(w,s,api){

  flipDeck(w,api,[
   {name:L('L1 Fact','L1 फैक्ट','L1 ഫാക്ട്'),cards:[
    C(['What is a conductor, and what is a cable?','कंडक्टर क्या है और केबल क्या है?','കണ്ടക്ടർ എന്താണ്, കേബിൾ എന്താണ്?'],['The conductor is the metal that carries current. A cable is conductor plus insulation and protective layers.','कंडक्टर वह मेटल है जो करंट ले जाता है। केबल = कंडक्टर + इंसुलेशन + प्रोटेक्टिव लेयर।','കണ്ടക്ടർ കറന്റ് കൊണ്ടുപോകുന്ന മെറ്റൽ. കേബിൾ = കണ്ടക്ടർ + ഇൻസുലേഷൻ + സംരക്ഷണ ലെയറുകൾ.']),
    C(['Name the layers of an armoured cable from inside out.','आर्मर्ड केबल की लेयर अंदर से बाहर बताओ।','ആർമേഡ് കേബിളിന്റെ ലെയറുകൾ ഉള്ളിൽ നിന്ന് പുറത്തേക്ക് പറയൂ.'],['Conductor, insulation, bedding, armour, outer sheath.','कंडक्टर, इंसुलेशन, बेडिंग, आर्मर, आउटर शीथ।','കണ്ടക്ടർ, ഇൻസുലേഷൻ, ബെഡ്ഡിംഗ്, ആർമർ, ഔട്ടർ ഷീത്ത്.']),
    C(['What are the maximum conductor temperatures of PVC and XLPE?','PVC और XLPE का मैक्स कंडक्टर टेम्परेचर?','PVC, XLPE എന്നിവയുടെ മാക്സ് കണ്ടക്ടർ ടെമ്പറേച്ചർ?'],['PVC 70 °C, XLPE 90 °C in normal use.','नॉर्मल यूज़ में PVC 70 °C, XLPE 90 °C।','സാധാരണ ഉപയോഗത്തിൽ PVC 70 °C, XLPE 90 °C.']),
    C(['Give the usual colours of the three phases, neutral and earth.','तीन फेज़, न्यूट्रल और अर्थ के आम कलर बताओ।','മൂന്ന് ഫേസ്, ന്യൂട്രൽ, എർത്ത് എന്നിവയുടെ സാധാരണ കളർ പറയൂ.'],['Red, yellow, blue phases. Black neutral. Green or green-yellow earth. Read the label on newer cables.','लाल, पीला, नीला फेज़। काला न्यूट्रल। ग्रीन या ग्रीन-येलो अर्थ। नई केबल पर लेबल पढ़ो।','ചുവപ്പ്, മഞ്ഞ, നീല ഫേസ്. കറുപ്പ് ന്യൂട്രൽ. പച്ച അല്ലെങ്കിൽ ഗ്രീൻ-യെല്ലോ എർത്ത്. പുതിയ കേബിളിൽ ലേബൽ വായിക്കൂ.'])]},
   {name:L('L2 Why / How','L2 क्यों / कैसे','L2 എന്തുകൊണ്ട് / എങ്ങനെ'),cards:[
    C(['Why is a flexible cord stranded?','फ्लेक्सिबल कॉर्ड स्ट्रैंडेड क्यों होती है?','ഫ്ലെക്സിബിൾ കോർഡ് സ്ട്രാൻഡഡ് ആകുന്നത് എന്തുകൊണ്ട്?'],['Many thin strands bend easily and do not break. A solid wire fatigues and snaps.','कई पतले स्ट्रैंड आसानी से मुड़ते हैं, टूटते नहीं। सॉलिड वायर थककर टूट जाता है।','പല നേർത്ത സ്ട്രാൻഡ് എളുപ്പം വളയും, പൊട്ടില്ല. സോളിഡ് വയർ ക്ഷീണിച്ച് പൊട്ടും.']),
    C(['Why does a longer cable need a bigger size?','लंबी केबल को बड़ा साइज़ क्यों चाहिए?','നീളമുള്ള കേബിളിന് വലിയ സൈസ് എന്തിന്?'],['Voltage drop = I × 2ρL ÷ A. Longer L raises the drop. A bigger A brings it back under 3 %.','वोल्टेज ड्रॉप = I × 2ρL ÷ A। L बढ़ने से ड्रॉप बढ़ता है। बड़ा A उसे 3 % के नीचे लाता है।','വോൾട്ടേജ് ഡ്രോപ്പ് = I × 2ρL ÷ A. L കൂടിയാൽ ഡ്രോപ്പ് കൂടും. വലിയ A അത് 3 %-ന് താഴെ കൊണ്ടുവരും.']),
    C(['Why do bunched cables carry less current?','बंडल केबल कम करंट क्यों ले जाती हैं?','കെട്ടായ കേബിളുകൾ കുറഞ്ഞ കറന്റ് കൊണ്ടുപോകുന്നത് എന്തുകൊണ്ട്?'],['They heat each other and cannot shed heat. The grouping factor lowers the safe current.','वे एक-दूसरे को गर्म करती हैं और हीट नहीं छोड़ पातीं। ग्रुपिंग फैक्टर सेफ करंट घटाता है।','അവ പരസ്പരം ചൂടാക്കുന്നു, ചൂട് പുറത്തുവിടാൻ കഴിയില്ല. ഗ്രൂപ്പിംഗ് ഫാക്ടർ സേഫ് കറന്റ് കുറയ്ക്കുന്നു.']),
    C(['Why does aluminium need a bimetallic lug on copper?','कॉपर पर एल्यूमिनियम को बाइमेटैलिक लग क्यों चाहिए?','കോപ്പറിൽ അലുമിനിയത്തിന് ബൈമെറ്റാലിക് ലഗ് എന്തിന്?'],['Direct Al–Cu contact corrodes in moisture and gets hot. The lug puts Al to Al and Cu to Cu.','Al–Cu का सीधा कॉन्टैक्ट नमी में कोरोड होकर गर्म होता है। लग में Al से Al और Cu से Cu जुड़ता है।','Al–Cu നേരിട്ട് തൊട്ടാൽ ഈർപ്പത്തിൽ കോറോഡ് ചെയ്ത് ചൂടാകും. ലഗ്ഗിൽ Al-ന് Al, Cu-വിന് Cu.'])]},
   {name:L('L3 Workshop','L3 वर्कशॉप','L3 വർക്ക്ഷോപ്പ്'),cards:[
    C(['A cable is warm all along its length. What do you check?','केबल पूरी लंबाई में गर्म है। क्या चेक करोगे?','കേബിൾ മുഴുവൻ ചൂടാണ്. എന്ത് ചെക്ക് ചെയ്യും?'],['Load current against I<sub>z</sub>, bunching, ambient temperature, and the cable size.','लोड करंट और I<sub>z</sub>, बंडलिंग, आसपास का टेम्परेचर और केबल साइज़।','ലോഡ് കറന്റും I<sub>z</sub>-ഉം, കെട്ട്, ചുറ്റുമുള്ള ടെമ്പറേച്ചർ, കേബിൾ സൈസ്.']),
    C(['A motor far from the panel will not start. What do you check?','पैनल से दूर मोटर स्टार्ट नहीं होती। क्या चेक करोगे?','പാനലിൽ നിന്ന് അകലെയുള്ള മോട്ടോർ സ്റ്റാർട്ട് ആകുന്നില്ല. എന്ത് ചെക്ക് ചെയ്യും?'],['Voltage at the motor terminals while starting. Compare it with the panel. A large gap means a voltage-drop problem.','स्टार्ट के समय मोटर टर्मिनल पर वोल्टेज। पैनल से तुलना करो। बड़ा अंतर मतलब वोल्टेज ड्रॉप की समस्या।','സ്റ്റാർട്ട് ചെയ്യുമ്പോൾ മോട്ടോർ ടെർമിനലിലെ വോൾട്ടേജ്. പാനലുമായി താരതമ്യം ചെയ്യൂ. വലിയ വ്യത്യാസം വോൾട്ടേജ് ഡ്രോപ്പ് പ്രശ്നമാണ്.']),
    C(['A cable end looks fine but the RCCB trips. What do you test?','केबल एंड ठीक दिखता है पर RCCB ट्रिप होता है। क्या टेस्ट करोगे?','കേബിൾ എൻഡ് ശരിയായി തോന്നുന്നു, പക്ഷേ RCCB ട്രിപ്പ് ആകുന്നു. എന്ത് ടെസ്റ്റ് ചെയ്യും?'],['Switch off and isolate. Megger each core to earth. A low reading means wet or damaged insulation.','स्विच ऑफ और आइसोलेट करो। हर कोर से अर्थ तक मेगर करो। कम रीडिंग मतलब गीला या डैमेज इंसुलेशन।','സ്വിച്ച് ഓഫ് ചെയ്ത് ഐസൊലേറ്റ് ചെയ്യൂ. ഓരോ കോറും എർത്തിലേക്ക് മെഗർ ചെയ്യൂ. കുറഞ്ഞ റീഡിംഗ് എന്നാൽ ഈർപ്പമുള്ളതോ കേടായതോ ആയ ഇൻസുലേഷൻ.']),
    C(['A lug is black and hot after a week. What went wrong?','लग एक हफ्ते बाद काला और गर्म है। क्या गलत हुआ?','ഒരാഴ്ച കഴിഞ്ഞ് ലഗ് കറുത്ത് ചൂടായി. എന്താണ് തെറ്റിയത്?'],['A loose crimp or Al–Cu corrosion raised the contact resistance. Re-make it with the right lug, compound and a tug test.','ढीला क्रिम्प या Al–Cu कोरोज़न से कॉन्टैक्ट रेसिस्टेंस बढ़ा। सही लग, कंपाउंड और टग टेस्ट से दोबारा बनाओ।','ലൂസ് ക്രിമ്പോ Al–Cu കോറോഷനോ കോൺടാക്ട് റെസിസ്റ്റൻസ് കൂട്ടി. ശരിയായ ലഗ്, കമ്പൗണ്ട്, ടഗ് ടെസ്റ്റ് എന്നിവയോടെ വീണ്ടും ചെയ്യൂ.'])]}],'m2aviva')}});

/* ---------- 27 Interview ---------- */
SL.push({id:'a_intv',menu:'Interview cards',kind:'law',title:'interview',wide:true,page(w,s,api){
  const C=(q,a)=>[L(q[0],q[1],q[2]),L(a[0],a[1],a[2])];
  flipDeck(w,api,[{name:L('Interview','इंटरव्यू','ഇന്റർവ്യൂ'),cards:[
   C(['How do you choose a cable for a new load?','नए लोड के लिए केबल कैसे चुनते हो?','പുതിയ ലോഡിന് കേബിൾ എങ്ങനെ തിരഞ്ഞെടുക്കും?'],['Find the load current. Apply derating for temperature, grouping and laying. Check the voltage drop is within 3 %. Pick the smallest size that passes both. Then match the protection.','लोड करंट निकालो। टेम्परेचर, ग्रुपिंग और बिछाने के हिसाब से डिरेटिंग लगाओ। वोल्टेज ड्रॉप 3 % के अंदर देखो। दोनों पास करने वाला सबसे छोटा साइज़ लो। फिर प्रोटेक्शन मिलाओ।','ലോഡ് കറന്റ് കണ്ടെത്തൂ. ടെമ്പറേച്ചർ, ഗ്രൂപ്പിംഗ്, ലേയിംഗ് എന്നിവയ്ക്ക് ഡീറേറ്റിംഗ് ചെയ്യൂ. വോൾട്ടേജ് ഡ്രോപ്പ് 3 %-ന് ഉള്ളിലാണെന്ന് നോക്കൂ. രണ്ടും പാസാകുന്ന ഏറ്റവും ചെറിയ സൈസ് എടുക്കൂ. പിന്നെ പ്രൊട്ടക്ഷൻ ചേർക്കൂ.']),
   C(['Copper or aluminium for a large feeder?','बड़े फीडर के लिए कॉपर या एल्यूमिनियम?','വലിയ ഫീഡറിന് കോപ്പറോ അലുമിനിയമോ?'],['Aluminium is lighter and cheaper but needs about 1.6 times the area and careful joints. Copper is compact and easy to join.','एल्यूमिनियम हल्का और सस्ता है पर करीब 1.6 गुना एरिया और सावधान जॉइंट चाहिए। कॉपर कॉम्पैक्ट है और जॉइंट आसान।','അലുമിനിയം ഭാരം കുറഞ്ഞതും വിലക്കുറവുള്ളതുമാണ്, പക്ഷേ ഏകദേശം 1.6 ഇരട്ടി ഏരിയയും ശ്രദ്ധയുള്ള ജോയിന്റും വേണം. കോപ്പർ ചെറുതും ജോയിന്റ് എളുപ്പവുമാണ്.']),
   C(['What does 3½C × 70 mm² mean?','3½C × 70 mm² का क्या मतलब है?','3½C × 70 mm² എന്താണ് അർത്ഥമാക്കുന്നത്?'],['Three 70 mm² cores and one reduced neutral core, about 35 mm².','तीन 70 mm² कोर और एक छोटा न्यूट्रल कोर, करीब 35 mm²।','മൂന്ന് 70 mm² കോറും ഒരു ചെറിയ ന്യൂട്രൽ കോറും, ഏകദേശം 35 mm².']),
   C(['Why is the armour earthed?','आर्मर को अर्थ क्यों करते हैं?','ആർമർ എർത്ത് ചെയ്യുന്നത് എന്തിന്?'],['If a core touches the armour, the fault current goes to earth and the protection trips. Without it the armour becomes live.','अगर कोर आर्मर से छू जाए तो फॉल्ट करंट अर्थ में जाता है और प्रोटेक्शन ट्रिप होता है। वरना आर्मर लाइव हो जाता है।','കോർ ആർമറിൽ തൊട്ടാൽ ഫോൾട്ട് കറന്റ് എർത്തിലേക്ക് പോയി പ്രൊട്ടക്ഷൻ ട്രിപ്പ് ആകും. ഇല്ലെങ്കിൽ ആർമർ ലൈവ് ആകും.']),
   C(['How do you test a new cable before energising?','एनर्जाइज़ करने से पहले नई केबल कैसे टेस्ट करते हो?','എനർജൈസ് ചെയ്യുന്നതിന് മുമ്പ് പുതിയ കേബിൾ എങ്ങനെ ടെസ്റ്റ് ചെയ്യും?'],['Continuity of each core, core colours at both ends, then megger core to core and core to earth. Record the readings.','हर कोर की कंटिन्यूइटी, दोनों सिरों पर कोर कलर, फिर मेगर कोर से कोर और कोर से अर्थ। रीडिंग लिखो।','ഓരോ കോറിന്റെയും കണ്ടിന്യൂവിറ്റി, രണ്ട് അറ്റത്തും കോർ കളർ, പിന്നെ കോർ-ടു-കോർ, കോർ-ടു-എർത്ത് മെഗർ. റീഡിംഗ് രേഖപ്പെടുത്തൂ.']),
   C(['What is derating and why is it needed?','डिरेटिंग क्या है और क्यों ज़रूरी है?','ഡീറേറ്റിംഗ് എന്താണ്, എന്തിന് വേണം?'],['Lowering the table current for hot places, bunching or conduit. It keeps the insulation below its temperature limit.','गर्म जगह, बंडलिंग या कंड्यूट के लिए टेबल करंट घटाना। इससे इंसुलेशन टेम्परेचर लिमिट के नीचे रहता है।','ചൂടുള്ള സ്ഥലം, കെട്ട്, കണ്ടൂയിറ്റ് എന്നിവയ്ക്ക് ടേബിൾ കറന്റ് കുറയ്ക്കുന്നത്. ഇൻസുലേഷൻ ടെമ്പറേച്ചർ ലിമിറ്റിന് താഴെ നിൽക്കും.'])]}],'m2aintv')}});

SL.push({id:'a_mcq',menu:'MCQ quiz',kind:'tip',title:'quiz',wide:true,page(w,s,api){
  const Q=[
   [L('A conductor of 7 strands of 0.67 mm each has an area of about …','0.67 mm वाले 7 स्ट्रैंड के कंडक्टर का एरिया लगभग …','0.67 mm വീതമുള്ള 7 സ്ട്രാൻഡ് കണ്ടക്ടറിന്റെ ഏരിയ ഏകദേശം …'),['2.5 mm²','4 mm²','1.5 mm²','6 mm²'],0,L('7 × 3.1416 × 0.67² ÷ 4 = 2.47 mm².','7 × 3.1416 × 0.67² ÷ 4 = 2.47 mm²।','7 × 3.1416 × 0.67² ÷ 4 = 2.47 mm².')],
   [L('Copper cable, 100 m, 4 mm², ρ = 0.0172 Ω·mm²/m. Resistance R = ?','कॉपर केबल, 100 m, 4 mm², ρ = 0.0172 Ω·mm²/m। रेसिस्टेंस R = ?','കോപ്പർ കേബിൾ, 100 m, 4 mm², ρ = 0.0172 Ω·mm²/m. റെസിസ്റ്റൻസ് R = ?'),['0.43 Ω','4.3 Ω','0.043 Ω','1.72 Ω'],0,L('R = ρL ÷ A = 0.0172 × 100 ÷ 4 = 0.43 Ω.','R = ρL ÷ A = 0.0172 × 100 ÷ 4 = 0.43 Ω।','R = ρL ÷ A = 0.0172 × 100 ÷ 4 = 0.43 Ω.')],
   [L('A cable has resistance 0.5 Ω and carries 20 A. Heat lost = ?','केबल की रेसिस्टेंस 0.5 Ω है और 20 A ले जाती है। हीट लॉस = ?','കേബിളിന്റെ റെസിസ്റ്റൻസ് 0.5 Ω, 20 A കൊണ്ടുപോകുന്നു. ഹീറ്റ് നഷ്ടം = ?'),['200 W','10 W','40 W','20 W'],0,L('P = I² × R = 400 × 0.5 = 200 W.','P = I² × R = 400 × 0.5 = 200 W।','P = I² × R = 400 × 0.5 = 200 W.')],
   [L('The maximum conductor temperature for XLPE in normal use is …','नॉर्मल यूज़ में XLPE का मैक्स कंडक्टर टेम्परेचर …','സാധാരണ ഉപയോഗത്തിൽ XLPE-യുടെ മാക്സ് കണ്ടക്ടർ ടെമ്പറേച്ചർ …'),['90 °C','70 °C','50 °C','160 °C'],0,L('XLPE 90 °C. PVC is 70 °C.','XLPE 90 °C। PVC 70 °C।','XLPE 90 °C. PVC 70 °C.')],
   [L('In the code A2XFY, the letters 2X stand for …','कोड A2XFY में 2X का मतलब …','A2XFY കോഡിൽ 2X എന്നാൽ …'),[L('XLPE insulation','XLPE इंसुलेशन','XLPE ഇൻസുലേഷൻ'),L('Two cores','दो कोर','രണ്ട് കോർ'),L('Flat armour','फ्लैट आर्मर','ഫ്ലാറ്റ് ആർമർ'),L('Copper','कॉपर','കോപ്പർ')],0,L('2X is cross-linked polyethylene (XLPE) insulation.','2X क्रॉस-लिंक्ड पॉलीएथिलीन (XLPE) इंसुलेशन है।','2X ക്രോസ്-ലിങ്ക്ഡ് പോളിഎത്തിലീൻ (XLPE) ഇൻസുലേഷൻ ആണ്.')],
   [L('A 4 mm² cable has I<sub>z</sub> = 32 A at 30 °C. Grouping factor 0.65. Safe current = ?','4 mm² केबल का I<sub>z</sub> = 32 A (30 °C)। ग्रुपिंग फैक्टर 0.65। सेफ करंट = ?','4 mm² കേബിളിന്റെ I<sub>z</sub> = 32 A (30 °C). ഗ്രൂപ്പിംഗ് ഫാക്ടർ 0.65. സേഫ് കറന്റ് = ?'),['20.8 A','32 A','49 A','10 A'],0,L('32 × 0.65 = 20.8 A.','32 × 0.65 = 20.8 A।','32 × 0.65 = 20.8 A.')],
   [L('1-phase, 230 V, 20 A, a cable of 0.2 Ω per wire. Total drop (go and return) = ?','1-फेज़, 230 V, 20 A, हर वायर 0.2 Ω की केबल। कुल ड्रॉप (जाना और आना) = ?','1-ഫേസ്, 230 V, 20 A, ഓരോ വയറിനും 0.2 Ω. ആകെ ഡ്രോപ്പ് (പോക്കും വരവും) = ?'),['8 V','4 V','2 V','16 V'],0,L('Loop R = 0.4 Ω. V = 20 × 0.4 = 8 V.','लूप R = 0.4 Ω। V = 20 × 0.4 = 8 V।','ലൂപ്പ് R = 0.4 Ω. V = 20 × 0.4 = 8 V.')],
   [L('The design voltage-drop limit used in this module is about …','इस मॉड्यूल में इस्तेमाल डिज़ाइन वोल्टेज-ड्रॉप लिमिट लगभग …','ഈ മൊഡ്യൂളിൽ ഉപയോഗിക്കുന്ന ഡിസൈൻ വോൾട്ടേജ്-ഡ്രോപ്പ് ലിമിറ്റ് ഏകദേശം …'),['3 %','30 %','0.3 %','10 %'],0,L('A common design figure is 3 %. Verify with IS 732 and the supply rules.','आम डिज़ाइन वैल्यू 3 % है। IS 732 और सप्लाई रूल से वेरिफाई करो।','സാധാരണ ഡിസൈൻ വില 3 % ആണ്. IS 732, സപ്ലൈ റൂൾ എന്നിവയിൽ വെരിഫൈ ചെയ്യൂ.')],
   [L('A cable of 650/1100 V is suitable for a …','650/1100 V केबल किसके लिए ठीक है …','650/1100 V കേബിൾ ഏതിന് അനുയോജ്യം …'),[L('415 V three-phase supply','415 V थ्री-फेज़ सप्लाई','415 V ത്രീ-ഫേസ് സപ്ലൈ'),L('11 kV line','11 kV लाइन','11 kV ലൈൻ'),L('33 kV line','33 kV लाइन','33 kV ലൈൻ'),L('132 kV line','132 kV लाइन','132 kV ലൈൻ')],0,L('The grade must be at least the system voltage. 1.1 kV > 415 V.','ग्रेड कम से कम सिस्टम वोल्टेज जितना हो। 1.1 kV > 415 V।','ഗ്രേഡ് കുറഞ്ഞത് സിസ്റ്റം വോൾട്ടേജിന് തുല്യം ആയിരിക്കണം. 1.1 kV > 415 V.')],
   [L('Why is a bimetallic lug used for aluminium on a copper busbar?','कॉपर बसबार पर एल्यूमिनियम के लिए बाइमेटैलिक लग क्यों?','കോപ്പർ ബസ്ബാറിൽ അലുമിനിയത്തിന് ബൈമെറ്റാലിക് ലഗ് എന്തിന്?'),[L('To stop Al–Cu corrosion','Al–Cu कोरोज़न रोकने के लिए','Al–Cu കോറോഷൻ തടയാൻ'),L('To reduce cost','कॉस्ट घटाने के लिए','ചെലവ് കുറയ്ക്കാൻ'),L('To raise voltage','वोल्टेज बढ़ाने के लिए','വോൾട്ടേജ് കൂട്ടാൻ'),L('For looks','दिखावे के लिए','ഭംഗിക്ക്')],0,L('Different metals in contact corrode in moisture.','अलग मेटल नमी में कॉन्टैक्ट पर कोरोड होते हैं।','വ്യത്യസ്ത മെറ്റലുകൾ ഈർപ്പത്തിൽ തൊടുമ്പോൾ കോറോഡ് ചെയ്യും.')],
