/* ---------- 17 What is a capacitor ---------- */
CS({id:'m_cap',menu:'What is a capacitor?',title:'t_cap',
 flash:FB('Charge Q = I × t (Module 0, slide 6); insulator (slide 12)','चार्ज Q = I × t (मॉड्यूल 0, स्लाइड 6); इंसुलेटर (स्लाइड 12)','ചാർജ് Q = I × t (മൊഡ്യൂൾ 0, സ്ലൈഡ് 6); ഇൻസുലേറ്റർ (സ്ലൈഡ് 12)'),
 hook:L('Two metal plates and air between them. It still stores charge!','दो मेटल प्लेट और बीच में हवा। फिर भी चार्ज स्टोर करता है!','രണ്ട് മെറ്റൽ പ്ലേറ്റും ഇടയിൽ വായുവും. എങ്കിലും ചാർജ് സൂക്ഷിക്കുന്നു!'),
 defn:L('<b>Capacitor:</b> two conductors (plates) separated by an insulator (<b>dielectric</b>). It stores charge. Bigger plates, closer plates, or a better dielectric give more <b>capacitance C</b>, unit farad (F).','<b>कैपेसिटर:</b> दो कंडक्टर (प्लेट) जिनके बीच इंसुलेटर (<b>डाइइलेक्ट्रिक</b>)। यह चार्ज स्टोर करता है। बड़ी प्लेट, पास-पास प्लेट या बेहतर डाइइलेक्ट्रिक से ज़्यादा <b>कैपेसिटेंस C</b>, यूनिट फैराड (F)।','<b>കപ്പാസിറ്റർ:</b> ഒരു ഇൻസുലേറ്റർ (<b>ഡൈഇലക്ട്രിക്</b>) കൊണ്ട് വേർതിരിച്ച രണ്ട് കണ്ടക്ടർ (പ്ലേറ്റ്). ഇത് ചാർജ് സൂക്ഷിക്കുന്നു. വലിയ പ്ലേറ്റ്, അടുത്ത പ്ലേറ്റ്, മികച്ച ഡൈഇലക്ട്രിക് എന്നിവ കൂടുതൽ <b>കപ്പാസിറ്റൻസ് C</b> തരും, യൂണിറ്റ് ഫാരഡ് (F).'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="Two parallel plates with a gap"><rect x="110" y="14" width="8" height="72" fill="${FE}" stroke="${FED}"/><rect x="182" y="14" width="8" height="72" fill="${FE}" stroke="${FED}"/>${TT(150,52,'dielectric','डाइइलेक्ट्रिक','ഡൈഇലക്ട്രിക്','m')}</svg>`,
 play:L('Slide plate area and gap. Switch the dielectric. Watch the stored charge.','प्लेट एरिया और गैप स्लाइड करो। डाइइलेक्ट्रिक बदलो। स्टोर्ड चार्ज देखो।','പ്ലേറ്റ് ഏരിയയും ഗ്യാപ്പും സ്ലൈഡ് ചെയ്യൂ. ഡൈഇലക്ട്രിക് മാറ്റൂ. സൂക്ഷിച്ച ചാർജ് നോക്കൂ.'),
 pred:{q:L('The plates are moved closer together. The capacitance …','प्लेटें पास लाई गईं। कैपेसिटेंस …','പ്ലേറ്റുകൾ അടുപ്പിച്ചു. കപ്പാസിറ്റൻസ് …'),o:[L('increases','बढ़ता है','കൂടും'),L('decreases','घटता है','കുറയും'),L('stays the same','वही रहता है','അതേ നിൽക്കും')],a:0,why:L('Closer plates hold more charge for the same voltage. C = bigger when the gap is small.','पास प्लेट उसी वोल्टेज पर ज़्यादा चार्ज रखती हैं। गैप कम तो C ज़्यादा।','അടുത്ത പ്ലേറ്റ് ഒരേ വോൾട്ടേജിൽ കൂടുതൽ ചാർജ് പിടിക്കും. ഗ്യാപ് കുറഞ്ഞാൽ C കൂടും.')},
 labels:['farad','dielec'],hints:['qit','chg'],rel:{c:['Q','I','t','C','V'],h:'C'},
 fm:['<i>Q</i> = <i>C</i> × <i>V</i>'],
 uses:L('Q in coulomb, C in farad, V in volt. Practical caps are in µF (1 µF = 0.000001 F). Q = I × t is Module 0, slide 6.','Q कूलॉम में, C फैराड में, V वोल्ट में। प्रैक्टिकल कैप µF में (1 µF = 0.000001 F)। Q = I × t मॉड्यूल 0, स्लाइड 6।','Q കൂളോമിൽ, C ഫാരഡിൽ, V വോൾട്ടിൽ. പ്രായോഗിക ക്യാപ് µF-ൽ (1 µF = 0.000001 F). Q = I × t മൊഡ്യൂൾ 0, സ്ലൈഡ് 6.'),
 ex:L('Mental sum: 100 µF at 10 V holds Q = 100 × 10 = 1000 µC = 1 mC.','मेंटल सम: 10 V पर 100 µF का Q = 100 × 10 = 1000 µC = 1 mC।','മെന്റൽ സം: 10 V-ൽ 100 µF-ന്റെ Q = 100 × 10 = 1000 µC = 1 mC.'),
 note:L('The µF values in the picture are relative, for the idea only. C ∝ area ÷ gap, times the dielectric factor.','चित्र में µF वैल्यू रिलेटिव हैं, सिर्फ़ आइडिया के लिए। C ∝ एरिया ÷ गैप, गुणा डाइइलेक्ट्रिक फैक्टर।','ചിത്രത്തിലെ µF വിലകൾ ആപേക്ഷികം, ആശയത്തിന് മാത്രം. C ∝ ഏരിയ ÷ ഗ്യാപ്, ഗുണം ഡൈഇലക്ട്രിക് ഫാക്ടർ.'),
 trick:L('Big plates, near plates, good filling: big C.','बड़ी प्लेट, पास प्लेट, अच्छी फिलिंग: बड़ा C।','വലിയ പ്ലേറ്റ്, അടുത്ത പ്ലേറ്റ്, നല്ല ഫില്ലിംഗ്: വലിയ C.'),
 check:{q:L('A 50 µF capacitor is charged to 20 V. Q = C × V = ? And it stores charge because the dielectric is an …','50 µF कैपेसिटर 20 V तक चार्ज है। Q = C × V = ? और यह चार्ज इसलिए रोकता है क्योंकि डाइइलेक्ट्रिक …','50 µF കപ്പാസിറ്റർ 20 V-ലേക്ക് ചാർജ് ചെയ്തു. Q = C × V = ? ഡൈഇലക്ട്രിക് ഒരു … ആയതിനാൽ ചാർജ് സൂക്ഷിക്കുന്നു'),o:[L('1000 µC, insulator','1000 µC, इंसुलेटर','1000 µC, ഇൻസുലേറ്റർ'),L('2.5 µC, conductor','2.5 µC, कंडक्टर','2.5 µC, കണ്ടക്ടർ'),L('1000 µC, conductor','1000 µC, कंडक्टर','1000 µC, കണ്ടക്ടർ')],a:0},
 build(w,api){
  w.innerHTML=S(420,230,`<g id="a"></g>`,'A battery across two plates; the number of charges on the plates shows the stored charge');
  const rd=mkRd(w),c=mkCtl(w);let A=2,g=2,k=false;
  slider(c,L('Plate area','प्लेट एरिया','പ്ലേറ്റ് ഏരിയ'),1,4,1,2,x=>x+' ×',x=>{A=x;api.redraw()});
  slider(c,L('Gap','गैप','ഗ്യാപ്'),1,4,1,2,x=>x+' ×',x=>{g=x;api.redraw()});
  const kb=button(c,L('Dielectric: air','डाइइलेक्ट्रिक: हवा','ഡൈഇലക്ട്രിക്: വായു'),()=>{k=!k;kb.textContent=k?'Dielectric: mica':'Dielectric: air';api.redraw();setTimeout(svgLang,0)},'on');
  return t=>{const Cv=5*A*(k?4:1)/g;const V=12;const Q=Cv*V;
   const h2=30+A*28,x1=210-g*16-6,x2=210+g*16-2,cy=115;
   let s=`<path class="w" d="M40 115H${x1}M${x2+8} 115H380M40 115V195H380V115" fill="none"/>`;
   s+=`<g transform="translate(40 155)"><path class="w" d="M0 -30V30"/></g>`;
   s+=`<rect x="26" y="150" width="28" height="10" fill="var(--card)" stroke="var(--wire)" stroke-width="2"/><text x="14" y="160" class="tx s">+</text><text x="58" y="160" class="tx s">−</text><text x="66" y="150" class="tx s">12 V</text>`;
   if(k)s+=`<rect x="${x1+8}" y="${cy-h2/2}" width="${x2-x1-8}" height="${h2}" fill="var(--tip-bg)" stroke="var(--tip)" stroke-width="1.5" opacity=".8"/>`;
   s+=`<rect x="${x1}" y="${cy-h2/2}" width="8" height="${h2}" fill="${FE}" stroke="${FED}"/><rect x="${x2}" y="${cy-h2/2}" width="8" height="${h2}" fill="${FE}" stroke="${FED}"/>`;
   const n=Math.min(20,Math.max(2,Math.round(Q/10)));
   for(let i=0;i<n;i++){const yy=cy-h2/2+8+(h2-16)*(n>1?i/(n-1):.5);s+=`<text x="${x1-10}" y="${yy.toFixed(0)}" text-anchor="middle" fill="${NC}" style="font:800 13px NL,sans-serif">+</text><text x="${x2+18}" y="${yy.toFixed(0)}" text-anchor="middle" fill="${SC}" style="font:800 15px NL,sans-serif">−</text>`}
   put($('#a',w),s);
   setRd(rd,`<span>C ≈ <b>${fm1(Cv)} µF</b> ${RD('(relative)','(रिलेटिव)','(ആപേക്ഷികം)')}</span><span>Q = C × V = <b>${fm1(Q)} µC</b></span>`)}}});

/* ---------- 18 Charge and discharge ---------- */
const RVa=[1,2,5,10],CVa=[20,50,100];
CS({id:'m_chg',menu:'Charging and discharging',title:'t_chg',
 flash:FB('I = V ÷ R (Module 0, slide 14); τ idea (slide 14)','I = V ÷ R (मॉड्यूल 0, स्लाइड 14); τ आइडिया (स्लाइड 14)','I = V ÷ R (മൊഡ്യൂൾ 0, സ്ലൈഡ് 14); τ ആശയം (സ്ലൈഡ് 14)'),
 hook:L('A camera flash charges slowly, then fires in a blink. Why?','कैमरा फ्लैश धीरे चार्ज होता है, फिर पलक झपकते चलता है। क्यों?','ക്യാമറ ഫ്ലാഷ് പതുക്കെ ചാർജ് ആകുന്നു, പിന്നെ കണ്ണടച്ച് തുറക്കും മുമ്പ് ഫയർ ചെയ്യുന്നു. എന്തുകൊണ്ട്?'),
 defn:L('<b>Charging:</b> current flows in, the capacitor voltage rises slowly. <b>Discharging:</b> the stored charge flows out through the load. The speed depends on the <b>time constant τ = R × C</b>.','<b>चार्जिंग:</b> करंट अंदर बहता है, कैपेसिटर वोल्टेज धीरे बढ़ता है। <b>डिस्चार्जिंग:</b> स्टोर्ड चार्ज लोड से बाहर बहता है। स्पीड <b>टाइम कॉन्स्टेंट τ = R × C</b> पर निर्भर।','<b>ചാർജിംഗ്:</b> കറന്റ് അകത്തേക്ക് ഒഴുകി, കപ്പാസിറ്റർ വോൾട്ടേജ് പതുക്കെ കൂടുന്നു. <b>ഡിസ്ചാർജിംഗ്:</b> സൂക്ഷിച്ച ചാർജ് ലോഡിലൂടെ പുറത്തേക്ക് ഒഴുകുന്നു. വേഗം <b>ടൈം കോൺസ്റ്റന്റ് τ = R × C</b> അനുസരിച്ച്.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="A resistor and a capacitor in series with a battery"><path class="w" d="M40 50H70M130 50H160M200 50H260"/>${symRes(100,50,0)}${symCap(180,50,90)}</svg>`,
 play:L('Press Charge, then Discharge. Change R and C. Watch the curve.','Charge दबाओ, फिर Discharge। R और C बदलो। कर्व देखो।','Charge അമർത്തൂ, പിന്നെ Discharge. R, C മാറ്റൂ. കർവ് നോക്കൂ.'),
 pred:{q:L('R is doubled and C stays the same. Charging becomes …','R डबल, C वही। चार्जिंग हो जाती है …','R ഇരട്ടി, C അതേ. ചാർജിംഗ് ആകും …'),o:[L('slower','धीमी','പതുക്കെ'),L('faster','तेज़','വേഗത്തിൽ'),L('the same','वैसी ही','അതേപോലെ')],a:0,why:L('τ = R × C doubles. A bigger R gives a smaller charging current (I = V ÷ R).','τ = R × C डबल। बड़ा R, छोटा चार्जिंग करंट (I = V ÷ R)।','τ = R × C ഇരട്ടി. വലിയ R ചെറിയ ചാർജിംഗ് കറന്റ് തരും (I = V ÷ R).')},
 labels:['farad','tconst'],hints:['vir','qit'],rel:{c:['V','I','R','C','Q','τ'],h:'τ'},
 fm:['<i>τ</i> = <i>R</i> × <i>C</i>'],
 uses:L('R in ohm, C in farad, τ in second. After τ the capacitor has about 63 % of the supply. After 5τ it is practically full. Used in: timers, flash units, smoothing, delay circuits.','R ओम में, C फैराड में, τ सेकंड में। τ के बाद कैपेसिटर सप्लाई का करीब 63 %। 5τ के बाद लगभग फुल। इस्तेमाल: टाइमर, फ्लैश यूनिट, स्मूदिंग, डिले सर्किट।','R ഓമിൽ, C ഫാരഡിൽ, τ സെക്കൻഡിൽ. τ കഴിയുമ്പോൾ കപ്പാസിറ്റർ സപ്ലൈയുടെ ഏകദേശം 63 %. 5τ-ന് ശേഷം ഏതാണ്ട് ഫുൾ. ഉപയോഗം: ടൈമർ, ഫ്ലാഷ് യൂണിറ്റ്, സ്മൂത്തിംഗ്, ഡിലേ സർക്യൂട്ട്.'),
 ex:L('Mental sum: 10 kΩ × 100 µF = 10 000 × 0.0001 = 1 s. 5 kΩ × 100 µF = 0.5 s.','मेंटल सम: 10 kΩ × 100 µF = 10 000 × 0.0001 = 1 s। 5 kΩ × 100 µF = 0.5 s।','മെന്റൽ സം: 10 kΩ × 100 µF = 10 000 × 0.0001 = 1 s. 5 kΩ × 100 µF = 0.5 s.'),
 trick:L('Big R or big C: slow. Small: fast.','बड़ा R या बड़ा C: धीमा। छोटा: तेज़।','വലിയ R അല്ലെങ്കിൽ വലിയ C: പതുക്കെ. ചെറുത്: വേഗം.'),
 check:{q:L('R = 20 kΩ and C = 50 µF. τ = R × C = ? Supply 12 V, current at the first instant I = V ÷ R = ?','R = 20 kΩ और C = 50 µF। τ = R × C = ? सप्लाई 12 V, पहले पल करंट I = V ÷ R = ?','R = 20 kΩ, C = 50 µF. τ = R × C = ? സപ്ലൈ 12 V, ആദ്യ നിമിഷം കറന്റ് I = V ÷ R = ?'),o:['1 s, 0.6 mA','1000 s, 0.6 A','0.4 s, 6 mA'],a:0},
 build(w,api){
  w.innerHTML=S(420,230,`<g id="a"></g>`,'A graph of capacitor voltage rising when charged and falling when discharged');
  const rd=mkRd(w),c=mkCtl(w);let ri=3,ci=2,mode=0,v=0;const hist=[];const Vs=12;
  slider(c,'R',0,3,1,3,x=>RVa[x]+' kΩ',x=>{ri=x;api.redraw()});
  slider(c,'C',0,2,1,2,x=>CVa[x]+' µF',x=>{ci=x;api.redraw()});
  button(c,L('Charge','चार्ज','ചാർജ്'),()=>{mode=1;api.redraw()},'on');
  button(c,L('Discharge','डिस्चार्ज','ഡിസ്ചാർജ്'),()=>{mode=-1;api.redraw()});
  api.setReplay(()=>{v=0;mode=0;hist.length=0});
  return(t,dt)=>{dt=Math.min(dt,.05);const tau=RVa[ri]*CVa[ci]/1000;
   if(mode>0)v+=(Vs-v)/tau*dt;else if(mode<0)v-=v/tau*dt;
   hist.push(v);if(hist.length>200)hist.shift();
   const x0=30,y0=190,W=370,Hh=140;let pts='';hist.forEach((q,k)=>{pts+=(k?'L':'M')+(x0+k/200*W).toFixed(1)+' '+(y0-q/12*Hh).toFixed(1)});
   let s=`<path d="M${x0} ${y0}H${x0+W}M${x0} ${y0}V${y0-Hh-6}" stroke="var(--mut)" stroke-width="1.5" fill="none"/><path d="M${x0} ${y0-Hh}H${x0+W}" stroke="var(--mut)" stroke-dasharray="4 5" fill="none"/><path d="${pts}" fill="none" stroke="var(--frm)" stroke-width="3.5"/><text x="${x0+4}" y="${y0-Hh-8}" class="tx s">V_C (12 V)</text>`;
   const lamp=mode<0?clamp(v/12,0,1):0;
   s+=`<circle cx="372" cy="46" r="18" fill="var(--glow)" opacity="${lamp.toFixed(2)}" stroke="var(--wire)" stroke-width="2"/>`;
   put($('#a',w),s);
   setRd(rd,`<span>τ = ${RVa[ri]} kΩ × ${CVa[ci]} µF = <b>${fm1(tau)} s</b></span><span>V<sub>C</sub> = <b>${v.toFixed(1)} V</b></span><span>${mode>0?RD('charging','चार्ज हो रहा','ചാർജ് ആകുന്നു'):mode<0?RD('discharging','डिस्चार्ज हो रहा','ഡിസ്ചാർജ് ആകുന്നു'):RD('press Charge','Charge दबाओ','Charge അമർത്തൂ')}</span>`)}}});

 hook:L('Four capacitors on the bench. Connect one the wrong way round and it bursts. Which?','बेंच पर चार कैपेसिटर। एक को उल्टा जोड़ो तो फट जाता है। कौन-सा?','ബെഞ്ചിൽ നാല് കപ്പാസിറ്റർ. ഒന്ന് തിരിച്ച് കണക്ട് ചെയ്താൽ പൊട്ടും. ഏത്?'),
 defn:L('<b>Types:</b> paper/film, ceramic, electrolytic, variable. Only <b>electrolytic</b> capacitors are polarised. Read the voltage rating on the body and never exceed it.','<b>टाइप:</b> पेपर/फिल्म, सिरेमिक, इलेक्ट्रोलाइटिक, वेरिएबल। सिर्फ़ <b>इलेक्ट्रोलाइटिक</b> पोलराइज़्ड होते हैं। बॉडी पर वोल्टेज रेटिंग पढ़ो और उससे ज़्यादा कभी न लगाओ।','<b>ടൈപ്പുകൾ:</b> പേപ്പർ/ഫിലിം, സെറാമിക്, ഇലക്ട്രോലൈറ്റിക്, വേരിയബിൾ. <b>ഇലക്ട്രോലൈറ്റിക്</b> മാത്രം പോളറൈസ്ഡ്. ബോഡിയിലെ വോൾട്ടേജ് റേറ്റിംഗ് വായിക്കൂ, ഒരിക്കലും കടക്കരുത്.'),

 pred:{q:L('Which capacitor can burst if connected the wrong way round?','कौन-सा कैपेसिटर उल्टा जोड़ने पर फट सकता है?','ഏത് കപ്പാസിറ്റർ തിരിച്ച് കണക്ട് ചെയ്താൽ പൊട്ടിത്തെറിക്കും?'),o:[L('Electrolytic','इलेक्ट्रोलाइटिक','ഇലക്ട്രോലൈറ്റിക്'),L('Ceramic','सिरेमिक','സെറാമിക്'),L('Paper / film','पेपर / फिल्म','പേപ്പർ / ഫിലിം')],a:0,why:L('Only the electrolytic type has + and − leads. Reverse polarity damages its thin oxide layer.','सिर्फ़ इलेक्ट्रोलाइटिक में + और − लीड होते हैं। उल्टी पोलैरिटी उसकी पतली ऑक्साइड लेयर खराब कर देती है।','ഇലക്ട്രോലൈറ്റിക്കിന് മാത്രമേ + ഉം − ഉം ലീഡ് ഉള്ളൂ. തിരിച്ച് പോളാരിറ്റി അതിന്റെ നേർത്ത ഓക്സൈഡ് ലെയർ നശിപ്പിക്കും.')},

 note:L('Typical ranges only. Always read the code and the voltage on the body. A 25 V electrolytic must not go on 230 V AC.','सिर्फ़ टिपिकल रेंज। हमेशा बॉडी पर कोड और वोल्टेज पढ़ो। 25 V का इलेक्ट्रोलाइटिक 230 V AC पर नहीं लगाते।','ടിപ്പിക്കൽ റേഞ്ച് മാത്രം. ബോഡിയിലെ കോഡും വോൾട്ടേജും എപ്പോഴും വായിക്കൂ. 25 V ഇലക്ട്രോലൈറ്റിക് 230 V AC-യിൽ ഉപയോഗിക്കരുത്.'),

 check:{q:L('A radio set uses a capacitor that can be turned by a knob to tune stations. It is the … type.','रेडियो में नॉब से घुमाकर स्टेशन ट्यून करने वाला कैपेसिटर … टाइप है।','റേഡിയോ ട്യൂൺ ചെയ്യാൻ നോബ് തിരിക്കുന്ന കപ്പാസിറ്റർ … ടൈപ്പ് ആണ്.'),o:[L('variable','वेरिएबल','വേരിയബിൾ'),L('electrolytic','इलेक्ट्रोलाइटिक','ഇലക്ട്രോലൈറ്റിക്')],a:0},
 build(w,api){
  w.innerHTML=S(420,210,`<g id="a"></g>`,'A drawing of the selected capacitor type');

  CTY.forEach((ty,i)=>{const b=button(c,L(ty.n[0],ty.n[1],ty.n[2]),()=>{sel=i;$$('.btn',c).forEach((x,j)=>x.classList.toggle('on',j===i));api.redraw()},i===2?'on':'')});
  return t=>{const ty=CTY[sel];let s='';
   const lead=(x,y,l,p)=>`<path d="M${x} ${y}V${y+l}" stroke="${FED}" stroke-width="3.5"/>`;
   if(sel===0){s+=`<rect x="150" y="50" width="120" height="80" rx="6" fill="#e0c24a" stroke="#0007" stroke-width="2"/><text x="210" y="98" text-anchor="middle" class="tx" style="fill:#3a2f00">0.1 µF · 400 V</text><path d="M180 130V180M240 130V180" stroke="${FED}" stroke-width="3.5"/>`}
   if(sel===1){s+=`<circle cx="210" cy="90" r="46" fill="#c97a3a" stroke="#0007" stroke-width="2"/><text x="210" y="98" text-anchor="middle" class="tx" style="fill:#2a1500">104</text><path d="M196 134V184M224 134V184" stroke="${FED}" stroke-width="3.5"/>`}
   if(sel===2){s+=`<rect x="170" y="36" width="80" height="110" rx="10" fill="#2a6fdb" stroke="#0007" stroke-width="2"/><rect x="170" y="36" width="20" height="110" fill="#e6efff" opacity=".9"/>${[0,1,2,3].map(i=>`<text x="180" y="${62+i*24}" text-anchor="middle" style="font:800 20px NL,sans-serif;fill:#14202e">−</text>`).join('')}<text x="226" y="96" text-anchor="middle" fill="#fff" style="font:800 15px NL,sans-serif">470 µF</text><text x="226" y="116" text-anchor="middle" fill="#fff" style="font:700 14px NL,sans-serif">25 V</text><path d="M184 146V196M236 146V186" stroke="${FED}" stroke-width="3.5"/><text x="236" y="206" text-anchor="middle" class="tx" style="fill:${NC}">+</text><text x="184" y="214" text-anchor="middle" class="tx" style="fill:${SC}">−</text>`}
   if(sel===3){const a=(Math.sin(t*1.2)+1)/2;s+=`<rect x="130" y="60" width="160" height="12" fill="${FE}" stroke="${FED}"/>`;for(let i=0;i<5;i++){const off=a*28;s+=`<rect x="${150+i*20}" y="${72}" width="5" height="${50}" fill="${FE}" stroke="${FED}"/><rect x="${158+i*20+off*0}" y="${100-40*(.2+.8*a)+ (i%2?10:0)}" width="0" height="0"/>`}
    const ov=a;for(let i=0;i<4;i++){s+=`<rect x="${153+i*20+ov*18}" y="${100}" width="5" height="${50}" fill="${FED}" opacity=".9"/>`}
    s+=`<circle cx="210" cy="180" r="14" fill="var(--card)" stroke="var(--wire)" stroke-width="2"/><path d="M210 180l${(Math.cos(a*3)*10).toFixed(1)} ${(Math.sin(a*3)*10).toFixed(1)}" stroke="var(--fg)" stroke-width="2.5"/>`}
   put($('#a',w),s);

CS({id:'m_cgrp',menu:'Grouping capacitors',title:'t_cgrp',
 flash:FB('Resistors and inductors group the other way (Module 2, slide 11; slide 16)','रेसिस्टर और इंडक्टर उल्टे ग्रुप होते हैं (मॉड्यूल 2, स्लाइड 11; स्लाइड 16)','റെസിസ്റ്ററും ഇൻഡക്ടറും മറിച്ച് ഗ്രൂപ്പ് ആകും (മൊഡ്യൂൾ 2, സ്ലൈഡ് 11; സ്ലൈഡ് 16)'),
 hook:L('You need 20 µF but have only two 10 µF. Series or parallel?','20 µF चाहिए पर सिर्फ़ दो 10 µF हैं। सीरीज़ या पैरेलल?','20 µF വേണം, പക്ഷേ രണ്ട് 10 µF മാത്രം. സീരീസോ പാരലലോ?'),
 defn:L('<b>Parallel:</b> plate areas add, so C adds. <b>Series:</b> the gap effectively grows, so C falls: 1/C = 1/C₁ + 1/C₂. In series the voltage divides, and the smaller C takes the bigger share.','<b>पैरेलल:</b> प्लेट एरिया जुड़ता है, इसलिए C जुड़ता है। <b>सीरीज़:</b> गैप असल में बढ़ता है, इसलिए C घटता है: 1/C = 1/C₁ + 1/C₂। सीरीज़ में वोल्टेज बँटता है, छोटा C बड़ा हिस्सा लेता है।','<b>പാരലൽ:</b> പ്ലേറ്റ് ഏരിയ കൂടുന്നു, അതിനാൽ C കൂടും. <b>സീരീസ്:</b> ഗ്യാപ് ഫലത്തിൽ കൂടുന്നു, അതിനാൽ C കുറയും: 1/C = 1/C₁ + 1/C₂. സീരീസിൽ വോൾട്ടേജ് പങ്കിടും, ചെറിയ C വലിയ പങ്ക് എടുക്കും.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="Plates joined side by side (parallel) or end to end (series)"><rect x="40" y="20" width="6" height="50" fill="${FE}"/><rect x="62" y="20" width="6" height="50" fill="${FE}"/><rect x="100" y="20" width="6" height="50" fill="${FE}"/><rect x="122" y="20" width="6" height="50" fill="${FE}"/>${TT(80,92,'Parallel: area adds','पैरेलल: एरिया जुड़ता','പാരലൽ: ഏരിയ കൂടുന്നു','m')}${TT(220,92,'Series: gap adds','सीरीज़: गैप जुड़ता','സീരീസ്: ഗ്യാപ് കൂടുന്നു','m')}</svg>`,
 play:L('Press Series or Parallel. Slide C₁ and C₂. Read the total and the voltages.','Series या Parallel दबाओ। C₁ और C₂ स्लाइड करो। टोटल और वोल्टेज पढ़ो।','Series അല്ലെങ്കിൽ Parallel അമർത്തൂ. C₁, C₂ സ്ലൈഡ് ചെയ്യൂ. ടോട്ടലും വോൾട്ടേജും വായിക്കൂ.'),
 pred:{q:L('Two 10 µF capacitors in series give …','दो 10 µF कैपेसिटर सीरीज़ में देते हैं …','രണ്ട് 10 µF കപ്പാസിറ്റർ സീരീസിൽ തരും …'),o:['5 µF','20 µF','10 µF'],a:0,why:L('Series: C₁C₂ ÷ (C₁ + C₂) = 100 ÷ 20 = 5 µF. Equal parts in series: half.','सीरीज़: C₁C₂ ÷ (C₁ + C₂) = 100 ÷ 20 = 5 µF। बराबर पार्ट सीरीज़ में: आधा।','സീരീസ്: C₁C₂ ÷ (C₁ + C₂) = 100 ÷ 20 = 5 µF. തുല്യ പാർട്ട് സീരീസിൽ: പകുതി.')},
 labels:['farad'],hints:['lc','ser'],rel:{c:['Q','V','C','C<sub>T</sub>'],h:'C<sub>T</sub>'},
 fm:['Parallel: <i>C<sub>T</sub></i> = <i>C₁</i> + <i>C₂</i>','Series: <i>C<sub>T</sub></i> = <i>C₁C₂</i> ÷ (<i>C₁</i> + <i>C₂</i>)'],
 uses:L('Why: in parallel each capacitor sees the full voltage and stores its own charge, so charges add. In series the same charge flows through both, so the combination holds less. Voltage on each in series: V₁ = V × C₂ ÷ (C₁ + C₂).','क्यों: पैरेलल में हर कैपेसिटर पर पूरा वोल्टेज और अपना चार्ज, इसलिए चार्ज जुड़ता है। सीरीज़ में दोनों से वही चार्ज गुज़रता है, इसलिए कुल कम रखता है। सीरीज़ में हर पर वोल्टेज: V₁ = V × C₂ ÷ (C₁ + C₂)।','എന്തുകൊണ്ട്: പാരലലിൽ ഓരോ കപ്പാസിറ്ററിലും മുഴുവൻ വോൾട്ടേജും സ്വന്തം ചാർജും, അതിനാൽ ചാർജ് കൂടും. സീരീസിൽ രണ്ടിലൂടെയും ഒരേ ചാർജ് കടന്നുപോകുന്നു, അതിനാൽ ആകെ കുറച്ചേ പിടിക്കൂ. സീരീസിൽ ഓരോന്നിലും വോൾട്ടേജ്: V₁ = V × C₂ ÷ (C₁ + C₂).'),
 ex:L('Mental sum: 10 µF + 30 µF in parallel = 40 µF. In series: 10 × 30 ÷ 40 = 7.5 µF. On 200 V in series the 10 µF takes 150 V.','मेंटल सम: 10 µF + 30 µF पैरेलल = 40 µF। सीरीज़: 10 × 30 ÷ 40 = 7.5 µF। 200 V पर सीरीज़ में 10 µF पर 150 V।','മെന്റൽ സം: 10 µF + 30 µF പാരലൽ = 40 µF. സീരീസ്: 10 × 30 ÷ 40 = 7.5 µF. 200 V-ൽ സീരീസിൽ 10 µF-ന് 150 V.'),
 trick:L('R and L: series adds. C: parallel adds.','R और L: सीरीज़ में जुड़ते हैं। C: पैरेलल में।','R, L: സീരീസിൽ കൂടും. C: പാരലലിൽ.'),
 check:{q:L('Two 6 Ω resistors in series = 12 Ω. Two 6 µF capacitors in series = ?','दो 6 Ω रेसिस्टर सीरीज़ में = 12 Ω। दो 6 µF कैपेसिटर सीरीज़ में = ?','രണ്ട് 6 Ω റെസിസ്റ്റർ സീരീസിൽ = 12 Ω. രണ്ട് 6 µF കപ്പാസിറ്റർ സീരീസിൽ = ?'),o:['3 µF','12 µF','6 µF'],a:0},
 build(w,api){return groupWidget(w,api,'C')}});

 {k:'leak',n:['Leaky','लीकी','ലീക്കി'],d:['Kicks, then settles part-way. Insulation is weak. Replace it.','झटका, फिर बीच में रुकती है। इंसुलेशन कमज़ोर है। बदल दो।','ചാടി, പിന്നെ പകുതിയിൽ നിൽക്കും. ഇൻസുലേഷൻ ദുർബലം. മാറ്റിവയ്ക്കൂ.']}];
CS({id:'m_cuse',menu:'Uses and testing',title:'t_cuse',
 flash:FB('Charging and discharging (slide 18); megger and ohm-meter idea (Module 2A)','चार्जिंग और डिस्चार्जिंग (स्लाइड 18); मेगर और ओहम-मीटर का आइडिया (मॉड्यूल 2A)','ചാർജിംഗും ഡിസ്ചാർജിംഗും (സ്ലൈഡ് 18); മെഗർ, ഓം-മീറ്റർ ആശയം (മൊഡ്യൂൾ 2A)'),
 hook:L('A ceiling fan hums but turns slowly. Check the capacitor with a meter.','सीलिंग फैन गुनगुनाता है पर धीरे घूमता है। मीटर से कैपेसिटर चेक करो।','സീലിംഗ് ഫാൻ മൂളുന്നു, പതുക്കെ തിരിയുന്നു. മീറ്റർ കൊണ്ട് കപ്പാസിറ്റർ ടെസ്റ്റ് ചെയ്യൂ.'),
 defn:L('<b>Uses:</b> motor start and run (fan, pump), power factor correction, smoothing in power supplies, tuning, timing. <b>Test:</b> discharge it first, then use an analogue ohm-meter and watch the needle.','<b>यूज़:</b> मोटर स्टार्ट और रन (फैन, पंप), पावर फैक्टर करेक्शन, पावर सप्लाई में स्मूदिंग, ट्यूनिंग, टाइमिंग। <b>टेस्ट:</b> पहले डिस्चार्ज करो, फिर एनालॉग ओहम-मीटर से सुई देखो।','<b>ഉപയോഗം:</b> മോട്ടോർ സ്റ്റാർട്ട്, റൺ (ഫാൻ, പമ്പ്), പവർ ഫാക്ടർ കറക്ഷൻ, പവർ സപ്ലൈയിൽ സ്മൂത്തിംഗ്, ട്യൂണിംഗ്, ടൈമിംഗ്. <b>ടെസ്റ്റ്:</b> ആദ്യം ഡിസ്ചാർജ് ചെയ്യൂ, പിന്നെ അനലോഗ് ഓം-മീറ്ററിൽ സൂചി നോക്കൂ.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="A meter with a needle and a capacitor under test"><path d="M70 70A60 60 0 0 1 190 70" fill="none" stroke="var(--mut)" stroke-width="2"/><path d="M130 70L110 28" stroke="var(--no)" stroke-width="3"/><rect x="220" y="30" width="30" height="40" rx="5" fill="#2a6fdb"/></svg>`,
 play:L('Pick a capacitor condition. Press Test. Watch the needle.','कैपेसिटर की कंडीशन चुनो। Test दबाओ। सुई देखो।','കപ്പാസിറ്ററിന്റെ കണ്ടീഷൻ തിരഞ്ഞെടുക്കൂ. Test അമർത്തൂ. സൂചി നോക്കൂ.'),
 pred:{q:L('On the ohm-meter the needle jumps to 0 and stays there. The capacitor is …','ओहम-मीटर पर सुई 0 पर जाकर रुक गई। कैपेसिटर है …','ഓം-മീറ്ററിൽ സൂചി 0-ൽ പോയി നിന്നു. കപ്പാസിറ്റർ …'),o:[L('shorted','शॉर्ट','ഷോർട്ട്'),L('good','अच्छा','നല്ലത്'),L('open','ओपन','ഓപ്പൺ')],a:0,why:L('A good one kicks and then returns. Staying at 0 means the plates are touching.','अच्छा वाला झटका मारकर लौटता है। 0 पर रुकना मतलब प्लेट छू रही हैं।','നല്ലത് ചാടി തിരിച്ചുവരും. 0-ൽ നിൽക്കുന്നത് പ്ലേറ്റ് തൊടുന്നു എന്നാണ്.')},
 labels:['farad','dielec'],hints:['qit'],
 note:L('Safety: discharge a large capacitor through a resistor before touching it. Never short it with a screwdriver. Motor and PF capacitors can hold a shock for minutes.','सेफ्टी: बड़े कैपेसिटर को छूने से पहले रेसिस्टर से डिस्चार्ज करो। कभी स्क्रूड्राइवर से शॉर्ट न करो। मोटर और PF कैपेसिटर मिनटों तक झटका रख सकते हैं।','സേഫ്റ്റി: വലിയ കപ്പാസിറ്റർ തൊടുന്നതിന് മുമ്പ് റെസിസ്റ്റർ വഴി ഡിസ്ചാർജ് ചെയ്യൂ. ഒരിക്കലും സ്ക്രൂഡ്രൈവർ കൊണ്ട് ഷോർട്ട് ചെയ്യരുത്. മോട്ടോർ, PF കപ്പാസിറ്ററുകൾ മിനിറ്റുകളോളം ഷോക്ക് പിടിക്കാം.'),
 trick:L('Kick and return: good.','झटका और वापसी: अच्छा।','ചാടി തിരിച്ചുവരവ്: നല്ലത്.'),
 check:{q:L('The needle does not move at all. The capacitor is …','सुई बिल्कुल नहीं हिलती। कैपेसिटर है …','സൂചി ഒട്ടും അനങ്ങുന്നില്ല. കപ്പാസിറ്റർ …'),o:[L('open (no charging)','ओपन (चार्ज नहीं होता)','ഓപ്പൺ (ചാർജ് ആകുന്നില്ല)'),L('good','अच्छा','നല്ലത്')],a:0},
 build(w,api){
  w.innerHTML=S(420,210,`<g id="a"></g>`,'An analogue ohm-meter needle reacting to a capacitor under test');
  const rd=mkRd(w),c=mkCtl(w);let sel=0,tt=99;
  CST.forEach((s2,i)=>button(c,L(s2.n[0],s2.n[1],s2.n[2]),()=>{sel=i;$$('.btn',c).forEach((x,j)=>{if(j<4)x.classList.toggle('on',j===i)});tt=99;api.redraw()},i?'':'on'));
  button(c,L('Test','टेस्ट','ടെസ്റ്റ്'),()=>{tt=0;api.redraw()},'on');
  api.setReplay(()=>{tt=99});
  return(t,dt)=>{if(tt<99)tt+=dt;
   const k=CST[sel].k;let a=-50;/* -50 = infinity, +50 = zero */
   if(tt<99){const u=tt;
    if(k==='good')a=-50+100*Math.exp(-Math.pow(u*2.2-0,1))*(u<.4?u/.4:1)*(u<.4?1:1);
    if(k==='short')a=-50+100*Math.min(1,u*5);
    if(k==='open')a=-50;
    if(k==='leak')a=-50+(u<.4?100*u/.4:100*(.45+.55*Math.exp(-(u-.4)*2))*0+ (45+55*Math.exp(-(u-.4)*3)));
    if(k==='good'&&u>=.4)a=-50+100*Math.exp(-(u-.4)*1.3);
    if(k==='good'&&u<.4)a=-50+100*u/.4;
    if(k==='leak'&&u<.4)a=-50+100*u/.4;
    if(k==='leak'&&u>=.4)a=-50+(40+60*Math.exp(-(u-.4)*3))}
   let s=`<g transform="translate(210 170)"><path d="M-130 0A130 130 0 0 1 130 0" fill="none" stroke="var(--mut)" stroke-width="2.5"/><text x="-136" y="-8" class="tx s">∞</text><text x="124" y="-8" class="tx s">0</text><text x="0" y="-136" text-anchor="middle" class="tx s">Ω</text><g transform="rotate(${a.toFixed(1)})"><path d="M0 0L0 -118" stroke="var(--no)" stroke-width="4" stroke-linecap="round"/></g><circle r="6" fill="var(--fg)"/></g>`;
   put($('#a',w),s);
   setRd(rd,`<span><b>${BI(CST[sel].n[0],CST[sel].n[1],CST[sel].n[2])}</b>: ${BI(CST[sel].d[0],CST[sel].d[1],CST[sel].d[2])}</span>`)}}});

 {sp:['A 12 V relay will not pull in. The coil is 24 Ω. The battery reads 12 V.','12 V रिले पुल-इन नहीं होता। कॉइल 24 Ω है। बैटरी 12 V दिखाती है।','12 V റിലേ പുൾ-ഇൻ ആകുന്നില്ല. കോയിൽ 24 Ω. ബാറ്ററി 12 V കാണിക്കുന്നു.'],
  pic:(p,sv)=>fpic([{x:30,y:22,w:90,h:70,t:['Battery','बैटरी','ബാറ്ററി']},{x:150,y:22,w:100,h:70,t:['Terminal','टर्मिनल','ടെർമിനൽ']},{x:280,y:22,w:90,h:70,t:['Relay coil','रिले कॉइल','റിലേ കോയിൽ']}],p===1?1:p===2?2:-1,sv),
  tests:[[['Battery voltage','बैटरी वोल्टेज','ബാറ്ററി വോൾട്ടേജ്'],'12 V'],[['Voltage across the coil','कॉइल पर वोल्टेज','കോയിലിന് കുറുകെ വോൾട്ടേജ്'],'6 V'],[['Voltage across one terminal','एक टर्मिनल पर वोल्टेज','ഒരു ടെർമിനലിന് കുറുകെ വോൾട്ടേജ്'],'6 V']],
  o:[['A loose terminal with high resistance','ढीला टर्मिनल, हाई रेसिस्टेंस','ലൂസ് ടെർമിനൽ, ഹൈ റെസിസ്റ്റൻസ്'],['The coil is open','कॉइल ओपन है','കോയിൽ ഓപ്പൺ ആണ്'],['The battery is reversed','बैटरी उल्टी है','ബാറ്ററി തിരിഞ്ഞു']],a:0,
  why:['12 V in, 6 V on the coil, so 6 V is lost at the terminal. I = 6 ÷ 24 = 0.25 A, so the terminal is also 24 Ω. A relay needs the full ampere-turns. Tighten and clean it.','12 V इनपुट, कॉइल पर 6 V, यानी 6 V टर्मिनल पर गया। I = 6 ÷ 24 = 0.25 A, तो टर्मिनल भी 24 Ω। रिले को पूरे एम्पियर-टर्न चाहिए। कसो और साफ करो।','12 V ഇൻ, കോയിലിൽ 6 V, അതായത് 6 V ടെർമിനലിൽ നഷ്ടം. I = 6 ÷ 24 = 0.25 A, അതിനാൽ ടെർമിനലും 24 Ω. റിലേയ്ക്ക് പൂർണ്ണ ആമ്പിയർ-ടേൺ വേണം. മുറുക്കി വൃത്തിയാക്കൂ.']},
 {sp:['Two capacitors in series across 160 V: one 10 µF and one 40 µF, both rated 100 V. The 10 µF fails.','160 V पर सीरीज़ में दो कैपेसिटर: 10 µF और 40 µF, दोनों 100 V रेटेड। 10 µF फेल हो गया।','160 V-ന് കുറുകെ സീരീസിൽ രണ്ട് കപ്പാസിറ്റർ: 10 µF, 40 µF, രണ്ടും 100 V റേറ്റഡ്. 10 µF പരാജയപ്പെട്ടു.'],
  pic:(p,sv)=>fpic([{x:30,y:22,w:100,h:70,t:['10 µF','10 µF','10 µF']},{x:150,y:22,w:100,h:70,t:['40 µF','40 µF','40 µF']},{x:270,y:22,w:100,h:70,t:['160 V','160 V','160 V']}],p===0?0:p===1?1:-1,sv),
  tests:[[['Voltage across the 10 µF','10 µF पर वोल्टेज','10 µF-ന് കുറുകെ വോൾട്ടേജ്'],'128 V'],[['Voltage across the 40 µF','40 µF पर वोल्टेज','40 µF-ന് കുറുകെ വോൾട്ടേജ്'],'32 V'],[['Ratings','रेटिंग','റേറ്റിംഗ്'],['Both 100 V','दोनों 100 V','രണ്ടും 100 V']]],
  o:[['Unequal series: the smaller C takes the bigger share','अनइक्वल सीरीज़: छोटा C बड़ा हिस्सा लेता है','അസമ സീരീസ്: ചെറിയ C വലിയ പങ്ക് എടുക്കുന്നു'],['The 40 µF is too small','40 µF बहुत छोटा है','40 µF വളരെ ചെറുത്'],['The supply is AC','सप्लाई AC है','സപ്ലൈ AC ആണ്']],a:0,
  why:['V₁ = 160 × 40 ÷ 50 = 128 V, above the 100 V rating. Use equal parts, or add parts with higher ratings.','V₁ = 160 × 40 ÷ 50 = 128 V, 100 V रेटिंग से ऊपर। बराबर पार्ट लगाओ, या ज़्यादा रेटिंग वाले पार्ट जोड़ो।','V₁ = 160 × 40 ÷ 50 = 128 V, 100 V റേറ്റിംഗിന് മുകളിൽ. തുല്യ പാർട്ടുകൾ ഉപയോഗിക്കൂ, അല്ലെങ്കിൽ ഉയർന്ന റേറ്റിംഗ് ഉള്ളവ ചേർക്കൂ.']}];

   const dg=h('div');dg.hidden=!sv[mi];sideTop.appendChild(dg);
   dg.appendChild(h('div','beat',RD('Your diagnosis','आपका डायग्नोसिस','നിങ്ങളുടെ ഡയഗ്നോസിസ്')));
   const os=h('div','opts');dg.appendChild(os);const fb=h('div','fb');fb.setAttribute('aria-live','polite');dg.appendChild(fb);const nx=h('div');dg.appendChild(nx);

    nx.innerHTML='';const bt=h('button','btn big on');bt.type='button';bt.innerHTML=(mi<4?RD('Next mission','नेक्स्ट मिशन','നെക്സ്റ്റ് മിഷൻ'):RD('Finish','फिनिश','ഫിനിഷ്'))+' →';bt.onclick=()=>{if(mi<4){mi++;show()}else{finish()}};nx.appendChild(bt)};
   m.o.forEach((o,k)=>{const b=h('button','opt',B3(o));b.type='button';b.onclick=()=>{if(k===m.a){sv[mi]=1;save();award(10,'fm'+mi,P.chk);done()}else{b.classList.add('wrong');b.disabled=true;fb.className='fb no';fb.innerHTML=ICO.no+' '+UIB('again')}};os.appendChild(b)});

  const finish=()=>{sideTop.innerHTML='';rd.innerHTML='';pic.innerHTML='';fin.hidden=false;fin.innerHTML='';
   fin.appendChild(h('div','beat',RD('All 5 missions done','सभी 5 मिशन पूरे','5 മിഷനും പൂർത്തിയായി')));
   fin.appendChild(h('div','trick',`<small>${term('rem')}</small>${B3(['Measure first. Then decide.','पहले मापो। फिर फैसला करो।','ആദ്യം അളക്കൂ. പിന്നെ തീരുമാനിക്കൂ.'])}`));
   fin.appendChild(checkBlock(SL.find(x=>x.id==='m_fault')));
   const nb=h('button','btn big on');nb.type='button';nb.innerHTML=UIB('nx')+' →';nb.onclick=()=>go(cur+1);fin.appendChild(nb)};
  const firstOpen=[0,1,2,3,4].findIndex(i=>!sv[i]);mi=firstOpen<0?4:firstOpen;

CS({id:'m_viva',menu:'Viva flip-cards',kind:'def',title:'viva',wide:true,hk:undefined,page(w,s,api){
  const C=(q,a)=>[L(q[0],q[1],q[2]),L(a[0],a[1],a[2])];
  flipDeck(w,api,[
   {name:L('L1 Fact','L1 फैक्ट','L1 ഫാക്ട്'),cards:[
    C(['State the law of magnetic poles.','मैग्नेटिक पोल का नियम बताओ।','മാഗ്നറ്റിക് പോളിന്റെ നിയമം പറയൂ.'],['Like poles repel. Unlike poles attract.','समान पोल दूर भागते हैं। असमान पोल खिंचते हैं।','ഒരേ പോൾ വികർഷിക്കും. വ്യത്യസ്ത പോൾ ആകർഷിക്കും.']),
    C(['Name four magnetic materials.','चार मैग्नेटिक मटीरियल के नाम बताओ।','നാല് മാഗ്നറ്റിക് മെറ്റീരിയൽ പേര് പറയൂ.'],['Iron, steel, nickel, cobalt.','आयरन, स्टील, निकल, कोबाल्ट।','ഇരുമ്പ്, സ്റ്റീൽ, നിക്കൽ, കോബാൾട്ട്.']),
    C(['What is Faraday’s law?','फैराडे का लॉ क्या है?','ഫാരഡേയുടെ ലോ എന്താണ്?'],['A changing flux linked with a coil induces an EMF: e = N × ΔΦ ÷ Δt.','कॉइल से जुड़ा बदलता फ्लक्स EMF इंड्यूस करता है: e = N × ΔΦ ÷ Δt।','കോയിലുമായി ബന്ധിപ്പിച്ച മാറുന്ന ഫ്ലക്സ് EMF ഇൻഡ്യൂസ് ചെയ്യും: e = N × ΔΦ ÷ Δt.']),
    C(['What is the unit of inductance and of capacitance?','इंडक्टेंस और कैपेसिटेंस की यूनिट?','ഇൻഡക്ടൻസിന്റെയും കപ്പാസിറ്റൻസിന്റെയും യൂണിറ്റ്?'],['Henry (H) and farad (F).','हेनरी (H) और फैराड (F)।','ഹെൻറി (H), ഫാരഡ് (F).']),
    C(['What is the formula for the time constants?','टाइम कॉन्स्टेंट के फॉर्मूले?','ടൈം കോൺസ്റ്റന്റിന്റെ ഫോർമുലകൾ?'],['τ = L ÷ R for a coil, τ = R × C for a capacitor, both in seconds.','कॉइल के लिए τ = L ÷ R, कैपेसिटर के लिए τ = R × C, दोनों सेकंड में।','കോയിലിന് τ = L ÷ R, കപ്പാസിറ്ററിന് τ = R × C, രണ്ടും സെക്കൻഡിൽ.'])]},
   {name:L('L2 Why / How','L2 क्यों / कैसे','L2 എന്തുകൊണ്ട് / എങ്ങനെ'),cards:[
    C(['Why is soft iron used for relay and transformer cores?','रिले और ट्रांसफॉर्मर कोर के लिए सॉफ्ट आयरन क्यों?','റിലേ, ട്രാൻസ്ഫോർമർ കോറിന് സോഫ്റ്റ് അയൺ എന്തിന്?'],['It magnetises easily and demagnetises at once, so the relay releases and energy is not wasted.','यह आसानी से मैग्नेटाइज़ और तुरंत डिमैग्नेटाइज़ होता है, इसलिए रिले रिलीज़ होता है और एनर्जी बर्बाद नहीं होती।','ഇത് എളുപ്പം മാഗ്നറ്റൈസ് ആകുകയും ഉടൻ ഡീമാഗ്നറ്റൈസ് ആകുകയും ചെയ്യും, അതിനാൽ റിലേ റിലീസ് ആകും, എനർജി പാഴാകില്ല.']),
    C(['Why does a transformer not work on DC?','ट्रांसफॉर्मर DC पर क्यों नहीं चलता?','ട്രാൻസ്ഫോർമർ DC-യിൽ പ്രവർത്തിക്കാത്തത് എന്തുകൊണ്ട്?'],['Steady DC gives steady flux. No flux change, no induced EMF in the secondary.','स्थिर DC से स्थिर फ्लक्स। फ्लक्स नहीं बदलता, सेकंडरी में EMF नहीं।','സ്ഥിര DC സ്ഥിര ഫ്ലക്സ് തരും. ഫ്ലക്സ് മാറുന്നില്ല, സെക്കൻഡറിയിൽ EMF ഇല്ല.']),
    C(['Why does a spark appear when an inductive circuit is switched off?','इंडक्टिव सर्किट बंद करने पर चिंगारी क्यों?','ഇൻഡക്ടീവ് സർക്യൂട്ട് ഓഫ് ചെയ്യുമ്പോൾ സ്പാർക്ക് എന്തിന്?'],['The coil fights the fall in current by inducing a high EMF (self-induction). It jumps across the opening contacts.','कॉइल करंट गिरने का विरोध बड़ा EMF बनाकर करती है (सेल्फ-इंडक्शन)। वह खुलते कॉन्टैक्ट पर कूदता है।','കറന്റ് കുറയുന്നതിനെ കോയിൽ ഉയർന്ന EMF ഉണ്ടാക്കി എതിർക്കും (സെൽഫ്-ഇൻഡക്ഷൻ). അത് തുറക്കുന്ന കോൺടാക്ടിൽ ചാടും.']),
    C(['Why does C add in parallel but fall in series?','C पैरेलल में क्यों जुड़ता है पर सीरीज़ में घटता है?','C പാരലലിൽ കൂടുകയും സീരീസിൽ കുറയുകയും ചെയ്യുന്നത് എന്തുകൊണ്ട്?'],['Parallel adds plate area. Series adds gap. More area, more C. More gap, less C.','पैरेलल में प्लेट एरिया जुड़ता है। सीरीज़ में गैप जुड़ता है। ज़्यादा एरिया, ज़्यादा C। ज़्यादा गैप, कम C।','പാരലലിൽ പ്ലേറ്റ് ഏരിയ കൂടും. സീരീസിൽ ഗ്യാപ് കൂടും. ഏരിയ കൂടിയാൽ C കൂടും. ഗ്യാപ് കൂടിയാൽ C കുറയും.']),
    C(['How does Lenz’s law agree with conservation of energy?','लेंज़ का लॉ ऊर्जा संरक्षण से कैसे मिलता है?','ലെൻസ് ലോ ഊർജ്ജ സംരക്ഷണവുമായി എങ്ങനെ യോജിക്കുന്നു?'],['You do work against the opposing force. That work becomes the electrical energy.','आप विरोधी फोर्स के खिलाफ काम करते हैं। वही काम इलेक्ट्रिकल एनर्जी बनता है।','നിങ്ങൾ എതിർ ഫോഴ്സിനെതിരെ ജോലി ചെയ്യുന്നു. ആ ജോലി ഇലക്ട്രിക്കൽ എനർജി ആകുന്നു.'])]},
   {name:L('L3 Workshop','L3 वर्कशॉप','L3 വർക്ക്ഷോപ്പ്'),cards:[
    C(['A ceiling fan hums but does not start. What do you check?','सीलिंग फैन गुनगुनाता है पर स्टार्ट नहीं होता। क्या चेक करोगे?','സീലിംഗ് ഫാൻ മൂളുന്നു, സ്റ്റാർട്ട് ആകുന്നില്ല. എന്ത് ചെക്ക് ചെയ്യും?'],['Supply first, then the winding resistance, then the capacitor with an ohm-meter. No needle kick means an open capacitor. Replace with the same µF and voltage.','पहले सप्लाई, फिर वाइंडिंग रेसिस्टेंस, फिर ओहम-मीटर से कैपेसिटर। सुई में झटका नहीं मतलब कैपेसिटर ओपन। उतना ही µF और वोल्टेज लगाओ।','ആദ്യം സപ്ലൈ, പിന്നെ വൈൻഡിംഗ് റെസിസ്റ്റൻസ്, പിന്നെ ഓം-മീറ്ററിൽ കപ്പാസിറ്റർ. സൂചി ചാടുന്നില്ലെങ്കിൽ ഓപ്പൺ കപ്പാസിറ്റർ. അതേ µF-ഉം വോൾട്ടേജും ഉള്ളത് ഇടൂ.']),
    C(['A choke is hot and buzzing. How do you confirm shorted turns?','चोक गर्म और भनभना रहा है। शॉर्टेड टर्न कैसे कन्फर्म करोगे?','ചോക്ക് ചൂടായി മൂളുന്നു. ഷോർട്ടഡ് ടേൺ എങ്ങനെ ഉറപ്പിക്കും?'],['Switch off and measure its resistance. A value far below the nameplate means shorted turns. Replace the choke.','स्विच ऑफ करके रेसिस्टेंस मापो। नेमप्लेट से बहुत कम वैल्यू मतलब शॉर्टेड टर्न। चोक बदलो।','സ്വിച്ച് ഓഫ് ചെയ്ത് റെസിസ്റ്റൻസ് അളക്കൂ. നെയിംപ്ലേറ്റിനേക്കാൾ വളരെ കുറഞ്ഞ വില എന്നാൽ ഷോർട്ടഡ് ടേൺ. ചോക്ക് മാറ്റൂ.']),
    C(['How do you safely handle a large motor capacitor?','बड़े मोटर कैपेसिटर को सुरक्षित कैसे हैंडल करोगे?','വലിയ മോട്ടോർ കപ്പാസിറ്റർ സുരക്ഷിതമായി എങ്ങനെ കൈകാര്യം ചെയ്യും?'],['Isolate, wait, then discharge through a resistor. Never short it with a screwdriver.','आइसोलेट करो, रुको, फिर रेसिस्टर से डिस्चार्ज करो। स्क्रूड्राइवर से कभी शॉर्ट न करो।','ഐസൊലേറ്റ് ചെയ്യൂ, കാത്തിരിക്കൂ, പിന്നെ റെസിസ്റ്റർ വഴി ഡിസ്ചാർജ് ചെയ്യൂ. സ്ക്രൂഡ്രൈവർ കൊണ്ട് ഒരിക്കലും ഷോർട്ട് ചെയ്യരുത്.']),
    C(['A relay coil is 24 Ω on 12 V but will not pull in. What may be wrong?','24 Ω की रिले कॉइल 12 V पर पुल-इन नहीं होती। क्या गड़बड़ हो सकती है?','24 Ω റിലേ കോയിൽ 12 V-ൽ പുൾ-ഇൻ ആകുന്നില്ല. എന്താകാം തകരാർ?'],['Measure the voltage on the coil. A low value means voltage is lost at a loose terminal. Clean and tighten it.','कॉइल पर वोल्टेज मापो। कम वैल्यू मतलब ढीले टर्मिनल पर वोल्टेज गया। साफ करके कसो।','കോയിലിലെ വോൾട്ടേജ് അളക്കൂ. കുറഞ്ഞ വില എന്നാൽ ലൂസ് ടെർമിനലിൽ വോൾട്ടേജ് നഷ്ടപ്പെടുന്നു. വൃത്തിയാക്കി മുറുക്കൂ.'])]}],'m5aviva')}});

/* ---------- 28 Interview ---------- */
CS({id:'m_intv',menu:'Interview cards',kind:'law',title:'interview',wide:true,hk:undefined,page(w,s,api){
  const C=(q,a)=>[L(q[0],q[1],q[2]),L(a[0],a[1],a[2])];
  flipDeck(w,api,[{name:L('Interview','इंटरव्यू','ഇന്റർവ്യൂ'),cards:[
   C(['Explain a relay in one minute.','एक मिनट में रिले समझाओ।','ഒരു മിനിറ്റിൽ റിലേ വിശദീകരിക്കൂ.'],['A coil on a soft iron core. Small current makes an electromagnet that pulls an armature and closes contacts for a bigger load. On switch-off the core drops its magnetism and a spring releases it.','सॉफ्ट आयरन कोर पर कॉइल। छोटा करंट इलेक्ट्रोमैग्नेट बनाता है जो आर्मेचर खींचकर बड़े लोड के कॉन्टैक्ट बंद करता है। स्विच ऑफ पर कोर मैग्नेटिज़्म छोड़ देता है और स्प्रिंग रिलीज़ करता है।','സോഫ്റ്റ് അയൺ കോറിൽ കോയിൽ. ചെറിയ കറന്റ് ഇലക്ട്രോമാഗ്നറ്റ് ആക്കി ആർമേച്ചർ വലിച്ച് വലിയ ലോഡിന്റെ കോൺടാക്ട് അടയ്ക്കുന്നു. സ്വിച്ച് ഓഫ് ചെയ്യുമ്പോൾ കോർ മാഗ്നറ്റിസം വിടുകയും സ്പ്രിംഗ് റിലീസ് ചെയ്യുകയും ചെയ്യും.']),
   C(['What is the use of a capacitor in a single-phase motor?','सिंगल-फेज़ मोटर में कैपेसिटर का क्या काम?','സിംഗിൾ-ഫേസ് മോട്ടോറിൽ കപ്പാസിറ്ററിന്റെ ഉപയോഗം?'],['It makes a second winding current lead the main one. That creates a rotating field for starting or running torque.','यह दूसरी वाइंडिंग का करंट मेन से आगे कर देता है। इससे रोटेटिंग फील्ड बनता है, स्टार्टिंग या रनिंग टॉर्क के लिए।','ഇത് രണ്ടാമത്തെ വൈൻഡിംഗിന്റെ കറന്റ് മെയിനിനേക്കാൾ മുന്നിലാക്കും. ഇത് സ്റ്റാർട്ടിംഗ് അല്ലെങ്കിൽ റണ്ണിംഗ് ടോർക്കിനായി റോട്ടേറ്റിംഗ് ഫീൽഡ് ഉണ്ടാക്കും.']),
   C(['Why is the transformer core laminated?','ट्रांसफॉर्मर कोर लैमिनेटेड क्यों होता है?','ട്രാൻസ്ഫോർമർ കോർ ലാമിനേറ്റഡ് ആകുന്നത് എന്തിന്?'],['Thin insulated sheets cut the eddy currents that would heat a solid core. Lower loss, cooler core.','पतली इंसुलेटेड शीट एडी करंट घटाती हैं जो ठोस कोर को गर्म करते। कम लॉस, ठंडा कोर।','നേർത്ത ഇൻസുലേറ്റഡ് ഷീറ്റുകൾ ഖര കോർ ചൂടാക്കുന്ന എഡ്ഡി കറന്റ് കുറയ്ക്കും. കുറഞ്ഞ നഷ്ടം, തണുത്ത കോർ.']),
   C(['Why does a capacitor appear as an open circuit to steady DC?','स्थिर DC के लिए कैपेसिटर ओपन सर्किट जैसा क्यों?','സ്ഥിര DC-ക്ക് കപ്പാസിറ്റർ ഓപ്പൺ സർക്യൂട്ട് പോലെ ആകുന്നത് എന്തുകൊണ്ട്?'],['The dielectric is an insulator. Once the plates are charged, no more current flows.','डाइइलेक्ट्रिक इंसुलेटर है। प्लेट चार्ज होने के बाद करंट नहीं बहता।','ഡൈഇലക്ട്രിക് ഇൻസുലേറ്റർ ആണ്. പ്ലേറ്റ് ചാർജ് ആയ ശേഷം കറന്റ് ഒഴുകില്ല.']),
   C(['How do you find the polarity of an electromagnet?','इलेक्ट्रोमैग्नेट की पोलैरिटी कैसे पता करोगे?','ഇലക്ട്രോമാഗ്നറ്റിന്റെ പോളാരിറ്റി എങ്ങനെ കണ്ടെത്തും?'],['Right-hand grip rule: fingers along the current, thumb points to N. Or use a compass.','राइट-हैंड ग्रिप रूल: उंगलियाँ करंट की दिशा में, अंगूठा N की तरफ़। या कंपास से।','റൈറ്റ്-ഹാൻഡ് ഗ്രിപ്പ് റൂൾ: വിരലുകൾ കറന്റ് ദിശയിൽ, തള്ളവിരൽ N-ലേക്ക്. അല്ലെങ്കിൽ കോമ്പസ് ഉപയോഗിക്കൂ.'])]}],'m5aintv')}});

/* ---------- 29 MCQ ---------- */
CS({id:'m_mcq',menu:'MCQ quiz',kind:'tip',title:'quiz',wide:true,hk:undefined,page(w,s,api){
  const Q=[
   [L('Two magnets repel when …','दो मैग्नेट कब दूर भागते हैं …','രണ്ട് മാഗ്നറ്റ് വികർഷിക്കുന്നത് …'),[L('like poles face each other','समान पोल आमने-सामने हों','ഒരേ പോൾ മുഖാമുഖം'),L('unlike poles face each other','असमान पोल आमने-सामने हों','വ്യത്യസ്ത പോൾ മുഖാമുഖം'),L('the gap is large','गैप बड़ा हो','ഗ്യാപ് വലുത്'),L('both are steel','दोनों स्टील के हों','രണ്ടും സ്റ്റീൽ')],0,L('Like poles repel.','समान पोल दूर भागते हैं।','ഒരേ പോൾ വികർഷിക്കും.')],
   [L('A coil has 250 turns and carries 4 A. Ampere-turns = ?','कॉइल में 250 टर्न और 4 A है। एम्पियर-टर्न = ?','കോയിലിൽ 250 ടേൺ, 4 A. ആമ്പിയർ-ടേൺ = ?'),['1000 AT','254 AT','62.5 AT','1 AT'],0,L('250 × 4 = 1000.','250 × 4 = 1000।','250 × 4 = 1000.')],
   [L('A coil of 200 turns has a flux change of 0.02 Wb in 0.1 s. EMF = ?','200 टर्न की कॉइल में 0.1 s में 0.02 Wb फ्लक्स बदलाव। EMF = ?','200 ടേൺ കോയിലിൽ 0.1 s-ൽ 0.02 Wb ഫ്ലക്സ് മാറ്റം. EMF = ?'),['40 V','4 V','0.4 V','400 V'],0,L('200 × 0.02 ÷ 0.1 = 40 V.','200 × 0.02 ÷ 0.1 = 40 V।','200 × 0.02 ÷ 0.1 = 40 V.')],
   [L('Lenz’s law says the induced current …','लेंज़ का लॉ कहता है इंड्यूस्ड करंट …','ലെൻസ് ലോ പറയുന്നു ഇൻഡ്യൂസ്ഡ് കറന്റ് …'),[L('opposes the change that causes it','उसे बनाने वाले बदलाव का विरोध करता है','അതിനെ ഉണ്ടാക്കുന്ന മാറ്റത്തെ എതിർക്കും'),L('helps the change','बदलाव की मदद करता है','മാറ്റത്തെ സഹായിക്കും'),L('is always zero','हमेशा शून्य है','എപ്പോഴും പൂജ്യം'),L('is always DC','हमेशा DC है','എപ്പോഴും DC')],0,L('Induced effects oppose their cause.','इंड्यूस्ड असर अपने कारण का विरोध करता है।','ഇൻഡ്യൂസ്ഡ് ഫലം അതിന്റെ കാരണത്തെ എതിർക്കും.')],
   [L('A 10 µF capacitor is charged to 50 V. Q = ?','10 µF कैपेसिटर 50 V तक चार्ज है। Q = ?','10 µF കപ്പാസിറ്റർ 50 V-ലേക്ക് ചാർജ് ചെയ്തു. Q = ?'),['500 µC','5 µC','60 µC','0.2 µC'],0,L('Q = C × V = 10 × 50 = 500 µC.','Q = C × V = 10 × 50 = 500 µC।','Q = C × V = 10 × 50 = 500 µC.')],
   [L('Three 30 µF capacitors are connected in series. Total C = ?','तीन 30 µF कैपेसिटर सीरीज़ में। टोटल C = ?','മൂന്ന് 30 µF കപ്പാസിറ്റർ സീരീസിൽ. ടോട്ടൽ C = ?'),['10 µF','90 µF','30 µF','270 µF'],0,L('Equal parts in series: 30 ÷ 3 = 10 µF.','बराबर पार्ट सीरीज़ में: 30 ÷ 3 = 10 µF।','തുല്യ പാർട്ടുകൾ സീരീസിൽ: 30 ÷ 3 = 10 µF.')],
   [L('R = 2 kΩ and C = 500 µF. Time constant τ = ?','R = 2 kΩ और C = 500 µF। टाइम कॉन्स्टेंट τ = ?','R = 2 kΩ, C = 500 µF. ടൈം കോൺസ്റ്റന്റ് τ = ?'),['1 s','1000 s','0.25 s','10 s'],0,L('τ = 2000 × 0.0005 = 1 s.','τ = 2000 × 0.0005 = 1 s।','τ = 2000 × 0.0005 = 1 s.')]];
  const sv=P.quizM||(P.quizM={});let i=0,score=0,done=false;
  const draw=()=>{if(i>=Q.length){const best=Math.max(sv.best||0,score);sv.best=best;save();

  draw()}});
