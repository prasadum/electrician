html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:400 16px/1.35 NL,NG,NM,ND,NK,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bar{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.bar .ttl{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{min-width:44px;min-height:44px;padding:0 12px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--def);border-color:var(--def);color:#fff}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--def);outline-offset:2px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-width:44px;min-height:44px;border:0;background:var(--card);font-weight:700;font-size:14px;padding:0 8px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--def);color:#fff}
#prog{height:6px;background:var(--line);flex:none}#prog i{display:block;height:100%;width:0;background:var(--def);transition:width .25s}
#xp{font-weight:700;font-size:14px;color:var(--frm);display:none}
body.study #xp{display:inline}
#stage{flex:1;min-height:0;overflow:auto;display:flex;touch-action:pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.slide{margin:auto;width:100%;min-height:100%;display:grid;gap:10px;padding:10px 12px 14px;
  grid-template-columns:1fr;grid-template-areas:"head" "vis" "side";align-content:start}
.s-head{grid-area:head;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;border-left:8px solid var(--k);padding-left:10px}
.s-vis{grid-area:vis;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px;position:relative;min-width:0}
.s-vis svg{width:100%;height:auto;max-height:52vh;display:block;touch-action:pan-y pinch-zoom}
.s-side{grid-area:side;display:flex;flex-direction:column;gap:10px;min-width:0}
.kind-def{--k:var(--def);--kb:var(--def-bg)}.kind-law{--k:var(--law);--kb:var(--law-bg)}
.kind-formula{--k:var(--frm);--kb:var(--frm-bg)}.kind-warn{--k:var(--warn);--kb:var(--warn-bg)}.kind-tip{--k:var(--tip);--kb:var(--tip-bg)}
.kind-def .s-vis,.kind-law .s-vis,.kind-formula .s-vis,.kind-warn .s-vis,.kind-tip .s-vis{border-color:var(--k)}
.tag{font-size:14px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--kb);color:var(--k);border:1.5px solid var(--k);white-space:nowrap}
.tag.add{background:#fff6cf;color:#6a4b00;border-color:#d9a400}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tag.add{background:#3a3010;color:#ffd84a;border-color:#a98400}}
:root[data-theme=dark] .tag.add{background:#3a3010;color:#ffd84a;border-color:#a98400}
h2.term{margin:0;font-size:clamp(22px,5.4vw,30px);line-height:1.15}
.t .en{font-weight:700}.t .hi,.t .ml{display:block;font-size:14px;font-weight:400;color:var(--mut);line-height:1.25}
.t .hi,.t .ml{display:none}
h2.term .t .hi,h2.term .t .ml{display:none}
body[data-lang=hi] .t .hi,body[data-lang=all] .t .hi,body[data-lang=ml] .t .ml,body[data-lang=all] .t .ml{display:block}
body[data-lang=hi] h2.term .t .hi,body[data-lang=all] h2.term .t .hi,body[data-lang=ml] h2.term .t .ml,body[data-lang=all] h2.term .t .ml{display:inline;font-size:.7em;font-weight:400;color:var(--mut)}
h2.term .t .hi::before,h2.term .t .ml::before{content:' / ';color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--kb,var(--card));border:1.5px solid var(--k,var(--line));border-radius:10px;padding:6px 10px;font-size:16px;min-width:0}
.chip .sym{display:block;font-size:14px;color:var(--mut);font-weight:600}
.chip .sym sup,.chip .sym sub{font-size:inherit}
.hook{display:flex;gap:8px;align-items:center;font-weight:700;font-size:18px;background:var(--kb);border-radius:10px;padding:8px 10px;border:1.5px dashed var(--k)}
.hook small{font-size:14px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.beat{font-size:14px;font-weight:700;color:var(--mut);margin:0 0 4px}
.pred{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.pred .q{font-weight:700;font-size:18px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:48px;padding:6px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px;touch-action:manipulation;flex:1 1 auto;min-width:88px}

const INL=new Set(['I','B','SUB','SUP','EM','STRONG','SMALL']);
function wrapT(en,hi,ml){const sp=document.createElement('span');sp.className='t';sp.innerHTML=`<span class="en">${en}</span><span class="hi">${hi}</span><span class="ml">${ml}</span>`;return sp}
const SYM=new Set(['Vav','Vrms','Vpp','rms','sin','cos','tan','kWh','kVA','kVAR','kW','Vm','Em','rad','mm','kHz','MHz','Hz','mA','kΩ','MΩ','VAR','RMS','AC','DC','Wb']);
function needs(t){return (t.match(/[A-Za-z]{3,}/g)||[]).filter(w=>!SYM.has(w)).length>=1}
function autoT(root){if(!root)return;
 const els=[...root.querySelectorAll('*')];
 for(const e of els){if(!e.isConnected||e.closest('.t,svg,script,style,textarea'))continue;
  const kids=[...e.childNodes];if(!kids.length)continue;
  const simple=kids.every(n=>n.nodeType===3||(n.nodeType===1&&INL.has(n.tagName)&&[...n.querySelectorAll('*')].every(c=>INL.has(c.tagName))));
  if(simple){const txt=e.textContent;if(!norm(txt))continue;const r=xl(txt);
   if(r){const en=e.innerHTML;e.innerHTML='';e.appendChild(wrapT(en,r[0],r[1]));continue}
   if(needs(txt))MISS.add(norm(txt))
  }else{
   for(const n of kids){if(n.nodeType!==3)continue;const tx=n.textContent;if(!norm(tx))continue;const r=xl(tx);
    if(r){const sp=wrapT(tx.trim(),r[0],r[1]);n.replaceWith(document.createTextNode(' '),sp)}
    else if(needs(tx))MISS.add(norm(tx))}}}}
let xq=false;function xsched(){if(xq)return;xq=true;requestAnimationFrame(()=>{xq=false;autoT(document.getElementById('stage'))})}
function autoInit(){const st=document.getElementById('stage');if(!st||st.__xo)return;st.__xo=1;new MutationObserver(xsched).observe(st,{childList:true,subtree:true,characterData:true});xsched()}

/* ---- geometry helpers for flowing dots ---- */
function mkPath(pts){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,L,tot:L[L.length-1]}}
function at(P_,s){s=((s%1)+1)%1;const d=s*P_.tot;let i=1;while(i<P_.L.length-1&&P_.L[i]<d)i++;
  const a=P_.pts[i-1],b=P_.pts[i],k=(d-P_.L[i-1])/((P_.L[i]-P_.L[i-1])||1);return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]}

  const l=h('label'),id='s'+Math.random().toString(36).slice(2,7);
  l.innerHTML=`<span>${label} <span class="val"></span></span>`;
  const i=h('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=val;i.id=id;i.setAttribute('aria-label',label.replace(/<[^>]+>/g,''));
  const v=$('.val',l);const upd=()=>{v.textContent=fmt(+i.value)};
  i.addEventListener('input',()=>{upd();cb(+i.value)});upd();l.appendChild(i);host.appendChild(l);
  return{get:()=>+i.value,set:x=>{i.value=x;upd()},input:i}}

const NC='#d9362b',SC='#2a6fdb',CU='#c9793a',CUD='#7a431a',FE='#8e969f',FED='#4d555e';
const fm1=x=>{x=Math.abs(x);return x>=100?Math.round(x)+'':x>=10?(Math.round(x*10)/10)+'':(Math.round(x*100)/100)+''};
const arr=(x1,y1,x2,y2,c,sw)=>{const a=Math.atan2(y2-y1,x2-x1),l=9;c=c||'var(--fg)';sw=sw||3;
 return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${c}" stroke-width="${sw}" fill="none" stroke-linecap="round"/><path d="M${x2.toFixed(1)} ${y2.toFixed(1)}l${(-l*Math.cos(a-.5)).toFixed(1)} ${(-l*Math.sin(a-.5)).toFixed(1)}M${x2.toFixed(1)} ${y2.toFixed(1)}l${(-l*Math.cos(a+.5)).toFixed(1)} ${(-l*Math.sin(a+.5)).toFixed(1)}" stroke="${c}" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`};
/* bar magnet: N on the right half, S on the left half unless flip */
const magnet=(x,y,w,hh,flip,op)=>{const l=flip?NC:SC,r=flip?SC:NC,ll=flip?'N':'S',rl=flip?'S':'N';
 return `<g opacity="${op==null?1:op}"><rect x="${x}" y="${y}" width="${w/2}" height="${hh}" fill="${l}" stroke="#0007" stroke-width="1.5"/><rect x="${x+w/2}" y="${y}" width="${w/2}" height="${hh}" fill="${r}" stroke="#0007" stroke-width="1.5"/>
 <text x="${x+w/4}" y="${y+hh/2+6}" text-anchor="middle" fill="#fff" style="font:800 18px NL,sans-serif">${ll}</text><text x="${x+3*w/4}" y="${y+hh/2+6}" text-anchor="middle" fill="#fff" style="font:800 18px NL,sans-serif">${rl}</text></g>`};
/* compass needle, ang = degrees clockwise from screen-up */
const needle=(x,y,r,ang)=>`<g transform="translate(${x} ${y}) rotate(${ang.toFixed(1)})"><circle r="${r+5}" fill="var(--card)" stroke="var(--wire)" stroke-width="2.5"/><path d="M0 ${-r}L${r*.22} 0L${-r*.22} 0Z" fill="${NC}"/><path d="M0 ${r}L${r*.22} 0L${-r*.22} 0Z" fill="#9aa6b6"/><circle r="2.5" fill="var(--fg)"/></g>`;
/* coil drawn as n loops along x */
const coilH=(x,y,w,hh,n,sw)=>{let s='';const dx=w/n;for(let i=0;i<n;i++){const cx=x+dx*(i+.5);s+=`<ellipse cx="${cx.toFixed(1)}" cy="${y}" rx="${(dx*.42).toFixed(1)}" ry="${hh/2}" fill="none" stroke="${CU}" stroke-width="${sw||3}"/>`}return s};
const chipTxt=(x,y,t,cls)=>`<text x="${x}" y="${y}" class="tx ${cls||''}">${t}</text>`;

 hook:L('Two magnets on a table. One pulls, one pushes. Why?','टेबल पर दो मैग्नेट। एक खींचता है, एक धकेलता है। क्यों?','മേശപ്പുറത്ത് രണ്ട് മാഗ്നറ്റ്. ഒന്ന് വലിക്കുന്നു, ഒന്ന് തള്ളുന്നു. എന്തുകൊണ്ട്?'),
 defn:L('<b>Magnet:</b> a body that attracts iron. Every magnet has two <b>poles</b>, N and S. <b>Law of poles:</b> like poles repel, unlike poles attract.','<b>मैग्नेट:</b> वह बॉडी जो आयरन को खींचती है। हर मैग्नेट के दो <b>पोल</b> होते हैं, N और S। <b>पोल का नियम:</b> समान पोल दूर भागते हैं, असमान पोल खिंचते हैं।','<b>മാഗ്നറ്റ്:</b> ഇരുമ്പിനെ ആകർഷിക്കുന്ന ബോഡി. ഓരോ മാഗ്നറ്റിനും രണ്ട് <b>പോൾ</b>, N-ഉം S-ഉം. <b>പോളിന്റെ നിയമം:</b> ഒരേ പോൾ വികർഷിക്കും, വ്യത്യസ്ത പോൾ ആകർഷിക്കും.'),
 real:`<svg viewBox="0 0 300 120" role="img" aria-label="Two bar magnets with their poles labelled">${magnet(20,22,110,34,false)}${magnet(170,22,110,34,true)}${arr(135,39,165,39,'var(--ok)')}${arr(165,39,135,39,'var(--ok)')}${TT(150,100,'Unlike poles attract','असमान पोल खिंचते हैं','വ്യത്യസ്ത പോൾ ആകർഷിക്കും','m')}</svg>`,
 play:L('Press Flip magnet B. Drag the gap slider. Watch the arrows.','Flip magnet B दबाओ। गैप स्लाइडर खींचो। एरो देखो।','Flip magnet B അമർത്തൂ. ഗ്യാപ് സ്ലൈഡർ വലിക്കൂ. ആരോ നോക്കൂ.'),
 pred:{q:L('The N pole of magnet A faces the N pole of magnet B. What happens?','मैग्नेट A का N पोल मैग्नेट B के N पोल के सामने है। क्या होगा?','മാഗ്നറ്റ് A-യുടെ N പോൾ B-യുടെ N പോളിന് നേരെ. എന്ത് സംഭവിക്കും?'),o:[L('They repel','दूर भागेंगे','വികർഷിക്കും'),L('They attract','खिंचेंगे','ആകർഷിക്കും'),L('Nothing','कुछ नहीं','ഒന്നും ഇല്ല')],a:0,why:L('Like poles repel, just like like charges.','समान पोल दूर भागते हैं, समान चार्ज की तरह।','ഒരേ പോൾ വികർഷിക്കും, ഒരേ ചാർജ് പോലെ.')},
 labels:['magnet','pole'],hints:['chg'],
 trick:L('Like repel. Unlike attract.','लाइक दूर। अनलाइक पास।','ലൈക്ക് അകലും. അൺലൈക്ക് അടുക്കും.'),
 check:{q:L('Two bodies carry charge +Q and +Q. Like poles repel, so like charges …','दो बॉडी पर +Q और +Q चार्ज है। जैसे समान पोल दूर भागते हैं, वैसे समान चार्ज …','രണ്ട് ബോഡിയിൽ +Q, +Q ചാർജ്. ഒരേ പോൾ വികർഷിക്കുന്നതുപോലെ ഒരേ ചാർജ് …'),o:[L('repel','दूर भागते हैं','വികർഷിക്കും'),L('attract','खिंचते हैं','ആകർഷിക്കും')],a:0},
 build(w,api){
  w.innerHTML=S(400,78,`<g id="a" transform="translate(0 -52)"></g>`,'Magnet A fixed on the left and magnet B on the right, with force arrows');
  const rd=mkRd(w),c=mkCtl(w);let flip=false,gap=60,xb=0;
  button(c,L('Flip magnet B','मैग्नेट B पलटो','മാഗ്നറ്റ് B മറിക്കൂ'),()=>{flip=!flip;api.redraw()},'on');
  slider(c,L('Gap','गैप','ഗ്യാപ്'),20,120,5,60,x=>x+' mm',x=>{gap=x;api.redraw()});
  api.setReplay(()=>{flip=false});
  return(t,dt)=>{const rep=!flip;/* B right half is S when not flipped => A's N faces B's S ? */
   /* A: S left, N right (N faces B). B unflipped: S left => faces A's N => attract. flipped: N left => repel */
   const attract=!flip;const F=clamp(140/gap,.3,5);
   const target=gap;xb+=(target-xb)*Math.min(1,dt*6)||0;if(!xb)xb=target;
   const ax=30,aw=100,bx=130+xb;
   const mid=ax+aw+(bx-ax-aw)/2;
   const arrows=attract?arr(ax+aw+4,100,bx-4,100,'var(--ok)',3)+'':arr(ax+aw+14,100,ax+aw+14-18*F,100,'var(--no)',3)+arr(bx-14,100,bx-14+18*F,100,'var(--no)',3);
   put($('#a',w),magnet(ax,82,aw,36,false)+magnet(bx,82,aw,36,flip)+arrows+`<text x="${(ax+aw/2)}" y="62" class="tx s" text-anchor="middle">A</text><text x="${bx+aw/2}" y="62" class="tx s" text-anchor="middle">B</text>`);
   setRd(rd,`<span><b>${attract?RD('Attract','खिंचते हैं','ആകർഷിക്കുന്നു'):RD('Repel','दूर भागते हैं','വികർഷിക്കുന്നു')}</b></span><span>${RD('Force','फोर्स','ഫോഴ്സ്')} <b>${F<1?RD('weak','कमज़ोर','ദുർബലം'):F<2.5?RD('medium','मीडियम','ഇടത്തരം'):RD('strong','तगड़ा','ശക്തം')}</b></span><span class="note" style="margin:0">${RD('Closer gap, stronger force.','गैप कम तो फोर्स ज़्यादा।','ഗ്യാപ് കുറഞ്ഞാൽ ഫോഴ്സ് കൂടും.')}</span>`)}}});

/* ---------- 4 Field lines ---------- */
CS({id:'m_field',menu:'Magnetic field lines',title:'t_field',
 flash:FB('Poles N and S (slide 3)','पोल N और S (स्लाइड 3)','പോളുകൾ N, S (സ്ലൈഡ് 3)'),
 hook:L('Iron filings on paper. They draw a picture of the invisible.','पेपर पर आयरन फाइलिंग। वे अनदेखे की तस्वीर बनाती हैं।','പേപ്പറിലെ ഇരുമ്പ് പൊടി. കാണാത്തതിന്റെ ചിത്രം വരയ്ക്കുന്നു.'),
 defn:L('<b>Magnetic field:</b> the space around a magnet where its force acts. <b>Field lines</b> show it. They leave N, enter S, and never cross.','<b>मैग्नेटिक फील्ड:</b> मैग्नेट के चारों ओर की जगह जहाँ उसका फोर्स काम करता है। <b>फील्ड लाइन</b> इसे दिखाती हैं। N से निकलती हैं, S में जाती हैं, कभी क्रॉस नहीं होतीं।','<b>മാഗ്നറ്റിക് ഫീൽഡ്:</b> മാഗ്നറ്റിന് ചുറ്റും അതിന്റെ ഫോഴ്സ് പ്രവർത്തിക്കുന്ന സ്ഥലം. <b>ഫീൽഡ് ലൈനുകൾ</b> അത് കാണിക്കുന്നു. N-ൽ നിന്ന് പുറപ്പെട്ട് S-ൽ കയറും, ഒരിക്കലും ക്രോസ് ചെയ്യില്ല.'),
 real:`<svg viewBox="0 0 300 120" role="img" aria-label="Field lines of a bar magnet">${fieldPaths(150,60,40,[.8,1.3]).map(p=>`<path d="${p}" fill="none" stroke="var(--def)" stroke-width="2.4"/>`).join('')}${magnet(110,46,80,28,false)}</svg>`,
 play:L('Slide the compass round the magnet. Watch the red end.','कंपास को मैग्नेट के चारों ओर सरकाओ। लाल सिरा देखो।','കോമ്പസ് മാഗ്നറ്റിന് ചുറ്റും നീക്കൂ. ചുവന്ന അറ്റം നോക്കൂ.'),
 pred:{q:L('Outside the magnet, a compass red end points towards which pole?','मैग्नेट के बाहर कंपास का लाल सिरा किस पोल की तरफ़ होता है?','മാഗ്നറ്റിന് പുറത്ത് കോമ്പസിന്റെ ചുവന്ന അറ്റം ഏത് പോളിന് നേരെ?'),o:[L('Towards the S pole','S पोल की तरफ़','S പോളിന് നേരെ'),L('Towards the N pole','N पोल की तरफ़','N പോളിന് നേരെ'),L('Any way','किसी भी तरफ़','ഏത് ദിശയിലും')],a:0,why:L('The compass N follows the field direction: from N pole round to S pole.','कंपास का N फील्ड की दिशा में चलता है: N पोल से घूमकर S पोल की तरफ़।','കോമ്പസ് N ഫീൽഡ് ദിശയിൽ: N പോളിൽ നിന്ന് S പോളിലേക്ക്.')},
 labels:['magnet','pole'],hints:['chg'],
 note:L('Inside the magnet the lines run from S to N. So each line is a closed loop.','मैग्नेट के अंदर लाइन S से N जाती हैं। इसलिए हर लाइन बंद लूप है।','മാഗ്നറ്റിനുള്ളിൽ ലൈനുകൾ S-ൽ നിന്ന് N-ലേക്ക്. അതിനാൽ ഓരോ ലൈനും അടഞ്ഞ ലൂപ്പ് ആണ്.'),
 trick:L('Out of N, into S, closed loops.','N से बाहर, S में अंदर, बंद लूप।','N-ൽ നിന്ന് പുറത്ത്, S-ൽ അകത്ത്, അടഞ്ഞ ലൂപ്പ്.'),
 check:{q:L('Field lines act like a circuit path. The “current” of flux leaves N and returns through …','फील्ड लाइन सर्किट पाथ जैसी हैं। फ्लक्स N से निकलकर वापस आता है …','ഫീൽഡ് ലൈനുകൾ സർക്യൂട്ട് പാത്ത് പോലെ. ഫ്ലക്സ് N-ൽ നിന്ന് പുറപ്പെട്ട് മടങ്ങുന്നത് …'),o:[L('the magnet itself (closed loop)','मैग्नेट के अंदर से (बंद लूप)','മാഗ്നറ്റിനുള്ളിലൂടെ (അടഞ്ഞ ലൂപ്പ്)'),L('nowhere, it ends at S','कहीं नहीं, S पर खत्म','എവിടെയുമല്ല, S-ൽ അവസാനിക്കും')],a:0},
 build(w,api){
  w.innerHTML=S(420,165,`<g transform="translate(0 -35)"><g id="fl"></g><g id="mg"></g><g id="cp"></g></g>`,'A bar magnet with field lines and a compass that moves round it');
  const rd=mkRd(w),c=mkCtl(w);let th=0.6;
  slider(c,L('Compass position','कंपास पोज़िशन','കോമ്പസ് പൊസിഷൻ'),-180,180,5,35,x=>x+'°',x=>{th=x*Math.PI/180;api.redraw()});
  const cx=210,cy=115,a=50,rx=a+62,ry=72;
  return t=>{const px=cx+rx*Math.cos(th),py=cy-ry*Math.sin(th);
   /* tangent direction N->S outside: top (th in 0..pi): d/dth; bottom: opposite */
   let dx=-rx*Math.sin(th),dy=-ry*Math.cos(th);if(th<0){dx=-dx;dy=-dy}
   const ang=Math.atan2(dx,-dy)*180/Math.PI;
   put($('#fl',w),fieldPaths(cx,cy,a,[1,1.7,2.4]).map(p=>`<path d="${p}" fill="none" stroke="var(--def)" stroke-width="2.2" opacity=".8" style="stroke-dasharray:7 9" stroke-dashoffset="${(-t*30).toFixed(1)}"/>`).join('')+`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="var(--mut)" stroke-width="1.2" stroke-dasharray="3 5"/>`);
   put($('#mg',w),magnet(cx-a,cy-16,2*a,32,false));
   put($('#cp',w),needle(px,py,14,ang));
   setRd(rd,`<span class="note" style="margin:0">${RD('Red end points along the field, towards S.','लाल सिरा फील्ड की दिशा में, S की तरफ़।','ചുവന്ന അറ്റം ഫീൽഡ് ദിശയിൽ, S-ന് നേരെ.')}</span>`)}}});

 flash:FB('Conductor and insulator (Module 0, slide 12)','कंडक्टर और इंसुलेटर (मॉड्यूल 0, स्लाइड 12)','കണ്ടക്ടറും ഇൻസുലേറ്ററും (മൊഡ്യൂൾ 0, സ്ലൈഡ് 12)'),
 hook:L('A magnet touches a pile of items. Not everything sticks.','मैग्नेट आइटम के ढेर को छूता है। हर चीज़ नहीं चिपकती।','മാഗ്നറ്റ് സാധനങ്ങളുടെ കൂമ്പാരത്തിൽ തൊടുന്നു. എല്ലാം ഒട്ടില്ല.'),
 defn:L('<b>Magnetic materials:</b> iron, steel, nickel, cobalt. They are pulled strongly. Copper, aluminium, wood and plastic are <b>non-magnetic</b> for practical work.','<b>मैग्नेटिक मटीरियल:</b> आयरन, स्टील, निकल, कोबाल्ट। ये तगड़े खिंचते हैं। कॉपर, एल्यूमिनियम, लकड़ी और प्लास्टिक प्रैक्टिकल काम में <b>नॉन-मैग्नेटिक</b> हैं।','<b>മാഗ്നറ്റിക് മെറ്റീരിയൽസ്:</b> ഇരുമ്പ്, സ്റ്റീൽ, നിക്കൽ, കോബാൾട്ട്. ഇവ ശക്തമായി വലിക്കപ്പെടും. കോപ്പർ, അലുമിനിയം, തടി, പ്ലാസ്റ്റിക് എന്നിവ പ്രായോഗിക ജോലിയിൽ <b>നോൺ-മാഗ്നറ്റിക്</b>.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="A magnet picking up an iron nail but not a wooden stick">${magnet(20,36,70,28,false)}<rect x="94" y="46" width="46" height="6" fill="${FE}" stroke="${FED}"/><rect x="170" y="46" width="60" height="6" fill="#b88a5a" stroke="#6a4a2a"/>${TT(117,30,'Sticks','चिपकता है','ഒട്ടുന്നു','m')}${TT(200,30,'No pull','खिंचाव नहीं','വലിവ് ഇല്ല','m')}</svg>`,
 play:L('Tap an item. Watch it fly to the magnet, or stay.','एक आइटम टैप करो। देखो वह मैग्नेट पर जाता है या रुकता है।','ഒരു സാധനം ടാപ്പ് ചെയ്യൂ. അത് മാഗ്നറ്റിലേക്ക് പോകുന്നോ നിൽക്കുന്നോ നോക്കൂ.'),
 pred:{q:L('Which of these is pulled by a magnet?','इनमें से कौन मैग्नेट से खिंचता है?','ഇതിൽ ഏതാണ് മാഗ്നറ്റ് വലിക്കുന്നത്?'),o:[L('Steel pin','स्टील पिन','സ്റ്റീൽ പിൻ'),L('Copper wire','कॉपर वायर','കോപ്പർ വയർ'),L('Aluminium foil','एल्यूमिनियम फॉइल','അലുമിനിയം ഫോയിൽ')],a:0,why:L('Steel has iron in it. Copper is a good conductor but it is not magnetic.','स्टील में आयरन है। कॉपर अच्छा कंडक्टर है पर मैग्नेटिक नहीं।','സ്റ്റീലിൽ ഇരുമ്പ് ഉണ്ട്. കോപ്പർ നല്ല കണ്ടക്ടറാണ്, പക്ഷേ മാഗ്നറ്റിക് അല്ല.')},
 labels:['magnet'],hints:[],
 note:L('Good electrical conductor does not mean magnetic. Copper wire carries current but a magnet ignores it.','अच्छा कंडक्टर होने का मतलब मैग्नेटिक नहीं। कॉपर वायर करंट ले जाता है पर मैग्नेट उसे नहीं खींचता।','നല്ല കണ്ടക്ടർ എന്നാൽ മാഗ്നറ്റിക് എന്നല്ല. കോപ്പർ വയർ കറന്റ് കൊണ്ടുപോകും, പക്ഷേ മാഗ്നറ്റ് അതിനെ വലിക്കില്ല.'),
 trick:L('Iron family sticks.','आयरन फैमिली चिपकती है।','ഇരുമ്പ് കുടുംബം ഒട്ടും.'),
 check:{q:L('Which is both a conductor and non-magnetic?','कौन कंडक्टर भी है और नॉन-मैग्नेटिक भी?','ഏതാണ് കണ്ടക്ടറും നോൺ-മാഗ്നറ്റിക്കും?'),o:[L('Copper','कॉपर','കോപ്പർ'),L('Iron','आयरन','ഇരുമ്പ്'),L('Wood','लकड़ी','തടി')],a:0},
 build(w,api){
  w.innerHTML=S(420,150,`<g id="a"></g>`,'A magnet on the left and six items to test');
  const rd=mkRd(w),c=mkCtl(w);let sel=-1,ph=1;const done={};
  MATS.forEach((m,i)=>button(c,L(m[0],m[1],m[2]),()=>{sel=i;ph=0;done[i]=1;api.redraw()}));
  api.setReplay(()=>{sel=-1;for(const k in done)delete done[k];ph=1});
  return(t,dt)=>{if(sel>=0&&ph<1)ph=Math.min(1,ph+dt*1.1);
   let s=magnet(14,56,90,34,false);
   MATS.forEach((m,i)=>{const bx=178+(i%3)*105,by=28+Math.floor(i/3)*82;let x=bx,y=by;const mg=m[3];
     if(i===sel&&mg){x=bx+(112-bx)*ph;y=by+(72-by)*ph}else if(i===sel&&!mg){x=bx+Math.sin(ph*12)*3}
     const col=[FE,'#9aa0a6','#aab2ba','#c9793a','#d4d8dc','#b88a5a'][i];
     s+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><rect x="-26" y="-5" width="52" height="10" rx="3" fill="${col}" stroke="#0006" stroke-width="1.3"/></g><text x="${bx}" y="${by+22}" text-anchor="middle" class="tx s" data-en="${m[0]}" data-hi="${m[1]}" data-ml="${m[2]}">${m[0]}</text>`;
     if(done[i])s+=`<text x="${bx+30}" y="${by-10}" text-anchor="middle" style="font:800 18px NL,sans-serif" fill="${mg?'var(--ok)':'var(--no)'}">${mg?'✔':'✘'}</text>`});
   put($('#a',w),s);
   const m=sel>=0?MATS[sel]:null;
   setRd(rd,m?`<span><b>${BI(m[0],m[1],m[2])}</b> → ${m[3]?RD('magnetic: pulled','मैग्नेटिक: खिंचा','മാഗ്നറ്റിക്: വലിച്ചു'):RD('non-magnetic: ignored','नॉन-मैग्नेटिक: नहीं खिंचा','നോൺ-മാഗ്നറ്റിക്: വലിച്ചില്ല')}</span>`:`<span class="note" style="margin:0">${RD('Tap each item.','हर आइटम टैप करो।','ഓരോ സാധനവും ടാപ്പ് ചെയ്യൂ.')}</span>`)}}});

/* ---------- 6 Soft iron and hard steel ---------- */
CS({id:'m_soft',menu:'Soft iron and hard steel',title:'t_soft',
 flash:FB('Magnetic materials (slide 5)','मैग्नेटिक मटीरियल (स्लाइड 5)','മാഗ്നറ്റിക് മെറ്റീരിയൽസ് (സ്ലൈഡ് 5)'),
 hook:L('Switch the current off. One core drops the pins. One keeps them.','करंट बंद करो। एक कोर पिन गिरा देता है। एक रोके रखता है।','കറന്റ് ഓഫ് ചെയ്യൂ. ഒരു കോർ പിൻ വീഴ്ത്തും. ഒന്ന് പിടിച്ചു നിർത്തും.'),
 defn:L('<b>Soft iron:</b> magnetised easily, loses it at once. Used in relays, transformers, motors. <b>Hard steel:</b> hard to magnetise, keeps it. Used for permanent magnets.','<b>सॉफ्ट आयरन:</b> आसानी से मैग्नेटाइज़ होता है, तुरंत खो देता है। रिले, ट्रांसफॉर्मर, मोटर में। <b>हार्ड स्टील:</b> मैग्नेटाइज़ करना मुश्किल, रखता है। परमानेंट मैग्नेट के लिए।','<b>സോഫ്റ്റ് അയൺ:</b> എളുപ്പം മാഗ്നറ്റൈസ് ആകും, ഉടൻ നഷ്ടപ്പെടും. റിലേ, ട്രാൻസ്ഫോർമർ, മോട്ടോർ എന്നിവയിൽ. <b>ഹാർഡ് സ്റ്റീൽ:</b> മാഗ്നറ്റൈസ് ചെയ്യാൻ പ്രയാസം, നിലനിർത്തും. പെർമനന്റ് മാഗ്നറ്റിന്.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="A relay and a permanent horseshoe magnet"><rect x="40" y="38" width="90" height="26" fill="${FE}" stroke="${FED}" stroke-width="2"/>${coilH(52,51,66,34,6,3)}${TT(85,92,'Soft iron core: relay','सॉफ्ट आयरन कोर: रिले','സോഫ്റ്റ് അയൺ കോർ: റിലേ','m')}<path d="M200 80V40a30 30 0 0 1 60 0V80" fill="none" stroke="${NC}" stroke-width="12"/><path d="M200 80V60M260 80V60" stroke="${SC}" stroke-width="12"/>${TT(230,96,'Hard steel: magnet','हार्ड स्टील: मैग्नेट','ഹാർഡ് സ്റ്റീൽ: മാഗ്നറ്റ്','m')}</svg>`,
 play:L('Choose a core. Switch the current ON, then OFF.','कोर चुनो। करंट ON करो, फिर OFF।','കോർ തിരഞ്ഞെടുക്കൂ. കറന്റ് ON ചെയ്ത് പിന്നെ OFF ചെയ്യൂ.'),
 pred:{q:L('Which core keeps its magnetism after the current is switched off?','करंट बंद होने के बाद कौन-सा कोर मैग्नेटिज़्म रखता है?','കറന്റ് ഓഫ് ആയ ശേഷം ഏത് കോർ മാഗ്നറ്റിസം നിലനിർത്തും?'),o:[L('Hard steel','हार्ड स्टील','ഹാർഡ് സ്റ്റീൽ'),L('Soft iron','सॉफ्ट आयरन','സോഫ്റ്റ് അയൺ'),L('Both','दोनों','രണ്ടും')],a:0,why:L('Hard steel retains it. Soft iron drops almost all of it, which is why relays release.','हार्ड स्टील रखता है। सॉफ्ट आयरन लगभग सब छोड़ देता है, इसीलिए रिले रिलीज़ होता है।','ഹാർഡ് സ്റ്റീൽ നിലനിർത്തും. സോഫ്റ്റ് അയൺ ഏതാണ്ട് മുഴുവൻ വിടും, അതുകൊണ്ടാണ് റിലേ റിലീസ് ആകുന്നത്.')},
 labels:['magnet'],hints:[],
 note:L('Remaining magnetism is called residual magnetism. Soft iron keeps only a little.','बचे हुए मैग्नेटिज़्म को रेज़िडुअल मैग्नेटिज़्म कहते हैं। सॉफ्ट आयरन में थोड़ा ही बचता है।','ബാക്കി നിൽക്കുന്ന മാഗ്നറ്റിസത്തെ റെസിഡ്യൂവൽ മാഗ്നറ്റിസം എന്ന് പറയും. സോഫ്റ്റ് അയണിൽ കുറച്ചേ ബാക്കിയാകൂ.'),
 trick:L('Soft: switch. Hard: keep.','सॉफ्ट: स्विच। हार्ड: रखो।','സോഫ്റ്റ്: സ്വിച്ച്. ഹാർഡ്: സൂക്ഷിക്കും.'),
 check:{q:L('A relay coil takes 0.2 A for 10 s. Charge Q = I × t = ? And its core must be …','रिले कॉइल 10 सेकंड 0.2 A लेती है। चार्ज Q = I × t = ? और कोर होना चाहिए …','റിലേ കോയിൽ 10 സെക്കൻഡ് 0.2 A എടുക്കുന്നു. ചാർജ് Q = I × t = ? കോർ ആയിരിക്കണം …'),o:[L('2 C, soft iron','2 C, सॉफ्ट आयरन','2 C, സോഫ്റ്റ് അയൺ'),L('2 C, hard steel','2 C, हार्ड स्टील','2 C, ഹാർഡ് സ്റ്റീൽ'),L('50 C, soft iron','50 C, सॉफ्ट आयरन','50 C, സോഫ്റ്റ് അയൺ')],a:0},
 build(w,api){
  w.innerHTML=S(420,175,`<g transform="translate(0 -30)"><g id="a"></g></g>`,'A coil on a core with pins hanging from its end');
  const rd=mkRd(w),c=mkCtl(w);let hard=false,on=false,mag=0;const pins=[0,1,2,3,4,5];let fall=pins.map(()=>0);
  const b1=button(c,L('Soft iron core','सॉफ्ट आयरन कोर','സോഫ്റ്റ് അയൺ കോർ'),()=>{hard=false;mag=0;on=false;b1.classList.add('on');b2.classList.remove('on');api.redraw()},'on');
  const b2=button(c,L('Hard steel core','हार्ड स्टील कोर','ഹാർഡ് സ്റ്റീൽ കോർ'),()=>{hard=true;mag=0;on=false;b2.classList.add('on');b1.classList.remove('on');api.redraw()});
  button(c,L('Current ON','करंट ON','കറന്റ് ON'),()=>{on=true;api.redraw()});
  button(c,L('Current OFF','करंट OFF','കറന്റ് OFF'),()=>{on=false;api.redraw()});
  api.setReplay(()=>{on=false;mag=0});
  return(t,dt)=>{const tgt=on?1:(hard?(mag>0.2?.7:0):.05);mag+=(tgt-mag)*Math.min(1,dt*(on?3:(hard?.2:6)));
   const held=Math.round(mag*6);
   let s=`<rect x="70" y="60" width="240" height="30" fill="${hard?'#6b7480':FE}" stroke="${FED}" stroke-width="2"/>${coilH(90,75,150,50,8,3)}`;
   s+=`<path d="M60 75H30V118H390V75H310" class="w" fill="none" opacity=".0"/>`;
   s+=`<circle cx="360" cy="130" r="0" />`;
   for(let i=0;i<6;i++){const hold=i<held;const y=hold?96+i*9:(fall[i]=Math.min(110,(fall[i]||0)+dt*140),96+i*9+fall[i]);if(hold)fall[i]=0;
     s+=`<rect x="${306+ (i%2)*6-3}" y="${y.toFixed(0)}" width="5" height="12" rx="1" fill="${FED}" opacity="${hold?1:Math.max(0,1-fall[i]/110)}"/>`}
   s+=`<text x="40" y="40" class="tx s">${on?'I → ON':'I = 0'}</text>`;
   put($('#a',w),s);
   setRd(rd,`<span>${RD('Pins held','पिन होल्ड','പിൻ പിടിച്ചത്')} <b>${held} / 6</b></span><span>${hard?RD('Hard steel','हार्ड स्टील','ഹാർഡ് സ്റ്റീൽ'):RD('Soft iron','सॉफ्ट आयरन','സോഫ്റ്റ് അയൺ')}</span>`)}}});

CS({id:'m_oer',menu:'Current makes a magnet',title:'t_oer',
 flash:FB('Current direction (Module 0, slide 7)','करंट की दिशा (मॉड्यूल 0, स्लाइड 7)','കറന്റ് ദിശ (മൊഡ്യൂൾ 0, സ്ലൈഡ് 7)'),
 hook:L('A live wire passes over a compass. The needle moves!','एक लाइव वायर कंपास के ऊपर से गुज़रता है। सुई हिल जाती है!','ഒരു ലൈവ് വയർ കോമ്പസിന് മുകളിലൂടെ പോകുന്നു. സൂചി ഇളകുന്നു!'),
 defn:L('<b>Oersted:</b> a wire carrying current has a magnetic field round it. More current, stronger field. Reverse the current and the field reverses.','<b>ऑर्स्टेड:</b> करंट वाले वायर के चारों ओर मैग्नेटिक फील्ड होता है। करंट ज़्यादा तो फील्ड तगड़ा। करंट उल्टा तो फील्ड उल्टा।','<b>ഓർസ്റ്റെഡ്:</b> കറന്റ് ഒഴുകുന്ന വയറിന് ചുറ്റും മാഗ്നറ്റിക് ഫീൽഡ് ഉണ്ട്. കറന്റ് കൂടിയാൽ ഫീൽഡ് ശക്തം. കറന്റ് തിരിച്ചാൽ ഫീൽഡും തിരിയും.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="Circles of field round a current-carrying wire"><circle cx="150" cy="50" r="10" fill="${CU}" stroke="${CUD}"/><circle cx="150" cy="50" r="24" fill="none" stroke="var(--def)" stroke-width="2.5"/><circle cx="150" cy="50" r="38" fill="none" stroke="var(--def)" stroke-width="2.5"/>${TT(150,96,'Field circles round the wire','वायर के चारों ओर फील्ड के घेरे','വയറിന് ചുറ്റും ഫീൽഡ് വൃത്തങ്ങൾ','m')}</svg>`,
 play:L('Press Current ON. Slide the current. Press Reverse.','Current ON दबाओ। करंट स्लाइड करो। Reverse दबाओ।','Current ON അമർത്തൂ. കറന്റ് സ്ലൈഡ് ചെയ്യൂ. Reverse അമർത്തൂ.'),
 pred:{q:L('The current in the wire is reversed. The compass needle will …','वायर में करंट उल्टा किया गया। कंपास की सुई …','വയറിലെ കറന്റ് തിരിച്ചു. കോമ്പസ് സൂചി …'),o:[L('swing the other way','दूसरी तरफ़ घूमेगी','മറുവശത്തേക്ക് തിരിയും'),L('swing the same way','उसी तरफ़ घूमेगी','അതേ വശത്തേക്ക് തിരിയും'),L('not move','नहीं हिलेगी','അനങ്ങില്ല')],a:0,why:L('Field direction follows current direction. Reverse one, the other reverses.','फील्ड की दिशा करंट की दिशा पर चलती है। एक उल्टा तो दूसरा उल्टा।','ഫീൽഡ് ദിശ കറന്റ് ദിശയെ പിന്തുടരും. ഒന്ന് തിരിച്ചാൽ മറ്റേതും തിരിയും.')},
 labels:['magnet'],hints:['qit'],rel:{c:['Q','I','B'],h:'B'},
 note:L('Sketch only. The real swing depends on the compass and how far it is from the wire.','ये सिर्फ़ स्केच है। असली घुमाव कंपास और वायर से दूरी पर निर्भर है।','ഇത് സ്കെച്ച് മാത്രം. യഥാർത്ഥ തിരിവ് കോമ്പസിനെയും വയറിൽ നിന്നുള്ള ദൂരത്തെയും ആശ്രയിക്കും.'),
 trick:L('Current makes field. Field follows current.','करंट फील्ड बनाता है। फील्ड करंट के पीछे चलता है।','കറന്റ് ഫീൽഡ് ഉണ്ടാക്കുന്നു. ഫീൽഡ് കറന്റിനെ പിന്തുടരുന്നു.'),
 check:{q:L('Current I = Q ÷ t. If 30 C passes in 10 s, I = 3 A. Doubling this current makes the field …','I = Q ÷ t। 10 सेकंड में 30 C गुज़रे तो I = 3 A। इसे डबल करने पर फील्ड …','I = Q ÷ t. 10 സെക്കൻഡിൽ 30 C കടന്നാൽ I = 3 A. ഇത് ഇരട്ടിയാക്കിയാൽ ഫീൽഡ് …'),o:[L('stronger','तगड़ा','ശക്തം'),L('weaker','कमज़ोर','ദുർബലം'),L('same','वही','അതേ')],a:0},
 build(w,api){
  w.innerHTML=S(420,210,`<g id="a"></g>`,'Top view: a wire running north over a compass, needle deflecting east or west');
  const rd=mkRd(w),c=mkCtl(w);let on=false,dir=1,I=5,ang=0;
  button(c,L('Current ON','करंट ON','കറന്റ് ON'),()=>{on=!on;api.redraw()},'on');

  slider(c,L('Current','करंट','കറന്റ്'),1,10,1,5,x=>x+' A',x=>{I=x;api.redraw()});
  api.setReplay(()=>{on=false;dir=1});

   s+=`<text x="40" y="136" class="tx s">W</text><text x="372" y="136" class="tx s">E</text>`;
   put($('#a',w),s);
   setRd(rd,`<span>${on?(dir>0?RD('Current north: needle swings west','करंट उत्तर: सुई पश्चिम घूमी','കറന്റ് വടക്ക്: സൂചി പടിഞ്ഞാറ്'):RD('Current south: needle swings east','करंट दक्षिण: सुई पूरब घूमी','കറന്റ് തെക്ക്: സൂചി കിഴക്ക്')):RD('No current: needle points north','करंट नहीं: सुई उत्तर','കറന്റ് ഇല്ല: സൂചി വടക്ക്')}</span><span>${RD('Swing','घुमाव','തിരിവ്')} <b>${Math.abs(ang).toFixed(0)}°</b></span>`)}}});

 hook:L('Which end of the coil is N? Your hand can tell you.','कॉइल का कौन-सा सिरा N है? आपका हाथ बता देगा।','കോയിലിന്റെ ഏത് അറ്റമാണ് N? നിങ്ങളുടെ കൈ പറഞ്ഞുതരും.'),
 defn:L('<b>Right-hand grip rule (coil):</b> curl the fingers the way the current goes round. The thumb points to the <b>N pole</b>. For a straight wire: thumb along the current, fingers show the field.','<b>राइट-हैंड ग्रिप रूल (कॉइल):</b> उंगलियाँ करंट के घूमने की दिशा में मोड़ो। अंगूठा <b>N पोल</b> की तरफ़। सीधे वायर में: अंगूठा करंट की दिशा में, उंगलियाँ फील्ड दिखाती हैं।','<b>റൈറ്റ്-ഹാൻഡ് ഗ്രിപ്പ് റൂൾ (കോയിൽ):</b> കറന്റ് ചുറ്റുന്ന ദിശയിൽ വിരലുകൾ മടക്കൂ. തള്ളവിരൽ <b>N പോളിലേക്ക്</b>. നേരെയുള്ള വയറിൽ: തള്ളവിരൽ കറന്റ് ദിശയിൽ, വിരലുകൾ ഫീൽഡ് കാണിക്കും.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="A coil with current and N S poles">${coilH(90,50,120,46,6,3.5)}<text x="68" y="56" class="tx" fill="${SC}" style="fill:${SC}">S</text><text x="226" y="56" class="tx" style="fill:${NC}">N</text></svg>`,
 play:L('Press Reverse current. Watch the poles swap.','Reverse current दबाओ। पोल बदलते देखो।','Reverse current അമർത്തൂ. പോളുകൾ മാറുന്നത് നോക്കൂ.'),
 pred:{q:L('Current goes anticlockwise as you look at one end of a coil. That end is …','एक सिरे से देखने पर करंट एंटी-क्लॉकवाइज़ घूमता है। वह सिरा …','ഒരറ്റത്ത് നിന്ന് നോക്കുമ്പോൾ കറന്റ് ആന്റി-ക്ലോക്ക്‌വൈസ്. ആ അറ്റം …'),o:[L('N pole','N पोल','N പോൾ'),L('S pole','S पोल','S പോൾ'),L('No pole','कोई पोल नहीं','പോൾ ഇല്ല')],a:0,why:L('Anticlockwise looking at the end means that end is N. Clockwise means S.','सिरे से देखने पर एंटी-क्लॉकवाइज़ मतलब वह सिरा N। क्लॉकवाइज़ मतलब S।','അറ്റത്ത് നോക്കുമ്പോൾ ആന്റി-ക്ലോക്ക്‌വൈസ് എന്നാൽ ആ അറ്റം N. ക്ലോക്ക്‌വൈസ് എന്നാൽ S.')},
 labels:['solenoid','pole'],hints:['qit'],
 note:L('Another memory aid: “NOW” (N = anticlockwise) and “SOC” (S = clockwise). Always look at the end.','दूसरा तरीका: “NOW” (N = एंटी-क्लॉकवाइज़) और “SOC” (S = क्लॉकवाइज़)। हमेशा सिरे को देखकर।','മറ്റൊരു വഴി: “NOW” (N = ആന്റി-ക്ലോക്ക്‌വൈസ്), “SOC” (S = ക്ലോക്ക്‌വൈസ്). എപ്പോഴും അറ്റത്തേക്ക് നോക്കി.'),
 trick:L('Fingers curl with I. Thumb says N.','उंगलियाँ I के साथ मुड़ें। अंगूठा N बताए।','വിരലുകൾ I-യോടൊപ്പം മടക്കൂ. തള്ളവിരൽ N പറയും.'),
 check:{q:L('A 12 V supply drives 3 A through a coil, so R = V ÷ I = ? Reverse the battery and the N pole …','12 V सप्लाई कॉइल में 3 A चलाती है, तो R = V ÷ I = ? बैटरी उल्टी करने पर N पोल …','12 V സപ്ലൈ കോയിലിൽ 3 A ഓടിക്കുന്നു, R = V ÷ I = ? ബാറ്ററി തിരിച്ചാൽ N പോൾ …'),o:[L('4 Ω, moves to the other end','4 Ω, दूसरे सिरे पर चला जाता है','4 Ω, മറ്റേ അറ്റത്തേക്ക് മാറും'),L('4 Ω, stays','4 Ω, वहीं रहता है','4 Ω, അവിടെത്തന്നെ'),L('36 Ω, moves','36 Ω, जाता है','36 Ω, മാറും')],a:0},
 build(w,api){
  w.innerHTML=S(420,220,`<g id="a"></g>`,'A solenoid with current direction arrows and N S ends, and a straight wire with field circles');
  const rd=mkRd(w),c=mkCtl(w);let dir=1;
  button(c,L('Reverse current','करंट रिवर्स','കറന്റ് റിവേഴ്സ്'),()=>{dir=-dir;api.redraw()},'on');
  return t=>{const x0=150,w0=200,y0=95;
   let s=`<rect x="${x0-20}" y="${y0-10}" width="${w0+40}" height="20" fill="${FE}" opacity=".25"/>`+coilH(x0,y0,w0,70,8,4);
   /* current arrows on front side of loops */
   for(let i=0;i<8;i++){const cx=x0+w0/8*(i+.5);const ph=((t*.8+i*.12)%1);const yy=y0+35-(ph*70);s+=`<circle cx="${(cx+(dir>0?0:0)).toFixed(0)}" cy="${(dir>0?y0+35-ph*70:y0-35+ph*70).toFixed(0)}" r="3.4" fill="var(--elec)"/>`}
   /* anticlockwise seen from right end when current on front goes up (dir>0): right end N */
   const nRight=dir<0;
   s+=`<text x="${x0-34}" y="${y0+6}" class="tx" text-anchor="middle" style="fill:${nRight?SC:NC};font-size:26px">${nRight?'S':'N'}</text><text x="${x0+w0+34}" y="${y0+6}" class="tx" text-anchor="middle" style="fill:${nRight?NC:SC};font-size:26px">${nRight?'N':'S'}</text>`;
   s+=arr(x0+w0/2-30,y0+60,x0+w0/2+30,y0+60,'var(--frm)',0)+'';
   /* straight wire inset */
   const wx=70,wy=185;
   s+=`<circle cx="${wx}" cy="${wy}" r="9" fill="${CU}" stroke="${CUD}"/>`+`<text x="${wx}" y="${wy+5}" text-anchor="middle" fill="#fff" style="font:800 16px NL,sans-serif">${dir>0?'⊙':'⊗'}</text>`;
   [20,32].forEach(r=>{s+=`<circle cx="${wx}" cy="${wy}" r="${r}" fill="none" stroke="var(--def)" stroke-width="2" opacity=".7"/>`});
   s+=`<path d="M${wx+(dir>0?-32:32)} ${wy-4}l${dir>0?-1:1} 10" stroke="var(--def)" stroke-width="0"/>`;
   const aa=t*1.6*(dir>0?-1:1);s+=`<circle cx="${(wx+26*Math.cos(aa)).toFixed(1)}" cy="${(wy+26*Math.sin(aa)).toFixed(1)}" r="4.2" fill="var(--def)"/>`;
   put($('#a',w),s);
   setRd(rd,`<span>${RD('Thumb points to','अंगूठा किधर','തള്ളവിരൽ എങ്ങോട്ട്')} <b>${nRight?RD('right end = N','राइट सिरा = N','വലത് അറ്റം = N'):RD('left end = N','लेफ्ट सिरा = N','ഇടത് അറ്റം = N')}</b></span><span class="note" style="margin:0">${RD('Straight wire: ⊙ current out of page, field anticlockwise. ⊗ into page, clockwise.','सीधा वायर: ⊙ करंट बाहर, फील्ड एंटी-क्लॉकवाइज़। ⊗ अंदर, क्लॉकवाइज़।','നേരെയുള്ള വയർ: ⊙ കറന്റ് പുറത്തേക്ക്, ഫീൽഡ് ആന്റി-ക്ലോക്ക്‌വൈസ്. ⊗ അകത്തേക്ക്, ക്ലോക്ക്‌വൈസ്.')}</span>`)}}});

CS({id:'m_emag',menu:'Solenoid and electromagnet',title:'t_emag',
 flash:FB('Right-hand grip rule (slide 8)','राइट-हैंड ग्रिप रूल (स्लाइड 8)','റൈറ്റ്-ഹാൻഡ് ഗ്രിപ്പ് റൂൾ (സ്ലൈഡ് 8)'),
 hook:L('A crane lifts scrap iron, then drops it on command. How?','क्रेन स्क्रैप आयरन उठाती है, फिर कमांड पर गिरा देती है। कैसे?','ക്രെയിൻ ഇരുമ്പ് ഉയർത്തുന്നു, കമാൻഡ് കിട്ടുമ്പോൾ വീഴ്ത്തുന്നു. എങ്ങനെ?'),
 defn:L('<b>Solenoid:</b> a coil that acts like a magnet when current flows. Put a soft iron core inside and it becomes an <b>electromagnet</b>. Strength depends on <b>ampere-turns</b> = turns × current.','<b>सोलेनॉइड:</b> कॉइल जो करंट बहने पर मैग्नेट जैसा काम करती है। अंदर सॉफ्ट आयरन कोर रखो तो <b>इलेक्ट्रोमैग्नेट</b> बन जाती है। ताकत <b>एम्पियर-टर्न</b> = टर्न × करंट पर।','<b>സോളിനോയിഡ്:</b> കറന്റ് ഒഴുകുമ്പോൾ മാഗ്നറ്റ് പോലെ പ്രവർത്തിക്കുന്ന കോയിൽ. ഉള്ളിൽ സോഫ്റ്റ് അയൺ കോർ വച്ചാൽ <b>ഇലക്ട്രോമാഗ്നറ്റ്</b> ആകും. ശക്തി <b>ആമ്പിയർ-ടേൺ</b> = ടേൺ × കറന്റ് അനുസരിച്ച്.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="A coil on an iron core lifting nails"><rect x="70" y="30" width="110" height="24" fill="${FE}" stroke="${FED}" stroke-width="2"/>${coilH(80,42,90,42,7,3)}<rect x="184" y="56" width="5" height="12" fill="${FED}"/><rect x="192" y="56" width="5" height="12" fill="${FED}"/>${TT(125,92,'Electromagnet','इलेक्ट्रोमैग्नेट','ഇലക്ട്രോമാഗ്നറ്റ്','m')}</svg>`,
 play:L('Slide turns and current. Switch the iron core in and out.','टर्न और करंट स्लाइड करो। आयरन कोर लगाओ, हटाओ।','ടേണും കറന്റും സ്ലൈഡ് ചെയ്യൂ. ഇരുമ്പ് കോർ ഇടൂ, മാറ്റൂ.'),
 pred:{q:L('Turns are doubled and the current stays the same. The pull becomes about …','टर्न डबल, करंट वही। खिंचाव लगभग …','ടേൺ ഇരട്ടി, കറന്റ് അതേ. വലിവ് ഏകദേശം …'),o:[L('double','डबल','ഇരട്ടി'),L('half','आधा','പകുതി'),L('same','वही','അതേ')],a:0,why:L('Ampere-turns = N × I. Double N, double ampere-turns.','एम्पियर-टर्न = N × I। N डबल तो एम्पियर-टर्न डबल।','ആമ്പിയർ-ടേൺ = N × I. N ഇരട്ടി, ആമ്പിയർ-ടേൺ ഇരട്ടി.')},
 labels:['solenoid','mmf'],hints:['vir'],rel:{c:['V','I','N × I','Φ'],h:'N × I'},
 fm:['<i>AT</i> = <i>N</i> × <i>I</i>'],
 uses:L('Used in: relays, contactors, lifting magnets, bells, MCB trip coils. Uses I from V ÷ R (Module 0, slide 14).','इस्तेमाल: रिले, कॉन्टैक्टर, लिफ्टिंग मैग्नेट, बेल, MCB ट्रिप कॉइल। I = V ÷ R (मॉड्यूल 0, स्लाइड 14) से।','ഉപയോഗം: റിലേ, കോൺടാക്ടർ, ലിഫ്റ്റിംഗ് മാഗ്നറ്റ്, ബെൽ, MCB ട്രിപ്പ് കോയിൽ. I = V ÷ R (മൊഡ്യൂൾ 0, സ്ലൈഡ് 14) ഉപയോഗിക്കുന്നു.'),
 ex:L('Mental sum: 100 turns × 3 A = 300 AT. 200 turns × 3 A = 600 AT, twice the pull.','मेंटल सम: 100 टर्न × 3 A = 300 AT। 200 टर्न × 3 A = 600 AT, दोगुना खिंचाव।','മെന്റൽ സം: 100 ടേൺ × 3 A = 300 AT. 200 ടേൺ × 3 A = 600 AT, ഇരട്ടി വലിവ്.'),
 note:L('The pin count is an illustration. Real pull depends on the core, the air gap and saturation.','पिन की गिनती सिर्फ़ इलस्ट्रेशन है। असली खिंचाव कोर, एयर गैप और सैचुरेशन पर निर्भर।','പിൻ എണ്ണം ചിത്രീകരണം മാത്രം. യഥാർത്ഥ വലിവ് കോർ, എയർ ഗ്യാപ്, സാച്ചുറേഷൻ എന്നിവയെ ആശ്രയിക്കും.'),
 trick:L('More turns, more current: more magnet.','टर्न ज़्यादा, करंट ज़्यादा: मैग्नेट ज़्यादा।','ടേൺ കൂടുതൽ, കറന്റ് കൂടുതൽ: മാഗ്നറ്റ് കൂടുതൽ.'),
 check:{q:L('A coil of 50 turns takes 12 V across 4 Ω. Current is 3 A. Ampere-turns = ?','50 टर्न की कॉइल 4 Ω पर 12 V लेती है। करंट 3 A। एम्पियर-टर्न = ?','50 ടേൺ കോയിൽ 4 Ω-ന് 12 V എടുക്കുന്നു. കറന്റ് 3 A. ആമ്പിയർ-ടേൺ = ?'),o:['150 AT','600 AT','12 AT'],a:0},
 build(w,api){
  w.innerHTML=S(420,230,`<g id="a"></g>`,'A coil with a movable iron core and pins hanging from its end');
  const rd=mkRd(w),c=mkCtl(w);let N=50,I=3,core=true;let held=0;
  slider(c,L('Turns','टर्न','ടേൺ'),10,100,10,50,x=>x,x=>{N=x;api.redraw()});
  slider(c,L('Current','करंट','കറന്റ്'),1,10,1,3,x=>x+' A',x=>{I=x;api.redraw()});
  const cb=button(c,L('Iron core: ON','आयरन कोर: ON','ഇരുമ്പ് കോർ: ON'),()=>{core=!core;cb.textContent=core?'Iron core: ON':'Iron core: OFF';cb.dataset.k=core?1:0;api.redraw();setTimeout(svgLang,0)},'on');
  return(t,dt)=>{const AT=N*I;const tgt=Math.min(8,Math.round(AT/(core?125:500)));held+=(tgt-held)*Math.min(1,dt*5);const hn=Math.round(held);
   let s=core?`<rect x="60" y="80" width="250" height="34" fill="${FE}" stroke="${FED}" stroke-width="2"/>`:'';
   s+=coilH(76,97,N/100*200+30,60,Math.max(3,Math.round(N/10)),3);
   const ex=core?310:76+N/100*200+30;
   for(let i=0;i<8;i++){const on=i<hn;const x=ex-4+(i%2)*7-1,y=116+Math.floor(i/2)*14;
     s+=`<rect x="${x}" y="${on?y:y+60}" width="5" height="12" rx="1" fill="${FED}" opacity="${on?1:.15}"/>`}
   s+=`<text x="76" y="40" class="tx s">N = ${N}</text><text x="170" y="40" class="tx s">I = ${I} A</text>`;
   put($('#a',w),s);
   setRd(rd,`<span>AT = ${N} × ${I} = <b>${AT}</b></span><span>${RD('Pins held','पिन होल्ड','പിൻ പിടിച്ചത്')} <b>${hn} / 8</b></span>`)}}});

/* ---------- 10 Magnetic circuit ---------- */
const rectPt=(x0,y0,x1,y1,u)=>{const W=x1-x0,H=y1-y0,P=2*(W+H);let d=((u%1)+1)%1*P;
 if(d<W)return[x0+d,y0];d-=W;if(d<H)return[x1,y0+d];d-=H;if(d<W)return[x1-d,y1];d-=W;return[x0,y1-d]};
CS({id:'m_circ',menu:'Magnetic circuit',title:'t_circ',
 flash:FB('V, I, R: I = V ÷ R (Module 0, slide 14)','V, I, R: I = V ÷ R (मॉड्यूल 0, स्लाइड 14)','V, I, R: I = V ÷ R (മൊഡ്യൂൾ 0, സ്ലൈഡ് 14)'),
 hook:L('Flux flows round an iron ring like current round a circuit.','फ्लक्स आयरन रिंग में ऐसे बहता है जैसे सर्किट में करंट।','ഫ്ലക്സ് ഇരുമ്പ് റിങ്ങിൽ ഒഴുകുന്നത് സർക്യൂട്ടിൽ കറന്റ് ഒഴുകുന്നതുപോലെ.'),
 defn:L('<b>Magnetic circuit:</b> the closed path of flux. <b>Flux Φ</b> is the field lines through the path (unit: weber, Wb). <b>Reluctance S</b> opposes flux. Air gaps raise it a lot.','<b>मैग्नेटिक सर्किट:</b> फ्लक्स का बंद पाथ। <b>फ्लक्स Φ</b> पाथ से गुज़रने वाली फील्ड लाइन (यूनिट: वेबर, Wb)। <b>रिलक्टेंस S</b> फ्लक्स का विरोध करता है। एयर गैप इसे बहुत बढ़ाता है।','<b>മാഗ്നറ്റിക് സർക്യൂട്ട്:</b> ഫ്ലക്സിന്റെ അടഞ്ഞ പാത്ത്. <b>ഫ്ലക്സ് Φ</b> പാത്തിലൂടെയുള്ള ഫീൽഡ് ലൈനുകൾ (യൂണിറ്റ്: വെബർ, Wb). <b>റിലക്ടൻസ് S</b> ഫ്ലക്സിനെ എതിർക്കും. എയർ ഗ്യാപ് ഇത് വളരെ കൂട്ടും.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="A closed iron ring with a coil"><rect x="90" y="14" width="120" height="70" fill="none" stroke="${FE}" stroke-width="14"/>${coilH(76,49,30,40,4,3)}${TT(150,98,'Flux path','फ्लक्स पाथ','ഫ്ലക്സ് പാത്ത്','m')}</svg>`,
 play:L('Open the air gap. Raise the ampere-turns. Watch the flux speed.','एयर गैप खोलो। एम्पियर-टर्न बढ़ाओ। फ्लक्स की स्पीड देखो।','എയർ ഗ്യാപ് തുറക്കൂ. ആമ്പിയർ-ടേൺ കൂട്ടൂ. ഫ്ലക്സ് വേഗം നോക്കൂ.'),
 pred:{q:L('A small air gap is cut in the iron ring. The flux will …','आयरन रिंग में छोटा एयर गैप काटा। फ्लक्स …','ഇരുമ്പ് റിങ്ങിൽ ചെറിയ എയർ ഗ്യാപ് മുറിച്ചു. ഫ്ലക്സ് …'),o:[L('fall a lot','बहुत घटेगा','വളരെ കുറയും'),L('rise','बढ़ेगा','കൂടും'),L('stay the same','वही रहेगा','അതേ നിൽക്കും')],a:0,why:L('Air has very high reluctance. Like adding a big resistor, the flux drops.','एयर का रिलक्टेंस बहुत ज़्यादा है। बड़ा रेसिस्टर जोड़ने की तरह, फ्लक्स घटता है।','എയറിന്റെ റിലക്ടൻസ് വളരെ കൂടുതൽ. വലിയ റെസിസ്റ്റർ ചേർക്കുന്നതുപോലെ ഫ്ലക്സ് കുറയും.')},
 labels:['flux','reluct','mmf'],hints:['vir','ser'],rel:{c:['V','I','R','N × I','Φ','S'],h:'Φ'},
 fm:['<i>Φ</i> = <i>AT</i> ÷ <i>S</i>','<span style="font-size:.8em">EMF ↔ AT · I ↔ Φ · R ↔ S</span>'],
 uses:L('Same idea as Ohm’s law (Module 0, slide 14). Used in: transformer cores, motor frames, relays. The gap numbers are relative, for the picture only.','ओम के लॉ जैसा ही आइडिया (मॉड्यूल 0, स्लाइड 14)। इस्तेमाल: ट्रांसफॉर्मर कोर, मोटर फ्रेम, रिले। गैप के नंबर रिलेटिव हैं, सिर्फ़ चित्र के लिए।','ഓമിന്റെ ലോ പോലെ തന്നെ ആശയം (മൊഡ്യൂൾ 0, സ്ലൈഡ് 14). ഉപയോഗം: ട്രാൻസ്ഫോർമർ കോർ, മോട്ടോർ ഫ്രെയിം, റിലേ. ഗ്യാപ് നമ്പറുകൾ ആപേക്ഷികം, ചിത്രത്തിന് മാത്രം.'),
 ex:L('Double the ampere-turns, double the flux. Double the reluctance, half the flux.','एम्पियर-टर्न डबल तो फ्लक्स डबल। रिलक्टेंस डबल तो फ्लक्स आधा।','ആമ്പിയർ-ടേൺ ഇരട്ടി, ഫ്ലക്സ് ഇരട്ടി. റിലക്ടൻസ് ഇരട്ടി, ഫ്ലക്സ് പകുതി.'),
 trick:L('AT pushes. S resists. Φ flows.','AT धकेलता है। S रोकता है। Φ बहता है।','AT തള്ളുന്നു. S തടയുന്നു. Φ ഒഴുകുന്നു.'),
 check:{q:L('In the Ohm’s law picture, which magnetic quantity plays the part of current I?','ओम के लॉ की तस्वीर में कौन-सी मैग्नेटिक क्वांटिटी करंट I का रोल निभाती है?','ഓമിന്റെ ലോ ചിത്രത്തിൽ കറന്റ് I-ന്റെ ഭാഗം ചെയ്യുന്ന മാഗ്നറ്റിക് ക്വാണ്ടിറ്റി ഏത്?'),o:[L('Flux Φ','फ्लक्स Φ','ഫ്ലക്സ് Φ'),L('Reluctance S','रिलक्टेंस S','റിലക്ടൻസ് S'),L('Ampere-turns','एम्पियर-टर्न','ആമ്പിയർ-ടേൺ')],a:0},
 build(w,api){
  w.innerHTML=S(420,230,`<g id="a"></g>`,'An iron ring with a coil and an adjustable air gap; dots show the flux flowing round');
  const rd=mkRd(w),c=mkCtl(w);let AT=400,g=0,ph=0;
  slider(c,L('Ampere-turns','एम्पियर-टर्न','ആമ്പിയർ-ടേൺ'),100,800,100,400,x=>x,x=>{AT=x;api.redraw()});
  slider(c,L('Air gap','एयर गैप','എയർ ഗ്യാപ്'),0,4,1,0,x=>x+' mm',x=>{g=x;api.redraw()});
  return(t,dt)=>{const S_=1+4*g,Phi=AT/S_/100;ph+=dt*Phi*.18;
   const x0=120,y0=40,x1=320,y1=170;
   let s=`<rect x="${x0-14}" y="${y0-14}" width="${x1-x0+28}" height="${y1-y0+28}" fill="none" stroke="${FE}" stroke-width="28" opacity=".55"/>`;
   s+=`<rect x="${x1-18}" y="${(y0+y1)/2-g*5-3}" width="36" height="${6+g*10}" fill="var(--card)"/>`;
   s+=coilH(54,(y0+y1)/2,56,64,5,3);
   const n=Math.round(6+Phi*3);
   for(let i=0;i<n;i++){const p=rectPt(x0,y0,x1,y1,ph+i/n);s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--def)"/>`}
   put($('#a',w),s);
   setRd(rd,`<span>AT = <b>${AT}</b></span><span>S = <b>${S_}</b> ${RD('(relative)','(रिलेटिव)','(ആപേക്ഷികം)')}</span><span>Φ = <b>${Phi<10?(Math.round(Phi*100)/100):Math.round(Phi)}</b> ${RD('(relative)','(रिलेटिव)','(ആപേക്ഷികം)')}</span>`)}}});

/* ---------- 11 Faraday ---------- */
CS({id:'m_fara',menu:'Faraday: moving magnet makes EMF',title:'t_fara',
 flash:FB('EMF is the push in a circuit (Module 0, slide 9)','EMF सर्किट में धक्का है (मॉड्यूल 0, स्लाइड 9)','EMF സർക്യൂട്ടിലെ തള്ളലാണ് (മൊഡ്യൂൾ 0, സ്ലൈഡ് 9)'),
 hook:L('No battery. Just push a magnet into a coil. The meter moves!','बैटरी नहीं। बस कॉइल में मैग्नेट धकेलो। मीटर हिलता है!','ബാറ്ററി ഇല്ല. കോയിലിലേക്ക് ഒരു മാഗ്നറ്റ് തള്ളൂ. മീറ്റർ അനങ്ങും!'),
 defn:L('<b>Faraday’s law:</b> when the flux linked with a coil <i>changes</i>, an EMF is induced. More turns and a faster change give a bigger EMF. No change, no EMF.','<b>फैराडे का लॉ:</b> जब कॉइल से जुड़ा फ्लक्स <i>बदलता</i> है, EMF इंड्यूस होता है। ज़्यादा टर्न और तेज़ बदलाव से बड़ा EMF। बदलाव नहीं तो EMF नहीं।','<b>ഫാരഡേയുടെ ലോ:</b> കോയിലുമായി ബന്ധിപ്പിച്ച ഫ്ലക്സ് <i>മാറുമ്പോൾ</i> EMF ഇൻഡ്യൂസ് ആകും. കൂടുതൽ ടേണും വേഗത്തിലുള്ള മാറ്റവും വലിയ EMF തരും. മാറ്റമില്ലെങ്കിൽ EMF ഇല്ല.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="A magnet moving into a coil connected to a meter">${magnet(20,36,70,28,false)}${coilH(130,50,80,50,7,3)}${arr(95,50,125,50,'var(--frm)')}</svg>`,
 play:L('Press Push in, Pull out or Push in fast. Try Coil: 20 turns.','Push in, Pull out या Push in fast दबाओ। Coil: 20 turns आज़माओ।','Push in, Pull out അല്ലെങ്കിൽ Push in fast അമർത്തൂ. Coil: 20 turns പരീക്ഷിക്കൂ.'),
 pred:{q:L('The magnet is held still inside the coil. The meter shows …','मैग्नेट कॉइल के अंदर स्थिर रखा है। मीटर दिखाता है …','മാഗ്നറ്റ് കോയിലിനുള്ളിൽ അനങ്ങാതെ. മീറ്റർ കാണിക്കുന്നത് …'),o:[L('zero','ज़ीरो','പൂജ്യം'),L('maximum','मैक्सिमम','പരമാവധി'),L('half','आधा','പകുതി')],a:0,why:L('Flux is not changing, so no EMF. Only motion makes EMF.','फ्लक्स बदल नहीं रहा, इसलिए EMF नहीं। सिर्फ़ मोशन से EMF बनता है।','ഫ്ലക്സ് മാറുന്നില്ല, അതിനാൽ EMF ഇല്ല. ചലനം മാത്രമാണ് EMF ഉണ്ടാക്കുന്നത്.')},
 labels:['flux','coilt'],hints:['emf'],rel:{c:['Φ','t','N','e'],h:'e'},
 fm:['<i>e</i> = <i>N</i> × <i>ΔΦ</i> ÷ <i>Δt</i>'],
 uses:L('e in volt, N turns, ΔΦ change of flux in weber, Δt time in second. Used in: alternators, transformers, pick-ups. Same EMF as Module 0, slide 9.','e वोल्ट में, N टर्न, ΔΦ फ्लक्स बदलाव वेबर में, Δt समय सेकंड में। इस्तेमाल: अल्टरनेटर, ट्रांसफॉर्मर, पिक-अप। वही EMF जो मॉड्यूल 0, स्लाइड 9 में।','e വോൾട്ടിൽ, N ടേൺ, ΔΦ ഫ്ലക്സ് മാറ്റം വെബറിൽ, Δt സമയം സെക്കൻഡിൽ. ഉപയോഗം: ആൾട്ടർനേറ്റർ, ട്രാൻസ്ഫോർമർ, പിക്ക്-അപ്പ്. മൊഡ്യൂൾ 0, സ്ലൈഡ് 9-ലെ അതേ EMF.'),
 ex:L('Mental sum: 100 turns, flux changes 0.01 Wb in 0.5 s. e = 100 × 0.01 ÷ 0.5 = 2 V. Twice as fast: 4 V.','मेंटल सम: 100 टर्न, फ्लक्स 0.5 s में 0.01 Wb बदला। e = 100 × 0.01 ÷ 0.5 = 2 V। दोगुना तेज़: 4 V।','മെന്റൽ സം: 100 ടേൺ, ഫ്ലക്സ് 0.5 s-ൽ 0.01 Wb മാറി. e = 100 × 0.01 ÷ 0.5 = 2 V. ഇരട്ടി വേഗം: 4 V.'),
 trick:L('Change makes EMF. Still makes none.','बदलाव EMF बनाता है। स्थिर कुछ नहीं।','മാറ്റം EMF ഉണ്ടാക്കും. നിശ്ചലം ഒന്നും ഇല്ല.'),
 check:{q:L('A coil has 200 turns. Flux changes by 0.01 Wb in 0.5 s. EMF e = N × ΔΦ ÷ Δt = ?','कॉइल में 200 टर्न। फ्लक्स 0.5 s में 0.01 Wb बदला। EMF e = N × ΔΦ ÷ Δt = ?','കോയിലിൽ 200 ടേൺ. ഫ്ലക്സ് 0.5 s-ൽ 0.01 Wb മാറി. EMF e = N × ΔΦ ÷ Δt = ?'),o:['4 V','1 V','100 V'],a:0},
 build(w,api){
  w.innerHTML=S(420,230,`<g id="a"></g>`,'A magnet moving into a coil with a pointer meter that deflects left or right');
  const rd=mkRd(w),c=mkCtl(w);let pos=0,v=0,mode=0,N=10,sm=0,needleA=0;const sp=[0,1,-1,3];
  const mk=(lab,m)=>button(c,lab,()=>{mode=m;api.redraw()});
  mk(L('Push in','अंदर धकेलो','അകത്തേക്ക് തള്ളൂ'),1);mk(L('Pull out','बाहर खींचो','പുറത്തേക്ക് വലിക്കൂ'),2);mk(L('Push in fast','तेज़ धकेलो','വേഗത്തിൽ തള്ളൂ'),3);mk(L('Hold still','स्थिर रखो','അനക്കാതെ വയ്ക്കൂ'),0);
  const tb=button(c,L('Coil: 10 turns','कॉइल: 10 टर्न','കോയിൽ: 10 ടേൺ'),()=>{N=N===10?20:10;tb.textContent=N===10?'Coil: 10 turns':'Coil: 20 turns';api.redraw();setTimeout(svgLang,0)});
  api.setReplay(()=>{pos=0;mode=0});
  return(t,dt)=>{let vel=0;if(mode===1)vel=1;if(mode===2)vel=-1;if(mode===3)vel=3;
   const np=clamp(pos+vel*dt*60,0,100);if(np===pos&&vel!==0){vel=0}pos=np;
   sm+=((vel)-sm)*Math.min(1,dt*10);
   const tgt=clamp(sm*(N/10)*13,-60,60);needleA+=(tgt-needleA)*Math.min(1,dt*8);
   const mx=14+pos*1.2;
   let s=magnet(mx,48,90,30,false)+coilH(200,63,120,72,Math.round(N/2),3);
   s+=`<path d="M200 63V130H100V160H320V130H320V63" class="w" fill="none" opacity="0"/>`;
   s+=`<g transform="translate(210 180)"><path d="M-62 0A62 62 0 0 1 62 0" fill="none" stroke="var(--mut)" stroke-width="2"/><g transform="rotate(${needleA.toFixed(1)})"><path d="M0 0L0 -52" stroke="var(--no)" stroke-width="3.5" stroke-linecap="round"/></g><circle r="4" fill="var(--fg)"/></g>`;
   s+=`<text x="210" y="222" text-anchor="middle" class="tx s" data-en="Centre-zero meter" data-hi="सेंटर-ज़ीरो मीटर" data-ml="സെന്റർ-സീറോ മീറ്റർ">Centre-zero meter</text>`;
   put($('#a',w),s);
   const e=Math.abs(sm)*N*.2;
   setRd(rd,`<span>${Math.abs(sm)<.05?RD('Magnet still: e = 0','मैग्नेट स्थिर: e = 0','മാഗ്നറ്റ് നിശ്ചലം: e = 0'):(sm>0?RD('Going in: meter right','अंदर जा रहा: मीटर दाएँ','അകത്തേക്ക്: മീറ്റർ വലത്'):RD('Coming out: meter left','बाहर आ रहा: मीटर बाएँ','പുറത്തേക്ക്: മീറ്റർ ഇടത്'))}</span><span>${RD('Relative EMF','रिलेटिव EMF','ആപേക്ഷിക EMF')} <b>${e<.05?'0':e.toFixed(1)}</b></span>`)}}});

/* ---------- 12 Lenz ---------- */
CS({id:'m_lenz',menu:'Lenz’s law',title:'t_lenz',
 flash:FB('Faraday: moving magnet makes EMF (slide 11)','फैराडे: चलता मैग्नेट EMF बनाता है (स्लाइड 11)','ഫാരഡേ: നീങ്ങുന്ന മാഗ്നറ്റ് EMF ഉണ്ടാക്കുന്നു (സ്ലൈഡ് 11)'),
 hook:L('You push a magnet into a coil. The coil pushes back!','आप कॉइल में मैग्नेट धकेलते हैं। कॉइल पीछे धकेलती है!','നിങ്ങൾ കോയിലിലേക്ക് മാഗ്നറ്റ് തള്ളുന്നു. കോയിൽ തിരിച്ച് തള്ളുന്നു!'),
 defn:L('<b>Lenz’s law:</b> the induced current flows in the direction that <i>opposes the change</i> that made it. Your effort is turned into electrical energy.','<b>लेंज़ का लॉ:</b> इंड्यूस्ड करंट उस दिशा में बहता है जो उसे बनाने वाले <i>बदलाव का विरोध</i> करे। आपकी मेहनत इलेक्ट्रिकल एनर्जी बनती है।','<b>ലെൻസിന്റെ ലോ:</b> ഇൻഡ്യൂസ്ഡ് കറന്റ് അതിനെ ഉണ്ടാക്കിയ <i>മാറ്റത്തെ എതിർക്കുന്ന</i> ദിശയിൽ ഒഴുകും. നിങ്ങളുടെ പ്രയത്നം ഇലക്ട്രിക്കൽ എനർജി ആകുന്നു.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="Coil end repelling an approaching N pole">${magnet(20,36,70,28,true)}${coilH(160,50,80,50,6,3)}${TT(150,94,'Approaching N meets an N face','आता N, N फेस से मिलता है','വരുന്ന N, N മുഖത്തെ കാണുന്നു','m')}</svg>`,
 play:L('Press Push N in. Then Pull N out. Watch the coil’s left face.','Push N in दबाओ। फिर Pull N out। कॉइल का लेफ्ट फेस देखो।','Push N in അമർത്തൂ. പിന്നെ Pull N out. കോയിലിന്റെ ഇടത് മുഖം നോക്കൂ.'),
 pred:{q:L('The N pole of a magnet moves towards a coil. The nearer coil face becomes …','मैग्नेट का N पोल कॉइल की तरफ़ आता है। पास वाला कॉइल फेस बनता है …','മാഗ്നറ്റിന്റെ N പോൾ കോയിലിന് നേരെ വരുന്നു. അടുത്ത കോയിൽ മുഖം ആകുന്നത് …'),o:[L('N (it repels)','N (दूर धकेलता है)','N (വികർഷിക്കും)'),L('S (it attracts)','S (खींचता है)','S (ആകർഷിക്കും)'),L('no pole','कोई पोल नहीं','പോൾ ഇല്ല')],a:0,why:L('Opposing the approach means repelling. Like poles repel (slide 3).','आने का विरोध मतलब दूर धकेलना। समान पोल दूर भागते हैं (स्लाइड 3)।','വരവിനെ എതിർക്കുക എന്നാൽ വികർഷിക്കുക. ഒരേ പോൾ വികർഷിക്കും (സ്ലൈഡ് 3).')},
 labels:['coilt','pole'],hints:['emf'],
 note:L('When the magnet moves away, the face turns S and pulls it back. Either way the coil resists the motion.','मैग्नेट दूर जाए तो फेस S हो जाता है और उसे वापस खींचता है। दोनों तरह कॉइल मोशन का विरोध करती है।','മാഗ്നറ്റ് അകന്നാൽ മുഖം S ആയി തിരികെ വലിക്കും. രണ്ട് വിധത്തിലും കോയിൽ ചലനത്തെ എതിർക്കും.'),
 trick:L('Nature hates change. The coil fights back.','कुदरत बदलाव नहीं चाहती। कॉइल लड़ती है।','പ്രകൃതി മാറ്റം ഇഷ്ടപ്പെടില്ല. കോയിൽ എതിർക്കും.'),
 check:{q:L('The magnet leaves the coil. By Lenz’s law the nearer coil face becomes … and the force on the magnet is …','मैग्नेट कॉइल से दूर जाता है। लेंज़ के लॉ से पास वाला फेस … और मैग्नेट पर फोर्स …','മാഗ്നറ്റ് കോയിലിൽ നിന്ന് അകലുന്നു. ലെൻസ് ലോ പ്രകാരം അടുത്ത മുഖം … മാഗ്നറ്റിലെ ഫോഴ്സ് …'),o:[L('S, pulling it back','S, वापस खींचता','S, തിരികെ വലിക്കും'),L('N, pushing it away','N, दूर धकेलता','N, തള്ളിമാറ്റും')],a:0},
 build(w,api){
  w.innerHTML=S(420,230,`<g id="a"></g>`,'A magnet approaching or leaving a coil, with the induced pole on the coil face and force arrows');
  const rd=mkRd(w),c=mkCtl(w);let pos=0,mode=0;
  button(c,L('Push N in','N अंदर धकेलो','N അകത്തേക്ക് തള്ളൂ'),()=>{mode=1;api.redraw()},'on');
  button(c,L('Pull N out','N बाहर खींचो','N പുറത്തേക്ക് വലിക്കൂ'),()=>{mode=-1;api.redraw()});
  button(c,L('Stop','रुको','നിർത്തൂ'),()=>{mode=0;api.redraw()});
  api.setReplay(()=>{pos=0;mode=0});
  return(t,dt)=>{pos=clamp(pos+mode*dt*45,0,100);if((pos>=100&&mode>0)||(pos<=0&&mode<0))mode=0;
   const mx=30+pos*1.2,vel=mode;
   let s=magnet(mx,86,100,34,true)+coilH(215,103,110,84,6,3.5);
   const face=vel>0?'N':vel<0?'S':'';
   if(face){s+=`<text x="205" y="68" text-anchor="middle" style="font:800 24px NL,sans-serif;fill:${face==='N'?NC:SC}">${face}</text>`;
    s+=vel>0?arr(mx+60,150,mx+20,150,'var(--no)',4):arr(mx+40,150,mx+80,150,'var(--no)',4);
    s+=`<text x="${mx+50}" y="176" text-anchor="middle" class="tx s" data-en="${vel>0?'Push-back':'Pull-back'}" data-hi="${vel>0?'पीछे धक्का':'पीछे खिंचाव'}" data-ml="${vel>0?'തിരിച്ചുള്ള തള്ളൽ':'തിരിച്ചുള്ള വലിവ്'}">${vel>0?'Push-back':'Pull-back'}</text>`}
   s+=`<path d="M215 142V190H325V142" class="w" fill="none"/><circle cx="270" cy="190" r="12" class="sf"/><text x="270" y="195" text-anchor="middle" class="tx s">A</text>`;
   put($('#a',w),s);
   setRd(rd,`<span>${vel>0?RD('N comes in: coil face = N. Repels.','N आ रहा: कॉइल फेस = N। दूर धकेलता।','N വരുന്നു: കോയിൽ മുഖം = N. വികർഷിക്കും.'):vel<0?RD('N goes out: coil face = S. Attracts.','N जा रहा: कॉइल फेस = S। खींचता।','N പോകുന്നു: കോയിൽ മുഖം = S. ആകർഷിക്കും.'):RD('Still: no induced current.','स्थिर: इंड्यूस्ड करंट नहीं।','നിശ്ചലം: ഇൻഡ്യൂസ്ഡ് കറന്റ് ഇല്ല.')}</span>`)}}});

/* ---------- 13 Fleming right hand ---------- */
CS({id:'m_flem',menu:'Fleming’s right-hand rule',title:'t_flem',
 flash:FB('Current direction (Module 0, slide 7); Faraday (slide 11)','करंट की दिशा (मॉड्यूल 0, स्लाइड 7); फैराडे (स्लाइड 11)','കറന്റ് ദിശ (മൊഡ്യൂൾ 0, സ്ലൈഡ് 7); ഫാരഡേ (സ്ലൈഡ് 11)'),
 hook:L('A wire moves through a field. Which way does the EMF push current?','वायर फील्ड में चलता है। EMF करंट को किधर धकेलता है?','വയർ ഫീൽഡിലൂടെ നീങ്ങുന്നു. EMF കറന്റിനെ ഏത് വഴി തള്ളും?'),
 defn:L('<b>Fleming’s right-hand rule (generator):</b> thumb = Motion, first finger = Field (N to S), second finger = induced Current (EMF). Keep them at right angles.','<b>फ्लेमिंग का राइट-हैंड रूल (जनरेटर):</b> अंगूठा = मोशन, पहली उंगली = फील्ड (N से S), दूसरी उंगली = इंड्यूस्ड करंट (EMF)। तीनों समकोण पर।','<b>ഫ്ലെമിങ്ങിന്റെ റൈറ്റ്-ഹാൻഡ് റൂൾ (ജനറേറ്റർ):</b> തള്ളവിരൽ = മോഷൻ, ചൂണ്ടുവിരൽ = ഫീൽഡ് (N മുതൽ S വരെ), നടുവിരൽ = ഇൻഡ്യൂസ്ഡ് കറന്റ് (EMF). മൂന്നും പരസ്പരം ലംബമായി.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="Thumb, first finger and second finger at right angles labelled Motion, Field, Current"><path d="M150 70V20" stroke="var(--def)" stroke-width="4"/><path d="M150 70H215" stroke="var(--frm)" stroke-width="4"/><path d="M150 70L110 98" stroke="var(--tip)" stroke-width="4"/>${TT(150,14,'Thumb: Motion','अंगूठा: मोशन','തള്ളവിരൽ: മോഷൻ','m')}${TT(246,74,'1st: Field','पहली: फील्ड','ഒന്നാം: ഫീൽഡ്','m')}${TT(76,96,'2nd: Current','दूसरी: करंट','രണ്ടാം: കറന്റ്','m')}</svg>`,
 play:L('Press Move up or Move down. Press Flip field. Watch ⊗ and ⊙.','Move up या Move down दबाओ। Flip field दबाओ। ⊗ और ⊙ देखो।','Move up അല്ലെങ്കിൽ Move down അമർത്തൂ. Flip field അമർത്തൂ. ⊗, ⊙ നോക്കൂ.'),
 pred:{q:L('The field goes from N (left) to S (right). The wire moves up. The induced current is …','फील्ड N (लेफ्ट) से S (राइट) की तरफ़। वायर ऊपर चलता है। इंड्यूस्ड करंट …','ഫീൽഡ് N (ഇടത്) മുതൽ S (വലത്) വരെ. വയർ മുകളിലേക്ക്. ഇൻഡ്യൂസ്ഡ് കറന്റ് …'),o:[L('into the page ⊗','पेज के अंदर ⊗','പേജിനുള്ളിലേക്ക് ⊗'),L('out of the page ⊙','पेज के बाहर ⊙','പേജിന് പുറത്തേക്ക് ⊙'),L('none','नहीं','ഇല്ല')],a:0,why:L('Thumb up, first finger right: the second finger points into the page.','अंगूठा ऊपर, पहली उंगली दाएँ: दूसरी उंगली पेज के अंदर।','തള്ളവിരൽ മുകളിൽ, ചൂണ്ടുവിരൽ വലത്: നടുവിരൽ പേജിനുള്ളിലേക്ക്.')},
 labels:['flux'],hints:['emf'],
 note:L('Generators use the right hand. Motors use the left hand (Module 7). Mnemonic: Right = generate.','जनरेटर में राइट हैंड। मोटर में लेफ्ट हैंड (मॉड्यूल 7)। याद: Right = generate।','ജനറേറ്ററിന് വലത് കൈ. മോട്ടോറിന് ഇടത് കൈ (മൊഡ്യൂൾ 7). ഓർമ്മ: Right = generate.'),
 trick:L('Thumb Motion, First Field, Second Current.','अंगूठा मोशन, पहली फील्ड, दूसरी करंट।','തള്ളവിരൽ മോഷൻ, ഒന്ന് ഫീൽഡ്, രണ്ട് കറന്റ്.'),
 check:{q:L('A generator coil moves, so flux changes. EMF appears only if the conductor … the field lines.','जनरेटर कॉइल चलती है, फ्लक्स बदलता है। EMF तभी आता है जब कंडक्टर फील्ड लाइन को …','ജനറേറ്റർ കോയിൽ നീങ്ങുന്നു, ഫ്ലക്സ് മാറുന്നു. കണ്ടക്ടർ ഫീൽഡ് ലൈനുകളെ … മാത്രമേ EMF ഉണ്ടാകൂ.'),o:[L('cuts','काटे','മുറിക്കുമ്പോൾ'),L('runs along','के साथ चले','ഒപ്പം ഓടുമ്പോൾ')],a:0},
 build(w,api){
  w.innerHTML=S(420,230,`<g id="a"></g>`,'A conductor between a N pole on the left and a S pole on the right, moving up or down');
  const rd=mkRd(w),c=mkCtl(w);let mv=0,flip=false,y=115;
  button(c,L('Move up','ऊपर','മുകളിലേക്ക്'),()=>{mv=1;api.redraw()},'on');
  button(c,L('Move down','नीचे','താഴേക്ക്'),()=>{mv=-1;api.redraw()});
  button(c,L('Stop','रुको','നിർത്തൂ'),()=>{mv=0;api.redraw()});
  button(c,L('Flip field','फील्ड पलटो','ഫീൽഡ് മറിക്കൂ'),()=>{flip=!flip;api.redraw()});
  return(t,dt)=>{y=clamp(y-mv*dt*50,45,185);if(y<=45||y>=185)mv=0;
   const Bdir=flip?-1:1;let s=`<rect x="14" y="30" width="60" height="170" fill="${flip?SC:NC}" stroke="#0007" stroke-width="1.5"/><text x="44" y="122" text-anchor="middle" fill="#fff" style="font:800 28px NL,sans-serif">${flip?'S':'N'}</text><rect x="346" y="30" width="60" height="170" fill="${flip?NC:SC}" stroke="#0007" stroke-width="1.5"/><text x="376" y="122" text-anchor="middle" fill="#fff" style="font:800 28px NL,sans-serif">${flip?'N':'S'}</text>`;
   for(let k=0;k<5;k++){const yy=50+k*35;s+=arr(Bdir>0?90:330,yy,Bdir>0?330:90,yy,'var(--def)',1.8)}
   s+=`<circle cx="210" cy="${y.toFixed(0)}" r="16" fill="${CU}" stroke="${CUD}" stroke-width="2"/>`;
   /* v x B: z-component = vx*By - vy*Bx ; v=(0,mv) y-up, B=(Bdir,0) => -mv*Bdir ; negative => into page */
   const z=-mv*Bdir;const sym=z===0?'':(z<0?'⊗':'⊙');
   if(sym)s+=`<text x="210" y="${(y+7).toFixed(0)}" text-anchor="middle" fill="#fff" style="font:800 20px NL,sans-serif">${sym}</text>`;
   if(mv)s+=arr(210,mv>0?y-22:y+22,210,mv>0?y-50:y+50,'var(--tip)',4);
   put($('#a',w),s);
   setRd(rd,`<span>${mv===0?RD('Not moving: no EMF','चल नहीं रहा: EMF नहीं','നീങ്ങുന്നില്ല: EMF ഇല്ല'):z<0?RD('Current into the page ⊗','करंट पेज के अंदर ⊗','കറന്റ് പേജിനുള്ളിലേക്ക് ⊗'):RD('Current out of the page ⊙','करंट पेज के बाहर ⊙','കറന്റ് പേജിന് പുറത്തേക്ക് ⊙')}</span>`)}}});

/* ---------- 14 Self-induction ---------- */
CS({id:'m_self',menu:'Self-induction',title:'t_self',
 flash:FB('V, I, R: I = V ÷ R (Module 0, slide 14)','V, I, R: I = V ÷ R (मॉड्यूल 0, स्लाइड 14)','V, I, R: I = V ÷ R (മൊഡ്യൂൾ 0, സ്ലൈഡ് 14)'),
 hook:L('Switch on a coil: the lamp comes up slowly. Switch off: a spark!','कॉइल ऑन करो: लैंप धीरे-धीरे जलता है। ऑफ करो: चिंगारी!','കോയിൽ ഓൺ ചെയ്യൂ: ലാമ്പ് പതുക്കെ തെളിയും. ഓഫ് ചെയ്യൂ: സ്പാർക്ക്!'),
 defn:L('<b>Self-induction:</b> a coil resists any change in its own current by inducing an EMF in itself. This property is <b>inductance L</b>, unit henry (H).','<b>सेल्फ-इंडक्शन:</b> कॉइल अपने ही करंट के बदलाव का विरोध खुद में EMF बनाकर करती है। यह गुण <b>इंडक्टेंस L</b> है, यूनिट हेनरी (H)।','<b>സെൽഫ്-ഇൻഡക്ഷൻ:</b> കോയിൽ സ്വന്തം കറന്റിലെ ഏത് മാറ്റത്തെയും സ്വയം EMF ഉണ്ടാക്കി എതിർക്കും. ഈ ഗുണം <b>ഇൻഡക്ടൻസ് L</b>, യൂണിറ്റ് ഹെൻറി (H).'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="A choke coil in series with a lamp">${coilH(70,50,70,40,5,3)}<circle cx="210" cy="50" r="18" class="sf"/>${TT(105,92,'Coil: slow rise','कॉइल: धीमा बढ़ना','കോയിൽ: പതുക്കെ കൂടും','m')}</svg>`,
 play:L('Pick L. Press Switch ON, then Switch OFF. Watch the graph and the spark.','L चुनो। Switch ON दबाओ, फिर Switch OFF। ग्राफ और चिंगारी देखो।','L തിരഞ്ഞെടുക്കൂ. Switch ON, പിന്നെ Switch OFF അമർത്തൂ. ഗ്രാഫും സ്പാർക്കും നോക്കൂ.'),
 pred:{q:L('The switch is opened on a coil carrying current. The sudden change makes …','करंट वाली कॉइल का स्विच खोला। अचानक बदलाव बनाता है …','കറന്റ് ഉള്ള കോയിലിന്റെ സ്വിച്ച് തുറന്നു. പെട്ടെന്നുള്ള മാറ്റം ഉണ്ടാക്കുന്നത് …'),o:[L('a high EMF and a spark','हाई EMF और चिंगारी','ഉയർന്ന EMF-ഉം സ്പാർക്കും'),L('zero voltage','ज़ीरो वोल्टेज','പൂജ്യം വോൾട്ടേജ്'),L('a cooler coil','ठंडी कॉइल','തണുത്ത കോയിൽ')],a:0,why:L('Current tries to keep flowing. The coil induces a large EMF that jumps across the switch.','करंट बहते रहना चाहता है। कॉइल बड़ा EMF बनाती है जो स्विच पर कूदता है।','കറന്റ് ഒഴുകിക്കൊണ്ടിരിക്കാൻ ശ്രമിക്കും. കോയിൽ വലിയ EMF ഉണ്ടാക്കി സ്വിച്ചിൽ ചാടും.')},
 labels:['henry','tconst'],hints:['vir','heat'],rel:{c:['V','I','R','L','τ'],h:'τ'},
 fm:['<i>τ</i> = <i>L</i> ÷ <i>R</i>'],

 ex:L('Mental sum: L = 2 H, R = 4 Ω gives τ = 0.5 s. Full current in about 2.5 s.','मेंटल सम: L = 2 H, R = 4 Ω तो τ = 0.5 s। पूरा करंट करीब 2.5 s में।','മെന്റൽ സം: L = 2 H, R = 4 Ω ആണെങ്കിൽ τ = 0.5 s. പൂർണ്ണ കറന്റ് ഏകദേശം 2.5 s-ൽ.'),
 trick:L('Big L, slow rise, big spark.','बड़ा L, धीमा चढ़ना, बड़ी चिंगारी।','വലിയ L, പതുക്കെ കൂടൽ, വലിയ സ്പാർക്ക്.'),
 check:{q:L('A coil has L = 3 H and R = 6 Ω. Time constant τ = L ÷ R = ? Final current at 12 V = ?','कॉइल L = 3 H, R = 6 Ω। टाइम कॉन्स्टेंट τ = L ÷ R = ? 12 V पर फाइनल करंट = ?','കോയിൽ L = 3 H, R = 6 Ω. ടൈം കോൺസ്റ്റന്റ് τ = L ÷ R = ? 12 V-ൽ ഫൈനൽ കറന്റ് = ?'),o:['0.5 s, 2 A','2 s, 0.5 A','0.5 s, 72 A'],a:0},
 build(w,api){
  w.innerHTML=S(420,230,`<g id="a"></g>`,'A graph of current rising slowly after the switch is closed and a spark when it is opened');
  const rd=mkRd(w),c=mkCtl(w);let Lh=2,on=false,i=0,spark=0,tt=0;const hist=[];const R=4,V=12;
  const lb=[1,2,4].map(v=>button(c,'L = '+v+' H',()=>{Lh=v;lb.forEach((b,k)=>b.classList.toggle('on',[1,2,4][k]===v));api.redraw()},v===2?'on':''));
  button(c,L('Switch ON','स्विच ON','സ്വിച്ച് ON'),()=>{on=true;api.redraw()},'on');
  button(c,L('Switch OFF','स्विच OFF','സ്വിച്ച് OFF'),()=>{if(on&&i>.5)spark=1;on=false;api.redraw()});
  api.setReplay(()=>{on=false;i=0;hist.length=0});
  return(t,dt)=>{dt=Math.min(dt,.05);
   if(on)i+=(V-i*R)/Lh*dt;else i=Math.max(0,i-i*dt*(spark>0?12:4));
   spark=Math.max(0,spark-dt*2.5);hist.push(i);if(hist.length>160)hist.shift();
   const x0=30,y0=170,W=360,Hh=130;let pts='',pts2='';
   hist.forEach((v,k)=>{pts+=(k?'L':'M')+(x0+k/160*W).toFixed(1)+' '+(y0-v/3*Hh*0.95).toFixed(1)});
   let s=`<path d="M${x0} ${y0}H${x0+W}M${x0} ${y0}V${y0-Hh}" stroke="var(--mut)" stroke-width="1.5" fill="none"/><path d="M${x0} ${y0-Hh*.95}H${x0+W}" stroke="var(--mut)" stroke-dasharray="4 5" fill="none"/><path d="${pts}" fill="none" stroke="var(--def)" stroke-width="3.5"/>`;
   s+=`<text x="${x0+4}" y="${y0-Hh-2}" class="tx s">I (A)</text>`;
   s+=`<circle cx="360" cy="40" r="${(14+i*4).toFixed(0)}" fill="var(--glow)" opacity="${(Math.min(1,i/3)).toFixed(2)}" stroke="var(--wire)" stroke-width="2"/>`;
   if(spark>0)s+=`<path d="M300 30l10 14-8 0 10 16-18-20 8 0z" fill="var(--glow)" stroke="var(--no)" stroke-width="2" transform="scale(${(1+spark).toFixed(2)})" transform-origin="305px 45px"/>`;
   put($('#a',w),s);
   setRd(rd,`<span>τ = L ÷ R = ${Lh} ÷ ${R} = <b>${Lh/R} s</b></span><span>I = <b>${i.toFixed(2)} A</b></span><span>${on?RD('closed','बंद','അടച്ചു'):RD('open','खुला','തുറന്നു')}</span>`)}}});

CS({id:'m_mut',menu:'Mutual induction',title:'t_mut',
 flash:FB('DC and AC (Module 0, slide 22); self-induction (slide 14)','DC और AC (मॉड्यूल 0, स्लाइड 22); सेल्फ-इंडक्शन (स्लाइड 14)','DC, AC (മൊഡ്യൂൾ 0, സ്ലൈഡ് 22); സെൽഫ്-ഇൻഡക്ഷൻ (സ്ലൈഡ് 14)'),
 hook:L('Two coils, no wire between them. Yet one lights a lamp from the other.','दो कॉइल, बीच में कोई तार नहीं। फिर भी एक दूसरी से लैंप जलाती है।','രണ്ട് കോയിൽ, ഇടയിൽ വയർ ഇല്ല. എങ്കിലും ഒന്ന് മറ്റൊന്നിൽ നിന്ന് ലാമ്പ് തെളിയിക്കുന്നു.'),
 defn:L('<b>Mutual induction:</b> changing current in coil 1 changes the flux through coil 2 and induces an EMF in it. Steady DC makes no EMF. AC changes all the time, so it works. This is the transformer idea.','<b>म्यूचुअल इंडक्शन:</b> कॉइल 1 का बदलता करंट कॉइल 2 का फ्लक्स बदलता है और उसमें EMF बनता है। स्थिर DC से EMF नहीं। AC हर समय बदलता है, इसलिए काम करता है। यही ट्रांसफॉर्मर का आइडिया है।','<b>മ്യൂച്വൽ ഇൻഡക്ഷൻ:</b> കോയിൽ 1-ലെ കറന്റ് മാറുമ്പോൾ കോയിൽ 2-ലെ ഫ്ലക്സ് മാറി അതിൽ EMF ഉണ്ടാകും. സ്ഥിരമായ DC EMF ഉണ്ടാക്കില്ല. AC എപ്പോഴും മാറുന്നതിനാൽ പ്രവർത്തിക്കും. ഇതാണ് ട്രാൻസ്ഫോർമർ ആശയം.'),
 real:`<svg viewBox="0 0 300 100" role="img" aria-label="Two coils on one iron core"><rect x="110" y="20" width="80" height="60" fill="none" stroke="${FE}" stroke-width="12"/>${coilH(70,50,40,36,4,3)}${coilH(190,50,40,36,4,3)}</svg>`,
 play:L('Try DC switch ON, DC switch OFF, then AC. Change the secondary turns.','DC ON, DC OFF, फिर AC आज़माओ। सेकंडरी टर्न बदलो।','DC ON, DC OFF, പിന്നെ AC പരീക്ഷിക്കൂ. സെക്കൻഡറി ടേൺ മാറ്റൂ.'),
 pred:{q:L('Steady DC flows in coil 1. The lamp on coil 2 …','कॉइल 1 में स्थिर DC बह रहा है। कॉइल 2 का लैंप …','കോയിൽ 1-ൽ സ്ഥിര DC ഒഴുകുന്നു. കോയിൽ 2-ലെ ലാമ്പ് …'),o:[L('stays off','बंद रहता है','ഓഫ് തന്നെ'),L('glows steadily','लगातार जलता है','തുടർച്ചയായി തെളിയും'),L('blows','फ्यूज़ हो जाता है','കത്തിപ്പോകും')],a:0,why:L('Steady DC means steady flux. No change, no EMF in coil 2.','स्थिर DC मतलब स्थिर फ्लक्स। बदलाव नहीं तो कॉइल 2 में EMF नहीं।','സ്ഥിര DC എന്നാൽ സ്ഥിര ഫ്ലക്സ്. മാറ്റമില്ലെങ്കിൽ കോയിൽ 2-ൽ EMF ഇല്ല.')},
 labels:['coilt','flux'],hints:['cyc','emf'],rel:{c:['f','Φ','N','V<sub>2</sub>'],h:'V<sub>2</sub>'},
 fm:['<i>V<sub>2</sub></i> = <i>V<sub>1</sub></i> × <i>N<sub>2</sub></i> ÷ <i>N<sub>1</sub></i>'],
 uses:L('Ideal, AC only, no losses. Preview of the transformer (Module 9). V in volt, N turns.','आइडियल, सिर्फ़ AC, कोई लॉस नहीं। ट्रांसफॉर्मर का प्रीव्यू (मॉड्यूल 9)। V वोल्ट में, N टर्न।','ഐഡിയൽ, AC മാത്രം, നഷ്ടം ഇല്ല. ട്രാൻസ്ഫോർമറിന്റെ പ്രിവ്യൂ (മൊഡ്യൂൾ 9). V വോൾട്ടിൽ, N ടേൺ.'),
 ex:L('Mental sum: 230 V, N1 = 1000, N2 = 100: V2 = 230 × 100 ÷ 1000 = 23 V.','मेंटल सम: 230 V, N1 = 1000, N2 = 100: V2 = 230 × 100 ÷ 1000 = 23 V।','മെന്റൽ സം: 230 V, N1 = 1000, N2 = 100: V2 = 230 × 100 ÷ 1000 = 23 V.'),
 trick:L('Changing flux only. AC works. DC does not.','सिर्फ़ बदलता फ्लक्स। AC चलता है। DC नहीं।','മാറുന്ന ഫ്ലക്സ് മാത്രം. AC ശരി. DC അല്ല.'),
 check:{q:L('Primary 12 V AC, N1 = 100 turns, N2 = 50 turns. V2 = ? Also 50 Hz means T = 1 ÷ f = ?','प्राइमरी 12 V AC, N1 = 100, N2 = 50 टर्न। V2 = ? और 50 Hz मतलब T = 1 ÷ f = ?','പ്രൈമറി 12 V AC, N1 = 100, N2 = 50 ടേൺ. V2 = ? 50 Hz എന്നാൽ T = 1 ÷ f = ?'),o:['6 V, 20 ms','24 V, 20 ms','6 V, 50 s'],a:0},
 build(w,api){
  w.innerHTML=S(420,230,`<g id="a"></g>`,'Two coils on an iron core. A lamp on the right coil glows when the left coil current changes');
  const rd=mkRd(w),c=mkCtl(w);let mode='off',N2=100,pulse=0,lastTrig=0,ts=0;
  button(c,L('DC: switch ON','DC: स्विच ON','DC: സ്വിച്ച് ON'),()=>{mode='dc';pulse=1;api.redraw()},'on');
  button(c,L('DC: switch OFF','DC: स्विच OFF','DC: സ്വിച്ച് OFF'),()=>{if(mode==='dc')pulse=1;mode='off';api.redraw()});
  button(c,L('AC source','AC सोर्स','AC സോഴ്സ്'),()=>{mode='ac';api.redraw()});

   let s=`<rect x="130" y="40" width="160" height="110" fill="none" stroke="${FE}" stroke-width="22" opacity=".6"/>`+coilH(86,95,50,60,5,3.5)+coilH(284,95,Math.min(100,30+N2/6),60,Math.max(3,Math.round(N2/60)),3.5);
   s+=`<circle cx="360" cy="100" r="24" fill="var(--glow)" opacity="${glow.toFixed(2)}" stroke="var(--wire)" stroke-width="2.5"/>`;
   s+=`<text x="105" y="190" text-anchor="middle" class="tx s">${mode==='ac'?'~ 12 V':mode==='dc'?'DC ON':'DC OFF'}</text><text x="340" y="190" class="tx s">V₂ = ${V2.toFixed(0)} V</text>`;
   if(mode==='ac'){const ph=Math.sin(t*10);s+=`<circle cx="${(210+ph*70).toFixed(0)}" cy="40" r="5" fill="var(--def)"/><circle cx="${(210-ph*70).toFixed(0)}" cy="150" r="5" fill="var(--def)"/>`}
   put($('#a',w),s);
   setRd(rd,`<span>V₂ = 12 × ${N2} ÷ 100 = <b>${V2.toFixed(0)} V</b></span><span>${mode==='ac'?RD('AC: flux keeps changing, lamp glows','AC: फ्लक्स बदलता रहता, लैंप जलता','AC: ഫ്ലക്സ് മാറിക്കൊണ്ടിരിക്കും, ലാമ്പ് തെളിയും'):mode==='dc'?RD('DC: only a flash when switched','DC: सिर्फ़ स्विच करने पर झलक','DC: സ്വിച്ച് ചെയ്യുമ്പോൾ മാത്രം മിന്നൽ'):RD('Off','ऑफ','ഓഫ്')}</span>`)}}});

/* ---------- group widget for 16 and 20 ---------- */
const GV=[1,2,5,10,20,50,100];
function groupWidget(w,api,kind){
  const isC=kind==='C';const unit=isC?'µF':'mH';
  w.innerHTML=S(420,236,`<g id="a"></g>`,isC?'Two capacitors in series or parallel with a total':'Two inductors in series or parallel with a total');
  const rd=mkRd(w),c=mkCtl(w);let mode='ser',i1=3,i2=3;
  const bs=button(c,L('Series','सीरीज़','സീരീസ്'),()=>{mode='ser';bs.classList.add('on');bp.classList.remove('on');api.redraw()},'on');
  const bp=button(c,L('Parallel','पैरेलल','പാരലൽ'),()=>{mode='par';bp.classList.add('on');bs.classList.remove('on');api.redraw()});
  slider(c,(isC?'C₁':'L₁'),0,6,1,3,x=>GV[x]+' '+unit,x=>{i1=x;api.redraw()});
  slider(c,(isC?'C₂':'L₂'),0,6,1,3,x=>GV[x]+' '+unit,x=>{i2=x;api.redraw()});
  api.setReplay(()=>{});
  const sym=isC?symCap:symInd;
  return t=>{const a=GV[i1],b=GV[i2];
   const addMode=isC?mode==='par':mode==='ser';
   const eq=addMode?a+b:a*b/(a+b);
   let s='';
   if(mode==='ser'){s+=`<path class="w" d="M20 54H50M130 54H150M230 54H260"/>`+sym(90,54,0)+sym(190,54,0);
    s+=`<text x="90" y="30" text-anchor="middle" class="tx">${isC?'C₁':'L₁'} ${a}</text><text x="190" y="30" text-anchor="middle" class="tx">${isC?'C₂':'L₂'} ${b}</text>`}
  else{s+=`<path class="w" d="M20 54H60M60 30V78M60 30H70M60 78H70M180 30H190M180 78H190M190 30V78M190 54H260"/>`+sym(125,30,0)+sym(125,78,0);
    s+=`<text x="125" y="14" text-anchor="middle" class="tx">${isC?'C₁':'L₁'} ${a}</text><text x="125" y="108" text-anchor="middle" class="tx">${isC?'C₂':'L₂'} ${b}</text>`}
   /* bars */
   const mx=Math.max(a,b,eq,1),bw=n=>Math.max(4,n/mx*210);
   const rows=[[isC?'C₁':'L₁',a,'var(--def)'],[isC?'C₂':'L₂',b,'var(--law)'],[RD('Total','टोटल','ടോട്ടൽ').replace(/<[^>]+>/g,'')+'',eq,'var(--frm)']];
   s+=rows.map((r,k)=>{const y=134+k*32;return `<rect x="70" y="${y}" width="${bw(r[1]).toFixed(0)}" height="20" rx="4" fill="${r[2]}"/><text x="8" y="${y+16}" class="tx s">${k<2?r[0]:'Σ'}</text><text x="${(76+bw(r[1])).toFixed(0)}" y="${y+16}" class="tx" style="font-size:15px">${fm1(r[1])} ${unit}</text>`}).join('');
   put($('#a',w),s);
   let extra='';
   if(isC&&mode==='ser'){const V=200,v1=V*b/(a+b),v2=V*a/(a+b);extra=`<span>${RD('On 200 V','200 V पर','200 V-ൽ')}: C₁ <b>${fm1(v1)} V</b> · C₂ <b>${fm1(v2)} V</b></span><span class="note" style="margin:0">${RD('The smaller C takes the bigger voltage.','छोटा C बड़ा वोल्टेज लेता है।','ചെറിയ C കൂടുതൽ വോൾട്ടേജ് എടുക്കും.')}</span>`}
   else if(isC)extra=`<span class="note" style="margin:0">${RD('Same voltage on both. Total C adds.','दोनों पर वही वोल्टेज। टोटल C जुड़ता है।','രണ്ടിലും ഒരേ വോൾട്ടേജ്. ടോട്ടൽ C കൂടും.')}</span>`;
   setRd(rd,`<span>${isC?'C':'L'}<sub>T</sub> = <b>${fm1(eq)} ${unit}</b></span>${extra}`)}}

 play:L('Pick Series or Parallel. Slide L₁ and L₂. Read the total.','सीरीज़ या पैरेलल चुनो। L₁ और L₂ स्लाइड करो। टोटल पढ़ो।','സീരീസ് അല്ലെങ്കിൽ പാരലൽ തിരഞ്ഞെടുക്കൂ. L₁, L₂ സ്ലൈഡ് ചെയ്യൂ. ടോട്ടൽ വായിക്കൂ.'),
 pred:{q:L('Two 10 mH inductors in parallel (no coupling). Total = ?','दो 10 mH इंडक्टर पैरेलल में (कपलिंग नहीं)। टोटल = ?','രണ്ട് 10 mH ഇൻഡക്ടർ പാരലലിൽ (കപ്ലിംഗ് ഇല്ല). ടോട്ടൽ = ?'),o:['5 mH','20 mH','10 mH'],a:0,why:L('Equal parts in parallel: 10 ÷ 2 = 5 mH. Same as resistors.','बराबर पार्ट पैरेलल: 10 ÷ 2 = 5 mH। रेसिस्टर जैसा ही।','തുല്യ പാർട്ടുകൾ പാരലലിൽ: 10 ÷ 2 = 5 mH. റെസിസ്റ്റർ പോലെ തന്നെ.')},
 labels:['henry'],hints:['ser','par'],rel:{c:['R','L','L<sub>T</sub>'],h:'L<sub>T</sub>'},

 uses:L('Assumes no mutual coupling between the coils. Same rules as Module 2, slide 11.','मान लिया कि कॉइल के बीच म्यूचुअल कपलिंग नहीं। नियम वही जो मॉड्यूल 2, स्लाइड 11 में।','കോയിലുകൾക്കിടയിൽ മ്യൂച്വൽ കപ്ലിംഗ് ഇല്ലെന്ന് കരുതുന്നു. മൊഡ്യൂൾ 2, സ്ലൈഡ് 11-ലെ അതേ നിയമങ്ങൾ.'),
 ex:L('Mental sum: 30 mH + 20 mH = 50 mH in series. 30 mH and 60 mH in parallel: 30 × 60 ÷ 90 = 20 mH.','मेंटल सम: सीरीज़ में 30 mH + 20 mH = 50 mH। पैरेलल में 30 और 60 mH: 30 × 60 ÷ 90 = 20 mH।','മെന്റൽ സം: സീരീസിൽ 30 mH + 20 mH = 50 mH. പാരലലിൽ 30, 60 mH: 30 × 60 ÷ 90 = 20 mH.'),
 trick:L('L acts like R. Series adds.','L, R जैसा। सीरीज़ में जुड़ता है।','L, R പോലെ. സീരീസിൽ കൂടും.'),
