 flash:FB('Phase difference (Module 0, slide 33); transistor action (slide 20)','फेज़ डिफरेंस (मॉड्यूल 0, स्लाइड 33); ट्रांज़िस्टर एक्शन (स्लाइड 20)','ഫേസ് ഡിഫറൻസ് (മൊഡ്യൂൾ 0, സ്ലൈഡ് 33); ട്രാൻസിസ്റ്റർ ആക്ഷൻ (സ്ലൈഡ് 20)'),
 hook:L('A transistor has three legs, but a circuit needs two for input and two for output. One leg must be shared.','ट्रांज़िस्टर की तीन टाँगें, पर सर्किट को इनपुट और आउटपुट दोनों के लिए दो-दो चाहिए। एक टाँग साझी होनी चाहिए।','ട്രാൻസിസ്റ്ററിന് മൂന്ന് കാൽ, പക്ഷേ സർക്യൂട്ടിന് ഇൻപുട്ടിനും ഔട്ട്പുട്ടിനും രണ്ട് വീതം വേണം. ഒരു കാൽ പങ്കിടണം.'),
 defn:L('<b>Configurations:</b> named after the common terminal. <b>CE</b> (common emitter): in at B, out at C. <b>CB</b> (common base): in at E, out at C. <b>CC</b> (common collector, emitter follower): in at B, out at E.','<b>कॉन्फ़िगरेशन:</b> साझे टर्मिनल के नाम पर। <b>CE</b> (कॉमन एमिटर): इनपुट B, आउटपुट C। <b>CB</b> (कॉमन बेस): इनपुट E, आउटपुट C। <b>CC</b> (कॉमन कलेक्टर, एमिटर फॉलोअर): इनपुट B, आउटपुट E।','<b>കോൺഫിഗറേഷൻ:</b> പൊതുവായ ടെർമിനലിന്റെ പേരിൽ. <b>CE</b> (കോമൺ എമിറ്റർ): ഇൻപുട്ട് B, ഔട്ട്പുട്ട് C. <b>CB</b> (കോമൺ ബേസ്): ഇൻപുട്ട് E, ഔട്ട്പുട്ട് C. <b>CC</b> (കോമൺ കളക്ടർ, എമിറ്റർ ഫോളോവർ): ഇൻപുട്ട് B, ഔട്ട്പുട്ട് E.'),
 play:L('Tap CE, CB, CC. Compare the input and output waves.','CE, CB, CC दबाओ। इनपुट और आउटपुट वेव मिलाओ।','CE, CB, CC ടാപ്പ് ചെയ്യൂ. ഇൻപുട്ട്, ഔട്ട്പുട്ട് വേവ് താരതമ്യം ചെയ്യൂ.'),
 pred:{q:L('Which configuration is used most in amplifiers?','एम्प्लिफायर में सबसे ज़्यादा कौन-सा?','ആംപ്ലിഫയറിൽ ഏറ്റവും കൂടുതൽ ഏത്?'),o:['CE','CB','CC'],a:0,why:L('CE gives both voltage gain and current gain, so the most power gain.','CE वोल्टेज और करंट दोनों गेन देता है, तो सबसे ज़्यादा पावर गेन।','CE വോൾട്ടേജ് ഗെയിനും കറന്റ് ഗെയിനും തരുന്നു, അതിനാൽ ഏറ്റവും കൂടുതൽ പവർ ഗെയിൻ.')},
 labels:['emit','base','coll','gain'],hints:['ph','beta'],rel:{c:['Vin','Av','Vout'],h:'Av'},
 ex:L('Example: an emitter follower (CC) lets a weak sensor drive a low-resistance load without losing voltage.','उदाहरण: एमिटर फॉलोअर (CC) कमज़ोर सेंसर को कम रेसिस्टेंस लोड चलाने देता है, वोल्टेज गँवाए बिना।','ഉദാഹരണം: എമിറ്റർ ഫോളോവർ (CC) ദുർബലമായ സെൻസറിനെ വോൾട്ടേജ് കുറയാതെ കുറഞ്ഞ റെസിസ്റ്റൻസ് ലോഡ് ഓടിക്കാൻ സഹായിക്കുന്നു.'),
 trick:L('Common leg is the name. CE flips the wave.','साझी टाँग ही नाम। CE वेव पलटता है।','പൊതു കാൽ തന്നെ പേര്. CE വേവ് മറിക്കുന്നു.'),
 check:{q:L('In CE the output is 180° out of phase (Module 0). When the input rises, the output …','CE में आउटपुट 180° फेज़ में उल्टा (मॉड्यूल 0)। इनपुट बढ़े तो आउटपुट …','CE-യിൽ ഔട്ട്പുട്ട് 180° ഫേസ് മാറി (മൊഡ്യൂൾ 0). ഇൻപുട്ട് കൂടുമ്പോൾ ഔട്ട്പുട്ട് …'),o:[L('falls','गिरता है','താഴുന്നു'),L('rises','बढ़ता है','കൂടുന്നു'),L('stays','वही रहता है','അതേ പോലെ')],a:0},
 build(w,api){
  w.innerHTML=S(400,215,`<g id="a"></g>`,'Transistor configuration with input and output waves');
  const rd=mkRd(w),c=mkCtl(w);let m=0;
  modeBtns(c,['CE','CB','CC'],i=>{m=i;api.redraw()});
  const TP={B:[160,100],C:[192,60],E:[192,140]};
  return t=>{const g=CFG[m],ph=(t*.4)%1;let s=symBJT(200,100,0);
   s+=TXC(148,90,'B','var(--fg)','14')+TXC(208,52,'C','var(--fg)','14')+TXC(208,160,'E','var(--fg)','14');
   const P=k=>k==='B'?[160,100]:k==='C'?[212,60]:[212,140];
   const pi=P(g.inp),po=P(g.out),pc=P(g.com);
   s+=wr(`M${pi[0]} ${pi[1]}H120`)+`<circle cx="120" cy="${pi[1]}" r="5" fill="var(--def)"/>`+wr(`M${po[0]} ${po[1]}H290`)+`<circle cx="290" cy="${po[1]}" r="5" fill="var(--frm)"/>`;
   s+=wr(`M${pc[0]} ${pc[1]}V${pc[1]<100?30:180}`)+(pc[1]<100?'':`<path d="M${pc[0]-14} 180h28M${pc[0]-9} 186h18M${pc[0]-4} 192h8" stroke="var(--wire)" stroke-width="2.5"/>`)+TL(pc[0]+(pc[0]<180?-20:40),pc[1]<100?30:182,['common','कॉमन','കോമൺ'],'var(--ok)');
   s+=`<path d="${wpath(14,pi[1],96,10,u=>Math.sin(TPI*(2*u-ph)))}" stroke="var(--def)" stroke-width="2.5" fill="none"/>`;
   const A=[34,26,10][m];s+=`<path d="${wpath(298,po[1],96,A,u=>Math.sin(TPI*(2*u-ph)+(g.ph?Math.PI:0)))}" stroke="var(--frm)" stroke-width="2.5" fill="none"/>`;
   s+=TL(62,pi[1]+30,['input','इनपुट','ഇൻപുട്ട്'],'var(--def)')+TL(346,po[1]+(po[1]<100?44:-40),['output','आउटपुट','ഔട്ട്പുട്ട്'],'var(--frm)');
   put($('#a',w),s);
   setRd(rd,`<span><b>${g.n}</b> · Av: ${B3(g.av)} · Ai: ${B3(g.ai)}</span><span>${RD('Phase','फेज़','ഫേസ്')}: <b>${g.ph}°</b> · Zin: ${B3(g.zin)}</span>`)}}});

/* ---------- 22 Switch ---------- */
CS({id:'e_sw',menu:'Transistor as a switch',title:'t_sw',
 flash:FB('Self-induction and Lenz’s law (Module 5A, slides 12 and 14)','सेल्फ-इंडक्शन और लेंज़ का नियम (मॉड्यूल 5A, स्लाइड 12 और 14)','സെൽഫ്-ഇൻഡക്ഷൻ, ലെൻസ് നിയമം (മൊഡ്യൂൾ 5A, സ്ലൈഡ് 12, 14)'),
 hook:L('A 5 V timer chip cannot drive a 12 V relay directly. A transistor does the heavy lifting.','5 V टाइमर चिप 12 V रिले सीधे नहीं चला सकती। ट्रांज़िस्टर भारी काम करता है।','5 V ടൈമർ ചിപ്പിന് 12 V റിലേ നേരിട്ട് ഓടിക്കാനാവില്ല. ട്രാൻസിസ്റ്റർ ഭാരിച്ച ജോലി ചെയ്യുന്നു.'),
 defn:L('<b>Transistor switch:</b> <b>cut-off</b>: no base current, transistor OFF, VCE ≈ supply. <b>Saturation</b>: enough base current, transistor fully ON, VCE ≈ 0.2 V. Used to drive relays, lamps and LEDs from small control signals.','<b>ट्रांज़िस्टर स्विच:</b> <b>कट-ऑफ</b>: बेस करंट नहीं, ट्रांज़िस्टर OFF, VCE ≈ सप्लाई। <b>सैचुरेशन</b>: पर्याप्त बेस करंट, पूरा ON, VCE ≈ 0.2 V। छोटे कंट्रोल सिग्नल से रिले, लैंप, LED चलाने में।','<b>ട്രാൻസിസ്റ്റർ സ്വിച്ച്:</b> <b>കട്ട്-ഓഫ്</b>: ബേസ് കറന്റ് ഇല്ല, ട്രാൻസിസ്റ്റർ OFF, VCE ≈ സപ്ലൈ. <b>സാച്ചുറേഷൻ</b>: ആവശ്യത്തിന് ബേസ് കറന്റ്, പൂർണ്ണ ON, VCE ≈ 0.2 V. ചെറിയ കൺട്രോൾ സിഗ്നൽ കൊണ്ട് റിലേ, ലാമ്പ്, LED ഓടിക്കാൻ.'),
 play:L('Press Input ON and OFF. Watch the relay, the lamp and VCE.','Input ON और OFF दबाओ। रिले, लैंप और VCE देखो।','Input ON, OFF അമർത്തൂ. റിലേ, ലാമ്പ്, VCE നോക്കൂ.'),
 pred:{q:L('No base current flows. The collector current is …','बेस करंट नहीं। कलेक्टर करंट …','ബേസ് കറന്റ് ഇല്ല. കളക്ടർ കറന്റ് …'),o:[L('about zero','लगभग ज़ीरो','ഏതാണ്ട് പൂജ്യം'),L('maximum','मैक्सिमम','പരമാവധി'),L('half','आधा','പകുതി')],a:0,why:L('IC = β × IB, and IB = 0. The transistor is in cut-off: an open switch.','IC = β × IB, और IB = 0। ट्रांज़िस्टर कट-ऑफ में: खुला स्विच।','IC = β × IB, IB = 0. ട്രാൻസിസ്റ്റർ കട്ട്-ഓഫിൽ: തുറന്ന സ്വിച്ച്.')},
 labels:['sat','cut'],hints:['beta','vir'],rel:{c:['IB','β','IC'],h:'IB'},
 fm:['<i>I</i><sub>B</sub> > <i>I</i><sub>C(sat)</sub> ÷ β'],
 uses:L('IC(sat) ≈ VCC ÷ load resistance. For a hard switch give 2 to 5 times this base current.','IC(sat) ≈ VCC ÷ लोड रेसिस्टेंस। पक्के स्विच के लिए इस बेस करंट का 2 से 5 गुना दो।','IC(sat) ≈ VCC ÷ ലോഡ് റെസിസ്റ്റൻസ്. ഉറച്ച സ്വിച്ചിന് ഈ ബേസ് കറന്റിന്റെ 2 മുതൽ 5 മടങ്ങ് നൽകൂ.'),
 ex:L('Example: relay coil 12 V, 400 Ω: IC(sat) = 30 mA. With β = 100, IB must exceed 0.3 mA.','उदाहरण: रिले कॉइल 12 V, 400 Ω: IC(sat) = 30 mA। β = 100 पर IB 0.3 mA से ज़्यादा।','ഉദാഹരണം: റിലേ കോയിൽ 12 V, 400 Ω: IC(sat) = 30 mA. β = 100-ൽ IB 0.3 mA-ൽ കൂടണം.'),
 note:L('The diode across the relay coil (flyback diode) absorbs the voltage spike when the transistor turns off.','रिले कॉइल के आर-पार डायोड (फ्लाईबैक डायोड) ट्रांज़िस्टर बंद होने पर वोल्टेज स्पाइक सोखता है।','റിലേ കോയിലിന് കുറുകെയുള്ള ഡയോഡ് (ഫ്ലൈബാക്ക് ഡയോഡ്) ട്രാൻസിസ്റ്റർ ഓഫ് ആകുമ്പോഴുള്ള വോൾട്ടേജ് സ്പൈക്ക് ആഗിരണം ചെയ്യുന്നു.'),
 trick:L('Off: open switch. Saturated: closed switch.','OFF: खुला स्विच। सैचुरेटेड: बंद स्विच।','OFF: തുറന്ന സ്വിച്ച്. സാച്ചുറേറ്റഡ്: അടച്ച സ്വിച്ച്.'),
 check:{q:L('As the transistor turns off, the relay coil makes a spike (Lenz’s law, Module 5A). What protects the transistor?','ट्रांज़िस्टर बंद होते ही रिले कॉइल स्पाइक बनाती है (लेंज़, मॉड्यूल 5A)। ट्रांज़िस्टर को कौन बचाता है?','ട്രാൻസിസ്റ്റർ ഓഫ് ആകുമ്പോൾ റിലേ കോയിൽ സ്പൈക്ക് ഉണ്ടാക്കുന്നു (ലെൻസ്, മൊഡ്യൂൾ 5A). ട്രാൻസിസ്റ്ററിനെ എന്ത് സംരക്ഷിക്കുന്നു?'),o:[L('a diode across the coil','कॉइल के आर-पार डायोड','കോയിലിന് കുറുകെ ഡയോഡ്'),L('a bigger relay','बड़ा रिले','വലിയ റിലേ'),L('a fuse in the base','बेस में फ्यूज़','ബേസിൽ ഫ്യൂസ്')],a:0},
 build(w,api){
  w.innerHTML=S(400,215,`<g id="a"></g>`,'Transistor driving a relay that switches a lamp');
  const rd=mkRd(w),c=mkCtl(w);let on=false,tOff=-9,last=false;
  tog(c,L('Input ON','इनपुट ON','ഇൻപുട്ട് ON'),v=>{on=v;api.redraw()});
  return t=>{if(last&&!on)tOff=t;last=on;const sp=t-tOff<.6;
   let s=symBJT(200,140,0)+wr('M160 140H130M90 140H60M212 180V200H40')+symRes(110,140,0)+wr('M212 100V90')+`<rect x="182" y="40" width="60" height="50" rx="4" fill="none" stroke="var(--wire)" stroke-width="3"/>`+wr('M212 20V40')+TXC(212,16,'+12 V','var(--fg)','14');
   s+=TXC(212,70,'K1','var(--fg)','14')+symD(150,65,270,'var(--wire)').replace(/translate\(150 65\)/,'translate(150 65)')+wr('M150 25V20H212M150 105V95H212');
   s+=`<circle cx="60" cy="140" r="6" fill="${on?'var(--ok)':'var(--mut)'}"/>`+TXC(40,124,on?'5 V':'0 V','var(--fg)','14')+TXC(110,124,'4.7 kΩ','var(--fg)','13');
   s+=`<path d="M270 70L${on?310:302} ${on?70:54}" stroke="var(--wire)" stroke-width="4"/><circle cx="270" cy="70" r="4" fill="var(--wire)"/><circle cx="312" cy="70" r="4" fill="var(--wire)"/>`+symLamp(350,70,0)+(on?`<circle cx="350" cy="70" r="26" fill="rgba(255,210,60,.45)"/>`:'');
   if(on)s+=flowDots([[212,20],[212,90],[212,200]],t,6,'var(--def)',60)+flowDots([[60,140],[180,140]],t,2,'var(--frm)',30);
   if(sp)s+=`<path d="M232 120l10 -8l-4 10l12 -6" stroke="var(--no)" stroke-width="3" fill="none"/>`+flowDots([[212,90],[150,95],[150,25],[212,25]],t,4,'var(--no)',80);
   s+=TXC(300,190,'VCE = '+(on?'0.2 V':'12 V'),on?'var(--ok)':'var(--no)','16');
   put($('#a',w),s);
   setRd(rd,`<span>${on?RD('Saturated: IB = 4.3 ÷ 4700 ≈ 0.91 mA, IC = 30 mA, relay ON.','सैचुरेटेड: IB = 4.3 ÷ 4700 ≈ 0.91 mA, IC = 30 mA, रिले ON।','സാച്ചുറേറ്റഡ്: IB = 4.3 ÷ 4700 ≈ 0.91 mA, IC = 30 mA, റിലേ ON.'):sp?RD('Turning off: the diode carries the coil current, the spike is clamped.','बंद होते समय: डायोड कॉइल करंट लेता है, स्पाइक दबता है।','ഓഫ് ആകുമ്പോൾ: ഡയോഡ് കോയിൽ കറന്റ് എടുക്കുന്നു, സ്പൈക്ക് ഒതുക്കുന്നു.'):RD('Cut-off: IB = 0, IC = 0, relay OFF.','कट-ऑफ: IB = 0, IC = 0, रिले OFF।','കട്ട്-ഓഫ്: IB = 0, IC = 0, റിലേ OFF.')}</span>`)}}});

const VIN=[2,5,10,20];
CS({id:'e_amp',menu:'Single-stage CE amplifier',title:'t_amp',
 flash:FB('Phase (Module 0, slide 33); XC (Module 5B, slide 6); CE configuration (slide 21)','फेज़ (मॉड्यूल 0, स्लाइड 33); XC (मॉड्यूल 5B, स्लाइड 6); CE कॉन्फ़िगरेशन (स्लाइड 21)','ഫേസ് (മൊഡ്യൂൾ 0, സ്ലൈഡ് 33); XC (മൊഡ്യൂൾ 5B, സ്ലൈഡ് 6); CE കോൺഫിഗറേഷൻ (സ്ലൈഡ് 21)'),
 hook:L('A microphone gives only a few millivolts. One transistor stage can make it a few volts.','माइक्रोफ़ोन सिर्फ़ कुछ मिलीवोल्ट देता है। एक ट्रांज़िस्टर स्टेज उसे कुछ वोल्ट बना सकती है।','മൈക്രോഫോൺ കുറച്ച് മില്ലിവോൾട്ട് മാത്രം. ഒരു ട്രാൻസിസ്റ്റർ സ്റ്റേജ് അത് കുറച്ച് വോൾട്ട് ആക്കും.'),
 defn:L('<b>CE amplifier:</b> R1 and R2 bias the base so the transistor sits in the middle (active region). C1 and C2 couple the AC signal in and out but block DC. CE (emitter capacitor) bypasses RE for AC to keep the gain high.','<b>CE एम्प्लिफायर:</b> R1 और R2 बेस को बायस करते हैं ताकि ट्रांज़िस्टर बीच में (एक्टिव रीजन) रहे। C1 और C2 AC सिग्नल अंदर-बाहर करते हैं, DC रोकते हैं। CE (एमिटर कैपेसिटर) AC के लिए RE को बायपास कर गेन ऊँचा रखता है।','<b>CE ആംപ്ലിഫയർ:</b> R1, R2 ബേസിനെ ബയസ് ചെയ്ത് ട്രാൻസിസ്റ്ററിനെ മധ്യത്തിൽ (ആക്ടീവ് റീജിയൻ) നിർത്തുന്നു. C1, C2 AC സിഗ്നൽ അകത്തും പുറത്തും കടത്തുന്നു, DC തടയുന്നു. CE (എമിറ്റർ കപ്പാസിറ്റർ) AC-ക്ക് RE ബൈപ്പാസ് ചെയ്ത് ഗെയിൻ ഉയർത്തുന്നു.'),
 play:L('Drag Vin. Toggle the emitter capacitor CE. Watch the size and phase of the output.','Vin खिसकाओ। एमिटर कैपेसिटर CE ON/OFF करो। आउटपुट का साइज़ और फेज़ देखो।','Vin നീക്കൂ. എമിറ്റർ കപ്പാസിറ്റർ CE ON/OFF ആക്കൂ. ഔട്ട്പുട്ടിന്റെ വലുപ്പവും ഫേസും നോക്കൂ.'),
 pred:{q:L('The output wave compared with the input is …','आउटपुट वेव इनपुट की तुलना में …','ഔട്ട്പുട്ട് വേവ് ഇൻപുട്ടുമായി നോക്കുമ്പോൾ …'),o:[L('bigger and upside down','बड़ी और उल्टी','വലുതും തലകീഴും'),L('smaller, same way up','छोटी, सीधी','ചെറുത്, അതേ ദിശ'),L('identical','बिल्कुल वैसी','അതുപോലെ തന്നെ')],a:0,why:L('Input up → more IC → more drop on RC → collector voltage down. Big and inverted.','इनपुट ऊपर → ज़्यादा IC → RC पर ज़्यादा ड्रॉप → कलेक्टर वोल्टेज नीचे। बड़ी और उल्टी।','ഇൻപുട്ട് മുകളിൽ → കൂടുതൽ IC → RC-യിൽ കൂടുതൽ ഡ്രോപ്പ് → കളക്ടർ വോൾട്ടേജ് താഴെ. വലുതും തലകീഴും.')},
 labels:['gain','beta'],hints:['ph','xc','beta'],rel:{c:['Vin','Av','Vout'],h:'Vout'},
 fm:['<i>A</i><sub>v</sub> = <i>V</i><sub>out</sub> ÷ <i>V</i><sub>in</sub>'],
 uses:L('Here R1 47 kΩ, R2 10 kΩ, RC 4.7 kΩ, RE 1 kΩ, 12 V: IE ≈ 1.4 mA. With CE: Av ≈ RC ÷ re ≈ 250 (re ≈ 26 mV ÷ IE, no load). Without CE: Av ≈ RC ÷ RE ≈ 4.7. Output is 180° out of phase.','यहाँ R1 47 kΩ, R2 10 kΩ, RC 4.7 kΩ, RE 1 kΩ, 12 V: IE ≈ 1.4 mA। CE के साथ: Av ≈ RC ÷ re ≈ 250 (re ≈ 26 mV ÷ IE, बिना लोड)। CE के बिना: Av ≈ RC ÷ RE ≈ 4.7। आउटपुट 180° उल्टा।','ഇവിടെ R1 47 kΩ, R2 10 kΩ, RC 4.7 kΩ, RE 1 kΩ, 12 V: IE ≈ 1.4 mA. CE ഉള്ളപ്പോൾ: Av ≈ RC ÷ re ≈ 250 (re ≈ 26 mV ÷ IE, ലോഡില്ലാതെ). CE ഇല്ലാതെ: Av ≈ RC ÷ RE ≈ 4.7. ഔട്ട്പുട്ട് 180° മാറി.'),
 ex:L('Example: Vin = 15 mV and Vout = 1.8 V: Av = 1.8 ÷ 0.015 = 120.','उदाहरण: Vin = 15 mV और Vout = 1.8 V: Av = 1.8 ÷ 0.015 = 120।','ഉദാഹരണം: Vin = 15 mV, Vout = 1.8 V: Av = 1.8 ÷ 0.015 = 120.'),
 trick:L('Small in, big out, upside down.','छोटा अंदर, बड़ा बाहर, उल्टा।','ചെറുത് അകത്ത്, വലുത് പുറത്ത്, തലകീഴ്.'),
 check:{q:L('Vin = 4 mV peak and Av = 150. The output peak is …','Vin = 4 mV पीक और Av = 150। आउटपुट पीक …','Vin = 4 mV പീക്ക്, Av = 150. ഔട്ട്പുട്ട് പീക്ക് …'),o:['0.6 V','37.5 V','0.06 V'],a:0},
 build(w,api){
  w.innerHTML=S(400,215,`<g id="a"></g>`,'CE amplifier circuit with input and output waves');
  const rd=mkRd(w),c=mkCtl(w);let vi=1,byp=true;
  slider(c,'V<sub>in</sub>',0,3,1,1,x=>VIN[x]+' mV',x=>{vi=x;api.redraw()});
  tog(c,L('CE capacitor','CE कैपेसिटर','CE കപ്പാസിറ്റർ'),v=>{byp=v;api.redraw()},true);
  return t=>{const Av=byp?250:4.7,vin=VIN[vi]/1000,vo=vin*Av,top=6.6,bot=3.6,ph=(t*.4)%1;
   let s=symBJT(170,90,0)+wr('M60 14H260M110 14V26M110 74V126M110 174V200H260M130 90H110M182 14V26M182 74V50M182 130V136M182 184V200M182 140H232V160M232 190V200M182 40H210')+symRes(110,50,90)+symRes(110,150,90)+symRes(182,50,90)+symRes(182,160,90)+(byp?symCap(232,175,90):'')+symCap(80,90,0)+symCap(230,40,0)+wr('M246 40H262M64 90H54');
   s+=TXC(92,52,'R1','var(--fg)','13')+TXC(92,152,'R2','var(--fg)','13')+TXC(206,52,'RC','var(--fg)','13')+TXC(206,164,'RE','var(--fg)','13')+(byp?TXC(256,180,'CE','var(--ok)','13'):'')+TXC(80,72,'C1','var(--fg)','13')+TXC(230,66,'C2','var(--fg)','13')+TXC(300,10,'+12 V','var(--fg)','13');
   s+=`<path d="${wpath(4,90,46,12,u=>Math.sin(TPI*(2*u-ph)))}" stroke="var(--def)" stroke-width="2.5" fill="none"/>`+TXC(28,120,VIN[vi]+' mV','var(--def)','13');
   const sc=Math.min(9,44/Math.max(vo,1e-4));s+=`<path d="${wpath(272,100,120,1,u=>Math.max(-bot,Math.min(top,-vo*Math.sin(TPI*(2*u-ph))))*sc)}" stroke="var(--frm)" stroke-width="2.5" fill="none"/>`+TXC(332,170,(vo>=.1?fm1(vo)+' V':fm1(vo*1000)+' mV'),'var(--frm)','14');
   const clip=vo>bot;put($('#a',w),s);
   setRd(rd,`<span>Av ≈ <b>${byp?'250':'4.7'}</b> · Vout ≈ ${VIN[vi]} mV × ${byp?'250':'4.7'} = <b>${vo>=.1?fm1(vo)+' V':fm1(vo*1000)+' mV'}</b> · 180°</span>${clip?`<span>${RD('Too big: the output clips (distortion).','बहुत बड़ा: आउटपुट कटता है (डिस्टॉर्शन)।','വളരെ വലുത്: ഔട്ട്പുട്ട് മുറിയുന്നു (ഡിസ്റ്റോർഷൻ).')}</span>`:''}`)}}});

CS({id:'e_atyp',menu:'Types of amplifier',title:'t_atyp',
 flash:FB('Single-stage CE amplifier (slide 23); cycle (Module 0, slide 27)','सिंगल-स्टेज CE एम्प्लिफायर (स्लाइड 23); साइकिल (मॉड्यूल 0, स्लाइड 27)','സിംഗിൾ-സ്റ്റേജ് CE ആംപ്ലിഫയർ (സ്ലൈഡ് 23); സൈക്കിൾ (മൊഡ്യൂൾ 0, സ്ലൈഡ് 27)'),
 hook:L('A microphone preamp and a radio transmitter are both amplifiers, but they run their transistors very differently.','माइक प्रीएम्प और रेडियो ट्रांसमीटर दोनों एम्प्लिफायर, पर ट्रांज़िस्टर को बहुत अलग चलाते हैं।','മൈക്ക് പ്രീആംപും റേഡിയോ ട്രാൻസ്മിറ്ററും ആംപ്ലിഫയർ ആണ്, പക്ഷേ ട്രാൻസിസ്റ്ററിനെ വളരെ വ്യത്യസ്തമായി പ്രവർത്തിപ്പിക്കുന്നു.'),
 defn:L('Amplifiers are grouped by <b>configuration</b> (CE, CB, CC), <b>frequency</b> (DC, AF audio, RF radio), <b>coupling</b> (RC, transformer, direct) and <b>class</b>: how much of each cycle the transistor conducts. A: 360°, AB: between 180° and 360°, B: 180°, C: less than 180°.','एम्प्लिफायर के ग्रुप: <b>कॉन्फ़िगरेशन</b> (CE, CB, CC), <b>फ्रीक्वेंसी</b> (DC, AF ऑडियो, RF रेडियो), <b>कपलिंग</b> (RC, ट्रांसफॉर्मर, डायरेक्ट) और <b>क्लास</b>: हर साइकिल का कितना हिस्सा ट्रांज़िस्टर चलता है। A: 360°, AB: 180° और 360° के बीच, B: 180°, C: 180° से कम।','ആംപ്ലിഫയർ ഗ്രൂപ്പുകൾ: <b>കോൺഫിഗറേഷൻ</b> (CE, CB, CC), <b>ഫ്രീക്വൻസി</b> (DC, AF ഓഡിയോ, RF റേഡിയോ), <b>കപ്ലിംഗ്</b> (RC, ട്രാൻസ്ഫോർമർ, ഡയറക്ട്), <b>ക്ലാസ്</b>: ഓരോ സൈക്കിളിന്റെയും എത്ര ഭാഗം ട്രാൻസിസ്റ്റർ കണ്ടക്ട് ചെയ്യുന്നു. A: 360°, AB: 180°-നും 360°-നും ഇടയിൽ, B: 180°, C: 180°-ൽ കുറവ്.'),
 play:L('Tap A, AB, B, C. Green shows when the transistor conducts.','A, AB, B, C दबाओ। हरा दिखाता है ट्रांज़िस्टर कब चालू है।','A, AB, B, C ടാപ്പ് ചെയ്യൂ. പച്ച കാണിക്കുന്നു ട്രാൻസിസ്റ്റർ എപ്പോൾ കണ്ടക്ട് ചെയ്യുന്നു.'),
 pred:{q:L('A class B stage conducts for …','क्लास B स्टेज कितना चलती है?','ക്ലാസ് B സ്റ്റേജ് എത്ര സമയം കണ്ടക്ട് ചെയ്യുന്നു?'),o:[L('half of each cycle','हर साइकिल का आधा','ഓരോ സൈക്കിളിന്റെയും പകുതി'),L('the whole cycle','पूरी साइकिल','മുഴുവൻ സൈക്കിൾ'),L('less than a quarter','चौथाई से कम','നാലിലൊന്നിൽ കുറവ്')],a:0,why:L('Class B conducts for 180°. Two transistors in push-pull share the two halves.','क्लास B 180° चलती है। पुश-पुल में दो ट्रांज़िस्टर दोनों आधे बाँटते हैं।','ക്ലാസ് B 180° കണ്ടക്ട് ചെയ്യുന്നു. പുഷ്-പുളിൽ രണ്ട് ട്രാൻസിസ്റ്റർ രണ്ട് പകുതി പങ്കിടുന്നു.')},
 labels:['gain'],hints:['ft','ph'],rel:{c:['IC','θ'],h:'θ'},
 ex:L('Example: a public-address amplifier uses a class AB push-pull pair: low distortion and good efficiency.','उदाहरण: पब्लिक-एड्रेस एम्प्लिफायर में क्लास AB पुश-पुल जोड़ी: कम डिस्टॉर्शन, अच्छी एफिशिएंसी।','ഉദാഹരണം: പബ്ലിക്-അഡ്രസ് ആംപ്ലിഫയറിൽ ക്ലാസ് AB പുഷ്-പുൾ ജോഡി: കുറഞ്ഞ ഡിസ്റ്റോർഷൻ, നല്ല എഫിഷ്യൻസി.'),
 trick:L('A: All. B: Both halves shared. C: a Clip.','A: सब। B: दोनों आधे बाँटे। C: थोड़ा-सा।','A: എല്ലാം. B: രണ്ട് പകുതി പങ്കിട്ട്. C: അല്പം.'),
 check:{q:L('Class A conducts for the whole cycle. One cycle at 50 Hz lasts (T = 1 ÷ f) …','क्लास A पूरी साइकिल चलती है। 50 Hz पर एक साइकिल (T = 1 ÷ f) …','ക്ലാസ് A മുഴുവൻ സൈക്കിൾ. 50 Hz-ൽ ഒരു സൈക്കിൾ (T = 1 ÷ f) …'),o:['20 ms','50 ms','2 ms'],a:0},
 build(w,api){
  w.innerHTML=S(400,200,`<g id="a"></g>`,'Input sine wave with the conduction angle of each amplifier class');
  const rd=mkRd(w),c=mkCtl(w);let m=0;
  modeBtns(c,CLS.map(x=>L('Class '+x.n,'क्लास '+x.n,'ക്ലാസ് '+x.n)),i=>{m=i;api.redraw()});
  return t=>{const g=CLS[m],th=Math.cos(g.a/2*D2R),ph=(t*.25)%1;
   let s=`<path d="M20 70H390M20 170H390" stroke="var(--mut)" stroke-width="1"/><path d="${wpath(20,70,370,45,u=>Math.sin(TPI*(2*u-ph)))}" stroke="var(--def)" stroke-width="2.5" fill="none"/>`;
   let d='';for(let k=0;k<=240;k++){const u=k/240,x=20+370*u,a=TPI*(2*u-ph),sv=Math.sin(a),on=sv>=th;d+=(k?'L':'M')+x.toFixed(1)+' '+(on?170-80*(sv-th)/(1-th)*.55:170).toFixed(1)}
   s+=`<path d="${d}" stroke="var(--ok)" stroke-width="3" fill="none"/>`;
   s+=TL(60,30,['input','इनपुट','ഇൻപുട്ട്'],'var(--def)')+TL(70,130,['collector current','कलेक्टर करंट','കളക്ടർ കറന്റ്'],'var(--ok)')+TXC(330,195,g.a===200?'180°–360°':(g.n==='C'?'< 180°':g.a+'°'),'var(--frm)','16');
   put($('#a',w),s);
   setRd(rd,`<span>${RD('Class','क्लास','ക്ലാസ്')} ${g.n}: ${RD('conducts','चलती है','കണ്ടക്ട്')} ${g.a===200?'180°–360°':(g.n==='C'?'< 180°':g.a+'°')} · ${RD('max. efficiency','अधिकतम एफिशिएंसी','പരമാവധി എഫിഷ്യൻസി')} ${B3(g.e)}</span><span>${B3(g.u)}</span>`)}}});

 flash:FB('Series resonance f₀ = 1 ÷ (2π√LC) (Module 5B, slide 11); amplifier (slide 23)','सीरीज़ रेज़ोनेंस f₀ = 1 ÷ (2π√LC) (मॉड्यूल 5B, स्लाइड 11); एम्प्लिफायर (स्लाइड 23)','സീരീസ് റെസൊണൻസ് f₀ = 1 ÷ (2π√LC) (മൊഡ്യൂൾ 5B, സ്ലൈഡ് 11); ആംപ്ലിഫയർ (സ്ലൈഡ് 23)'),
 hook:L('A microphone too close to its speaker starts to howl on its own. That is an oscillator by accident.','स्पीकर के बहुत पास माइक अपने आप चीखने लगता है। यह अनजाने में बना ऑसिलेटर है।','സ്പീക്കറിന് വളരെ അടുത്ത് മൈക്ക് തനിയെ കൂവാൻ തുടങ്ങുന്നു. അറിയാതെ ഉണ്ടായ ഓസിലേറ്റർ.'),
 defn:L('<b>Oscillator:</b> an amplifier that feeds part of its output back to its input in phase (<b>positive feedback</b>). It makes its own AC wave from a DC supply. Barkhausen condition: loop gain Aβ = 1 and total phase shift 0° (or 360°). Types: LC (Hartley, Colpitts), RC phase-shift, crystal.','<b>ऑसिलेटर:</b> एम्प्लिफायर जो अपने आउटपुट का हिस्सा इनपुट में इन-फेज़ लौटाता है (<b>पॉज़िटिव फीडबैक</b>)। DC सप्लाई से खुद AC वेव बनाता है। बार्कहाउज़न शर्त: लूप गेन Aβ = 1 और कुल फेज़ शिफ्ट 0° (या 360°)। प्रकार: LC (हार्टले, कोल्पिट्स), RC फेज़-शिफ्ट, क्रिस्टल।','<b>ഓസിലേറ്റർ:</b> ഔട്ട്പുട്ടിന്റെ ഒരു ഭാഗം ഇൻപുട്ടിലേക്ക് ഇൻ-ഫേസിൽ തിരികെ നൽകുന്ന ആംപ്ലിഫയർ (<b>പോസിറ്റീവ് ഫീഡ്ബാക്ക്</b>). DC സപ്ലൈയിൽ നിന്ന് സ്വന്തം AC വേവ് ഉണ്ടാക്കുന്നു. ബാർക്ക്ഹൗസൻ നിബന്ധന: ലൂപ്പ് ഗെയിൻ Aβ = 1, ആകെ ഫേസ് ഷിഫ്റ്റ് 0° (അല്ലെങ്കിൽ 360°). തരങ്ങൾ: LC (ഹാർട്ട്ലി, കോൾപിറ്റ്സ്), RC ഫേസ്-ഷിഫ്റ്റ്, ക്രിസ്റ്റൽ.'),
 play:L('Drag C. Then switch Feedback OFF and watch the wave die.','C खिसकाओ। फिर Feedback OFF करो और वेव मरते देखो।','C നീക്കൂ. പിന്നെ Feedback OFF ആക്കി വേവ് ഇല്ലാതാകുന്നത് നോക്കൂ.'),
 pred:{q:L('The feedback is switched off. The tank wave …','फीडबैक बंद किया। टैंक वेव …','ഫീഡ്ബാക്ക് ഓഫ് ആക്കി. ടാങ്ക് വേവ് …'),o:[L('dies away','धीरे-धीरे खत्म','പതുക്കെ ഇല്ലാതാകുന്നു'),L('grows','बढ़ती है','വളരുന്നു'),L('stays the same','वही रहती है','അതേ പോലെ')],a:0,why:L('Resistance loses a little energy every cycle. Without feedback nothing replaces it.','रेसिस्टेंस हर साइकिल थोड़ी एनर्जी खाता है। फीडबैक बिना कोई भरपाई नहीं।','റെസിസ്റ്റൻസ് ഓരോ സൈക്കിളിലും അല്പം എനർജി നഷ്ടമാക്കുന്നു. ഫീഡ്ബാക്ക് ഇല്ലെങ്കിൽ അത് തിരികെ കിട്ടില്ല.')},
 labels:['fbk'],hints:['res0','ft'],rel:{c:['L','C','f'],h:'f'},
 fm:['<i>f</i> = 1 ÷ (2π√(<i>L</i><i>C</i>))'],
 uses:L('LC tank, ideal parts, L in henry, C in farad. The same formula as resonance (Module 5B, slide 11).','LC टैंक, आइडियल पार्ट, L हेनरी में, C फैराड में। रेज़ोनेंस वाला ही फॉर्मूला (मॉड्यूल 5B, स्लाइड 11)।','LC ടാങ്ക്, ഐഡിയൽ പാർട്ട്, L ഹെൻറിയിൽ, C ഫാരഡിൽ. റെസൊണൻസിന്റെ അതേ ഫോർമുല (മൊഡ്യൂൾ 5B, സ്ലൈഡ് 11).'),
 ex:L('Example: L = 1 mH and C = 10 nF: f = 1 ÷ (2π × √(10⁻¹¹)) ≈ 50 kHz.','उदाहरण: L = 1 mH और C = 10 nF: f = 1 ÷ (2π × √(10⁻¹¹)) ≈ 50 kHz।','ഉദാഹരണം: L = 1 mH, C = 10 nF: f = 1 ÷ (2π × √(10⁻¹¹)) ≈ 50 kHz.'),
 trick:L('Amplifier + positive feedback = oscillator.','एम्प्लिफायर + पॉज़िटिव फीडबैक = ऑसिलेटर।','ആംപ്ലിഫയർ + പോസിറ്റീവ് ഫീഡ്ബാക്ക് = ഓസിലേറ്റർ.'),
 check:{q:L('C is made 4 times bigger (L the same). The frequency becomes …','C चार गुना बड़ा (L वही)। फ्रीक्वेंसी …','C നാല് മടങ്ങ് വലുതാക്കി (L അതേ). ഫ്രീക്വൻസി …'),o:[L('half','आधी','പകുതി'),L('double','दोगुनी','ഇരട്ടി'),L('a quarter','चौथाई','നാലിലൊന്ന്')],a:0},
 build(w,api){
  w.innerHTML=S(400,215,`<g id="a"></g>`,'Amplifier with feedback loop and LC tank energy swap');
  const rd=mkRd(w),c=mkCtl(w);let ci=2,fb=true,tOff=0;
  slider(c,'C',0,3,1,2,x=>CN[x]+' nF',x=>{ci=x;api.redraw()});
  tog(c,L('Feedback','फीडबैक','ഫീഡ്ബാക്ക്'),v=>{fb=v;if(!v)tOff=performance.now()/1000;api.redraw()},true);
  return t=>{const Lh=.01,C=CN[ci]*1e-9,f=1/(TPI*Math.sqrt(Lh*C)),sp=1.2*Math.sqrt(f/5030),now=performance.now()/1000,amp=fb?1:Math.exp(-(now-tOff)*.8);
   let s=`<path d="M60 40V100L120 70Z" fill="var(--card)" stroke="var(--wire)" stroke-width="3"/>`+TXC(84,76,'A','var(--fg)','16')+wr('M20 70H60M120 70H170')+wr(`M170 70V20H40V70`,fb?'var(--ok)':'var(--mut)')+'';
   s+=TL(104,14,fb?['positive feedback','पॉज़िटिव फीडबैक','പോസിറ്റീവ് ഫീഡ്ബാക്ക്']:['feedback OFF','फीडबैक OFF','ഫീഡ്ബാക്ക് OFF'],fb?'var(--ok)':'var(--no)');
   const q=Math.cos(TPI*sp*t)*amp,i=Math.sin(TPI*sp*t)*amp;
   s+=symCap(230,70,90)+symInd(300,70,90)+wr('M230 46V30H300V46M230 94V110H300V94');
   s+=`<rect x="200" y="${150-Math.abs(q)*45}" width="40" height="${Math.abs(q)*45}" fill="var(--def)"/><rect x="280" y="${150-Math.abs(i)*45}" width="40" height="${Math.abs(i)*45}" fill="var(--frm)"/>`+TL(220,170,['C energy','C एनर्जी','C എനർജി'],'var(--def)')+TL(300,170,['L energy','L एनर्जी','L എനർജി'],'var(--frm)');
   let d='';for(let k=0;k<=120;k++){const u=k/120,tt=t-(1-u)*1.5;d+=(k?'L':'M')+(20+150*u).toFixed(1)+' '+(170-26*amp*Math.cos(TPI*sp*tt)).toFixed(1)}
   s+=`<path d="${d}" stroke="var(--frm)" stroke-width="2.5" fill="none"/>`+`<path d="M20 170H170" stroke="var(--mut)" stroke-width="1"/>`;
   put($('#a',w),s);
   setRd(rd,`<span>L = 10 mH, C = ${CN[ci]} nF → f = 1 ÷ (2π√LC) ≈ <b>${f>=1000?fm1(f/1000)+' kHz':fm1(f)+' Hz'}</b></span><span>${fb?RD('Feedback replaces the energy lost each cycle: steady wave.','फीडबैक हर साइकिल की खोई एनर्जी भरता है: स्थिर वेव।','ഫീഡ്ബാക്ക് ഓരോ സൈക്കിളിലെയും നഷ്ടം നികത്തുന്നു: സ്ഥിരമായ വേവ്.'):RD('No feedback: losses win, the wave dies away.','फीडबैक नहीं: लॉस जीतता है, वेव खत्म।','ഫീഡ്ബാക്ക് ഇല്ല: നഷ്ടം ജയിക്കുന്നു, വേവ് ഇല്ലാതാകുന്നു.')}</span>`)}}});

const EQP=[
 {k:'tr',n:['Transformer','ट्रांसफॉर्मर','ട്രാൻസ്ഫോർമർ'],d:['Steps 230 V down to a low AC voltage, for example 12-0-12 V. Look for the iron core and the voltage label.','230 V को कम AC, जैसे 12-0-12 V में बदलता है। आयरन कोर और वोल्टेज लेबल देखो।','230 V-നെ കുറഞ്ഞ AC, ഉദാ. 12-0-12 V ആക്കുന്നു. ഇരുമ്പ് കോറും വോൾട്ടേജ് ലേബലും നോക്കൂ.']},
 {k:'fu',n:['Fuse','फ्यूज़','ഫ്യൂസ്'],d:['Glass fuse in a holder. Protects against overload and short circuit. Check its rating, for example 500 mA.','होल्डर में ग्लास फ्यूज़। ओवरलोड और शॉर्ट से बचाता है। रेटिंग देखो, जैसे 500 mA।','ഹോൾഡറിൽ ഗ്ലാസ് ഫ്യൂസ്. ഓവർലോഡ്, ഷോർട്ട് സർക്യൂട്ട് എന്നിവയിൽ നിന്ന് സംരക്ഷിക്കുന്നു. റേറ്റിംഗ് നോക്കൂ, ഉദാ. 500 mA.']},
 {k:'br',n:['Bridge rectifier','ब्रिज रेक्टिफायर','ബ്രിഡ്ജ് റെക്ടിഫയർ'],d:['Four diodes, or one block marked ~ ~ + −. Changes AC to pulsating DC.','चार डायोड, या ~ ~ + − वाला एक ब्लॉक। AC को पल्सेटिंग DC बनाता है।','നാല് ഡയോഡ്, അല്ലെങ്കിൽ ~ ~ + − അടയാളമുള്ള ഒരു ബ്ലോക്ക്. AC-യെ പൾസേറ്റിംഗ് DC ആക്കുന്നു.']},
 {k:'cp',n:['Filter capacitor','फ़िल्टर कैपेसिटर','ഫിൽട്ടർ കപ്പാസിറ്റർ'],d:['Electrolytic, for example 2200 µF 25 V. The stripe marks the − lead. Polarity and voltage rating matter.','इलेक्ट्रोलिटिक, जैसे 2200 µF 25 V। पट्टी − लीड बताती है। पोलैरिटी और वोल्टेज रेटिंग ज़रूरी।','ഇലക്ട്രോലിറ്റിക്, ഉദാ. 2200 µF 25 V. വര − ലീഡ് കാണിക്കുന്നു. പോളാരിറ്റിയും വോൾട്ടേജ് റേറ്റിംഗും പ്രധാനം.']},
 {k:'zd',n:['Zener diode','ज़ेनर डायोड','സെനർ ഡയോഡ്'],d:['Small glass body with a black band (cathode). Value printed, for example 5V1 = 5.1 V.','काली पट्टी (कैथोड) वाली छोटी ग्लास बॉडी। वैल्यू छपी, जैसे 5V1 = 5.1 V।','കറുത്ത ബാൻഡുള്ള (കാഥോഡ്) ചെറിയ ഗ്ലാസ് ബോഡി. വില അച്ചടിച്ചത്, ഉദാ. 5V1 = 5.1 V.']},
 {k:'tx',n:['Transistor','ट्रांज़िस्टर','ട്രാൻസിസ്റ്റർ'],d:['Three legs, TO-92 or TO-220 body. Read the part number, then the datasheet for E, B, C.','तीन टाँगें, TO-92 या TO-220 बॉडी। पार्ट नंबर पढ़ो, फिर डेटाशीट से E, B, C।','മൂന്ന് കാൽ, TO-92 അല്ലെങ്കിൽ TO-220 ബോഡി. പാർട്ട് നമ്പർ വായിച്ച്, ഡാറ്റാഷീറ്റിൽ E, B, C നോക്കൂ.']},
 {k:'rs',n:['Resistor','रेसिस्टर','റെസിസ്റ്റർ'],d:['Colour bands give the value (slide 3). Body size gives the watt rating.','कलर बैंड वैल्यू बताते हैं (स्लाइड 3)। बॉडी साइज़ वाट रेटिंग बताता है।','കളർ ബാൻഡ് വില പറയുന്നു (സ്ലൈഡ് 3). ബോഡി വലുപ്പം വാട്ട് റേറ്റിംഗ്.']},
 {k:'ld',n:['LED','LED','LED'],d:['Longer leg = anode. Flat edge on the rim = cathode. Always with a series resistor.','लंबी टाँग = एनोड। किनारे का सपाट हिस्सा = कैथोड। हमेशा सीरीज़ रेसिस्टर के साथ।','നീളമുള്ള കാൽ = ആനോഡ്. അരികിലെ പരന്ന ഭാഗം = കാഥോഡ്. എപ്പോഴും സീരീസ് റെസിസ്റ്ററിനൊപ്പം.']}];

   g+=`<rect x="268" y="44" width="38" height="14" rx="7" fill="#e7a35a"/><rect x="296" y="44" width="5" height="14" fill="#111"/><path d="M262 51H268M306 51H314" stroke="#ccc" stroke-width="2"/>`;
   g+=`<path d="M272 96h32v20a16 12 0 0 1 -32 0z" fill="#222"/><path d="M280 128V136M288 128V136M296 128V136" stroke="#ccc" stroke-width="2"/>`;

  const rd=mkRd(w),c=mkCtl(w);

   setRd(rd,sel<0?`<span>${RD('Nothing selected yet.','अभी कुछ नहीं चुना।','ഇതുവരെ ഒന്നും തിരഞ്ഞെടുത്തില്ല.')}</span>`:`<span><b>${B3(EQP[sel].n)}</b>: ${B3(EQP[sel].d)}</span>`);svgLang()};
  const bs=EQP.map((e,i)=>button(c,L(e.n[0],e.n[1],e.n[2]),()=>{sel=i;bs.forEach((b,j)=>b.classList.toggle('on',j===i));draw()}));
  draw();api.setReplay(()=>{})}});

CS({id:'e_mist',menu:'Common mistakes',kind:'warn',title:'mist12',wide:true,hk:undefined,page(w){
  const M=[
   [L('The diode band is the anode','डायोड की पट्टी एनोड है','ഡയോഡ് ബാൻഡ് ആനോഡ് ആണ്'),L('The band is the cathode (K), like the bar in the symbol.','पट्टी कैथोड (K) है, सिम्बल की लाइन जैसी।','ബാൻഡ് കാഥോഡ് (K), സിംബലിലെ വര പോലെ.')],
   [L('A Zener is connected like a normal diode','ज़ेनर नॉर्मल डायोड की तरह लगाते हैं','സെനർ സാധാരണ ഡയോഡ് പോലെ ഘടിപ്പിക്കുന്നു'),L('A Zener regulator is reverse biased, and always needs a series resistor.','ज़ेनर रेगुलेटर रिवर्स बायस्ड होता है, और हमेशा सीरीज़ रेसिस्टर चाहिए।','സെനർ റെഗുലേറ്റർ റിവേഴ്സ് ബയസ്, എപ്പോഴും സീരീസ് റെസിസ്റ്റർ വേണം.')],
   [L('Vdc of a rectifier = Vrms','रेक्टिफायर का Vdc = Vrms','റെക്ടിഫയറിന്റെ Vdc = Vrms'),L('First Vm = √2 × Vrms, then Vdc = 0.318 Vm or 0.637 Vm.','पहले Vm = √2 × Vrms, फिर Vdc = 0.318 Vm या 0.637 Vm।','ആദ്യം Vm = √2 × Vrms, പിന്നെ Vdc = 0.318 Vm അല്ലെങ്കിൽ 0.637 Vm.')],
   [L('Any capacitor will do as a filter','कोई भी कैपेसिटर फ़िल्टर बनेगा','ഏത് കപ്പാസിറ്ററും ഫിൽട്ടർ ആകും'),L('Use the right µF, a voltage rating above Vm, and correct polarity. A reversed electrolytic can burst.','सही µF, Vm से ज़्यादा वोल्टेज रेटिंग, सही पोलैरिटी। उल्टा इलेक्ट्रोलिटिक फट सकता है।','ശരിയായ µF, Vm-നേക്കാൾ കൂടിയ വോൾട്ടേജ് റേറ്റിംഗ്, ശരിയായ പോളാരിറ്റി. തിരിച്ച ഇലക്ട്രോലിറ്റിക് പൊട്ടിത്തെറിക്കാം.')],
   [L('All TO-92 transistors have the same pin order','सभी TO-92 ट्रांज़िस्टर का पिन क्रम एक','എല്ലാ TO-92 ട്രാൻസിസ്റ്ററിനും ഒരേ പിൻ ക്രമം'),L('Pin order varies (BC547: C B E; 2N2222A: E B C). Check the datasheet.','पिन क्रम अलग-अलग (BC547: C B E; 2N2222A: E B C)। डेटाशीट देखो।','പിൻ ക്രമം വ്യത്യസ്തം (BC547: C B E; 2N2222A: E B C). ഡാറ്റാഷീറ്റ് നോക്കൂ.')],
   [L('A relay coil needs no diode','रिले कॉइल को डायोड नहीं चाहिए','റിലേ കോയിലിന് ഡയോഡ് വേണ്ട'),L('Without a flyback diode the turn-off spike can destroy the transistor.','फ्लाईबैक डायोड बिना, बंद होते समय का स्पाइक ट्रांज़िस्टर उड़ा सकता है।','ഫ്ലൈബാക്ക് ഡയോഡ് ഇല്ലെങ്കിൽ ഓഫ് സ്പൈക്ക് ട്രാൻസിസ്റ്ററിനെ നശിപ്പിക്കാം.')]];
  w.innerHTML=`<div style="display:flex;flex-direction:column;gap:8px">${M.map(m=>`<div class="pair"><div class="x"><b>${ICO.no}</b> <span>${m[0]}</span></div><div class="v"><b>${ICO.ok}</b> <span>${m[1]}</span></div></div>`).join('')}</div>`}});

  why:['AC reaches the bridge but nothing passes. All diodes read open, so the bridge has failed.','AC ब्रिज तक आता है पर आगे नहीं जाता। सब डायोड ओपन, ब्रिज खराब।','AC ബ്രിഡ്ജ് വരെ എത്തുന്നു, പക്ഷേ കടക്കുന്നില്ല. എല്ലാ ഡയോഡും ഓപ്പൺ, ബ്രിഡ്ജ് കേടായി.']},
 {sp:['An amplifier hums loudly and its supply voltage is low.','एम्प्लिफायर ज़ोर से गुनगुनाता है और सप्लाई वोल्टेज कम है।','ആംപ്ലിഫയർ ഉറക്കെ മൂളുന്നു, സപ്ലൈ വോൾട്ടേജ് കുറവ്.'],

  o:[['Dried filter capacitor. Replace with the same µF and an equal or higher voltage rating.','सूखा फ़िल्टर कैपेसिटर। उतने ही µF और बराबर या ज़्यादा वोल्टेज रेटिंग से बदलो।','ഉണങ്ങിയ ഫിൽട്ടർ കപ്പാസിറ്റർ. അതേ µF, തുല്യമോ കൂടിയതോ വോൾട്ടേജ് റേറ്റിംഗിൽ മാറ്റൂ.'],['Transformer shorted','ट्रांसफॉर्मर शॉर्ट','ട്രാൻസ്ഫോർമർ ഷോർട്ട്'],['Speaker faulty','स्पीकर खराब','സ്പീക്കർ കേടായി']],a:0,
  why:['Ripple is still at 100 Hz, so the bridge works. A capacitor that has lost its µF cannot hold the voltage between peaks.','रिपल अभी 100 Hz पर, ब्रिज ठीक। µF खो चुका कैपेसिटर पीक के बीच वोल्टेज नहीं थाम पाता।','റിപ്പിൾ ഇപ്പോഴും 100 Hz-ൽ, ബ്രിഡ്ജ് ശരി. µF നഷ്ടപ്പെട്ട കപ്പാസിറ്ററിന് പീക്കുകൾക്കിടയിൽ വോൾട്ടേജ് പിടിച്ചുനിർത്താനാവില്ല.']},
 {sp:['A bridge supply shows ripple at 50 Hz instead of 100 Hz, and the output is low.','ब्रिज सप्लाई में रिपल 100 की जगह 50 Hz पर, आउटपुट कम।','ബ്രിഡ്ജ് സപ്ലൈയിൽ റിപ്പിൾ 100 Hz-ന് പകരം 50 Hz-ൽ, ഔട്ട്പുട്ട് കുറവ്.'],

  o:[['One bridge diode open: it works as half wave. Replace D2.','ब्रिज का एक डायोड ओपन: हाफ वेव जैसा चलता है। D2 बदलो।','ബ്രിഡ്ജിലെ ഒരു ഡയോഡ് ഓപ്പൺ: ഹാഫ് വേവ് പോലെ. D2 മാറ്റൂ.'],['Mains frequency has dropped','मेन फ्रीक्वेंसी गिर गई','മെയിൻ ഫ്രീക്വൻസി കുറഞ്ഞു'],['Capacitor shorted','कैपेसिटर शॉर्ट','കപ്പാസിറ്റർ ഷോർട്ട്']],a:0,
  why:['With D2 open, one half cycle has no path. Only one pulse per cycle remains: 50 Hz ripple, lower Vdc.','D2 ओपन, एक हाफ साइकिल का रास्ता नहीं। हर साइकिल में एक पल्स: 50 Hz रिपल, कम Vdc।','D2 ഓപ്പൺ, ഒരു ഹാഫ് സൈക്കിളിന് വഴിയില്ല. ഓരോ സൈക്കിളിലും ഒരു പൾസ്: 50 Hz റിപ്പിൾ, കുറഞ്ഞ Vdc.']},
 {sp:['A Zener-regulated 5.1 V rail reads only 0.2 V. The series resistor is very hot.','ज़ेनर-रेगुलेटेड 5.1 V रेल पर सिर्फ़ 0.2 V। सीरीज़ रेसिस्टर बहुत गरम।','സെനർ-റെഗുലേറ്റഡ് 5.1 V റെയിലിൽ 0.2 V മാത്രം. സീരീസ് റെസിസ്റ്റർ വളരെ ചൂട്.'],
  pic:(p,sv)=>fpic([{x:22,y:22,w:110,h:70,t:['Input','इनपुट','ഇൻപുട്ട്']},{x:150,y:22,w:110,h:70,t:['Rs','Rs','Rs']},{x:278,y:22,w:110,h:70,t:['Zener','ज़ेनर','സെനർ']}],p===1?0:p===2?1:p===3?2:-1,sv),
  tests:[[['Input','इनपुट','ഇൻപുട്ട്'],'12 V'],[['Voltage across Rs','Rs पर वोल्टेज','Rs-ലെ വോൾട്ടേജ്'],'11.8 V'],[['Zener (out of circuit)','ज़ेनर (सर्किट से बाहर)','സെനർ (സർക്യൂട്ടിന് പുറത്ത്)'],['0.00 V both ways','दोनों तरफ़ 0.00 V','രണ്ട് വശത്തും 0.00 V']]],
  o:[['Rs open','Rs ओपन','Rs ഓപ്പൺ'],['Input too low','इनपुट बहुत कम','ഇൻപുട്ട് വളരെ കുറവ്'],['Zener shorted. Replace it and check that Rs is not damaged.','ज़ेनर शॉर्ट। बदलो और देखो Rs खराब तो नहीं।','സെനർ ഷോർട്ട്. മാറ്റൂ, Rs കേടായോ എന്ന് നോക്കൂ.']],a:2,
  why:['Almost all 12 V sits across Rs, so it overheats. The Zener reads 0.00 V both ways: shorted.','लगभग पूरे 12 V, Rs पर, इसलिए वह गरम। ज़ेनर दोनों तरफ़ 0.00 V: शॉर्ट।','ഏതാണ്ട് മുഴുവൻ 12 V Rs-ൽ, അതിനാൽ ചൂടാകുന്നു. സെനർ രണ്ട് വശത്തും 0.00 V: ഷോർട്ട്.']},
 {sp:['On a timer card the input LED shows ON, but the 12 V relay never pulls in.','टाइमर कार्ड पर इनपुट LED ON, पर 12 V रिले कभी नहीं खिंचता।','ടൈമർ കാർഡിൽ ഇൻപുട്ട് LED ON, പക്ഷേ 12 V റിലേ ഒരിക്കലും വലിക്കുന്നില്ല.'],
  pic:(p,sv)=>fpic([{x:22,y:22,w:110,h:70,t:['Base','बेस','ബേസ്']},{x:150,y:22,w:110,h:70,t:['Collector','कलेक्टर','കളക്ടർ']},{x:278,y:22,w:110,h:70,t:['Transistor','ट्रांज़िस्टर','ട്രാൻസിസ്റ്റർ']}],p===1?0:p===2?1:p===3?2:-1,sv),
  tests:[[['Base to emitter','बेस से एमिटर','ബേസ് മുതൽ എമിറ്റർ'],'0.7 V'],[['Collector to emitter','कलेक्टर से एमिटर','കളക്ടർ മുതൽ എമിറ്റർ'],['12 V (should be about 0.2 V)','12 V (करीब 0.2 V होना चाहिए)','12 V (ഏകദേശം 0.2 V വേണം)']],[['Transistor (out of circuit)','ट्रांज़िस्टर (सर्किट से बाहर)','ട്രാൻസിസ്റ്റർ (സർക്യൂട്ടിന് പുറത്ത്)'],['B-C open (OL both ways)','B-C ओपन (दोनों तरफ़ OL)','B-C ഓപ്പൺ (രണ്ട് വശത്തും OL)']]],
  o:[['No base drive','बेस ड्राइव नहीं','ബേസ് ഡ്രൈവ് ഇല്ല'],['Transistor open on the collector side. Replace it and check the flyback diode.','ट्रांज़िस्टर कलेक्टर साइड पर ओपन। बदलो और फ्लाईबैक डायोड जाँचो।','ട്രാൻസിസ്റ്റർ കളക്ടർ ഭാഗത്ത് ഓപ്പൺ. മാറ്റൂ, ഫ്ലൈബാക്ക് ഡയോഡ് പരിശോധിക്കൂ.'],['Relay coil shorted','रिले कॉइल शॉर्ट','റിലേ കോയിൽ ഷോർട്ട്']],a:1,
  why:['The base gets 0.7 V, so drive is present. VCE stays at 12 V, so no collector current flows. The B-C junction is open: often caused by a missing flyback diode.','बेस पर 0.7 V, ड्राइव है। VCE 12 V पर, कलेक्टर करंट नहीं। B-C जंक्शन ओपन: अक्सर फ्लाईबैक डायोड न होने से।','ബേസിൽ 0.7 V, ഡ്രൈവ് ഉണ്ട്. VCE 12 V-ൽ, കളക്ടർ കറന്റ് ഇല്ല. B-C ജംഗ്ഷൻ ഓപ്പൺ: പലപ്പോഴും ഫ്ലൈബാക്ക് ഡയോഡ് ഇല്ലാത്തതിനാൽ.']}];

 trick:L('Follow the signal: AC in, pulses, smooth DC, then the load.','सिग्नल का पीछा करो: AC अंदर, पल्स, स्मूथ DC, फिर लोड।','സിഗ്നൽ പിന്തുടരൂ: AC അകത്ത്, പൾസ്, സ്മൂത്ത് DC, പിന്നെ ലോഡ്.'),
 check:{q:L('A 6 V relay coil has 120 Ω. The transistor must switch IC (Ohm’s law) = …','6 V रिले कॉइल 120 Ω। ट्रांज़िस्टर को IC (ओम का नियम) = …','6 V റിലേ കോയിൽ 120 Ω. ട്രാൻസിസ്റ്റർ സ്വിച്ച് ചെയ്യേണ്ട IC (ഓം നിയമം) = …'),o:['50 mA','20 mA','720 mA'],a:0},
 page(w,s,api){
  const FA=FA12;const sv=P.faultE||(P.faultE={});let mi=0,probe=-1;
  const pic=h('div');w.appendChild(pic);const rd=h('div','rd');w.appendChild(rd);
  const draw=()=>{const m=FA[mi];pic.innerHTML=S(400,125,m.pic(probe,!!sv[mi]),'Fault picture');svgLang();watchFit()};
  const sideTop=h('div');s.appendChild(sideTop);const fin=h('div');fin.hidden=true;s.appendChild(fin);
  const show=()=>{const m=FA[mi];probe=-1;rd.innerHTML='';draw();sideTop.innerHTML='';
   sideTop.appendChild(h('div','beat',RD('Mission '+(mi+1)+' of 5','मिशन '+(mi+1)+' / 5','മിഷൻ '+(mi+1)+' / 5')));
   sideTop.appendChild(h('div','hook',`<small>${term('sp')}</small><span>${B3(m.sp)}</span>`));
   sideTop.appendChild(h('div','beat',RD('Tests: tap one at a time','टेस्ट: एक-एक दबाओ','ടെസ്റ്റ്: ഓരോന്നായി ടാപ്പ് ചെയ്യൂ')));
   const tb=h('div','chips');sideTop.appendChild(tb);
   m.tests.forEach((t,k)=>{const b=h('button','btn',B3(t[0]));b.type='button';b.onclick=()=>{probe=k+1;const r=t[1];setRd(rd,`<span>${B3(t[0])} → <b>${Array.isArray(r)?B3(r):r}</b></span>`);draw();dg.hidden=false};tb.appendChild(b)});
   const dg=h('div');dg.hidden=!sv[mi];sideTop.appendChild(dg);
   dg.appendChild(h('div','beat',RD('Your diagnosis','आपका डायग्नोसिस','നിങ്ങളുടെ ഡയഗ്നോസിസ്')));
   const os=h('div','opts');dg.appendChild(os);const fb=h('div','fb');fb.setAttribute('aria-live','polite');dg.appendChild(fb);const nx=h('div');dg.appendChild(nx);
   const done=()=>{fb.className='fb ok';fb.innerHTML=ICO.ok+' '+UIB('ok')+' '+B3(m.why);$$('.opt',os).forEach((x,k)=>{x.disabled=true;if(k===m.a)x.classList.add('right')});draw();
    nx.innerHTML='';const bt=h('button','btn big on');bt.type='button';bt.innerHTML=(mi<4?RD('Next mission','नेक्स्ट मिशन','നെക്സ്റ്റ് മിഷൻ'):RD('Finish','फिनिश','ഫിനിഷ്'))+' →';bt.onclick=()=>{if(mi<4){mi++;show()}else{finish()}};nx.appendChild(bt)};
   m.o.forEach((o,k)=>{const b=h('button','opt',B3(o));b.type='button';b.onclick=()=>{if(k===m.a){sv[mi]=1;save();award(10,'fe'+mi,P.chk);done()}else{b.classList.add('wrong');b.disabled=true;fb.className='fb no';fb.innerHTML=ICO.no+' '+UIB('again')}};os.appendChild(b)});
   if(sv[mi])done();
   api.redraw()};
  const finish=()=>{sideTop.innerHTML='';rd.innerHTML='';pic.innerHTML='';fin.hidden=false;fin.innerHTML='';
   fin.appendChild(h('div','beat',RD('All 5 missions done','सभी 5 मिशन पूरे','5 മിഷനും പൂർത്തിയായി')));
   fin.appendChild(h('div','trick',`<small>${term('rem')}</small>${B3(['Follow the signal: AC in, pulses, smooth DC, then the load.','सिग्नल का पीछा करो: AC अंदर, पल्स, स्मूथ DC, फिर लोड।','സിഗ്നൽ പിന്തുടരൂ: AC അകത്ത്, പൾസ്, സ്മൂത്ത് DC, പിന്നെ ലോഡ്.'])}`));
   fin.appendChild(checkBlock(SL.find(x=>x.id==='e_fault')));
   const nb=h('button','btn big on');nb.type='button';nb.innerHTML=UIB('nx')+' →';nb.onclick=()=>go(cur+1);fin.appendChild(nb)};
  const firstOpen=[0,1,2,3,4].findIndex(i=>!sv[i]);mi=firstOpen<0?4:firstOpen;
  if(firstOpen<0&&Object.keys(sv).length>=5){show();finish()}else show();
  api.setReplay(()=>{})}});

  [['Colour code','कलर कोड','കളർ കോഡ്'],['Barrier','बैरियर','ബാരിയർ'],['Diode current','डायोड करंट','ഡയോഡ് കറന്റ്'],['Zener','ज़ेनर','സെനർ'],['Half wave','हाफ वेव','ഹാഫ് വേവ്'],['Full wave','फुल वेव','ഫുൾ വേവ്'],['Bridge','ब्रिज','ബ്രിഡ്ജ്'],['Ripple','रिपल','റിപ്പിൾ'],['Filter','फ़िल्टर','ഫിൽട്ടർ'],['Transistor','ट्रांज़िस्टर','ട്രാൻസിസ്റ്റർ'],['Amplifier','एम्प्लिफायर','ആംപ്ലിഫയർ'],['Oscillator','ऑसिलेटर','ഓസിലേറ്റർ']].forEach(r=>X(r[0],r[1],r[2]));
  const M=[['Vrms','m0',30],['Vm','a','e_hw'],['Vdc','a','e_ct'],['Vr','a','e_fil'],['IB','a','e_act'],['IC','a','e_act'],['Av','a','e_amp']];
  w.innerHTML=`<p class="note" style="margin:2px 2px 8px">${RD('Tap a tile to open its slide.','टाइल टैप करके स्लाइड खोलो।','ടൈൽ ടാപ്പ് ചെയ്ത് സ്ലൈഡ് തുറക്കൂ.')}</p><div class="grid">${R.map(r=>`<button type="button" class="tile" data-g="${r[2]}"><b>${r[0]}</b><span>${BI(r[1],(XT[norm(r[1])]||[r[1]])[0],(XT[norm(r[1])]||[r[1],r[1]])[1])} · ${RD('slide','स्लाइड','സ്ലൈഡ്')} ${noI(r[2])}</span></button>`).join('')}</div>
   <div class="beat" style="margin:12px 2px 6px">${term('connect')}</div><div class="mapw">${M.map((m,i)=>`${i?'<i>→</i>':''}<button type="button" class="mapn ${m[1]==='a'?'m2a':'m2'}" data-t="${m[1]}" data-k="${m[2]}"><b>${m[0]}</b><span>${m[1]==='m0'?'M0 · '+m[2]:'M12A · '+noI(m[2])}</span></button>`).join('')}</div>`;
  $$('.tile',w).forEach(b=>b.addEventListener('click',()=>go(noI(b.dataset.g)-1)));
  $$('.mapn',w).forEach(b=>b.addEventListener('click',()=>{if(b.dataset.t==='m0')location.href='M00_Fundamentals_Primer.html#'+b.dataset.k;else go(noI(b.dataset.k)-1)}))}});

CS({id:'e_viva',menu:'Viva cards',kind:'def',title:'viva',wide:true,hk:undefined,page(w,s,api){
  const C=(q,a)=>[L(q[0],q[1],q[2]),L(a[0],a[1],a[2])];
  flipDeck(w,api,[
   {name:L('L1 Fact','L1 फैक्ट','L1 ഫാക്ട്'),cards:[
    C(['What is the barrier potential of silicon and germanium?','सिलिकॉन और जर्मेनियम का बैरियर पोटेंशियल?','സിലിക്കണിന്റെയും ജെർമേനിയത്തിന്റെയും ബാരിയർ പൊട്ടൻഷ്യൽ?'],['About 0.7 V and 0.3 V.','करीब 0.7 V और 0.3 V।','ഏകദേശം 0.7 V, 0.3 V.']),
    C(['Name a pentavalent and a trivalent impurity.','एक पेंटावैलेंट और एक ट्राइवैलेंट इम्प्योरिटी बताओ।','ഒരു പെന്റാവാലന്റ്, ഒരു ട്രൈവാലന്റ് ഇംപ്യൂരിറ്റി പറയൂ.'],['Phosphorus (N-type), boron (P-type).','फॉस्फोरस (N-टाइप), बोरॉन (P-टाइप)।','ഫോസ്ഫറസ് (N-ടൈപ്പ്), ബോറോൺ (P-ടൈപ്പ്).']),
    C(['Ripple frequency of a bridge rectifier on 50 Hz?','50 Hz पर ब्रिज रेक्टिफायर की रिपल फ्रीक्वेंसी?','50 Hz-ൽ ബ്രിഡ്ജ് റെക്ടിഫയറിന്റെ റിപ്പിൾ ഫ്രീക്വൻസി?'],['100 Hz.','100 Hz।','100 Hz.']),
    C(['Three terminals of a BJT?','BJT के तीन टर्मिनल?','BJT-യുടെ മൂന്ന് ടെർമിനൽ?'],['Emitter, base, collector.','एमिटर, बेस, कलेक्टर।','എമിറ്റർ, ബേസ്, കളക്ടർ.']),
    C(['What does Volts/div on a CRO set?','CRO पर Volts/div क्या सेट करता है?','CRO-യിൽ Volts/div എന്ത് സെറ്റ് ചെയ്യുന്നു?'],['The vertical scale: volts per division.','खड़ा स्केल: हर डिवीज़न के वोल्ट।','ലംബ സ്കെയിൽ: ഓരോ ഡിവിഷനിലെ വോൾട്ട്.'])]},
   {name:L('L2 Why / How','L2 क्यों / कैसे','L2 എന്തുകൊണ്ട് / എങ്ങനെ'),cards:[
    C(['Why does a semiconductor’s resistance fall with heat?','सेमीकंडक्टर का रेसिस्टेंस गर्मी से क्यों घटता है?','സെമികണ്ടക്ടറിന്റെ റെസിസ്റ്റൻസ് ചൂടിൽ എന്തുകൊണ്ട് കുറയുന്നു?'],['Heat breaks bonds and creates more electrons and holes.','गर्मी बॉन्ड तोड़कर ज़्यादा इलेक्ट्रॉन और होल बनाती है।','ചൂട് ബോണ്ട് പൊട്ടിച്ച് കൂടുതൽ ഇലക്ട്രോണും ഹോളും ഉണ്ടാക്കുന്നു.']),
    C(['Why is a bridge preferred to a centre-tap rectifier?','सेंटर-टैप से ब्रिज क्यों बेहतर?','സെന്റർ-ടാപ്പിനേക്കാൾ ബ്രിഡ്ജ് എന്തുകൊണ്ട്?'],['No centre tap needed, and the PIV per diode is only Vm.','सेंटर टैप नहीं चाहिए, और हर डायोड का PIV सिर्फ़ Vm।','സെന്റർ ടാപ്പ് വേണ്ട, ഓരോ ഡയോഡിന്റെയും PIV Vm മാത്രം.']),
    C(['How does a capacitor filter smooth the output?','कैपेसिटर फ़िल्टर आउटपुट कैसे स्मूथ करता है?','കപ്പാസിറ്റർ ഫിൽട്ടർ ഔട്ട്പുട്ട് എങ്ങനെ സ്മൂത്ത് ആക്കുന്നു?'],['It charges at each peak and supplies the load between peaks.','हर पीक पर चार्ज होकर पीक के बीच लोड को देता है।','ഓരോ പീക്കിലും ചാർജ് ആയി പീക്കുകൾക്കിടയിൽ ലോഡിന് നൽകുന്നു.']),
    C(['Why is the base made thin?','बेस पतला क्यों बनाते हैं?','ബേസ് എന്തുകൊണ്ട് നേർത്തതാക്കുന്നു?'],['So most emitter electrons cross into the collector instead of recombining in the base.','ताकि एमिटर के ज़्यादातर इलेक्ट्रॉन बेस में मिलने के बजाय कलेक्टर में जाएँ।','എമിറ്ററിലെ മിക്ക ഇലക്ട്രോണും ബേസിൽ ചേരാതെ കളക്ടറിലേക്ക് പോകാൻ.']),
    C(['Why is a CE amplifier output inverted?','CE एम्प्लिफायर का आउटपुट उल्टा क्यों?','CE ആംപ്ലിഫയർ ഔട്ട്പുട്ട് എന്തുകൊണ്ട് തലകീഴ്?'],['More input means more IC, more drop on RC, so the collector voltage falls.','ज़्यादा इनपुट से ज़्यादा IC, RC पर ज़्यादा ड्रॉप, तो कलेक्टर वोल्टेज गिरता है।','കൂടുതൽ ഇൻപുട്ട്, കൂടുതൽ IC, RC-യിൽ കൂടുതൽ ഡ്രോപ്പ്, കളക്ടർ വോൾട്ടേജ് താഴുന്നു.'])]},
   {name:L('L3 Workshop','L3 वर्कशॉप','L3 വർക്ക്ഷോപ്പ്'),cards:[
    C(['How do you test a diode with a multimeter?','मल्टीमीटर से डायोड कैसे टेस्ट करते हैं?','മൾട്ടിമീറ്റർ കൊണ്ട് ഡയോഡ് എങ്ങനെ ടെസ്റ്റ് ചെയ്യാം?'],['Diode range: about 0.5–0.7 V one way, OL the other. 0 both ways = short, OL both ways = open.','डायोड रेंज: एक तरफ़ करीब 0.5–0.7 V, दूसरी तरफ़ OL। दोनों तरफ़ 0 = शॉर्ट, दोनों तरफ़ OL = ओपन।','ഡയോഡ് റേഞ്ച്: ഒരു വശത്ത് ഏകദേശം 0.5–0.7 V, മറുവശത്ത് OL. രണ്ട് വശത്തും 0 = ഷോർട്ട്, OL = ഓപ്പൺ.']),
    C(['How do you identify E, B, C of an unknown NPN?','अनजान NPN के E, B, C कैसे पहचानें?','അറിയാത്ത NPN-ന്റെ E, B, C എങ്ങനെ കണ്ടെത്താം?'],['Find the pin that reads 0.6–0.7 V to both others with red on it: that is B. The slightly lower reading is to C.','वह पिन ढूँढो जिस पर लाल रखने पर दोनों से 0.6–0.7 V: वह B। थोड़ी कम रीडिंग C की ओर।','ചുവപ്പ് വെച്ചാൽ മറ്റ് രണ്ടിലേക്കും 0.6–0.7 V കാണിക്കുന്ന പിൻ: അത് B. അല്പം കുറഞ്ഞ റീഡിംഗ് C-യിലേക്ക്.']),
    C(['How do you replace a filter capacitor safely?','फ़िल्टर कैपेसिटर सुरक्षित कैसे बदलें?','ഫിൽട്ടർ കപ്പാസിറ്റർ സുരക്ഷിതമായി എങ്ങനെ മാറ്റാം?'],['Switch off, discharge it through a resistor, fit the same µF with equal or higher voltage, observe polarity.','बंद करो, रेसिस्टर से डिस्चार्ज करो, उतने µF और बराबर या ज़्यादा वोल्टेज का लगाओ, पोलैरिटी देखो।','ഓഫ് ചെയ്യൂ, റെസിസ്റ്റർ വഴി ഡിസ്ചാർജ് ചെയ്യൂ, അതേ µF, തുല്യമോ കൂടിയതോ വോൾട്ടേജ്, പോളാരിറ്റി ശ്രദ്ധിക്കൂ.'])]}
  ],'m12aviva')}});

CS({id:'e_intv',menu:'Interview cards',kind:'law',title:'interview',wide:true,hk:undefined,page(w,s,api){
  const C=(q,a)=>[L(q[0],q[1],q[2]),L(a[0],a[1],a[2])];
  flipDeck(w,api,[
   {name:L('Interview','इंटरव्यू','ഇന്റർവ്യൂ'),cards:[
    C(['Design a 12 V DC supply from 230 V mains.','230 V मेन से 12 V DC सप्लाई डिज़ाइन करो।','230 V മെയിനിൽ നിന്ന് 12 V DC സപ്ലൈ ഡിസൈൻ ചെയ്യൂ.'],['Fuse, 230/12 V transformer, bridge rectifier, filter capacitor (for example 2200 µF 25 V), then a regulator. Check PIV and current ratings.','फ्यूज़, 230/12 V ट्रांसफॉर्मर, ब्रिज रेक्टिफायर, फ़िल्टर कैपेसिटर (जैसे 2200 µF 25 V), फिर रेगुलेटर। PIV और करंट रेटिंग जाँचो।','ഫ്യൂസ്, 230/12 V ട്രാൻസ്ഫോർമർ, ബ്രിഡ്ജ് റെക്ടിഫയർ, ഫിൽട്ടർ കപ്പാസിറ്റർ (ഉദാ. 2200 µF 25 V), പിന്നെ റെഗുലേറ്റർ. PIV, കറന്റ് റേറ്റിംഗ് പരിശോധിക്കൂ.']),
    C(['Transistor as a switch versus as an amplifier?','स्विच और एम्प्लिफायर के रूप में ट्रांज़िस्टर में फ़र्क?','സ്വിച്ച് ആയും ആംപ്ലിഫയർ ആയും ട്രാൻസിസ്റ്ററിലെ വ്യത്യാസം?'],['Switch: only cut-off and saturation. Amplifier: biased in the active region, between the two.','स्विच: सिर्फ़ कट-ऑफ और सैचुरेशन। एम्प्लिफायर: दोनों के बीच एक्टिव रीजन में बायस्ड।','സ്വിച്ച്: കട്ട്-ഓഫും സാച്ചുറേഷനും മാത്രം. ആംപ്ലിഫയർ: ഇവയ്ക്കിടയിൽ ആക്ടീവ് റീജിയനിൽ ബയസ്.']),
    C(['What makes an oscillator oscillate?','ऑसिलेटर क्यों ऑसिलेट करता है?','ഓസിലേറ്റർ എന്തുകൊണ്ട് ഓസിലേറ്റ് ചെയ്യുന്നു?'],['Positive feedback with loop gain 1 and 0° total phase (Barkhausen).','पॉज़िटिव फीडबैक, लूप गेन 1 और कुल फेज़ 0° (बार्कहाउज़न)।','പോസിറ്റീവ് ഫീഡ്ബാക്ക്, ലൂപ്പ് ഗെയിൻ 1, ആകെ ഫേസ് 0° (ബാർക്ക്ഹൗസൻ).'])]}
  ],'m12aintv')}});

CS({id:'e_mcq',menu:'MCQ quiz',kind:'tip',title:'quiz',wide:true,hk:undefined,page(w,s,api){
  const Q=[
   [L('The barrier potential of a silicon PN junction is about …','सिलिकॉन PN जंक्शन का बैरियर पोटेंशियल करीब …','സിലിക്കൺ PN ജംഗ്ഷന്റെ ബാരിയർ പൊട്ടൻഷ്യൽ ഏകദേശം …'),['0.7 V','0.3 V','1.5 V','7 V'],0,L('Silicon about 0.7 V, germanium about 0.3 V.','सिलिकॉन करीब 0.7 V, जर्मेनियम करीब 0.3 V।','സിലിക്കൺ ഏകദേശം 0.7 V, ജെർമേനിയം ഏകദേശം 0.3 V.')],
   [L('The majority carriers in P-type silicon are …','P-टाइप सिलिकॉन में मेजॉरिटी कैरियर …','P-ടൈപ്പ് സിലിക്കണിലെ മെജോറിറ്റി കാരിയർ …'),[L('holes','होल','ഹോൾ'),L('electrons','इलेक्ट्रॉन','ഇലക്ട്രോൺ'),L('protons','प्रोटॉन','പ്രോട്ടോൺ'),L('ions','आयन','അയോൺ')],0,L('Trivalent atoms leave holes.','ट्राइवैलेंट एटम होल छोड़ते हैं।','ട്രൈവാലന്റ് ആറ്റം ഹോൾ ഉണ്ടാക്കുന്നു.')],
   [L('Half-wave rectifier, Vm = 50 V. Vdc is about …','हाफ-वेव रेक्टिफायर, Vm = 50 V। Vdc करीब …','ഹാഫ്-വേവ് റെക്ടിഫയർ, Vm = 50 V. Vdc ഏകദേശം …'),['15.9 V','31.8 V','35.4 V','50 V'],0,L('50 ÷ π ≈ 15.9 V.','50 ÷ π ≈ 15.9 V।','50 ÷ π ≈ 15.9 V.')],
   [L('The ripple frequency of a bridge rectifier on 50 Hz mains is …','50 Hz मेन पर ब्रिज रेक्टिफायर की रिपल फ्रीक्वेंसी …','50 Hz മെയിനിൽ ബ്രിഡ്ജ് റെക്ടിഫയറിന്റെ റിപ്പിൾ ഫ്രീക്വൻസി …'),['100 Hz','50 Hz','25 Hz','200 Hz'],0,L('Full wave doubles the supply frequency.','फुल वेव सप्लाई फ्रीक्वेंसी दोगुनी करता है।','ഫുൾ വേവ് സപ്ലൈ ഫ്രീക്വൻസി ഇരട്ടിയാക്കുന്നു.')],
