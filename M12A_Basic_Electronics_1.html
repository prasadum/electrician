html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:400 16px/1.35 NL,NG,NM,ND,NK,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bar{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.bar .ttl{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{min-width:44px;min-height:44px;padding:0 12px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--def);border-color:var(--def);color:#fff}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--def);outline-offset:2px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-width:44px;min-height:44px;border:0;background:var(--card);font-weight:700;font-size:14px;padding:0 8px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--def);color:#fff}
#prog{height:6px;background:var(--line);flex:none}#prog i{display:block;height:100%;width:0;background:var(--def);transition:width .25s}
#xp{font-weight:700;font-size:14px;color:var(--frm);display:none}
body.study #xp{display:inline}
#stage{flex:1;min-height:0;overflow:auto;display:flex;touch-action:pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.slide{margin:auto;width:100%;min-height:100%;display:grid;gap:10px;padding:10px 12px 14px;
  grid-template-columns:1fr;grid-template-areas:"head" "vis" "side";align-content:start}
.s-head{grid-area:head;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;border-left:8px solid var(--k);padding-left:10px}
.s-vis{grid-area:vis;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px;position:relative;min-width:0}
.s-vis svg{width:100%;height:auto;max-height:52vh;display:block;touch-action:pan-y pinch-zoom}
.s-side{grid-area:side;display:flex;flex-direction:column;gap:10px;min-width:0}
.kind-def{--k:var(--def);--kb:var(--def-bg)}.kind-law{--k:var(--law);--kb:var(--law-bg)}
.kind-formula{--k:var(--frm);--kb:var(--frm-bg)}.kind-warn{--k:var(--warn);--kb:var(--warn-bg)}.kind-tip{--k:var(--tip);--kb:var(--tip-bg)}
.kind-def .s-vis,.kind-law .s-vis,.kind-formula .s-vis,.kind-warn .s-vis,.kind-tip .s-vis{border-color:var(--k)}
.tag{font-size:14px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--kb);color:var(--k);border:1.5px solid var(--k);white-space:nowrap}
.tag.add{background:#fff6cf;color:#6a4b00;border-color:#d9a400}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tag.add{background:#3a3010;color:#ffd84a;border-color:#a98400}}
:root[data-theme=dark] .tag.add{background:#3a3010;color:#ffd84a;border-color:#a98400}
h2.term{margin:0;font-size:clamp(22px,5.4vw,30px);line-height:1.15}
.t .en{font-weight:700}.t .hi,.t .ml{display:block;font-size:14px;font-weight:400;color:var(--mut);line-height:1.25}
.t .hi,.t .ml{display:none}
h2.term .t .hi,h2.term .t .ml{display:none}
body[data-lang=hi] .t .hi,body[data-lang=all] .t .hi,body[data-lang=ml] .t .ml,body[data-lang=all] .t .ml{display:block}
body[data-lang=hi] h2.term .t .hi,body[data-lang=all] h2.term .t .hi,body[data-lang=ml] h2.term .t .ml,body[data-lang=all] h2.term .t .ml{display:inline;font-size:.7em;font-weight:400;color:var(--mut)}
h2.term .t .hi::before,h2.term .t .ml::before{content:' / ';color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--kb,var(--card));border:1.5px solid var(--k,var(--line));border-radius:10px;padding:6px 10px;font-size:16px;min-width:0}
.chip .sym{display:block;font-size:14px;color:var(--mut);font-weight:600}
.chip .sym sup,.chip .sym sub{font-size:inherit}
.hook{display:flex;gap:8px;align-items:center;font-weight:700;font-size:18px;background:var(--kb);border-radius:10px;padding:8px 10px;border:1.5px dashed var(--k)}
.hook small{font-size:14px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.beat{font-size:14px;font-weight:700;color:var(--mut);margin:0 0 4px}
.pred{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.pred .q{font-weight:700;font-size:18px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:48px;padding:6px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px;touch-action:manipulation;flex:1 1 auto;min-width:88px}

const INL=new Set(['I','B','SUB','SUP','EM','STRONG','SMALL']);
function wrapT(en,hi,ml){const sp=document.createElement('span');sp.className='t';sp.innerHTML=`<span class="en">${en}</span><span class="hi">${hi}</span><span class="ml">${ml}</span>`;return sp}
const SYM=new Set(['Vav','Vrms','Vpp','rms','sin','cos','tan','kWh','kVA','kVAR','kW','Vm','Em','rad','mm','kHz','MHz','Hz','mA','kΩ','MΩ','VAR','RMS','AC','DC','Wb']);
function needs(t){return (t.match(/[A-Za-z]{3,}/g)||[]).filter(w=>!SYM.has(w)).length>=1}
function autoT(root){if(!root)return;
 const els=[...root.querySelectorAll('*')];
 for(const e of els){if(!e.isConnected||e.closest('.t,svg,script,style,textarea'))continue;
  const kids=[...e.childNodes];if(!kids.length)continue;
  const simple=kids.every(n=>n.nodeType===3||(n.nodeType===1&&INL.has(n.tagName)&&[...n.querySelectorAll('*')].every(c=>INL.has(c.tagName))));
  if(simple){const txt=e.textContent;if(!norm(txt))continue;const r=xl(txt);
   if(r){const en=e.innerHTML;e.innerHTML='';e.appendChild(wrapT(en,r[0],r[1]));continue}
   if(needs(txt))MISS.add(norm(txt))
  }else{
   for(const n of kids){if(n.nodeType!==3)continue;const tx=n.textContent;if(!norm(tx))continue;const r=xl(tx);
    if(r){const sp=wrapT(tx.trim(),r[0],r[1]);n.replaceWith(document.createTextNode(' '),sp)}
    else if(needs(tx))MISS.add(norm(tx))}}}}
let xq=false;function xsched(){if(xq)return;xq=true;requestAnimationFrame(()=>{xq=false;autoT(document.getElementById('stage'))})}
function autoInit(){const st=document.getElementById('stage');if(!st||st.__xo)return;st.__xo=1;new MutationObserver(xsched).observe(st,{childList:true,subtree:true,characterData:true});xsched()}

/* ---- geometry helpers for flowing dots ---- */
function mkPath(pts){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,L,tot:L[L.length-1]}}
function at(P_,s){s=((s%1)+1)%1;const d=s*P_.tot;let i=1;while(i<P_.L.length-1&&P_.L[i]<d)i++;
  const a=P_.pts[i-1],b=P_.pts[i],k=(d-P_.L[i-1])/((P_.L[i]-P_.L[i-1])||1);return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]}

  const i=h('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=val;i.id=id;i.setAttribute('aria-label',label.replace(/<[^>]+>/g,''));
  const v=$('.val',l);const upd=()=>{v.textContent=fmt(+i.value)};
  i.addEventListener('input',()=>{upd();cb(+i.value)});upd();l.appendChild(i);host.appendChild(l);
  return{get:()=>+i.value,set:x=>{i.value=x;upd()},input:i}}

function machineEnd(cx,cy,o){o=o||{};const R1=96,R0=82,ra=48;let s='';
 s+=`<circle cx="${cx}" cy="${cy}" r="${R1}" fill="${IRON}" stroke="#4a5560" stroke-width="1.5"/><circle cx="${cx}" cy="${cy}" r="${R0}" fill="var(--bg)"/>`;
 /* main poles */
 [[-1,'#d9362b','N'],[1,'#2a6fdb','S']].forEach(([sd,col,lb])=>{if(o.nofield){col='#a7b1bb';lb=''}const x0=cx+sd*R0,x1=cx+sd*(ra+8);
  s+=`<path d="M${x0} ${cy-16}L${cx+sd*(ra+22)} ${cy-16}L${cx+sd*(ra+22)} ${cy-34}L${x1} ${cy-40}Q${cx+sd*(ra+4)} ${cy} ${x1} ${cy+40}L${cx+sd*(ra+22)} ${cy+34}L${cx+sd*(ra+22)} ${cy+16}L${x0} ${cy+16}Z" fill="${col}" stroke="#333" stroke-width="1.2"/>`;
  s+=`<rect x="${Math.min(x0,cx+sd*(ra+24))+ (sd<0?2:-2)}" y="${cy-30}" width="${Math.abs(x0-(cx+sd*(ra+24)))-0}" height="12" fill="${CU}" opacity=".95"/><rect x="${Math.min(x0,cx+sd*(ra+24))+(sd<0?2:-2)}" y="${cy+18}" width="${Math.abs(x0-(cx+sd*(ra+24)))}" height="12" fill="${CU}" opacity=".95"/>`;

 if(o.ip){[[-1,'S'],[1,'N']].forEach(([sd,lb])=>{const y0=cy+sd*R0,y1=cy+sd*(ra+8);s+=`<rect x="${cx-9}" y="${Math.min(y0,y1)}" width="18" height="${Math.abs(y0-y1)}" fill="${lb==='N'?'#e98a83':'#8db4ef'}" stroke="#333" stroke-width="1.2"/>`+TXC(cx+22,cy+sd*(ra+22)+5,lb,lb==='N'?'#d9362b':'#2a6fdb','13')})}

 const th=o.rot||0;s+=`<circle cx="${cx}" cy="${cy}" r="${ra}" fill="${IRON2}" stroke="#4a5560" stroke-width="1.5"/>`;
 const n=o.nocond?0:16;for(let k=0;k<n;k++){const a=th+k*TPI/n,x=cx+(ra-9)*Math.cos(a),y=cy-(ra-9)*Math.sin(a);const sgn=o.cur?(Math.cos(a)>0?1:-1)*(Math.abs(Math.cos(a))>.2?1:0):0;

CS({id:'e_semi',menu:'Semiconductor',title:'t_semi',

 hook:L('Every diode, LED and transistor in a panel is made from a thin slice of silicon.','पैनल का हर डायोड, LED और ट्रांज़िस्टर सिलिकॉन के पतले टुकड़े से बना है।','പാനലിലെ ഓരോ ഡയോഡും LED-യും ട്രാൻസിസ്റ്ററും സിലിക്കണിന്റെ നേർത്ത കഷണത്തിൽ നിന്നാണ്.'),
 defn:L('<b>Semiconductor:</b> silicon (Si) or germanium (Ge). Each atom has 4 outer electrons, shared in 4 bonds. Heat breaks a bond: a free electron and a <b>hole</b> (a missing electron that acts as +) appear.','<b>सेमीकंडक्टर:</b> सिलिकॉन (Si) या जर्मेनियम (Ge)। हर एटम के 4 बाहरी इलेक्ट्रॉन, 4 बॉन्ड में शेयर। गर्मी बॉन्ड तोड़ती है: एक फ्री इलेक्ट्रॉन और एक <b>होल</b> (गायब इलेक्ट्रॉन, + की तरह) बनते हैं।','<b>സെമികണ്ടക്ടർ:</b> സിലിക്കൺ (Si) അല്ലെങ്കിൽ ജെർമേനിയം (Ge). ഓരോ ആറ്റത്തിനും 4 പുറം ഇലക്ട്രോൺ, 4 ബോണ്ടിൽ ഷെയർ ചെയ്യുന്നു. ചൂട് ബോണ്ട് പൊട്ടിക്കുന്നു: ഒരു ഫ്രീ ഇലക്ട്രോണും ഒരു <b>ഹോളും</b> (കാണാതായ ഇലക്ട്രോൺ, + പോലെ) ഉണ്ടാകുന്നു.'),
 play:L('Tap Cold, Room, Hot. Then press Voltage ON. Blue dots = electrons, white rings = holes.','Cold, Room, Hot दबाओ। फिर Voltage ON दबाओ। नीले डॉट = इलेक्ट्रॉन, सफ़ेद रिंग = होल।','Cold, Room, Hot ടാപ്പ് ചെയ്യൂ. പിന്നെ Voltage ON. നീല ഡോട്ട് = ഇലക്ട്രോൺ, വെള്ള വളയം = ഹോൾ.'),
 pred:{q:L('Pure silicon is heated. Its resistance …','शुद्ध सिलिकॉन गरम किया। उसका रेसिस्टेंस …','ശുദ്ധ സിലിക്കൺ ചൂടാക്കി. അതിന്റെ റെസിസ്റ്റൻസ് …'),o:[L('falls','घटता है','കുറയുന്നു'),L('rises','बढ़ता है','കൂടുന്നു'),L('stays the same','वही रहता है','അതേ പോലെ')],a:0,why:L('Heat breaks bonds. More free electrons and holes, so it conducts better. Unlike copper, its resistance falls with heat.','गर्मी बॉन्ड तोड़ती है। ज़्यादा फ्री इलेक्ट्रॉन और होल, तो बेहतर कंडक्ट। कॉपर के उलट, गर्मी से रेसिस्टेंस घटता है।','ചൂട് ബോണ്ട് പൊട്ടിക്കുന്നു. കൂടുതൽ ഫ്രീ ഇലക്ട്രോണും ഹോളും, നന്നായി കണ്ടക്ട് ചെയ്യുന്നു. കോപ്പറിൽ നിന്ന് വ്യത്യസ്തമായി, ചൂടിൽ റെസിസ്റ്റൻസ് കുറയുന്നു.')},
 labels:['hole'],hints:['semi','cur'],rel:{c:['Q','I','R'],h:'R'},
 ex:L('Example: Si has 14 electrons (2, 8, 4). Ge has 32 (2, 8, 18, 4). Both have 4 in the outer shell.','उदाहरण: Si में 14 इलेक्ट्रॉन (2, 8, 4)। Ge में 32 (2, 8, 18, 4)। दोनों के बाहरी शेल में 4।','ഉദാഹരണം: Si-ൽ 14 ഇലക്ട്രോൺ (2, 8, 4). Ge-ൽ 32 (2, 8, 18, 4). രണ്ടിന്റെയും പുറം ഷെല്ലിൽ 4.'),
 trick:L('Break a bond: one electron, one hole.','बॉन्ड टूटा: एक इलेक्ट्रॉन, एक होल।','ബോണ്ട് പൊട്ടി: ഒരു ഇലക്ട്രോൺ, ഒരു ഹോൾ.'),
 check:{q:L('Voltage is applied. Electrons drift toward the + end (Module 0). The holes drift toward …','वोल्टेज लगाया। इलेक्ट्रॉन + सिरे की ओर (मॉड्यूल 0)। होल किस ओर?','വോൾട്ടേജ് കൊടുത്തു. ഇലക്ട്രോൺ + അറ്റത്തേക്ക് (മൊഡ്യൂൾ 0). ഹോൾ ഏത് ദിശയിൽ?'),o:[L('the − end','− सिरे की ओर','− അറ്റത്തേക്ക്'),L('the + end','+ सिरे की ओर','+ അറ്റത്തേക്ക്'),L('nowhere','कहीं नहीं','എങ്ങും ഇല്ല')],a:0},
 build(w,api){
  w.innerHTML=S(400,200,`<g id="a"></g>`,'Silicon crystal with bonds, free electrons and holes');
  const rd=mkRd(w),c=mkCtl(w);let lv=1,von=false;const NB=[0,2,5];
  modeBtns(c,[L('Cold','ठंडा','തണുപ്പ്'),L('Room','कमरा','മുറി'),L('Hot','गरम','ചൂട്')],i=>{lv=i;api.redraw()},1);
  tog(c,L('Voltage ON','वोल्टेज ON','വോൾട്ടേജ് ON'),v=>{von=v;api.redraw()});
  return t=>{const n=NB[lv],br=BRK.slice(0,n);let s=latSvg(null,br);
   br.forEach((k,i)=>{const m=bondMid(k);let hx=m[0];if(von){const st=Math.floor(t*.8+i)%4;hx=m[0]-35*st;if(hx<40)hx+=280}
    s+=`<circle cx="${hx}" cy="${m[1]}" r="7" fill="#fff" stroke="#333" stroke-width="2"/>`+TXC(hx,m[1]+4,'+','#333','11');
    let ex,ey;if(von){ex=30+((m[0]-30+t*60+i*37)%340);ey=m[1]+12}else{ex=m[0]+14*Math.cos(t*3+i);ey=m[1]+12+8*Math.sin(t*2.3+i)}
    s+=`<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="5.5" fill="#2a6fdb"/>`});
   if(von)s+=TXC(14,194,'−','var(--def)','18')+TXC(388,194,'+','var(--no)','18');
   put($('#a',w),s);
   setRd(rd,`<span>${RD('Free electrons','फ्री इलेक्ट्रॉन','ഫ്രീ ഇലക്ട്രോൺ')}: <b>${n}</b> · ${RD('Holes','होल','ഹോൾ')}: <b>${n}</b></span><span>${n===0?RD('No carriers: behaves as an insulator.','कैरियर नहीं: इंसुलेटर जैसा।','കാരിയർ ഇല്ല: ഇൻസുലേറ്റർ പോലെ.'):n<4?RD('A few carriers: conducts a little.','थोड़े कैरियर: थोड़ा कंडक्ट।','കുറച്ച് കാരിയർ: അല്പം കണ്ടക്ട്.'):RD('More carriers: resistance falls.','ज़्यादा कैरियर: रेसिस्टेंस घटा।','കൂടുതൽ കാരിയർ: റെസിസ്റ്റൻസ് കുറഞ്ഞു.')}</span>`)}}});

/* ---------- 5 Doping ---------- */
const DPOS=[7,0,14];
CS({id:'e_dop',menu:'Doping: N-type and P-type',title:'t_dop',
 flash:FB('Bonds and holes (slide 4); charge (Module 0, slide 4)','बॉन्ड और होल (स्लाइड 4); चार्ज (मॉड्यूल 0, स्लाइड 4)','ബോണ്ടും ഹോളും (സ്ലൈഡ് 4); ചാർജ് (മൊഡ്യൂൾ 0, സ്ലൈഡ് 4)'),
 hook:L('Pure silicon conducts very poorly. Factories add a tiny pinch of another element to make it useful.','शुद्ध सिलिकॉन बहुत कम कंडक्ट करता है। फैक्ट्री में उसमें दूसरे तत्व की ज़रा-सी मात्रा मिलाते हैं।','ശുദ്ധ സിലിക്കൺ വളരെ കുറച്ചേ കണ്ടക്ട് ചെയ്യൂ. ഫാക്ടറിയിൽ മറ്റൊരു മൂലകം അല്പം ചേർക്കുന്നു.'),
 defn:L('<b>Doping:</b> adding a tiny amount of impurity. <b>N-type:</b> 5-valent atoms (phosphorus, arsenic) give free electrons. <b>P-type:</b> 3-valent atoms (boron, gallium, indium) give holes. Majority carriers: electrons in N, holes in P.','<b>डोपिंग:</b> ज़रा-सी इम्प्योरिटी मिलाना। <b>N-टाइप:</b> 5-वैलेंट एटम (फॉस्फोरस, आर्सेनिक) फ्री इलेक्ट्रॉन देते हैं। <b>P-टाइप:</b> 3-वैलेंट एटम (बोरॉन, गैलियम, इंडियम) होल देते हैं। मेजॉरिटी कैरियर: N में इलेक्ट्रॉन, P में होल।','<b>ഡോപ്പിംഗ്:</b> അല്പം ഇംപ്യൂരിറ്റി ചേർക്കൽ. <b>N-ടൈപ്പ്:</b> 5-വാലന്റ് ആറ്റം (ഫോസ്ഫറസ്, ആർസെനിക്) ഫ്രീ ഇലക്ട്രോൺ തരുന്നു. <b>P-ടൈപ്പ്:</b> 3-വാലന്റ് ആറ്റം (ബോറോൺ, ഗാലിയം, ഇൻഡിയം) ഹോൾ തരുന്നു. മെജോറിറ്റി കാരിയർ: N-ൽ ഇലക്ട്രോൺ, P-ൽ ഹോൾ.'),
 play:L('Tap N-type or P-type. Drag Dopant atoms. Count the carriers.','N-type या P-type दबाओ। Dopant atoms खिसकाओ। कैरियर गिनो।','N-type അല്ലെങ്കിൽ P-type ടാപ്പ് ചെയ്യൂ. Dopant atoms നീക്കൂ. കാരിയർ എണ്ണൂ.'),
 pred:{q:L('An atom with 5 outer electrons sits in silicon. Its fifth electron …','5 बाहरी इलेक्ट्रॉन वाला एटम सिलिकॉन में बैठा। उसका पाँचवाँ इलेक्ट्रॉन …','5 പുറം ഇലക്ട്രോണുള്ള ആറ്റം സിലിക്കണിൽ. അതിന്റെ അഞ്ചാമത്തെ ഇലക്ട്രോൺ …'),o:[L('is free to move','फ्री घूमता है','സ്വതന്ത്രമായി നീങ്ങുന്നു'),L('makes a hole','होल बनाता है','ഹോൾ ഉണ്ടാക്കുന്നു'),L('stops all current','सारा करंट रोकता है','എല്ലാ കറന്റും നിർത്തുന്നു')],a:0,why:L('Only 4 electrons fit in the 4 bonds. The fifth has no bond, so it is free.','4 बॉन्ड में सिर्फ़ 4 इलेक्ट्रॉन। पाँचवें का बॉन्ड नहीं, तो वह फ्री।','4 ബോണ്ടിൽ 4 ഇലക്ട്രോൺ മാത്രം. അഞ്ചാമത്തേതിന് ബോണ്ട് ഇല്ല, അതിനാൽ ഫ്രീ.')},
 labels:['dop','hole'],hints:['semi'],rel:{c:['Q','I'],h:'I'},
 ex:L('Example: one phosphorus atom in about ten million silicon atoms already raises conduction many times.','उदाहरण: करीब एक करोड़ सिलिकॉन एटम में एक फॉस्फोरस एटम ही कंडक्शन कई गुना बढ़ा देता है।','ഉദാഹരണം: ഏകദേശം ഒരു കോടി സിലിക്കൺ ആറ്റത്തിൽ ഒരു ഫോസ്ഫറസ് ആറ്റം മതി കണ്ടക്ഷൻ പല മടങ്ങ് കൂട്ടാൻ.'),
 trick:L('Five gives a free electron (N). Three gives a hole (P).','पाँच से फ्री इलेक्ट्रॉन (N)। तीन से होल (P)।','അഞ്ച് ഫ്രീ ഇലക്ട്രോൺ (N). മൂന്ന് ഹോൾ (P).'),
 check:{q:L('An electron carries negative charge (Module 0). In N-type silicon the majority carriers are …','इलेक्ट्रॉन पर नेगेटिव चार्ज (मॉड्यूल 0)। N-टाइप सिलिकॉन में मेजॉरिटी कैरियर …','ഇലക്ട്രോണിന് നെഗറ്റീവ് ചാർജ് (മൊഡ്യൂൾ 0). N-ടൈപ്പ് സിലിക്കണിൽ മെജോറിറ്റി കാരിയർ …'),o:[L('electrons','इलेक्ट्रॉन','ഇലക്ട്രോൺ'),L('holes','होल','ഹോൾ'),L('protons','प्रोटॉन','പ്രോട്ടോൺ')],a:0},
 build(w,api){
  w.innerHTML=S(400,200,`<g id="a"></g>`,'Silicon crystal with dopant atoms and the carriers they give');
  const rd=mkRd(w),c=mkCtl(w);let ty=0,n=1;
  modeBtns(c,[L('N-type (phosphorus)','N-टाइप (फॉस्फोरस)','N-ടൈപ്പ് (ഫോസ്ഫറസ്)'),L('P-type (boron)','P-टाइप (बोरॉन)','P-ടൈപ്പ് (ബോറോൺ)')],i=>{ty=i;api.redraw()});
  slider(c,L('Dopant atoms','डोपेंट एटम','ഡോപ്പന്റ് ആറ്റം'),1,3,1,1,x=>x,x=>{n=x;api.redraw()});
  return t=>{const sym={};DPOS.slice(0,n).forEach(k=>sym[k]=ty?'B':'P');let s=latSvg(sym);
   DPOS.slice(0,n).forEach((k,i)=>{const a=LAT.A[k];
    if(ty===0){const ex=a[0]+22*Math.cos(t*1.5+i*2)+((t*25+i*90)%60),ey=a[1]-20+6*Math.sin(t*2+i);s+=`<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="6" fill="#2a6fdb"/>`}
    else{const hx=a[0]+35,hy=a[1];s+=`<circle cx="${hx}" cy="${hy}" r="8" fill="#fff" stroke="#333" stroke-width="2"/>`+TXC(hx,hy+4,'+','#333','12')}});
   s+=TL(200,196,ty?['P-type: holes are the majority carriers','P-टाइप: होल मेजॉरिटी कैरियर','P-ടൈപ്പ്: ഹോൾ മെജോറിറ്റി കാരിയർ']:['N-type: electrons are the majority carriers','N-टाइप: इलेक्ट्रॉन मेजॉरिटी कैरियर','N-ടൈപ്പ്: ഇലക്ട്രോൺ മെജോറിറ്റി കാരിയർ'],ty?'var(--no)':'var(--def)');
   put($('#a',w),s);
   setRd(rd,`<span>${ty?RD('Boron has 3 outer electrons: one bond is short, a hole forms.','बोरॉन के 3 बाहरी इलेक्ट्रॉन: एक बॉन्ड अधूरा, होल बनता है।','ബോറോണിന് 3 പുറം ഇലക്ട്രോൺ: ഒരു ബോണ്ട് കുറവ്, ഹോൾ ഉണ്ടാകുന്നു.'):RD('Phosphorus has 5 outer electrons: one is left over and free.','फॉस्फोरस के 5 बाहरी इलेक्ट्रॉन: एक बचता है, फ्री।','ഫോസ്ഫറസിന് 5 പുറം ഇലക്ട്രോൺ: ഒന്ന് ബാക്കി, ഫ്രീ.')}</span><span>${ty?RD('Holes','होल','ഹോൾ'):RD('Free electrons','फ्री इलेक्ट्रॉन','ഫ്രീ ഇലക്ട്രോൺ')}: <b>${n}</b></span>`)}}});

/* ---------- 6 PN junction ---------- */
const PNdots=(()=>{const a=[];for(let i=0;i<8;i++)for(let j=0;j<4;j++)a.push([i,j]);return a})();
CS({id:'e_pn',menu:'PN junction',title:'t_pn',
 flash:FB('Doping (slide 5); voltage is a push (Module 0, slide 8)','डोपिंग (स्लाइड 5); वोल्टेज एक धक्का है (मॉड्यूल 0, स्लाइड 8)','ഡോപ്പിംഗ് (സ്ലൈഡ് 5); വോൾട്ടേജ് ഒരു തള്ളൽ (മൊഡ്യൂൾ 0, സ്ലൈഡ് 8)'),
 hook:L('A diode is just one crystal: P-type on one side, N-type on the other.','डायोड बस एक क्रिस्टल है: एक तरफ़ P-टाइप, दूसरी तरफ़ N-टाइप।','ഡയോഡ് ഒരു ക്രിസ്റ്റൽ മാത്രം: ഒരു വശത്ത് P-ടൈപ്പ്, മറുവശത്ത് N-ടൈപ്പ്.'),
 defn:L('<b>PN junction:</b> near the joint, electrons from N fill holes in P. A thin <b>depletion layer</b> with no free carriers forms. Its fixed charges set a <b>barrier potential</b>: about 0.7 V for Si and 0.3 V for Ge (at 25 °C).','<b>PN जंक्शन:</b> जोड़ के पास N के इलेक्ट्रॉन P के होल भरते हैं। एक पतली <b>डिप्लीशन लेयर</b> बनती है, जिसमें फ्री कैरियर नहीं। इसके फिक्स्ड चार्ज <b>बैरियर पोटेंशियल</b> बनाते हैं: Si में करीब 0.7 V, Ge में 0.3 V (25 °C पर)।','<b>PN ജംഗ്ഷൻ:</b> ജോയിന്റിന് അടുത്ത് N-ലെ ഇലക്ട്രോൺ P-ലെ ഹോൾ നിറയ്ക്കുന്നു. ഫ്രീ കാരിയർ ഇല്ലാത്ത നേർത്ത <b>ഡിപ്ലീഷൻ ലെയർ</b> ഉണ്ടാകുന്നു. അതിലെ ഫിക്സഡ് ചാർജ് <b>ബാരിയർ പൊട്ടൻഷ്യൽ</b> ഉണ്ടാക്കുന്നു: Si-ൽ ഏകദേശം 0.7 V, Ge-ൽ 0.3 V (25 °C-ൽ).'),
 play:L('Press Join. Watch carriers meet and vanish at the joint. Tap Si or Ge.','Join दबाओ। जोड़ पर कैरियर मिलते और गायब होते देखो। Si या Ge दबाओ।','Join അമർത്തൂ. ജോയിന്റിൽ കാരിയർ കണ്ടുമുട്ടി ഇല്ലാതാകുന്നത് നോക്കൂ. Si അല്ലെങ്കിൽ Ge ടാപ്പ് ചെയ്യൂ.'),
 pred:{q:L('P and N are joined. Right at the joint, the free carriers …','P और N जोड़े। ठीक जोड़ पर फ्री कैरियर …','P-യും N-ഉം ചേർത്തു. ജോയിന്റിൽ തന്നെ ഫ്രീ കാരിയർ …'),o:[L('meet and cancel, leaving an empty layer','मिलकर कैंसल, खाली लेयर बचती है','കണ്ടുമുട്ടി റദ്ദാകുന്നു, ഒഴിഞ്ഞ ലെയർ ബാക്കി'),L('pile up','ढेर बन जाते हैं','കുന്നുകൂടുന്നു'),L('keep flowing for ever','हमेशा बहते रहते हैं','എപ്പോഴും ഒഴുകുന്നു')],a:0,why:L('Electrons fall into holes. The joint is left with fixed ions only: the depletion layer.','इलेक्ट्रॉन होल में गिरते हैं। जोड़ पर सिर्फ़ फिक्स्ड आयन बचते हैं: डिप्लीशन लेयर।','ഇലക്ട്രോൺ ഹോളിൽ വീഴുന്നു. ജോയിന്റിൽ ഫിക്സഡ് അയോൺ മാത്രം: ഡിപ്ലീഷൻ ലെയർ.')},
 labels:['dep','barr'],hints:['semi'],rel:{c:['Q','V'],h:'V'},
 ex:L('Example: a silicon diode needs about 0.7 V before it conducts. A germanium diode needs about 0.3 V.','उदाहरण: सिलिकॉन डायोड को कंडक्ट करने से पहले करीब 0.7 V चाहिए। जर्मेनियम को करीब 0.3 V।','ഉദാഹരണം: സിലിക്കൺ ഡയോഡ് കണ്ടക്ട് ചെയ്യാൻ ഏകദേശം 0.7 V വേണം. ജെർമേനിയം ഏകദേശം 0.3 V.'),
 trick:L('Join P and N: a small wall appears.','P और N जोड़ो: एक छोटी दीवार बनती है।','P-യും N-ഉം ചേർക്കൂ: ഒരു ചെറിയ മതിൽ ഉണ്ടാകുന്നു.'),
 check:{q:L('Three silicon diodes in series conduct. The total drop across them is about (KVL, Module 2) …','तीन सिलिकॉन डायोड सीरीज़ में चालू। उन पर कुल ड्रॉप करीब (KVL, मॉड्यूल 2) …','മൂന്ന് സിലിക്കൺ ഡയോഡ് സീരീസിൽ കണ്ടക്ട് ചെയ്യുന്നു. ആകെ ഡ്രോപ്പ് ഏകദേശം (KVL, മൊഡ്യൂൾ 2) …'),o:['2.1 V','0.7 V','0.9 V'],a:0},
 build(w,api){
  w.innerHTML=S(400,200,`<g id="a"></g>`,'P and N blocks joining, with the depletion layer forming');
  const rd=mkRd(w),c=mkCtl(w);let t0=-1,ge=0;
  button(c,L('Join','जोड़ो','ചേർക്കൂ'),()=>{t0=-1;api.redraw()},'on');
  modeBtns(c,['Si','Ge'],i=>{ge=i;api.redraw()});
  return t=>{if(t0<0)t0=t;const k=Math.min(1,(t-t0)/2.5),wd=(ge?30:36)*k;
   let s=`<rect x="30" y="30" width="170" height="110" fill="rgba(217,54,43,.12)" stroke="var(--no)" stroke-width="2"/><rect x="200" y="30" width="170" height="110" fill="rgba(42,111,219,.12)" stroke="var(--def)" stroke-width="2"/>`;
   s+=`<rect x="${200-wd}" y="30" width="${2*wd}" height="110" fill="rgba(140,140,140,.25)"/>`;
   PNdots.forEach(([i,j])=>{const px=44+i*20,py=48+j*26,nx=356-i*20;
    if(200-px>wd)s+=`<circle cx="${px}" cy="${py}" r="7" fill="#fff" stroke="#333" stroke-width="1.8"/>`+TXC(px,py+4,'+','#333','11');
    else s+=`<rect x="${px-6}" y="${py-6}" width="12" height="12" fill="none" stroke="var(--no)" stroke-width="1.5"/>`+TXC(px,py+4,'−','var(--no)','12');
    if(nx-200>wd)s+=`<circle cx="${nx}" cy="${py}" r="6" fill="#2a6fdb"/>`;
    else s+=`<rect x="${nx-6}" y="${py-6}" width="12" height="12" fill="none" stroke="var(--def)" stroke-width="1.5"/>`+TXC(nx,py+4,'+','var(--def)','12')});
   s+=TXC(60,24,'P','var(--no)','16')+TXC(340,24,'N','var(--def)','16');
   const vb=ge?.3:.7,hy=170,hh=24*k*(ge?.55:1);
   s+=`<path d="M30 ${hy+12}H${200-wd}C200 ${hy+12} 200 ${hy+12-hh} ${200+wd} ${hy+12-hh}H370" stroke="var(--frm)" stroke-width="3" fill="none"/>`+TXC(286,hy-hh-2,(ge?'Ge':'Si')+' ≈ '+(k>.98?vb:fm1(vb*k))+' V','var(--frm)','15');
   put($('#a',w),s);
   setRd(rd,`<span>${RD('Depletion layer','डिप्लीशन लेयर','ഡിപ്ലീഷൻ ലെയർ')}: ${k<1?RD('forming','बन रही है','ഉണ്ടാകുന്നു'):RD('formed','बन गई','ഉണ്ടായി')} · ${RD('Barrier','बैरियर','ബാരിയർ')} ≈ <b>${vb} V</b></span>`)}}});

/* ---------- 7 Bias ---------- */
CS({id:'e_bias',menu:'Forward and reverse bias',title:'t_bias',
 flash:FB('Current direction (Module 0, slide 7); PN junction (slide 6)','करंट की दिशा (मॉड्यूल 0, स्लाइड 7); PN जंक्शन (स्लाइड 6)','കറന്റ് ദിശ (മൊഡ്യൂൾ 0, സ്ലൈഡ് 7); PN ജംഗ്ഷൻ (സ്ലൈഡ് 6)'),
 hook:L('A car charger has a diode so the battery cannot push current back into the charger.','कार चार्जर में डायोड होता है, ताकि बैटरी चार्जर में करंट वापस न धकेले।','കാർ ചാർജറിൽ ഡയോഡ് ഉണ്ട്, ബാറ്ററി ചാർജറിലേക്ക് കറന്റ് തിരിച്ച് തള്ളാതിരിക്കാൻ.'),
 defn:L('<b>Forward bias:</b> + to P (anode), − to N (cathode). The layer narrows and current flows above about 0.7 V. <b>Reverse bias:</b> + to N. The layer widens and only a tiny leakage current flows.','<b>फॉरवर्ड बायस:</b> + को P (एनोड), − को N (कैथोड)। लेयर पतली, करीब 0.7 V के ऊपर करंट बहता है। <b>रिवर्स बायस:</b> + को N। लेयर चौड़ी, सिर्फ़ बहुत छोटा लीकेज करंट।','<b>ഫോർവേഡ് ബയസ്:</b> + P-ലേക്ക് (ആനോഡ്), − N-ലേക്ക് (കാഥോഡ്). ലെയർ നേർത്തതാകുന്നു, ഏകദേശം 0.7 V-ന് മുകളിൽ കറന്റ് ഒഴുകുന്നു. <b>റിവേഴ്സ് ബയസ്:</b> + N-ലേക്ക്. ലെയർ വീതി കൂടുന്നു, വളരെ ചെറിയ ലീക്കേജ് കറന്റ് മാത്രം.'),
 play:L('Tap Forward or Reverse. Drag V. Watch the grey layer and the dots.','Forward या Reverse दबाओ। V खिसकाओ। स्लेटी लेयर और डॉट देखो।','Forward അല്ലെങ്കിൽ Reverse ടാപ്പ് ചെയ്യൂ. V നീക്കൂ. ചാര ലെയറും ഡോട്ടും നോക്കൂ.'),
 pred:{q:L('Battery + goes to P and − goes to N. The current …','बैटरी का + P को, − N को। करंट …','ബാറ്ററി + P-ലേക്ക്, − N-ലേക്ക്. കറന്റ് …'),o:[L('flows','बहता है','ഒഴുകുന്നു'),L('stops','रुकता है','നിൽക്കുന്നു'),L('reverses','उल्टा बहता है','തിരിയുന്നു')],a:0,why:L('+ pushes holes and − pushes electrons toward the joint. The layer narrows and current flows.','+ होल को और − इलेक्ट्रॉन को जोड़ की ओर धकेलता है। लेयर पतली होती है, करंट बहता है।','+ ഹോളിനെയും − ഇലക്ട്രോണിനെയും ജോയിന്റിലേക്ക് തള്ളുന്നു. ലെയർ നേർത്തതാകുന്നു, കറന്റ് ഒഴുകുന്നു.')},
 labels:['fb','rb','anode','cathode'],hints:['cur','vir'],rel:{c:['V','I','R'],h:'I'},
 ex:L('Example: a 3 V cell lights an LED one way round. Turn the LED round and it stays dark.','उदाहरण: 3 V सेल एक तरफ़ से LED जलाता है। LED उलटो तो बंद रहती है।','ഉദാഹരണം: 3 V സെൽ ഒരു വശത്ത് LED കത്തിക്കുന്നു. LED തിരിച്ചാൽ കത്തില്ല.'),
 trick:L('The arrow in the symbol shows the way current can flow.','सिम्बल का तीर बताता है करंट किधर बह सकता है।','സിംബലിലെ അമ്പ് കറന്റ് ഒഴുകാവുന്ന ദിശ കാണിക്കുന്നു.'),
 check:{q:L('In reverse bias the depletion layer …','रिवर्स बायस में डिप्लीशन लेयर …','റിവേഴ്സ് ബയസിൽ ഡിപ്ലീഷൻ ലെയർ …'),o:[L('widens','चौड़ी होती है','വീതി കൂടുന്നു'),L('narrows','पतली होती है','നേർത്തതാകുന്നു'),L('disappears','गायब होती है','ഇല്ലാതാകുന്നു')],a:0},
 build(w,api){
  w.innerHTML=S(400,215,`<g id="a"></g>`,'Battery, resistor and PN junction in forward or reverse bias');
  const rd=mkRd(w),c=mkCtl(w);let rv=0,V=1.5;
  modeBtns(c,[L('Forward','फॉरवर्ड','ഫോർവേഡ്'),L('Reverse','रिवर्स','റിവേഴ്സ്')],i=>{rv=i;api.redraw()});
  slider(c,'V',0,30,1,15,x=>(x/10)+' V',x=>{V=x/10;api.redraw()});
  return t=>{const on=!rv&&V>.7,I=on?(V-.7)/100:0,wd=rv?16+V*5:16*Math.max(.15,1-V/.7);
   let s=`<rect x="120" y="40" width="80" height="60" fill="rgba(217,54,43,.15)" stroke="var(--no)" stroke-width="2"/><rect x="200" y="40" width="80" height="60" fill="rgba(42,111,219,.15)" stroke="var(--def)" stroke-width="2"/><rect x="${200-wd}" y="40" width="${2*wd}" height="60" fill="rgba(140,140,140,.35)"/>`;
   s+=TXC(150,76,'P','var(--no)','17')+TXC(250,76,'N','var(--def)','17');
   s+=wr('M120 70H50V180H160M240 180H350V140M350 80V70H280')+symCell(200,180,rv?180:0)+symRes(350,110,90);
   s+=TXC(184,168,rv?'−':'+','var(--no)','16')+TXC(216,168,rv?'+':'−','var(--def)','16')+TXC(374,114,'100 Ω','var(--fg)','14');
   if(on)s+=flowDots([[160,180],[50,180],[50,70],[350,70],[350,180],[240,180]],t,8,'#2a6fdb',20+300*I);
   s+=TL(200,208,rv?['Reverse bias: layer wide, no current','रिवर्स बायस: लेयर चौड़ी, करंट नहीं','റിവേഴ്സ് ബയസ്: ലെയർ വീതി, കറന്റ് ഇല്ല']:on?['Forward bias above 0.7 V: current flows','0.7 V से ऊपर फॉरवर्ड बायस: करंट बहता है','0.7 V-ന് മുകളിൽ ഫോർവേഡ് ബയസ്: കറന്റ് ഒഴുകുന്നു']:['Forward bias below 0.7 V: almost no current','0.7 V से नीचे फॉरवर्ड: लगभग करंट नहीं','0.7 V-ന് താഴെ ഫോർവേഡ്: ഏതാണ്ട് കറന്റ് ഇല്ല'],on?'var(--ok)':'var(--mut)');
   put($('#a',w),s);
   setRd(rd,`<span>${rv?RD('Reverse','रिवर्स','റിവേഴ്സ്'):RD('Forward','फॉरवर्ड','ഫോർവേഡ്')} · V = ${fm1(V)} V</span><span>I ${on?'= ('+fm1(V)+' − 0.7) ÷ 100 = <b>'+fm1(I*1000)+' mA</b>':'≈ <b>0</b> ('+RD('µA leakage only','सिर्फ़ µA लीकेज','µA ലീക്കേജ് മാത്രം')+')'}</span>`)}}});

const VIV=[-30,-27,-26,-25.5,-25,-20,-10,-1,0,.2,.4,.5,.6,.65,.7,.75,.8];
CS({id:'e_vi',menu:'Diode V-I characteristic',title:'t_vi',
 flash:FB('Ohm’s law (Module 2, slide 4); KVL (Module 2, slide 9)','ओम का नियम (मॉड्यूल 2, स्लाइड 4); KVL (मॉड्यूल 2, स्लाइड 9)','ഓം നിയമം (മൊഡ്യൂൾ 2, സ്ലൈഡ് 4); KVL (മൊഡ്യൂൾ 2, സ്ലൈഡ് 9)'),
 hook:L('A resistor gives a straight-line graph. A diode does not. Its graph tells you when it switches on.','रेसिस्टर का ग्राफ़ सीधी लाइन। डायोड का नहीं। उसका ग्राफ़ बताता है वह कब चालू होता है।','റെസിസ്റ്ററിന്റെ ഗ്രാഫ് നേർരേഖ. ഡയോഡിന്റേത് അല്ല. അത് എപ്പോൾ ഓൺ ആകുന്നു എന്ന് ഗ്രാഫ് പറയുന്നു.'),
 defn:L('<b>V-I curve:</b> forward current is almost zero below the <b>knee voltage</b> (0.7 V Si, 0.3 V Ge), then rises steeply. In reverse only µA flows until <b>breakdown</b>, where the current rises suddenly.','<b>V-I कर्व:</b> <b>नी वोल्टेज</b> (Si 0.7 V, Ge 0.3 V) से नीचे फॉरवर्ड करंट लगभग ज़ीरो, फिर तेज़ी से बढ़ता है। रिवर्स में <b>ब्रेकडाउन</b> तक सिर्फ़ µA, फिर करंट अचानक बढ़ता है।','<b>V-I കർവ്:</b> <b>നീ വോൾട്ടേജിന്</b> (Si 0.7 V, Ge 0.3 V) താഴെ ഫോർവേഡ് കറന്റ് ഏതാണ്ട് പൂജ്യം, പിന്നെ കുത്തനെ കൂടുന്നു. റിവേഴ്സിൽ <b>ബ്രേക്ക്ഡൗൺ</b> വരെ µA മാത്രം, പിന്നെ കറന്റ് പെട്ടെന്ന് കൂടുന്നു.'),
 play:L('Drag V from reverse to forward. The dot walks along the curve.','V को रिवर्स से फॉरवर्ड तक खिसकाओ। डॉट कर्व पर चलता है।','V റിവേഴ്സിൽ നിന്ന് ഫോർവേഡിലേക്ക് നീക്കൂ. ഡോട്ട് കർവിലൂടെ നടക്കുന്നു.'),
 pred:{q:L('A silicon diode. Forward voltage rises from 0 to 0.3 V. The current …','सिलिकॉन डायोड। फॉरवर्ड वोल्टेज 0 से 0.3 V। करंट …','സിലിക്കൺ ഡയോഡ്. ഫോർവേഡ് വോൾട്ടേജ് 0-ൽ നിന്ന് 0.3 V. കറന്റ് …'),o:[L('stays almost zero','लगभग ज़ीरो रहता है','ഏതാണ്ട് പൂജ്യം'),L('rises a lot','बहुत बढ़ता है','വളരെ കൂടുന്നു'),L('reverses','उल्टा होता है','തിരിയുന്നു')],a:0,why:L('0.3 V is below the 0.7 V barrier of silicon, so almost no current flows yet.','0.3 V सिलिकॉन के 0.7 V बैरियर से कम, अभी लगभग करंट नहीं।','0.3 V സിലിക്കണിന്റെ 0.7 V ബാരിയറിന് താഴെ, ഇപ്പോൾ ഏതാണ്ട് കറന്റ് ഇല്ല.')},
 labels:['knee','bd'],hints:['vir','kvl'],rel:{c:['V','I','R'],h:'I'},
 fm:['<i>I</i> = (<i>V</i><sub>s</sub> − 0.7) ÷ <i>R</i>'],
 uses:L('Silicon diode forward biased with a series resistor R, Vs above 0.7 V. Uses I = V ÷ R and KVL (Module 2, slides 4 and 9).','सिलिकॉन डायोड फॉरवर्ड, सीरीज़ रेसिस्टर R के साथ, Vs 0.7 V से ज़्यादा। I = V ÷ R और KVL (मॉड्यूल 2, स्लाइड 4 और 9)।','സിലിക്കൺ ഡയോഡ് ഫോർവേഡ്, സീരീസ് റെസിസ്റ്റർ R-നൊപ്പം, Vs 0.7 V-ന് മുകളിൽ. I = V ÷ R, KVL (മൊഡ്യൂൾ 2, സ്ലൈഡ് 4, 9).'),
 ex:L('Example: 5 V supply, 1 kΩ, silicon diode: I = (5 − 0.7) ÷ 1000 = 4.3 mA.','उदाहरण: 5 V सप्लाई, 1 kΩ, सिलिकॉन डायोड: I = (5 − 0.7) ÷ 1000 = 4.3 mA।','ഉദാഹരണം: 5 V സപ്ലൈ, 1 kΩ, സിലിക്കൺ ഡയോഡ്: I = (5 − 0.7) ÷ 1000 = 4.3 mA.'),
 note:L('The two halves of the graph use different scales: volts and mA forward, tens of volts and µA reverse. Breakdown here is an example value; real rectifier diodes break down at hundreds of volts.','ग्राफ़ के दोनों हिस्सों का स्केल अलग: फॉरवर्ड में वोल्ट और mA, रिवर्स में दसियों वोल्ट और µA। यहाँ ब्रेकडाउन उदाहरण वैल्यू है; असली रेक्टिफायर डायोड सैकड़ों वोल्ट पर टूटते हैं।','ഗ്രാഫിന്റെ രണ്ട് ഭാഗത്തിനും സ്കെയിൽ വേറെ: ഫോർവേഡിൽ വോൾട്ടും mA-യും, റിവേഴ്സിൽ പതിനായിരക്കണക്കിന് വോൾട്ടും µA-യും. ഇവിടെ ബ്രേക്ക്ഡൗൺ ഉദാഹരണ വില; യഥാർത്ഥ റെക്ടിഫയർ ഡയോഡ് നൂറുകണക്കിന് വോൾട്ടിൽ ബ്രേക്ക്ഡൗൺ ആകും.'),
 trick:L('Below the knee: nothing. Above the knee: plenty.','नी से नीचे: कुछ नहीं। नी से ऊपर: खूब।','നീയുടെ താഴെ: ഒന്നുമില്ല. നീയുടെ മുകളിൽ: ധാരാളം.'),
 check:{q:L('9 V supply, 2.2 kΩ in series, silicon diode forward. The current is about …','9 V सप्लाई, 2.2 kΩ सीरीज़ में, सिलिकॉन डायोड फॉरवर्ड। करंट करीब …','9 V സപ്ലൈ, 2.2 kΩ സീരീസിൽ, സിലിക്കൺ ഡയോഡ് ഫോർവേഡ്. കറന്റ് ഏകദേശം …'),o:['3.8 mA','4.1 mA','0.38 mA'],a:0},
 build(w,api){
  w.innerHTML=S(400,215,`<g id="a"></g>`,'Diode V-I graph with forward knee and reverse breakdown');
  const rd=mkRd(w),c=mkCtl(w);let vi=12,ge=0;
  slider(c,'V',0,VIV.length-1,1,12,x=>VIV[x]+' V',x=>{vi=x;api.redraw()});
  modeBtns(c,['Si','Ge'],i=>{ge=i;api.redraw()});
  const ox=230,oy=120,If=v=>{const vv=v+(ge?.4:0);return Math.min(50,5*Math.exp((vv-.7)/.05))},
   fx=v=>v>=0?ox+v/1*150:ox+v/30*200,fy=(v)=>{if(v>=0)return oy-If(v)/50*105;if(v>-25)return oy+3;return Math.min(205,oy+3+(-25-v)*16)};
  return t=>{let s=`<path d="M20 ${oy}H390M${ox} 10V210" stroke="var(--mut)" stroke-width="1.5"/>`;
   let d='';for(let k=0;k<=80;k++){const v=-30+k*30/80;d+=(k?'L':'M')+fx(v).toFixed(1)+' '+fy(v).toFixed(1)}
   let d2='';for(let k=0;k<=80;k++){const v=k/80;d2+=(k?'L':'M')+fx(v).toFixed(1)+' '+fy(v).toFixed(1)}
   s+=`<path d="${d}" stroke="var(--no)" stroke-width="3" fill="none"/><path d="${d2}" stroke="var(--def)" stroke-width="3" fill="none"/>`;
   const kn=ge?.3:.7;s+=`<path d="M${fx(kn)} ${oy}V${oy+10}" stroke="var(--frm)" stroke-width="2"/>`+TXC(fx(kn),oy+26,kn+' V','var(--frm)','14')+TXC(fx(-25),oy-12,'−25 V','var(--no)','14');
   s+=TL(320,24,['Forward (mA)','फॉरवर्ड (mA)','ഫോർവേഡ് (mA)'],'var(--def)')+TL(110,24,['Reverse (µA)','रिवर्स (µA)','റിവേഴ്സ് (µA)'],'var(--no)')+TL(90,196,['breakdown','ब्रेकडाउन','ബ്രേക്ക്ഡൗൺ'],'var(--no)');
   const v=VIV[vi];s+=`<circle cx="${fx(v).toFixed(1)}" cy="${fy(v).toFixed(1)}" r="8" fill="var(--frm)" stroke="#fff" stroke-width="2"/>`;
   put($('#a',w),s);
   const txt=v>=0?(If(v)<.5?RD('almost zero (below the knee)','लगभग ज़ीरो (नी से नीचे)','ഏതാണ്ട് പൂജ്യം (നീയുടെ താഴെ)'):'≈ '+fm1(If(v))+' mA'):v>-25?RD('a few µA (leakage)','कुछ µA (लीकेज)','കുറച്ച് µA (ലീക്കേജ്)'):RD('large: breakdown, limited only by the circuit','ज़्यादा: ब्रेकडाउन, सिर्फ़ सर्किट रोकता है','വലുത്: ബ്രേക്ക്ഡൗൺ, സർക്യൂട്ട് മാത്രം നിയന്ത്രിക്കുന്നു');
   setRd(rd,`<span>${ge?'Ge':'Si'} · V = <b>${v} V</b> → I ${txt}</span>`)}}});

CS({id:'e_test',menu:'Identify and test a diode',title:'t_test',
 flash:FB('Forward and reverse bias (slide 7)','फॉरवर्ड और रिवर्स बायस (स्लाइड 7)','ഫോർവേഡ്, റിവേഴ്സ് ബയസ് (സ്ലൈഡ് 7)'),
 hook:L('A battery charger is dead. The bench has a multimeter and a suspect diode.','बैटरी चार्जर बंद है। बेंच पर मल्टीमीटर और एक शक वाला डायोड है।','ബാറ്ററി ചാർജർ പ്രവർത്തിക്കുന്നില്ല. ബെഞ്ചിൽ മൾട്ടിമീറ്ററും സംശയമുള്ള ഡയോഡും.'),
 defn:L('<b>Identify:</b> the band end is the cathode (K). <b>Test</b> on the diode range: red probe on the anode, black on the cathode reads about 0.5–0.7 V (Si). Reversed it reads OL. A good diode conducts one way only.','<b>पहचान:</b> बैंड वाला सिरा कैथोड (K)। डायोड रेंज पर <b>टेस्ट</b>: लाल प्रोब एनोड पर, काला कैथोड पर: करीब 0.5–0.7 V (Si)। उलटा करो तो OL। अच्छा डायोड एक ही तरफ़ चलता है।','<b>തിരിച്ചറിയൽ:</b> ബാൻഡ് ഉള്ള അറ്റം കാഥോഡ് (K). ഡയോഡ് റേഞ്ചിൽ <b>ടെസ്റ്റ്</b>: ചുവന്ന പ്രോബ് ആനോഡിൽ, കറുപ്പ് കാഥോഡിൽ: ഏകദേശം 0.5–0.7 V (Si). തിരിച്ചാൽ OL. നല്ല ഡയോഡ് ഒരു ദിശയിൽ മാത്രം.'),
 play:L('Tap each test. Watch the probes and the display.','हर टेस्ट दबाओ। प्रोब और डिस्प्ले देखो।','ഓരോ ടെസ്റ്റും ടാപ്പ് ചെയ്യൂ. പ്രോബും ഡിസ്പ്ലേയും നോക്കൂ.'),
 pred:{q:L('The silver band on a diode marks the …','डायोड पर सिल्वर बैंड बताता है …','ഡയോഡിലെ സിൽവർ ബാൻഡ് കാണിക്കുന്നത് …'),o:[L('cathode','कैथोड','കാഥോഡ്'),L('anode','एनोड','ആനോഡ്'),L('current rating','करंट रेटिंग','കറന്റ് റേറ്റിംഗ്')],a:0,why:L('The band matches the bar in the symbol: the cathode.','बैंड सिम्बल की लाइन जैसा: कैथोड।','ബാൻഡ് സിംബലിലെ വരയ്ക്ക് തുല്യം: കാഥോഡ്.')},
 labels:['anode','cathode'],hints:['cur'],rel:{c:['V','I'],h:'V'},
 ex:L('Example: 1N4007 reads 0.56 V forward and OL reverse: good. 0.00 V both ways: shorted. OL both ways: open.','उदाहरण: 1N4007 फॉरवर्ड 0.56 V, रिवर्स OL: ठीक। दोनों तरफ़ 0.00 V: शॉर्ट। दोनों तरफ़ OL: ओपन।','ഉദാഹരണം: 1N4007 ഫോർവേഡ് 0.56 V, റിവേഴ്സ് OL: നല്ലത്. രണ്ട് വശത്തും 0.00 V: ഷോർട്ട്. രണ്ട് വശത്തും OL: ഓപ്പൺ.'),
 trick:L('A good diode talks one way only.','अच्छा डायोड एक ही तरफ़ बोलता है।','നല്ല ഡയോഡ് ഒരു വശത്ത് മാത്രം സംസാരിക്കും.'),
 check:{q:L('A diode reads OL in both directions. It is …','डायोड दोनों तरफ़ OL पढ़ता है। यह …','ഡയോഡ് രണ്ട് ദിശയിലും OL. ഇത് …'),o:[L('open','ओपन','ഓപ്പൺ'),L('shorted','शॉर्ट','ഷോർട്ട്'),L('good','ठीक','നല്ലത്')],a:0},
 build(w,api){
  w.innerHTML=S(400,200,`<g id="a"></g>`,'Multimeter on diode range testing a diode');
  const rd=mkRd(w),c=mkCtl(w);let m=0;
  modeBtns(c,[L('Red on anode','लाल एनोड पर','ചുവപ്പ് ആനോഡിൽ'),L('Red on cathode','लाल कैथोड पर','ചുവപ്പ് കാഥോഡിൽ'),L('Shorted diode','शॉर्ट डायोड','ഷോർട്ട് ഡയോഡ്'),L('Open diode','ओपन डायोड','ഓപ്പൺ ഡയോഡ്')],i=>{m=i;api.redraw()});

   s+=`<circle cx="80" cy="120" r="26" fill="#333"/><path d="M80 120L80 98" stroke="#fff" stroke-width="3"/>`+symD(80,160,0,'#222').replace(/-40 0H-12M12 0H40/,'-20 0H-12M12 0H20');
   s+=`<rect x="230" y="88" width="100" height="26" rx="13" fill="#222"/><rect x="304" y="88" width="10" height="26" fill="#ccc"/><path d="M180 101H230M330 101H380" stroke="#aaa" stroke-width="4"/>`;
   s+=TXC(205,82,'A','var(--fg)','15')+TXC(355,82,'K','var(--fg)','15');
   const rx=rev?380:180,bx=rev?180:380;s+=`<path d="M60 190C80 220 ${rx-60} 200 ${rx} 104" stroke="#d22" stroke-width="4" fill="none"/><path d="M100 190C130 210 ${bx-40} 200 ${bx} 104" stroke="#222" stroke-width="4" fill="none"/>`;
   s+=`<circle cx="${rx}" cy="104" r="6" fill="#d22"/><circle cx="${bx}" cy="104" r="6" fill="#222"/>`;

   put($('#a',w),s);
   const v=[RD('Forward: good diode conducts.','फॉरवर्ड: अच्छा डायोड चालू।','ഫോർവേഡ്: നല്ല ഡയോഡ് കണ്ടക്ട് ചെയ്യുന്നു.'),RD('Reverse: good diode blocks.','रिवर्स: अच्छा डायोड रोकता है।','റിവേഴ്സ്: നല്ല ഡയോഡ് തടയുന്നു.'),RD('0.00 V both ways: shorted. Replace.','दोनों तरफ़ 0.00 V: शॉर्ट। बदलो।','രണ്ട് വശത്തും 0.00 V: ഷോർട്ട്. മാറ്റൂ.'),RD('OL both ways: open. Replace.','दोनों तरफ़ OL: ओपन। बदलो।','രണ്ട് വശത്തും OL: ഓപ്പൺ. മാറ്റൂ.')][m];

 defn:L('Same PN idea, different jobs: <b>rectifier</b> (AC to DC), <b>Zener</b> (holds a fixed voltage in reverse), <b>LED</b> (gives light in forward bias, about 1.8–3.3 V), <b>photodiode</b> (light raises its reverse current).','एक ही PN, अलग काम: <b>रेक्टिफायर</b> (AC से DC), <b>ज़ेनर</b> (रिवर्स में फिक्स्ड वोल्टेज रखे), <b>LED</b> (फॉरवर्ड में रोशनी, करीब 1.8–3.3 V), <b>फोटोडायोड</b> (रोशनी से रिवर्स करंट बढ़े)।','ഒരേ PN, വേറെ ജോലി: <b>റെക്ടിഫയർ</b> (AC-യിൽ നിന്ന് DC), <b>സെനർ</b> (റിവേഴ്സിൽ ഫിക്സഡ് വോൾട്ടേജ്), <b>LED</b> (ഫോർവേഡിൽ വെളിച്ചം, ഏകദേശം 1.8–3.3 V), <b>ഫോട്ടോഡയോഡ്</b> (വെളിച്ചം റിവേഴ്സ് കറന്റ് കൂട്ടുന്നു).'),
 play:L('Tap each diode. Watch what it does.','हर डायोड दबाओ। देखो वह क्या करता है।','ഓരോ ഡയോഡും ടാപ്പ് ചെയ്യൂ. അത് എന്ത് ചെയ്യുന്നു എന്ന് നോക്കൂ.'),
 pred:{q:L('Which diode gives out light?','कौन-सा डायोड रोशनी देता है?','ഏത് ഡയോഡ് വെളിച്ചം തരുന്നു?'),o:['LED',L('Zener','ज़ेनर','സെനർ'),L('Rectifier','रेक्टिफायर','റെക്ടിഫയർ')],a:0,why:L('LED: light-emitting diode. Electrons give out light as they cross the junction.','LED: लाइट-एमिटिंग डायोड। जंक्शन पार करते इलेक्ट्रॉन रोशनी देते हैं।','LED: ലൈറ്റ്-എമിറ്റിംഗ് ഡയോഡ്. ജംഗ്ഷൻ കടക്കുമ്പോൾ ഇലക്ട്രോൺ വെളിച്ചം തരുന്നു.')},
 labels:['led','zener'],hints:['vir','vd'],rel:{c:['V','I','R'],h:'R'},
 ex:L('Example: a red LED (2 V, 15 mA) on 5 V needs R = (5 − 2) ÷ 0.015 = 200 Ω in series.','उदाहरण: लाल LED (2 V, 15 mA) 5 V पर: R = (5 − 2) ÷ 0.015 = 200 Ω सीरीज़ में।','ഉദാഹരണം: ചുവന്ന LED (2 V, 15 mA) 5 V-ൽ: R = (5 − 2) ÷ 0.015 = 200 Ω സീരീസിൽ.'),
 trick:L('Rectify, regulate, radiate, receive.','रेक्टिफाई, रेगुलेट, रेडिएट, रिसीव।','റെക്ടിഫൈ, റെഗുലേറ്റ്, റേഡിയേറ്റ്, റിസീവ്.'),
 check:{q:L('A white LED (3 V, 20 mA) on a 12 V supply. Series R (Ohm’s law) = ?','सफ़ेद LED (3 V, 20 mA) 12 V सप्लाई पर। सीरीज़ R (ओम का नियम) = ?','വെള്ള LED (3 V, 20 mA) 12 V സപ്ലൈയിൽ. സീരീസ് R (ഓം നിയമം) = ?'),o:['450 Ω','600 Ω','150 Ω'],a:0},
 build(w,api){
  w.innerHTML=S(400,200,`<g id="a"></g>`,'Rectifier, Zener, LED and photodiode in action');
  const rd=mkRd(w),c=mkCtl(w);let m=0;
  modeBtns(c,[L('Rectifier','रेक्टिफायर','റെക്ടിഫയർ'),L('Zener','ज़ेनर','സെനർ'),'LED',L('Photodiode','फोटोडायोड','ഫോട്ടോഡയോഡ്')],i=>{m=i;api.redraw()});
  return t=>{let s='',txt='';const ph=(t*.4)%1;
   if(m===0){s+=`<path d="${wpath(20,100,110,40,u=>Math.sin(TPI*(2*u-ph)))}" stroke="var(--def)" stroke-width="3" fill="none"/>`+symD(200,100,0)+`<path d="${wpath(270,100,110,40,u=>Math.max(0,Math.sin(TPI*(2*u-ph))))}" stroke="var(--frm)" stroke-width="3" fill="none"/>`;txt=RD('Passes one half of AC: DC pulses.','AC का एक हिस्सा पास: DC पल्स।','AC-യുടെ ഒരു പകുതി കടത്തുന്നു: DC പൾസ്.')}
   if(m===1){const vin=10+2*Math.sin(t*2);s+=`<rect x="40" y="${150-vin*8}" width="40" height="${vin*8}" fill="var(--def)"/>`+TXC(60,170,fm1(vin)+' V','var(--fg)','15')+symZ(200,100,180)+`<rect x="320" y="${150-5.1*8}" width="40" height="${5.1*8}" fill="var(--ok)"/>`+TXC(340,170,'5.1 V','var(--fg)','15')+TL(60,190,['input','इनपुट','ഇൻപുട്ട്'],'var(--mut)')+TL(340,190,['output','आउटपुट','ഔട്ട്പുട്ട്'],'var(--mut)');txt=RD('Input swings, output stays at Vz = 5.1 V.','इनपुट ऊपर-नीचे, आउटपुट Vz = 5.1 V पर।','ഇൻപുട്ട് മാറുന്നു, ഔട്ട്പുട്ട് Vz = 5.1 V-ൽ.')}
   if(m===2){const on=Math.sin(t*3)>-.6;s+=symLED(200,110,0,on)+TXC(200,170,'Vf ≈ 2 V','var(--fg)','15');txt=RD('Forward biased: it glows. Needs a series resistor.','फॉरवर्ड बायस: जलती है। सीरीज़ रेसिस्टर चाहिए।','ഫോർവേഡ് ബയസ്: കത്തുന്നു. സീരീസ് റെസിസ്റ്റർ വേണം.')}
   if(m===3){const br=.5+.5*Math.sin(t*1.5);s+=`<circle cx="70" cy="60" r="${14+10*br}" fill="rgba(255,200,40,${(.3+.6*br).toFixed(2)})"/>`+symPD(200,110,0)+`<rect x="310" y="${160-br*100}" width="40" height="${br*100}" fill="var(--frm)"/>`+TXC(330,180,fm1(5+45*br)+' µA','var(--fg)','15');txt=RD('More light: more reverse current. Used in sensors.','ज़्यादा रोशनी: ज़्यादा रिवर्स करंट। सेंसर में।','കൂടുതൽ വെളിച്ചം: കൂടുതൽ റിവേഴ്സ് കറന്റ്. സെൻസറിൽ.')}
   put($('#a',w),s);setRd(rd,`<span>${txt}</span>`)}}});

/* ---------- 11 Zener regulator ---------- */
CS({id:'e_zen',menu:'Zener diode regulator',title:'t_zen',
 flash:FB('Breakdown on the V-I curve (slide 8); KCL (Module 2, slide 8)','V-I कर्व पर ब्रेकडाउन (स्लाइड 8); KCL (मॉड्यूल 2, स्लाइड 8)','V-I കർവിലെ ബ്രേക്ക്ഡൗൺ (സ്ലൈഡ് 8); KCL (മൊഡ്യൂൾ 2, സ്ലൈഡ് 8)'),
 hook:L('A control card needs a steady 6.2 V even when the supply goes up and down.','कंट्रोल कार्ड को स्थिर 6.2 V चाहिए, भले सप्लाई ऊपर-नीचे हो।','കൺട്രോൾ കാർഡിന് സപ്ലൈ മാറിയാലും സ്ഥിരമായ 6.2 V വേണം.'),
 defn:L('<b>Zener diode:</b> a diode made to work in reverse breakdown. Above its voltage Vz it conducts in reverse and holds Vz nearly constant. With a series resistor Rs it is a simple <b>voltage regulator</b>.','<b>ज़ेनर डायोड:</b> रिवर्स ब्रेकडाउन में काम करने को बना डायोड। Vz से ऊपर रिवर्स में चालू होकर Vz लगभग स्थिर रखता है। सीरीज़ रेसिस्टर Rs के साथ यह सिंपल <b>वोल्टेज रेगुलेटर</b> है।','<b>സെനർ ഡയോഡ്:</b> റിവേഴ്സ് ബ്രേക്ക്ഡൗണിൽ പ്രവർത്തിക്കാൻ നിർമ്മിച്ച ഡയോഡ്. Vz-ന് മുകളിൽ റിവേഴ്സിൽ കണ്ടക്ട് ചെയ്ത് Vz ഏതാണ്ട് സ്ഥിരമാക്കുന്നു. സീരീസ് റെസിസ്റ്റർ Rs-നൊപ്പം ലളിതമായ <b>വോൾട്ടേജ് റെഗുലേറ്റർ</b>.'),
 play:L('Drag Vin and RL. Watch Vout and the three currents.','Vin और RL खिसकाओ। Vout और तीनों करंट देखो।','Vin, RL നീക്കൂ. Vout-ഉം മൂന്ന് കറന്റും നോക്കൂ.'),
 pred:{q:L('The input rises from 12 V to 15 V. The Zener output …','इनपुट 12 V से 15 V। ज़ेनर आउटपुट …','ഇൻപുട്ട് 12 V-ൽ നിന്ന് 15 V. സെനർ ഔട്ട്പുട്ട് …'),o:[L('stays about the same','लगभग वही रहता है','ഏതാണ്ട് അതേ'),L('rises by 3 V','3 V बढ़ता है','3 V കൂടുന്നു'),L('falls to zero','ज़ीरो हो जाता है','പൂജ്യമാകുന്നു')],a:0,why:L('The extra 3 V drops across Rs. The Zener takes the extra current and holds Vz.','अतिरिक्त 3 V, Rs पर गिरता है। ज़ेनर ज़्यादा करंट लेकर Vz रखता है।','അധിക 3 V Rs-ൽ ഡ്രോപ്പ് ആകുന്നു. സെനർ അധിക കറന്റ് എടുത്ത് Vz നിലനിർത്തുന്നു.')},
 labels:['zener','rb','bd'],hints:['kcl','vir'],rel:{c:['V','I','R'],h:'I'},
 fm:['<i>I</i><sub>s</sub> = (<i>V</i><sub>in</sub> − <i>V</i><sub>z</sub>) ÷ <i>R</i><sub>s</sub>'],
 uses:L('Iz = Is − IL, with IL = Vz ÷ RL (KCL, Module 2, slide 8). The Zener must keep some current to regulate.','Iz = Is − IL, IL = Vz ÷ RL (KCL, मॉड्यूल 2, स्लाइड 8)। रेगुलेट करने को ज़ेनर में कुछ करंट रहना चाहिए।','Iz = Is − IL, IL = Vz ÷ RL (KCL, മൊഡ്യൂൾ 2, സ്ലൈഡ് 8). റെഗുലേറ്റ് ചെയ്യാൻ സെനറിൽ കുറച്ച് കറന്റ് വേണം.'),
 ex:L('Example: Vin 15 V, Vz 6.2 V, Rs 220 Ω: Is = 8.8 ÷ 220 = 40 mA.','उदाहरण: Vin 15 V, Vz 6.2 V, Rs 220 Ω: Is = 8.8 ÷ 220 = 40 mA।','ഉദാഹരണം: Vin 15 V, Vz 6.2 V, Rs 220 Ω: Is = 8.8 ÷ 220 = 40 mA.'),
 trick:L('Zener: reverse it, and it holds.','ज़ेनर: उल्टा लगाओ, वोल्टेज थामे।','സെനർ: തിരിച്ച് ഘടിപ്പിക്കൂ, വോൾട്ടേജ് പിടിച്ചുനിർത്തും.'),
 check:{q:L('Vin 18 V, Vz 12 V, Rs 300 Ω. The series current Is (Ohm’s law) = ?','Vin 18 V, Vz 12 V, Rs 300 Ω। सीरीज़ करंट Is (ओम का नियम) = ?','Vin 18 V, Vz 12 V, Rs 300 Ω. സീരീസ് കറന്റ് Is (ഓം നിയമം) = ?'),o:['20 mA','60 mA','40 mA'],a:0},
 build(w,api){
  w.innerHTML=S(400,210,`<g id="a"></g>`,'Zener regulator: input, series resistor, Zener and load');
  const rd=mkRd(w),c=mkCtl(w);let Vi=12,RLi=2;const RLS=[330,470,1000,2200];
  slider(c,'V<sub>in</sub>',8,20,1,12,x=>x+' V',x=>{Vi=x;api.redraw()});
  slider(c,'R<sub>L</sub>',0,3,1,2,x=>fmtR(RLS[x]),x=>{RLi=x;api.redraw()});
  return t=>{const Vz=6.2,Rs=220,RL=RLS[RLi];let Is=(Vi-Vz)/Rs,IL=Vz/RL,Iz=Is-IL,Vo=Vz;
   if(Iz<0){Vo=Vi*RL/(Rs+RL);Is=Vo/RL;IL=Is;Iz=0}
   let s=wr('M40 50H110M190 50H330V90M330 150V180H40M250 50V80M250 140V180')+symCell(40,115,90)+symRes(150,50,0)+symZ(250,110,270)+symRes(330,120,90);
   s+=`<circle cx="250" cy="50" r="4" fill="var(--wire)"/><circle cx="250" cy="180" r="4" fill="var(--wire)"/>`;
   s+=TXC(150,30,'Rs 220 Ω','var(--fg)','14')+TXC(372,124,'RL','var(--fg)','14')+TXC(286,114,'6.2 V','var(--frm)','14')+TXC(82,120,fm1(Vi)+' V','var(--def)','15');
   s+=flowDots([[40,50],[250,50]],t,6,'var(--def)',20+600*Is)+flowDots([[250,50],[250,180]],t,4,'var(--frm)',20+600*Iz)+flowDots([[250,50],[330,50],[330,180]],t,5,'var(--ok)',20+600*IL);
   s+=TXC(200,204,'Vout = '+fm1(Vo)+' V',Iz>0?'var(--ok)':'var(--no)','17');
   put($('#a',w),s);
   setRd(rd,`<span>Is = <b>${fm1(Is*1000)} mA</b> · IL = <b>${fm1(IL*1000)} mA</b> · Iz = <b>${fm1(Iz*1000)} mA</b></span><span>${Iz>0?RD('Regulating: Vout held at Vz.','रेगुलेट हो रहा: Vout = Vz।','റെഗുലേറ്റ് ചെയ്യുന്നു: Vout = Vz.'):RD('Input too low for this load: Zener off, Vout falls.','इस लोड के लिए इनपुट कम: ज़ेनर बंद, Vout गिरा।','ഈ ലോഡിന് ഇൻപുട്ട് കുറവ്: സെനർ ഓഫ്, Vout താഴുന്നു.')}</span>`)}}});

/* ---------- 12 Half-wave rectifier ---------- */
const VRMS=[6,9,12,15];
CS({id:'e_hw',menu:'Half-wave rectifier',title:'t_hw',
 flash:FB('Average of a half sine, 2Vm ÷ π (Module 0, slide 29); peak Vm (Module 0, slide 28)','आधी साइन का एवरेज, 2Vm ÷ π (मॉड्यूल 0, स्लाइड 29); पीक Vm (मॉड्यूल 0, स्लाइड 28)','പകുതി സൈനിന്റെ ആവറേജ്, 2Vm ÷ π (മൊഡ്യൂൾ 0, സ്ലൈഡ് 29); പീക്ക് Vm (മൊഡ്യൂൾ 0, സ്ലൈഡ് 28)'),
 hook:L('A cheap battery eliminator uses only one diode. Its output buzzes.','सस्ता बैटरी एलिमिनेटर एक ही डायोड से बना। उसका आउटपुट भिनभिनाता है।','വിലകുറഞ്ഞ ബാറ്ററി എലിമിനേറ്ററിൽ ഒരു ഡയോഡ് മാത്രം. അതിന്റെ ഔട്ട്പുട്ട് മൂളുന്നു.'),
 defn:L('<b>Half-wave rectifier:</b> one diode in series with the load. It conducts only in the positive half cycle. The output is pulsating DC: one pulse per cycle.','<b>हाफ-वेव रेक्टिफायर:</b> लोड के सीरीज़ में एक डायोड। सिर्फ़ पॉज़िटिव हाफ साइकिल में चालू। आउटपुट पल्सेटिंग DC: हर साइकिल में एक पल्स।','<b>ഹാഫ്-വേവ് റെക്ടിഫയർ:</b> ലോഡിന് സീരീസിൽ ഒരു ഡയോഡ്. പോസിറ്റീവ് ഹാഫ് സൈക്കിളിൽ മാത്രം കണ്ടക്ട്. ഔട്ട്പുട്ട് പൾസേറ്റിംഗ് DC: ഓരോ സൈക്കിളിലും ഒരു പൾസ്.'),
 play:L('Watch the moving cursor. Dots flow only on the + half. Drag Vrms.','चलता कर्सर देखो। डॉट सिर्फ़ + हाफ में बहते हैं। Vrms खिसकाओ।','നീങ്ങുന്ന കർസർ നോക്കൂ. + ഹാഫിൽ മാത്രം ഡോട്ട് ഒഴുകുന്നു. Vrms നീക്കൂ.'),
 pred:{q:L('One diode is in series with an AC supply and a lamp. The lamp gets …','AC सप्लाई और लैंप के सीरीज़ में एक डायोड। लैंप को मिलता है …','AC സപ്ലൈക്കും ലാമ്പിനും സീരീസിൽ ഒരു ഡയോഡ്. ലാമ്പിന് കിട്ടുന്നത് …'),o:[L('only the + half cycles','सिर्फ़ + हाफ साइकिल','+ ഹാഫ് സൈക്കിൾ മാത്രം'),L('both halves','दोनों हाफ','രണ്ട് ഹാഫും'),L('nothing','कुछ नहीं','ഒന്നുമില്ല')],a:0,why:L('The diode blocks the − half. The lamp gets pulses in one direction only.','डायोड − हाफ रोकता है। लैंप को एक ही दिशा में पल्स।','ഡയോഡ് − ഹാഫ് തടയുന്നു. ലാമ്പിന് ഒരു ദിശയിൽ മാത്രം പൾസ്.')},
 labels:['rect','piv'],hints:['rms','avg','pk'],rel:{c:['Vrms','Vm','Vdc'],h:'Vdc'},
 fm:['<i>V</i><sub>dc</sub> = <i>V</i><sub>m</sub> ÷ π'],
 uses:L('Vm = √2 × Vrms (Module 0, slide 30). Ideal diode, resistive load, no filter. Vdc = 0.318 Vm. Ripple frequency = supply frequency. PIV = Vm.','Vm = √2 × Vrms (मॉड्यूल 0, स्लाइड 30)। आइडियल डायोड, रेसिस्टिव लोड, फ़िल्टर नहीं। Vdc = 0.318 Vm। रिपल फ्रीक्वेंसी = सप्लाई फ्रीक्वेंसी। PIV = Vm।','Vm = √2 × Vrms (മൊഡ്യൂൾ 0, സ്ലൈഡ് 30). ഐഡിയൽ ഡയോഡ്, റെസിസ്റ്റീവ് ലോഡ്, ഫിൽട്ടർ ഇല്ല. Vdc = 0.318 Vm. റിപ്പിൾ ഫ്രീക്വൻസി = സപ്ലൈ ഫ്രീക്വൻസി. PIV = Vm.'),
 ex:L('Example: 12 V RMS gives Vm ≈ 17 V and Vdc ≈ 17 ÷ 3.14 ≈ 5.4 V.','उदाहरण: 12 V RMS से Vm ≈ 17 V और Vdc ≈ 17 ÷ 3.14 ≈ 5.4 V।','ഉദാഹരണം: 12 V RMS-ൽ Vm ≈ 17 V, Vdc ≈ 17 ÷ 3.14 ≈ 5.4 V.'),
 trick:L('Half wave: one diode, one pulse, divide by π.','हाफ वेव: एक डायोड, एक पल्स, π से भाग।','ഹാഫ് വേവ്: ഒരു ഡയോഡ്, ഒരു പൾസ്, π കൊണ്ട് ഹരിക്കൂ.'),
 check:{q:L('Vm = 30 V on a half-wave rectifier. Vdc is about …','हाफ-वेव पर Vm = 30 V। Vdc करीब …','ഹാഫ്-വേവിൽ Vm = 30 V. Vdc ഏകദേശം …'),o:['9.5 V','19.1 V','30 V'],a:0},

   s+=`<path d="M${20+370*u} 132V222" stroke="var(--no)" stroke-width="2" stroke-dasharray="4 3"/>`+TL(372,150,['in','इन','ഇൻ'],'var(--def)')+TL(372,200,['out','आउट','ഔട്ട്'],'var(--frm)');

const waves2=(s,A,u,outFn)=>s+`<path d="M20 165H390M20 210H390" stroke="var(--mut)" stroke-width="1"/><path d="${wpath(20,165,370,A,sinU(2))}" stroke="var(--def)" stroke-width="2.5" fill="none"/><path d="${wpath(20,210,370,A,outFn)}" stroke="var(--frm)" stroke-width="3" fill="none"/><path d="M${20+370*u} 132V222" stroke="var(--no)" stroke-width="2" stroke-dasharray="4 3"/>`+TL(372,150,['in','इन','ഇൻ'],'var(--def)')+TL(372,200,['out','आउट','ഔട്ട്'],'var(--frm)');

CS({id:'e_ct',menu:'Centre-tap full-wave rectifier',title:'t_ct',
 flash:FB('Half-wave rectifier (slide 12)','हाफ-वेव रेक्टिफायर (स्लाइड 12)','ഹാഫ്-വേവ് റെക്ടിഫയർ (സ്ലൈഡ് 12)'),

 ex:L('Example: 9-0-9 V transformer: Vm = 12.7 V, Vdc ≈ 0.637 × 12.7 ≈ 8.1 V, PIV ≈ 25.5 V.','उदाहरण: 9-0-9 V ट्रांसफॉर्मर: Vm = 12.7 V, Vdc ≈ 0.637 × 12.7 ≈ 8.1 V, PIV ≈ 25.5 V।','ഉദാഹരണം: 9-0-9 V ട്രാൻസ്ഫോർമർ: Vm = 12.7 V, Vdc ≈ 0.637 × 12.7 ≈ 8.1 V, PIV ≈ 25.5 V.'),
 trick:L('Centre tap: two diodes, two pulses, PIV doubles.','सेंटर टैप: दो डायोड, दो पल्स, PIV दोगुना।','സെന്റർ ടാപ്പ്: രണ്ട് ഡയോഡ്, രണ്ട് പൾസ്, PIV ഇരട്ടി.'),
 check:{q:L('Each half of the secondary has a 24 V peak. The PIV of each diode is …','सेकेंडरी के हर आधे का पीक 24 V। हर डायोड का PIV …','സെക്കൻഡറിയുടെ ഓരോ പകുതിയുടെയും പീക്ക് 24 V. ഓരോ ഡയോഡിന്റെയും PIV …'),o:['48 V','24 V','12 V'],a:0},

 play:L('Watch the lit pair of diodes change every half cycle. Drag Vrms.','हर हाफ साइकिल में जलती डायोड जोड़ी बदलते देखो। Vrms खिसकाओ।','ഓരോ ഹാഫ് സൈക്കിളിലും കത്തുന്ന ഡയോഡ് ജോഡി മാറുന്നത് നോക്കൂ. Vrms നീക്കൂ.'),

CS({id:'e_fil',menu:'Filter circuits',title:'t_fil',
 flash:FB('RC charging (Module 5A, slide 18); XC = 1 ÷ (2πfC) (Module 5B, slide 6)','RC चार्जिंग (मॉड्यूल 5A, स्लाइड 18); XC = 1 ÷ (2πfC) (मॉड्यूल 5B, स्लाइड 6)','RC ചാർജിംഗ് (മൊഡ്യൂൾ 5A, സ്ലൈഡ് 18); XC = 1 ÷ (2πfC) (മൊഡ്യൂൾ 5B, സ്ലൈഡ് 6)'),
 hook:L('Pulsating DC makes a relay chatter and a radio hum. A big capacitor smooths it.','पल्सेटिंग DC से रिले खड़खड़ाता और रेडियो गुनगुनाता है। बड़ा कैपेसिटर इसे स्मूथ करता है।','പൾസേറ്റിംഗ് DC റിലേ കിലുക്കുന്നു, റേഡിയോ മൂളുന്നു. വലിയ കപ്പാസിറ്റർ ഇത് സ്മൂത്ത് ആക്കുന്നു.'),
 defn:L('<b>Filter:</b> removes ripple. A <b>capacitor</b> across the load charges at each peak and feeds the load between peaks. An <b>inductor</b> in series opposes changes in current. LC and π (C-L-C) filters combine both for smoother DC.','<b>फ़िल्टर:</b> रिपल हटाता है। लोड के आर-पार <b>कैपेसिटर</b> हर पीक पर चार्ज होकर बीच में लोड को देता है। सीरीज़ में <b>इंडक्टर</b> करंट के बदलाव को रोकता है। LC और π (C-L-C) फ़िल्टर दोनों मिलाकर और स्मूथ DC देते हैं।','<b>ഫിൽട്ടർ:</b> റിപ്പിൾ നീക്കുന്നു. ലോഡിന് കുറുകെ <b>കപ്പാസിറ്റർ</b> ഓരോ പീക്കിലും ചാർജ് ആയി ഇടയിൽ ലോഡിന് നൽകുന്നു. സീരീസിൽ <b>ഇൻഡക്ടർ</b> കറന്റ് മാറ്റത്തെ തടയുന്നു. LC, π (C-L-C) ഫിൽട്ടർ രണ്ടും ചേർത്ത് കൂടുതൽ സ്മൂത്ത് DC.'),
 play:L('Drag C. Watch the ripple shrink. Tap a filter type to see its circuit.','C खिसकाओ। रिपल घटता देखो। फ़िल्टर टाइप दबाकर सर्किट देखो।','C നീക്കൂ. റിപ്പിൾ കുറയുന്നത് നോക്കൂ. ഫിൽട്ടർ ടൈപ്പ് ടാപ്പ് ചെയ്ത് സർക്യൂട്ട് കാണൂ.'),
 pred:{q:L('A bigger capacitor is put across the output. The ripple …','आउटपुट पर बड़ा कैपेसिटर लगाया। रिपल …','ഔട്ട്പുട്ടിൽ വലിയ കപ്പാസിറ്റർ ഘടിപ്പിച്ചു. റിപ്പിൾ …'),o:[L('falls','घटता है','കുറയുന്നു'),L('rises','बढ़ता है','കൂടുന്നു'),L('stays the same','वही रहता है','അതേ പോലെ')],a:0,why:L('A bigger C stores more charge, so its voltage drops less between peaks.','बड़ा C ज़्यादा चार्ज रखता है, तो पीक के बीच वोल्टेज कम गिरता है।','വലിയ C കൂടുതൽ ചാർജ് സൂക്ഷിക്കുന്നു, പീക്കുകൾക്കിടയിൽ വോൾട്ടേജ് കുറച്ചേ താഴൂ.')},
 labels:['filter','ripple'],hints:['tau','xc','qcv'],rel:{c:['I','f','C','Vr'],h:'Vr'},
 fm:['<i>V</i><sub>r</sub> ≈ <i>I</i> ÷ (<i>f</i> × <i>C</i>)'],

 ex:L('Example: 0.2 A load, 100 Hz, 1000 µF: Vr ≈ 0.2 ÷ (100 × 0.001) = 2 V.','उदाहरण: 0.2 A लोड, 100 Hz, 1000 µF: Vr ≈ 0.2 ÷ (100 × 0.001) = 2 V।','ഉദാഹരണം: 0.2 A ലോഡ്, 100 Hz, 1000 µF: Vr ≈ 0.2 ÷ (100 × 0.001) = 2 V.'),
 trick:L('More µF, less ripple. More load, more ripple.','ज़्यादा µF, कम रिपल। ज़्यादा लोड, ज़्यादा रिपल।','കൂടുതൽ µF, കുറവ് റിപ്പിൾ. കൂടുതൽ ലോഡ്, കൂടുതൽ റിപ്പിൾ.'),
 check:{q:L('Load 1 A, ripple 100 Hz, C = 4700 µF. The ripple Vr is about …','लोड 1 A, रिपल 100 Hz, C = 4700 µF। रिपल Vr करीब …','ലോഡ് 1 A, റിപ്പിൾ 100 Hz, C = 4700 µF. റിപ്പിൾ Vr ഏകദേശം …'),o:['2.1 V','21 V','0.21 V'],a:0},

   const Vr=Vm-vmin;let s=`<path d="M20 110H390" stroke="var(--mut)" stroke-width="1"/><path d="${wpath(20,110,370,85,fwU(2))}" stroke="var(--mut)" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/><path d="${d}" stroke="var(--frm)" stroke-width="3" fill="none"/>`;
   const y0=160;s+=wr(`M30 ${y0}H70`);

   put($('#a',w),s);
   const tn=[['Capacitor filter: shown by the wave above.','कैपेसिटर फ़िल्टर: ऊपर की वेव।','കപ്പാസിറ്റർ ഫിൽട്ടർ: മുകളിലെ വേവ്.'],['Choke (L) filter: good for heavy loads.','चोक (L) फ़िल्टर: भारी लोड के लिए अच्छा।','ചോക്ക് (L) ഫിൽട്ടർ: വലിയ ലോഡിന് നല്ലത്.'],['LC filter: L blocks ripple, C bypasses it.','LC फ़िल्टर: L रिपल रोकता, C बायपास करता।','LC ഫിൽട്ടർ: L റിപ്പിൾ തടയുന്നു, C ബൈപ്പാസ് ചെയ്യുന്നു.'],['π filter (C-L-C): smoothest of the four.','π फ़िल्टर (C-L-C): चारों में सबसे स्मूथ।','π ഫിൽട്ടർ (C-L-C): നാലിലും ഏറ്റവും സ്മൂത്ത്.']][ty];

 flash:FB('Peak and peak-to-peak (Module 0, slide 28); f and T (Module 0, slide 27)','पीक और पीक-टू-पीक (मॉड्यूल 0, स्लाइड 28); f और T (मॉड्यूल 0, स्लाइड 27)','പീക്ക്, പീക്ക്-ടു-പീക്ക് (മൊഡ്യൂൾ 0, സ്ലൈഡ് 28); f, T (മൊഡ്യൂൾ 0, സ്ലൈഡ് 27)'),
 hook:L('A meter shows one number. A CRO shows the whole wave: its height, its time and its shape.','मीटर एक नंबर दिखाता है। CRO पूरी वेव: ऊँचाई, समय और आकार।','മീറ്റർ ഒരു നമ്പർ കാണിക്കുന്നു. CRO മുഴുവൻ വേവ്: ഉയരം, സമയം, രൂപം.'),
 defn:L('<b>CRO</b> (cathode ray oscilloscope) draws voltage (up) against time (across). An electron beam is bent up and down by the Y plates (signal) and swept across by the X plates (time base). <b>Volts/div</b> sets the vertical scale, <b>Time/div</b> the horizontal. A DSO does the same digitally.','<b>CRO</b> (कैथोड रे ऑसिलोस्कोप) वोल्टेज (ऊपर) को समय (आड़ा) के साथ बनाता है। इलेक्ट्रॉन बीम Y प्लेट (सिग्नल) से ऊपर-नीचे और X प्लेट (टाइम बेस) से आड़ा चलता है। <b>Volts/div</b> खड़ा स्केल, <b>Time/div</b> आड़ा स्केल। DSO यही डिजिटल में करता है।','<b>CRO</b> (കാഥോഡ് റേ ഓസിലോസ്കോപ്പ്) വോൾട്ടേജ് (മുകളിലേക്ക്) സമയത്തിനെതിരെ (കുറുകെ) വരയ്ക്കുന്നു. ഇലക്ട്രോൺ ബീം Y പ്ലേറ്റ് (സിഗ്നൽ) മുകളിലും താഴെയും, X പ്ലേറ്റ് (ടൈം ബേസ്) കുറുകെയും നീക്കുന്നു. <b>Volts/div</b> ലംബ സ്കെയിൽ, <b>Time/div</b> തിരശ്ചീന സ്കെയിൽ. DSO ഇതുതന്നെ ഡിജിറ്റലായി ചെയ്യുന്നു.'),
 real:`<svg viewBox="0 0 300 110" role="img" aria-label="Oscilloscope front panel"><rect x="20" y="8" width="260" height="96" rx="8" fill="#d9dde3" stroke="#555" stroke-width="2"/>${croScreen(30,16,140,80,10,8)}<path d="${wpath(30,56,140,24,sinU(3))}" stroke="#5f6" stroke-width="2" fill="none"/><circle cx="210" cy="40" r="14" fill="#333"/><circle cx="252" cy="40" r="14" fill="#333"/><circle cx="210" cy="80" r="8" fill="#2a6fdb"/><circle cx="252" cy="80" r="8" fill="#555"/></svg>`,
 play:L('Drag Volts/div and Time/div. Count divisions on the screen.','Volts/div और Time/div खिसकाओ। स्क्रीन पर डिवीज़न गिनो।','Volts/div, Time/div നീക്കൂ. സ്ക്രീനിൽ ഡിവിഷൻ എണ്ണൂ.'),
 pred:{q:L('Volts/div is turned from 1 V to 2 V. The trace height on the screen …','Volts/div 1 V से 2 V किया। स्क्रीन पर ट्रेस की ऊँचाई …','Volts/div 1 V-ൽ നിന്ന് 2 V ആക്കി. സ്ക്രീനിലെ ട്രേസിന്റെ ഉയരം …'),o:[L('halves','आधी','പകുതി'),L('doubles','दोगुनी','ഇരട്ടി'),L('stays the same','वही','അതേ')],a:0,why:L('Each division now means 2 V, so the same signal covers half as many divisions.','अब हर डिवीज़न 2 V, तो वही सिग्नल आधे डिवीज़न लेता है।','ഇപ്പോൾ ഓരോ ഡിവിഷനും 2 V, അതേ സിഗ്നൽ പകുതി ഡിവിഷൻ മാത്രം.')},
 labels:['vdiv','tdiv'],hints:['pk','ft','rms'],rel:{c:['Vpp','Vm','T','f'],h:'f'},
 fm:['<i>V</i><sub>pp</sub> = div × V/div','<i>T</i> = div × Time/div'],
 uses:L('f = 1 ÷ T (Module 0, slide 27). Vm = Vpp ÷ 2 and Vrms = Vm ÷ √2 for a sine (Module 0, slide 30).','f = 1 ÷ T (मॉड्यूल 0, स्लाइड 27)। साइन के लिए Vm = Vpp ÷ 2 और Vrms = Vm ÷ √2 (मॉड्यूल 0, स्लाइड 30)।','f = 1 ÷ T (മൊഡ്യൂൾ 0, സ്ലൈഡ് 27). സൈനിന് Vm = Vpp ÷ 2, Vrms = Vm ÷ √2 (മൊഡ്യൂൾ 0, സ്ലൈഡ് 30).'),
 ex:L('Example: 5 div at 2 V/div = 10 Vpp. One cycle 5 div at 2 ms/div = 10 ms, so f = 100 Hz.','उदाहरण: 2 V/div पर 5 div = 10 Vpp। एक साइकिल 2 ms/div पर 5 div = 10 ms, तो f = 100 Hz।','ഉദാഹരണം: 2 V/div-ൽ 5 div = 10 Vpp. ഒരു സൈക്കിൾ 2 ms/div-ൽ 5 div = 10 ms, അതിനാൽ f = 100 Hz.'),
 trick:L('Up is volts, across is time. Count, then multiply.','ऊपर वोल्ट, आड़ा समय। गिनो, फिर गुणा करो।','മുകളിലേക്ക് വോൾട്ട്, കുറുകെ സമയം. എണ്ണൂ, പിന്നെ ഗുണിക്കൂ.'),
 check:{q:L('A sine trace is 3 div high (peak to peak) at 5 V/div. Its peak Vm (Module 0) is …','5 V/div पर साइन ट्रेस 3 div ऊँचा (पीक टू पीक)। उसका पीक Vm (मॉड्यूल 0) …','5 V/div-ൽ സൈൻ ട്രേസ് 3 div ഉയരം (പീക്ക് ടു പീക്ക്). അതിന്റെ പീക്ക് Vm (മൊഡ്യൂൾ 0) …'),o:['7.5 V','15 V','3 V'],a:0},
 build(w,api){
  w.innerHTML=S(400,215,`<g id="a"></g>`,'CRO screen showing a sine wave with adjustable scales');
  const rd=mkRd(w),c=mkCtl(w);let vi=2,ti=2;
  slider(c,'Volts/div',0,3,1,2,x=>VDV[x]+' V',x=>{vi=x;api.redraw()});
  slider(c,'Time/div',0,3,1,2,x=>TDV[x]+' ms',x=>{ti=x;api.redraw()});
  return t=>{const Vm=4,f=50,vd=VDV[vi],td=TDV[ti],X0=40,Y0=20,W=320,H=176,dx=W/10,dy=H/8;
   let s=`<rect x="10" y="6" width="380" height="204" rx="10" fill="#d9dde3" stroke="#555" stroke-width="2"/>`+croScreen(X0,Y0,W,H,10,8);
   let d='';for(let k=0;k<=240;k++){const x=X0+W*k/240,tm=(k/240)*10*td/1000,v=Vm*Math.sin(TPI*f*tm+t*.6),y=Math.max(Y0,Math.min(Y0+H,Y0+H/2-v/vd*dy));d+=(k?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}
   s+=`<path d="${d}" stroke="#6f6" stroke-width="2.6" fill="none"/>`;
   put($('#a',w),s);
   const div=2*Vm/vd,cyc=20/td;
   setRd(rd,`<span>${RD('Height','ऊँचाई','ഉയരം')}: <b>${fm1(div)} div</b> × ${vd} V = <b>${fm1(div*vd)} Vpp</b> → Vm = ${Vm} V</span><span>${RD('One cycle','एक साइकिल','ഒരു സൈക്കിൾ')}: <b>${fm1(cyc)} div</b> × ${td} ms = <b>20 ms</b> → f = 50 Hz</span>`)}}});

/* ---------- 18 Wave shapes ---------- */
const PRB=[['Transformer secondary','ट्रांसफॉर्मर सेकेंडरी','ട്രാൻസ്ഫോർമർ സെക്കൻഡറി'],['After one diode','एक डायोड के बाद','ഒരു ഡയോഡിന് ശേഷം'],['After the bridge','ब्रिज के बाद','ബ്രിഡ്ജിന് ശേഷം'],['After the capacitor','कैपेसिटर के बाद','കപ്പാസിറ്ററിന് ശേഷം']];
CS({id:'e_wav',menu:'Wave shapes on the CRO',title:'t_wav',
 flash:FB('Rectifiers and filters (slides 12–16); CRO (slide 17)','रेक्टिफायर और फ़िल्टर (स्लाइड 12–16); CRO (स्लाइड 17)','റെക്ടിഫയറും ഫിൽട്ടറും (സ്ലൈഡ് 12–16); CRO (സ്ലൈഡ് 17)'),
 hook:L('Move the CRO probe point by point through a power supply. Each stage has its own picture.','CRO प्रोब को पावर सप्लाई में पॉइंट-दर-पॉइंट चलाओ। हर स्टेज की अपनी तस्वीर।','CRO പ്രോബ് പവർ സപ്ലൈയിൽ പോയിന്റ് തോറും നീക്കൂ. ഓരോ സ്റ്റേജിനും സ്വന്തം ചിത്രം.'),
 defn:L('<b>Wave shapes:</b> secondary = sine; after one diode = half-sine pulses with gaps; after a bridge = pulses with no gaps; after the capacitor = nearly flat DC with a small saw-tooth ripple.','<b>वेव शेप:</b> सेकेंडरी = साइन; एक डायोड के बाद = गैप वाली आधी-साइन पल्स; ब्रिज के बाद = बिना गैप पल्स; कैपेसिटर के बाद = लगभग सपाट DC, छोटा आरी-जैसा रिपल।','<b>വേവ് ഷേപ്പ്:</b> സെക്കൻഡറി = സൈൻ; ഒരു ഡയോഡിന് ശേഷം = ഗ്യാപ്പുള്ള പകുതി-സൈൻ പൾസ്; ബ്രിഡ്ജിന് ശേഷം = ഗ്യാപ്പില്ലാത്ത പൾസ്; കപ്പാസിറ്ററിന് ശേഷം = ഏതാണ്ട് പരന്ന DC, ചെറിയ അറക്കവാൾ റിപ്പിൾ.'),
 play:L('Tap each probe point. The probe moves and the screen changes.','हर प्रोब पॉइंट दबाओ। प्रोब चलता है, स्क्रीन बदलती है।','ഓരോ പ്രോബ് പോയിന്റും ടാപ്പ് ചെയ്യൂ. പ്രോബ് നീങ്ങുന്നു, സ്ക്രീൻ മാറുന്നു.'),
 pred:{q:L('The CRO probe is moved to just after the filter capacitor. The trace looks like …','CRO प्रोब फ़िल्टर कैपेसिटर के ठीक बाद। ट्रेस कैसा दिखेगा?','CRO പ്രോബ് ഫിൽട്ടർ കപ്പാസിറ്ററിന് ശേഷം. ട്രേസ് എങ്ങനെ?'),o:[L('a nearly flat line with small ripple','लगभग सपाट लाइन, छोटा रिपल','ഏതാണ്ട് പരന്ന വര, ചെറിയ റിപ്പിൾ'),L('a full sine wave','पूरी साइन वेव','മുഴുവൻ സൈൻ വേവ്'),L('half-sine pulses with gaps','गैप वाली आधी-साइन पल्स','ഗ്യാപ്പുള്ള പകുതി-സൈൻ പൾസ്')],a:0,why:L('The capacitor fills the gaps between peaks, leaving only a small ripple.','कैपेसिटर पीक के बीच के गैप भरता है, बस छोटा रिपल बचता है।','കപ്പാസിറ്റർ പീക്കുകൾക്കിടയിലെ ഗ്യാപ്പ് നിറയ്ക്കുന്നു, ചെറിയ റിപ്പിൾ മാത്രം.')},
 labels:['ripple','filter'],hints:['ft','pk'],rel:{c:['V','T','f'],h:'V'},
 ex:L('Example: on AC coupling at 0.2 V/div, a 12 V supply shows only its ripple, about 2 div (0.4 Vpp).','उदाहरण: AC कपलिंग 0.2 V/div पर 12 V सप्लाई सिर्फ़ रिपल दिखाती है, करीब 2 div (0.4 Vpp)।','ഉദാഹരണം: AC കപ്ലിംഗ് 0.2 V/div-ൽ 12 V സപ്ലൈ റിപ്പിൾ മാത്രം കാണിക്കുന്നു, ഏകദേശം 2 div (0.4 Vpp).'),
 trick:L('Sine, gaps, no gaps, flat: the supply story on one screen.','साइन, गैप, बिना गैप, सपाट: एक स्क्रीन पर सप्लाई की कहानी।','സൈൻ, ഗ്യാപ്പ്, ഗ്യാപ്പില്ല, പരന്നത്: ഒരു സ്ക്രീനിൽ സപ്ലൈയുടെ കഥ.'),
 check:{q:L('After a bridge the CRO shows pulses 10 ms apart. The mains frequency (f = 1 ÷ T, Module 0) is …','ब्रिज के बाद CRO पर पल्स 10 ms दूर। मेन फ्रीक्वेंसी (f = 1 ÷ T, मॉड्यूल 0) …','ബ്രിഡ്ജിന് ശേഷം CRO-യിൽ പൾസ് 10 ms അകലെ. മെയിൻ ഫ്രീക്വൻസി (f = 1 ÷ T, മൊഡ്യൂൾ 0) …'),o:['50 Hz','100 Hz','25 Hz'],a:0},
 build(w,api){
  w.innerHTML=S(400,215,`<g id="a"></g>`,'Power supply stages with a CRO probe and the trace at each point');
  const rd=mkRd(w),c=mkCtl(w);let m=0;
  modeBtns(c,PRB.map(p=>L(p[0],p[1],p[2])),i=>{m=i;api.redraw()});
  const PX=[60,150,240,330];
  return t=>{let s=`<rect x="20" y="16" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--wire)" stroke-width="2"/><rect x="110" y="16" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--wire)" stroke-width="2"/><rect x="200" y="16" width="70" height="40" rx="6" fill="var(--card)" stroke="var(--wire)" stroke-width="2"/><rect x="290" y="16" width="80" height="40" rx="6" fill="var(--card)" stroke="var(--wire)" stroke-width="2"/>`;
   s+=TL(55,42,['Transf.','ट्रांसफॉ.','ട്രാൻസ്ഫോ.'],'var(--fg)')+TL(145,42,['1 diode','1 डायोड','1 ഡയോഡ്'],'var(--fg)')+TL(235,42,['Bridge','ब्रिज','ബ്രിഡ്ജ്'],'var(--fg)')+TL(330,42,['Capacitor','कैपेसिटर','കപ്പാസിറ്റർ'],'var(--fg)');
   s+=`<path d="M${PX[m]} 60L${PX[m]} 80" stroke="#d22" stroke-width="4"/><circle cx="${PX[m]}" cy="60" r="5" fill="#d22"/>`+croScreen(60,84,280,124,10,6);
   const ph=t*.4,fns=[u=>Math.sin(TPI*(3*u-ph)),u=>Math.max(0,Math.sin(TPI*(3*u-ph))),u=>Math.abs(Math.sin(TPI*(3*u-ph))),u=>.92+.08*(1-((6*u-2*ph)%1+1)%1)];
   s+=`<path d="${wpath(60,m===0?146:190,280,m===0?50:90,fns[m])}" stroke="#6f6" stroke-width="2.6" fill="none"/>`;
   put($('#a',w),s);
   const dsc=[['Sine wave: AC.','साइन वेव: AC।','സൈൻ വേവ്: AC.'],['Half-sine pulses with gaps: half wave.','गैप वाली आधी-साइन पल्स: हाफ वेव।','ഗ്യാപ്പുള്ള പകുതി-സൈൻ പൾസ്: ഹാഫ് വേവ്.'],['Pulses with no gaps: full wave.','बिना गैप पल्स: फुल वेव।','ഗ്യാപ്പില്ലാത്ത പൾസ്: ഫുൾ വേവ്.'],['Nearly flat DC with small ripple.','लगभग सपाट DC, छोटा रिपल।','ഏതാണ്ട് പരന്ന DC, ചെറിയ റിപ്പിൾ.']][m];
   setRd(rd,`<span><b>${B3(PRB[m])}</b>: ${B3(dsc)}</span>`)}}});

CS({id:'e_bjt',menu:'Transistor (BJT)',title:'t_bjt',
 flash:FB('PN junction (slide 6); a diode test with the meter (slide 9)','PN जंक्शन (स्लाइड 6); मीटर से डायोड टेस्ट (स्लाइड 9)','PN ജംഗ്ഷൻ (സ്ലൈഡ് 6); മീറ്റർ ഉപയോഗിച്ച് ഡയോഡ് ടെസ്റ്റ് (സ്ലൈഡ് 9)'),
 hook:L('A small black part with three legs drives the relay on a timer card. It is a transistor.','टाइमर कार्ड पर रिले चलाने वाला तीन टाँगों का छोटा काला पार्ट ट्रांज़िस्टर है।','ടൈമർ കാർഡിൽ റിലേ ഓടിക്കുന്ന മൂന്ന് കാലുള്ള ചെറിയ കറുത്ത ഭാഗം ട്രാൻസിസ്റ്റർ ആണ്.'),
 defn:L('<b>BJT</b> (bipolar junction transistor): three layers, NPN or PNP. The <b>emitter</b> (E) is heavily doped, the <b>base</b> (B) is very thin and lightly doped, the <b>collector</b> (C) is the largest. It has two PN junctions: base-emitter and base-collector.','<b>BJT</b> (बाइपोलर जंक्शन ट्रांज़िस्टर): तीन लेयर, NPN या PNP। <b>एमिटर</b> (E) भारी डोप्ड, <b>बेस</b> (B) बहुत पतला और हल्का डोप्ड, <b>कलेक्टर</b> (C) सबसे बड़ा। दो PN जंक्शन: बेस-एमिटर और बेस-कलेक्टर।','<b>BJT</b> (ബൈപോളാർ ജംഗ്ഷൻ ട്രാൻസിസ്റ്റർ): മൂന്ന് ലെയർ, NPN അല്ലെങ്കിൽ PNP. <b>എമിറ്റർ</b> (E) കൂടുതൽ ഡോപ്പ് ചെയ്തത്, <b>ബേസ്</b> (B) വളരെ നേർത്തതും കുറച്ച് ഡോപ്പ് ചെയ്തതും, <b>കളക്ടർ</b> (C) ഏറ്റവും വലുത്. രണ്ട് PN ജംഗ്ഷൻ: ബേസ്-എമിറ്റർ, ബേസ്-കളക്ടർ.'),
 play:L('Tap NPN or PNP, then the packages. Watch layers, symbol and pins.','NPN या PNP दबाओ, फिर पैकेज। लेयर, सिम्बल और पिन देखो।','NPN അല്ലെങ്കിൽ PNP ടാപ്പ് ചെയ്യൂ, പിന്നെ പാക്കേജ്. ലെയർ, സിംബൽ, പിൻ നോക്കൂ.'),
 pred:{q:L('In the transistor symbol, the arrow on the emitter points …','ट्रांज़िस्टर सिम्बल में एमिटर का तीर किधर?','ട്രാൻസിസ്റ്റർ സിംബലിൽ എമിറ്ററിലെ അമ്പ് ഏത് ദിശയിൽ?'),o:[L('the way conventional current flows','कन्वेंशनल करंट की दिशा में','കൺവെൻഷണൽ കറന്റിന്റെ ദിശയിൽ'),L('always to the base','हमेशा बेस की ओर','എപ്പോഴും ബേസിലേക്ക്'),L('to the collector','कलेक्टर की ओर','കളക്ടറിലേക്ക്')],a:0,why:L('Like the diode arrow, P to N. NPN: out of the emitter. PNP: into the emitter.','डायोड के तीर की तरह, P से N। NPN: एमिटर से बाहर। PNP: एमिटर के अंदर।','ഡയോഡ് അമ്പ് പോലെ, P-ൽ നിന്ന് N. NPN: എമിറ്ററിൽ നിന്ന് പുറത്ത്. PNP: എമിറ്ററിലേക്ക് അകത്ത്.')},
 labels:['emit','base','coll'],hints:['cur','vd'],rel:{c:['E','B','C'],h:'B'},
 ex:L('Example: BC547 (NPN, TO-92), flat face toward you: C, B, E. TIP31 (NPN, TO-220): B, C, E, and the metal tab is the collector. Always confirm with the datasheet.','उदाहरण: BC547 (NPN, TO-92), सपाट हिस्सा सामने: C, B, E। TIP31 (NPN, TO-220): B, C, E, धातु टैब कलेक्टर। हमेशा डेटाशीट से पक्का करो।','ഉദാഹരണം: BC547 (NPN, TO-92), പരന്ന മുഖം മുന്നിൽ: C, B, E. TIP31 (NPN, TO-220): B, C, E, ലോഹ ടാബ് കളക്ടർ. എപ്പോഴും ഡാറ്റാഷീറ്റ് നോക്കൂ.'),
 trick:L('NPN: Not Pointing iN. PNP: Pointing iN Proudly.','NPN: Not Pointing iN। PNP: Pointing iN Proudly।','NPN: Not Pointing iN. PNP: Pointing iN Proudly.'),
 check:{q:L('Treat an NPN transistor as two diodes (slide 9). With the red probe on the base, the meter reads about 0.7 V to …','NPN को दो डायोड मानो (स्लाइड 9)। लाल प्रोब बेस पर, मीटर करीब 0.7 V किससे?','NPN-നെ രണ്ട് ഡയോഡ് ആയി കാണൂ (സ്ലൈഡ് 9). ചുവന്ന പ്രോബ് ബേസിൽ, മീറ്റർ ഏകദേശം 0.7 V ഏതിലേക്ക്?'),o:[L('both emitter and collector','एमिटर और कलेक्टर दोनों','എമിറ്ററും കളക്ടറും'),L('emitter only','सिर्फ़ एमिटर','എമിറ്റർ മാത്രം'),L('neither','किसी से नहीं','രണ്ടിനും ഇല്ല')],a:0},
 build(w,api){
  w.innerHTML=S(400,215,`<g id="a"></g>`,'Transistor layers, symbol and package pin-outs');
  const rd=mkRd(w),c=mkCtl(w);let pnp=0,pk=0;
  modeBtns(c,['NPN','PNP'],i=>{pnp=i;api.redraw()});
  modeBtns(c,['TO-92','TO-220'],i=>{pk=i;api.redraw()});
  return t=>{const cE=pnp?'rgba(217,54,43,.25)':'rgba(42,111,219,.25)',cB=pnp?'rgba(42,111,219,.3)':'rgba(217,54,43,.3)';
   let s=`<rect x="20" y="30" width="70" height="60" fill="${cE}" stroke="var(--wire)" stroke-width="2"/><rect x="90" y="30" width="20" height="60" fill="${cB}" stroke="var(--wire)" stroke-width="2"/><rect x="110" y="30" width="90" height="60" fill="${cE}" stroke="var(--wire)" stroke-width="2"/>`;
   s+=TXC(55,66,pnp?'P':'N','var(--fg)','17')+TXC(100,66,pnp?'N':'P','var(--fg)','15')+TXC(155,66,pnp?'P':'N','var(--fg)','17');
   s+=TXC(55,22,'E','var(--fg)','15')+TXC(100,22,'B','var(--fg)','15')+TXC(155,22,'C','var(--fg)','15')+wr('M100 90V110');
   s+=TL(55,108,['heavy doping','भारी डोपिंग','കൂടിയ ഡോപ്പിംഗ്'],'var(--mut)')+TL(155,108,['largest','सबसे बड़ा','ഏറ്റവും വലുത്'],'var(--mut)');
   s+=symBJT(300,70,pnp)+TXC(252,62,'B','var(--fg)','15')+TXC(326,36,'C','var(--fg)','15')+TXC(326,112,'E','var(--fg)','15');
   const pin=(a)=>TXC(100,212,a[0],'var(--frm)','14')+TXC(120,212,a[1],'var(--frm)','14')+TXC(140,212,a[2],'var(--frm)','14');
   if(!pk){s+=`<path d="M90 130h60v30a30 22 0 0 1 -60 0z" fill="#222"/>`+wr('M100 180V198M120 182V198M140 180V198','#999')+TXC(120,148,'BC547','#ccc','12')+pin(['C','B','E'])+TL(290,160,['flat face to you','सपाट हिस्सा सामने','പരന്ന മുഖം മുന്നിൽ'],'var(--fg)')+TL(290,182,['legs down','टाँगें नीचे','കാൽ താഴേക്ക്'],'var(--fg)')}
   else{s+=`<rect x="80" y="122" width="80" height="18" fill="#aab" stroke="#555"/><circle cx="120" cy="131" r="6" fill="var(--bg)"/><rect x="84" y="140" width="72" height="34" fill="#222"/>`+wr('M100 174V198M120 174V198M140 174V198','#999')+TXC(120,162,'TIP31','#ccc','12')+pin(['B','C','E'])+TL(290,160,['label to you, legs down','लेबल सामने, टाँगें नीचे','ലേബൽ മുന്നിൽ, കാൽ താഴേക്ക്'],'var(--fg)')+TL(290,184,['metal tab = collector','धातु टैब = कलेक्टर','ലോഹ ടാബ് = കളക്ടർ'],'var(--mut)')}
   put($('#a',w),s);
   setRd(rd,`<span>${pnp?'PNP':'NPN'}: ${pnp?RD('arrow points into the emitter','तीर एमिटर के अंदर','അമ്പ് എമിറ്ററിലേക്ക് അകത്ത്'):RD('arrow points out of the emitter','तीर एमिटर से बाहर','അമ്പ് എമിറ്ററിൽ നിന്ന് പുറത്ത്')}</span>`)}}});

CS({id:'e_act',menu:'Transistor action',title:'t_act',
 flash:FB('KCL (Module 2, slide 8); BJT layers (slide 19)','KCL (मॉड्यूल 2, स्लाइड 8); BJT लेयर (स्लाइड 19)','KCL (മൊഡ്യൂൾ 2, സ്ലൈഡ് 8); BJT ലെയർ (സ്ലൈഡ് 19)'),
 hook:L('A tiny current from a sensor can switch a big lamp. The transistor uses a small base current to control a large collector current.','सेंसर का छोटा करंट बड़ा लैंप चला सकता है। ट्रांज़िस्टर छोटे बेस करंट से बड़ा कलेक्टर करंट चलाता है।','സെൻസറിൽ നിന്നുള്ള ചെറിയ കറന്റ് വലിയ ലാമ്പ് ഓണാക്കും. ട്രാൻസിസ്റ്റർ ചെറിയ ബേസ് കറന്റ് കൊണ്ട് വലിയ കളക്ടർ കറന്റ് നിയന്ത്രിക്കുന്നു.'),
 defn:L('<b>Transistor action:</b> base-emitter forward biased, collector-base reverse biased. Electrons from the emitter cross the thin base; most are swept into the collector. A small IB controls a large IC.','<b>ट्रांज़िस्टर एक्शन:</b> बेस-एमिटर फॉरवर्ड, कलेक्टर-बेस रिवर्स बायस्ड। एमिटर के इलेक्ट्रॉन पतला बेस पार करते हैं; ज़्यादातर कलेक्टर में चले जाते हैं। छोटा IB बड़ा IC चलाता है।','<b>ട്രാൻസിസ്റ്റർ ആക്ഷൻ:</b> ബേസ്-എമിറ്റർ ഫോർവേഡ്, കളക്ടർ-ബേസ് റിവേഴ്സ് ബയസ്. എമിറ്ററിലെ ഇലക്ട്രോൺ നേർത്ത ബേസ് കടക്കുന്നു; മിക്കതും കളക്ടറിലേക്ക്. ചെറിയ IB വലിയ IC നിയന്ത്രിക്കുന്നു.'),
 play:L('Drag IB. Watch the thin base stream and the thick collector stream. Tap β.','IB खिसकाओ। पतली बेस धारा और मोटी कलेक्टर धारा देखो। β दबाओ।','IB നീക്കൂ. നേർത്ത ബേസ് ഒഴുക്കും വലിയ കളക്ടർ ഒഴുക്കും നോക്കൂ. β ടാപ്പ് ചെയ്യൂ.'),
 pred:{q:L('The base current doubles (active region). The collector current …','बेस करंट दोगुना (एक्टिव रीजन)। कलेक्टर करंट …','ബേസ് കറന്റ് ഇരട്ടി (ആക്ടീവ് റീജിയൻ). കളക്ടർ കറന്റ് …'),o:[L('doubles','दोगुना','ഇരട്ടി'),L('halves','आधा','പകുതി'),L('stays the same','वही','അതേ')],a:0,why:L('IC = β × IB. Double IB, double IC, as long as the transistor is not saturated.','IC = β × IB। IB दोगुना, IC दोगुना, जब तक सैचुरेट न हो।','IC = β × IB. IB ഇരട്ടി, IC ഇരട്ടി, സാച്ചുറേറ്റ് ആകാത്തിടത്തോളം.')},
 labels:['beta','base','coll'],hints:['kcl','vd'],rel:{c:['IB','β','IC','IE'],h:'IC'},
 fm:['<i>I</i><sub>C</sub> = β × <i>I</i><sub>B</sub>','<i>I</i><sub>E</sub> = <i>I</i><sub>B</sub> + <i>I</i><sub>C</sub>'],
 uses:L('Active region only. β (also hFE) is typically 50 to 300. IE = IB + IC is KCL at the transistor (Module 2, slide 8).','सिर्फ़ एक्टिव रीजन। β (hFE भी) आम तौर पर 50 से 300। IE = IB + IC ट्रांज़िस्टर पर KCL (मॉड्यूल 2, स्लाइड 8)।','ആക്ടീവ് റീജിയനിൽ മാത്രം. β (hFE) സാധാരണ 50 മുതൽ 300. IE = IB + IC ട്രാൻസിസ്റ്ററിലെ KCL (മൊഡ്യൂൾ 2, സ്ലൈഡ് 8).'),
 ex:L('Example: β = 150, IB = 40 µA: IC = 6 mA, IE = 6.04 mA.','उदाहरण: β = 150, IB = 40 µA: IC = 6 mA, IE = 6.04 mA।','ഉദാഹരണം: β = 150, IB = 40 µA: IC = 6 mA, IE = 6.04 mA.'),
 trick:L('Small base, big boss: IB steers IC.','छोटा बेस, बड़ा बॉस: IB, IC को चलाता है।','ചെറിയ ബേസ്, വലിയ ബോസ്: IB, IC-യെ നയിക്കുന്നു.'),
 check:{q:L('IB = 25 µA and IC = 5 mA. β = ?','IB = 25 µA और IC = 5 mA। β = ?','IB = 25 µA, IC = 5 mA. β = ?'),o:['200','125','20'],a:0},
 build(w,api){
  w.innerHTML=S(400,215,`<g id="a"></g>`,'NPN transistor with base and collector current streams');
  const rd=mkRd(w),c=mkCtl(w);let ib=20,bi=0;const BT=[100,200];
  slider(c,'I<sub>B</sub>',0,6,1,2,x=>(x*10)+' µA',x=>{ib=x*10;api.redraw()});
  modeBtns(c,['β = 100','β = 200'],i=>{bi=i;api.redraw()});
  return t=>{const b=BT[bi],icMax=12,ic=Math.min(icMax,b*ib/1000),sat=b*ib/1000>icMax,ie=ic+ib/1000;
   let s=symBJT(220,110,0)+wr('M180 110H140M100 110H60V150M60 190V200H232V150M232 70V30H330V70M330 130V200H232')+symRes(120,110,0)+symRes(330,100,90)+symCell(60,170,90)+symCell(380,150,90)+wr('M330 30H380V120M380 180V200H330');
   s+=TXC(120,96,'RB','var(--fg)','14')+TXC(356,104,'RC','var(--fg)','14')+TXC(38,174,'VBB','var(--fg)','13')+TXC(380,108,'12 V','var(--fg)','13');
   if(ib>0)s+=flowDots([[60,150],[60,110],[180,110],[220,140]],t,3,'var(--frm)',15+ib);
   if(ic>0){s+=flowDots([[330,70],[330,30],[232,30],[232,150]],t,Math.round(4+ic),'var(--def)',40+ic*6).replace(/r="[\d.]+"/g,`r="${(3+ic*.3).toFixed(1)}"`)}
   s+=TXC(200,214,'IC = '+fm1(ic)+' mA'+(sat?' (sat.)':''),sat?'var(--no)':'var(--def)','16');
   put($('#a',w),s);
   setRd(rd,`<span>IC = ${b} × ${ib} µA = <b>${fm1(ic)} mA</b>${sat?' · '+RD('limited by RC: saturation','RC से सीमित: सैचुरेशन','RC കൊണ്ട് പരിമിതം: സാച്ചുറേഷൻ'):''}</span><span>IE = IB + IC = <b>${fm1(ie)} mA</b></span>`)}}});
