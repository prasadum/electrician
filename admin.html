<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · NSTI Calicut</title>
<style>:root{--bg:#eef2f7;--c:#fff;--t:#152033;--b:#1a56cc;--bd:#cbd5e3}@media(prefers-color-scheme:dark){:root{--bg:#101722;--c:#18212f;--t:#e8eef8;--bd:#2c3a50}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,sans-serif;padding:16px}main{max-width:900px;margin:0 auto}
input,select,.btn{min-height:44px;font-size:16px;border-radius:10px;border:1px solid var(--bd);padding:0 12px;background:var(--c);color:var(--t)}.btn{background:var(--b);color:#fff;border:0;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;background:var(--c);margin-top:12px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:15px}.w{overflow:auto}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main>
<h1>Admin · NSTI Calicut</h1><div class="row"><input id="k" type="password" placeholder="Admin key"><button class="btn" id="ld">Load</button><select id="bt"><option value="">All batches</option></select><button class="btn" id="csv">Download CSV</button></div><p id="m"></p><div class="w"><table><thead><tr><th>Email</th><th>Batch</th><th>Module</th><th>Slide</th><th>Quiz</th><th>Last seen</th></tr></thead><tbody id="tb"></tbody></table></div></main>
<script src="config.js"></script><script>
let rows=[];const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function show(){const b=$('#bt').value,r=rows.filter(x=>!b||x.batch===b);$('#tb').innerHTML=r.map(x=>`<tr><td>${esc(x.email)}</td><td>${esc(x.batch)}</td><td>${esc(x.module)}</td><td>${x.slide}</td><td>${x.done}</td><td>${esc(String(x.updated).slice(0,16).replace('T',' '))}</td></tr>`).join('');$('#m').textContent=r.length+' trainees'}
$('#ld').onclick=async()=>{if(!NSTI.SCRIPT_URL){$('#m').textContent='Set SCRIPT_URL in config.js first.';return}
 try{const j=await (await fetch(NSTI.SCRIPT_URL+'?action=summary&key='+encodeURIComponent($('#k').value))).json();if(!j.ok){$('#m').textContent='Wrong key.';return}rows=j.rows;
  $('#bt').innerHTML='<option value="">All batches</option>'+[...new Set(rows.map(x=>x.batch))].map(b=>`<option>${esc(b)}</option>`).join('');show()}catch(e){$('#m').textContent='Could not reach the server.'}};
$('#bt').onchange=show;
$('#csv').onclick=()=>{const b=$('#bt').value,r=rows.filter(x=>!b||x.batch===b);const t='email,batch,module,slide,quiz,updated\n'+r.map(x=>[x.email,x.batch,x.module,x.slide,x.done,x.updated].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='progress.csv';a.click()};
</script></body></html>
