   s+=`<path d="${wpath(10,150,110,12,u=>Math.sin(TPI*(2*u-ph)))}" stroke="var(--def)" stroke-width="2.5" fill="none"/>`+TXC(64,178,'0.5 V','var(--def)','13');
   s+=`<path d="${wpath(260,150,130,Math.min(40,Av*1.5*2.6),u=>Math.sin(TPI*(2*u-ph)))}" stroke="var(--frm)" stroke-width="2.5" fill="none"/>`+TXC(330,196,fm1(Math.min(13,.5*Av))+' V','var(--frm)','13');
   put($('#a',w),s);
   setRd(rd,`<span>Av = ${fol?'1':'1 + '+RFS[ri]+' ÷ 10'} = <b>${fm1(Av)}</b> · ${RD('in phase','इन-फेज़','ഇൻ-ഫേസ്')}</span>`)}}});

/* ---------- 19 Comparator and summing ---------- */
const SV1=[0,1,2],SV2=[0,1.5,2.5];
CS({id:'b_comp',menu:'Comparator and summing amplifier',title:'t_comp',
 flash:FB('Open-loop gain (slide 16); inverting amplifier (slide 17)','ओपन-लूप गेन (स्लाइड 16); इनवर्टिंग एम्प्लिफायर (स्लाइड 17)','ഓപ്പൺ-ലൂപ്പ് ഗെയിൻ (സ്ലൈഡ് 16); ഇൻവെർട്ടിംഗ് ആംപ്ലിഫയർ (സ്ലൈഡ് 17)'),
 hook:L('A water-tank controller switches the pump when the level signal crosses a set point. An op-amp makes that decision.','वाटर-टैंक कंट्रोलर लेवल सिग्नल सेट पॉइंट पार करते ही पंप चलाता है। ऑप-एम्प यह फैसला करता है।','വാട്ടർ-ടാങ്ക് കൺട്രോളർ ലെവൽ സിഗ്നൽ സെറ്റ് പോയിന്റ് കടക്കുമ്പോൾ പമ്പ് സ്വിച്ച് ചെയ്യുന്നു. ഓപ്-ആംപ് ആ തീരുമാനം എടുക്കുന്നു.'),
 defn:L('<b>Comparator:</b> no feedback. If V+ > V− the output swings to about +13 V, otherwise to about −13 V. <b>Summing amplifier:</b> an inverting amplifier with several input resistors; the output is the (inverted) weighted sum of the inputs.','<b>कम्पेरेटर:</b> फीडबैक नहीं। V+ > V− तो आउटपुट करीब +13 V, नहीं तो करीब −13 V। <b>समिंग एम्प्लिफायर:</b> कई इनपुट रेसिस्टर वाला इनवर्टिंग एम्प्लिफायर; आउटपुट इनपुट का (उल्टा) जोड़।','<b>കംപാരേറ്റർ:</b> ഫീഡ്ബാക്ക് ഇല്ല. V+ > V− ആണെങ്കിൽ ഔട്ട്പുട്ട് ഏകദേശം +13 V, അല്ലെങ്കിൽ ഏകദേശം −13 V. <b>സമ്മിംഗ് ആംപ്ലിഫയർ:</b> പല ഇൻപുട്ട് റെസിസ്റ്ററുള്ള ഇൻവെർട്ടിംഗ് ആംപ്ലിഫയർ; ഔട്ട്പുട്ട് ഇൻപുട്ടുകളുടെ (തിരിഞ്ഞ) തുക.'),
 play:L('Tap Comparator or Summing. Drag the controls. Watch the output.','Comparator या Summing दबाओ। कंट्रोल खिसकाओ। आउटपुट देखो।','Comparator അല്ലെങ്കിൽ Summing ടാപ്പ് ചെയ്യൂ. കൺട്രോൾ നീക്കൂ. ഔട്ട്പുട്ട് നോക്കൂ.'),
 pred:{q:L('A comparator: V+ is a sine of 4 V peak, V− is fixed at 2 V. The output is …','कम्पेरेटर: V+ 4 V पीक साइन, V− 2 V पर फिक्स्ड। आउटपुट …','കംപാരേറ്റർ: V+ 4 V പീക്ക് സൈൻ, V− 2 V-ൽ ഫിക്സഡ്. ഔട്ട്പുട്ട് …'),o:[L('a rectangular wave','आयताकार वेव','ചതുരാകൃതിയിലുള്ള വേവ്'),L('a bigger sine','बड़ी साइन','വലിയ സൈൻ'),L('a steady 2 V','स्थिर 2 V','സ്ഥിരമായ 2 V')],a:0,why:L('The output snaps between +13 V and −13 V each time the sine crosses 2 V.','हर बार साइन 2 V पार करे, आउटपुट +13 V और −13 V के बीच कूदता है।','സൈൻ 2 V കടക്കുമ്പോഴെല്ലാം ഔട്ട്പുട്ട് +13 V-നും −13 V-നും ഇടയിൽ ചാടുന്നു.')},
 labels:['opamp','vgnd'],hints:['av'],rel:{c:['V1','V2','Vout'],h:'Vout'},
 fm:['<i>V</i><sub>out</sub> = −(<i>V</i><sub>1</sub> + <i>V</i><sub>2</sub>)'],
 uses:L('Summing amplifier with all resistors equal. With different resistors: Vout = −Rf (V1 ÷ R1 + V2 ÷ R2).','सभी रेसिस्टर बराबर वाला समिंग एम्प्लिफायर। अलग रेसिस्टर पर: Vout = −Rf (V1 ÷ R1 + V2 ÷ R2)।','എല്ലാ റെസിസ്റ്ററും തുല്യമായ സമ്മിംഗ് ആംപ്ലിഫയർ. വ്യത്യസ്ത റെസിസ്റ്ററിൽ: Vout = −Rf (V1 ÷ R1 + V2 ÷ R2).'),
 ex:L('Example: a comparator lights an LED when a light sensor voltage drops below a 2.5 V reference: a dusk switch.','उदाहरण: लाइट सेंसर वोल्टेज 2.5 V रेफरेंस से नीचे जाए तो कम्पेरेटर LED जलाता है: डस्क स्विच।','ഉദാഹരണം: ലൈറ്റ് സെൻസർ വോൾട്ടേജ് 2.5 V റഫറൻസിന് താഴെ പോകുമ്പോൾ കംപാരേറ്റർ LED കത്തിക്കുന്നു: ഡസ്ക് സ്വിച്ച്.'),
 trick:L('No feedback: decide. Feedback: amplify or add.','फीडबैक नहीं: फैसला। फीडबैक: बढ़ाओ या जोड़ो।','ഫീഡ്ബാക്ക് ഇല്ല: തീരുമാനിക്കൂ. ഫീഡ്ബാക്ക്: കൂട്ടൂ അല്ലെങ്കിൽ ചേർക്കൂ.'),
 check:{q:L('Summing amplifier, equal resistors, V1 = 1 V and V2 = 2.5 V. Vout = …','समिंग एम्प्लिफायर, बराबर रेसिस्टर, V1 = 1 V, V2 = 2.5 V। Vout = …','സമ്മിംഗ് ആംപ്ലിഫയർ, തുല്യ റെസിസ്റ്റർ, V1 = 1 V, V2 = 2.5 V. Vout = …'),o:['−3.5 V','+3.5 V','−1.5 V'],a:0},
 build(w,api){
  w.innerHTML=S(400,200,`<g id="a"></g>`,'Comparator waves or summing amplifier bars');
  const rd=mkRd(w),c=mkCtl(w);let m=0,vr=2,a=1,b=1;
  modeBtns(c,[L('Comparator','कम्पेरेटर','കംപാരേറ്റർ'),L('Summing','समिंग','സമ്മിംഗ്')],i=>{m=i;labs();api.redraw()});
  const sc=h('div');c.appendChild(sc);
  const labs=()=>{sc.innerHTML='';if(m===0)slider(sc,'V<sub>ref</sub>',0,3,1,vr,x=>x+' V',x=>{vr=x;api.redraw()});else{slider(sc,'V<sub>1</sub>',0,2,1,a,x=>SV1[x]+' V',x=>{a=x;api.redraw()});slider(sc,'V<sub>2</sub>',0,2,1,b,x=>SV2[x]+' V',x=>{b=x;api.redraw()})}};labs();
  return t=>{let s='';const ph=(t*.3)%1;
   if(m===0){s+=`<path d="M20 70H390" stroke="var(--mut)" stroke-width="1"/><path d="${wpath(20,70,370,48,u=>Math.sin(TPI*(2*u-ph)))}" stroke="var(--def)" stroke-width="2.5" fill="none"/><path d="M20 ${70-vr*12}H390" stroke="var(--ok)" stroke-width="2" stroke-dasharray="6 4"/>`+TXC(380,64-vr*12,'Vref','var(--ok)','13');
    let d='';for(let k=0;k<=300;k++){const u=k/300,v=4*Math.sin(TPI*(2*u-ph));d+=(k?'L':'M')+(20+370*u).toFixed(1)+' '+(v>vr?132:188)}
    s+=`<path d="M20 160H390" stroke="var(--mut)" stroke-width="1"/><path d="${d}" stroke="var(--frm)" stroke-width="3" fill="none"/>`+TXC(36,128,'+13','var(--frm)','12')+TXC(36,198,'−13','var(--frm)','12')}
   else{const v1=SV1[a],v2=SV2[b],vo=-(v1+v2);s+=`<path d="M60 150H360" stroke="var(--mut)" stroke-width="1.5"/>`;
    [[v1,'V1','var(--def)',90],[v2,'V2','var(--law)',180],[vo,'Vout','var(--frm)',290]].forEach(([v,l,cl,x])=>{const hgt=v*25;s+=`<rect x="${x-25}" y="${hgt>=0?150-hgt:150}" width="50" height="${Math.abs(hgt)}" fill="${cl}"/>`+TXC(x,hgt>=0?140-hgt:166-hgt,fm1(v)+' V','var(--fg)','14')+TXC(x,30,l,cl,'15')});
    s+=TXC(135,100,'+','var(--fg)','22')+TXC(235,100,'=','var(--fg)','22')}
   put($('#a',w),s);
   setRd(rd,m===0?`<span>V+ ${RD('above','ऊपर','മുകളിൽ')} ${vr} V → +13 V · ${RD('below','नीचे','താഴെ')} → −13 V</span>`:`<span>Vout = −(${SV1[a]} + ${SV2[b]}) = <b>${fm1(-(SV1[a]+SV2[b]))} V</b></span>`)}}});

/* ---------- 20 Binary ---------- */
CS({id:'b_bin',menu:'Number systems: binary',title:'t_bin',
 flash:FB('Unit prefixes and place value (Module 0, slide 23)','यूनिट प्रीफिक्स और स्थानीय मान (मॉड्यूल 0, स्लाइड 23)','യൂണിറ്റ് പ്രിഫിക്സ്, സ്ഥാനവില (മൊഡ്യൂൾ 0, സ്ലൈഡ് 23)'),
 hook:L('A PLC input card shows eight LEDs. Each LED is one bit: ON = 1, OFF = 0.','PLC इनपुट कार्ड पर आठ LED। हर LED एक बिट: ON = 1, OFF = 0।','PLC ഇൻപുട്ട് കാർഡിൽ എട്ട് LED. ഓരോ LED-യും ഒരു ബിറ്റ്: ON = 1, OFF = 0.'),
 defn:L('<b>Number systems:</b> decimal uses base 10 (0–9), <b>binary</b> base 2 (0, 1), octal base 8 (0–7), hexadecimal base 16 (0–9, A–F). In binary each place is worth twice the place to its right: 1, 2, 4, 8, 16, 32, 64, 128.','<b>नंबर सिस्टम:</b> डेसिमल बेस 10 (0–9), <b>बाइनरी</b> बेस 2 (0, 1), ऑक्टल बेस 8 (0–7), हेक्साडेसिमल बेस 16 (0–9, A–F)। बाइनरी में हर स्थान अपने दाएँ वाले का दोगुना: 1, 2, 4, 8, 16, 32, 64, 128।','<b>നമ്പർ സിസ്റ്റം:</b> ഡെസിമൽ ബേസ് 10 (0–9), <b>ബൈനറി</b> ബേസ് 2 (0, 1), ഒക്ടൽ ബേസ് 8 (0–7), ഹെക്സാഡെസിമൽ ബേസ് 16 (0–9, A–F). ബൈനറിയിൽ ഓരോ സ്ഥാനവും വലതുവശത്തേതിന്റെ ഇരട്ടി: 1, 2, 4, 8, 16, 32, 64, 128.'),
 play:L('Tap the bits to switch them ON and OFF. Watch the decimal value.','बिट दबाकर ON-OFF करो। डेसिमल वैल्यू देखो।','ബിറ്റ് ടാപ്പ് ചെയ്ത് ON-OFF ആക്കൂ. ഡെസിമൽ വില നോക്കൂ.'),
 pred:{q:L('In binary, 1 0 1 equals decimal …','बाइनरी में 1 0 1 डेसिमल में …','ബൈനറിയിൽ 1 0 1 ഡെസിമലിൽ …'),o:['5','101','3'],a:0,why:L('4 + 0 + 1 = 5.','4 + 0 + 1 = 5।','4 + 0 + 1 = 5.')},
 labels:['bit','base2'],hints:['ser'],rel:{c:['bit','2ⁿ','N'],h:'N'},
 fm:['<i>N</i> = Σ bit × 2<sup>n</sup>'],
 uses:L('n = place number counted from 0 at the right. 8 bits = 1 byte, 0 to 255.','n = दाएँ से 0 से गिना स्थान। 8 बिट = 1 बाइट, 0 से 255।','n = വലതുവശത്ത് 0 മുതൽ എണ്ണിയ സ്ഥാനം. 8 ബിറ്റ് = 1 ബൈറ്റ്, 0 മുതൽ 255.'),
 ex:L('Example: 1101₂ = 8 + 4 + 0 + 1 = 13.','उदाहरण: 1101₂ = 8 + 4 + 0 + 1 = 13।','ഉദാഹരണം: 1101₂ = 8 + 4 + 0 + 1 = 13.'),
 trick:L('Double as you go left: 1, 2, 4, 8 …','बाएँ जाते दोगुना: 1, 2, 4, 8 …','ഇടത്തേക്ക് പോകുമ്പോൾ ഇരട്ടി: 1, 2, 4, 8 …'),
 check:{q:L('11110₂ in decimal = …','11110₂ डेसिमल में = …','11110₂ ഡെസിമലിൽ = …'),o:['30','15','11110'],a:0},
 build(w,api){
  w.innerHTML=S(400,180,`<g id="a"></g>`,'Eight binary bits with place values');
  const rd=mkRd(w),c=mkCtl(w);const bits=[0,0,0,1,0,1,1,0];
  const bb=bits.map((x,i)=>button(c,'2'+['⁷','⁶','⁵','⁴','³','²','¹','⁰'][i],()=>{bits[i]^=1;bb[i].classList.toggle('on',!!bits[i]);api.redraw()},x?'on':''));
  return t=>{let s='',N=0;bits.forEach((b,i)=>{const pv=Math.pow(2,7-i),x=26+i*46;N+=b*pv;
    s+=`<circle cx="${x+18}" cy="50" r="16" fill="${b?'#e33':'#444'}"/>`+(b?`<circle cx="${x+18}" cy="50" r="24" fill="rgba(255,60,40,.25)"/>`:'')+TXC(x+18,96,b+'','var(--fg)','22')+TXC(x+18,126,pv+'','var(--mut)','14')});
   s+=TXC(200,166,'= '+N,'var(--def)','24');
   put($('#a',w),s);
   setRd(rd,`<span>${bits.join('')}₂ = <b>${N}</b> · hex ${N.toString(16).toUpperCase()} · octal ${N.toString(8)}</span>`)}}});

/* ---------- 21 Octal, hex, BCD ---------- */
const DN=[9,25,47,63,99];
CS({id:'b_hex',menu:'Octal, hexadecimal and BCD',title:'t_hex',
 flash:FB('Binary (slide 20)','बाइनरी (स्लाइड 20)','ബൈനറി (സ്ലൈഡ് 20)'),
 hook:L('A VFD fault code reads “2F”. A clock display shows digits 0–9. Both are binary underneath, written in shorter ways.','VFD फ़ॉल्ट कोड “2F”। घड़ी डिस्प्ले 0–9 अंक दिखाता है। दोनों के नीचे बाइनरी, बस छोटे तरीके से लिखी।','VFD ഫോൾട്ട് കോഡ് “2F”. ക്ലോക്ക് ഡിസ്പ്ലേ 0–9 അക്കങ്ങൾ കാണിക്കുന്നു. രണ്ടിന്റെയും അടിയിൽ ബൈനറി, ചുരുക്കി എഴുതിയത്.'),
 defn:L('<b>Hexadecimal:</b> each hex digit = 4 bits (0–9, A = 10 … F = 15). <b>Octal:</b> each octal digit = 3 bits. <b>BCD</b> (binary coded decimal): each decimal digit is written separately as 4 bits.','<b>हेक्साडेसिमल:</b> हर हेक्स अंक = 4 बिट (0–9, A = 10 … F = 15)। <b>ऑक्टल:</b> हर ऑक्टल अंक = 3 बिट। <b>BCD</b> (बाइनरी कोडेड डेसिमल): हर डेसिमल अंक अलग से 4 बिट में।','<b>ഹെക്സാഡെസിമൽ:</b> ഓരോ ഹെക്സ് അക്കവും = 4 ബിറ്റ് (0–9, A = 10 … F = 15). <b>ഒക്ടൽ:</b> ഓരോ ഒക്ടൽ അക്കവും = 3 ബിറ്റ്. <b>BCD</b> (ബൈനറി കോഡഡ് ഡെസിമൽ): ഓരോ ഡെസിമൽ അക്കവും വേറെ 4 ബിറ്റിൽ.'),
 play:L('Drag the decimal number. Watch it in binary, hex, octal and BCD.','डेसिमल नंबर खिसकाओ। बाइनरी, हेक्स, ऑक्टल और BCD में देखो।','ഡെസിമൽ നമ്പർ നീക്കൂ. ബൈനറി, ഹെക്സ്, ഒക്ടൽ, BCD-യിൽ നോക്കൂ.'),
 pred:{q:L('Decimal 25 in BCD is …','डेसिमल 25 BCD में …','ഡെസിമൽ 25 BCD-യിൽ …'),o:['0010 0101','11001','0001 1001'],a:0,why:L('2 → 0010 and 5 → 0101, each digit on its own.','2 → 0010 और 5 → 0101, हर अंक अलग।','2 → 0010, 5 → 0101, ഓരോ അക്കവും വേറെ.')},
 labels:['base2','bit'],hints:['ser'],rel:{c:['bin','hex','BCD'],h:'hex'},
 ex:L('Example: 47 = 101111₂ = 57₈ = 2F₁₆ = 0100 0111 (BCD).','उदाहरण: 47 = 101111₂ = 57₈ = 2F₁₆ = 0100 0111 (BCD)।','ഉദാഹരണം: 47 = 101111₂ = 57₈ = 2F₁₆ = 0100 0111 (BCD).'),
 trick:L('Hex: groups of 4. Octal: groups of 3. BCD: digit by digit.','हेक्स: 4 के ग्रुप। ऑक्टल: 3 के ग्रुप। BCD: अंक-दर-अंक।','ഹെക്സ്: 4-ന്റെ ഗ്രൂപ്പ്. ഒക്ടൽ: 3-ന്റെ ഗ്രൂപ്പ്. BCD: അക്കം തോറും.'),
 check:{q:L('3A₁₆ in decimal (place values, slide 20) = …','3A₁₆ डेसिमल में (स्थानीय मान, स्लाइड 20) = …','3A₁₆ ഡെസിമലിൽ (സ്ഥാനവില, സ്ലൈഡ് 20) = …'),o:['58','310','48'],a:0},
 build(w,api){

   s+=`<rect x="${178+((t*.8|0)%2)*76}" y="52" width="70" height="26" rx="4" fill="none" stroke="var(--frm)" stroke-width="2"/>`;

/* ---------- 22 Basic gates ---------- */
const truth=(k,A,B)=>{const one=k==='NOT';let r=`<div class="cmp" style="grid-template-columns:repeat(${one?2:3},minmax(0,1fr));margin-top:6px">`+(one?'<div class="hd">A</div><div class="hd">Y</div>':'<div class="hd">A</div><div class="hd">B</div><div class="hd">Y</div>');
 (one?[[0],[1]]:[[0,0],[0,1],[1,0],[1,1]]).forEach(([a,b])=>{const on=a===A&&(one||b===B),st=on?' style="background:rgba(240,140,30,.25);font-weight:700"':'';r+=`<div${st}>${a}</div>`+(one?'':`<div${st}>${b}</div>`)+`<div${st}>${GF[k](a,b)}</div>`});return r+'</div>'};
CS({id:'b_g1',menu:'Logic gates: AND, OR, NOT',title:'t_g1',
 flash:FB('Series and parallel switches (Module 2, slides 5 and 6)','सीरीज़ और पैरेलल स्विच (मॉड्यूल 2, स्लाइड 5 और 6)','സീരീസ്, പാരലൽ സ്വിച്ച് (മൊഡ്യൂൾ 2, സ്ലൈഡ് 5, 6)'),
 hook:L('A press runs only when both hand buttons are pressed. A corridor lamp lights if either switch is on. That is logic.','प्रेस तभी चले जब दोनों हैंड बटन दबें। कॉरिडोर लैंप किसी भी स्विच से जले। यही लॉजिक है।','രണ്ട് ഹാൻഡ് ബട്ടണും അമർത്തുമ്പോൾ മാത്രം പ്രസ്സ് ഓടുന്നു. ഏത് സ്വിച്ചിലും കോറിഡോർ ലാമ്പ് കത്തുന്നു. അതാണ് ലോജിക്.'),
 defn:L('<b>Logic gates</b> work with 1 (high) and 0 (low). <b>AND:</b> output 1 only if all inputs are 1. <b>OR:</b> output 1 if any input is 1. <b>NOT:</b> output is the opposite of the input. A <b>truth table</b> lists the output for every input combination.','<b>लॉजिक गेट</b> 1 (हाई) और 0 (लो) से काम करते हैं। <b>AND:</b> सब इनपुट 1 हों तभी आउटपुट 1। <b>OR:</b> कोई भी इनपुट 1 तो आउटपुट 1। <b>NOT:</b> इनपुट का उल्टा। <b>ट्रुथ टेबल</b> हर इनपुट जोड़ी का आउटपुट बताती है।','<b>ലോജിക് ഗേറ്റ്</b> 1 (ഹൈ), 0 (ലോ) കൊണ്ട് പ്രവർത്തിക്കുന്നു. <b>AND:</b> എല്ലാ ഇൻപുട്ടും 1 ആയാൽ മാത്രം ഔട്ട്പുട്ട് 1. <b>OR:</b> ഏതെങ്കിലും ഇൻപുട്ട് 1 ആയാൽ ഔട്ട്പുട്ട് 1. <b>NOT:</b> ഇൻപുട്ടിന്റെ എതിർ. <b>ട്രൂത്ത് ടേബിൾ</b> ഓരോ ഇൻപുട്ട് കൂട്ടത്തിനും ഔട്ട്പുട്ട് കാണിക്കുന്നു.'),
 play:L('Tap a gate. Tap A and B. Watch the lamp and the lit row of the table.','गेट दबाओ। A और B दबाओ। लैंप और टेबल की जली पंक्ति देखो।','ഗേറ്റ് ടാപ്പ് ചെയ്യൂ. A, B ടാപ്പ് ചെയ്യൂ. ലാമ്പും ടേബിളിലെ തെളിഞ്ഞ വരിയും നോക്കൂ.'),
 pred:{q:L('An AND gate has A = 1 and B = 0. The output is …','AND गेट में A = 1, B = 0। आउटपुट …','AND ഗേറ്റിൽ A = 1, B = 0. ഔട്ട്പുട്ട് …'),o:['0','1',L('half','आधा','പകുതി')],a:0,why:L('AND needs every input at 1.','AND को सब इनपुट 1 चाहिए।','AND-ന് എല്ലാ ഇൻപുട്ടും 1 വേണം.')},
 labels:['truth'],hints:['ser'],rel:{c:['A','B','Y'],h:'Y'},
 fm:['AND: <i>Y</i> = <i>A</i> · <i>B</i>','OR: <i>Y</i> = <i>A</i> + <i>B</i>','NOT: <i>Y</i> = <i>A</i>̅'],
 uses:L('Boolean algebra: · means AND, + means OR, a bar means NOT. Here + is not ordinary addition: 1 + 1 = 1.','बूलियन बीजगणित: · मतलब AND, + मतलब OR, ऊपर लाइन मतलब NOT। यहाँ + आम जोड़ नहीं: 1 + 1 = 1।','ബൂളിയൻ ആൾജിബ്ര: · എന്നാൽ AND, + എന്നാൽ OR, മുകളിൽ വര എന്നാൽ NOT. ഇവിടെ + സാധാരണ കൂട്ടൽ അല്ല: 1 + 1 = 1.'),
 ex:L('Example: two switches in series to a lamp act as AND; two in parallel act as OR.','उदाहरण: लैंप तक सीरीज़ में दो स्विच AND जैसे; पैरेलल में दो OR जैसे।','ഉദാഹരണം: ലാമ്പിലേക്ക് സീരീസിലെ രണ്ട് സ്വിച്ച് AND പോലെ; പാരലലിലെ രണ്ടെണ്ണം OR പോലെ.'),
 trick:L('AND: all. OR: any. NOT: opposite.','AND: सब। OR: कोई भी। NOT: उल्टा।','AND: എല്ലാം. OR: ഏതെങ്കിലും. NOT: എതിർ.'),
 check:{q:L('Two switches in parallel feed a lamp (Module 2). Both are OFF. The lamp, like an OR gate with 0 and 0, is …','लैंप तक दो स्विच पैरेलल में (मॉड्यूल 2)। दोनों OFF। लैंप, OR गेट 0 और 0 की तरह …','ലാമ്പിലേക്ക് രണ്ട് സ്വിച്ച് പാരലലിൽ (മൊഡ്യൂൾ 2). രണ്ടും OFF. ലാമ്പ്, 0, 0 ഉള്ള OR ഗേറ്റ് പോലെ …'),o:[L('OFF (0)','OFF (0)','OFF (0)'),L('ON (1)','ON (1)','ON (1)'),L('half bright','आधा जला','പകുതി തെളിച്ചം')],a:0},
 build(w,api){
  w.innerHTML=S(400,130,`<g id="a"></g>`,'Logic gate with input switches and output lamp')+'<div id="tt"></div>';
  const rd=mkRd(w),c=mkCtl(w);let k='AND',A=1,B=0;const KS=['AND','OR','NOT'];
  modeBtns(c,KS,i=>{k=KS[i];api.redraw()});
  const ba=tog(c,'A',v=>{A=v?1:0;api.redraw()},true),bb=tog(c,'B',v=>{B=v?1:0;api.redraw()});
  return t=>{const Y=GF[k](A,B);let s=gShape(k,170,65,Y)+(k==='NOT'?wr('M100 65H170'):wr('M100 50H172M100 80H172'));
   s+=`<rect x="70" y="${k==='NOT'?52:37}" width="30" height="26" rx="6" fill="${A?'var(--ok)':'var(--mut)'}"/>`+TXC(85,k==='NOT'?70:55,'A '+A,'#fff','13');
   if(k!=='NOT')s+=`<rect x="70" y="67" width="30" height="26" rx="6" fill="${B?'var(--ok)':'var(--mut)'}"/>`+TXC(85,85,'B '+B,'#fff','13');
   s+=wr(`M${k==='NOT'?226:(k==='AND'?230:230)} 65H300`)+`<circle cx="320" cy="65" r="18" fill="${Y?'#ffd23c':'var(--card)'}" stroke="var(--wire)" stroke-width="2.5"/>`+(Y?`<circle cx="320" cy="65" r="30" fill="rgba(255,210,60,.35)"/>`:'')+TXC(320,118,'Y = '+Y,'var(--frm)','16');
   put($('#a',w),s);$('#tt',w).innerHTML=truth(k,A,B);
   setRd(rd,`<span>${k}: ${k==='NOT'?'Y = NOT '+A:'Y = '+A+(k==='AND'?' · ':' + ')+B} = <b>${Y}</b></span>`)}}});

CS({id:'b_g2',menu:'NAND, NOR, XOR and gate ICs',title:'t_g2',
 flash:FB('AND, OR, NOT (slide 22)','AND, OR, NOT (स्लाइड 22)','AND, OR, NOT (സ്ലൈഡ് 22)'),
 hook:L('A whole digital trainer kit can be built from one type of chip: the 7400 NAND.','पूरी डिजिटल ट्रेनर किट एक ही तरह की चिप से बन सकती है: 7400 NAND।','മുഴുവൻ ഡിജിറ്റൽ ട്രെയിനർ കിറ്റും ഒരേ തരം ചിപ്പ് കൊണ്ട് ഉണ്ടാക്കാം: 7400 NAND.'),
 defn:L('<b>NAND</b> = AND then NOT. <b>NOR</b> = OR then NOT. <b>XOR</b>: output 1 when the inputs are different. NAND and NOR are <b>universal gates</b>: any other gate can be built from them alone. TTL ICs: 7400 (four NAND), 7402 (four NOR), 7486 (four XOR); pin 14 = +5 V, pin 7 = ground.','<b>NAND</b> = AND फिर NOT। <b>NOR</b> = OR फिर NOT। <b>XOR</b>: इनपुट अलग हों तो आउटपुट 1। NAND और NOR <b>यूनिवर्सल गेट</b>: इनसे ही कोई भी गेट बन सकता है। TTL IC: 7400 (चार NAND), 7402 (चार NOR), 7486 (चार XOR); पिन 14 = +5 V, पिन 7 = ग्राउंड।','<b>NAND</b> = AND പിന്നെ NOT. <b>NOR</b> = OR പിന്നെ NOT. <b>XOR</b>: ഇൻപുട്ട് വ്യത്യസ്തമായാൽ ഔട്ട്പുട്ട് 1. NAND, NOR <b>യൂണിവേഴ്സൽ ഗേറ്റ്</b>: ഇവ മാത്രം കൊണ്ട് മറ്റേത് ഗേറ്റും ഉണ്ടാക്കാം. TTL IC: 7400 (നാല് NAND), 7402 (നാല് NOR), 7486 (നാല് XOR); പിൻ 14 = +5 V, പിൻ 7 = ഗ്രൗണ്ട്.'),
 play:L('Tap a gate. Tap A and B. Watch the lamp and the truth table.','गेट दबाओ। A और B दबाओ। लैंप और ट्रुथ टेबल देखो।','ഗേറ്റ് ടാപ്പ് ചെയ്യൂ. A, B ടാപ്പ് ചെയ്യൂ. ലാമ്പും ട്രൂത്ത് ടേബിളും നോക്കൂ.'),
 pred:{q:L('Which gates are called universal?','कौन-से गेट यूनिवर्सल कहलाते हैं?','ഏത് ഗേറ്റുകളെ യൂണിവേഴ്സൽ എന്ന് വിളിക്കുന്നു?'),o:[L('NAND and NOR','NAND और NOR','NAND, NOR'),L('AND and OR','AND और OR','AND, OR'),L('XOR and NOT','XOR और NOT','XOR, NOT')],a:0,why:L('With only NAND (or only NOR) you can make NOT, AND and OR.','सिर्फ़ NAND (या सिर्फ़ NOR) से NOT, AND और OR बनते हैं।','NAND മാത്രം (അല്ലെങ്കിൽ NOR മാത്രം) കൊണ്ട് NOT, AND, OR ഉണ്ടാക്കാം.')},
 labels:['univ','truth'],hints:['ser'],rel:{c:['A','B','Y'],h:'Y'},
 fm:['NAND: <i>Y</i> = (<i>A</i> · <i>B</i>)̅','XOR: <i>Y</i> = <i>A</i> ⊕ <i>B</i>'],
 uses:L('⊕ means “different”: 1 when A ≠ B. A bar over a whole bracket inverts the result.','⊕ मतलब “अलग”: A ≠ B तो 1। पूरे ब्रैकेट पर लाइन, परिणाम उल्टा।','⊕ എന്നാൽ “വ്യത്യസ്തം”: A ≠ B ആയാൽ 1. ബ്രാക്കറ്റിന് മുകളിലെ വര ഫലം തിരിക്കുന്നു.'),
 ex:L('Example: tie both inputs of a NAND together and it works as a NOT gate.','उदाहरण: NAND के दोनों इनपुट जोड़ दो, वह NOT गेट बन जाता है।','ഉദാഹരണം: NAND-ന്റെ രണ്ട് ഇൻപുട്ടും ചേർത്താൽ NOT ഗേറ്റ് ആകും.'),
 trick:L('NAND: 0 only when all are 1. XOR: 1 only when they differ.','NAND: सब 1 हों तभी 0। XOR: अलग हों तभी 1।','NAND: എല്ലാം 1 ആയാൽ മാത്രം 0. XOR: വ്യത്യസ്തമായാൽ മാത്രം 1.'),
 check:{q:L('An XOR gate has A = 1 and B = 1. Y = …','XOR गेट में A = 1, B = 1। Y = …','XOR ഗേറ്റിൽ A = 1, B = 1. Y = …'),o:['0','1','2'],a:0},
 build(w,api){

   s+=wr(`M${k==='NAND'||k==='NOR'||k==='XNOR'?242:230} 65H300`)+`<circle cx="320" cy="65" r="18" fill="${Y?'#ffd23c':'var(--card)'}" stroke="var(--wire)" stroke-width="2.5"/>`+(Y?`<circle cx="320" cy="65" r="30" fill="rgba(255,210,60,.35)"/>`:'')+TXC(320,118,'Y = '+Y,'var(--frm)','16')+TXC(200,118,'IC '+GIC[k],'var(--mut)','13');
   put($('#a',w),s);$('#tt',w).innerHTML=truth(k,A,B);

  o:[['Gate drive too low: the MOSFET is only half ON, RDS(on) is high. Fix the gate driver.','गेट ड्राइव कम: MOSFET आधा ON, RDS(on) ज़्यादा। गेट ड्राइवर ठीक करो।','ഗേറ്റ് ഡ്രൈവ് കുറവ്: MOSFET പകുതി ON, RDS(on) കൂടുതൽ. ഗേറ്റ് ഡ്രൈവർ ശരിയാക്കൂ.'],['Load too big','लोड बहुत बड़ा','ലോഡ് വളരെ വലുത്'],['Heat sink loose','हीट सिंक ढीला','ഹീറ്റ് സിങ്ക് അയഞ്ഞത്']],a:0,
  why:['At 4 V the MOSFET is just above threshold, so its resistance is high. Heat = I² × R rises sharply.','4 V पर MOSFET बस थ्रेशोल्ड से ऊपर, रेसिस्टेंस ज़्यादा। गर्मी = I² × R तेज़ी से बढ़ती।','4 V-ൽ MOSFET ത്രെഷോൾഡിന് തൊട്ടുമുകളിൽ, റെസിസ്റ്റൻസ് കൂടുതൽ. ചൂട് = I² × R കുത്തനെ കൂടുന്നു.']}];

SL.push({id:'b_fault',syl:'M12',menu:'Fault Finder: 5 missions',kind:'tip',title:'fault',free:true,noctl:true,
 trick:L('Check the trigger first, then the switch, then the load.','पहले ट्रिगर, फिर स्विच, फिर लोड जाँचो।','ആദ്യം ട്രിഗർ, പിന്നെ സ്വിച്ച്, പിന്നെ ലോഡ് പരിശോധിക്കൂ.'),
 check:{q:L('A MOSFET carries 15 A with RDS(on) = 0.04 Ω. Heat (I²R, Module 2) = …','MOSFET में 15 A, RDS(on) = 0.04 Ω। गर्मी (I²R, मॉड्यूल 2) = …','MOSFET-ൽ 15 A, RDS(on) = 0.04 Ω. ചൂട് (I²R, മൊഡ്യൂൾ 2) = …'),o:['9 W','0.6 W','90 W'],a:0},
 page(w,s,api){
  const FA=FB12;const sv=P.faultF||(P.faultF={});let mi=0,probe=-1;
  const pic=h('div');w.appendChild(pic);const rd=h('div','rd');w.appendChild(rd);
  const draw=()=>{const m=FA[mi];pic.innerHTML=S(400,125,m.pic(probe,!!sv[mi]),'Fault picture');svgLang();watchFit()};
  const sideTop=h('div');s.appendChild(sideTop);const fin=h('div');fin.hidden=true;s.appendChild(fin);
  const show=()=>{const m=FA[mi];probe=-1;rd.innerHTML='';draw();sideTop.innerHTML='';
   sideTop.appendChild(h('div','beat',RD('Mission '+(mi+1)+' of 5','मिशन '+(mi+1)+' / 5','മിഷൻ '+(mi+1)+' / 5')));
   sideTop.appendChild(h('div','hook',`<small>${term('sp')}</small><span>${B3(m.sp)}</span>`));
   sideTop.appendChild(h('div','beat',RD('Tests: tap one at a time','टेस्ट: एक-एक दबाओ','ടെസ്റ്റ്: ഓരോന്നായി ടാപ്പ് ചെയ്യൂ')));
   const tb=h('div','chips');sideTop.appendChild(tb);
   m.tests.forEach((t,k)=>{const b=h('button','btn',B3(t[0]));b.type='button';b.onclick=()=>{probe=k+1;const r=t[1];setRd(rd,`<span>${B3(t[0])} → <b>${Array.isArray(r)?B3(r):r}</b></span>`);draw();dg.hidden=false};tb.appendChild(b)});
   const dg=h('div');dg.hidden=!sv[mi];sideTop.appendChild(dg);
   dg.appendChild(h('div','beat',RD('Your diagnosis','आपका डायग्नोसिस','നിങ്ങളുടെ ഡയഗ്നോസിസ്')));
   const os=h('div','opts');dg.appendChild(os);const fb=h('div','fb');fb.setAttribute('aria-live','polite');dg.appendChild(fb);const nx=h('div');dg.appendChild(nx);
   const done=()=>{fb.className='fb ok';fb.innerHTML=ICO.ok+' '+UIB('ok')+' '+B3(m.why);$$('.opt',os).forEach((x,k)=>{x.disabled=true;if(k===m.a)x.classList.add('right')});draw();
    nx.innerHTML='';const bt=h('button','btn big on');bt.type='button';bt.innerHTML=(mi<4?RD('Next mission','नेक्स्ट मिशन','നെക്സ്റ്റ് മിഷൻ'):RD('Finish','फिनिश','ഫിനിഷ്'))+' →';bt.onclick=()=>{if(mi<4){mi++;show()}else{finish()}};nx.appendChild(bt)};
   m.o.forEach((o,k)=>{const b=h('button','opt',B3(o));b.type='button';b.onclick=()=>{if(k===m.a){sv[mi]=1;save();award(10,'ff'+mi,P.chk);done()}else{b.classList.add('wrong');b.disabled=true;fb.className='fb no';fb.innerHTML=ICO.no+' '+UIB('again')}};os.appendChild(b)});
   if(sv[mi])done();
   api.redraw()};
  const finish=()=>{sideTop.innerHTML='';rd.innerHTML='';pic.innerHTML='';fin.hidden=false;fin.innerHTML='';
   fin.appendChild(h('div','beat',RD('All 5 missions done','सभी 5 मिशन पूरे','5 മിഷനും പൂർത്തിയായി')));
   fin.appendChild(h('div','trick',`<small>${term('rem')}</small>${B3(['Check the trigger first, then the switch, then the load.','पहले ट्रिगर, फिर स्विच, फिर लोड जाँचो।','ആദ്യം ട്രിഗർ, പിന്നെ സ്വിച്ച്, പിന്നെ ലോഡ് പരിശോധിക്കൂ.'])}`));
   fin.appendChild(checkBlock(SL.find(x=>x.id==='b_fault')));
   const nb=h('button','btn big on');nb.type='button';nb.innerHTML=UIB('nx')+' →';nb.onclick=()=>go(cur+1);fin.appendChild(nb)};
  const firstOpen=[0,1,2,3,4].findIndex(i=>!sv[i]);mi=firstOpen<0?4:firstOpen;
  if(firstOpen<0&&Object.keys(sv).length>=5){show();finish()}else show();
  api.setReplay(()=>{})}});

CS({id:'b_viva',menu:'Viva cards',kind:'def',title:'viva',wide:true,hk:undefined,page(w,s,api){
  const C=(q,a)=>[L(q[0],q[1],q[2]),L(a[0],a[1],a[2])];
  flipDeck(w,api,[
   {name:L('L1 Fact','L1 फैक्ट','L1 ഫാക്ട്'),cards:[
    C(['Name the terminals of an SCR.','SCR के टर्मिनल बताओ।','SCR-ന്റെ ടെർമിനൽ പറയൂ.'],['Anode, cathode, gate.','एनोड, कैथोड, गेट।','ആനോഡ്, കാഥോഡ്, ഗേറ്റ്.']),
    C(['What is η of a UJT?','UJT का η क्या है?','UJT-യുടെ η എന്താണ്?'],['Intrinsic standoff ratio, about 0.5–0.8.','इंट्रिंसिक स्टैंडऑफ रेशियो, करीब 0.5–0.8।','ഇൻട്രിൻസിക് സ്റ്റാൻഡ്ഓഫ് റേഷ്യോ, ഏകദേശം 0.5–0.8.']),
    C(['Output pin of IC 741?','IC 741 का आउटपुट पिन?','IC 741-ന്റെ ഔട്ട്പുട്ട് പിൻ?'],['Pin 6.','पिन 6।','പിൻ 6.']),
    C(['Which gates are universal?','कौन-से गेट यूनिवर्सल?','യൂണിവേഴ്സൽ ഗേറ്റ് ഏത്?'],['NAND and NOR.','NAND और NOR।','NAND, NOR.']),
    C(['Decimal 19 in binary?','डेसिमल 19 बाइनरी में?','ഡെസിമൽ 19 ബൈനറിയിൽ?'],['10011.','10011।','10011.'])]},
   {name:L('L2 Why / How','L2 क्यों / कैसे','L2 എന്തുകൊണ്ട് / എങ്ങനെ'),cards:[
    C(['Why does an SCR stay ON after the gate pulse?','गेट पल्स के बाद SCR ON क्यों रहता है?','ഗേറ്റ് പൾസിന് ശേഷം SCR എന്തുകൊണ്ട് ON?'],['Its two internal transistors feed each other base current: it latches.','अंदर के दो ट्रांज़िस्टर एक-दूसरे को बेस करंट देते हैं: लैच।','ഉള്ളിലെ രണ്ട് ട്രാൻസിസ്റ്റർ പരസ്പരം ബേസ് കറന്റ് നൽകുന്നു: ലാച്ച്.']),
    C(['Why is a MOSFET gate current almost zero?','MOSFET गेट करंट लगभग ज़ीरो क्यों?','MOSFET ഗേറ്റ് കറന്റ് ഏതാണ്ട് പൂജ്യം എന്തുകൊണ്ട്?'],['The gate is insulated by oxide; it only charges a tiny capacitance.','गेट ऑक्साइड से इंसुलेटेड; बस छोटा कैपेसिटेंस चार्ज होता है।','ഗേറ്റ് ഓക്സൈഡ് കൊണ്ട് ഇൻസുലേറ്റഡ്; ചെറിയ കപ്പാസിറ്റൻസ് മാത്രം ചാർജ് ആകുന്നു.']),
    C(['How does a dimmer change lamp brightness?','डिमर लैंप की रोशनी कैसे बदलता है?','ഡിമ്മർ ലാമ്പിന്റെ തെളിച്ചം എങ്ങനെ മാറ്റുന്നു?'],['It delays the TRIAC firing angle in each half cycle.','हर हाफ साइकिल में TRIAC का फायरिंग एंगल देर करता है।','ഓരോ ഹാഫ് സൈക്കിളിലും TRIAC ഫയറിംഗ് ആംഗിൾ വൈകിക്കുന്നു.']),
    C(['Why is the − input of an inverting amplifier a virtual ground?','इनवर्टिंग एम्प्लिफायर का − इनपुट वर्चुअल ग्राउंड क्यों?','ഇൻവെർട്ടിംഗ് ആംപ്ലിഫയറിന്റെ − ഇൻപുട്ട് വെർച്വൽ ഗ്രൗണ്ട് എന്തുകൊണ്ട്?'],['Huge gain with negative feedback keeps V− equal to V+ = 0 V.','नेगेटिव फीडबैक के साथ बहुत बड़ा गेन V− को V+ = 0 V के बराबर रखता है।','നെഗറ്റീവ് ഫീഡ്ബാക്കോടെ വലിയ ഗെയിൻ V−-നെ V+ = 0 V-ന് തുല്യമാക്കുന്നു.']),
    C(['Why use an IGBT instead of a BJT in a VFD?','VFD में BJT की जगह IGBT क्यों?','VFD-യിൽ BJT-ക്ക് പകരം IGBT എന്തിന്?'],['Voltage gate drive, fast switching and low conduction loss at high power.','वोल्टेज गेट ड्राइव, तेज़ स्विचिंग, हाई पावर पर कम लॉस।','വോൾട്ടേജ് ഗേറ്റ് ഡ്രൈവ്, വേഗത്തിലുള്ള സ്വിച്ചിംഗ്, ഹൈ പവറിൽ കുറഞ്ഞ നഷ്ടം.'])]},
   {name:L('L3 Workshop','L3 वर्कशॉप','L3 വർക്ക്ഷോപ്പ്'),cards:[
    C(['How do you test an SCR with a multimeter and a battery?','मल्टीमीटर और बैटरी से SCR कैसे टेस्ट करें?','മൾട്ടിമീറ്ററും ബാറ്ററിയും കൊണ്ട് SCR എങ്ങനെ ടെസ്റ്റ് ചെയ്യാം?'],['A–K reads open. Touch the gate to the anode briefly: it latches ON and stays ON after release.','A–K ओपन। गेट को एक पल एनोड से छुआओ: ON लैच होकर छोड़ने पर भी ON।','A–K ഓപ്പൺ. ഗേറ്റ് ഒരു നിമിഷം ആനോഡിൽ തൊടുവിക്കൂ: ON ലാച്ച് ആയി വിട്ടാലും ON.']),
    C(['How do you check a 741 inverting amplifier?','741 इनवर्टिंग एम्प्लिफायर कैसे जाँचें?','741 ഇൻവെർട്ടിംഗ് ആംപ്ലിഫയർ എങ്ങനെ പരിശോധിക്കാം?'],['Check ±15 V on pins 7 and 4, apply a small DC input, and compare Vout with −Rf ÷ Rin × Vin.','पिन 7 और 4 पर ±15 V जाँचो, छोटा DC इनपुट दो, Vout को −Rf ÷ Rin × Vin से मिलाओ।','പിൻ 7, 4-ൽ ±15 V പരിശോധിക്കൂ, ചെറിയ DC ഇൻപുട്ട് നൽകൂ, Vout-നെ −Rf ÷ Rin × Vin-മായി താരതമ്യം ചെയ്യൂ.']),
    C(['How do you verify a 7400 truth table?','7400 का ट्रुथ टेबल कैसे जाँचें?','7400-ന്റെ ട്രൂത്ത് ടേബിൾ എങ്ങനെ പരിശോധിക്കാം?'],['+5 V on pin 14, ground on pin 7. Apply 00, 01, 10, 11 to one gate and check the output with an LED or probe.','पिन 14 पर +5 V, पिन 7 ग्राउंड। एक गेट पर 00, 01, 10, 11 दो, LED या प्रोब से आउटपुट जाँचो।','പിൻ 14-ൽ +5 V, പിൻ 7 ഗ്രൗണ്ട്. ഒരു ഗേറ്റിൽ 00, 01, 10, 11 നൽകി LED അല്ലെങ്കിൽ പ്രോബ് കൊണ്ട് ഔട്ട്പുട്ട് പരിശോധിക്കൂ.'])]}
  ],'m12bviva')}});

CS({id:'b_intv',menu:'Interview cards',kind:'law',title:'interview',wide:true,hk:undefined,page(w,s,api){
  const C=(q,a)=>[L(q[0],q[1],q[2]),L(a[0],a[1],a[2])];
  flipDeck(w,api,[
