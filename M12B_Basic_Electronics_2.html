html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:400 16px/1.35 NL,NG,NM,ND,NK,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bar{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.bar .ttl{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{min-width:44px;min-height:44px;padding:0 12px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--def);border-color:var(--def);color:#fff}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--def);outline-offset:2px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-width:44px;min-height:44px;border:0;background:var(--card);font-weight:700;font-size:14px;padding:0 8px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--def);color:#fff}
#prog{height:6px;background:var(--line);flex:none}#prog i{display:block;height:100%;width:0;background:var(--def);transition:width .25s}
#xp{font-weight:700;font-size:14px;color:var(--frm);display:none}
body.study #xp{display:inline}
#stage{flex:1;min-height:0;overflow:auto;display:flex;touch-action:pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.slide{margin:auto;width:100%;min-height:100%;display:grid;gap:10px;padding:10px 12px 14px;
  grid-template-columns:1fr;grid-template-areas:"head" "vis" "side";align-content:start}
.s-head{grid-area:head;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;border-left:8px solid var(--k);padding-left:10px}
.s-vis{grid-area:vis;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px;position:relative;min-width:0}
.s-vis svg{width:100%;height:auto;max-height:52vh;display:block;touch-action:pan-y pinch-zoom}
.s-side{grid-area:side;display:flex;flex-direction:column;gap:10px;min-width:0}
.kind-def{--k:var(--def);--kb:var(--def-bg)}.kind-law{--k:var(--law);--kb:var(--law-bg)}
.kind-formula{--k:var(--frm);--kb:var(--frm-bg)}.kind-warn{--k:var(--warn);--kb:var(--warn-bg)}.kind-tip{--k:var(--tip);--kb:var(--tip-bg)}
.kind-def .s-vis,.kind-law .s-vis,.kind-formula .s-vis,.kind-warn .s-vis,.kind-tip .s-vis{border-color:var(--k)}
.tag{font-size:14px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--kb);color:var(--k);border:1.5px solid var(--k);white-space:nowrap}
.tag.add{background:#fff6cf;color:#6a4b00;border-color:#d9a400}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tag.add{background:#3a3010;color:#ffd84a;border-color:#a98400}}
:root[data-theme=dark] .tag.add{background:#3a3010;color:#ffd84a;border-color:#a98400}
h2.term{margin:0;font-size:clamp(22px,5.4vw,30px);line-height:1.15}
.t .en{font-weight:700}.t .hi,.t .ml{display:block;font-size:14px;font-weight:400;color:var(--mut);line-height:1.25}
.t .hi,.t .ml{display:none}
h2.term .t .hi,h2.term .t .ml{display:none}
body[data-lang=hi] .t .hi,body[data-lang=all] .t .hi,body[data-lang=ml] .t .ml,body[data-lang=all] .t .ml{display:block}
body[data-lang=hi] h2.term .t .hi,body[data-lang=all] h2.term .t .hi,body[data-lang=ml] h2.term .t .ml,body[data-lang=all] h2.term .t .ml{display:inline;font-size:.7em;font-weight:400;color:var(--mut)}
h2.term .t .hi::before,h2.term .t .ml::before{content:' / ';color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--kb,var(--card));border:1.5px solid var(--k,var(--line));border-radius:10px;padding:6px 10px;font-size:16px;min-width:0}
.chip .sym{display:block;font-size:14px;color:var(--mut);font-weight:600}
.chip .sym sup,.chip .sym sub{font-size:inherit}
.hook{display:flex;gap:8px;align-items:center;font-weight:700;font-size:18px;background:var(--kb);border-radius:10px;padding:8px 10px;border:1.5px dashed var(--k)}
.hook small{font-size:14px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.beat{font-size:14px;font-weight:700;color:var(--mut);margin:0 0 4px}
.pred{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.pred .q{font-weight:700;font-size:18px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:48px;padding:6px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px;touch-action:manipulation;flex:1 1 auto;min-width:88px}

const INL=new Set(['I','B','SUB','SUP','EM','STRONG','SMALL']);
function wrapT(en,hi,ml){const sp=document.createElement('span');sp.className='t';sp.innerHTML=`<span class="en">${en}</span><span class="hi">${hi}</span><span class="ml">${ml}</span>`;return sp}
const SYM=new Set(['Vav','Vrms','Vpp','rms','sin','cos','tan','kWh','kVA','kVAR','kW','Vm','Em','rad','mm','kHz','MHz','Hz','mA','kΩ','MΩ','VAR','RMS','AC','DC','Wb']);
function needs(t){return (t.match(/[A-Za-z]{3,}/g)||[]).filter(w=>!SYM.has(w)).length>=1}
function autoT(root){if(!root)return;
 const els=[...root.querySelectorAll('*')];
 for(const e of els){if(!e.isConnected||e.closest('.t,svg,script,style,textarea'))continue;
  const kids=[...e.childNodes];if(!kids.length)continue;
  const simple=kids.every(n=>n.nodeType===3||(n.nodeType===1&&INL.has(n.tagName)&&[...n.querySelectorAll('*')].every(c=>INL.has(c.tagName))));
  if(simple){const txt=e.textContent;if(!norm(txt))continue;const r=xl(txt);
   if(r){const en=e.innerHTML;e.innerHTML='';e.appendChild(wrapT(en,r[0],r[1]));continue}
   if(needs(txt))MISS.add(norm(txt))
  }else{
   for(const n of kids){if(n.nodeType!==3)continue;const tx=n.textContent;if(!norm(tx))continue;const r=xl(tx);
    if(r){const sp=wrapT(tx.trim(),r[0],r[1]);n.replaceWith(document.createTextNode(' '),sp)}
    else if(needs(tx))MISS.add(norm(tx))}}}}
let xq=false;function xsched(){if(xq)return;xq=true;requestAnimationFrame(()=>{xq=false;autoT(document.getElementById('stage'))})}
function autoInit(){const st=document.getElementById('stage');if(!st||st.__xo)return;st.__xo=1;new MutationObserver(xsched).observe(st,{childList:true,subtree:true,characterData:true});xsched()}

function mkPath(pts){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,L,tot:L[L.length-1]}}
function at(P_,s){s=((s%1)+1)%1;const d=s*P_.tot;let i=1;while(i<P_.L.length-1&&P_.L[i]<d)i++;
  const a=P_.pts[i-1],b=P_.pts[i],k=(d-P_.L[i-1])/((P_.L[i]-P_.L[i-1])||1);return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]}

  const i=h('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=val;i.id=id;i.setAttribute('aria-label',label.replace(/<[^>]+>/g,''));
  const v=$('.val',l);const upd=()=>{v.textContent=fmt(+i.value)};
  i.addEventListener('input',()=>{upd();cb(+i.value)});upd();l.appendChild(i);host.appendChild(l);
  return{get:()=>+i.value,set:x=>{i.value=x;upd()},input:i}}

 const yokeHalf=(top)=>{const y=top?30:172;return `<rect x="84" y="${y}" width="214" height="18" rx="3" fill="${H('yoke')?'#f2b8b3':IRON}" ${hlS(H('yoke'))}/>`+Array.from({length:14},(_,i)=>`<path d="M${90+i*15} ${y+16}l10 -14" stroke="#5d6772" stroke-width="1"/>`).join('')};

 s+=g(0,dn,yokeHalf(false)+pole(false)+`<path d="M96 190h40v10h-40zM246 190h40v10h-40z" fill="${IRON}" stroke="#4a5560" stroke-width="1.5"/>`);

/* ---- end view cross-section: 2-pole, N left, S right. o: rot (rad), cur (−1..1 armature current sign scale), ip (interpoles), cw (compensating), brushAng (deg from vertical), flux mode ---- */
function machineEnd(cx,cy,o){o=o||{};const R1=96,R0=82,ra=48;let s='';
 s+=`<circle cx="${cx}" cy="${cy}" r="${R1}" fill="${IRON}" stroke="#4a5560" stroke-width="1.5"/><circle cx="${cx}" cy="${cy}" r="${R0}" fill="var(--bg)"/>`;
 /* main poles */
 [[-1,'#d9362b','N'],[1,'#2a6fdb','S']].forEach(([sd,col,lb])=>{if(o.nofield){col='#a7b1bb';lb=''}const x0=cx+sd*R0,x1=cx+sd*(ra+8);
  s+=`<path d="M${x0} ${cy-16}L${cx+sd*(ra+22)} ${cy-16}L${cx+sd*(ra+22)} ${cy-34}L${x1} ${cy-40}Q${cx+sd*(ra+4)} ${cy} ${x1} ${cy+40}L${cx+sd*(ra+22)} ${cy+34}L${cx+sd*(ra+22)} ${cy+16}L${x0} ${cy+16}Z" fill="${col}" stroke="#333" stroke-width="1.2"/>`;
  s+=`<rect x="${Math.min(x0,cx+sd*(ra+24))+ (sd<0?2:-2)}" y="${cy-30}" width="${Math.abs(x0-(cx+sd*(ra+24)))-0}" height="12" fill="${CU}" opacity=".95"/><rect x="${Math.min(x0,cx+sd*(ra+24))+(sd<0?2:-2)}" y="${cy+18}" width="${Math.abs(x0-(cx+sd*(ra+24)))}" height="12" fill="${CU}" opacity=".95"/>`;
  s+=TXC(cx+sd*(R0-12),cy+6,lb,'#fff','17');
  if(o.cw){for(let k=-1;k<=1;k++){const yy=cy+k*20,xx=cx+sd*(ra+11);s+=cond(xx,yy,(sd<0?1:-1),5)}}});
 /* interpoles top/bottom */
 if(o.ip){[[-1,'S'],[1,'N']].forEach(([sd,lb])=>{const y0=cy+sd*R0,y1=cy+sd*(ra+8);s+=`<rect x="${cx-9}" y="${Math.min(y0,y1)}" width="18" height="${Math.abs(y0-y1)}" fill="${lb==='N'?'#e98a83':'#8db4ef'}" stroke="#333" stroke-width="1.2"/>`+TXC(cx+22,cy+sd*(ra+22)+5,lb,lb==='N'?'#d9362b':'#2a6fdb','13')})}
 /* armature */
 const th=o.rot||0;s+=`<circle cx="${cx}" cy="${cy}" r="${ra}" fill="${IRON2}" stroke="#4a5560" stroke-width="1.5"/>`;
 const n=o.nocond?0:16;for(let k=0;k<n;k++){const a=th+k*TPI/n,x=cx+(ra-9)*Math.cos(a),y=cy-(ra-9)*Math.sin(a);const sgn=o.cur?(Math.cos(a)>0?1:-1)*(Math.abs(Math.cos(a))>.2?1:0):0;

 s+=`<circle cx="${cx}" cy="${cy}" r="9" fill="#6b7580"/>`;
 /* brushes on the neutral (vertical) shifted by brushAng */
 const ba=(o.brushAng||0);[90,270].forEach(d=>{const p=pos(cx,cy,ra+2,d-ba);s+=`<rect x="${(p[0]-7).toFixed(1)}" y="${(p[1]-7).toFixed(1)}" width="14" height="14" fill="${CARB}" transform="rotate(${-(d-ba)+90} ${p[0].toFixed(1)} ${p[1].toFixed(1)})"/>`});

CS({id:'b_pd',menu:'Power diode',title:'t_pd',
 flash:FB('Diode V-I curve (Module 12A, slide 8); P = V × I (Module 0, slide 24)','डायोड V-I कर्व (मॉड्यूल 12A, स्लाइड 8); P = V × I (मॉड्यूल 0, स्लाइड 24)','ഡയോഡ് V-I കർവ് (മൊഡ്യൂൾ 12A, സ്ലൈഡ് 8); P = V × I (മൊഡ്യൂൾ 0, സ്ലൈഡ് 24)'),

 defn:L('<b>Power diode:</b> a PN diode built for large current and high reverse voltage: big junction, a thick lightly doped N⁻ layer, and a metal case or stud for a heat sink. Key ratings: average forward current IF(AV), peak reverse voltage VRRM and surge current IFSM.','<b>पावर डायोड:</b> बड़े करंट और ज़्यादा रिवर्स वोल्टेज के लिए बना PN डायोड: बड़ा जंक्शन, मोटी हल्की डोप्ड N⁻ लेयर, हीट सिंक के लिए धातु केस या स्टड। मुख्य रेटिंग: औसत फॉरवर्ड करंट IF(AV), पीक रिवर्स वोल्टेज VRRM और सर्ज करंट IFSM।','<b>പവർ ഡയോഡ്:</b> വലിയ കറന്റിനും കൂടിയ റിവേഴ്സ് വോൾട്ടേജിനും നിർമ്മിച്ച PN ഡയോഡ്: വലിയ ജംഗ്ഷൻ, കട്ടിയുള്ള കുറച്ച് ഡോപ്പ് ചെയ്ത N⁻ ലെയർ, ഹീറ്റ് സിങ്കിന് ലോഹ കേസ് അല്ലെങ്കിൽ സ്റ്റഡ്. പ്രധാന റേറ്റിംഗ്: ആവറേജ് ഫോർവേഡ് കറന്റ് IF(AV), പീക്ക് റിവേഴ്സ് വോൾട്ടേജ് VRRM, സർജ് കറന്റ് IFSM.'),
 play:L('Pick a diode. Drag the load current. Watch the heat.','डायोड चुनो। लोड करंट खिसकाओ। गर्मी देखो।','ഡയോഡ് തിരഞ്ഞെടുക്കൂ. ലോഡ് കറന്റ് നീക്കൂ. ചൂട് നോക്കൂ.'),
 pred:{q:L('A small 1N4148 signal diode is put in a 10 A charger. It …','छोटा 1N4148 सिग्नल डायोड 10 A चार्जर में लगाया। यह …','ചെറിയ 1N4148 സിഗ്നൽ ഡയോഡ് 10 A ചാർജറിൽ ഘടിപ്പിച്ചു. ഇത് …'),o:[L('burns out','जल जाता है','കത്തിപ്പോകുന്നു'),L('works well','ठीक चलता है','നന്നായി പ്രവർത്തിക്കുന്നു'),L('stays cold','ठंडा रहता है','തണുത്തിരിക്കുന്നു')],a:0,why:L('Its rating is only about 0.2 A. The junction overheats at 10 A.','इसकी रेटिंग सिर्फ़ करीब 0.2 A। 10 A पर जंक्शन ज़्यादा गरम।','ഇതിന്റെ റേറ്റിംഗ് ഏകദേശം 0.2 A മാത്രം. 10 A-ൽ ജംഗ്ഷൻ അമിതമായി ചൂടാകും.')},
 labels:['hsink'],hints:['vd','vir'],rel:{c:['V','I','P'],h:'P'},
 fm:['<i>P</i> ≈ <i>V</i><sub>F</sub> × <i>I</i><sub>F</sub>'],

 ex:L('Example: a 40 A stud diode with VF = 1.1 V wastes about 44 W. It must sit on a heat sink.','उदाहरण: 40 A स्टड डायोड, VF = 1.1 V, करीब 44 W गर्मी। हीट सिंक ज़रूरी।','ഉദാഹരണം: 40 A സ്റ്റഡ് ഡയോഡ്, VF = 1.1 V, ഏകദേശം 44 W ചൂട്. ഹീറ്റ് സിങ്ക് നിർബന്ധം.'),
 trick:L('Big current, big body, big heat sink.','बड़ा करंट, बड़ी बॉडी, बड़ा हीट सिंक।','വലിയ കറന്റ്, വലിയ ബോഡി, വലിയ ഹീറ്റ് സിങ്ക്.'),
 check:{q:L('A 1N5408 carries 2 A with VF = 0.9 V. Heat (P = V × I) = …','1N5408 में 2 A, VF = 0.9 V। गर्मी (P = V × I) = …','1N5408-ൽ 2 A, VF = 0.9 V. ചൂട് (P = V × I) = …'),o:['1.8 W','0.45 W','18 W'],a:0},
 build(w,api){
  w.innerHTML=S(400,200,`<g id="a"></g>`,'Diode package with load current and temperature');
  const rd=mkRd(w),c=mkCtl(w);let m=1,ii=2;
  modeBtns(c,PDT.map(d=>L(d.n[0],d.n[1],d.n[2])),i=>{m=i;api.redraw()},1);
  slider(c,'I<sub>F</sub>',0,4,1,2,x=>PDI[x]+' A',x=>{ii=x;api.redraw()});
  return t=>{const d=PDT[m],I=PDI[ii],P=d.v*I,load=I/d.r,burn=load>1.5,hot=Math.min(1,load);

   if(m===0)s+=`<path d="M60 90H180" stroke="#aaa" stroke-width="3"/><rect x="100" y="80" width="40" height="20" rx="10" fill="#e9a964" opacity=".8"/><rect x="132" y="80" width="6" height="20" fill="#111"/>`;
   if(m===1)s+=`<path d="M40 90H200" stroke="#aaa" stroke-width="5"/><rect x="85" y="70" width="70" height="40" rx="6" fill="#222"/><rect x="138" y="70" width="10" height="40" fill="#ccc"/>`;
   if(m===2)s+=`<path d="M70 40h100v12H70z" fill="#999"/>${[0,1,2,3,4,5].map(k=>`<rect x="${72+k*16}" y="${52}" width="8" height="40" fill="#aaa"/>`).join('')}<path d="M100 92h40v26h-40z" fill="#b87333"/><path d="M112 118h16v40h-16z" fill="#888"/><path d="M120 158v20" stroke="#aaa" stroke-width="5"/>`+TL(120,30,['heat sink','हीट सिंक','ഹീറ്റ് സിങ്ക്'],'var(--mut)');
   for(let k=0;k<3;k++)if(hot>.15)s+=`<path d="M${95+k*25} 66c-6-8 6-10 0-18" stroke="rgba(217,54,43,${hot.toFixed(2)})" stroke-width="3" fill="none"/>`;
   if(burn)s+=`<circle cx="120" cy="${m===2?100:90}" r="${20+6*Math.sin(t*8)}" fill="rgba(255,90,0,.5)"/>`+TL(120,140,['overheated: fails','ज़्यादा गरम: खराब','അമിത ചൂട്: കേടാകുന്നു'],'var(--no)');
   const th=Math.min(1,load/1.5);s+=`<rect x="300" y="30" width="30" height="140" rx="15" fill="none" stroke="var(--wire)" stroke-width="3"/><rect x="306" y="${164-128*th}" width="18" height="${128*th}" rx="9" fill="${burn?'var(--no)':th>.6?'var(--frm)':'var(--ok)'}"/>`+TL(315,190,['junction heat','जंक्शन गर्मी','ജംഗ്ഷൻ ചൂട്'],'var(--mut)');
   put($('#a',w),s);
   setRd(rd,`<span>${B3(d.n)} · ${RD('rating','रेटिंग','റേറ്റിംഗ്')} ${d.r} A · I = ${I} A</span><span>P ≈ ${d.v} × ${I} = <b>${fm1(P)} W</b>${burn?' · '+RD('far above rating','रेटिंग से बहुत ज़्यादा','റേറ്റിംഗിനേക്കാൾ വളരെ കൂടുതൽ'):''}</span>`)}}});

 hook:L('A small control output must run a 4 A DC motor. One transistor is not enough gain.','छोटा कंट्रोल आउटपुट 4 A DC मोटर चलाए। एक ट्रांज़िस्टर का गेन काफ़ी नहीं।','ചെറിയ കൺട്രോൾ ഔട്ട്പുട്ട് 4 A DC മോട്ടോർ ഓടിക്കണം. ഒരു ട്രാൻസിസ്റ്ററിന്റെ ഗെയിൻ പോരാ.'),

 play:L('Tap Single or Darlington. Drag IB. Watch the motor current.','Single या Darlington दबाओ। IB खिसकाओ। मोटर करंट देखो।','Single അല്ലെങ്കിൽ Darlington ടാപ്പ് ചെയ്യൂ. IB നീക്കൂ. മോട്ടോർ കറന്റ് നോക്കൂ.'),
 pred:{q:L('Two transistors with β = 20 and β = 50 form a Darlington pair. The total gain is about …','β = 20 और β = 50 के दो ट्रांज़िस्टर से डार्लिंगटन। कुल गेन करीब …','β = 20, β = 50 ഉള്ള രണ്ട് ട്രാൻസിസ്റ്റർ ഡാർലിംഗ്ടൺ. ആകെ ഗെയിൻ ഏകദേശം …'),o:['1000','70','30'],a:0,why:L('The gains multiply: 20 × 50 = 1000.','गेन गुणा: 20 × 50 = 1000।','ഗെയിൻ ഗുണിക്കുന്നു: 20 × 50 = 1000.')},
 labels:['darl','hsink'],hints:['beta','sw'],rel:{c:['IB','β','IC'],h:'β'},
 fm:['β = β<sub>1</sub> × β<sub>2</sub>'],
 uses:L('Approximate, active region. A Darlington has two base-emitter drops, so VBE ≈ 1.4 V. Then IC = β × IB (Module 12A, slide 20).','अनुमानित, एक्टिव रीजन। डार्लिंगटन में दो बेस-एमिटर ड्रॉप, तो VBE ≈ 1.4 V। फिर IC = β × IB (मॉड्यूल 12A, स्लाइड 20)।','ഏകദേശം, ആക്ടീവ് റീജിയൻ. ഡാർലിംഗ്ടണിൽ രണ്ട് ബേസ്-എമിറ്റർ ഡ്രോപ്പ്, VBE ≈ 1.4 V. പിന്നെ IC = β × IB (മൊഡ്യൂൾ 12A, സ്ലൈഡ് 20).'),
 ex:L('Example: TIP122 is a Darlington in TO-220 with a gain of at least 1000 at 3 A.','उदाहरण: TIP122, TO-220 में डार्लिंगटन, 3 A पर गेन कम से कम 1000।','ഉദാഹരണം: TIP122, TO-220-ൽ ഡാർലിംഗ്ടൺ, 3 A-ൽ ഗെയിൻ കുറഞ്ഞത് 1000.'),
 trick:L('Darlington: two in one, gains multiply.','डार्लिंगटन: एक में दो, गेन गुणा।','ഡാർലിംഗ്ടൺ: ഒന്നിൽ രണ്ട്, ഗെയിൻ ഗുണിക്കുന്നു.'),
 check:{q:L('A Darlington with β = 1000 must switch a 4 A motor. The base current needed (IC = β × IB) is …','β = 1000 वाला डार्लिंगटन 4 A मोटर चलाए। ज़रूरी बेस करंट (IC = β × IB) …','β = 1000 ഡാർലിംഗ്ടൺ 4 A മോട്ടോർ സ്വിച്ച് ചെയ്യണം. വേണ്ട ബേസ് കറന്റ് (IC = β × IB) …'),o:['4 mA','40 mA','0.4 mA'],a:0},
 build(w,api){

   if(d){s+=symBJT(220,120,0)+symBJT(270,160,0)+wr('M232 140V160H230M282 140V110H232V100M232 100H320V110M282 180V196H120M180 120H120')}
   else{s+=symBJT(270,140,0)+wr('M282 120V110H320M282 160V196H120M230 140H120')}
   s+=`<circle cx="120" cy="${d?120:140}" r="5" fill="var(--def)"/>`+TXC(100,d?108:128,'IB','var(--def)','14');
   if(ib)s+=flowDots([[320,14],[320,110],[282,110],[282,196]],t,Math.round(3+ic*2),'var(--frm)',30+ic*30);

/* ---------- 5 UJT ---------- */
CS({id:'b_ujt',menu:'UJT',title:'t_ujt',
 flash:FB('PN junction and 0.7 V (Module 12A, slides 6 and 8); voltage divider (Module 2, slide 5)','PN जंक्शन और 0.7 V (मॉड्यूल 12A, स्लाइड 6 और 8); वोल्टेज डिवाइडर (मॉड्यूल 2, स्लाइड 5)','PN ജംഗ്ഷൻ, 0.7 V (മൊഡ്യൂൾ 12A, സ്ലൈഡ് 6, 8); വോൾട്ടേജ് ഡിവൈഡർ (മൊഡ്യൂൾ 2, സ്ലൈഡ് 5)'),
 hook:L('An SCR needs a sharp gate pulse at the right moment. A UJT makes such pulses.','SCR को सही समय पर तेज़ गेट पल्स चाहिए। UJT ऐसी पल्स बनाता है।','SCR-ന് ശരിയായ സമയത്ത് മൂർച്ചയുള്ള ഗേറ്റ് പൾസ് വേണം. UJT അത്തരം പൾസ് ഉണ്ടാക്കുന്നു.'),
 defn:L('<b>UJT</b> (unijunction transistor): an N-type bar with two base contacts B1 and B2, and one P-type emitter E: only one PN junction. The bar acts as a voltage divider. The emitter stays OFF until VE reaches the <b>peak point voltage</b> VP; then it conducts suddenly (negative resistance).','<b>UJT</b> (यूनिजंक्शन ट्रांज़िस्टर): N-टाइप बार, दो बेस कॉन्टैक्ट B1 और B2, एक P-टाइप एमिटर E: सिर्फ़ एक PN जंक्शन। बार वोल्टेज डिवाइडर जैसा। VE के <b>पीक पॉइंट वोल्टेज</b> VP तक पहुँचने तक एमिटर OFF; फिर अचानक चालू (नेगेटिव रेसिस्टेंस)।','<b>UJT</b> (യൂണിജംഗ്ഷൻ ട്രാൻസിസ്റ്റർ): N-ടൈപ്പ് ബാർ, രണ്ട് ബേസ് കോൺടാക്ട് B1, B2, ഒരു P-ടൈപ്പ് എമിറ്റർ E: ഒരു PN ജംഗ്ഷൻ മാത്രം. ബാർ വോൾട്ടേജ് ഡിവൈഡർ പോലെ. VE <b>പീക്ക് പോയിന്റ് വോൾട്ടേജ്</b> VP എത്തുന്നത് വരെ എമിറ്റർ OFF; പിന്നെ പെട്ടെന്ന് കണ്ടക്ട് (നെഗറ്റീവ് റെസിസ്റ്റൻസ്).'),
 play:L('Drag VE up slowly. Watch the emitter fire at VP.','VE धीरे-धीरे बढ़ाओ। VP पर एमिटर फायर होता देखो।','VE പതുക്കെ കൂട്ടൂ. VP-യിൽ എമിറ്റർ ഫയർ ആകുന്നത് നോക്കൂ.'),
 pred:{q:L('The emitter voltage rises past the peak point VP. The UJT …','एमिटर वोल्टेज पीक पॉइंट VP से ऊपर। UJT …','എമിറ്റർ വോൾട്ടേജ് പീക്ക് പോയിന്റ് VP കടക്കുന്നു. UJT …'),o:[L('suddenly conducts','अचानक चालू','പെട്ടെന്ന് കണ്ടക്ട് ചെയ്യുന്നു'),L('stays off','OFF रहता है','OFF ആയി തുടരുന്നു'),L('reverses','उल्टा होता है','തിരിയുന്നു')],a:0,why:L('Above VP the emitter junction is forward biased; carriers flood the bar and its resistance falls.','VP से ऊपर एमिटर जंक्शन फॉरवर्ड; कैरियर बार में भरते हैं, रेसिस्टेंस गिरता है।','VP-ന് മുകളിൽ എമിറ്റർ ജംഗ്ഷൻ ഫോർവേഡ്; കാരിയർ ബാറിൽ നിറയുന്നു, റെസിസ്റ്റൻസ് കുറയുന്നു.')},
 labels:['eta','vp'],hints:['vd','ser'],rel:{c:['η','VBB','VP'],h:'VP'},
 fm:['<i>V</i><sub>P</sub> = η <i>V</i><sub>BB</sub> + <i>V</i><sub>D</sub>'],
 uses:L('η = intrinsic standoff ratio, usually 0.5 to 0.8. VBB = voltage between B2 and B1. VD ≈ 0.7 V, the emitter diode drop (Module 12A, slide 8).','η = इंट्रिंसिक स्टैंडऑफ रेशियो, आम तौर पर 0.5 से 0.8। VBB = B2 और B1 के बीच वोल्टेज। VD ≈ 0.7 V, एमिटर डायोड ड्रॉप (मॉड्यूल 12A, स्लाइड 8)।','η = ഇൻട്രിൻസിക് സ്റ്റാൻഡ്ഓഫ് റേഷ്യോ, സാധാരണ 0.5 മുതൽ 0.8. VBB = B2-നും B1-നും ഇടയിലെ വോൾട്ടേജ്. VD ≈ 0.7 V, എമിറ്റർ ഡയോഡ് ഡ്രോപ്പ് (മൊഡ്യൂൾ 12A, സ്ലൈഡ് 8).'),
 ex:L('Example: η = 0.6 and VBB = 15 V: VP = 0.6 × 15 + 0.7 = 9.7 V.','उदाहरण: η = 0.6 और VBB = 15 V: VP = 0.6 × 15 + 0.7 = 9.7 V।','ഉദാഹരണം: η = 0.6, VBB = 15 V: VP = 0.6 × 15 + 0.7 = 9.7 V.'),
 trick:L('One junction, one sudden jump.','एक जंक्शन, एक अचानक छलांग।','ഒരു ജംഗ്ഷൻ, ഒരു പെട്ടെന്നുള്ള ചാട്ടം.'),
 check:{q:L('η = 0.65, VBB = 12 V, VD = 0.7 V. VP = …','η = 0.65, VBB = 12 V, VD = 0.7 V। VP = …','η = 0.65, VBB = 12 V, VD = 0.7 V. VP = …'),o:['8.5 V','7.8 V','12.7 V'],a:0},
 build(w,api){
  w.innerHTML=S(400,210,`<g id="a"></g>`,'UJT bar structure, symbol and emitter characteristic');
  const rd=mkRd(w),c=mkCtl(w);let ve=6;
  slider(c,'V<sub>E</sub>',0,12,1,6,x=>x+' V',x=>{ve=x;api.redraw()});
  return t=>{const VBB=12,eta=.6,VP=eta*VBB+.7,on=ve>=VP;
   let s=`<rect x="60" y="20" width="40" height="160" fill="rgba(42,111,219,.18)" stroke="var(--def)" stroke-width="2"/><rect x="36" y="80" width="24" height="24" fill="rgba(217,54,43,.3)" stroke="var(--no)" stroke-width="2"/>`;
   s+=wr('M80 20V8M80 180V196M36 92H14')+TXC(98,14,'B2','var(--fg)','14')+TXC(98,200,'B1','var(--fg)','14')+TXC(14,80,'E','var(--fg)','14')+TXC(80,104,'N','var(--def)','15')+TXC(48,97,'P','var(--no)','13');
   if(on)s+=flowDots([[14,92],[60,92],[80,180]],t,6,'var(--frm)',80);
   s+=symUJT(160,100)+TXC(196,64,'B2','var(--fg)','13')+TXC(196,140,'B1','var(--fg)','13')+TXC(130,132,'E','var(--fg)','13');
   const ox=240,oy=180,fx=I=>ox+I*1.4,fy=V=>oy-V*12;let d=`M${ox} ${fy(0)}`;
   for(let k=0;k<=20;k++){const v=VP*k/20;d+=`L${fx(k*.3).toFixed(1)} ${fy(v).toFixed(1)}`}
   for(let k=0;k<=20;k++){const I=6+k*5,v=VP-(VP-2)*Math.min(1,(I-6)/50)+Math.max(0,(I-56)*.04);d+=`L${fx(I).toFixed(1)} ${fy(v).toFixed(1)}`}
   s+=`<path d="M${ox} ${oy}H392M${ox} ${oy}V30" stroke="var(--mut)" stroke-width="1.5"/><path d="${d}" stroke="var(--frm)" stroke-width="3" fill="none"/>`+TXC(ox-14,fy(VP)+4,'VP','var(--no)','13')+TXC(ox+100,fy(2)+18,'VV','var(--def)','13')+TXC(386,oy+16,'IE','var(--mut)','13')+TXC(ox-12,36,'VE','var(--mut)','13');
   const pi=on?Math.min(100,6+(ve-VP)*30):ve/VP*6,pv=on?Math.max(2,VP-(VP-2)*Math.min(1,(pi-6)/50)):ve;
   s+=`<circle cx="${fx(pi).toFixed(1)}" cy="${fy(pv).toFixed(1)}" r="7" fill="var(--frm)" stroke="#fff" stroke-width="2"/>`;
   put($('#a',w),s);
   setRd(rd,`<span>VP = 0.6 × 12 + 0.7 = <b>${fm1(VP)} V</b> · VE = ${ve} V</span><span>${on?RD('Fired: emitter conducts, voltage drops toward the valley point.','फायर: एमिटर चालू, वोल्टेज वैली पॉइंट की ओर गिरा।','ഫയർ: എമിറ്റർ കണ്ടക്ട്, വോൾട്ടേജ് വാലി പോയിന്റിലേക്ക് താഴുന്നു.'):RD('Below VP: emitter OFF (only leakage).','VP से नीचे: एमिटर OFF (सिर्फ़ लीकेज)।','VP-ന് താഴെ: എമിറ്റർ OFF (ലീക്കേജ് മാത്രം).')}</span>`)}}});

/* ---------- 6 UJT oscillator ---------- */
const URS=[10,22,47,100];
CS({id:'b_ujto',menu:'UJT triggering circuit',title:'t_ujto',
 flash:FB('RC charging τ = RC (Module 5A, slide 18); UJT (slide 5)','RC चार्जिंग τ = RC (मॉड्यूल 5A, स्लाइड 18); UJT (स्लाइड 5)','RC ചാർജിംഗ് τ = RC (മൊഡ്യൂൾ 5A, സ്ലൈഡ് 18); UJT (സ്ലൈഡ് 5)'),
 hook:L('In a battery charger the UJT fires the SCR gate many times a second. Turn the knob and the timing changes.','बैटरी चार्जर में UJT, SCR गेट को सेकंड में कई बार फायर करता है। नॉब घुमाओ, टाइमिंग बदलती है।','ബാറ്ററി ചാർജറിൽ UJT സെക്കൻഡിൽ പല തവണ SCR ഗേറ്റ് ഫയർ ചെയ്യുന്നു. നോബ് തിരിച്ചാൽ ടൈമിംഗ് മാറുന്നു.'),
 defn:L('<b>Relaxation oscillator:</b> C charges through R. When VC reaches VP the UJT fires and dumps C into R1, giving a sharp pulse at B1. Then the UJT turns off and C charges again. The pulses trigger an SCR or TRIAC.','<b>रिलैक्सेशन ऑसिलेटर:</b> C, R से चार्ज होता है। VC के VP पहुँचते ही UJT फायर होकर C को R1 में खाली करता है, B1 पर तेज़ पल्स। फिर UJT बंद, C फिर चार्ज। ये पल्स SCR या TRIAC को ट्रिगर करती हैं।','<b>റിലാക്സേഷൻ ഓസിലേറ്റർ:</b> C, R വഴി ചാർജ് ആകുന്നു. VC, VP എത്തുമ്പോൾ UJT ഫയർ ആയി C-യെ R1-ലേക്ക് ഒഴിക്കുന്നു, B1-ൽ മൂർച്ചയുള്ള പൾസ്. പിന്നെ UJT ഓഫ്, C വീണ്ടും ചാർജ്. ഈ പൾസ് SCR അല്ലെങ്കിൽ TRIAC ട്രിഗർ ചെയ്യുന്നു.'),
 play:L('Drag R. Watch the saw-tooth on C and the pulses on R1.','R खिसकाओ। C पर आरी जैसी वेव और R1 पर पल्स देखो।','R നീക്കൂ. C-യിലെ അറക്കവാൾ വേവും R1-ലെ പൾസും നോക്കൂ.'),
 pred:{q:L('R is made bigger. The pulses come …','R बड़ा किया। पल्स आती हैं …','R വലുതാക്കി. പൾസ് വരുന്നത് …'),o:[L('less often','कम बार','കുറച്ച് തവണ'),L('more often','ज़्यादा बार','കൂടുതൽ തവണ'),L('at the same rate','उतनी ही बार','അതേ നിരക്കിൽ')],a:0,why:L('Bigger R, bigger RC, slower charging: it takes longer to reach VP.','बड़ा R, बड़ा RC, धीमी चार्जिंग: VP तक पहुँचने में ज़्यादा समय।','വലിയ R, വലിയ RC, പതുക്കെ ചാർജ്: VP എത്താൻ കൂടുതൽ സമയം.')},
 labels:['eta','vp'],hints:['tau','ft'],rel:{c:['R','C','τ','f'],h:'f'},
 fm:['<i>f</i> ≈ 1 ÷ (<i>R</i><i>C</i> ln(1 ÷ (1 − η)))'],
 uses:L('With η ≈ 0.63, ln(1 ÷ (1 − η)) ≈ 1, so f ≈ 1 ÷ RC. R in Ω, C in F. Uses τ = RC (Module 5A, slide 18).','η ≈ 0.63 पर ln(1 ÷ (1 − η)) ≈ 1, तो f ≈ 1 ÷ RC। R Ω में, C F में। τ = RC (मॉड्यूल 5A, स्लाइड 18)।','η ≈ 0.63-ൽ ln(1 ÷ (1 − η)) ≈ 1, അതിനാൽ f ≈ 1 ÷ RC. R Ω-ൽ, C F-ൽ. τ = RC (മൊഡ്യൂൾ 5A, സ്ലൈഡ് 18).'),
 ex:L('Example: R = 10 kΩ, C = 1 µF, η ≈ 0.63: f ≈ 1 ÷ 0.01 = 100 Hz.','उदाहरण: R = 10 kΩ, C = 1 µF, η ≈ 0.63: f ≈ 1 ÷ 0.01 = 100 Hz।','ഉദാഹരണം: R = 10 kΩ, C = 1 µF, η ≈ 0.63: f ≈ 1 ÷ 0.01 = 100 Hz.'),
 trick:L('Charge, fire, dump, repeat.','चार्ज, फायर, खाली, दोहराओ।','ചാർജ്, ഫയർ, ഒഴിക്കൽ, ആവർത്തിക്കൽ.'),
 check:{q:L('R = 22 kΩ, C = 0.47 µF, η ≈ 0.63. f ≈ …','R = 22 kΩ, C = 0.47 µF, η ≈ 0.63। f ≈ …','R = 22 kΩ, C = 0.47 µF, η ≈ 0.63. f ≈ …'),o:['97 Hz','970 Hz','9.7 Hz'],a:0},
 build(w,api){
  w.innerHTML=S(400,215,`<g id="a"></g>`,'UJT relaxation oscillator with capacitor and pulse waves');
  const rd=mkRd(w),c=mkCtl(w);let ri=2;
  slider(c,'R',0,3,1,2,x=>URS[x]+' kΩ',x=>{ri=x;api.redraw()});
  return t=>{const R=URS[ri]*1e3,C=1e-7,f=1/(R*C),sp=Math.sqrt(f/213)*.9;
   let s=wr('M30 14H230M60 14V30M60 70V96M60 136V150H230M230 14V40M230 120V125M230 150V145')+symRes(60,50,90)+symCap(60,116,90)+symUJT(206,80)+wr('M60 96H166')+symRes(230,135,90).replace('','');
   s+=TXC(84,54,'R','var(--fg)','14')+TXC(40,120,'C','var(--fg)','14')+TXC(254,138,'R1','var(--fg)','13')+TXC(260,10,'+12 V','var(--fg)','13');
   const ph=(t*sp)%1;let d1='',d2='';for(let k=0;k<=200;k++){const u=k/200,p=(u*3+ph)%1,vc=1-Math.exp(-p*2.4);d1+=(k?'L':'M')+(20+370*u).toFixed(1)+' '+(185-vc*34).toFixed(1);const pu=p>.95?1:0;d2+=(k?'L':'M')+(20+370*u).toFixed(1)+' '+(210-pu*20).toFixed(1)}
   s+=`<path d="${d1}" stroke="var(--def)" stroke-width="2.5" fill="none"/><path d="${d2}" stroke="var(--no)" stroke-width="2.5" fill="none"/>`+TXC(300,90,'VC','var(--def)','14')+TXC(330,112,'VR1','var(--no)','14');
   put($('#a',w),s);
   setRd(rd,`<span>RC = ${URS[ri]} kΩ × 0.1 µF = ${fm1(R*C*1000)} ms → f ≈ <b>${fm1(f)} Hz</b></span>`)}}});

const VGS=[0,-1,-2,-3,-4];const VGSL=['0','−1','−2','−3','−4'];
CS({id:'b_fet',menu:'JFET',title:'t_fet',
 flash:FB('Reverse bias widens the depletion layer (Module 12A, slide 7)','रिवर्स बायस डिप्लीशन लेयर चौड़ी करता है (मॉड्यूल 12A, स्लाइड 7)','റിവേഴ്സ് ബയസ് ഡിപ്ലീഷൻ ലെയർ വീതി കൂട്ടുന്നു (മൊഡ്യൂൾ 12A, സ്ലൈഡ് 7)'),
 hook:L('A test probe must not load the circuit it measures. A FET input takes almost no current.','टेस्ट प्रोब उस सर्किट पर लोड न डाले जिसे नापे। FET इनपुट लगभग करंट नहीं लेता।','ടെസ്റ്റ് പ്രോബ് അളക്കുന്ന സർക്യൂട്ടിനെ ലോഡ് ചെയ്യരുത്. FET ഇൻപുട്ട് ഏതാണ്ട് കറന്റ് എടുക്കില്ല.'),
 defn:L('<b>FET</b> (field-effect transistor): current flows in a channel from drain (D) to source (S). The gate (G) voltage controls the channel width. It is voltage controlled with a very high input resistance. In a <b>JFET</b> the gate-channel junction is reverse biased.','<b>FET</b> (फील्ड-इफेक्ट ट्रांज़िस्टर): करंट चैनल में ड्रेन (D) से सोर्स (S) तक। गेट (G) वोल्टेज चैनल की चौड़ाई नियंत्रित करता है। वोल्टेज कंट्रोल्ड, बहुत ज़्यादा इनपुट रेसिस्टेंस। <b>JFET</b> में गेट-चैनल जंक्शन रिवर्स बायस्ड।','<b>FET</b> (ഫീൽഡ്-എഫക്ട് ട്രാൻസിസ്റ്റർ): ചാനലിൽ ഡ്രെയിനിൽ (D) നിന്ന് സോഴ്സിലേക്ക് (S) കറന്റ്. ഗേറ്റ് (G) വോൾട്ടേജ് ചാനൽ വീതി നിയന്ത്രിക്കുന്നു. വോൾട്ടേജ് നിയന്ത്രിതം, വളരെ കൂടിയ ഇൻപുട്ട് റെസിസ്റ്റൻസ്. <b>JFET</b>-ൽ ഗേറ്റ്-ചാനൽ ജംഗ്ഷൻ റിവേഴ്സ് ബയസ്.'),
 play:L('Drag VGS more negative. Watch the grey layers squeeze the channel.','VGS को और नेगेटिव करो। स्लेटी लेयर को चैनल दबाते देखो।','VGS കൂടുതൽ നെഗറ്റീവ് ആക്കൂ. ചാര ലെയർ ചാനൽ ഞെരുക്കുന്നത് നോക്കൂ.'),
 pred:{q:L('The gate of an N-channel JFET is made more negative. The drain current …','N-चैनल JFET का गेट और नेगेटिव किया। ड्रेन करंट …','N-ചാനൽ JFET-ന്റെ ഗേറ്റ് കൂടുതൽ നെഗറ്റീവ് ആക്കി. ഡ്രെയിൻ കറന്റ് …'),o:[L('falls','घटता है','കുറയുന്നു'),L('rises','बढ़ता है','കൂടുന്നു'),L('stays the same','वही','അതേ')],a:0,why:L('More reverse bias widens the depletion layers and narrows the channel.','ज़्यादा रिवर्स बायस डिप्लीशन लेयर चौड़ी कर चैनल पतला करता है।','കൂടുതൽ റിവേഴ്സ് ബയസ് ഡിപ്ലീഷൻ ലെയർ വീതി കൂട്ടി ചാനൽ നേർത്തതാക്കുന്നു.')},
 labels:['gate','drain','source'],hints:['vir'],rel:{c:['VGS','VP','ID'],h:'ID'},
 fm:['<i>I</i><sub>D</sub> = <i>I</i><sub>DSS</sub> (1 − <i>V</i><sub>GS</sub> ÷ <i>V</i><sub>P</sub>)²'],
 uses:L('Shockley’s equation for a JFET in saturation. IDSS = drain current at VGS = 0. VP = pinch-off voltage (negative for N-channel).','सैचुरेशन में JFET का शॉकले इक्वेशन। IDSS = VGS = 0 पर ड्रेन करंट। VP = पिंच-ऑफ वोल्टेज (N-चैनल में नेगेटिव)।','സാച്ചുറേഷനിൽ JFET-ന്റെ ഷോക്ലി സമവാക്യം. IDSS = VGS = 0-ൽ ഡ്രെയിൻ കറന്റ്. VP = പിഞ്ച്-ഓഫ് വോൾട്ടേജ് (N-ചാനലിൽ നെഗറ്റീവ്).'),
 ex:L('Example: IDSS = 12 mA, VP = −6 V, VGS = −3 V: ID = 12 × (1 − 0.5)² = 3 mA.','उदाहरण: IDSS = 12 mA, VP = −6 V, VGS = −3 V: ID = 12 × (1 − 0.5)² = 3 mA।','ഉദാഹരണം: IDSS = 12 mA, VP = −6 V, VGS = −3 V: ID = 12 × (1 − 0.5)² = 3 mA.'),
 trick:L('Squeeze the hose, less water flows.','पाइप दबाओ, कम पानी बहे।','ഹോസ് ഞെരുക്കൂ, കുറവ് വെള്ളം ഒഴുകും.'),
 check:{q:L('IDSS = 8 mA, VP = −4 V, VGS = 0 V. ID = …','IDSS = 8 mA, VP = −4 V, VGS = 0 V। ID = …','IDSS = 8 mA, VP = −4 V, VGS = 0 V. ID = …'),o:['8 mA','0 mA','2 mA'],a:0},
 build(w,api){
  w.innerHTML=S(400,200,`<g id="a"></g>`,'JFET channel squeezed by gate depletion layers');
  const rd=mkRd(w),c=mkCtl(w);let gi=1;
  slider(c,'V<sub>GS</sub>',0,4,1,1,x=>VGSL[x]+' V',x=>{gi=x;api.redraw()});
  return t=>{const vg=VGS[gi],ID=10*Math.pow(1-vg/-4,2),wd=10+30*(-vg/4);
   let s=`<rect x="40" y="60" width="240" height="80" fill="rgba(42,111,219,.18)" stroke="var(--def)" stroke-width="2"/>`;
   s+=`<path d="M120 60h80v${wd*.5}q-40 ${wd*.5} -80 0z" fill="rgba(140,140,140,.45)"/><path d="M120 140h80v${-wd*.5}q-40 ${-wd*.5} -80 0z" fill="rgba(140,140,140,.45)"/>`;
   s+=`<rect x="130" y="50" width="60" height="12" fill="rgba(217,54,43,.4)"/><rect x="130" y="138" width="60" height="12" fill="rgba(217,54,43,.4)"/>`+wr('M160 50V30H330M160 150V170H330M40 100H14M280 100H310');
   s+=TXC(22,90,'S','var(--fg)','15')+TXC(300,90,'D','var(--fg)','15')+TXC(340,34,'G','var(--fg)','15')+TXC(340,174,'G','var(--fg)','15');
   if(ID>.05)s+=flowDots([[290,100],[50,100]],t,Math.round(3+ID*.8),'#2a6fdb',20+ID*12);
   s+=symJFET(370,100).replace('','');
   put($('#a',w),s);
   setRd(rd,`<span>IDSS = 10 mA, VP = −4 V · VGS = ${String(vg).replace('-','−')} V → ID = 10 × (1 − (${String(vg).replace('-','−')}) ÷ (−4))² = <b>${fm1(ID)} mA</b></span>${gi===4?`<span>${RD('Pinch-off: the channel is closed.','पिंच-ऑफ: चैनल बंद।','പിഞ്ച്-ഓഫ്: ചാനൽ അടഞ്ഞു.')}</span>`:''}`)}}});

/* ---------- 8 MOSFET ---------- */
CS({id:'b_mos',menu:'MOSFET',title:'t_mos',
 flash:FB('JFET (slide 7); heat = I²R (Module 2, slide 4)','JFET (स्लाइड 7); गर्मी = I²R (मॉड्यूल 2, स्लाइड 4)','JFET (സ്ലൈഡ് 7); ചൂട് = I²R (മൊഡ്യൂൾ 2, സ്ലൈഡ് 4)'),
 hook:L('Inverters and SMPS chargers switch amperes thousands of times a second with MOSFETs.','इन्वर्टर और SMPS चार्जर MOSFET से हज़ारों बार प्रति सेकंड एम्पियर स्विच करते हैं।','ഇൻവെർട്ടറും SMPS ചാർജറും MOSFET കൊണ്ട് സെക്കൻഡിൽ ആയിരക്കണക്കിന് തവണ ആമ്പിയർ സ്വിച്ച് ചെയ്യുന്നു.'),
 defn:L('<b>MOSFET:</b> the gate is insulated from the channel by a thin oxide (SiO₂), so gate current is almost zero. <b>Enhancement</b> type: no channel until VGS passes the threshold Vth. <b>Depletion</b> type: a channel exists at VGS = 0. Fully ON it behaves like a small resistance RDS(on).','<b>MOSFET:</b> गेट पतली ऑक्साइड (SiO₂) से चैनल से इंसुलेटेड, गेट करंट लगभग ज़ीरो। <b>एन्हांसमेंट</b> टाइप: VGS के थ्रेशोल्ड Vth पार करने तक चैनल नहीं। <b>डिप्लीशन</b> टाइप: VGS = 0 पर भी चैनल। पूरा ON होने पर छोटे रेसिस्टेंस RDS(on) जैसा।','<b>MOSFET:</b> ഗേറ്റ് നേർത്ത ഓക്സൈഡ് (SiO₂) കൊണ്ട് ചാനലിൽ നിന്ന് ഇൻസുലേറ്റ് ചെയ്തത്, ഗേറ്റ് കറന്റ് ഏതാണ്ട് പൂജ്യം. <b>എൻഹാൻസ്മെന്റ്</b> ടൈപ്പ്: VGS ത്രെഷോൾഡ് Vth കടക്കുന്നത് വരെ ചാനൽ ഇല്ല. <b>ഡിപ്ലീഷൻ</b> ടൈപ്പ്: VGS = 0-ലും ചാനൽ ഉണ്ട്. പൂർണ്ണ ON-ൽ ചെറിയ റെസിസ്റ്റൻസ് RDS(on) പോലെ.'),
 play:L('Drag VGS from 0 to 10 V. Watch the channel form above Vth.','VGS को 0 से 10 V तक खिसकाओ। Vth के ऊपर चैनल बनता देखो।','VGS 0-ൽ നിന്ന് 10 V വരെ നീക്കൂ. Vth-ന് മുകളിൽ ചാനൽ ഉണ്ടാകുന്നത് നോക്കൂ.'),
 pred:{q:L('An enhancement MOSFET has VGS = 0. The drain current is …','एन्हांसमेंट MOSFET, VGS = 0। ड्रेन करंट …','എൻഹാൻസ്മെന്റ് MOSFET, VGS = 0. ഡ്രെയിൻ കറന്റ് …'),o:[L('zero','ज़ीरो','പൂജ്യം'),L('maximum','मैक्सिमम','പരമാവധി'),L('half','आधा','പകുതി')],a:0,why:L('No channel exists until VGS passes Vth: it is normally OFF.','VGS के Vth पार करने तक चैनल नहीं: सामान्यतः OFF।','VGS, Vth കടക്കുന്നത് വരെ ചാനൽ ഇല്ല: സാധാരണ OFF.')},
 labels:['vth','gate','drain','source'],hints:['vir','sw'],rel:{c:['ID','RDS','P'],h:'P'},
 fm:['<i>P</i> = <i>I</i><sub>D</sub>² × <i>R</i><sub>DS(on)</sub>'],
 uses:L('Conduction heat when fully ON. Uses heat = I²R (Module 2, slide 4). Switching losses come on top at high frequency.','पूरा ON होने पर कंडक्शन गर्मी। गर्मी = I²R (मॉड्यूल 2, स्लाइड 4)। हाई फ्रीक्वेंसी पर स्विचिंग लॉस अलग से।','പൂർണ്ണ ON-ൽ കണ്ടക്ഷൻ ചൂട്. ചൂട് = I²R (മൊഡ്യൂൾ 2, സ്ലൈഡ് 4). ഉയർന്ന ഫ്രീക്വൻസിയിൽ സ്വിച്ചിംഗ് നഷ്ടം കൂടി.'),
 ex:L('Example: ID = 10 A and RDS(on) = 0.03 Ω: P = 100 × 0.03 = 3 W.','उदाहरण: ID = 10 A और RDS(on) = 0.03 Ω: P = 100 × 0.03 = 3 W।','ഉദാഹരണം: ID = 10 A, RDS(on) = 0.03 Ω: P = 100 × 0.03 = 3 W.'),
 note:L('Handle MOSFETs by the body, not the gate: static can puncture the thin oxide. IRFZ44N has Vth of 2–4 V and needs about 10 V for full ON.','MOSFET को बॉडी से पकड़ो, गेट से नहीं: स्टैटिक पतली ऑक्साइड फोड़ सकता है। IRFZ44N का Vth 2–4 V, पूरा ON के लिए करीब 10 V।','MOSFET ബോഡിയിൽ പിടിക്കൂ, ഗേറ്റിൽ അല്ല: സ്റ്റാറ്റിക് നേർത്ത ഓക്സൈഡ് തുളയ്ക്കാം. IRFZ44N-ന്റെ Vth 2–4 V, പൂർണ്ണ ON-ന് ഏകദേശം 10 V.'),
 trick:L('Insulated gate: voltage in, almost no current.','इंसुलेटेड गेट: वोल्टेज अंदर, लगभग करंट नहीं।','ഇൻസുലേറ്റഡ് ഗേറ്റ്: വോൾട്ടേജ് അകത്ത്, ഏതാണ്ട് കറന്റ് ഇല്ല.'),
 check:{q:L('ID = 20 A and RDS(on) = 0.02 Ω. The heat (I²R, Module 2) is …','ID = 20 A और RDS(on) = 0.02 Ω। गर्मी (I²R, मॉड्यूल 2) …','ID = 20 A, RDS(on) = 0.02 Ω. ചൂട് (I²R, മൊഡ്യൂൾ 2) …'),o:['8 W','0.4 W','40 W'],a:0},
 build(w,api){
  w.innerHTML=S(400,200,`<g id="a"></g>`,'Enhancement MOSFET with channel forming under the gate');
  const rd=mkRd(w),c=mkCtl(w);let vg=0;
  slider(c,'V<sub>GS</sub>',0,10,1,0,x=>x+' V',x=>{vg=x;api.redraw()});
  return t=>{const Vth=3,on=vg>Vth,k=on?Math.min(1,(vg-Vth)/5):0,ID=on?Math.min(10,.5*Math.pow(vg-Vth,2)):0;
   let s=`<rect x="40" y="70" width="260" height="100" fill="rgba(217,54,43,.15)" stroke="var(--no)" stroke-width="2"/><rect x="40" y="70" width="60" height="30" fill="rgba(42,111,219,.35)"/><rect x="240" y="70" width="60" height="30" fill="rgba(42,111,219,.35)"/>`;
   s+=`<rect x="110" y="56" width="120" height="10" fill="#e8e0b0" stroke="#887"/><rect x="110" y="40" width="120" height="16" fill="#999"/>`+TXC(170,52,'G','#fff','13')+TXC(70,90,'N+','var(--fg)','13')+TXC(270,90,'N+','var(--fg)','13')+TXC(170,150,'P','var(--no)','15');
   if(on)s+=`<rect x="100" y="70" width="140" height="${(4+10*k).toFixed(1)}" fill="rgba(42,111,219,.55)"/>`+flowDots([[60,85],[280,85]],t,Math.round(3+ID),'#2a6fdb',20+ID*15);
   s+=wr('M70 70V30M270 70V30M170 40V20')+TXC(70,24,'S','var(--fg)','14')+TXC(270,24,'D','var(--fg)','14')+TL(40,62,['oxide','ऑक्साइड','ഓക്സൈഡ്'],'var(--mut)','s').replace('','');
   s+=symMOS(360,110)+TXC(386,72,'D','var(--fg)','13')+TXC(386,154,'S','var(--fg)','13')+TXC(320,116,'G','var(--fg)','13');
   s+=TXC(170,192,on?'ID ≈ '+fm1(ID)+' A':'ID = 0',on?'var(--def)':'var(--mut)','16');
   put($('#a',w),s);
   setRd(rd,`<span>Vth = 3 V · VGS = ${vg} V → ${on?RD('channel formed: ON','चैनल बना: ON','ചാനൽ ഉണ്ടായി: ON'):RD('no channel: OFF','चैनल नहीं: OFF','ചാനൽ ഇല്ല: OFF')}</span>`)}}});

CS({id:'b_famp',menu:'FET and MOSFET as an amplifier',title:'t_famp',
 flash:FB('CE amplifier inverts (Module 12A, slide 23); JFET and MOSFET (slides 7 and 8)','CE एम्प्लिफायर उल्टा करता है (मॉड्यूल 12A, स्लाइड 23); JFET और MOSFET (स्लाइड 7 और 8)','CE ആംപ്ലിഫയർ തിരിക്കുന്നു (മൊഡ്യൂൾ 12A, സ്ലൈഡ് 23); JFET, MOSFET (സ്ലൈഡ് 7, 8)'),
 hook:L('A guitar pickup or a pH probe gives a tiny signal and cannot supply current. A FET amplifier reads it without loading it.','गिटार पिकअप या pH प्रोब छोटा सिग्नल देता, करंट नहीं दे सकता। FET एम्प्लिफायर बिना लोड डाले पढ़ता है।','ഗിറ്റാർ പിക്കപ്പ് അല്ലെങ്കിൽ pH പ്രോബ് ചെറിയ സിഗ്നൽ തരുന്നു, കറന്റ് നൽകാനാവില്ല. FET ആംപ്ലിഫയർ ലോഡ് ചെയ്യാതെ വായിക്കുന്നു.'),
 defn:L('<b>Common-source amplifier:</b> the FET version of CE. A small gate voltage change makes a drain current change: <b>transconductance</b> gm = ΔID ÷ ΔVGS (siemens). This current through RD gives a larger, inverted output voltage.','<b>कॉमन-सोर्स एम्प्लिफायर:</b> CE का FET रूप। छोटा गेट वोल्टेज बदलाव ड्रेन करंट बदलता है: <b>ट्रांसकंडक्टेंस</b> gm = ΔID ÷ ΔVGS (सीमेंस)। यह करंट RD में बड़ा, उल्टा आउटपुट वोल्टेज देता है।','<b>കോമൺ-സോഴ്സ് ആംപ്ലിഫയർ:</b> CE-യുടെ FET രൂപം. ചെറിയ ഗേറ്റ് വോൾട്ടേജ് മാറ്റം ഡ്രെയിൻ കറന്റ് മാറ്റുന്നു: <b>ട്രാൻസ്കണ്ടക്ടൻസ്</b> gm = ΔID ÷ ΔVGS (സീമെൻസ്). ഈ കറന്റ് RD-യിൽ വലിയ, തലകീഴായ ഔട്ട്പുട്ട് വോൾട്ടേജ് തരുന്നു.'),
 play:L('Drag RD. Compare the input and output waves.','RD खिसकाओ। इनपुट और आउटपुट वेव मिलाओ।','RD നീക്കൂ. ഇൻപുട്ട്, ഔട്ട്പുട്ട് വേവ് താരതമ്യം ചെയ്യൂ.'),
 pred:{q:L('In a common-source stage the output, compared with the input, is …','कॉमन-सोर्स स्टेज में आउटपुट इनपुट की तुलना में …','കോമൺ-സോഴ്സ് സ്റ്റേജിൽ ഔട്ട്പുട്ട് ഇൻപുട്ടുമായി നോക്കുമ്പോൾ …'),o:[L('inverted (180°)','उल्टा (180°)','തലകീഴ് (180°)'),L('in phase','इन-फेज़','ഇൻ-ഫേസ്'),L('90° ahead','90° आगे','90° മുന്നിൽ')],a:0,why:L('Gate up → more ID → more drop on RD → drain voltage down, just like CE.','गेट ऊपर → ज़्यादा ID → RD पर ज़्यादा ड्रॉप → ड्रेन वोल्टेज नीचे, CE जैसा।','ഗേറ്റ് മുകളിൽ → കൂടുതൽ ID → RD-യിൽ കൂടുതൽ ഡ്രോപ്പ് → ഡ്രെയിൻ വോൾട്ടേജ് താഴെ, CE പോലെ.')},
 labels:['gm','gain'].filter(k=>T[k]),hints:['av','ph'],rel:{c:['gm','RD','Av'],h:'Av'},
 fm:['<i>A</i><sub>v</sub> = − <i>g</i><sub>m</sub> × <i>R</i><sub>D</sub>'],
 uses:L('Common source, source resistor bypassed, no load. gm in siemens (S), RD in ohm. The minus sign is the 180° inversion.','कॉमन सोर्स, सोर्स रेसिस्टर बायपास, बिना लोड। gm सीमेंस (S) में, RD ओम में। माइनस = 180° उल्टा।','കോമൺ സോഴ്സ്, സോഴ്സ് റെസിസ്റ്റർ ബൈപ്പാസ്, ലോഡില്ലാതെ. gm സീമെൻസിൽ (S), RD ഓമിൽ. മൈനസ് = 180° തിരിവ്.'),
 ex:L('Example: gm = 5 mS and RD = 3.3 kΩ: Av = −0.005 × 3300 = −16.5.','उदाहरण: gm = 5 mS और RD = 3.3 kΩ: Av = −0.005 × 3300 = −16.5।','ഉദാഹരണം: gm = 5 mS, RD = 3.3 kΩ: Av = −0.005 × 3300 = −16.5.'),
 trick:L('Volts in, current out, volts again across RD.','वोल्ट अंदर, करंट बाहर, RD पर फिर वोल्ट।','വോൾട്ട് അകത്ത്, കറന്റ് പുറത്ത്, RD-യിൽ വീണ്ടും വോൾട്ട്.'),
 check:{q:L('gm = 2 mS and RD = 10 kΩ. The size of the gain |Av| is …','gm = 2 mS और RD = 10 kΩ। गेन |Av| …','gm = 2 mS, RD = 10 kΩ. ഗെയിൻ |Av| …'),o:['20','5','200'],a:0},
 build(w,api){
  w.innerHTML=S(400,200,`<g id="a"></g>`,'Common-source FET amplifier with input and output waves');
  const rd=mkRd(w),c=mkCtl(w);let ri=1;
  slider(c,'R<sub>D</sub>',0,2,1,1,x=>RDS[x]+' kΩ',x=>{ri=x;api.redraw()});
  return t=>{const gm=4e-3,Av=gm*RDS[ri]*1000,ph=(t*.4)%1;
   let s=symMOS(200,110)+wr('M212 70V60M212 150V180H120M160 122H130M212 14V20')+symRes(212,40,90)+wr('M212 70H260')+`<circle cx="260" cy="70" r="5" fill="var(--frm)"/>`+TXC(236,44,'RD','var(--fg)','13')+TXC(240,10,'+15 V','var(--fg)','13');
   s+=`<path d="M100 180h40" stroke="var(--wire)" stroke-width="2.5"/>`+`<circle cx="126" cy="122" r="5" fill="var(--def)"/>`;
   s+=`<path d="${wpath(20,122,96,8,u=>Math.sin(TPI*(2*u-ph)))}" stroke="var(--def)" stroke-width="2.5" fill="none"/>`+TXC(64,150,'50 mV','var(--def)','13');
   s+=`<path d="${wpath(272,70,120,Math.min(48,Av*2.2),u=>-Math.sin(TPI*(2*u-ph)))}" stroke="var(--frm)" stroke-width="2.5" fill="none"/>`+TXC(332,140,fm1(.05*Av)+' V','var(--frm)','14');
   put($('#a',w),s);
   setRd(rd,`<span>gm = 4 mS · Av = −0.004 × ${RDS[ri]*1000} = <b>−${fm1(Av)}</b> · 180°</span>`)}}});

/* ---------- 10 SCR ---------- */
const IGS=[0,1,2,5];
CS({id:'b_scr',menu:'SCR (thyristor)',title:'t_scr',
 flash:FB('PN junction (Module 12A, slide 6); transistor action (Module 12A, slide 20)','PN जंक्शन (मॉड्यूल 12A, स्लाइड 6); ट्रांज़िस्टर एक्शन (मॉड्यूल 12A, स्लाइड 20)','PN ജംഗ്ഷൻ (മൊഡ്യൂൾ 12A, സ്ലൈഡ് 6); ട്രാൻസിസ്റ്റർ ആക്ഷൻ (മൊഡ്യൂൾ 12A, സ്ലൈഡ് 20)'),
 hook:L('Battery chargers, DC drives and soft starters control big power with SCRs.','बैटरी चार्जर, DC ड्राइव और सॉफ्ट स्टार्टर SCR से बड़ी पावर कंट्रोल करते हैं।','ബാറ്ററി ചാർജർ, DC ഡ്രൈവ്, സോഫ്റ്റ് സ്റ്റാർട്ടർ SCR കൊണ്ട് വലിയ പവർ നിയന്ത്രിക്കുന്നു.'),
 defn:L('<b>SCR</b> (silicon controlled rectifier, thyristor): four layers P-N-P-N, terminals anode (A), cathode (K) and gate (G). Forward biased, it blocks until a gate pulse turns it ON. Then it <b>latches</b>: it stays ON until the current falls below the <b>holding current</b>.','<b>SCR</b> (सिलिकॉन कंट्रोल्ड रेक्टिफायर, थाइरिस्टर): चार लेयर P-N-P-N, टर्मिनल एनोड (A), कैथोड (K), गेट (G)। फॉरवर्ड बायस में गेट पल्स मिलने तक रोकता है, फिर ON। फिर <b>लैच</b>: करंट <b>होल्डिंग करंट</b> से नीचे जाने तक ON रहता है।','<b>SCR</b> (സിലിക്കൺ കൺട്രോൾഡ് റെക്ടിഫയർ, തൈറിസ്റ്റർ): നാല് ലെയർ P-N-P-N, ടെർമിനൽ ആനോഡ് (A), കാഥോഡ് (K), ഗേറ്റ് (G). ഫോർവേഡ് ബയസിൽ ഗേറ്റ് പൾസ് വരെ തടയുന്നു, പിന്നെ ON. പിന്നെ <b>ലാച്ച്</b>: കറന്റ് <b>ഹോൾഡിംഗ് കറന്റിന്</b> താഴെ ആകുന്നത് വരെ ON.'),
 play:L('Drag the gate current IG. Watch the breakover point move down.','गेट करंट IG खिसकाओ। ब्रेकओवर पॉइंट नीचे खिसकता देखो।','ഗേറ്റ് കറന്റ് IG നീക്കൂ. ബ്രേക്ക്ഓവർ പോയിന്റ് താഴേക്ക് നീങ്ങുന്നത് നോക്കൂ.'),
 pred:{q:L('A short gate pulse is given to a forward-biased SCR, then removed. The SCR …','फॉरवर्ड बायस्ड SCR को छोटी गेट पल्स दी, फिर हटाई। SCR …','ഫോർവേഡ് ബയസ് SCR-ന് ചെറിയ ഗേറ്റ് പൾസ് കൊടുത്ത് മാറ്റി. SCR …'),o:[L('turns ON and stays ON','ON होकर ON रहता है','ON ആയി ON ആയി തുടരുന്നു'),L('turns ON, then OFF','ON फिर OFF','ON, പിന്നെ OFF'),L('stays OFF','OFF रहता है','OFF ആയി തുടരുന്നു')],a:0,why:L('Once ON, the two inner transistors keep each other ON: it latches.','एक बार ON, अंदर के दो ट्रांज़िस्टर एक-दूसरे को ON रखते हैं: लैच।','ഒരിക്കൽ ON, ഉള്ളിലെ രണ്ട് ട്രാൻസിസ്റ്റർ പരസ്പരം ON ആക്കി നിർത്തുന്നു: ലാച്ച്.')},
 labels:['latch','hold','vbo'],hints:['beta','vd'],rel:{c:['IG','VBO','IH'],h:'VBO'},
 ex:L('Example: in an AC circuit the SCR turns off by itself at the end of each half cycle, when the current passes through zero (natural commutation).','उदाहरण: AC सर्किट में हर हाफ साइकिल के अंत में करंट ज़ीरो से गुज़रते ही SCR खुद बंद होता है (नेचुरल कम्यूटेशन)।','ഉദാഹരണം: AC സർക്യൂട്ടിൽ ഓരോ ഹാഫ് സൈക്കിളിന്റെയും അവസാനം കറന്റ് പൂജ്യം കടക്കുമ്പോൾ SCR തനിയെ ഓഫ് ആകുന്നു (നാച്ചുറൽ കമ്മ്യൂട്ടേഷൻ).'),
 trick:L('Gate turns it on. Only low current turns it off.','गेट ON करता है। सिर्फ़ कम करंट OFF करता है।','ഗേറ്റ് ON ആക്കുന്നു. കുറഞ്ഞ കറന്റ് മാത്രം OFF ആക്കുന്നു.'),
 check:{q:L('An SCR is ON with 2 A in a DC circuit. The gate signal is removed. The SCR …','DC सर्किट में SCR 2 A पर ON। गेट सिग्नल हटाया। SCR …','DC സർക്യൂട്ടിൽ SCR 2 A-ൽ ON. ഗേറ്റ് സിഗ്നൽ മാറ്റി. SCR …'),o:[L('stays ON','ON रहता है','ON ആയി തുടരുന്നു'),L('turns OFF','OFF हो जाता है','OFF ആകുന്നു'),L('reverses','उल्टा','തിരിയുന്നു')],a:0},
 build(w,api){
  w.innerHTML=S(400,215,`<g id="a"></g>`,'SCR layers, symbol and forward characteristic for different gate currents');
  const rd=mkRd(w),c=mkCtl(w);let gi=0;
  slider(c,'I<sub>G</sub>',0,3,1,0,x=>IGS[x]+' mA',x=>{gi=x;api.redraw()});
  return t=>{const VBO=[400,300,200,40][gi];
   let s='';['P','N','P','N'].forEach((l,i)=>{s+=`<rect x="${20+i*30}" y="40" width="30" height="50" fill="${l==='P'?'rgba(217,54,43,.2)':'rgba(42,111,219,.2)'}" stroke="var(--wire)" stroke-width="1.5"/>`+TXC(35+i*30,70,l,'var(--fg)','14')});
   s+=wr('M20 65H6M140 65H154M110 90V108')+TXC(10,56,'A','var(--fg)','14')+TXC(150,56,'K','var(--fg)','14')+TXC(122,110,'G','var(--fg)','14')+symSCR(80,160,0)+TXC(116,190,'G','var(--fg)','13');
   const ox=200,oy=180,fx=I=>ox+I*1.8,fy=V=>oy-V*.33;let d=`M${ox} ${oy}`;
   for(let k=0;k<=20;k++){const v=VBO*k/20;d+=`L${fx(k*.15).toFixed(1)} ${fy(v).toFixed(1)}`}
   d+=`L${fx(5).toFixed(1)} ${fy(2).toFixed(1)}L${fx(100).toFixed(1)} ${fy(8).toFixed(1)}`;
   s+=`<path d="M${ox} ${oy}H392M${ox} ${oy}V20" stroke="var(--mut)" stroke-width="1.5"/><path d="${d}" stroke="var(--frm)" stroke-width="3" fill="none"/>`+TXC(ox+30,fy(VBO)+4,'VBO','var(--no)','13')+TXC(386,oy+16,'IA','var(--mut)','13')+TXC(ox-14,30,'VAK','var(--mut)','12')+TL(330,oy-14,['ON state','ON स्टेट','ON സ്റ്റേറ്റ്'],'var(--ok)');
   put($('#a',w),s);
   setRd(rd,`<span>IG = ${IGS[gi]} mA → ${RD('breakover at about','ब्रेकओवर करीब','ബ്രേക്ക്ഓവർ ഏകദേശം')} <b>${VBO} V</b> (${RD('example values','उदाहरण वैल्यू','ഉദാഹരണ വിലകൾ')})</span><span>${RD('More gate current: the SCR turns on at a lower voltage.','ज़्यादा गेट करंट: SCR कम वोल्टेज पर ON।','കൂടുതൽ ഗേറ്റ് കറന്റ്: SCR കുറഞ്ഞ വോൾട്ടേജിൽ ON.')}</span>`)}}});

/* ---------- 11 SCR phase control ---------- */
const ALS=[30,60,90,120,150];
CS({id:'b_scrc',menu:'SCR phase control',title:'t_scrc',
 flash:FB('Half-wave rectifier Vdc = Vm ÷ π (Module 12A, slide 12); SCR latching (slide 10)','हाफ-वेव रेक्टिफायर Vdc = Vm ÷ π (मॉड्यूल 12A, स्लाइड 12); SCR लैचिंग (स्लाइड 10)','ഹാഫ്-വേവ് റെക്ടിഫയർ Vdc = Vm ÷ π (മൊഡ്യൂൾ 12A, സ്ലൈഡ് 12); SCR ലാച്ചിംഗ് (സ്ലൈഡ് 10)'),
 hook:L('A battery charger knob sets the charging current. Inside, it only changes when the SCR is fired.','बैटरी चार्जर का नॉब चार्जिंग करंट तय करता है। अंदर यह बस SCR फायर होने का समय बदलता है।','ബാറ്ററി ചാർജറിന്റെ നോബ് ചാർജിംഗ് കറന്റ് നിശ്ചയിക്കുന്നു. ഉള്ളിൽ SCR ഫയർ ചെയ്യുന്ന സമയം മാത്രം മാറുന്നു.'),
 defn:L('<b>Phase control:</b> the SCR is fired at a <b>firing angle</b> α after each positive zero crossing. It conducts from α to 180°. A larger α gives a smaller part of the wave, so less average voltage and power.','<b>फेज़ कंट्रोल:</b> हर पॉज़िटिव ज़ीरो क्रॉसिंग के बाद <b>फायरिंग एंगल</b> α पर SCR फायर। α से 180° तक चालू। बड़ा α, वेव का छोटा हिस्सा, कम औसत वोल्टेज और पावर।','<b>ഫേസ് കൺട്രോൾ:</b> ഓരോ പോസിറ്റീവ് സീറോ ക്രോസിംഗിനും ശേഷം <b>ഫയറിംഗ് ആംഗിളിൽ</b> α SCR ഫയർ. α മുതൽ 180° വരെ കണ്ടക്ട്. വലിയ α, വേവിന്റെ ചെറിയ ഭാഗം, കുറഞ്ഞ ആവറേജ് വോൾട്ടേജും പവറും.'),
 play:L('Drag α. Watch the shaded part and the lamp.','α खिसकाओ। छायांकित हिस्सा और लैंप देखो।','α നീക്കൂ. ഷേഡ് ചെയ്ത ഭാഗവും ലാമ്പും നോക്കൂ.'),
 pred:{q:L('The firing angle α is increased. The lamp …','फायरिंग एंगल α बढ़ाया। लैंप …','ഫയറിംഗ് ആംഗിൾ α കൂട്ടി. ലാമ്പ് …'),o:[L('gets dimmer','धीमा होता है','മങ്ങുന്നു'),L('gets brighter','तेज़ होता है','തെളിയുന്നു'),L('does not change','नहीं बदलता','മാറുന്നില്ല')],a:0,why:L('Later firing means a smaller part of each half cycle reaches the lamp.','देर से फायर, हर हाफ साइकिल का छोटा हिस्सा लैंप तक।','വൈകി ഫയർ, ഓരോ ഹാഫ് സൈക്കിളിന്റെയും ചെറിയ ഭാഗം ലാമ്പിലേക്ക്.')},
 labels:['alpha'],hints:['hw','rms'],rel:{c:['Vm','α','Vdc'],h:'Vdc'},

 ex:L('Example: 230 V mains (Vm = 325 V), α = 60°: Vdc = (325 ÷ 6.28) × 1.5 ≈ 77.6 V.','उदाहरण: 230 V मेन (Vm = 325 V), α = 60°: Vdc = (325 ÷ 6.28) × 1.5 ≈ 77.6 V।','ഉദാഹരണം: 230 V മെയിൻ (Vm = 325 V), α = 60°: Vdc = (325 ÷ 6.28) × 1.5 ≈ 77.6 V.'),
 trick:L('Fire early, more power. Fire late, less power.','जल्दी फायर, ज़्यादा पावर। देर से, कम।','നേരത്തെ ഫയർ, കൂടുതൽ പവർ. വൈകി, കുറവ്.'),
 check:{q:L('Firing at α = 0° on 230 V mains gives Vdc = Vm ÷ π ≈ …','230 V मेन पर α = 0° फायरिंग से Vdc = Vm ÷ π ≈ …','230 V മെയിനിൽ α = 0° ഫയറിംഗിൽ Vdc = Vm ÷ π ≈ …'),o:['103 V','207 V','51.7 V'],a:0},

CS({id:'b_diac',menu:'DIAC',title:'t_diac',

 hook:L('Open a fan regulator: next to the TRIAC sits a tiny glass part with no markings on either end. It is a DIAC.','फैन रेगुलेटर खोलो: TRIAC के पास दोनों सिरों पर बिना निशान का छोटा ग्लास पार्ट। यह DIAC है।','ഫാൻ റെഗുലേറ്റർ തുറക്കൂ: TRIAC-ന് അടുത്ത് രണ്ടറ്റത്തും അടയാളമില്ലാത്ത ചെറിയ ഗ്ലാസ് ഭാഗം. അത് DIAC.'),

 play:L('Drag V from −40 to +40 V. Watch the dot jump at ±VBO.','V को −40 से +40 V तक खिसकाओ। ±VBO पर डॉट उछलता देखो।','V −40 മുതൽ +40 V വരെ നീക്കൂ. ±VBO-യിൽ ഡോട്ട് ചാടുന്നത് നോക്കൂ.'),
 pred:{q:L('A DIAC has no gate. It turns ON when …','DIAC का गेट नहीं। यह ON होता है जब …','DIAC-ന് ഗേറ്റ് ഇല്ല. ഇത് ON ആകുന്നത് …'),o:[L('the voltage passes VBO in either direction','वोल्टेज किसी भी दिशा में VBO पार करे','വോൾട്ടേജ് ഏത് ദിശയിലും VBO കടക്കുമ്പോൾ'),L('only positive voltage is applied','सिर्फ़ पॉज़िटिव वोल्टेज पर','പോസിറ്റീവ് വോൾട്ടേജ് മാത്രം'),L('it gets warm','गरम होने पर','ചൂടാകുമ്പോൾ')],a:0,why:L('It is symmetrical: the same breakover in both directions.','यह सिमेट्रिकल है: दोनों दिशाओं में वही ब्रेकओवर।','ഇത് സിമെട്രിക്കൽ: രണ്ട് ദിശയിലും അതേ ബ്രേക്ക്ഓവർ.')},
 labels:['vbo'],hints:['rms'],rel:{c:['V','VBO','I'],h:'VBO'},
 ex:L('Example: the common DB3 DIAC breaks over at about 32 V (28–36 V).','उदाहरण: आम DB3 DIAC करीब 32 V (28–36 V) पर ब्रेकओवर।','ഉദാഹരണം: സാധാരണ DB3 DIAC ഏകദേശം 32 V-ൽ (28–36 V) ബ്രേക്ക്ഓവർ.'),
 trick:L('DIAC: two ways, no gate, about 30 V.','DIAC: दोनों तरफ़, गेट नहीं, करीब 30 V।','DIAC: രണ്ട് വഴി, ഗേറ്റ് ഇല്ല, ഏകദേശം 30 V.'),
 check:{q:L('A DB3 is across a capacitor charging up from 0 V. It fires when VC reaches about …','DB3 एक कैपेसिटर पर, जो 0 V से चार्ज हो रहा। VC करीब कितने पर फायर?','0 V-ൽ നിന്ന് ചാർജ് ആകുന്ന കപ്പാസിറ്ററിന് കുറുകെ DB3. VC ഏകദേശം എത്രയിൽ ഫയർ?'),o:['32 V','0.7 V','230 V'],a:0},
 build(w,api){

   s+=`<path d="${d}" stroke="var(--frm)" stroke-width="3" fill="none"/>`+TXC(fx(32),oy+18,'+VBO','var(--no)','13')+TXC(fx(-32),oy-8,'−VBO','var(--no)','13');

CS({id:'b_triac',menu:'TRIAC and dimmer',title:'t_triac',
 flash:FB('SCR phase control (slide 11); DIAC (slide 12); RC charging (Module 5A, slide 18)','SCR फेज़ कंट्रोल (स्लाइड 11); DIAC (स्लाइड 12); RC चार्जिंग (मॉड्यूल 5A, स्लाइड 18)','SCR ഫേസ് കൺട്രോൾ (സ്ലൈഡ് 11); DIAC (സ്ലൈഡ് 12); RC ചാർജിംഗ് (മൊഡ്യൂൾ 5A, സ്ലൈഡ് 18)'),
 hook:L('An electronic fan regulator gives smooth speed control with no hot resistor. It uses a TRIAC.','इलेक्ट्रॉनिक फैन रेगुलेटर बिना गरम रेसिस्टर के स्मूथ स्पीड देता है। इसमें TRIAC है।','ഇലക്ട്രോണിക് ഫാൻ റെഗുലേറ്റർ ചൂടാകുന്ന റെസിസ്റ്റർ ഇല്ലാതെ സുഗമമായ സ്പീഡ് തരുന്നു. ഇതിൽ TRIAC ആണ്.'),
 defn:L('<b>TRIAC:</b> like two SCRs in inverse parallel on one chip, with terminals MT1, MT2 and gate G. It conducts in both half cycles. In a <b>dimmer</b>, a pot and capacitor set the delay, and a DIAC fires the TRIAC at the chosen angle every half cycle.','<b>TRIAC:</b> एक चिप पर उलटे पैरेलल दो SCR जैसा, टर्मिनल MT1, MT2 और गेट G। दोनों हाफ साइकिल में चालू। <b>डिमर</b> में पॉट और कैपेसिटर देरी तय करते हैं, DIAC हर हाफ साइकिल में चुने एंगल पर TRIAC फायर करता है।','<b>TRIAC:</b> ഒരു ചിപ്പിൽ എതിർ പാരലലിലുള്ള രണ്ട് SCR പോലെ, ടെർമിനൽ MT1, MT2, ഗേറ്റ് G. രണ്ട് ഹാഫ് സൈക്കിളിലും കണ്ടക്ട്. <b>ഡിമ്മറിൽ</b> പോട്ടും കപ്പാസിറ്ററും വൈകൽ നിശ്ചയിക്കുന്നു, DIAC ഓരോ ഹാഫ് സൈക്കിളിലും തിരഞ്ഞെടുത്ത ആംഗിളിൽ TRIAC ഫയർ ചെയ്യുന്നു.'),
 play:L('Drag the pot. Watch both halves of the wave and the fan speed.','पॉट खिसकाओ। वेव के दोनों हाफ और फैन स्पीड देखो।','പോട്ട് നീക്കൂ. വേവിന്റെ രണ്ട് ഹാഫും ഫാൻ സ്പീഡും നോക്കൂ.'),
 pred:{q:L('The pot resistance is increased. C charges more slowly, so the firing angle …','पॉट रेसिस्टेंस बढ़ाया। C धीरे चार्ज, तो फायरिंग एंगल …','പോട്ട് റെസിസ്റ്റൻസ് കൂട്ടി. C പതുക്കെ ചാർജ്, അതിനാൽ ഫയറിംഗ് ആംഗിൾ …'),o:[L('increases, and the fan slows','बढ़ता, फैन धीमा','കൂടുന്നു, ഫാൻ പതുക്കെ'),L('decreases, and the fan speeds up','घटता, फैन तेज़','കുറയുന്നു, ഫാൻ വേഗത്തിൽ'),L('stays the same','वही','അതേ')],a:0,why:L('Bigger RC takes longer to reach the DIAC voltage, so the TRIAC fires later.','बड़ा RC, DIAC वोल्टेज तक देर से, TRIAC देर से फायर।','വലിയ RC, DIAC വോൾട്ടേജ് എത്താൻ വൈകും, TRIAC വൈകി ഫയർ.')},
 labels:['alpha','vbo'],hints:['tau','rms'],rel:{c:['R','C','α'],h:'α'},
 ex:L('Example: a ceiling-fan regulator is a TRIAC, a DIAC, a pot and a small capacitor, with an RC snubber across the TRIAC.','उदाहरण: सीलिंग-फैन रेगुलेटर में TRIAC, DIAC, पॉट और छोटा कैपेसिटर, TRIAC के आर-पार RC स्नबर।','ഉദാഹരണം: സീലിംഗ്-ഫാൻ റെഗുലേറ്ററിൽ TRIAC, DIAC, പോട്ട്, ചെറിയ കപ്പാസിറ്റർ, TRIAC-ന് കുറുകെ RC സ്നബർ.'),
 trick:L('SCR: one half. TRIAC: both halves.','SCR: एक हाफ। TRIAC: दोनों हाफ।','SCR: ഒരു ഹാഫ്. TRIAC: രണ്ട് ഹാഫും.'),
 check:{q:L('For full control of both AC halves you need …','AC के दोनों हाफ के पूरे कंट्रोल के लिए चाहिए …','AC-യുടെ രണ്ട് ഹാഫും നിയന്ത്രിക്കാൻ വേണ്ടത് …'),o:[L('one TRIAC or two SCRs back to back','एक TRIAC या उलटे जुड़े दो SCR','ഒരു TRIAC അല്ലെങ്കിൽ എതിരായി ചേർത്ത രണ്ട് SCR'),L('one SCR','एक SCR','ഒരു SCR'),L('one diode','एक डायोड','ഒരു ഡയോഡ്')],a:0},

   s+=TXC(162,64,'pot','var(--fg)','13')+TXC(168,144,'C','var(--fg)','13')+TXC(232,82,'DIAC','var(--fg)','12')+TXC(342,104,'TRIAC','var(--fg)','12')+TXC(90,46,'fan','var(--mut)','12');

const DTY=[.1,.25,.5,.75,.9];
CS({id:'b_igbt',menu:'IGBT',title:'t_igbt',
 flash:FB('MOSFET gate (slide 8); BJT (Module 12A, slide 19)','MOSFET गेट (स्लाइड 8); BJT (मॉड्यूल 12A, स्लाइड 19)','MOSFET ഗേറ്റ് (സ്ലൈഡ് 8); BJT (മൊഡ്യൂൾ 12A, സ്ലൈഡ് 19)'),
 hook:L('A VFD, a solar inverter and an induction cooktop all switch hundreds of volts with IGBTs.','VFD, सोलर इन्वर्टर और इंडक्शन कुकटॉप, सब IGBT से सैकड़ों वोल्ट स्विच करते हैं।','VFD, സോളാർ ഇൻവെർട്ടർ, ഇൻഡക്ഷൻ കുക്ക്ടോപ്പ്: എല്ലാം IGBT കൊണ്ട് നൂറുകണക്കിന് വോൾട്ട് സ്വിച്ച് ചെയ്യുന്നു.'),
 defn:L('<b>IGBT</b> (insulated-gate bipolar transistor): an insulated gate like a MOSFET (easy voltage drive) with a BJT-like output (low drop at high current). Terminals: gate (G), collector (C), emitter (E). Driven ON and OFF fast with <b>PWM</b>.','<b>IGBT</b> (इंसुलेटेड-गेट बाइपोलर ट्रांज़िस्टर): MOSFET जैसा इंसुलेटेड गेट (आसान वोल्टेज ड्राइव) और BJT जैसा आउटपुट (ज़्यादा करंट पर कम ड्रॉप)। टर्मिनल: गेट (G), कलेक्टर (C), एमिटर (E)। <b>PWM</b> से तेज़ ON-OFF।','<b>IGBT</b> (ഇൻസുലേറ്റഡ്-ഗേറ്റ് ബൈപോളാർ ട്രാൻസിസ്റ്റർ): MOSFET പോലെ ഇൻസുലേറ്റഡ് ഗേറ്റ് (എളുപ്പമുള്ള വോൾട്ടേജ് ഡ്രൈവ്), BJT പോലെ ഔട്ട്പുട്ട് (കൂടിയ കറന്റിൽ കുറഞ്ഞ ഡ്രോപ്പ്). ടെർമിനൽ: ഗേറ്റ് (G), കളക്ടർ (C), എമിറ്റർ (E). <b>PWM</b> വഴി വേഗത്തിൽ ON-OFF.'),
 play:L('Drag the duty cycle. Watch the gate pulses, the average voltage and the motor.','ड्यूटी साइकिल खिसकाओ। गेट पल्स, औसत वोल्टेज और मोटर देखो।','ഡ്യൂട്ടി സൈക്കിൾ നീക്കൂ. ഗേറ്റ് പൾസ്, ആവറേജ് വോൾട്ടേജ്, മോട്ടോർ നോക്കൂ.'),
 pred:{q:L('An IGBT is turned on by …','IGBT किससे ON होता है?','IGBT ON ആകുന്നത് …'),o:[L('a gate voltage, like a MOSFET','MOSFET जैसा गेट वोल्टेज','MOSFET പോലെ ഗേറ്റ് വോൾട്ടേജ്'),L('a large base current','बड़ा बेस करंट','വലിയ ബേസ് കറന്റ്'),L('a light beam','रोशनी','വെളിച്ചം')],a:0,why:L('Its gate is insulated, so it needs voltage, almost no current.','इसका गेट इंसुलेटेड, वोल्टेज चाहिए, करंट लगभग नहीं।','ഇതിന്റെ ഗേറ്റ് ഇൻസുലേറ്റഡ്, വോൾട്ടേജ് വേണം, ഏതാണ്ട് കറന്റ് ഇല്ല.')},
 labels:['duty','gate'],hints:['sw','vir'],rel:{c:['D','VDC','Vavg'],h:'Vavg'},
 fm:['<i>V</i><sub>avg</sub> = <i>D</i> × <i>V</i><sub>DC</sub>'],
 uses:L('D = duty cycle = ON time ÷ period (0 to 1). Ideal switch, steady load current.','D = ड्यूटी साइकिल = ON समय ÷ पीरियड (0 से 1)। आइडियल स्विच, स्थिर लोड करंट।','D = ഡ്യൂട്ടി സൈക്കിൾ = ON സമയം ÷ പീരിയഡ് (0 മുതൽ 1). ഐഡിയൽ സ്വിച്ച്, സ്ഥിരമായ ലോഡ് കറന്റ്.'),
 ex:L('Example: 600 V DC bus, duty 0.4: average output 240 V.','उदाहरण: 600 V DC बस, ड्यूटी 0.4: औसत आउटपुट 240 V।','ഉദാഹരണം: 600 V DC ബസ്, ഡ്യൂട്ടി 0.4: ആവറേജ് ഔട്ട്പുട്ട് 240 V.'),
 trick:L('MOSFET gate, BJT muscle.','MOSFET का गेट, BJT की ताकत।','MOSFET-ന്റെ ഗേറ്റ്, BJT-യുടെ കരുത്ത്.'),
 check:{q:L('DC bus 540 V, duty 0.25. The average voltage is …','DC बस 540 V, ड्यूटी 0.25। औसत वोल्टेज …','DC ബസ് 540 V, ഡ്യൂട്ടി 0.25. ആവറേജ് വോൾട്ടേജ് …'),o:['135 V','405 V','25 V'],a:0},
 build(w,api){
  w.innerHTML=S(400,200,`<g id="a"></g>`,'IGBT with PWM gate pulses driving a motor');
  const rd=mkRd(w),c=mkCtl(w);let di=2;
  slider(c,'D',0,4,1,2,x=>DTY[x],x=>{di=x;api.redraw()});
  return t=>{const D=DTY[di],ph=(t*.3)%1;
   let s=symIGBT(140,80)+TXC(166,40,'C','var(--fg)','13')+TXC(166,124,'E','var(--fg)','13')+TXC(96,76,'G','var(--fg)','13')+wr('M152 40V20H260V40M152 120V140H260V120');
   s+=`<circle cx="260" cy="80" r="34" fill="#9aa5b1" stroke="#4a5560" stroke-width="2"/>`+TXC(260,86,'M','#222','20')+`<g transform="translate(260 80) rotate(${(t*500*D)%360})"><path d="M0 -26V-34" stroke="#222" stroke-width="5"/></g>`+TXC(330,24,'600 V DC','var(--fg)','13');
   let d='';for(let k=0;k<=200;k++){const u=k/200,p=((u*5)+ph)%1,v=p<D?1:0;d+=(k?'L':'M')+(20+370*u).toFixed(1)+' '+(190-24*v).toFixed(1)}
   s+=`<path d="${d}" stroke="var(--frm)" stroke-width="2.5" fill="none"/><path d="M20 ${(190-24*D).toFixed(1)}H390" stroke="var(--ok)" stroke-width="2" stroke-dasharray="6 4"/>`+TL(60,160,['gate pulses','गेट पल्स','ഗേറ്റ് പൾസ്'],'var(--frm)')+TL(330,160,['average','औसत','ആവറേജ്'],'var(--ok)');
   put($('#a',w),s);
   setRd(rd,`<span>Vavg = ${D} × 600 = <b>${Math.round(D*600)} V</b></span>`)}}});

/* ---------- 15 Device selection ---------- */
const SEL=[{n:['Fan regulator (230 V AC)','फैन रेगुलेटर (230 V AC)','ഫാൻ റെഗുലേറ്റർ (230 V AC)'],d:'TRIAC',w:['Controls both AC halves; simple DIAC trigger.','दोनों AC हाफ कंट्रोल; सिंपल DIAC ट्रिगर।','രണ്ട് AC ഹാഫും നിയന്ത്രിക്കുന്നു; ലളിതമായ DIAC ട്രിഗർ.']},
 {n:['Battery charger (controlled DC)','बैटरी चार्जर (कंट्रोल्ड DC)','ബാറ്ററി ചാർജർ (കൺട്രോൾഡ് DC)'],d:'SCR',w:['Rectifies and controls at the same time.','एक साथ रेक्टिफाई और कंट्रोल।','ഒരേ സമയം റെക്ടിഫൈ ചെയ്ത് നിയന്ത്രിക്കുന്നു.']},
 {n:['5 kW inverter / VFD, 10 kHz','5 kW इन्वर्टर / VFD, 10 kHz','5 kW ഇൻവെർട്ടർ / VFD, 10 kHz'],d:'IGBT',w:['High voltage and current with easy gate drive.','ज़्यादा वोल्टेज-करंट, आसान गेट ड्राइव।','കൂടിയ വോൾട്ടേജും കറന്റും, എളുപ്പമുള്ള ഗേറ്റ് ഡ്രൈവ്.']},
 {n:['SMPS charger, 100 kHz','SMPS चार्जर, 100 kHz','SMPS ചാർജർ, 100 kHz'],d:'MOSFET',w:['Fastest switching, low loss at low voltage.','सबसे तेज़ स्विचिंग, कम वोल्टेज पर कम लॉस।','ഏറ്റവും വേഗമുള്ള സ്വിച്ചിംഗ്, കുറഞ്ഞ വോൾട്ടേജിൽ കുറഞ്ഞ നഷ്ടം.']},
 {n:['12 V relay driver','12 V रिले ड्राइवर','12 V റിലേ ഡ്രൈവർ'],d:'BJT',w:['Small current; a cheap transistor is enough.','छोटा करंट; सस्ता ट्रांज़िस्टर काफ़ी।','ചെറിയ കറന്റ്; വിലകുറഞ്ഞ ട്രാൻസിസ്റ്റർ മതി.']}];
CS({id:'b_sel',menu:'Choosing a power device',title:'t_sel',syl:'Additional',
 flash:FB('SCR, TRIAC, MOSFET, IGBT (slides 8–14); BJT switch (Module 12A, slide 22)','SCR, TRIAC, MOSFET, IGBT (स्लाइड 8–14); BJT स्विच (मॉड्यूल 12A, स्लाइड 22)','SCR, TRIAC, MOSFET, IGBT (സ്ലൈഡ് 8–14); BJT സ്വിച്ച് (മൊഡ്യൂൾ 12A, സ്ലൈഡ് 22)'),
 hook:L('A repair job needs a replacement part. Which family should it be?','रिपेयर में बदलने को पार्ट चाहिए। किस फैमिली का हो?','റിപ്പയറിന് മാറ്റാൻ ഭാഗം വേണം. ഏത് ഫാമിലി ആകണം?'),
 defn:L('<b>Choosing:</b> AC phase control → TRIAC (or SCRs). Controlled DC from AC → SCR. High-power fast switching → IGBT. Very fast, lower voltage → MOSFET. Small loads → BJT.','<b>चुनाव:</b> AC फेज़ कंट्रोल → TRIAC (या SCR)। AC से कंट्रोल्ड DC → SCR। हाई-पावर तेज़ स्विचिंग → IGBT। बहुत तेज़, कम वोल्टेज → MOSFET। छोटे लोड → BJT।','<b>തിരഞ്ഞെടുക്കൽ:</b> AC ഫേസ് കൺട്രോൾ → TRIAC (അല്ലെങ്കിൽ SCR). AC-യിൽ നിന്ന് കൺട്രോൾഡ് DC → SCR. ഹൈ-പവർ വേഗത്തിലുള്ള സ്വിച്ചിംഗ് → IGBT. വളരെ വേഗം, കുറഞ്ഞ വോൾട്ടേജ് → MOSFET. ചെറിയ ലോഡ് → BJT.'),
 play:L('Tap each job. The right device lights up.','हर काम दबाओ। सही डिवाइस जलता है।','ഓരോ ജോലിയും ടാപ്പ് ചെയ്യൂ. ശരിയായ ഡിവൈസ് തെളിയുന്നു.'),
 pred:{q:L('An SMPS switches at 100 kHz from a 48 V bus. The best device is …','SMPS 48 V बस से 100 kHz पर स्विच करता है। सबसे अच्छा डिवाइस …','SMPS 48 V ബസിൽ നിന്ന് 100 kHz-ൽ സ്വിച്ച് ചെയ്യുന്നു. ഏറ്റവും നല്ല ഡിവൈസ് …'),o:['MOSFET','SCR','TRIAC'],a:0,why:L('MOSFETs switch fastest. SCRs and TRIACs cannot be turned off quickly by the gate.','MOSFET सबसे तेज़ स्विच। SCR और TRIAC गेट से जल्दी बंद नहीं होते।','MOSFET ഏറ്റവും വേഗത്തിൽ സ്വിച്ച് ചെയ്യുന്നു. SCR, TRIAC ഗേറ്റ് കൊണ്ട് വേഗം ഓഫ് ആക്കാനാവില്ല.')},
 labels:['gate'],hints:['sw'],rel:{c:['V','I','f'],h:'f'},
 ex:L('Example: a 3-phase VFD for a 7.5 kW motor uses a six-IGBT module.','उदाहरण: 7.5 kW मोटर के 3-फेज़ VFD में छह-IGBT मॉड्यूल।','ഉദാഹരണം: 7.5 kW മോട്ടോറിന്റെ 3-ഫേസ് VFD-യിൽ ആറ്-IGBT മൊഡ്യൂൾ.'),
 trick:L('AC knob: TRIAC. DC charger: SCR. Big and fast: IGBT. Tiny and fastest: MOSFET.','AC नॉब: TRIAC। DC चार्जर: SCR। बड़ा और तेज़: IGBT। छोटा और सबसे तेज़: MOSFET।','AC നോബ്: TRIAC. DC ചാർജർ: SCR. വലുതും വേഗവും: IGBT. ചെറുതും ഏറ്റവും വേഗവും: MOSFET.'),
 check:{q:L('A soft starter for a 3-phase motor (Module 5C) controls AC in each line. It mainly uses …','3-फेज़ मोटर (मॉड्यूल 5C) का सॉफ्ट स्टार्टर हर लाइन में AC कंट्रोल करता है। मुख्य रूप से …','3-ഫേസ് മോട്ടോറിന്റെ (മൊഡ്യൂൾ 5C) സോഫ്റ്റ് സ്റ്റാർട്ടർ ഓരോ ലൈനിലും AC നിയന്ത്രിക്കുന്നു. പ്രധാനമായും …'),o:[L('back-to-back SCRs','उलटे जुड़े SCR','എതിരായി ചേർത്ത SCR'),L('LEDs','LED','LED'),L('Zener diodes','ज़ेनर डायोड','സെനർ ഡയോഡ്')],a:0},
 build(w,api){
  w.innerHTML=S(400,190,`<g id="a"></g>`,'Applications matched to power devices');
  const rd=mkRd(w),c=mkCtl(w);let m=0;
  modeBtns(c,SEL.map(x=>L(x.n[0],x.n[1],x.n[2])),i=>{m=i;api.redraw()});
  const DEV=['TRIAC','SCR','IGBT','MOSFET','BJT'];
  return t=>{const g=SEL[m];let s='';
   DEV.forEach((d,i)=>{const x=14+i*77,on=d===g.d;s+=`<rect x="${x}" y="40" width="70" height="60" rx="10" fill="${on?'rgba(31,160,90,.25)':'var(--card)'}" stroke="${on?'var(--ok)':'var(--wire)'}" stroke-width="${on?4:2}"/>`+TXC(x+35,76,d,on?'var(--ok)':'var(--fg)','15')});
   const ix=14+DEV.indexOf(g.d)*77+35;s+=arr(200,150,ix,108+4*Math.sin(t*4),'var(--ok)',3)+TL(200,172,g.n,'var(--fg)');
   put($('#a',w),s);
   setRd(rd,`<span><b>${g.d}</b>: ${B3(g.w)}</span>`)}}});

/* ---------- 16 Op-amp 741 ---------- */
const PIN741=[['Offset null','ऑफसेट नल','ഓഫ്സെറ്റ് നൾ'],['Inverting input (−)','इनवर्टिंग इनपुट (−)','ഇൻവെർട്ടിംഗ് ഇൻപുട്ട് (−)'],['Non-inverting input (+)','नॉन-इनवर्टिंग इनपुट (+)','നോൺ-ഇൻവെർട്ടിംഗ് ഇൻപുട്ട് (+)'],['−VCC (negative supply)','−VCC (नेगेटिव सप्लाई)','−VCC (നെഗറ്റീവ് സപ്ലൈ)'],['Offset null','ऑफसेट नल','ഓഫ്സെറ്റ് നൾ'],['Output','आउटपुट','ഔട്ട്പുട്ട്'],['+VCC (positive supply)','+VCC (पॉज़िटिव सप्लाई)','+VCC (പോസിറ്റീവ് സപ്ലൈ)'],['No connection','कोई कनेक्शन नहीं','കണക്ഷൻ ഇല്ല']];
CS({id:'b_741',menu:'Op-amp IC 741',title:'t_741',
 flash:FB('Amplifier gain Av (Module 12A, slide 23)','एम्प्लिफायर गेन Av (मॉड्यूल 12A, स्लाइड 23)','ആംപ്ലിഫയർ ഗെയിൻ Av (മൊഡ്യൂൾ 12A, സ്ലൈഡ് 23)'),
 hook:L('One small 8-pin chip can amplify, compare and add signals. The 741 is the classic op-amp in every lab.','एक छोटी 8-पिन चिप बढ़ाती, तुलना करती और जोड़ती है। 741 हर लैब का क्लासिक ऑप-एम्प।','ഒരു ചെറിയ 8-പിൻ ചിപ്പ് കൂട്ടുന്നു, താരതമ്യം ചെയ്യുന്നു, കൂട്ടിച്ചേർക്കുന്നു. 741 എല്ലാ ലാബിലെയും ക്ലാസിക് ഓപ്-ആംപ്.'),
 defn:L('<b>Op-amp</b> (operational amplifier): a very high-gain DC amplifier with two inputs (− and +) and one output. Ideal: infinite gain, infinite input resistance, zero output resistance. 741 typical: gain 200 000, Rin 2 MΩ, Rout 75 Ω, supply ±15 V.','<b>ऑप-एम्प</b> (ऑपरेशनल एम्प्लिफायर): बहुत ज़्यादा गेन वाला DC एम्प्लिफायर, दो इनपुट (− और +), एक आउटपुट। आइडियल: अनंत गेन, अनंत इनपुट रेसिस्टेंस, ज़ीरो आउटपुट रेसिस्टेंस। 741 आम: गेन 200 000, Rin 2 MΩ, Rout 75 Ω, सप्लाई ±15 V।','<b>ഓപ്-ആംപ്</b> (ഓപ്പറേഷണൽ ആംപ്ലിഫയർ): വളരെ കൂടിയ ഗെയിനുള്ള DC ആംപ്ലിഫയർ, രണ്ട് ഇൻപുട്ട് (−, +), ഒരു ഔട്ട്പുട്ട്. ഐഡിയൽ: അനന്ത ഗെയിൻ, അനന്ത ഇൻപുട്ട് റെസിസ്റ്റൻസ്, പൂജ്യം ഔട്ട്പുട്ട് റെസിസ്റ്റൻസ്. 741 സാധാരണ: ഗെയിൻ 200 000, Rin 2 MΩ, Rout 75 Ω, സപ്ലൈ ±15 V.'),
 play:L('Tap each pin number. Read its job.','हर पिन नंबर दबाओ। उसका काम पढ़ो।','ഓരോ പിൻ നമ്പറും ടാപ്പ് ചെയ്യൂ. അതിന്റെ ജോലി വായിക്കൂ.'),
 pred:{q:L('Pin 6 of the IC 741 is the …','IC 741 का पिन 6 …','IC 741-ന്റെ പിൻ 6 …'),o:[L('output','आउटपुट','ഔട്ട്പുട്ട്'),L('+ supply','+ सप्लाई','+ സപ്ലൈ'),L('inverting input','इनवर्टिंग इनपुट','ഇൻവെർട്ടിംഗ് ഇൻപുട്ട്')],a:0,why:L('2 and 3 are inputs, 4 and 7 are supplies, 6 is the output.','2 और 3 इनपुट, 4 और 7 सप्लाई, 6 आउटपुट।','2, 3 ഇൻപുട്ട്, 4, 7 സപ്ലൈ, 6 ഔട്ട്പുട്ട്.')},
 labels:['opamp'],hints:['av'],rel:{c:['V+','V−','A','Vout'],h:'Vout'},
 fm:['<i>V</i><sub>out</sub> = <i>A</i> (<i>V</i><sub>+</sub> − <i>V</i><sub>−</sub>)'],
 uses:L('Open loop, inside the supply limits. A is the open-loop gain. On ±15 V, a 741 output cannot go beyond about ±13 V (saturation).','ओपन लूप, सप्लाई सीमा में। A ओपन-लूप गेन। ±15 V पर 741 का आउटपुट करीब ±13 V से आगे नहीं (सैचुरेशन)।','ഓപ്പൺ ലൂപ്പ്, സപ്ലൈ പരിധിക്കുള്ളിൽ. A ഓപ്പൺ-ലൂപ്പ് ഗെയിൻ. ±15 V-ൽ 741 ഔട്ട്പുട്ട് ഏകദേശം ±13 V കടക്കില്ല (സാച്ചുറേഷൻ).'),
 ex:L('Example: a difference of only 50 µV × 200 000 = 10 V at the output.','उदाहरण: सिर्फ़ 50 µV का अंतर × 200 000 = आउटपुट पर 10 V।','ഉദാഹരണം: 50 µV വ്യത്യാസം മാത്രം × 200 000 = ഔട്ട്പുട്ടിൽ 10 V.'),
 trick:L('2 minus, 3 plus, 4 minus supply, 6 out, 7 plus supply.','2 माइनस, 3 प्लस, 4 माइनस सप्लाई, 6 आउट, 7 प्लस सप्लाई।','2 മൈനസ്, 3 പ്ലസ്, 4 മൈനസ് സപ്ലൈ, 6 ഔട്ട്, 7 പ്ലസ് സപ്ലൈ.'),
 check:{q:L('Open-loop gain 200 000 and an input difference of 0.1 mV give an ideal 20 V. On ±15 V supply the output is about …','ओपन-लूप गेन 200 000, इनपुट अंतर 0.1 mV से आइडियल 20 V। ±15 V सप्लाई पर आउटपुट करीब …','ഓപ്പൺ-ലൂപ്പ് ഗെയിൻ 200 000, ഇൻപുട്ട് വ്യത്യാസം 0.1 mV: ഐഡിയൽ 20 V. ±15 V സപ്ലൈയിൽ ഔട്ട്പുട്ട് ഏകദേശം …'),o:['+13 V','+20 V','0 V'],a:0},
 build(w,api){
  w.innerHTML=S(400,200,`<g id="a"></g>`,'IC 741 eight-pin package with pin functions');
  const rd=mkRd(w),c=mkCtl(w);let p=5;
  const pb=[1,2,3,4,5,6,7,8].map(n=>button(c,L('Pin '+n,'पिन '+n,'പിൻ '+n),()=>{p=n-1;pb.forEach((b,j)=>b.classList.toggle('on',j===p));api.redraw()},n===6?'on':''));
  return t=>{let s=`<rect x="80" y="40" width="120" height="130" rx="6" fill="#222"/><path d="M128 40a12 12 0 0 0 24 0" fill="#555"/><circle cx="96" cy="58" r="4" fill="#666"/>`+TXC(140,110,'741','#ddd','16');
   for(let i=0;i<4;i++){const y=60+i*30;s+=`<rect x="60" y="${y-5}" width="20" height="10" fill="${p===i?'var(--frm)':'#bbb'}"/>`+TXC(48,y+5,(i+1)+'','var(--fg)','14');const j=7-i;s+=`<rect x="200" y="${y-5}" width="20" height="10" fill="${p===j?'var(--frm)':'#bbb'}"/>`+TXC(232,y+5,(j+1)+'','var(--fg)','14')}
   s+=opAmp(280,100)+wr('M260 84H280M260 124H280M350 100H380M315 64V44M315 136V156')+TXC(252,88,'2','var(--fg)','13')+TXC(252,128,'3','var(--fg)','13')+TXC(366,92,'6','var(--fg)','13')+TXC(326,40,'7','var(--fg)','13')+TXC(326,170,'4','var(--fg)','13');
   const hl={1:[260,84],2:[260,124],3:[315,156],5:[380,100],6:[315,44]}[p];if(hl)s+=ring(hl[0],hl[1],12,'var(--frm)');
   put($('#a',w),s);
   setRd(rd,`<span>${RD('Pin','पिन','പിൻ')} ${p+1}: <b>${B3(PIN741[p])}</b></span>`)}}});

/* ---------- 17 Inverting ---------- */
const RFS=[10,22,47,100];
CS({id:'b_inv',menu:'Inverting amplifier',title:'t_inv',
 flash:FB('Op-amp pins (slide 16); 180° phase (Module 0, slide 33)','ऑप-एम्प पिन (स्लाइड 16); 180° फेज़ (मॉड्यूल 0, स्लाइड 33)','ഓപ്-ആംപ് പിൻ (സ്ലൈഡ് 16); 180° ഫേസ് (മൊഡ്യൂൾ 0, സ്ലൈഡ് 33)'),
 hook:L('A sensor gives 0.5 V but the meter needs 5 V. Two resistors and an op-amp set the gain exactly.','सेंसर 0.5 V देता, मीटर को 5 V चाहिए। दो रेसिस्टर और ऑप-एम्प गेन ठीक तय करते हैं।','സെൻസർ 0.5 V തരുന്നു, മീറ്ററിന് 5 V വേണം. രണ്ട് റെസിസ്റ്ററും ഓപ്-ആംപും ഗെയിൻ കൃത്യമായി നിശ്ചയിക്കുന്നു.'),
 defn:L('<b>Inverting amplifier:</b> input through Rin to the − input; <b>feedback resistor</b> Rf from output to − input; + input to ground. Negative feedback holds the − input at 0 V (<b>virtual ground</b>), so the gain depends only on the two resistors.','<b>इनवर्टिंग एम्प्लिफायर:</b> इनपुट Rin से − इनपुट पर; <b>फीडबैक रेसिस्टर</b> Rf आउटपुट से − इनपुट पर; + इनपुट ग्राउंड। नेगेटिव फीडबैक − इनपुट को 0 V (<b>वर्चुअल ग्राउंड</b>) पर रखता है, तो गेन सिर्फ़ दो रेसिस्टर पर।','<b>ഇൻവെർട്ടിംഗ് ആംപ്ലിഫയർ:</b> ഇൻപുട്ട് Rin വഴി − ഇൻപുട്ടിലേക്ക്; <b>ഫീഡ്ബാക്ക് റെസിസ്റ്റർ</b> Rf ഔട്ട്പുട്ടിൽ നിന്ന് − ഇൻപുട്ടിലേക്ക്; + ഇൻപുട്ട് ഗ്രൗണ്ട്. നെഗറ്റീവ് ഫീഡ്ബാക്ക് − ഇൻപുട്ട് 0 V-ൽ (<b>വെർച്വൽ ഗ്രൗണ്ട്</b>) നിർത്തുന്നു, ഗെയിൻ രണ്ട് റെസിസ്റ്ററിനെ മാത്രം ആശ്രയിക്കുന്നു.'),
 play:L('Drag Rf. Watch the output grow, flip and clip at ±13 V.','Rf खिसकाओ। आउटपुट बढ़ता, उल्टा होता और ±13 V पर कटता देखो।','Rf നീക്കൂ. ഔട്ട്പുട്ട് വലുതാകുന്നതും തിരിയുന്നതും ±13 V-ൽ മുറിയുന്നതും നോക്കൂ.'),
 pred:{q:L('Rf is made twice as big (Rin the same). The gain …','Rf दोगुना (Rin वही)। गेन …','Rf ഇരട്ടിയാക്കി (Rin അതേ). ഗെയിൻ …'),o:[L('doubles','दोगुना','ഇരട്ടി'),L('halves','आधा','പകുതി'),L('stays','वही','അതേ')],a:0,why:L('Gain = −Rf ÷ Rin. Double Rf, double the gain.','गेन = −Rf ÷ Rin। Rf दोगुना, गेन दोगुना।','ഗെയിൻ = −Rf ÷ Rin. Rf ഇരട്ടി, ഗെയിൻ ഇരട്ടി.')},
 labels:['fbr','vgnd'],hints:['av','ph'],rel:{c:['Rf','Rin','Av'],h:'Av'},
 fm:['<i>A</i><sub>v</sub> = − <i>R</i><sub>f</sub> ÷ <i>R</i><sub>in</sub>'],
 uses:L('Ideal op-amp with negative feedback, output inside ±13 V on a ±15 V supply. The minus sign means 180° inversion.','नेगेटिव फीडबैक वाला आइडियल ऑप-एम्प, ±15 V सप्लाई पर आउटपुट ±13 V के अंदर। माइनस = 180° उल्टा।','നെഗറ്റീവ് ഫീഡ്ബാക്കുള്ള ഐഡിയൽ ഓപ്-ആംപ്, ±15 V സപ്ലൈയിൽ ഔട്ട്പുട്ട് ±13 V-ന് ഉള്ളിൽ. മൈനസ് = 180° തിരിവ്.'),
 ex:L('Example: Rin = 4.7 kΩ, Rf = 47 kΩ: Av = −10.','उदाहरण: Rin = 4.7 kΩ, Rf = 47 kΩ: Av = −10।','ഉദാഹരണം: Rin = 4.7 kΩ, Rf = 47 kΩ: Av = −10.'),
 trick:L('Inverting: minus Rf over Rin.','इनवर्टिंग: माइनस Rf बटा Rin।','ഇൻവെർട്ടിംഗ്: മൈനസ് Rf ÷ Rin.'),
 check:{q:L('Rin = 10 kΩ, Rf = 33 kΩ, Vin = +0.3 V DC. Vout = …','Rin = 10 kΩ, Rf = 33 kΩ, Vin = +0.3 V DC। Vout = …','Rin = 10 kΩ, Rf = 33 kΩ, Vin = +0.3 V DC. Vout = …'),o:['−0.99 V','+0.99 V','−3.3 V'],a:0},
 build(w,api){
  w.innerHTML=S(400,200,`<g id="a"></g>`,'Inverting op-amp circuit with input and output waves');
  const rd=mkRd(w),c=mkCtl(w);let ri=1;
  slider(c,'R<sub>f</sub>',0,3,1,1,x=>RFS[x]+' kΩ',x=>{ri=x;api.redraw()});
  return t=>{const Av=RFS[ri]/10,vin=.5,ph=(t*.4)%1;
   let s=opAmp(170,90)+wr('M60 74H90M130 74H170M150 74V30H210M250 30H270V90M240 90H290M170 114H156V130')+symRes(110,74,0)+symRes(230,30,0)+`<path d="M146 130h20M150 135h12M154 140h4" stroke="var(--wire)" stroke-width="2.5"/>`+`<circle cx="150" cy="74" r="4" fill="var(--wire)"/><circle cx="270" cy="90" r="4" fill="var(--wire)"/>`;
   s+=TXC(110,60,'Rin 10 kΩ','var(--fg)','13')+TXC(230,16,'Rf '+RFS[ri]+' kΩ','var(--fg)','13')+TXC(150,96,'0 V','var(--ok)','12');
   s+=`<path d="${wpath(10,170,150,12,u=>Math.sin(TPI*(2*u-ph)))}" stroke="var(--def)" stroke-width="2.5" fill="none"/>`+TXC(85,196,'0.5 V','var(--def)','13');
   const sc=3;s+=`<path d="${wpath(220,150,170,1,u=>Math.max(-13,Math.min(13,-Av*vin*Math.sin(TPI*(2*u-ph))))*sc)}" stroke="var(--frm)" stroke-width="2.5" fill="none"/><path d="M220 ${150-39}H390M220 ${150+39}H390" stroke="var(--no)" stroke-width="1" stroke-dasharray="4 4"/>`+TXC(372,107,'+13 V','var(--no)','11');
   put($('#a',w),s);
   const vo=Av*vin;setRd(rd,`<span>Av = −${RFS[ri]} ÷ 10 = <b>−${fm1(Av)}</b> · ${RD('Output peak','आउटपुट पीक','ഔട്ട്പുട്ട് പീക്ക്')} = <b>${fm1(Math.min(13,vo))} V</b>${vo>13?' ('+RD('clipped','कटा','മുറിഞ്ഞു')+')':''}</span>`)}}});

/* ---------- 18 Non-inverting ---------- */
CS({id:'b_ninv',menu:'Non-inverting amplifier and follower',title:'t_ninv',
 flash:FB('Inverting amplifier (slide 17); CC emitter follower (Module 12A, slide 21)','इनवर्टिंग एम्प्लिफायर (स्लाइड 17); CC एमिटर फॉलोअर (मॉड्यूल 12A, स्लाइड 21)','ഇൻവെർട്ടിംഗ് ആംപ്ലിഫയർ (സ്ലൈഡ് 17); CC എമിറ്റർ ഫോളോവർ (മൊഡ്യൂൾ 12A, സ്ലൈഡ് 21)'),
 hook:L('Sometimes the output must stay the same way up as the input, and the source must not be loaded at all.','कभी आउटपुट इनपुट जैसा सीधा चाहिए, और सोर्स पर ज़रा भी लोड नहीं।','ചിലപ്പോൾ ഔട്ട്പുട്ട് ഇൻപുട്ട് പോലെ അതേ ദിശയിൽ വേണം, സോഴ്സ് ഒട്ടും ലോഡ് ആകരുത്.'),
 defn:L('<b>Non-inverting amplifier:</b> input to the + input; Rf and Rin form a divider from output to the − input. Output is in phase. <b>Voltage follower:</b> output tied straight to the − input: gain exactly 1, very high input resistance. Used as a buffer.','<b>नॉन-इनवर्टिंग एम्प्लिफायर:</b> इनपुट + इनपुट पर; Rf और Rin आउटपुट से − इनपुट तक डिवाइडर। आउटपुट इन-फेज़। <b>वोल्टेज फॉलोअर:</b> आउटपुट सीधे − इनपुट से: गेन ठीक 1, बहुत ज़्यादा इनपुट रेसिस्टेंस। बफर की तरह।','<b>നോൺ-ഇൻവെർട്ടിംഗ് ആംപ്ലിഫയർ:</b> ഇൻപുട്ട് + ഇൻപുട്ടിലേക്ക്; Rf, Rin ഔട്ട്പുട്ടിൽ നിന്ന് − ഇൻപുട്ടിലേക്ക് ഡിവൈഡർ. ഔട്ട്പുട്ട് ഇൻ-ഫേസ്. <b>വോൾട്ടേജ് ഫോളോവർ:</b> ഔട്ട്പുട്ട് നേരിട്ട് − ഇൻപുട്ടിലേക്ക്: ഗെയിൻ കൃത്യം 1, വളരെ കൂടിയ ഇൻപുട്ട് റെസിസ്റ്റൻസ്. ബഫർ ആയി.'),
 play:L('Tap Non-inverting or Follower. Drag Rf. Compare phase and size.','Non-inverting या Follower दबाओ। Rf खिसकाओ। फेज़ और साइज़ मिलाओ।','Non-inverting അല്ലെങ്കിൽ Follower ടാപ്പ് ചെയ്യൂ. Rf നീക്കൂ. ഫേസും വലുപ്പവും താരതമ്യം ചെയ്യൂ.'),
 pred:{q:L('In a non-inverting amplifier the output, compared with the input, is …','नॉन-इनवर्टिंग एम्प्लिफायर में आउटपुट इनपुट की तुलना में …','നോൺ-ഇൻവെർട്ടിംഗ് ആംപ്ലിഫയറിൽ ഔട്ട്പുട്ട് ഇൻപുട്ടുമായി നോക്കുമ്പോൾ …'),o:[L('in phase','इन-फेज़','ഇൻ-ഫേസ്'),L('inverted','उल्टा','തലകീഴ്'),L('90° late','90° पीछे','90° വൈകി')],a:0,why:L('The signal enters at the + input, so there is no inversion.','सिग्नल + इनपुट पर, तो उल्टा नहीं।','സിഗ്നൽ + ഇൻപുട്ടിൽ, അതിനാൽ തിരിവ് ഇല്ല.')},
 labels:['fbr'],hints:['av'],rel:{c:['Rf','Rin','Av'],h:'Av'},
 fm:['<i>A</i><sub>v</sub> = 1 + <i>R</i><sub>f</sub> ÷ <i>R</i><sub>in</sub>'],
 uses:L('Ideal op-amp, negative feedback. Follower: Rf = 0 (or Rin open), so Av = 1.','आइडियल ऑप-एम्प, नेगेटिव फीडबैक। फॉलोअर: Rf = 0 (या Rin खुला), तो Av = 1।','ഐഡിയൽ ഓപ്-ആംപ്, നെഗറ്റീവ് ഫീഡ്ബാക്ക്. ഫോളോവർ: Rf = 0 (അല്ലെങ്കിൽ Rin തുറന്നത്), Av = 1.'),
 ex:L('Example: Rf = 90 kΩ, Rin = 10 kΩ: Av = 1 + 9 = 10.','उदाहरण: Rf = 90 kΩ, Rin = 10 kΩ: Av = 1 + 9 = 10।','ഉദാഹരണം: Rf = 90 kΩ, Rin = 10 kΩ: Av = 1 + 9 = 10.'),
 trick:L('Non-inverting: one plus Rf over Rin. Never less than 1.','नॉन-इनवर्टिंग: एक प्लस Rf बटा Rin। कभी 1 से कम नहीं।','നോൺ-ഇൻവെർട്ടിംഗ്: ഒന്ന് പ്ലസ് Rf ÷ Rin. ഒരിക്കലും 1-ൽ കുറയില്ല.'),
 check:{q:L('A voltage follower has Rf = 0. Its gain is …','वोल्टेज फॉलोअर में Rf = 0। गेन …','വോൾട്ടേജ് ഫോളോവറിൽ Rf = 0. ഗെയിൻ …'),o:['1','0','∞'],a:0},
 build(w,api){

  slider(c,'R<sub>f</sub>',0,3,1,1,x=>RFS[x]+' kΩ',x=>{ri=x;api.redraw()});

   let s=opAmp(170,90)+wr('M60 114H170M240 90H290M270 90V30H220')+`<circle cx="270" cy="90" r="4" fill="var(--wire)"/>`;
